# Tự đẩy mã Thiên Cơ Các lên Google Apps Script mỗi khi nhánh dự án có thay đổi trong tuvi-app (file .gs/.html).
# Cần 2 secret (Settings › Secrets and variables › Actions): CLASPRC_JSON, SCRIPT_ID; tùy chọn DEPLOYMENT_ID.
# Hướng dẫn cài từng bước: tuvi-app/HUONG-DAN-CLASP.md
name: Đẩy lên Apps Script
on:
  push:
    branches: [claude/happy-brown-lttkz3]
    paths: ['tuvi-app/*.gs', 'tuvi-app/*.html', 'tuvi-app/appsscript.json']
  workflow_dispatch: {}
concurrency:
  group: day-len-apps-script
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  day-len:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kiểm tra trước khi đẩy (đủ file, đủ hàm, mã giao diện khớp)
        working-directory: tuvi-app
        run: node tests/cai-dat.js
      - name: Kiểm tra secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$SCRIPT_ID" ]; then
            echo "::error::Chưa cài secret CLASPRC_JSON hoặc SCRIPT_ID – xem tuvi-app/HUONG-DAN-CLASP.md"; exit 1
          fi
      - name: Đăng nhập clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          npm install -g @google/clasp@2.4.2
      - name: Đẩy mã và cập nhật bản triển khai
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          CLASP: clasp
          GHI_CHU: GitHub ${{ github.sha }}
        run: bash tuvi-app/tools/day-len-apps-script.sh
      - name: Xóa thông tin đăng nhập
        if: always()
        run: rm -f "$HOME/.clasprc.json"
