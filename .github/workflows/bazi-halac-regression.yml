name: Bazi and Ha Lac regression checks

on:
  push:
    branches:
      - claude/happy-brown-lttkz3
    paths:
      - 'tuvi-app/Code.gs'
      - 'tuvi-app/BatTu.gs'
      - 'tuvi-app/BatTuPhanTich.gs'
      - 'tuvi-app/BatTuChiTiet.gs'
      - 'tuvi-app/BatTuLuan.gs'
      - 'tuvi-app/HaLac.gs'
      - 'tuvi-app/tools/gia-lap.js'
      - 'tuvi-app/tests/**'
      - '.github/workflows/bazi-halac-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tuvi-app/tests/package-lock.json
      - name: Install test dependencies
        run: npm ci --prefix tuvi-app/tests
      - name: Run Bazi, Ha Lac, chart-comparison and astronomy tests
        run: npm test --prefix tuvi-app/tests
      - name: Run interpretation-safety tests
        run: node --test tuvi-app/tests/interpretation-safety.test.js
