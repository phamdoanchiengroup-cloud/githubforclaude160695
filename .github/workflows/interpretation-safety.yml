name: Interpretation safety checks

on:
  push:
    branches:
      - claude/happy-brown-lttkz3
    paths:
      - 'tuvi-app/TongHop.gs'
      - 'tuvi-app/Script.html'
      - 'tuvi-app/Index.html'
      - 'tuvi-app/Anh.html'
      - 'tuvi-app/tests/**'
      - '.github/workflows/interpretation-safety.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run interpretation safety regression tests
        run: node --test tuvi-app/tests/interpretation-safety.test.js
