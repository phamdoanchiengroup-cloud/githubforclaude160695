<style>

:root{
  --bg:#f4f3ef; --mat:#ffffff; --vien:#d9d6cc; --chu:#24231f; --chu2:#5d5a52; --chu3:#8a867b;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;
  --vang:#f7b829; --vang-nen:#3a3220; --luoi:#2f2f2d;
  --g-batdau:#f7b829; --g-kpi:#2fd3c6; --g-tcc:#b9a2ff; --g-chung:#aab5bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;
  --vang:#f7b829; --vang-nen:#3a3220; --luoi:#2f2f2d;
  --g-batdau:#f7b829; --g-kpi:#2fd3c6; --g-tcc:#b9a2ff; --g-chung:#aab5bc; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--chu);font:15px/1.6 var(--f-chu);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--vang);outline-offset:2px}

.dau{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 12px;border-bottom:1px solid var(--vien)}
.dau h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.dau h1 b{color:var(--vang)}
.so{font:12px var(--f-ma);color:var(--chu3);font-variant-numeric:tabular-nums}
.tim{position:relative;margin-left:auto;flex:1 1 240px;max-width:360px}
.tim input{width:100%;padding:8px 12px;border:1px solid var(--vien);border-radius:6px;background:var(--mat);color:var(--chu);font:inherit;font-size:14px}
.tim ul{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--mat);border:1px solid var(--vien);border-radius:6px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.tim li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:14px}
.tim li button:hover,.tim li button:focus-visible{background:var(--vang-nen)}
.tim li small{display:block;color:var(--chu3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.than{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 32px}
@media (min-width:900px){.than{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .do-thi{position:sticky;top:12px;height:calc(100vh - 110px)}}
.do-thi{position:relative;height:56vh;min-height:320px;border:1px solid var(--vien);border-radius:8px;background:var(--mat);overflow:hidden;touch-action:none}
.do-thi svg{display:block;width:100%;height:100%;cursor:grab}
.do-thi svg.keo{cursor:grabbing}
.nut-do{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.nut-do button,.chu-giai button{font:12px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:4px 9px;cursor:pointer}
.nut-do button{width:30px;padding:4px 0;font-size:15px}
.chu-giai{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px}
.chu-giai button{display:inline-flex;align-items:center;gap:6px}
.chu-giai button[aria-pressed="false"]{opacity:.45}
.cham{width:9px;height:9px;border-radius:50%;background:var(--c)}

.duong{stroke:var(--chu3);stroke-opacity:.35;stroke-width:1}
.duong.sang{stroke:var(--vang);stroke-opacity:.9;stroke-width:1.6}
.nut circle{fill:var(--c);stroke:var(--mat);stroke-width:2}
.nut text{font:var(--fs,11px) var(--f-chu);stroke-width:var(--sw,3px)!important;fill:var(--chu2);paint-order:stroke;stroke:var(--mat);stroke-width:3px;stroke-linejoin:round}
.nut circle.vung{fill:transparent!important;stroke:none!important}
.nut{cursor:pointer}
.nut.chon circle{stroke:var(--vang);stroke-width:3}
.nut.chon text,.nut.ke text{fill:var(--chu);font-weight:700}
.mo .nut:not(.chon):not(.ke),.mo .duong:not(.sang){opacity:.18}
.nut.an,.duong.an{display:none}
.xa .nut.phu:not(.chon):not(.trung):not(:hover):not(:focus) text{display:none}
.nut.trung circle{stroke:var(--vang);stroke-width:3}

.doc{min-width:0;background:var(--mat);border:1px solid var(--vien);border-radius:8px;padding:18px clamp(16px,3vw,28px) 28px}
.doc .nhan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--chu3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--vien);color:var(--chu2);font-size:12px}
.doc h2.tieu{margin:.4em 0 .2em;font-size:1.45rem;line-height:1.25;text-wrap:balance}
.noi{max-width:72ch}
.noi h1,.noi h2,.noi h3{line-height:1.3;text-wrap:balance;margin:1.3em 0 .4em}
.noi h1{font-size:1.25rem}.noi h2{font-size:1.1rem}.noi h3{font-size:1rem}
.noi p{margin:.6em 0}
.noi ul,.noi ol{padding-left:1.25em;margin:.5em 0}
.noi li{margin:.3em 0}
.noi li::marker{color:var(--chu3)}
.noi code{font:0.86em var(--f-ma);background:var(--luoi);padding:.05em .35em;border-radius:3px;overflow-wrap:anywhere}
.noi pre{overflow-x:auto;background:var(--luoi);padding:10px 12px;border-radius:6px}
.noi pre code{background:none;padding:0;white-space:pre}
.noi strong{font-weight:700}
.wl{color:var(--vang);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit}
.wl:hover{background:var(--vang-nen)}
.lien{margin-top:24px;padding-top:14px;border-top:1px solid var(--vien);display:grid;gap:10px;font-size:13px}
.lien h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--chu3)}
.lien .ds{display:flex;flex-wrap:wrap;gap:6px}
.lien .ds button{font:13px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.duong-file{font:12px var(--f-ma);color:var(--chu3);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

 + push cả 6 yêu cầu (chi tiết: [[KPI Quy trình sản xuất]] mục \"Đợt 5\"). Chưa dán: Code.gs + Index.html + QuyTrinh.html (2-CAP-NHAT.bat).\n- Chờ: chất liệu các mã chuôi nhảy / phá nhảy / Vũ trụ / Eclipse / Carom; file Excel cấu hình gậy + quy trình nháp; câu tip; họp trưởng phòng; Sơn hệ số lớp.\n- Mẹo: repo clone **nông** làm link jsDelivr ghim sai commit khi dựng (SoDo.html đổi) → chạy `git fetch --unshallow origin claude/beautiful-ptolemy-f2j7za` trước khi dựng. Sheet đơn hàng quá lớn để tải qua Drive → dùng bộ đơn giả (`scratchpad/gen/tao-dh.js`) hoặc nhờ chủ dự án tải file lên.\n\n## BÀN GIAO 02/11 (đọc phần này trước)\nPhiên 31/10–02/11 rất dài, chủ dự án yêu cầu chuyển phiên mới. **Mọi việc đã commit + push** lên `claude/beautiful-ptolemy-f2j7za`, bộ não + bản đồ artifact đã cập nhật (bản 57). Chưa biết chủ dự án đã dán các đợt 31/10–02/11 lên web chưa (cách dán: bấm đúp `2-CAP-NHAT.bat`, bộ cài đã thay 31/10).\n\n**Đã xong trong phiên** (chi tiết: [[KPI Quy trình sản xuất]], [[KPI Gộp công đoạn và tiến độ BTP]]):\n- Tab **Quy trình sản xuất** (chỉ chủ sở hữu): cân bằng tải theo **sp/tháng** (9.000, 26 ngày; nhịp hiện nay đo từ đóng gói ~368/ngày – chủ dự án xác nhận \"khá sát\"), bảng thiếu/thừa người; **lưu đồ nhà máy** (thẻ kính, đường cong phát sáng, CNC→Ngọn Tip, CNC→Sơn \"đầu gậy lết\", CNC→Đóng gói \"tip bán lẻ\", POM Ngọn Taro→Phôi Thô); **lưu đồ từng xưởng kiểu nhà máy** (nhóm công đoạn chỉ để vẽ); điện thoại ẩn lưu đồ; **cách A** bước xuất mỗi xưởng → ra/ngày.\n- Tab **Đơn hàng** riêng (chỉ chủ sở hữu): như web app đơn hàng + thống kê + Việc theo xưởng + Kiểm phân loại; bản chụp đơn 9h hằng ngày (sheet ẩn `DonHangChup`).\n- Phân loại SKU 4 thông số + kiểu (đánh/nhảy/phá/phá nhảy) + chất liệu; 370/390 tên chắc chắn.\n- File **Cau-hinh-gay-va-quy-trinh-nhap.xlsx** đã gửi chủ dự án (chỉ ở scratchpad, không commit; dựng lại bằng `kpi-app/tests/quy-trinh/xuat-cauhinh.js` (cần csdl.json + dh.json lấy lại từ Drive) rồi `tao-excel-cauhinh.py`).\n\n**Chờ chủ dự án:**\n- Gửi lại file Excel: 22 tên hàng vàng, sửa cấu hình dòng gậy, **chỗ sai trong sheet \"Quy trình nháp\"** (quy trình từng xưởng là bản nháp Claude tự soạn – chủ dự án thấy vài chỗ sai). Nhận file → gộp vào `PL_DONG` / `QT_NHAP` (+ sửa tay của chủ dự án trong sheet `PhanLoaiSKU`, `QuyTrinh`).\n- Họp trưởng phòng về **gộp công đoạn có định mức khác nhau** – KHÔNG tự gộp danh mục KPI.\n- Trả lời 02/11: **Sơn và In UV không làm ngọn** (so sánh với ~346 chuôi/ngày); **Sơn có ghi mỗi lớp sơn thành 1 lần riêng** → số ra/ngày của bước xuất Sơn (Sơn máy + súng ≈ 729) đang gồm nhiều lớp, nên cân nhắc hệ số chia hoặc chọn bước 1 lần/chiếc; câu \"tip\" chủ dự án chưa rõ – hỏi lại đơn giản: CNC ra ~1.200 tip + phíp/ngày trong khi cần ~350 ngọn/ngày, vậy 1 ngọn dùng mấy tip/phíp, có làm tip bán lẻ / để kho không?\n\n**YÊU CẦU MỚI 02/11 (phiên mới làm ngay, hỏi rõ trước khi sửa code theo CLAUDE.md):**\n1. Tab Đơn hàng → \"Đơn cần chú ý\": hiện thêm các đơn **quá hạn hơn 30 ngày** trong **1 thẻ riêng bên dưới** (hiện `DH_TRE_MAX=30` đang bỏ hẳn các đơn này – `dhChuY`, `dhVeChuY` trong `tests/quy-trinh/quy-trinh-web.html`).\n2. Nhãn chất liệu của SKU phải có **2 nhãn: chuôi và ngọn** (hiện `plKieu_` chỉ có 1 `vl`; `dhVlChip`). Tách `vlChuoi` / `vlNgon` (bảng `PL_VL_CHUOI`, `PL_VL_NGON` trong `don-hang.gs`).\n3. Thống kê tab Đơn hàng \"nhóm hàng × chất liệu\" chưa đúng với gậy 2 khúc (chuôi và ngọn có thể khác chất liệu) → thống kê riêng chuôi × chất liệu và ngọn × chất liệu (hoặc ma trận chuôi × ngọn).\n4. Hỏi chuyên gia (`quan-ly-van-hanh`…) theo **Lean Six Sigma** để đưa ra các thống kê có giá trị thực tiễn cho tab Đơn hàng.\n5. \"Việc theo xưởng\": **nhãn chất liệu nhiều dòng còn sai** → rà lại cách gán chất liệu theo từng xưởng (xưởng chuôi dùng chất liệu chuôi, xưởng ngọn dùng chất liệu ngọn, SKU dùng cả 2).\n6. Tab Quy trình → \"Sửa quy trình\" **rất khó dùng**, chủ dự án đọc không hiểu → đề xuất 2–3 phương án sửa quy trình dễ hơn (vd. kéo thả thẻ trên lưu đồ xưởng, sửa theo nhóm, nhập từ Excel \"Quy trình nháp\"), có so sánh + khuyến nghị, hỏi chủ dự án chọn rồi làm.\n\n**Gợi ý việc tiếp theo:** (1) xử lý file Excel khi chủ dự án gửi lại; (2) Sơn: hệ số lớp sơn cho bước xuất; (3) giai đoạn 2 thu tiến độ BTP: kiểm kê 1 lần + phiếu giao nhận 3 điểm (cách B) khi chủ dự án muốn.\n\n## Trạng thái nhánh (25/10)\n- Mọi việc đã commit và push lên `claude/beautiful-ptolemy-f2j7za`. Commit cuối: \"ảnh web lấy từ repo qua jsDelivr\" (25/10).\n- Nhánh tạm `claude/beautiful-ptolemy-f2j7za-dang-lam` đã gộp hết vào nhánh chính, không còn dùng.\n- Chủ dự án cập nhật web bằng bộ cài clasp: bấm đúp `2-CAP-NHAT.bat` rồi Ctrl+F5. Bộ cài nằm ở `kpi-app/cai-dat-clasp/`; lần gần nhất đã gửi lại bản zip ngày 24/10. Chưa biết chủ dự án đã cập nhật các đợt 24–25/10 lên web hay chưa.\n\n## Việc đã làm 22–25/10 (chi tiết ở từng ghi chú)\n- [[KPI Kỹ năng]]: tab mới, ma trận 4 cấp.\n- [[KPI Hologram chủ sở hữu]]: giao diện riêng cho chủ sở hữu. Ngày 25/10 sửa lỗi menu điện thoại bị lớp nền tối che.\n- [[KPI Bảng KPI tất cả xưởng]], [[KPI Phân tích định mức]] (tự chạy tháng hiện tại), [[KPI Cơm trưa]] (nhắc TP/PP số người chưa báo).\n- [[KPI Sơ đồ nhà máy 3D]]:\n  - Bỏ KPI / sĩ số ở cả 2D và 3D.\n  - 2D dùng 3 ảnh mặt bằng chủ dự án gửi (đã nắn), thêm nút \"Tách tầng\" có chú thích xưởng, có đèn ban đêm.\n  - Bản dọc đã thử rồi bỏ: chủ dự án muốn giữ bản ngang.\n- [[KPI Màn đăng nhập Khắc laser]]: nền ảnh nhà máy ban đêm, thẻ nhân viên vân carbon được laser khắc mã và tên.\n- [[KPI Ảnh web qua jsDelivr]]: 25/10 ảnh nền đăng nhập + mặt bằng sơ đồ lấy từ repo (công khai) qua jsDelivr, ghim commit; Claude tự làm, không cần Drive.\n\n## Đã làm 31/10 (lịch sử)\n- [[KPI Quy trình sản xuất]]: tab mới gộp Kỹ năng.\n  - Đã chốt phương án C, chỉ chủ sở hữu xem.\n  - Đã đọc 2 file chủ dự án gửi (danh mục mã hàng, trạng thái đơn hàng). Tiền tố mã cho biết chặng BTP; hàng còn thiếu ~12.000, giao ~250/ngày.\n  - 31/10 đã làm bản đầu (commit \"Tab Quy trình sản xuất…\" te_file` cần base64 trong lời gọi, nên không tải được ảnh vài trăm KB: gửi ảnh cho chủ dự án tự kéo vào.\n  - `download_file_content` chỉ tải file **dưới 10 MB**. File lớn hơn thì dùng `read_file_content` để đọc phần chữ (31/10, file 36 MB đọc được).\n  - Chủ dự án tải lên Claude tối đa 30 MB; file to hơn thì chủ dự án đưa lên Drive rồi gửi link.\n- **Sheet \"Trạng thái đơn hàng\"** (theo dõi đơn, của tài khoản khác chia sẻ cho chủ dự án): `1FKrF_wyQcl0SpDhvoRBg7VoaBzgzhSJ7zZ5U2A5ReMU`. Script gắn kèm (project `19Do2R9xW9GjJZ_PHTFhKLDJvvasZTifEcg3MUP4EPQj9fBZkW64YB3Oq`) không mở được qua Drive; chủ dự án đã gửi mã nguồn. (02/11) Sheet này **quá lớn để tải qua Drive** (xuất xlsx báo lỗi, `read_file_content` chỉ trả tiêu đề) – kiểm thử dùng bộ đơn giả `scratchpad/gen/tao-dh.js` hoặc file chủ dự án tải lên.\n- **Sheet cầu nối \"Cau noi bao cao don hang (Claude - chi doc)\"** (07/11): `1lZ1AS0-DiWD4uX_9mpqHN2PJKsgDhMGuEqTD5G3tffk`, trong Drive chủ dự án. Một tab, mỗi khối 61 cột là `=IMPORTRANGE(<sheet đơn hàng>;\"'<tab>'!A1:BH\")` cho 8 tab kênh + ĐƠN ƯU TIÊN + HT-2026 (bỏ hàng trăm cột ngày phía sau) → nhỏ, tải được: `download_file_content` với `exportMimeType`=`text/csv` (~5 MB). Không cần bấm \"Cho phép truy cập\". Tab POD-ECOMSTONE trả #REF! (tên tab thật khác). Dữ liệu tải về chỉ để scratchpad. Dùng để làm báo cáo số thật khi chủ dự án không ở văn phòng: CSV → `{tab: rows}` → `DH=` của `tao-ban-xem-thu.js`.\n- **File dữ liệu cho [[KPI Quy trình sản xuất]]** (31/10): \"THÔNG SỐ GẬY.xlsx\" `1wM3DydKenFuPo4PWTirgr2WzE15yBNqB`. Hai file danh mục mã và trạng thái đơn hàng được tải lên trực tiếp vào phiên, không có trên Drive.\n- **Chấm công (03/11)**: thư mục ảnh `1sj-7VartwovgM1YMweWBc1DLxJBj9Irt`; file sửa `1MwEdEj5XELPcjEhLd3BZz-3Tcs4rbQR01KD9hFnor3g`, file bộ phận ngoài SX `1KAbgfq0QMZNmFeyF7VWFcEwjWM-ADK4sRR8FghUAcgk` – [[KPI Nhân sự theo chấm công]]. Phiên không có kết nối Google Sheets (chỉ Drive: đọc, tạo file).\n- Thư mục Drive \"Báo cáo KPI hằng tháng\" do we I Ảnh web qua jsDelivr", "KPI Sửa lỗi 21-10 và dữ liệu sheet", "KPI Tăng tốc đợt 2 (21-10)", "KPI Phân tích định mức", "KPI Hồ sơ bắt buộc", "KPI Bảng KPI tất cả xưởng", "KPI Màn đăng nhập Khắc laser", "KPI Kỹ năng", "KPI Soát đổi định mức 22-10", "KPI Thang xếp loại", "KPI Chia đôi màn hình", "KPI Phần giao diện tải sau", "KPI Cập nhật bằng clasp"]}, {"id": "Quyết định của chủ dự án", "nhom": "Bắt đầu", "txt": "# Quyết định của chủ dự án\n\nNhóm: Chung · Cập nhật 31/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Demo đã bỏ]] · [[00 Mục lục]]\n\nNhững điều đã chốt. Đừng đề xuất lại những gì ghi \"không cần\" / \"không làm\".\n\n## Cách làm việc\n- **Mỗi dự án một nhánh** (21/10, thay quyết định \"một nhánh\" trước đó cùng ngày): web KPI = `claude/beautiful-ptolemy-f2j7za`, Thiên Cơ Các = `claude/happy-brown-lttkz3`. Hai dự án không liên quan nhau, mỗi nhánh có CLAUDE.md và bộ não riêng.\n- Phần nào xong và đã kiểm tra thì gửi trước, không chờ xong hết (19/10).\n- **Claude giúp, không giao thêm việc** (25/10): nghĩ kỹ phương án, ưu tiên cách Claude tự làm được, đưa 2–3 đề xuất có so sánh + khuyến nghị; chỉ nhờ chủ dự án khi không còn cách khác (đã ghi vào CLAUDE.md).\n- **Luôn hỏi để làm rõ yêu cầu trước khi hành động** và **luôn dùng vai chuyên gia Agency Agents** cho mỗi việc (25/10, đã ghi vào CLAUDE.md). – [[Công cụ Claude]]\n- Bản bảo mật + vận hành: đợi sửa xong hết mới dán một lần (18/10).\n- Bộ não thứ hai: thư mục `bo-nao/` + trang bản đồ xem bằng trình duyệt (21/10), mỗi nhánh một bộ.\n- Plugin: không bật `claude-mem-cowork` (gửi dữ liệu lên cmem.ai). – [[Công cụ Claude]]\n\n## Định mức (21/10)\n- **Đổi định mức là áp cho cả tháng đang làm**: toàn bộ sản lượng tháng đó tính theo định mức mới (thay cách áp theo ngày của bản 18/10). **Kể cả tháng đã chốt**. (22/10: Bảng KPI tháng đang làm luôn tính trực tiếp nên không cần Chốt bù.) – [[KPI Phân tích định mức]]\n- **Mốc định mức (22/10 tối): người khá (top 25%) đạt 90%**, gộp 3 tháng gần nhất, bỏ người đột biến (> 1,5 × người khá) và người mới (tài khoản / vào làm trong 2 tháng). Công đoạn 2–3 người vẫn gợi ý (không dùng ngưỡng 5 người). Không thêm mã \"giờ không sản xuất\". Trước đó: trung vị 85%, không tính người học việc (22/10). Không phân công đoạn \"chính / phụ\" – công đoạn nào cũng là chính (22/10). – [[KPI Phân tích định mức]]\n- Phân tích định mức chỉ gợi ý **nâng** định mức lỏng về mốc 85%. **Không gợi ý hạ** định mức chặt – có thể đang đào tạo nhân viên mới (chủ dự án đã nói từ trước, nhắc lại 21/10). – [[KPI Phân tích định mức]]\n\n## Xếp loại (22/10)\n- Thang mới: **S ≥ 95, A+ ≥ 90, A ≥ 85, B ≥ 80, C ≥ 70, D < 70**. – [[KPI Thang xếp loại]]\n\n- **Không dùng trần hiệu suất sản lượng** để ép người giỏi về 90–95% (22/10: \"người ta làm được nhiều thật thì phải được ghi nhận\"). Giữ `TranKPI` = 500; muốn người giỏi nhất quanh 90–95% thì chỉnh bằng định mức. – [[KPI Phân tích định mức]]\n\n## Hồ sơ nhân viên (22/10)\n- Đăng nhập mà hồ sơ thiếu thì phải điền đủ mới dùng tiếp. **Không bắt buộc: chủ sở hữu, ban điều hành, tài khoản nhóm báo cơm tổng (dùng chung), bếp; mọi tài khoản còn lại đều bắt buộc.** – [[KPI Hồ sơ bắt buộc]]\n- Danh sách ban điều hành & hành chính nhân sự ở tab Nhân sự: **chỉ chủ sở hữu xem**. – [[KPI Hồ sơ bắt buộc]]\n\n## Kỹ năng (22/10)\n- Chủ dự án giao: \"cứ làm thứ tốt nhất, tham khảo chuyên gia\". Đã chốt theo 2 chuyên gia: 4 cấp ILUO, trọng số A/B/C do BĐH đặt, cấp 3–4 BĐH xác nhận, hạn 24 tháng, điểm chỉ mô phỏng – chưa gắn lương. – [[KPI Kỹ năng]]\n- Quy tắc làm việc mới: sau mỗi lần sửa phải rà lại toàn bộ logic code, logic hiển thị và công thức (đã ghi vào CLAUDE.md).\n\n## Phong cách giao diện web KPI\n- Hologram vũ trụ **chỉ cho tài khoản chủ sở hữu**, cả web + Tổng quan \"Đài quan sát KPI\", chuyển động mặc định bật, có nút tắt (23/10). Các tài khoản khác giữ giao diện cũ. – [[KPI Hologram chủ sở hữu]]\n- Thích kiểu **thiết bị đo nhà máy**; chê bộ 3D \"như đồ chơi\", 7 mẫu đầu demo-2, demo-4 (trừ số 5), demo-5, demo tương tác và giao diện nền. Hướng hiện tại: làm lại đúng màn hình đang dùng, đặt bản cũ cạnh bản mới. – [[KPI Demo giao diện]]\n- Bỏ qua demo 3D CSS (08/10). – [[KPI Demo đã bỏ]]\n- Màn đăng nhập: chọn **Khắc laser** (09/10); hiệu ứng đợt 2 chọn A1, 2, 4, 5, 6 (bỏ \"giữ để vào ca\") + toàn bộ B; mọi hiệu ứng phải chạy trên điện thoại. – [[KPI Màn đăng nhập Khắc laser]]\n- Giữ nguyên trang công nhân nhập sản lượng (mục 7, 8) và điểm danh (mục 11). – [[KPI Thao tác và hiệu ứng bên trong]]\n- Nhân vật: thay Mai bằng tê giác **Rhino mẫu 3B** (cơ Retro, 11/10); bản SVG tê giác tự vẽ bị chê xấu. – [[KPI Rhino]]\n- Âm thanh: bộ \"HUD phi thuyền\" + giọng nữ, **mặc định bật**; nút ở cuối menu, không đặt đầu trang (18/10). – [[KPI Âm thanh và giọng Rhino]]\n\n## Sơ đồ nhà máy\n- Không cần nút \"Ảnh như thật\". Bỏ xem 3D trên điện thoại (13/10). Kính nhìn xuyên chỉ làm cho tòa điều hành, không làm xưởng (17/10). – [[KPI Sơ đồ nhà máy 3D]]\n- Xoay khối xưởng 180° (thang máy + WC phía kho phụ); P. khuôn T1 thuộc xưởng Phôi Carbon (11/10).\n\n## Cơm trưa\n- **Không cần** (13/10): đối chiếu điểm danh, suất phát sinh sau khóa, suất khách/người chưa có tài khoản, \"không ăn cho cả xưởng\", cá nhân đổi nơi ăn, cảnh báo bếp sửa món, giới hạn món thay, suất chay.\n- Chỉ trưởng phòng ăn cùng ban điều hành; HR và QC không tính suất; phạm vi đăng ký hộ: TP/PP xưởng mình, ADMIN + TL khối văn phòng (11/10). – [[KPI Cơm trưa]]\n\n## Ảnh và giao diện (24/10)\n- Ảnh nặng không nhúng vào file. 25/10: **lấy từ repo qua jsDelivr** (thay Google Drive – Claude tự làm, chủ dự án không phải kéo ảnh). **Giữ repo GitHub công khai**; không xóa các dòng ghi chú về tài khoản dùng mật khẩu mặc định (chủ dự án 25/10). – [[KPI Ảnh web qua jsDelivr]]\n- Tab Sơ đồ nhà máy không hiện KPI / sĩ số (xem ở tab khác); 2D dùng ảnh mặt bằng chủ dự án gửi + ảnh tách tầng. – [[KPI Sơ đồ nhà máy 3D]]\n- Màn đăng nhập: nền ảnh tòa nhà ban đêm + thẻ nhân viên vân carbon được laser khắc mã. Ghép ảnh ngọn cơ chụp lên nền đêm: chê xấu, không dùng. – [[KPI Màn đăng nhập Khắc laser]]\n\n## Bóng đá\n- Không làm tab riêng, chỉ dải thông báo; hiện từ 7 ngày trước trận (13/10). – [[KPI Bóng đá]]\n\n## Bảo mật và vận hành (18/10)\n- 25/10: chủ dự án nói **\"kệ 2 tài khoản đó\"** – không đổi mật khẩu `giamdoc`, `phogd2`, đừng nhắc lại (đã biết repo công khai + 2 tài khoản vào được bằng mật khẩu mặc định).\n- Không làm A5 (chưa có KCS), giữ ô \"Đặt số dòng\", không làm A3 giờ dừng, không cần video hướng dẫn; phần tăng ca đã gỡ. – [[KPI Bảo mật và vận hành]]\n\n## Quy trình sản xuất (31/10)\n- Tab \"Quy trình sản xuất\" (gộp Kỹ năng): làm theo **phương án C**. Giai đoạn 1 cân bằng 9 xưởng; Claude soạn quy trình nháp, TP/PP chỉ sửa. **Tab chỉ mở cho tài khoản chủ sở hữu** cho tới khi chỉnh xong. Kiến trúc **B**: mảnh tải sau `QuyTrinh.html` trong web hiện tại (không làm web riêng). Câu hỏi giờ ca / số máy / ai sửa: chủ dự án thấy khó → Claude tự lấy (giờ = ô chỉnh trên màn hình, máy từ sheet MayMoc, quyền = chỉ chủ sở hữu). – [[KPI Quy trình sản xuất]]\n\n- App Qoder (31/10): chỉ làm tạm khi Claude hết token, **không sửa gì trên đó**; lấy phần tốt nhất đưa vào web KPI, ưu tiên phân loại cấu hình gậy cho SKU. Sản lượng thật ~9.000 sản phẩm/tháng (không tính tay nối). – [[KPI Quy trình sản xuất]]\n- 01/11: **Luôn rà logic để sắp xếp theo cách dễ nhìn, dễ theo dõi, dễ tổng hợp nhất.** Đơn hàng: nhóm chuôi / chuôi nhảy / ngọn; gậy đánh / nhảy / phá (ngọn lẻ cũng vậy), trong nhóm xếp full carbon → mix carbon+glassfiber → glassfiber. Đơn hàng ra tab riêng dưới tab Quy trình. Có nhánh POM Ngọn Taro → Phôi Thô. – [[KPI Quy trình sản xuất]]\n- 01/11 (trả lời 4 câu hỏi): tab Đơn hàng **chỉ chủ sở hữu**, **có** \"Thay đổi hôm nay\" (web KPI tự lưu bản chụp đơn mỗi ngày vào sheet riêng, Sheet đơn vẫn chỉ đọc); cân bằng tải theo **số sản phẩm/tháng sửa được** (mặc định 9.000, 26 ngày); gộp công đoạn **chỉ để xem + tư vấn** (không đổi danh mục KPI); **Phá nhảy là nhóm riêng** (Đánh / Nhảy / Phá / Phá nhảy), GF vỏ carbon tính là Mix. – [[KPI Gộp công đoạn và tiến độ BTP]]\n- 01/11 (sau ảnh mẫu lưu đồ 9 xưởng): **không cần ảnh minh họa / AI tạo ảnh**; làm đẹp lưu đồ bằng **hiệu ứng, chau chuốt đường line, card** – áp cho **cả lưu đồ toàn nhà máy và từng xưởng**; **điện thoại bỏ lưu đồ** (chỉ bản máy tính). – [[KPI Quy trình sản xuất]]\n- 01/11 (khuya): **KHÔNG gộp công đoạn tính KPI** (định mức khác nhau, chủ dự án sẽ họp từng trưởng phòng) – gộp nhóm **chỉ để vẽ lưu đồ xưởng**, lưu đồ xưởng phải **vẽ theo kiểu lưu đồ toàn nhà máy** (thẻ + đường nối). Nhịp ~368 sp/ngày \"khá sát\". Tiến độ BTP: chọn **cách A** (từ nhật ký KPI), Claude chọn sẵn bước xuất mỗi xưởng, chủ dự án sửa trên web. Thêm nhánh **CNC cấp \"đầu gậy lết\" cho Sơn**. Cần bảng **đầy đủ cấu hình gậy** đã tổng hợp. – [[KPI Quy trình sản xuất]]\n- 02/11: CNC còn cấp **tip bán lẻ thẳng cho Đóng gói** (đã thêm luồng). **Sơn và In UV không làm ngọn**; Sơn **ghi mỗi lớp sơn thành 1 lần riêng**; câu hỏi tip (1 phôi ra 2 tip hay bán riêng) chủ dự án chưa rõ. Chủ dự án yêu cầu chuyển phiên mới (phiên quá dài). – [[KPI Quy trình sản xuất]]\n- 02/11 (phiên mới, 4 câu hỏi): đơn quá hạn > 30 ngày hiện ở **thẻ riêng mở sẵn**; nhãn chất liệu **2 chip \"Chuôi:\" / \"Ngọn:\"**; Thống kê lấy **tất cả** đề xuất Lean + giữ phần có giá trị, **mỗi thẻ có chú thích dễ hiểu để trình bày cho người khác**; Sửa quy trình làm **cả A (kéo thả trên lưu đồ) và B (danh sách ↑↓)**, điện thoại không hiện lưu đồ. – [[KPI Quy trình sản xuất]]\n- 02/11 (tiếp): Sheet đơn **thường không có cấu hình** sản phẩm → **báo sản phẩm mới ở Việc hôm nay**; cấu hình sửa trên web (dòng gậy mới = tên + chữ nhận diện + cấu hình; loại chuôi / ngọn / tip: chất liệu, kiểu, thêm mới, chỉ ẩn khi đã dùng); **tự đọc tab kênh mới** có cột chuẩn. Yêu cầu **PDF hướng dẫn chi tiết** 2 tab (tổng quan, thông tin, chức năng, diễn giải, thao tác, phân tích thống kê). – [[KPI Quy trình sản xuất]]\n- 03/11: **mở tab Quy trình cho trưởng / phó phòng** – chỉ xưởng mình; xem Từng xưởng + Con người + Sửa + lưu đồ nhà máy không số; sửa = **gửi đề xuất, chủ sở hữu duyệt**; được sửa luồng giao đi từ xưởng mình; **tab Đơn hàng giữ chỉ chủ sở hữu**. – [[KPI Quy trình sản xuất]]\n\n## KPI và định mức (25/10)\n- Bỏ khoản \"Không nhắc CN nhập\" của TP/PP với lượt phạt trễ không có vi phạm NHAPTRE (phạt trước 15/09): chỉ trừ khi công nhân thật sự bị trừ. – [[KPI Sửa lỗi 21-10 và dữ liệu sheet]]\n- Cân Phôi – Phân Loại Phôi trả về 180 (chủ dự án tự sửa trên web). **Không giới hạn** mức nâng định mức mỗi lần (bỏ đề xuất 10%/lần). – [[KPI Phân tích định mức]]\n- Người SL 0 cả tháng (Bùi Hoàng Anh, Trần Thị Thuỳ Dung, Tống Thị Mỹ Duyên, Nguyễn Thị Mai Nga) là nhân viên mới; **giữ trọng số** SL 70 / CL 20 / TT 5 / AT 5. – [[KPI Soát đổi định mức 22-10]]\n- Video giới thiệu từ tư liệu Rhino: **tự dựng** (ffmpeg + hoạt ảnh), không dùng video AI tốn credit. – [[KPI Màn đăng nhập demo chờ duyệt]]\n\n## Giao diện sáng (03/11)\n- Giao diện tối giữ nguyên (chủ dự án: \"đẹp rồi\"). Giao diện sáng phải đọc rõ mọi thẻ, lưu đồ. Hologram chủ sở hữu chỉ dùng ở nền tối: chọn nền sáng thì hologram tự tắt; bấm nút hologram khi đang sáng thì web chuyển sang nền tối. – [[KPI Hologram chủ sở hữu]]\n- (03/11) Giao diện sáng: chọn **card xanh ngọc nhạt** (phương án B) cho mọi người, mọi tab; không chọn nền xám + card trắng (A) hay card kem (C).\n- (03/11) Lưu đồ từng xưởng (cả xem và Sửa quy trình) chạy **dọc từ trên xuống**: hàng = bước, cột = nhánh. Không quay lại kiểu ngang.\n- (03/11) Mã \"ƯU TIÊN\": mục mới trong tab Đơn hàng (chỉ chủ sở hữu), chỉ đơn đang làm (bỏ \"Đơn hàng HT\"), chỉ tính chữ \"ưu tiên\" (không tính nền vàng), chữ ở ô mã đơn = cả đơn ưu tiên.\n- (03/11) Phần đề xuất quy trình của trưởng / phó phòng ghi \"Ban điều hành\" duyệt, không dùng chữ \"chủ sở hữu\" (quyền duyệt hiện vẫn là tài khoản chủ sở hữu – đang hỏi có mở cho tài khoản Ban điều hành không).\n- (03/11) Lưu đồ / bảng cân bằng: ghi đủ chức danh \"1 TP · 2 PP · 2 TT · 18 CN = 23\", tổng phải khớp danh sách đang làm / chấm công; tải tính theo **công nhân + tổ trưởng có mặt theo điểm danh** (không theo ngày có ghi KPI). Duyệt đề xuất quy trình: giữ chỉ owner.\n- (03/11) Giai đoạn 2 (hạn từng xưởng): chủ dự án mang PDF đề xuất đi họp với GĐ sản xuất + trưởng phòng rồi mới chốt.\n- (03/11) Bộ phận ngoài sản xuất (Kho, Bếp + tạp vụ, Ban điều hành, Xưởng May): **chỉ danh sách, không tính KPI**, tạm thời **chỉ chủ sở hữu thấy** (cuối tab Nhân sự). Ban điều hành = chủ dự án + tài khoản admin + trợ lý BĐH. Sửa theo chấm công chỉ: ngày vào làm, tên, mã, người thiếu; trạng thái / xưởng / chức danh bỏ qua. Đổi mã thì tên đăng nhập đổi theo, giữ mật khẩu. – [[KPI Nhân sự theo chấm công]]\n- (03/11) Sơ đồ 3D: thêm **dòng hàng** (ai xem sơ đồ cũng thấy, không số) + **khung lưu đồ** khi bấm xưởng (chủ sở hữu có số; TP/PP xưởng mình, nhà máy không số). Không gắn công đoạn vào từng phòng / máy (phương án C chưa làm). – [[KPI Sơ đồ nhà máy 3D]]\n- (07/11) Sơ đồ 3D: **bỏ phần quy trình** (nút Dòng hàng + nút lưu đồ trong thẻ phòng). Khung lưu đồ ở sơ đồ 2D giữ nguyên. – [[KPI Sơ đồ nhà máy 3D]]\n- (07/11) Lưu đồ toàn nhà máy: ngọn lẻ → Đóng gói vẽ bằng **đường** (nét đứt cam) như POM / lết, không ghi chữ.\n- (07/11) Tab Đơn hàng: **làm lại toàn bộ** (3 ô trả lời, 3 nhóm xem, ⚙ Cài đặt, ⋯); tab Sheet **\"ĐƠN ƯU TIÊN\" là nguồn mục Ưu tiên**, không cộng vào tổng đơn; ở tab Đơn hàng thu gọn cơm trưa + Tết, Rhino không che số liệu. – [[KPI Quy trình sản xuất]]\n- (07/11) Đơn hàng: thanh % **2 màu** ở mọi danh sách đơn; **POD-ECOMSTONE** là kênh chuẩn; sản lượng nhập ngày = thiếu hôm trước − thiếu hôm nay cùng đơn; công suất **350 sp/ngày cho mọi hàng sản xuất**, thứ 2 – thứ 7, ngày lễ điền sẵn + sửa trên web; báo cáo lãnh đạo PDF + Excel có **theo kênh · người đặt** và **đơn deadline trong tháng kèm %**. – [[KPI Quy trình sản xuất]]\n- (07/11) Tab **HT-<năm>** (đơn đã hoàn thiện, chép cả đơn, có khi còn thiếu) dùng để tính sản lượng + báo cáo \"đã hoàn thiện\" (OTIF, fill rate); không bao giờ là kênh. – [[KPI Quy trình sản xuất]]\n- (07/11) **Không sửa app ORDER·FLOW**, chỉ sửa web KPI. Web KPI là nguồn số cho lãnh đạo; **không lạm dụng bản chụp**: đơn hoàn thiện đọc thẳng tab HT-<năm> (không có ngày xong → tháng theo hạn), sản lượng = Đóng gói theo nhật ký KPI, báo cáo 3 tháng. Email báo cáo **chỉ gửi chủ sở hữu**, 8h thứ 2 – thứ 7. Lấy từ ORDER·FLOW: sửa đọc Sheet + gộp dòng trùng, lễ âm lịch + ưu tiên khi trùng hạn, công đoạn + hẹn trả + phân bố thời hạn, báo cáo có quyết định cần duyệt + ô ký + 8 đơn trọng điểm. – [[KPI Quy trình sản xuất]]\n- 07/11 tối: **giữ tháng 8** trong so sánh 3 tháng (không bỏ); tab HT: suy kênh theo tiền tố mã đơn; dòng chuyển HT còn thiếu cả đơn = **đơn hủy / dừng sản xuất** (không tính fill rate); **giữ** sheet cầu nối. – [[KPI Quy trình sản xuất]]\n- 07/11 tối: **không cần** khai kênh cho các tiền tố mã đơn lạ (ORDER, RESTOCK, SEYBERT…) – ghi \"Chưa xác định\". Đừng hỏi lại. – [[KPI Quy trình sản xuất]]\n- 07/11 tối: bảng \"Ba tháng gần nhất\" trong PDF báo cáo **không cần** cột Chuyển HT, Cây giao, Giao thiếu, Hủy / dừng SX, Fill rate. Ghi web lên Sheet đơn hàng (form cho trưởng phòng / trợ lý): **tạm để đấy**. – [[KPI Quy trình sản xuất]]\n- 07/11 đêm: báo cáo bản mới nhất **gửi Giám đốc sản xuất**; bản cho Phó Tổng bàn lại, yêu cầu vào thứ 2. Mục tiêu xưởng **tính ngược từ 350**; In UV = In và phủ bóng + Phủ bóng; HT = Tổ check hàng; lịch giao + quá hạn/tuổi đơn chuyển khỏi Thống kê; sản lượng xưởng có trong báo cáo. – [[KPI Quy trình sản xuất]]\n- 07/11 đêm: mọi biểu đồ Thống kê vào báo cáo GĐSX kèm cách đọc + tư vấn; họp đầu / giữa tháng dùng **slide PowerPoint .pptx sửa được**, kỳ tự theo ngày họp, **mỗi xưởng 1 slide**; PDF họp thống nhất trưởng phòng có ô kết luận + ký. – [[KPI Quy trình sản xuất]]\n- 07/11 đêm: biểu đồ họp theo **phương án C** (ảnh biểu đồ web + biểu đồ PowerPoint thật); thêm I-MR, bullet, bản đồ nhiệt, nút cổ chai, CFD, tuổi dở dang, Pareto lũy kế, OTD, SQDCP vào web; Vào–Ra–Tồn thay bằng CFD; sản lượng xưởng theo ngày = **biểu đồ cột có số trên đỉnh cột**. – [[KPI Quy trình sản xuất]]\n- 07/11 khuya: **Thống kê thành tab chính** dưới Đơn hàng, **chỉ chủ sở hữu**; giữ thống kê cũ ở từng tab + tổng hợp ở Thống kê; báo cơm phải có **số người không báo**; làm hết một lần. KPI tháng đang chạy (tạm tính) không đem so – dùng tháng đã chốt. – [[KPI Quy trình sản xuất]]\n- 08/11: tăng tốc theo **phương án A** (máy chủ + bộ đo); **cho hiện số lần trước kèm nhãn** – làm dạng \"Mở nhanh (máy cá nhân)\" người dùng tự tích, mã hóa, không lưu CCCD / điện thoại / địa chỉ (chuyên gia bảo mật). Chưa chọn B (thu nhỏ trang cho công nhân). – [[KPI Tăng tốc đợt 3 (08-11)]]\n- 08/11: TB đi làm / ngày đặt ở **cả Nhân sự và Điểm danh**; nửa ngày = 0,5, đi muộn = 1. Tỷ lệ quản lý: **tổ trưởng tính vào CN**, không tính vào quản lý. Biểu đồ thâm niên / tuổi: nới rộng, ghi số người trên từng đoạn. – [[KPI Quy trình sản xuất]]\n- 08/11: 33 người Marketing / Kinh doanh: tách 2 bộ phận; **chưa tạo tài khoản / chưa cấp mật khẩu**, chỉ danh sách + thống kê; cơm vẫn báo theo nhóm. Bộ phận ngoài SX chỉ cần **hồ sơ** (ngày onboard, chính thức, thử việc / chính thức, thâm niên, phép còn lại), không cần chấm công trên web. File Drive chung + nút \"Cập nhật từ file\". – [[KPI Quy trình sản xuất]]\n- 08/11: **không hiện phép năm còn lại** ở Nhân sự ngoài sản xuất – \"không cần bây giờ\" (đừng đề xuất lại khi chưa được hỏi). – [[KPI Quy trình sản xuất]]\n- 08/11: **giữ chức danh đúng như tài liệu gửi lên** – không tự sửa chữ (kể cả lỗi gõ như \"Giám đóc\", chữ hoa \"Cửa hàng Trưởng\"); chỉ bỏ dấu cách thừa. Áp dụng cho mọi dữ liệu chủ dự án gửi. – [[KPI Quy trình sản xuất]]\n- 08/11: thêm nghỉ lễ **24/11 (Ngày Văn hóa Việt Nam)** hằng năm; **không sửa** chức danh Phạm Kiều Oanh (giữ \"Trưởng bộ phận\" Kho). – [[KPI Chính sách lương và cẩm nang]]\n- 08/11: Cơ cấu lương do kế toán thiết kế – chủ dự án chỉ nhận thông tin, **không nhận xét / đề xuất về lương nữa**. Từ cẩm nang + bảng lương **chưa cần** đưa gì lên web: không nhắc hết thử việc / hợp đồng, không mốc thâm niên – phúc lợi, không DS xét tăng lương, không đề cử khen thưởng, không trang quy định cho công nhân, không cảnh báo đi muộn. Đừng đề xuất lại khi chưa được hỏi. **Thâm niên trên web giữ tính từ ngày vào thật, KHÔNG áp mốc 28/12/2022** (chủ dự án chốt 08/11: \"Thâm niên của C110 giữ nguyên như trước, hơn 7 năm, đừng sửa\"). – [[KPI Chính sách lương và cẩm nang]]\n- 08/11: Điều phối sản xuất – làm việc **1, 2, 3** của `quan-ly-van-hanh` (cách đếm do Claude đề xuất, chủ dự án duyệt; việc xưởng cho TP + PP xưởng mình, chủ thấy tất cả, **hiện cả kênh / khách**, **chỉ xếp theo hạn đơn**; sức khỏe dữ liệu + tồn / nút cổ chai cho **chủ + Ban điều hành**). Việc 4 điều người: **chưa chắc, để sau**. Việc 5 sổ việc sau họp: không chọn. – [[KPI Điều phối sản xuất (08-11)]]\n- 08/11: **\"Tester\" ở Ngọn Taro là joint tester thử ren chuôi cho khách** (phụ kiện), không phải ngọn → không tính vào chuỗi / dòng chảy ngọn. – [[KPI Điều phối sản xuất (08-11)]]\n- 08/11: **Số Ngọn Taro (~450/ngày) là đúng; ngọn Glassfiber có đi qua Phôi Thô nhưng Phôi Thô ghi thiếu** bước Taro Ngọn Glassfiber → web cảnh báo \"có thể ghi thiếu\", không đổi cách tính. – [[KPI Điều phối sản xuất (08-11)]]\n- 08/11: **Bỏ hẳn \"Đón người mới\"** (tab Nhân sự, web + máy chủ). Tab Nhân sự: Thêm NV đầu, Tìm + bộ lọc (xưởng, trạng thái, chức danh, thâm niên, độ tuổi), bảng bỏ Xưởng + KPI, thêm Thâm niên – mọi vai trò. **Tổng quan chủ sở hữu: bỏ \"chưa khai báo sản lượng\" + \"cá nhân dưới 80%\"**, dùng phương án Vừa của quan-ly-van-hanh **không có tỷ lệ lỗi** (chưa có số liệu); Đài quan sát làm lại đẹp hơn có hiệu ứng. – [[KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)]]\n- 08/11: **Gộp \"Việc hôm nay\" vào \"Tổng quan\" – chỉ tài khoản chủ sở hữu**, tên Tổng quan, số liệu trước – việc cần xử lý sau; không còn mục \"Chưa nhập sản lượng\". – [[KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)]]\n- 08/11: **Nhật ký sản lượng: sheet chính chỉ giữ tháng này + tháng trước, cũ hơn chuyển sang trang lưu trữ (không xóa). Nhật ký thao tác: giữ 2 tháng, cũ hơn xóa. Sao lưu tháng giữ 24 bản** (bản hằng ngày vẫn 30 ngày). Tăng tốc đăng nhập: chọn A (Sheets API + giữ nóng). – [[KPI Dọn dẹp hằng tháng và sao lưu (08-11)]]\n- 08/11: **Cấu hình gậy** – tab riêng, bản vẽ tự vẽ theo thông số (phương án B); C077 đo + nhập, **Giám đốc SX C019 duyệt**; chỉ C019, C056, C077, C067 xem (tài liệu mật); PDF có dấu chìm + logo Rhino mờ; danh sách dòng gậy dùng chung Cấu hình sản phẩm; bản vẽ **ngọn / chuôi riêng, dựng đứng, cạnh nhau**, ghi Ø, chiều dài, cấu tạo trong, ren + vật liệu. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- 09/11: Cấu hình gậy – **cả 4 mã sửa được, C019 hoặc C056 duyệt, được tự duyệt**. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- 09/11: **Mọi thống kê / KPI / biểu đồ / lưu đồ tính tới hết hôm qua** (không tính ngày đang làm); vận hành trong ngày giữ nguyên. Sản lượng từng xưởng: bấm biểu đồ → cửa sổ nổi to. – [[KPI Thống kê không tính hôm nay (09-11)]]\n- (09/11) Joint pin trên bản vẽ cấu hình gậy dùng **ảnh cắt từ bản vẽ gốc** (bỏ số kích thước), **ghép thẳng vào file** dù repo đang công khai – chủ dự án chấp nhận. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- (09/11) Web công nhân kiểu Apple: chỉ CN; thanh dưới 5 nút Nhập · KPI · Cơm · Xưởng · Tôi; bảng KPI xưởng chỉ top 3 + người trên + mình; bật cho tất cả, có nút về giao diện cũ. – [[KPI Web công nhân kiểu Apple (09-11)]]\n- (09/11) Cấu hình gậy: thêm gậy nhảy / phá nhảy **3 khúc** (ô Số khúc), ngọn của gậy 3 khúc C077 đo riêng, khối giữa lõi chuôi là **khối đối trọng**; bảng Ø ngọn mỗi 50 mm **chưa cần**. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- (09/11) Cấu hình gậy: **chiều dài + đường kính ngọn và chuôi bằng mm**; **giữ nguyên tên ren, ghi chú ren (ren/inch) và oz** – không tự đổi các đơn vị khác. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- (09/11) Báo cáo lãnh đạo: thêm **bản Phó Tổng Giám đốc** (nút [KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- (08/11) **Cấu hình gậy** (tab mới, tài liệu mật): dán bản mới (2-CAP-NHAT.bat tự lấy thêm file `CauHinhGay`), Ctrl+F5; C077 bắt đầu đo + nhập từng dòng gậy, C019 duyệt. Chờ chủ dự án xem PDF mẫu và góp ý bản vẽ. – [[KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)]]\n- (08/11, **tạm gác – chủ dự án nói để sau**) **Chuyển quyền web KPI sang công ty Carbon Billiards + repo riêng tư.** Chủ dự án chọn: chuyển quyền cho công ty (không bán cho công ty khác); đồng ý chuyển repo riêng tư. Trước khi riêng tư phải: (1) chủ dự án tạo Organization GitHub của công ty + repo CÔNG KHAI `kpicarbon` (ảnh web + trang kpicarbon.io.vn); (2) Claude chuyển ảnh jsDelivr (nền đăng nhập + 4 ảnh Sơ đồ) và `docs/` sang repo đó, dựng lại Index/SoDo; tách Thiên Cơ Các (nhánh happy-brown cũng dùng jsDelivr repo này) ra repo riêng của chủ dự án; (3) chủ dự án cập nhật Apps Script, rồi mới đổi riêng tư + Transfer. Chuyển quyền: Sheet + Apps Script sang tài khoản Google công ty (triển khai lại → link /exec mới, đổi ở kpicarbon.io.vn), cài lại trigger, Sheet đơn hàng/ORDER·FLOW/thư mục sao lưu, tên miền, biên bản bàn giao. Còn chờ chọn A (tự chuyển thẳng) / B (iframe, bật lại ALLOWALL + kiểm `ancestorOrigins`, chuyên gia bảo mật: rủi ro thấp–vừa) cho kpicarbon.io.vn; khi bán/nhân rộng nên A. – [[KPI Trang giới thiệu kpicarbon.io.vn (08-11)]]\n- (08/11) **Link kpicarbon.io.vn**: bật GitHub Pages (nhánh KPI, thư mục /docs) + thêm 4 bản ghi A và 1 CNAME ở nơi mua tên miền, rồi bật Enforce HTTPS. Trả lời: giữ ảnh xem trước mới (nhà máy đêm + logo) không; trang có tự mở web sau 1,5 s không; trang Qoder cũ giữ hay bỏ. Demo giao diện công nhân (`scratchpad/cn/Web-cong-nhan-demo.html`): chờ chốt thanh dưới 5 nút, bảng KPI xưởng chỉ hiện top 3 + người trên mình, thứ tự áp. – [[KPI Trang giới thiệu kpicarbon.io.vn (08-11)]]\n- (08/11) Đã cập nhật, đã thấy nút Áp dụng đề xuất. Lần dán tới: Tester không tính vào chuỗi ngọn + cảnh báo Phôi Thô ghi thiếu ngọn GF. Nhắc TP Phôi Thô ghi đủ bước \"Taro Ngọn Glassfiber\". **Chủ dự án sẽ họp trưởng phòng để thống nhất lại quy trình sản xuất** (dùng PDF họp cách đếm mới) → sau họp gửi kết luận / ảnh các trang đã ký, Claude sửa bước xuất, số lần ghi, mục tiêu theo kết luận. Việc 4 (gợi ý điều người): công ty có điều người giữa xưởng không? – [[KPI Điều phối sản xuất (08-11)]]\n- (07/11) **Đổi mật khẩu app ORDER·FLOW** (mật khẩu chủ sở hữu ghi cứng trong Code.gs của app trong Sheet đơn hàng) và xóa dòng `OWNER_PASS`. Sau khi dán bản 07/11: mở tab Đơn hàng 1 lần (tự cài email 8h), bấm \"Gửi thử ngay\"; xem mục Sản lượng có đọc được tab HT-2026 và kênh không (dòng cuối bảng ghi nguồn kênh). – [[KPI Quy trình sản xuất]]\n- (07/11) Sửa **ngày nghỉ Tết 2027** và lễ theo lịch công ty ở Đơn hàng → Sản xuất → Công suất & deadline → ⚙ (đang là lịch gợi ý). Rà 181 đơn trễ > 30 ngày với kênh bán. – [[KPI Quy trình sản xuất]]\n- (Đã rõ 22/10: giữ `TranKPI` = 500, không dùng trần.) – [[KPI Sửa lỗi 21-10 và dữ liệu sheet]]\n- Dòng \"Tổng\" trong thẻ \"Chờ chốt\" có muốn cộng SL/Lỗi không (đang \"–\")? – [[KPI Sửa nhỏ trên web]]\n- Xưởng của 3 phòng: \"Khu chuốt ráp nước\" (T1), \"Kho thành phẩm\", \"Phòng kế toán kho\" (T3) – ghi chú 13/10 đã ghép tạm; ô xám chưa rõ máy trên sơ đồ 3D chờ ảnh/giải thích. – [[KPI Sơ đồ nhà máy 3D]]\n- Video giới thiệu (25/10 chọn tự dựng): nội dung, độ dài, dùng ở đâu, tư liệu nào? – [[KPI Màn đăng nhập demo chờ duyệt]]\n\n## Quy trình sản xuất (31/10)\n- (31/10: đã xác nhận tiền tố + BOM, chọn kiến trúc B.) Việc của chủ dự án: thay bộ cài clasp bằng zip mới (một lần), bấm 2-CAP-NHAT.bat, mở tab Quy trình sản xuất, xem / sửa quy trình nháp rồi Lưu. – [[KPI Quy trình sản xuất]]\n- Còn chờ trả lời các câu hỏi gửi 25/10:\n  - 1 gậy mỗi loại cần những khúc / BTP nào;\n  - tỷ lệ các dòng sản phẩm;\n  - giờ ca hiệu dụng;\n  - khâu nào giới hạn bởi máy, có mấy máy;\n  - tỷ lệ hỏng làm bù lấy từ đâu;\n  - ai sửa / duyệt quy trình;\n  - có điều người giữa các xưởng không;\n  - người cấp 1 tính bao nhiêu.\n  \n  (Đã chốt: phương án C, chỉ chủ sở hữu xem.) – [[KPI Quy trình sản xuất]]\n\n- (31/10: Qoder chỉ tham khảo; đã làm \"Đơn hàng → xưởng\".) Việc của chủ dự án: thay bộ cài, cập nhật, mở **Quy trình sản xuất → Đơn hàng → xưởng**, cho thông số 22 tên hàng còn vàng (Must, Hornet, Crest, Lửa Việt, phá nhảy chia 2 màu, gậy thuê, KOMET Break Shaft) hoặc sửa tay ở \"Kiểm phân loại\"; nếu muốn bung mã BTP 60… / S… / Ngọn… thì gửi bảng ánh xạ. Câu hỏi: có muốn các bộ phận ghi số \"đã qua\" vào Sheet đơn đều hơn không? – [[KPI Quy trình sản xuất]]\n- (01/11: đã làm tab Đơn hàng riêng, lưu đồ mới, POM, cân bằng tải theo sp/tháng.) Việc của chủ dự án: 2-CAP-NHAT.bat → xem **Sản xuất → Đơn hàng** và **Quy trình sản xuất** (lưu đồ mới), góp ý; quyết từng mục trong **top 10 gộp / ẩn công đoạn** (chỉ tư vấn, chưa đổi danh mục KPI); kiểm số \"Hiện nay làm\" (~368 sp/ngày đo từ đóng gói) có sát thực tế không. **Buổi bàn tiếp theo:** cách thu thập tiến độ bán thành phẩm ở các xưởng (đã có tư vấn A / B / C trong [[KPI Gộp công đoạn và tiến độ BTP]]). – [[KPI Quy trình sản xuất]]\n- (02/11) Việc của chủ dự án: điền file Excel **Cau-hinh-gay-va-quy-trinh-nhap.xlsx** (22 tên hàng vàng, sửa cấu hình dòng gậy nếu sai, ghi chỗ sai ở sheet \"Quy trình nháp\") rồi gửi lại; xem **bước xuất** mỗi xưởng ở Quy trình → Sửa quy trình (Claude chọn sẵn, số ra/ngày nhiều xưởng lệch nhu cầu); họp trưởng phòng về gộp công đoạn có định mức khác nhau (chưa làm). – [[KPI Quy trình sản xuất]]\n- (03/11) Sau khi cập nhật: bấm **Lưu quy trình** một lần (chốt bản nháp) rồi báo trưởng / phó phòng vào tab Quy trình xem xưởng mình và gửi đề xuất; duyệt ở Việc hôm nay › Xem & duyệt. Có thể in mục 2.6 của PDF hướng dẫn cho trưởng phòng. – [[KPI Quy trình sản xuất]]\n- (02/11) Sau khi cập nhật: mở **Việc hôm nay** xem có báo sản phẩm mới không → bấm \"Bổ sung cấu hình\"; vào Đơn hàng › Cấu hình sản phẩm chọn chất liệu cho các loại chuôi đang \"Chưa rõ\"; đọc PDF hướng dẫn, góp ý chỗ khó hiểu. – [[KPI Quy trình sản xuất]]\n- (02/11, đã làm) 6 yêu cầu mới xong, chờ chủ dự án bấm 2-CAP-NHAT.bat rồi xem: Đơn hàng → Đơn cần chú ý (thẻ quá hạn > 30 ngày), Thống kê, Việc theo xưởng; Quy trình → Sửa quy trình (kéo thả / ↑↓). Cần chủ dự án cho biết **chất liệu các chuôi nhảy / phá nhảy / Vũ trụ / Eclipse / Carom** (đang \"Chưa rõ\"). Muốn kiểm số trên đơn thật: tải file Excel đơn hàng lên phiên (Sheet quá lớn, Drive không tải được). – [[KPI Quy trình sản xuất]]\n- (02/11) Chủ dự án giao 6 yêu cầu mới cho phiên sau (đơn quá hạn > 30 ngày, 2 nhãn chất liệu chuôi/ngọn, thống kê theo chuôi/ngọn, thống kê Lean Six Sigma, sửa nhãn chất liệu Việc theo xưởng, Sửa quy trình dễ dùng hơn) – xem [[Bàn giao phiên]].\n\n- (03/11) Họp GĐ sản xuất + trưởng phòng với PDF **De-xuat-giai-doan-2.pdf**, ghi quyết định ở trang cuối rồi gửi lại. Giai đoạn 2 hạn từng xưởng + bàn giao: chọn phương án (khuyến nghị B), trả lời 5 câu hỏi (ai ghi số lũy kế, cho web ghi Sheet đơn không, thời gian chuẩn mỗi xưởng, ngưỡng đơn lớn, có gắn tỷ lệ giao đúng hẹn vào KPI trưởng phòng không). – [[KPI Gộp công đoạn và tiến độ BTP]]\n\n- (03/11) Sau khi cập nhật: chạy `SUA_NHAN_SU_THEO_CHAM_CONG` một lần, báo 6 người (C020, C732, C733, C744, C745, C747) đăng nhập bằng mã mới, cấp mật khẩu tạm cho c759 (tab Tài khoản → Cấp lại mật khẩu). Xem file đối chiếu: 11 trạng thái, 4 chức danh. – [[KPI Nhân sự theo chấm công]]\n\n## Câu hỏi 22/10\n\n- Sửa NhanSu: Trương Thị Thùy Linh NgayVaoLam 08/11/2026 (tương lai); Hà Thị Hải có 2 dòng. – [[KPI Phân tích định mức]]\n\n- Xác nhận số liệu người đột biến (tab phân tích ghi tên). – [[KPI Phân tích định mức]]\n\n\n## Kỹ năng (22/10)\n- Dùng thử tab Kỹ năng: nhờ 1–2 xưởng đề xuất 8–15 kỹ năng trước, BĐH duyệt và đặt trọng số, rồi mới mở cho các xưởng khác. Chạy thử 3–6 tháng rồi mới bàn quy đổi điểm → phụ cấp kỹ năng (nhờ nhân sự rà pháp lý). – [[KPI Kỹ năng]]\n\n- Sơ đồ 3D đẹp như ảnh mẫu (23/10): chọn làm lớp giao diện kiểu ảnh (nhãn phát sáng + khung bên phải, hao-tac-2.html` – [[KPI Thao tác và hiệu ứng bên trong]]\n- Màn đăng nhập \"Trạm khắc\", hiệu ứng đợt 3 + video nền, 5 kiểu \"thịnh hành\" (đang dở): [[KPI Màn đăng nhập demo chờ duyệt]]\n- Mai hướng dẫn công nhân / khẩu hiệu (nay đã thay bằng Rhino trên web): [[KPI Mai]]\n\n## Việc đã làm, chờ dán\n- Xem [[Lần dán lên Apps Script]].\n\n- **Báo cáo T10 + T11 số thật (07/11)**: đã gửi. Còn chờ: tên thật tab POD-ECOMSTONE (ảnh chưa nhận được); cập nhật web (2-CAP-NHAT.bat). – [[KPI Quy trình sản xuất]]\n- **Tăng tốc 08/11**: cập nhật web; dùng vài ngày rồi xem Thống kê › **Tốc độ web** (số thật). Tôi sẽ đọc số đó để quyết định có cần tách nhật ký tháng trước / thu nhỏ trang cho công nhân (B) không. – [[KPI Tăng tốc đợt 3 (08-11)]]\n- **Tab Thống kê (07/11 khuya)**: cập nhật web rồi xem; số thật cho thấy **177/180 người chưa có loại hợp đồng**, nhiều xưởng không báo cơm (CNC 57%) – nhắc trưởng xưởng. Hỏi chủ dự án có muốn thêm đối chiếu \"báo ăn nhưng vắng\" và lưu ngày nghỉ việc để tính tỷ lệ nghỉ việc không. – [[KPI Quy trình sản xuất]]\n- **HỎI LẠI SAU (chủ dự án dặn 07/11)**: chủ dự án làm việc lại với **xưởng Phôi Carbon** về việc ghi nhật ký (T10 chỉ đạt 50% mục tiêu, 21/27 ngày dưới, nhiều ngày trống) → lần làm việc tới hỏi kết quả. Còn mở: Sơn / In UV vượt ~230% (có thể 2 lượt cho cùng khúc: Sơn máy + Sơn súng tay; In và phủ bóng + Phủ bóng). – [[KPI Quy trình sản xuất]]\n- **Họp thống nhất sản lượng xưởng (07/11)**: đã gửi PDF 14 trang. Sau họp gửi Claude kết luận từng xưởng (bước xuất, đơn vị, mục tiêu) để sửa tab Quy trình / mục tiêu trên web. – [[KPI Quy trình sản xuất]]\n", "duong": "bo-nao/Việc chờ chủ dự án.md", "lk": ["Lần dán lên Apps Script", "Quyết định của chủ dự án", "00 Mục lục", "KPI Web công nhân kiểu Apple (09-11)", "KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)", "KPI Trang giới thiệu kpicarbon.io.vn (08-11)", "KPI Điều phối sản xuất (08-11)", "KPI Quy trình sản xuất", "KPI Sửa lỗi 21-10 và dữ liệu sheet", "KPI Sửa nhỏ trên web", "KPI Sơ đồ nhà máy 3D", "KPI Màn đăng nhập demo chờ duyệt", "KPI Gộp công đoạn và tiến độ BTP", "Bàn giao phiên", "KPI Nhân sự theo chấm công", "KPI Phân tích định mức", "KPI Kỹ năng", "KPI Soát đổi định mức 22-10", "KPI Cập nhật bằng clasp", "KPI Tăng tốc đợt 4 – đăng nhập (08-11)", "KPI Tăng tốc đợt 2 (21-10)", "KPI Demo giao diện", "KPI Chia đôi màn hình", "KPI Lottie", "KPI Thao tác và hiệu ứng bên trong", "KPI Mai", "KPI Tăng tốc đợt 3 (08-11)"]}, {"id": "KPI Báo cáo tháng", "nhom": "KPI", "txt": "# KPI Báo cáo tháng\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Cơm trưa]] · [[KPI Bảo mật và vận hành]] · [[00 Mục lục]]\n\n- **Báo cáo tháng (05/10):** `tests/bao-cao.gs` (nối vào Code.gs bởi va-code.py) tạo PDF toàn nhà máy + từng xưởng, tự gửi sau chốt tháng (Drive + email theo sheet `NguoiNhanBaoCao`); web: khung \"Báo cáo tháng\" trên trang Bảng KPI (`khoiBaoCaoThang`, `taiBaoCaoUI` trong va-index.py; `call()` tự thêm TOKEN, đừng truyền lại). Kiểm thử `tests/bao-cao.js`. HTML báo cáo chỉ dùng bảng/màu nền (Apps Script đổi PDF không hỗ trợ flex/grid/SVG). Chủ dự án cần chạy `TAO_SHEET_NGUOI_NHAN_BAO_CAO` rồi `GUI_BAO_CAO_THANG_TRUOC` một lần để cấp quyền Drive/Gmail (HUONG-DAN Phần F).\n\n## Báo cáo Phó Tổng Giám đốc – bản rút gọn (09/11)\n- Chủ dự án: báo cáo lãnh đạo (PDF) đang dùng gửi **Giám đốc sản xuất**; cần thêm bản ngắn gửi **Phó Tổng Giám đốc** gồm các mục như file `bao-cao-2026-11.pdf` (7 mục + Định nghĩa) nhưng: (1) bỏ \"Quyết định cần lãnh đạo duyệt\", (2) thêm Nhân sự như bảng Thống kê › Nhân sự, (3) bỏ \"Hàng đang chờ theo công đoạn\". Chốt: nút riêng, giữ báo cáo cũ; ô ký đưa xuống cuối; Nhân sự ngay sau Tóm tắt điều hành.\n- Làm (tests/quy-trinh/quy-trinh-web.html → QuyTrinh.html): nút **\"📄 Báo cáo Phó TGĐ (rút gọn)\"** cạnh \"Mở bản PDF\" (Đơn hàng › Báo cáo lãnh đạo). `dhBCPDF(1)` chốt số như cũ + gọi `layThongKe(tháng báo cáo)` → `dhBCPDFVe(w,{ptgd:1,ns})`. Số mục đánh tự động (`muc()`); bản PTGĐ: dòng \"BẢN GỬI PHÓ TỔNG GIÁM ĐỐC\", mục 2 **Nhân sự sản xuất** (`dhBCNhanSu`: Xưởng · Đang làm · TB đi làm / ngày (tháng) · Công nhân · Tổ trưởng · TP + PP · (CN + tổ trưởng) / quản lý · Tạm nghỉ + dòng Tổng), bỏ quyết định, bỏ sản lượng từng xưởng + Thống kê sản xuất + hàng chờ theo công đoạn, ô ký ở cuối. Bản cũ (Giám đốc sản xuất) không đổi.\n- Thử trên bản xem thử: bản PTGĐ 5 trang (8 mục + Định nghĩa), bản cũ 11 trang. quy-trinh-web.js: 5 lỗi có sẵn từ trước, không lỗi mới.\n", "duong": "bo-nao/KPI/KPI Báo cáo tháng.md", "lk": ["KPI Cơm trưa", "KPI Bảo mật và vận hành", "00 Mục lục"]}, {"id": "KPI Bóng đá", "nhom": "KPI", "txt": "# KPI Bóng đá\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n- **Dải thông báo giải bóng đá (13/10)** = va-index.py **mục 20** `tests/bong-da/va-bong-da.{py,css,js}` + máy chủ `tests/bong-da.gs` (nối cuối Code.gs). Chủ dự án: KHÔNG làm tab riêng, chỉ vài thông tin hưởng ứng. `layBongDa(token)` đọc sheet web giải `BD_SHEET_ID` (\"Web đá bóng 2026\" trên Drive chủ dự án) – chỉ TEN_GIAI trong CauHinh (sheet đó có mật khẩu BTC dạng chữ thường, đã khuyên chủ dự án đổi), Doi, TranDau; nhớ tạm 10 phút (`bd_v2`; `link` luôn lấy mới từ `BD_LINK`, không theo bản nhớ tạm). `#bdbar` dưới `#combar`, mọi tài khoản: hiện từ 7 ngày trước trận (`BD_TRUOC`, chủ dự án 13/10; chỉ các trận của ngày thi đấu gần nhất, kèm \"còn N ngày\") hoặc kết quả hôm nay/hôm qua; × ẩn tới trận sau (`kpi_bd_tat` = giờ trận); `BD.gio` để giả lập giờ; `BD_LINK` = link web giải (chủ dự án gửi 13/10). Kiểm thử `tests/bong-da.js` (19, `DATA=` + `F=`).\n", "duong": "bo-nao/KPI/KPI Bóng đá.md", "lk": ["Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Bảng KPI tất cả xưởng", "nhom": "KPI", "txt": "# KPI Bảng KPI tất cả xưởng\n\nNhóm: KPI · Cập nhật 24/10/2026\nLiên quan: [[KPI Tăng tốc đợt 2 (21-10)]] · [[KPI Chia đôi màn hình]] · [[KPI Kiểm thử]] · [[KPI Hologram chủ sở hữu]]\n\n## Chủ dự án yêu cầu 24/10\n- Tab Bảng KPI của ban điều hành và chủ sở napTruoc_`/`napCo_`).\n  - Chủ dự án 18/10: **chưa dán**, đợi sửa xong hết mới dán một lần → khi đó gửi đủ danh sách hàm cần chạy (KIEM_TRA_SAU_CAP_NHAT để cấp quyền email, BAT_BUOC_DOI_MAT_KHAU_MAC_DINH…). Không làm A5 (chưa có KCS), giữ ô \"Đặt số dòng\". Sheet thật 18/10: `giamdoc`, `phogd2` (ADMIN) còn 123456 với DoiMatKhauLanDau = Không (không bị bắt đổi); vài CN/TL còn 123456 nhưng có cờ Có. Video hướng dẫn: chủ dự án 18/10 KHÔNG cần (đã gỡ VIDEO_HD và kịch bản quay). Bảng nhập CN trên điện thoại ≤600px xếp mỗi công đoạn thành khối 2 dòng (CSS mục 23). A3 giờ dừng: KHÔNG làm (chủ dự án 18/10). Kiểm thử: bao-mat.js 52, van-hanh.js 26, van-hanh-web.js 29; hieu-ung.js còn 1 lỗi \"khung chờ tải bảng KPI\" có từ trước phiên này (bản xem thử trả kết quả quá nhanh); người học việc hạng 0 xếp cuối bảng KPI, cột hạng ghi \"–\"; kiểm thử cũ dùng `c.__phienDai` (phiên thật hết hạn 6 giờ).\n", "duong": "bo-nao/KPI/KPI Bảo mật và vận hành.md", "lk": ["KPI Sửa lỗi 21-10 và dữ liệu sheet", "Lần dán lên Apps Script", "Việc chờ chủ dự án", "00 Mục lục"]}, {"id": "KPI Chia đôi màn hình", "nhom": "KPI", "txt": "# KPI Chia đôi màn hình\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[KPI Tăng tốc đợt 2 (21-10)]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\nChủ dự án 21/10: bấm \"Chi tiết\" một công nhân ở Bảng KPI và \"Xem hồ sơ\" tải lâu; muốn kiểu chia đôi: một bên danh sách, một bên thông tin người được bấm, và các tab tương tự.\n\n## Nguyên nhân chậm (đo trên dữ liệu thật 21/10)\n- `layLichSuKPI` đọc 14 sheet (~262.000 ô) để trả 3–4 KB; `hoSoNhanVien` đọc ~238.000 ô (cả NhatKySanXuat) để trả ~15 KB. Mỗi lần bấm ở bản thật mất vài giây vì đọc sheet.\n- Trình duyệt đã có sẵn từ lúc đăng nhập: điểm KPI của dòng (`layKPIKy`), `D.nhatky` + `D.choDuyet` (từ đầu tháng trước), `D.kcs`, `D.nhansu`.\n\n## Đã làm (chưa dán; chỉ Index.html) = va-index.py **mục 27** `tests/chia-doi/va-chia-doi.py` + `chia-doi.{css,js}` (mục CUỐI vì bọc hàm của ()`; màn hẹp giữ cách cũ.\n- Loại khung `kn` dùng chung dòng `data-cd=\"hs|…\"` (`the(loai)`), phím ↑/↓ chuyển người vẫn ở khung công đoạn; \"Kiểu cũ\" → `edKN`.\n- Kiểm thử `chia-doi-web.js` 27 (thêm mục 4b, 6 kiểm tra).\n", "duong": "bo-nao/KPI/KPI Chia đôi màn hình.md", "lk": ["KPI Tăng tốc đợt 2 (21-10)", "KPI Thao tác và hiệu ứng bên trong", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Chính sách lương và cẩm nang", "nhom": "KPI", "txt": "# KPI Chính sách lương và cẩm nang\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[Đọc PDF ít tốn token]] · [[KPI Quy trình sản xuất]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\nChủ dự án gửi 08/11 (file gốc ở máy chủ dự án, không lưu repo): \"Cẩm nang hội nhập CB 09/2026\" (42 trang, Gamma) và \"Cơ cấu lương 2026 mới\" (áp dụng từ T10/2026, 13 nhóm Q1–Q7, V8–V9, S10–S13, 9 bậc). Claude đọc bằng pdftotext + OCR, nhận xét (chưa sửa web):\n- Bảng 1 và Bảng 2 lệch: Q4 và V9 – Bảng 1 ghi \"Hiệu suất\" cao hơn bậc 1–4 (Q4) / bậc 1–2 (V9) của Bảng 2.\n- Đảo cấp: Tổ trưởng SX (S10) thấp hơn NV SX mức 3 (S11) ở bậc 2–8; NV nghiệp vụ mức 2 (V8) bậc 1 cao hơn Trưởng BP / Trợ lý-Giám sát bậc 1; Trưởng BP và Phó BP cùng 10 tr ở bậc 1; NV nghiệp vụ đóng BHXH 5,68 tr > quản lý Q5–Q7 5,31 tr.\n- \"Hiệu suất công việc\", \"Thưởng doanh thu\" là số cố định theo bậc, chia theo công – chưa gắn KPI / doanh thu (cơ hội nối với Bảng KPI web).\n- Cẩm nang 09/2026 đã lệch chính sách T10: còn phụ cấp tay nghề, lương CB + chuyên môn bộ phận + chuyên cần 600k, lộ trình 5%/năm và \"không quá 10%/12 tháng\" (bảng mới: S11 bậc 1→2 +11%). Công thức phụ cấp \"/26\" (cẩm nang) khác \"/công chuẩn\" (bảng lương).\n- Cẩm nang: thử việc 1 tháng, nhưng hồ sơ ngoài SX thực tế đa số 2 tháng (Marketing 23/25, Kho 6/10, Ban điều hành 6/8), C584 8 tháng, C163 và C443 cùng ngày.\n- Lễ có **Ngày Văn hóa Việt Nam 24/11** (1 ngày) – web (NgayLe 3 dòng, lịch lễ Đơn hàng) chưa có.\n- Chức danh cẩm nang trang 9: Phạm Kiều Oanh \"Phó bộ phận Kho\" – web ghi \"Trưởng bộ phận\"; \"Quản đốc xưởng\" (Q4) và \"Trưởng BP\" (Q6) dùng lẫn cho các xưởng.\n- (08/11) Chủ dự án chốt: **thêm nghỉ lễ 24/11** → `LE_CO_DINH_` + `leCoDinhNam_()` (don-hang.gs), gắn vào `bangNgayLe_` (KPI, điểm danh, danh sách `ngayLe` gửi web), `dhLeNam_` (công suất Đơn hàng), `tkNgayLam_` (Thống kê). Không cần nhập sheet NgayLe. **Không sửa** chức danh Phạm Kiều Oanh.\n- (08/11) Chủ dự án giải thích: cơ cấu lương mới để **lương đóng BHXH = lương cơ bản**, phần còn lại chia thành các khoản khác. Claude đã nêu rủi ro: theo Luật BHXH 2024 (Đ.31) các khoản trả thường xuyên, ổn định mỗi kỳ vẫn tính vào tiền lương đóng BHXH; muốn hợp lệ thì các khoản đó phải thật sự biến động theo kết quả (KPI, doanh thu). Chờ chủ dự án quyết có nối \"Hiệu suất công việc\" với KPI web không.\n", "duong": "bo-nao/KPI/KPI Chính sách lương và cẩm nang.md", "lk": ["Đọc PDF ít tốn token", "KPI Quy trình sản xuất", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Cơm trưa", "nhom": "KPI", "txt": "# KPI Cơm trưa\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Báo cáo tháng]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n- **Cơm trưa (11/10, chủ dự án yêu cầu):** máy chủ `tests/com-trua.gs` (nối cuối Code.gs bởi va-code.py): sheet tự tạo `ThucDon` / `DangKyCom` / `SuatAnThang`; `napComTrua`, `dangKyCom` (**12/10: hai mốc theo hôm trước ngày ăn, thứ Hai -> Chủ nhật** – `COM_GIO_CHOT` 16 = hạn đăng ký (bếp chốt số, đặt đồ; `comHan_`/`comConHan_`, `muon`/`dsMuon` = lượt sau 16h, web `comMuonHtml`), `COM_GIO_KHOA` 22 = khóa cứng (`comKhoa_`/`comConMo_`/`comKhoaMsg_`; `dangKyCom`, `baoSuatNhom`, `dangKyComHo` trả `{ok:false, khoa:true}`); thucDon có `han/conHan/khoa/mo`, napComTrua có `gioChot/gioKhoa`; web `comNhac`: chưa đăng ký → \"Đăng ký trước 16:00…\", đã đăng ký → \"Được thay đổi đăng ký trước 22:00…\", quá 22:00 → \"🔒 Đã chốt\"; `comNut(ng, comMo(t))`; `luuThucDon` sau 22h vẫn lưu nhưng cảnh báo); **qua 12:00 ngày ăn** (`COM_GIO_AN`, `comDaAn` trong
