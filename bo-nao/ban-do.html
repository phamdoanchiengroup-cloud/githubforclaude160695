<style>
/* Bố cục: đồ thị ghi chú bên trái (dính khi cuộn), trang đọc bên phải; điện thoại xếp dọc. Màu theo nhận diện Rhino (than chì + vàng). */
:root{
  --bg:#f4f3ef; --mat:#ffffff; --vien:#d9d6cc; --chu:#24231f; --chu2:#5d5a52; --chu3:#8a867b;
  --vang:#b07d00; --vang-nen:#fbefcc; --luoi:#e7e4da;
  --g-batdau:#c48a00; --g-kpi:#11867d; --g-tcc:#7357c9; --g-chung:#6b7480;
  --f-chu:"Arimo","Helvetica Neue",Arial,sans-serif; --f-ma:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;
  --vang:#f7b829; --vang-nen:#3a3220; --luoi:#2f2f2d;
  --g-batdau:#f7b829; --g-kpi:#2fd3c6; --g-tcc:#b9a2ff; --g-chung:#aab5bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;
  --vang:#f7b829; --vang-nen:#3a3220; --luoi:#2f2f2d;
  --g-batdau:#f7b829; --g-kpi:#2fd3c6; --g-tcc:#b9a2ff; --g-chung:#aab5bc; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--chu);font:15px/1.6 var(--f-chu);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--vang);outline-offset:2px}

.dau{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 12px;border-bottom:1px solid var(--vien)}
.dau h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.dau h1 b{color:var(--vang)}
.so{font:12px var(--f-ma);color:var(--chu3);font-variant-numeric:tabular-nums}
.tim{position:relative;margin-left:auto;flex:1 1 240px;max-width:360px}
.tim input{width:100%;padding:8px 12px;border:1px solid var(--vien);border-radius:6px;background:var(--mat);color:var(--chu);font:inherit;font-size:14px}
.tim ul{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--mat);border:1px solid var(--vien);border-radius:6px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.tim li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:14px}
.tim li button:hover,.tim li button:focus-visible{background:var(--vang-nen)}
.tim li small{display:block;color:var(--chu3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.than{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 32px}
@media (min-width:900px){.than{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .do-thi{position:sticky;top:12px;height:calc(100vh - 110px)}}
.do-thi{position:relative;height:56vh;min-height:320px;border:1px solid var(--vien);border-radius:8px;background:var(--mat);overflow:hidden;touch-action:none}
.do-thi svg{display:block;width:100%;height:100%;cursor:grab}
.do-thi svg.keo{cursor:grabbing}
.nut-do{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.nut-do button,.chu-giai button{font:12px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:4px 9px;cursor:pointer}
.nut-do button{width:30px;padding:4px 0;font-size:15px}
.chu-giai{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px}
.chu-giai button{display:inline-flex;align-items:center;gap:6px}
.chu-giai button[aria-pressed="false"]{opacity:.45}
.cham{width:9px;height:9px;border-radius:50%;background:var(--c)}

.duong{stroke:var(--chu3);stroke-opacity:.35;stroke-width:1}
.duong.sang{stroke:var(--vang);stroke-opacity:.9;stroke-width:1.6}
.nut circle{fill:var(--c);stroke:var(--mat);stroke-width:2}
.nut text{font:var(--fs,11px) var(--f-chu);stroke-width:var(--sw,3px)!important;fill:var(--chu2);paint-order:stroke;stroke:var(--mat);stroke-width:3px;stroke-linejoin:round}
.nut circle.vung{fill:transparent!important;stroke:none!important}
.nut{cursor:pointer}
.nut.chon circle{stroke:var(--vang);stroke-width:3}
.nut.chon text,.nut.ke text{fill:var(--chu);font-weight:700}
.mo .nut:not(.chon):not(.ke),.mo .duong:not(.sang){opacity:.18}
.nut.an,.duong.an{display:none}
.xa .nut.phu:not(.chon):not(.trung):not(:hover):not(:focus) text{display:none}
.nut.trung circle{stroke:var(--vang);stroke-width:3}

.doc{min-width:0;background:var(--mat);border:1px solid var(--vien);border-radius:8px;padding:18px clamp(16px,3vw,28px) 28px}
.doc .nhan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--chu3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--vien);color:var(--chu2);font-size:12px}
.doc h2.tieu{margin:.4em 0 .2em;font-size:1.45rem;line-height:1.25;text-wrap:balance}
.noi{max-width:72ch}
.noi h1,.noi h2,.noi h3{line-height:1.3;text-wrap:balance;margin:1.3em 0 .4em}
.noi h1{font-size:1.25rem}.noi h2{font-size:1.1rem}.noi h3{font-size:1rem}
.noi p{margin:.6em 0}
.noi ul,.noi ol{padding-left:1.25em;margin:.5em 0}
.noi li{margin:.3em 0}
.noi li::marker{color:var(--chu3)}
.noi code{font:0.86em var(--f-ma);background:var(--luoi);padding:.05em .35em;border-radius:3px;overflow-wrap:anywhere}
.noi pre{overflow-x:auto;background:var(--luoi);padding:10px 12px;border-radius:6px}
.noi pre code{background:none;padding:0;white-space:pre}
.noi strong{font-weight:700}
.wl{color:var(--vang);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit}
.wl:hover{background:var(--vang-nen)}
.lien{margin-top:24px;padding-top:14px;border-top:1px solid var(--vien);display:grid;gap:10px;font-size:13px}
.lien h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--chu3)}
.lien .ds{display:flex;flex-wrap:wrap;gap:6px}
.lien .ds button{font:13px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.duong-file{font:12px var(--f-ma);color:var(--chu3);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

ipt]] và [[Quyết định của chủ dự án]] nếu có thay đổi. Chủ đề mới thì tạo ghi chú mới trong đúng thư mục, dòng 3 ghi `Liên quan: [[...]]`, và thêm vào mục lục này.\n3. Dựng lại bản đồ: `python3 bo-nao/tao-ban-do.py` rồi đăng lại `bo-nao/ban-do.html` lên đúng link Artifact ghi trong `CLAUDE.md`.\n4. Ghi chú viết ngắn, theo gạch đầu dòng; chi tiết kỹ thuật dài để trong ghi chú chủ đề, không dồn vào `CLAUDE.md`.\n", "duong": "bo-nao/00 Mục lục.md", "lk": ["Việc chờ chủ dự án", "Lần dán lên Apps Script", "Quyết định của chủ dự án", "KPI Tổng quan và cách dựng", "KPI Kiểm thử", "KPI Cập nhật bằng clasp", "KPI Phần giao diện tải sau", "KPI Tăng tốc và giao diện 29-09", "KPI Tăng tốc đợt 2 (21-10)", "KPI Cơm trưa", "KPI Báo cáo tháng", "KPI Sơ đồ nhà máy 3D", "KPI Bóng đá", "KPI Sửa nhỏ trên web", "KPI Bảo mật và vận hành", "KPI Sửa lỗi 21-10 và dữ liệu sheet", "KPI Màn đăng nhập Khắc laser", "KPI Màn đăng nhập demo chờ duyệt", "KPI Thao tác và hiệu ứng bên trong", "KPI Chia đôi màn hình", "KPI Rhino", "KPI Mai", "KPI Âm thanh và giọng Rhino", "KPI Lottie", "KPI Demo giao diện", "KPI Sửa lỗi giao diện", "KPI Demo đã bỏ", "Công cụ Claude"]}, {"id": "Lần dán lên Apps Script", "nhom": "Bắt đầu", "txt": "# Lần dán lên Apps Script\n\nNhóm: Chung · Cập nhật 21/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Tổng quan và cách dựng]] · [[00 Mục lục]]\n\n## Web KPI – đã dán (theo sheet thật đọc ngày 21/10)\n- Bản 18/10 đã lên: sheet thật có LichSuDinhMuc, HoiNhap, BoTriMay. Tên đăng nhập trùng, tài khoản người nghỉ việc, MaGhi thiếu đã được dọn.\n- Lần dán chung 18/10: chủ dự án đã nhận đủ 5 file + hướng dẫn (HUONG-DAN-CAP-NHAT.md mục \"LẦN DÁN CHUNG 18/10\"). – [[KPI Bảo mật và vận hành]], [[KPI Âm thanh và giọng Rhino]]\n\n## Web KPI – chưa dán\n- **Bản sửa 21/10** (4 lỗi chủ dự án báo + rà soát đợt 2): chỉ `Code.gs` + `Index.html`; hướng dẫn ở HUONG-DAN-CAP-NHAT.md mục \"BẢN SỬA 21/10\". Sau khi dán, có thể chạy tay `KIEM_TRA_DU_LIEU` để soát sheet. – [[KPI Sửa lỗi 21-10 và d  · Cập nhật 21/10/2026\nLiên quan: [[KPI Tăng tốc đợt 2 (21-10)]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\nChủ dự án 21/10: bấm \"Chi tiết\" một công nhân ở Bảng KPI và \"Xem hồ sơ\" tải lâu; muốn kiểu chia đôi: một bên danh sách, một bên thông tin người được bấm, và các tab tương tự.\n\n## Nguyên nhân chậm (đo trên dữ liệu thật 21/10)\n- `layLichSuKPI` đọc 14 sheet (~262.000 ô) để trả 3–4 KB; `hoSoNhanVien` đọc ~238.000 ô (cả NhatKySanXuat) để trả ~15 KB. Mỗi lần bấm ở bản thật mất vài giây vì đọc sheet.\n- Trình duyệt đã có sẵn từ lúc đăng nhập: điểm KPI của dòng (`layKPIKy`), `D.nhatky` + `D.choDuyet` (từ đầu tháng trước), `D.kcs`, `D.nhansu`.\n\n## Đã làm (chưa dán; chỉ Index.html) = va-index.py **mục 27** `tests/chia-doi/va-chia-doi.py` + `chia-doi.{css,js}` (mục CUỐI vì bọc hàm của mục trước)\n- Màn ≥1100px và `localStorage kpi_chia_doi` ≠ 'tat': khung `#cdPanel` cố định bên phải (`--cd-w: clamp(420px,40vw,580px)`, `--cd-top` = đáy header), `body.cd-mo #main` chừa lề phải.\n- `xemChiTietKPI`: hiện ngay 8 ô số từ dòng của `window.__kpiR` (bọc `veBangKPI`) + nút \"Xem hồ sơ\", rồi `layLichSuKPI` (chờ 350 ms để bấm ↓ liên tục không gọi thừa) vẽ bằng `veLichSu` vào `#ls_noidung`.\n- `xemHS`: dựng hồ sơ tạm từ `nv()`, `D.nhatky`+`D.choDuyet`, `D.kcs` → `veHS` (đã vá: có `window.__hsVao` thì vẽ vào khung, bỏ nút \"Về danh sách\"), rồi `hoSoNhanVien` thay bản đầy đủ. `edHS` đóng khung trước.\n- KPI quản lý: `window.__qlDs`, dòng `data-cd=\"ql|<maNV>\"`, `cdQL` hiện 6 chỉ số + điểm trừ vận hành (không gọi máy chủ).\n- Chung: dòng có nút Chi tiết / Xem hồ sơ tự được gắn `data-cd` (MutationObserver trên #main); bấm dòng mở chi tiết; ↑ ↓ Esc; tô sáng dòng (`tr.cd-chon`, chỉ nền – không dùng vạch sọc bên); cột phụ `COT_PHU` ẩn khi mở (`.cd-an`); sang tab khác tự đóng; đóng bong bóng Rhino khi mở, Rhino lùi sang trái khung; nút \"Kiểu cũ\" ↔ \"⧉ Chia đôi\" (trong cửa sổ lịch sử cũ và trang hồ sơ cũ). Màn hẹp giữ nguyên cách cũ.\n- Kiểm thử `tests/chia-doi-web.js` (21, bản xem thử `GIO=2026-10-21T10:00:00+07:00`). sua-loi-21-10-web, van-hanh-web, thao-tac-web, dang-nhap-web cho kết quả giống hệt trước.\n\n## Có thể mở rộng (chưa làm)\n- Các tab khác dạng danh sách → chi tiết: Duyệt sản lượng (từng công nhân), Máy móc, Nhật ký, Công đoạn của người (`xemCongDoan`).\n- Máy chủ: chỉ mục nhật ký theo người để lần tải đầy đủ cũng nhanh (hiện vẫn đọc cả sheet).\n", "duong": "bo-nao/KPI/KPI Chia đôi màn hình.md", "lk": ["KPI Tăng tốc đợt 2 (21-10)", "KPI Thao tác và hiệu ứng bên trong", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Cơm trưa", "nhom": "KPI", "txt": "# KPI Cơm trưa\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Báo cáo tháng]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n- **Cơm trưa (11/10, chủ dự án yêu cầu):** máy chủ `tests/com-trua.gs` (nối cuối Code.gs bởi va-code.py): sheet tự tạo `ThucDon` / `DangKyCom` / `SuatAnThang`; `napComTrua`, `dangKyCom` (**12/10: hai mốc theo hôm trước ngày ăn, thứ Hai -> Chủ nhật** – `COM_GIO_CHOT` 16 = hạn đăng ký (bếp chốt số, đặt đồ; `comHan_`/`comConHan_`, `muon`/`dsMuon` = lượt sau 16h, web `comMuonHtml`), `COM_GIO_KHOA` 22 = khóa cứng (`comKhoa_`/`comConMo_`/`comKhoaMsg_`; `dangKyCom`, `baoSuatNhom`, `dangKyComHo` trả `{ok:false, khoa:true}`); thucDon có `han/conHan/khoa/mo`, napComTrua có `gioChot/gioKhoa`; web `comNhac`: chưa đăng ký → \"Đăng ký trước 16:00…\", đã đăng ký → \"Được thay đổi đăng ký trước 22:00…\", quá 22:00 → \"🔒 Đã chốt\"; `comNut(ng, comMo(t))`; `luuThucDon` sau 22h vẫn lưu nhưng cảnh báo); **qua 12:00 ngày ăn** (`COM_GIO_AN`, `comDaAn` trong va-com.js, chỉ phía trình duyệt) thẻ thực đơn + tổng hợp ngày đó chuyển vào `<details>` \"…đã qua giờ ăn\" (`.cm-da-an`, `comTongHop1`), thanh `#combar` và đăng ký hộ bỏ ngày đó; **13/10: xem lại ngày đã qua** = `<details id=\"cmCu\">` \"Xem lại số suất ngày đã qua\" (`comCuHtml`/`comXemCu`: nút các ngày có thực đơn trong 7 ngày + ô chọn ngày bất kỳ, tải bằng `xemTongHopCom(token, ngay)` – chỉ người `comXem_`, dữ liệu còn tới khi chốt tháng; `comChep('cu')`); **bớt / đổi món (13/10)**: ThucDon cột `MonDoi` JSON `[{m, t}]` (tối đa `COM_MAX_MON_DOI`=3; t trống = chỉ bớt), DangKyCom cột `BoMon` JSON `{món: 'b'|'d'}` (nhóm: `{món: [bớt, đổi]}`); `dangKyCom/dangKyComHo/baoSuatNhom(…, bo)` – không truyền bo thì giữ lựa chọn cũ, báo Không ăn thì xóa; đăng ký hộ nhiều người không đè bo; `comBoNguoi_` (đổi mà món không có món thay → bớt), `comBoNhom_`; `comTongHop_` trả `monDoi:[{m,t,b,d,nau}]` + `x.mon`, `x.dsMon` (tên chỉ cho người được xem tên); napComTrua trả `thucDon[].monDoi`, `cuaToiBo`, `hoDK[…][3]`; web: form `#cmMd` 3 dòng món → món thay, ô chọn `comBoHtml`/`comBoLuu` trên thẻ (sau khi bấm Ăn), `comHoBo` trong đăng ký hộ, `comNhomMon` (nhóm, chỉ trong thẻ), `comMonDoiHtml` + cột \"Bớt / đổi món\", chép gửi bếp có dòng từng món, file lưu tháng ghi \"Ăn (không ăn …)\"; bảng tổng hợp bọc `.cm-cuon` cuộn ngang trên điện thoại. **Tách theo nơi ăn (13/10, cùng 1 thực đơn):** nhóm có suất ở nơi kia thì `BoMon` = `{món: [bớt, đổi, bớt nơi kia, đổi nơi kia]}` (`comBoNhom_(bo, ds, so, khac)`: 2 số đầu ≤ so − khac, 2 số sau ≤ khac; khac = 0 thì bỏ 2 số sau); `x.mon[m].bk/dk`; `monDoi[].noi.haNam/haNoi = {b, d, nau}`; web `comNhomMon` 2 cột Ở Hà Nội / Ở Hà Nam (`.co-kia`, `comKiaDoi` khi gõ ô nơi kia), `comMonDoiHtml` + `comMonDoiChu` (chép gửi bếp) tách nơi khi `comHaiNoi(th)`. Kiểm thử `tests/com-mon-doi.js` (35). **Chủ dự án 13/10: KHÔNG cần** đối chiếu điểm danh, suất phát sinh sau khóa, suất khách/người chưa có tài khoản, \"không ăn cho cả xưởng\", cá nhân đổi nơi ăn, cảnh báo bếp sửa món, giới hạn món thay, suất chay – đừng đề xuất lại. **người nghỉ dài hạn** (sheet `NghiDaiHan`, `comNghiDai_(ngay)` MaNV→Loai) chưa đăng ký thì `comTongHop_` tự tính không ăn (`dsKhongCT[].nghi`, web \"(tự động – Thai sản)\"), `hoDK[ngay][tk]=[0,'',loai]` để \"đăng ký ăn cho tất cả\" bỏ qua; đã đăng ký thì theo đăng ký; **nhóm báo cơm có suất ăn ở nơi kia** (12/10, chỉ tài khoản NHOM): cột `SoSuatNoiKhac` (SoSuat vẫn là TỔNG), `baoSuatNhom(token, ngay, so, khac)`, `comKhac_`, tổng hợp cộng `haNam/haNoi` theo nơi ăn + `sangNoiKhac` + `x.noiKhac/noiKhacTen`; napComTrua trả `cuaToiKhac`, `noiNha`, `noiKia`; web 2 ô `.cm-so-o` `[data-noi=nha|kia]`, dòng `.cm-sang-ghi`, `luuThucDon` / `xoaThucDon` (BEP + ADMIN), `comTongHop_` (người = tài khoản Đang dùng trừ NV nghỉ việc; không xưởng → nhóm `VP` tên \"Ban điều hành và trưởng bộ phận\" (`COM_TEN_VP`); tổng hợp có `haNam` / `haNoi` (`comHaNoi_`: mã nhóm `HNOI_*` = Hà Nội, còn lại kể cả xưởng = Hà Nam), dòng tổng cuối đổi thành \"Tổng tất cả\"; **tài khoản HR + QC KHÔNG tính suất cơm** (`comKhongTinh_`: không đăng ký, không vào tổng hợp, lượt cũ bị bỏ qua; HR vẫn báo thực đơn + xem tổng hợp, `quyen.khongTinh`); trợ lý TL vẫn ở nhóm VP; **chỉ trưởng phòng TP ăn cùng ban điều hành → suất vào nhóm VP (`comMx_`); phó phòng PP và trưởng bộ phận TBP vẫn tính theo xưởng / bộ phận** (chủ dự án 11/10); tên: ADMIN/HR/BEP mọi xưởng, TP xưởng mình), `dsKhongCT` = danh sách không ăn {ten, ma, xuong} (chủ dự án yêu cầu admin thấy đủ họ tên, mã NV, xưởng; web `comKhongHtml`); DangKyCom có cột MaNV, file lưu tháng có cột Mã NV; `comTongKetThang_` gọi trong `chotThangTuDong` trước `guiBaoCaoThang_`: ghi SuatAnThang, tạo bảng tính \"Đăng ký cơm trưa <kỳ>\" vào `bcThuMuc_(ky)`, rồi xóa DangKyCom/ThucDon của kỳ (lỗi Drive thì không xóa); báo cáo tháng `bcCom_`/`bcComHtml_` (bao-cao.gs). Vai trò mới **BEP**: `napDuLieuLoi_` trả dữ liệu rỗng. Web = va-index.py **mục 16** (`tests/com-trua/va-com.{py,css,js}`): `#combar` trên mọi trang (`comTai` sau `buildNav`, tự tải lại 5 phút), tab `com` cho mọi vai trò, `TABS.BEP`. Đăng ký hộ (11/10): `dangKyComHo(token, ngay, dsTk, an)` – TP/PP người trong xưởng mình, ADMIN mọi người; cột mới `DangKyHo` (tên người đăng ký hộ, `comSheet_` tự thêm cột thiếu); `napComTrua` trả `hoNguoi` + `hoDK[ngay][tk]=[an, ai]` và `cuaToiHo`; web `comHoHtml` (chọn ngày, tìm tên, lọc chưa đăng ký, nút đăng ký ăn cho tất cả người chưa đăng ký). Phạm vi (`comHoDuoc_`, chủ dự án 11/10): TP/PP chỉ xưởng mình; ADMIN + TL chỉ người khối văn phòng (tài khoản không gắn xưởng, nhóm `VP`). Đổi vai trò tài khoản có sẵn sang TL: sửa ô VaiTro trong sheet TaiKhoan (web chưa có nút đổi vai trò). Vai trò mới **TL = Trợ lý ban điều hành** (11/10): TABS.TL = Hướng dẫn, Tổng quan, Bảng KPI, Sơ đồ nhà máy, Cơm trưa; máy chủ không coi TL là ADMIN nên mọi hàm sửa từ chối (đã rà bằng gọi thử toàn bộ hàm công khai trên giả lập – chỉ hàm cơm trưa đổi dữ liệu; lưu ý cũ: `chayPhatNhapTre`, `chotThangTuDong`, `snapshotKPIHangNgay` là hàm trigger không kiểm tra phiên, ai gọi qua google.script.run cũng chạy được); cơm trưa TL như ban điều hành (báo thực đơn, đăng ký hộ mọi người, xem tên). Họ tên / mã NV trong tổng hợp cơm: chỉ ADMIN + TL (cả nhà máy) và TP (xưởng mình); BEP + HR chỉ thấy số. **Chế độ chỉ xem** (11/10, va-com.js `CHI_XEM_TAB`, `chiXemDon`): TL xem thêm Điểm danh, Công đoạn, Nhân sự, Máy móc; HR có các tab như TL (+ cơm trưa như TL: tên, báo thực đơn, đăng ký hộ khối VP) và SỬA được Hồ sơ nhân sự. Các tab chỉ xem được vẽ tạm với `ME.vaiTro='ADMIN'` (thấy toàn nhà máy) rồi ẩn nút / thẻ sửa (MutationObserver), `call()` chặn mọi hàm không phải hàm đọc (`laHamDoc_`). **Nhóm ngoài xưởng báo tổng số suất** (11/10, thay 4 bộ phận cũ – vai trò NV/TBP đã bỏ khỏi form, máy chủ từ chối tạo mới): `COM_BO_PHAN` = HNAM_BEP / HNAM_KTK / HNOI_MAY / HNOI_MKT / HNOI_STORE / HNOI_HCKT (thêm 11/10) (khai báo ở cả com-trua.gs và va-com.js, giữ trùng mã), không nằm trong PhongBan nên không vào KPI; vai trò `NHOM` (1 tài khoản / nhóm, chỉ tab Cơm trưa, `napDuLieuLoi_` trả rỗng) xem tổng hợp số suất toàn công ty như bếp (`comXem_` có NHOM, chỉ số, không tên), báo số suất mỗi ngày bằng `baoSuatNhom(token, ngay, so)` (0–`COM_MAX_SUAT`=300, sửa tới hết ngày ăn) → cột mới `SoSuat` của DangKyCom; `comTongHop_` thêm dòng `nhom:true` (an = số đã báo, `baoChua` + `nhomChua` nếu chưa báo), xếp sau các xưởng, trước VP; không tính vào số người; file lưu tháng có dòng \"(nhóm báo tổng)\". Web: `comNhom()`, ô `.cm-so-in` + `comBaoNhom` thay nút Ăn/Không ăn. Tài khoản bếp (vai trò BEP) không đăng ký suất, không tính vào số người; thanh/thẻ hiện số suất thay nút. Kiểm thử `tests/com-trua.js` (81, giả lập + DATA) và `tests/com-trua-web.js` (41, bản xem thử `GIO=2026-10-12T14:30:00+07:00`; đổi người trong trang qua `__MAY_CHU.taoPhien_`). gia-lap-kpi.js thêm `SpreadsheetApp.create`, `DriveApp.getFileById`.\n", "duong": "bo-nao/KPI/KPI Cơm trưa.md", "lk": ["KPI Báo cáo tháng", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Cập nhật bằng clasp", "nhom": "KPI", "txt": "# KPI Cập nhật bằng clasp\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[Lần dán lên Apps Script]] · [[KPI Tổng quan và cách dựng]] · [[KPI Tăng tốc đợt 2 (21-10)]] · [[00 Mục lục]]\n\nChủ dự án 21/10 nhờ \"tự dùng máy tính của tôi cài clasp\": phiên đám mây không có công cụ điều khiển máy tính, và Claude không được gõ vào cửa sổ lệnh → làm bộ cài bấm đúp cho Windows.\n\n- Thư mục `kpi-app/cai-dat-clasp/` (repo công khai nên tải được thẳng từ GitHub raw): `1-CAI-DAT.bat`, `2-CAP-NHAT.bat`, `3-KHOI-PHUC.bat` gọi `cai-dat.ps1`, `cap-nhat.ps1`, `khoi-phuc.ps1` (UTF-8 có BOM, CRLF – PowerShell 5.1 cần BOM), hàm chung `chung.ps1`, hướng dẫn `HUONG-DAN.md`.\n- Cài: winget cài Node.js LTS nếu thiếu → `npm i -g @google/clasp@2.4.2` (ghim bản 2.x để `fileExtension:\"gs\"` và cú pháp `deploy --deploymentId` không đổi) → mở trang bật Apps Script API → `clasp login` → hỏi Mã tập lệnh → `.clasp.json` + `clasp pull` vào `%USERPROFILE%\\KPI-AppsScript\\ma` → sao lưu → chọn bản triển khai web (bỏ @HEAD) → `cau-hinh.json` {scriptId, deployId, tuTrienKhai = manifest có \"webapp\"}.\n- Cập nhật: sao lưu (`clasp pull` → `sao-luu\\yyyy-MM-dd_HH-mm-ss`) → tải Code.gs + Index/SoDo/HoatAnh/AmThanh.html từ nhánh `claude/beautiful-ptolemy-f2j7za` (kiểm tra kích thước + có `function napDuLieu`) → ghi đè file .gs đang chứa `function napDuLieu` (tên có thể là \"Mã\"), xóa file html sai hoa/thường (vd. \"Sodo\") → `clasp push -f` → `clasp deploy --deploymentId` (giữ link). Khôi phục: chọn bản sao lưu → push + deploy.\n- Bẫy đã gặp khi thử: hàm PowerShell tên `Clasp` trùng lệnh `clasp` → tự gọi lại vô hạn (đã đổi `GoiClasp`, gọi `clasp.cmd` trên Windows); PowerShell 5 coi chữ in ra stderr là lỗi khi `ErrorActionPreference=Stop` → tạm đặt Continue khi gọi clasp.\n- Đã thử trên Linux bằng PowerShell 7.4.6 (tải về /tmp/pwsh) + \"clasp giả\" (scratchpad `thu-clasp/bin/clasp`): cả 3 bước chạy đúng. **Chưa chạy trên Windows thật / clasp thật** – lần đầu nên làm cùng chủ dự án.\n", "duong": "bo-nao/KPI/KPI Cập nhật bằng clasp.md", "lk": ["Lần dán lên Apps Script", "KPI Tổng quan và cách dựng", "KPI Tăng tốc đợt 2 (21-10)", "00 Mục lục"]}, {"id": "KPI Demo giao diện", "nhom": "KPI", "txt": "# KPI Demo giao diện\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Sửa lỗi giao diện]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[00 Mục lục]]\n\n- Demo giao diện (chủ dự án thích phong cách **thiết bị đo nhà máy**: kim lò xo, đồng hồ cơ, mặt tối; chê bộ 3D và 7 mẫu đầu demo-2 là \"xấu, không đạt\"). Mẫu đã duyệt nằm trong `kpi-app/mau-da-chon/`: `dong-ho-hieu-suat.html` (demo-2 số 8), `cum-dong-ho-xuong.html` (demo-3 số 1), `dong-ho-lat-dem-nguoc.html` (demo-3 số 8), `thuoc-truot-dinh-muc.html` (demo-4 số 5). `demo-4.html` (trừ số 5) và `demo-5.html` bị chê \"không ổn\" – chủ dự án muốn thêm **demo tương tác** và **giao diện nền**: `kpi-app/demo-tuong-tac.html` (6 thao tác nhập liệu) và `kpi-app/demo-giao-dien-nen.html` (khung web 4 kiểu nền × 3 bố cục) – cả hai cũng chưa vừa ý (\"trông như đồ chơi, không sát công việc\"). Hướng mới: **làm lại đúng màn hình đang dùng, đặt bản cũ cạnh bản mới**, bỏ trang trí giả đồ vật. Bắt đầu với `kpi-app/demo-duyet-san-luong.html` (dựa trên `vDuyetSL` thật), chờ góp ý.\n- **Demo giao diện mới (11/10, chờ chọn):** `kpi-app/demo-giao-dien-moi.html` (1 file tự chứa, số liệu MẪU, ảnh Rhino 3B nhúng base64): 3 màn Việc hôm nay (danh sách việc theo mức gấp, bảng xưởng, tiến độ ca so với giờ) / Bảng KPI (lọc 1 dòng, sắp xếp cột, bấm dòng mở 4 phần điểm, điện thoại thành danh sách) / KPI của tôi (câu \"thiếu bao nhiêu lên loại trên\", thước C/B/A, cột sản lượng ngày, Rhino gợi ý) × 2 hướng A sáng \"Giấy kỹ thuật\" (Be Vietnam Pro, xanh ngọc #0f766e) / B tối \"Rhino\" (Arimo, #2b2b2b + #f7b829); khung điện thoại dùng container query `app`. Impeccable detect: 0 lỗi.\n", "duong": "bo-nao/KPI/KPI Demo giao diện.md", "lk": ["Việc chờ chủ dự án", "KPI Sửa lỗi giao diện", "KPI Thao tác và hiệu ứng bên trong", "00 Mục lục"]}, {"id": "KPI Demo đã bỏ", "nhom": "KPI", "txt": "# KPI Demo đã bỏ\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n- Demo 3D lần 2 (08/10, chủ dự án hỏi \"3D cho xịn xò hơn\" dù trước đó chê bộ 3D \"như đồ chơi\"): `kpi-app/demo-3d.html` – 3D gắn đúng thao tác thật, CSS 3D thuần, cạnh bản hiện tại; chờ góp ý. Lưu ý kỹ thuật: khung kéo-xoay chỉ `setPointerCapture` sau khi kéo >6px, nếu không cú bấm vào phần tử con bị nuốt. **Chủ dự án bỏ qua 3D (08/10).**\n", "duong": "bo-nao/KPI/KPI Demo đã bỏ.md", "lk": ["Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Kiểm thử", "nhom": "KPI", "txt": "# KPI Kiểm thử\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[00 Mục lục]]\n\n## Dựng lại và chạy thử (từ `kpi-app/README.md`)\n```bash\npython3 kpi-app/tests/va-code.py && python3 kpi-app/tests/va-index.py      # tạo lại bản vá từ goc/\nTZ=Asia/Ho_Chi_Minh DATA=/đường/dẫn/csdl.json node kpi-app/tests/kiem-tra.js\nDATA=/đường/dẫn/csdl.json node kpi-app/tests/xem-truoc.js                  # http://localhost:8787\nDATA=/đường/dẫn/csdl.json OUT=/tmp/xem-thu-kpi.html node kpi-app/tests/tao-ban-xem-thu.js   # bản xem thử 1 file\n```\n- Dữ liệu JSON xuất từ Sheet có thông tin cá nhân: để ở scratchpad, **không commit**.\n- Giả lập Apps Script: `kpi-app/tests/gia-lap-kpi.js`. Kiểm thử web chạy trên bản xem thử (`F=<bản xem thử>`).\n\n## Số kiểm tra hiện có (theo các ghi chú)\n- Máy chủ: `tang-toc-2.js` 31 · `com-trua.js` 81 · `com-mon-doi.js` 35 · `bao-mat.js` 52 · `van-hanh.js` 26 · `sua-loi-21-10.js` 31 · `bong-da.js` 19 · `bao-cao.js`\n- Web: `chia-doi-web.js` 21 · `com-trua-web.js` 41 · `so-do-web.js` 37 · `mai-web.js` 32 · `thao-tac-web.js` 32 · `van-hanh-web.js` 29 · `lottie-web.js` 53 · `hieu-ung.js` 29 · `cho-chot-ngay.js` 16 · `dang-nhap-web.js` 15 · `am-thanh-web.js` 15 · `sua-loi-21-10-web.js` 9 · `manh-web.js` 8\n- Demo: `demo-dang-nhap-khac.js` 60 · `demo-thao-tac.js` 60 · `demo-dang-nhap-rhino.js` 42 · `demo-so-do.js` 23 · `demo-dang-nhap-hieu-ung.js` 22 · `demo-dang-nhap-hieu-ung-2.js` 20\n- Lỗi đã biết: `hieu-ung.js` còn 1 lỗi \"khung chờ tải bảng KPI\" có từ trước (bản xem thử trả kết quả quá nhanh). – [[KPI Bảo mật và vận hành]]\n\n## Mẹo sandbox\n- 3D cần gói `three@0.160.0` (lấy bằng `npm pack`, đặt `THREE=`); WebGL chạy bằng `--use-gl=swiftshader`. – [[KPI Sơ đồ nhà máy 3D]]\n- Lottie: sandbox chặn cdnjs nên nhúng lottie-web lấy từ npm (`LOTTIE=`). – [[KPI Lottie]]\n- Chromium không tin CA của proxy → tải trang ngoài bằng `page.route` + Node `fetch` (NODE_USE_ENV_PROXY=1); ffmpeg đủ codec lấy từ pip `imageio-ffmpeg`. – [[KPI Màn đăng nhập Khắc laser]]\n", "duong": "bo-nao/KPI/KPI Kiểm thử.md", "lk": ["KPI Tổng quan và cách dựng", "00 Mục lục", "KPI Bảo mật và vận hành", "KPI Sơ đồ nhà máy 3D", "KPI Lottie", "KPI Màn đăng nhập Khắc laser"]}, {"id": "KPI Lottie", "nhom": "KPI", "txt": "# KPI Lottie\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Demo giao diện]] · [[00 Mục lục]]\n\n- Demo Lottie: `kpi-app/demo-lottie.html` (4 chỗ: chờ báo cáo, duyệt xong, trang trống, mất mạng; hoạt ảnh tự vẽ `kpi-app/lottie/*.json` bằng `tests/tao-lottie.py`; sandbox chặn cdnjs nên nhúng thẳng lottie-web lấy từ npm) – chủ dự án duyệt cả 4, **đã gắn vào web thật** (va-index.py mục 8, kiểm thử `tests/lottie-web.js`); demo Lottie đợt 2 `kpi-app/demo-lottie-2.html` (chốt tháng, điểm danh, CN gửi sản lượng, xuất Excel, kỳ chưa có dữ liệu, hết phiên; sinh bằng `tests/tao-lottie-2.py`, hàm chung `tests/lottie_cu.py`) – chủ dự án duyệt, **đã gắn vào web** (va-index.py mục 9; hết phiên không tự tải lại trang nữa). Demo Lottie đợt 3 `kpi-app/demo-lottie-3.html` (trả lại sản lượng, máy đang sửa, ghi vi phạm, nghỉ dài hạn, thêm nhân sự, đổi mật khẩu; `tests/tao-lottie-3.py`) – chủ dự án duyệt, **đã gắn vào web** (va-index.py mục 10). **Lỗi đã sửa 07/10:** hai hiệu ứng \"thanh mọc từ 0\" (`play` cũ trong goc + `hieuUngMoi` của giao-dien-moi.html) chạy chồng làm thanh `.hbar .hfill` (So sánh hiệu suất giữa các xưởng) kẹt ở 0 – nay cùng đọc chiều rộng thật qua `data-w` (va-index.py mục 11, kiểm tra trong `tests/hieu-ung.js`). Demo Lottie đợt 4 `kpi-app/demo-lottie-4.html` (chốt ca, đề xuất định mức, miễn trừ KPI, cấp lại mật khẩu có nút Chép, gán công đoạn, thanh lý máy; `tests/tao-lottie-4.py`) chờ góp ý, chưa gắn vào web.\n- Quy ước hoạt ảnh Lottie: tự vẽ bằng `tests/tao-lottie*.py` (hàm chung `tests/lottie_cu.py`), màu CY #2fd3c6 / XAM #aab5bc / AM #f0b04e / DO #f26b6b; mỗi đợt làm demo \"Hiện tại\" cạnh \"Có Lottie\", chủ dự án duyệt rồi mới gắn vào web (va-index.py, mỗi đợt một mục mới), luôn có hình tĩnh dự phòng `LT_TINH` và tôn trọng giảm chuyển động. Chỉ nói đúng chức năng thật trong câu chữ hoạt ảnh (đã kiểm tra thông điệp máy chủ).\n", "duong": "bo-nao/KPI/KPI Lottie.md", "lk": ["Việc chờ chủ dự án", "KPI Demo giao diện", "00 Mục lục"]}, {"id": "KPI Mai", "nhom": "KPI", "txt": "# KPI Mai\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Rhino]] · [[00 Mục lục]]\n\n- Chờ góp ý: `kpi-app/demo-duyet-san-luong.html`, `kpi-app/demo-lottie-4.html`, `kpi-app/demo-huong-dan-cn.html` (nhân vật anime Mai hướng dẫn công nhân nhập sản lượng khi đăng nhập lần đầu; SVG tự vẽ kiểu **chibi** (08/10: chủ dự án muốn dễ thương hơn, mặt lấy cảm hứng ảnh AI của họ – tóc bob nâu đen mái lệch, mắt nâu mật ong, khuyên tai; áo khoác đồng phục thể thao kín đáo; KHÔNG dùng ảnh gốc vì có logo LA Dodgers/CrossFit/Rogue và trang phục hở) – nguồn chung `kpi-app/tests/mai/mai-chibi.js`, chép vào biến `MAI`, các bước trong `BUOC`, kiểm tra theo quy tắc `cnGui`; khi gắn vào web: gọi từ `vaoHeThong` cho vai trò CN nếu chưa có cờ đã xem, rọi vào phần tử thật của `vCNNhap`). Và `kpi-app/demo-khau-hieu.html` (Mai nói khẩu hiệu khích lệ ở 6 chỗ, 33 câu theo 6 chủ đề, đổi theo ngày; giọng khen, không chê; không bịa số liệu web không có).\n- **Mai đã gắn vào web (08/10, chủ dự án nói \"Do your best\")** – `kpi-app/tests/mai/va-mai.py` = mục 12 của va-index.py (exec): `maiChao` (mỗi ngày 1 lần, lùi lại nếu đang hướng dẫn), `maiBang` (khẩu hiệu của ngày ở `vHomNay` + `vCNNhap`), `maiTourCN` (rọi sáng phần tử thật, KHÔNG tự gõ vào ô; tự mở lần đầu, khóa `kpi_mai_hd_cn_<tk>`; nút \"? Hướng dẫn nhập\"), `maiXacNhan` chen vào `cnGui` trước `congNhanGuiSanLuong` (đọc lại từng dòng + tổng, cảnh báo >5.000; \"Sửa lại\" gọi `huy`), `maiKhenGui` + `maiChuoi` (chuỗi ngày gửi đều, bỏ CN), `maiKPI` trong `vKPICaNhanToi` (số % còn thiếu tính từ `loai`), `maiNghi` 10:00/15:00, nút `#btnMai` tắt/bật (`kpi_mai`='tat'). Không làm \"tin vui cả xưởng\" vì web chưa có kế hoạch tháng theo xưởng. Kiểm thử `tests/mai-web.js` (32, đặt múi giờ Asia/Ho_Chi_Minh). Câu khẩu hiệu đang nằm trong mã (`MAI_KH`); việc tiếp theo có thể: chuyển sang sheet `KhauHieu`.\n", "duong": "bo-nao/KPI/KPI Mai.md", "lk": ["KPI Rhino", "00 Mục lục"]}, {"id": "KPI Màn đăng nhập Khắc laser", "nhom": "KPI", "txt": "# KPI Màn đăng nhập Khắc laser\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập demo chờ duyệt]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[KPI Rhino]] · [[00 Mục lục]]\n\n- Demo màn đăng nhập (08/10): `kpi-app/demo-dang-nhap.html` – 5 kiểu A Bản vẽ kỹ thuật / B Dây chuyền 5 xưởng / C Mai chào đón / D Thẻ chấm công / E Bảng điều khiển ca; nguồn `kpi-app/tests/dang-nhap/demo.src.html` dựng bằng `tao-demo.py`; kiểm tra `tests/demo-dang-nhap.js`. Chủ dự án chọn **giữ màn bi-a hiện tại nhưng xịn hơn + thêm Mai** → `kpi-app/demo-dang-nhap-bi-a.html` (bản mới cạnh bản cũ; nguồn `kpi-app/tests/dang-nhap-bi-a-2.html`, giữ nguyên API `bbCho/bbTrung/bbTruot/bbTha/bbXep/bbChu/bbKhoiDong`; Mai vẽ trễ qua `bbMaiNap` vì MAI_SVG (mục 12) nạp sau màn đăng nhập; id gradient của Mai đổi thành `gbb*` vì #gate bị ẩn sau khi vào). Bản góc bàn nỉ xanh + bi vàng KPI bị chê \"xấu quá\" → làm lại: giữ nguyên bản cũ, chỉ thêm chân dung Mai tròn cạnh lời chào (đang là nội dung `dang-nhap-bi-a-2.html`). Chủ dự án vẫn muốn **đẳng cấp hơn**, gợi ý tham khảo rhino-billiards.com (hãng cơ carbon Hà Nội; trang bị chặn trong sandbox). Đã xin ảnh chụp trang, logo, ảnh cận cảnh cơ, video ngắn; đề xuất 3 hướng dùng ảnh/video thật: A Phòng chụp sản phẩm, B Vân carbon, C Xưởng chế tác (Mai giữ dạng chân dung nhỏ). Chủ dự án mở mạng → đọc được rhino-billiards.com: **RHINO là thương hiệu của Carbon Billiards Co., Ltd.** (công ty chủ dự án); nhận diện: than chì #2b2b2b, vàng #f7b829, chữ Arimo, logo tê giác trắng \"MADE BY VIETNAM\". Đã làm `kpi-app/demo-dang-nhap-rhino.html` (nguồn `kpi-app/tests/dang-nhap-rhino.html`, cùng API bb*; trái = phòng trưng bày 4 ảnh studio thật Must/Eclipse II/Retro II/Must Pool Cue đã cắt bỏ chữ quảng cáo, lưu ở `kpi-app/anh/rhino/` (~430 KB, chèn base64 qua `anh_rhino()` trong `tests/dang-nhap/tao-demo-bi-a.py`); phải = bảng than chì, nút vàng, Mai chân dung tròn). Kiểm tra `tests/demo-dang-nhap-rhino.js` (42); đã ghép thử vào web: mai-web 32, lottie-web 53, hieu-ung 29 đạt, Index.html ~1,5 MB. Chủ dự án khen \"khá đẹp\" nhưng muốn **độc đáo, khác web Rhino hơn** (09/10) → `kpi-app/demo-dang-nhap-khac.html` **\"Khắc laser\"** (nguồn `kpi-app/tests/dang-nhap-khac.html`; nền = khung hình đầu video khắc laser của hãng, đã xóa logo in sẵn + chỉnh tông tối, `anh/rhino/khac-laser.jpg` 98 KB, placeholder `{{RH_KHAC}}`; gõ mã nhân viên → laser khắc từng ký tự lên ngọn cơ số 3 (SVG viewBox 1600x900 cùng ảnh, trục `LK.x0=671,y0=430,góc -82.4°`); mật khẩu chỉ lóe tia, không khắc; sai = tia đỏ + chữ mờ; đúng = chữ vàng + vệt sáng; bảng kính nổi bên phải; điện thoại: ảnh 50vh `xMinYMid slice` + `display:flow-root` chống lọt margin). Demo đặt 3 bản cạnh nhau (Khắc laser / Phòng trưng bày / Hiện tại). Kiểm tra `tests/demo-dang-nhap-khac.js` (54); ghép thử vào web: mai-web 32, lottie-web 53, hieu-ung 29, cho-chot-ngay 16 đạt, Index.html ~0,95 MB. **Chủ dự án chọn Khắc laser (09/10) → ĐÃ GẮN VÀO WEB**: va-index.py mục 5 đọc `tests/dang-nhap-khac.html` + `anh_rhino()` (module chung `tests/dang-nhap/anh_rhino.py`, chèn ảnh + font base64), mục 4b thêm Arimo, `tests/tao-xem-thu.py` cũng dùng bản này; bản bi-a cũ vẫn ở `tests/dang-nhap-bi-a.html`. Theo góp ý \"font khác + khắc đúng dọc thân\": font khắc Orbitron (tự nhúng, cắt còn A–Z 0–9 . _ -; demo có nút đổi Michroma/Oswald/Saira, các font ở `anh/rhino/font/`), trục đo lại từ ảnh: tâm x = 0.1464·y + 616.2, thân rộng ~139px, **góc chữ −98,33°** (bản đầu xoay ngược chiều −82°, đó là lý do trông lệch), mã tối đa 14 ký tự, tự thu cỡ chữ (`lkCo`), dải màu trụ tròn `#lkTru`. Kiểm tra `tests/demo-dang-nhap-khac.js` (60, có kiểm góc + font). **13/10:** đăng nhập đúng thì laser khắc lại **2 chữ cuối họ tên thật** (`lkKhacTen` trong `bbTrung`, font Arimo có dấu – Orbitron không có dấu; `lkXep` trả về mã nếu lỗi), thời gian vào chậm thêm ~0,7 giây; tên khắc thấp hơn mã, sát mặt cát (`LK.tenLech`=125: `LK.lech` dời điểm đầu chữ, `lkDauBut` + `lkCo` tính theo). Tải trang trong sandbox: Chromium không tin CA của proxy → chụp trang bằng `page.route` + Node `fetch` (NODE_USE_ENV_PROXY=1); ffmpeg đủ codec lấy từ pip `imageio-ffmpeg`.\n- **Hiệu ứng thêm cho màn Khắc laser (09/10, chờ duyệt):** chủ dự án hài lòng màn hiện tại, muốn thêm (1) màn tối với **sợi dây kéo bật đèn** (`lkDay`/`lkBatDen`: kéo >50px, bấm hoặc Enter; đèn chớp kiểu đèn tuýp rồi ô nhập hiện) và (2) **nút Đăng nhập chạy trốn** khi chưa điền đủ (`lkNe`/`lkNutVe`, chỉ máy có chuột; né 6 lần thì đứng yên lắc; Enter/cảm ứng vẫn bình thường). Cả hai nằm trong `tests/dang-nhap-khac.html` sau công tắc `LK_HU = {day, chay}` – **mặc định TẮT** nên Index.html chưa đổi; khi duyệt: đổi mặc định thành true rồi dựng lại Index.html. Demo `kpi-app/demo-dang-nhap-hieu-ung.html` (nguồn `tests/dang-nhap/demo-hieu-ung.src.html`, dựng bằng `tao-demo-bi-a.py`), kiểm tra `tests/demo-dang-nhap-hieu-ung.js` (22).\n- **Hiệu ứng đợt 2 (09/10, chờ duyệt) – chủ dự án chọn: phần A mục 1, 2, 4, 5, 6 (bỏ \"giữ để vào ca\") và toàn bộ phần B (mục 7–16); mọi hiệu ứng phải chạy trên điện thoại.**\n  - Phần A (màn đăng nhập) nằm trong `tests/dang-nhap-khac.html`, thêm cờ vào `LK_HU` (mặc định tắt): `cham` = nút nhảy khi chạm (`lkChayCham`, chặn click ở pha capture; nhảy 3 lần rồi để login() báo lỗi; máy có chuột vẫn dùng kiểu né `lkChay`, mỗi lúc một kiểu), `cua` = cửa cuốn (`lkCua`/`lkMoCua`, thay dây kéo; kéo >1/3 hoặc bấm tay nắm/Enter), `mat` = mắt Mai theo chữ (`lkMat`, dịch con ngươi trong `.mat-g`) + bịt tai khi Caps Lock (`lkCaps`, hình `BB_TAI`), `ket` = két sắt sai 3 lần khóa 30 giây (`lkKhoa`, nhớ ở localStorage `lk_khoa_den`; chỉ là nhắc phía trình duyệt), `gio` = theo giờ (`lkGio`, `window.LK_GIO` để giả lập; ca đêm 22–5h tông vàng ấm `lk-dem`). Lời chào 22–24h đổi thành \"Chúc ca đêm thuận lợi\". Demo có công tắc + giờ giả lập: `kpi-app/demo-dang-nhap-hieu-ung-2.html` (nguồn `tests/dang-nhap/demo-hieu-ung-2.src.html`, khung nằm trong `<textarea>` và dựng lại srcdoc khi đổi công tắc), kiểm tra `tests/demo-dang-nhap-hieu-ung-2.js` (20); đợt 1 `tests/demo-dang-nhap-hieu-ung.js` (22) đã cập nhật (điện thoại giờ nhảy khi chạm).\n", "duong": "bo-nao/KPI/KPI Màn đăng nhập Khắc laser.md", "lk": ["KPI Màn đăng nhập demo chờ duyệt", "KPI Thao tác và hiệu ứng bên trong", "KPI Rhino", "00 Mục lục"]}, {"id": "KPI Màn đăng nhập demo chờ duyệt", "nhom": "KPI", "txt": "# KPI Màn đăng nhập demo chờ duyệt\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập Khắc laser]] · [[Việc chờ chủ dự án]] · [[00 Mục lục]]\n\n- **Demo hiệu ứng động màn đăng nhập đợt 3 + video nền Remotion (11/10, chờ duyệt):** `kpi-app/demo-dang-nhap-hieu-ung-3.html` (dựng bằng `tests/dang-nhap/tao-demo-hieu-ung-3.py`: lấy `khung()` của tao-demo-bi-a.py + exec `mai/va-rhino.py` lên khung để giống web; công tắc dựng lại srcdoc). Mã `tests/dang-nhap/hieu-ung-3.{css,js}`, cờ `window.LK_HU3 = {bui, quet, nghieng, chu, go, vao, video}`: bụi carbon canvas `.lk3-bui`, vệt sáng `.lk3-quet`, nghiêng `lk3-ng` (scale 1.035 → `#gate` phải `overflow-x:clip`, nếu không điện thoại tràn ngang), tiêu đề khắc dần (chờ cửa cuốn mở, `lk-chuabat`), lời Rhino gõ từng chữ (bọc `bbMai`), chuyển cảnh `.lk3-man` (bọc `bbTrung`, thêm 1,5 giây), video `.lk3-video` nằm dưới SVG nền, khớp khung + kiểu cắt (`xMin` điện thoại), ẩn `image.anh` khi đang phát, tự dừng khi #gate ẩn. Video Remotion: nguồn `tests/dang-nhap/remotion/nen.jsx` (+ README cách dựng; Remotion 4.0.534 cài từ npm được, render bằng `--browser-executable=/opt/pw-browsers/chromium_headless_shell-1194/...`), kết quả `anh/rhino/nen-khac-laser.{webm 288 KB, mp4 408 KB}` (lặp 10 giây, ảnh đứng yên để chữ khắc khớp ngọn cơ). Chromium của Playwright không giải mã H.264 → thử nghiệm dùng WebM; web thật nên nhúng WebM + MP4 (`LK_VIDEO` nhận danh sách `[[src, type]]`). Chưa gắn vào web.\n- **Demo màn đăng nhập mới \"Trạm khắc\" (11/10, chờ duyệt):** `kpi-app/demo-dang-nhap-tram-khac.html` (dựng bằng `tests/dang-nhap/tao-demo-tram-khac.py`, nguồn trang `demo-tram-khac.src.html`), đặt cạnh màn hiện tại. `tests/dang-nhap/tram-khac.{css,js}` chồng lên `dang-nhap-khac.html` (giữ ảnh ngọn + khắc laser + API bb*, bọc lkVe/lkLua/bbTrung/bbTruot/bbXep): ảnh phủ kín, bỏ tấm kính; bảng điều khiển ngang đáy (lưới `mai tk mk nut` / `mai dong dong loi`, h1 + gsub ẩn cho trình đọc màn hình); vòng ngắm đầu khắc `#tkNgam` + đường ghi chú trong SVG nền (điện thoại chỉ giữ vòng ngắm); bảng đọc số `.tk-doc` góc phải trên (mã, ký tự /14, trạng thái; không hiện gì về mật khẩu). Mật khẩu thử trong demo: `demo`. Khi duyệt: nối 2 file vào mục 5 của va-index.py (sau dang-nhap-khac.html).\n- **Demo 5 kiểu màn đăng nhập \"đang thịnh hành\" (09/10, đang dở):** `kpi-app/demo-dang-nhap-xu-huong.html` – A Kính lỏng (Liquid Glass), B Cực quang + hạt phim + viền đèn rọi, C Lưới bento, D Chữ động cỡ lớn, E Thẻ nhân viên hologram 3D; theo nhận diện Rhino + Mai chân dung (che mắt/lo/cổ vũ qua `voiMai`). Nguồn `tests/dang-nhap/xu-huong.css` + `xu-huong.js`, dựng bằng `tests/dang-nhap/tao-xu-huong.py` (dùng lại khung `demo.src.html`). Còn lại: làm dịu lớp hologram kiểu E (đang `color-dodge` hơi sặc sỡ), viết kiểm thử, gửi chủ dự án. Chủ dự án hỏi tự tạo video từ tư liệu Rhino: đã trả lời (dựng/ghép bằng ffmpeg + hoạt ảnh tự vẽ được; video AI mới qua Everygen tốn credit – chờ chủ dự án quyết).\n", "duong": "bo-nao/KPI/KPI Màn đăng nhập demo chờ duyệt.md", "lk": ["KPI Màn đăng nhập Khắc laser", "Việc chờ chủ dự án", "00 Mục lục"]}, {"id": "KPI Phần giao diện tải sau", "nhom": "KPI", "txt": "# KPI Phần giao diện tải sau\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Sơ đồ nhà máy 3D]] · [[KPI Âm thanh và giọng Rhino]] · [[KPI Lottie]] · [[00 Mục lục]]\n\n- **Phần giao diện tải sau (12/10, chủ dự án: \"tách cho nhẹ\")** = va-index.py **mục 19** `tests/manh/va-manh.py` + máy chủ `tests/manh.gs` (`layManhGiaoDien(token, ten)`, `MANH_GD` = SoDo: ADMIN/TP/TL/HR, HoatAnh: mọi tài khoản đã đăng nhập; đọc `HtmlService.createHtmlOutputFromFile(ten).getContent()`). Hai file HTML MỚI trong Apps Script, sinh khi dựng Index: `kpi-app/SoDo.html` (mục 15 ghi ra thay vì nhúng; Index chỉ còn hàm chờ `vSoDo` gọi `taiManh`, bản thật đặt `window.__sdDaNap`) và `kpi-app/HoatAnh.html` (`LT_DATA`; Index để `var LT_DATA=null`, `ltNap` tải trước, chưa có thì hình tĩnh `LT_TINH`; tải nền 2,5 s sau `vaoHeThong`). Trình duyệt: `taiManh(ten, cb)` + `ganManh_` (chèn style/textarea, chạy `<script>`), nhớ localStorage `kpi_manh_<ten>_<MANH_VER>` (md5 10 ký tự lúc dựng). Mục 18 sửa luôn SoDo.html. Đã bỏ base64 trong ghi chú dang-nhap-khac.html, cửa cuốn dùng lại logo `.lk-dau img`, bỏ font LkMic/LkOsw/LkSai khỏi web. Index.html 1.500 → 751 KB. Bản xem thử nhúng 2 file vào `window.__MANH` (tao-ban-xem-thu.js), gia-lap-kpi.js có `createHtmlOutputFromFile`. Kiểm thử `tests/manh-web.js` (8).\n", "duong": "bo-nao/KPI/KPI Phần giao diện tải sau.md", "lk": ["KPI Sơ đồ nhà máy 3D", "KPI Âm thanh và giọng Rhino", "KPI Lottie", "00 Mục lục"]}, {"id": "KPI Rhino", "nhom": "KPI", "txt": "# KPI Rhino\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Mai]] · [[KPI Âm thanh và giọng Rhino]] · [[KPI Màn đăng nhập Khắc laser]] · [[00 Mục lục]]\n\n- **ĐÃ THAY MAI BẰNG TÊ GIÁC RHINO TRÊN WEB (11/10, chủ dự án chốt mẫu 3B)** = va-index.py **mục 17** `tests/mai/va-rhino.py` (chạy cuối): ảnh `anh/rhino-mascot/rhino-3b-nen-trong.webp` (cắt nền bằng rembg model `isnet-anime`, ngưỡng alpha 40, 415×480, 30 KB) → `MAI_SVG` = 1 thẻ `<image class=\"rh-anh\">` trong khung 200×270 nên mọi `maiHinh()` / chân dung đăng nhập tự đổi; màn đăng nhập viewBox `50 26 100 100` (đầu), bỏ `BB_CHE`/`BB_TAI`; tên hiển thị \"Mai\" → `RH_TEN`='Rhino' (regex chữ đứng riêng, tránh base64), nút đầu trang 🦏; ảnh tĩnh (mất tư thế chỉ tay/che mắt/mắt dõi theo), chỉ nhún nhẹ `rhNhun`. Hàm/khóa `mai*`, `kpi_mai` giữ nguyên. Kiểm thử đã sửa: mai-web 32, dang-nhap-web 15, thao-tac-web 32. Nguồn Mai cũ (mai-chibi.js, các demo) vẫn còn; bỏ mục 17 là về Mai. Chưa có tên riêng cho tê giác.\n- **Mẫu hình tê giác Rhino bằng AI (11/10):** chủ dự án chê bản SVG tự vẽ \"xấu\", muốn vài mẫu hình để chọn trước (chưa cần hiệu ứng). Everygen báo chưa có gói đăng ký → vẽ bằng Figma AI (`mcp__Figma__generate_image`, plan `team::1667235749642739162`, model gemini-3.1-flash-image, chủ dự án đồng ý tốn credit). 6 mẫu gốc 1024px ở `kpi-app/anh/rhino-mascot/mau-1..6.png` (1 anime cel áo khoác, 2 kawaii mũ bảo hộ + gi-lê phản quang, 3 anime ngầu vác cơ bi-a, 4 sticker chibi hoodie vàng, 5 hoạt hình 3D áo polo chỉ tay, 6 phẳng tối giản vest đen cúi chào); trang chọn `kpi-app/demo-rhino-mau.html` (ảnh nhúng base64 560px). Khi chọn xong: vẽ thêm các tư thế cùng phong cách (dùng ảnh mẫu làm tham chiếu) rồi mới gắn vào web. Chủ dự án chọn **mẫu 3** nhưng đổi cơ gỗ thành cơ carbon / cơ Retro → `mau-3a-carbon.png`, `mau-3b-retro.png` (prompt mô tả Retro II: ngọn carbon, cán gỗ vân nâu hổ phách, vòng bạc khảm ô vuông đen; Figma AI không nhận ảnh tham chiếu nên chỉ tả bằng chữ; lần vẽ đầu ra 2 cây cơ / cơ lơ lửng → vẽ lại), trang so sánh `kpi-app/demo-rhino-mau-3.html`.\n- **Demo nhân vật tê giác Rhino thay Mai (11/10, bị chê xấu – bỏ):** `kpi-app/demo-rhino.html` (dựng bằng `tests/mai/tao-demo-rhino.py`) – SVG `tests/mai/rhino-chibi.js` (biến `RHINO`, cùng viewBox 200×270 và cùng lớp `duoi`/`than-tren`/`tay-chi`/`mat-g`/`mieng-*`/`may-*`/`mo-hoi`/`lap-lanh` như Mai nên dùng lại nguyên CSS `MAI_CSS`; gradient id `r*` không trùng `g*` của Mai; thêm lớp `tai-p` vẫy tai). Demo đặt Mai cạnh tê giác ở 5 chỗ: tư thế, góc màn hình, dải khẩu hiệu, hướng dẫn + hộp đọc lại, chân dung màn đăng nhập. Chưa có tên riêng (tạm \"Rhino\"); khi duyệt còn phải vẽ lại hình bịt tai Caps Lock (`BB_TAI`) của màn đăng nhập.\n", "duong": "bo-nao/KPI/KPI Rhino.md", "lk": ["KPI Mai", "KPI Âm thanh và giọng Rhino", "KPI Màn đăng nhập Khắc laser", "00 Mục lục"]}, {"id": "KPI Sơ đồ nhà máy 3D", "nhom": "KPI", "txt": "# KPI Sơ đồ nhà máy 3D\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Phần giao diện tải sau]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\n- **File 3D chủ dự án gửi (10/10):** \"Nhà máy Carbon Billiards 3D\" (three.js 0.160 qua jsdelivr, 3 tầng theo bản vẽ BTM-01/02/03, phòng có số người, máy theo ký hiệu bản vẽ). Chủ dự án đồng ý làm demo → đã chép vào `kpi-app/so-do/nha-may-3d.html` (nguồn dựng demo) và làm `kpi-app/demo-so-do-nha-may.html` (xem README: 2D SVG + 3D vá thêm nút Màu, `SS` dùng chung, ghép khu↔xưởng tạm `GHEP`, số liệu và máy bảo trì là MẪU; kiểm tra `tests/demo-so-do.js` 23, cần gói npm three@0.160.0 vì sandbox chặn jsdelivr; WebGL chạy bằng `--use-gl=swiftshader`). Chủ dự án thử nút \"Ảnh như thật\" (dò tia sáng) rồi bảo **không cần** → đã gỡ; thay vào đó chỉnh mô hình theo ảnh phối cảnh DELCO + video flycam chủ dự án gửi (khối ốp nhôm sẫm phía Bắc suốt chiều sâu tòa điều hành, logo RHINO vàng, mái tầng 4 sáng, tường đỉnh xưởng thấp, cờ). Sân trước cổng (09/10, làm lại theo 2 ảnh chủ dự án chỉ định: mặt đứng cổng + chim bay): cổng 2 làn y 0–10 có mũi tên, barie + nhà bảo vệ sát hàng rào phía Nam (y −8…−1.4), tường biển tên y 10.5–19.5 + cổng xếp + cột vàng đen, dải cỏ lối đá bước + 3 cột cờ sau tường, bãi 5 xe một hàng song song hàng rào (y 20–34, xe quay đầu vào nhà), nhà phụ trợ ở góc Bắc, hai bồn cây hai bên bậc sảnh (giữa để trống làm đường vào sảnh), dải bụi cây trong/ngoài hàng rào, đèn cao trong sân; bụi cây từng bị trắng do chỉ số màu âm – đã sửa. Phía sau xưởng (09/10, theo phối cảnh phía sau + video): `SITE.x1`=116; kho phụ 1 tầng x 47–61 y 6–34 (mái nóc song song đường, hàm `shedY`), bãi cỏ x 64–90 có nhà bơm PCCC + bể ngầm, dãy nhà xe chữ L cuối đất: nhà xe 2 bánh khung thép để trống x 92–112 y 8–38.5 (xe máy `xeMay`), chân L nhà rác/kho kín x 86–112 y −6…8 có thùng rác phân loại; đường xe tải phía Nam đi thẳng tới cuối. Video thực tế: xưởng mặt trắng có sọc đen gãy khúc, giàn thang thép xanh phía Nam tòa điều hành. Chờ góp ý. **ĐÃ GẮN VÀO WEB (10/10, \"Áp dụng lên web đi\")** = va-index.py **mục 15** (`tests/so-do/va-so-do.py` + `.css/.js`, vá 3D chung `tests/so-do/va_3d.py`): tab `sodo` \"Sơ đồ nhà máy\" (ADMIN/TP, nhóm Hôm nay) – KPI tháng này từ `D.nhatky` đã chốt (cách tính như So sánh hiệu suất), sĩ số `siSoTatCaXuong` (chỉ giữ số đếm; TP chỉ xưởng mình), chờ duyệt, máy 'Bảo trì' liệt kê theo xưởng (chưa có vị trí trên bản vẽ); bảng ghép chỉ ADMIN, lưu `localStorage kpi_sodo_ghep`; nút \"Xem 3D\" (≥900px) mở lớp phủ `#sd3d`. Kiểm tra `tests/so-do-web.js` (31). **11/10: phòng vẽ lại theo 3 PDF mặt bằng bố trí máy chủ dự án gửi** – `tests/so-do/mat-bang-moi.py` ghi DATA mới vào `so-do/nha-may-3d.html` (đo trên PDF bằng PyMuPDF: lưới trục 44,75 × 34,25 m, 1 m = 11,088 pt, gốc trục X1/Y1 ở PDF (120,4; 115,2), trục x bản vẽ = trục dọc trang; tên phòng là nét chữ màu xám nhạt (0,98) – vẽ riêng ra mới đọc được). Tầng 3: Bộ phận may + Tập kết → kho, Máy CNC thùng → Phòng QC (theo yêu cầu). Tầng 2: mọi phòng dưới hành lang ghép xưởng SON (phòng quản lý ở đó tên `P. quản lý BP Sơn` để khóa GHEP không trùng 2 phòng `P. quản lý` phía trên). Khu mở không vách để `w:0`, tường riêng qua `xw`. Phòng đóng gói tầng 3 theo 3 ảnh chụp chủ dự án gửi: `R.san='trang'` (FLOOR.trang epoxy trắng), `F.bang` = đoạn băng keo vàng đen (M.hazard), loại máy mới `bandg` (bàn + khung đèn LED + ống điện lên trần), `laser`, `seal`, `pccc`; `mkRack` với nhãn `K\\d`/`Kh\\d` chất thùng carton; máy thêm có `src:'mb10'` để chạy lại mat-bang-moi.py không nhân đôi. Phòng ngọn tầng 3 (khu vực ngọn + làm đầu) theo 2 ảnh chụp: sàn `trang`, MT\\d/D\\d → `tienn` (bàn tiện mini + `ongHut` ống tôn xoắn + ống mềm TubeGeometry), M\\d → `cncn`, `xeong` (xe ống giấy, InstancedMesh ống/ngọn/đầu vàng), `sot`. Đợt ảnh 11/10 tiếp: mat-bang-moi.py thêm khối mb11 (phôi thô), mb12 (phôi carbon), mb13 (UV + Sơn), mb14 (Hoàn thiện T2, CNC/Phòng da/QC T3, đóng gói sắp lại 2 dãy bàn); loại máy mới: tienl, rotfoam(foam), phuy, cay, cuon, banthep, bankinh, maycat, lo, rutkhuon, mai, chuot, ro, tuuv, xejig (InstancedMesh màu cơ), thung, phunson, bantien, banbi, ghecao, ep, langda, inpad, banh, ratd, chanham, tiencnc, hamco, pallet; `mkCNC` = router gantry; sàn `xam`, `gach`. P. kỹ thuật làm phôi T3 đổi tên 'Phòng da' (GHEP sửa theo). P. khuôn T1 thuộc xưởng Phôi Carbon (PHOICB), theo chủ dự án 11/10. Tòa điều hành: nội thất từng tầng theo ảnh = nhóm `ofT1` (luôn hiện cùng vỏ; `ofVo1` tường thấp + nhãn chỉ khi xem riêng), `ofT2`, `ofT3`, `ofT4`; nút `#segView` vp1–vp4 đặt `st.vp` (ẩn `office`). `makeStair` (thang T-02/T-03 trong xưởng) = bậc granite đen + cổ trắng + lan can thép hộp đen (`STR`, khai báo trước `matCache`). Máy trên sơ đồ 2D có `pointer-events:none` (không che khu). Phóng to: 2D `sdZoom`/`sdGanZoom` (viewBox), 3D `zoomToCursor` + nút `#zIn/#zOut/#zFit` + nhấp đúp. Rà soát 3D theo ảnh (11/10, chủ dự án: \"lệch khá lớn\"): `wallSeg` = tường panel trắng cao 3,4 m có ô kính giữa (`M.partGlass`), sàn `FLOOR.sx/son/hl/vp` epoxy sáng, cột trắng, cửa `DM.D` nhôm đen kính, vạch hành lang = `M.hazard`, máy tiện phôi thô `NG.reu`, `mkBooth` ống hút đứng; sàn tòa điều hành dùng `blkSan` (UV theo mặt bằng, không kim loại – trước phản chiếu trời thành xanh đậm). 3D trên điện thoại (11/10): nút Xem 3D hiện mọi màn hình; bản 3D `small` → `st.hq=false`, `st.pp=false`, độ nét 1x, `sun.castShadow` tắt, vẽ theo nhu cầu (`canVe`, tối thiểu 2 khung/giây), nút `#btnNhe` ⚡ Nhẹ / ✦ Đầy đủ, thanh `.top` cuộn ngang 1 hàng. Phòng có thể ghi vị trí người cố định `R.ppl=[[x,y,góc]]` (đóng gói: 14 người trước 14 bàn). Dựng lại theo ảnh (nhóm 1+2, 11/10): mkSot (thùng lưới `TX_SOT`), giằng chéo mkRack, mkBanBi, mkGheCao, **mkGheNhua** (`ghenhua`, tự đặt cạnh banthep/ban/bantien/tienn), mkPhunSon, mkBanh, mkRaTuDong, mkCNC, vô lăng mkCuon; `__v3.mk(t,L,D,H,l)` dựng 1 máy để chụp riêng (scratchpad `st/studio.js`). Nhóm 3 (máy bị che/xa trong ảnh) chờ chủ dự án chụp cận. Tòa điều hành theo bản vẽ KT (11/10): `VPX(m)` (m từ trục X7) / `VPY(d)` (d từ trục D; dải A–B y 28–31,35), `VPL` cao độ 4,2/8,1/12,0/15,9, `vpBo(G,H)` tạo vách kính, tường, bàn ăn, `daiAB` (thang máy x −8,5…−10,5, thang bộ T-01 2 vế nhô ngoài mặt tiền, WC/kho); ofT1–ofT4 dựng lại đúng phòng. Sơ đồ vị trí hạng mục: phía trên = Nam, đường + cổng bên phải. Nhà xe 2 bánh hình thang ở cuối khu đất (X5 x 82,6 → X1 x 100,5, Y1 y 33,2 Bắc → Y7 y −1 Nam, nhà rác góc Nam), ranh cuối xiên `SITE.xS`=112 (Nam) → `SITE.x1`=91,6 (Bắc); nhà xe 4 bánh + bơm dọc hàng rào cổng x −39,6…−27,85 y 19,8–38,05 (phòng bơm đầu Bắc). Kịch bản chụp 16 khu: scratchpad `rv/khu.js` (cần `__v3.dungBay()`, chụp timeout 120 s). **Đợt ảnh máy 11/10 tối** (mat-bang-moi.py khối mb15–mb18 + sửa thẳng hàm mk* trong nha-may-3d.html): dựng lại theo ảnh máy đánh bóng tự động (`ratd`, gộp tủ + băng đỡ), chà nhám HQTECH, tiện WM210V (`tienkl`), hạ khấc CNC HQT-850 (`tiencnc`), tiện gỗ Hisimen (`tiengo`, vị trí tạm), in UV (+ bàn máy tính, `xoay` cho dãy quay ngược), router CNC, lạng da Cuebots, ép thủy lực khung H, ép nhiệt (`epnhiet`), in pad (`inpad`), hàn miệng túi (`hanmieng`), tiện CNC tự chế (`tiendiy`), tủ mát, quạt hơi nước, cây nước, laser fiber, máy hàn màng chữ L, hầm co; `Mc.xoay` quay máy 180°; phòng da + đóng gói CNC + khu giữa CNC bố trí theo ảnh toàn cảnh; phòng ngọn: khu tip phía cửa, khu taro trong chữ L (dãy giữa WM210V, dãy trong/ngoài tiện CNC); hành lang SX có bình chữa cháy, ống PCCC, biển EXIT, cửa thang hàng 4 cánh. Đợt sau (mb19): tiện gỗ Hisimen 2 máy cạnh dãy đánh bóng bánh vải; 2 hầm co nhỏ để bàn (`hamconho`) ở góc chữ L BP đóng gói; phòng quản lý CNC (bàn họp, ghế lưới, bàn làm việc, tủ kính); phòng cuốn T1 = 7 máy cuốn phôi Tonglian (`cuon` vẽ lại) + 4 máy cuốn nilon TWC36-B (`nilon`) + 6 bàn inox; phòng cắt = 2 máy xả khổ DZC1200-B (`maycat`) + 6 bàn tỉa vải; 3 lò nướng (`lo` vẽ lại); TQD-50A = máy cắt phôi 2 đầu cưa (`catphoi`); máy chuốt RYM dùng hình máy ráp nước; rút khuôn thủy lực vẽ lại; phòng khuôn = 18 xe treo khuôn (`xekhuon`). **Xoay khối xưởng sản xuất 180° (11/10, chủ dự án: thang máy + WC phải ở phía kho phụ):** mat-bang-moi.py vẫn viết toạ độ ĐO TRÊN BẢN VẼ; cuối script `lat(D)` ghi DATA đã xoay (x → 44,75 − x, y → 34,25 − y; phòng, máy (đổi `xoay`), cửa, zones, xw, bang, ppl) + cờ `F.latY`; chạy lại tự xoay về trước. Thang bộ/thang máy dựng theo toạ độ bản vẽ rồi xoay 180° (`latG`). Khóa máy bảo trì mẫu trong so-do-chung.js đã đổi toạ độ. Mọi toạ độ trong ghi chú cũ phía trên là toạ độ bản vẽ (chưa xoay). **11/10 tối:** T2 phòng `Ráp nước` có vách, gồm cả dải 2 máy đánh bóng tự động (2 hình chữ nhật + `xw` đoạn 4,02–4,6 + cửa x 4,6); `Bôi keo` dời sang sát khu đánh ráp (x 11,26–13,69), `Bọc da` x 13,69–22,3, cả hai `w:0` + vách bao chung qua `xw` (máy bọc da dời +2,43 m); T3 đổi tên theo chủ dự án: khối chữ nhật sát thang máy = `Khu vực ngọn`, khối chữ L = `Khu làm đầu` (máy giữ chỗ, bỏ nhãn khu ngọn tip / taro). Rà soát 11/10: còn ô xám chưa rõ máy (chờ ảnh/giải thích): T1 C1–C6 (khu khoan chạy lỗ), H1/H2 (khu đổ foam), TD-4-15 ×2; T2 H1–H3 (đánh ráp), H4 (bọc da), QW ×2, CSS ×3, BM1–BM7; T3 VUE; phòng chưa có máy: T2 Bôi keo, Buồng sấy. CNC rà tròn phôi (`ratron`) = 4 máy trong phòng Khu chuốt T1 (mb20); TQD-50A xác nhận là máy cắt phôi; phòng may T3 (Bàn cắt + Hoàn thiện) đã gộp vào Kho (khu bộ phận may) + 6 kệ. Còn ngỏ: chuyển GHEP + ghép mã máy ↔ ký hiệu bản vẽ thành sheet; máy khu đóng gói tầng 3 (VSĐG, K1–K11, Lz…) và máy may chưa có trong 3D.\n- **Bản 3D chủ dự án gửi 13/10 (ĐÃ ĐƯA LÊN WEB, Index.html + SoDo.html dựng lại):** lỗi lớp phủ 3D không hiện là do va-so-do.py đổi mọi `<\/textarea` thành `<\\/textarea` làm hỏng `textarea#btXuat` mới trong file 3D – đã bỏ (nội dung đã html.escape). GHEP: \"Khu chuốt ráp nước\" → PHOICB; \"Kho thành phẩm\", \"Phòng kế toán kho\" thuộc BP kế toán kho, không ghép xưởng. **Bỏ xem 3D trên điện thoại** (chủ dự án 13/10): nút \"Xem 3D\" chỉ hiện ≥900px. **Lưu bố trí máy lên web (13/10):** máy chủ `tests/bo-tri-may.gs` (nối cuối Code.gs) – sheet `BoTriMay` tự tạo (ThoiGian, NguoiLuu, TomTat, NoiDung JSON `{d,n,x}` như localStorage cũ; mỗi lần lưu thêm 1 dòng, dòng cuối = đang dùng, xóa dòng cuối = quay lại bản trước); `layBoTriMay` (vai trò có tab Sơ đồ, trả `sua` = chỉ ADMIN), `luuBoTriMay` (ADMIN). Web: `sdBoTri` nạp trước khi dựng iframe, cầu nối `window.BTM` (va-so-do.js); va_3d.py vá bản 3D: có BTM thì `napBT`/`luuBT` dùng dữ liệu web thay localStorage, nút `#btLuu` \"💾 Lưu bố trí\", trạng thái `#btLuuTT`, ẩn \"Xuất bố trí\", bấm Xong / ✕ Đóng khi chưa lưu thì tự lưu; không phải ADMIN thì ẩn \"Sắp xếp máy\"; móc kiểm thử `__v3.btBat/btXoayThu`. Sơ đồ 2D chưa theo bố trí đã lưu. `tests/so-do-web.js` 37. **17/10 – tầng 1 tòa điều hành phong cách CLB bi-a neon** (theo 4 ảnh tham khảo chủ dự án gửi; sửa thẳng khối `ofT1` trong so-do/nha-may-3d.html, bản trước lưu ở scratchpad `nha-may-3d.truoc-neon.html`): thảm hoa văn, tường ốp `op` + viền neon `NE.xanh/hong` (MeshBasic toneMapped:false), đá đen hắt sáng `daHat`, logo \"> <\" + chữ RHINO BILLIARDS, giá cơ trắng, băng khẩu hiệu \"CUE THE EXCELLENCE · MASTER THE GAME\" + mũi tên trên kính, 4 bàn bi-a nỉ xám xanh (đổi material nỉ, không sửa material chung của mkBanBi) + khung LED treo `khungDen`, sofa da đỏ `daDo`, bảng tỉ số, quầy bar hắt sáng + kệ chai (InstancedMesh) + biển ORDER HERE, trần tối chỉ nhìn từ dưới, cột bọc ốp, 3 PointLight (2 trắng + 1 xanh). **Mặt tiền tầng 1 theo phối cảnh DELCO + mặt đứng A–E:** vách kính trong khung đen y 13,35–27,65 cao 3,6 (đố ngang +2,40), cửa 2 cánh giữa y 20,5, mái đón xám có 2 đèn rọi, chiếu nghỉ + 3 bậc đá đen mũi xám, bệ chân tường; khối `OF.render` tầng 1 khoét rỗng (chỉ giữ tường 2 đầu, dải trên kính, tường phía xưởng) để nhìn thấy nội thất; bỏ ô cửa nhỏ tầng 1 ở y 26,6. `__v3.px/pz` cho kịch bản chụp (scratchpad `neon/chup.js`). **17/10 – kính tòa điều hành nhìn xuyên** (chủ dự án: chỉ tòa điều hành, KHÔNG làm xưởng): `OFW` kính trong; hàm chung `catLo`/`tuongLo` (tường có lỗ cửa); khối tầng 2–3, tầng 4 (tôn đen), tháp thang ALU, cánh Nam tầng 1 đều rỗng, tường chừa lỗ đúng vị trí cửa sổ/cửa; sàn tầng mặt trên thấp hơn sàn nội thất 2 cm; nội thất `ofVo1`, `ofT2–4` hiện cùng tòa nhà (`apply`), khối nền `DE2` của nội thất T2 chỉ hiện khi xem riêng; bỏ bản trùng lô gia T3 / lan can hiên T4 / cửa sổ T4 trong `office`. **19/10 – mặt ngoài tòa điều hành theo 2 ảnh phối cảnh DELCO (mặt trước + góc Tây Nam) chủ dự án gửi:** tháp cao +19,40 (bản vẽ +17,30) + mái dốc tam giác nhôm sẫm từ đỉnh tháp xuống mái T4 (ExtrudeGeometry, y 28 → 25,4), kính tháp sẫm phản quang + lưới khung 1,85 m, biển RHINO dời lên 17,4; `OF.dark` có vân tôn sóng dọc (canvasTex); mặt tiền T4 tôn đen, chỉ dải kính L4 → L4+2,3; cửa sổ mặt tiền T2/T3 theo `W2` (tâm 25,2 / 22,2 / 18,9; T2 cao 2 hàng sát mái đón, T3 thấp nằm ngang) + cửa 2×2 T3 ở y 15,1 + gờ mái nhỏ; khối tôn đen 2 tầng (T3–T4) x −12,4…−2,6, y 10,6–13 ôm lô gia T3/lô-gia T4, trần gỗ + đèn lon, mái che sân hiên phần đó thành đen; cửa sổ nhỏ T1 cánh Nam y 9,5. Sửa đồ bên trong lòi ra mặt tiền: kính + đố mặt tiền nội thất T2/T3 lùi vào x −13,9, tủ gỗ phòng TGĐ (dấu sai), đầu vách kính T2. Kịch bản chụp + bắt tia: scratchpad `dh/chup.js`, `dh/pick.js` (bản thử có logo: `anh_rhino()` từ tests/dang-nhap). **19/10 (đợt 2) – mặt Nam theo ảnh phối cảnh góc Tây Nam:** khối tôn đen chỉ ở tầng 4 (L4−0,45 → mái), vươn ra trên sân hiên x −13…−3, y 8–13, đáy có đèn lon; mặt Nam lô-gia lõm 1,5 m (x −10,6 → −3,3: trần gỗ, vách kính trong, lan can kính), đầu phía mặt tiền kín; mái che sân hiên T3 trở lại trắng; hộp thang kính xanh sát mặt Nam y 6,1–12,3, cao tới đỉnh khung trắng L3+0,7; tầng 1 mặt Nam: tôn đục lỗ chạy x −9 → −0,3 có cửa kính đôi (x −6,6), bỏ cửa sổ cũ; cửa sổ T1 mặt tiền cánh Nam y 7,9; cửa sổ mặt tiền thứ 3 dời y 17,95 (không trùng vách phòng TGĐ). **Nội thất tầng 2 làm lại (chủ dự án: hiện đại, chuyên nghiệp)**: bộ hàm trong khối ofT2 – `gheVP` (ghế xoay 5 chân, `cao` = ghế giám đốc), `banLV` (khung thép đen, màn hình, vách nỉ), `banGD` (mặt óc chó + bàn phụ chữ L, 2 màn hình, đèn bàn, biển tên), `sofa`, `banTra` (đá trắng), `tham`, `tuSach` (sách nhiều màu), `tuThap`, `cay`, `tv`, `tranh`, `denThang`; hướng theo `HA` N/S/E/W (người ngồi phía +z cục bộ); phòng ban điều hành 7 chỗ (bàn trưởng ban + 3 cặp bàn đối diện có vách nỉ, tủ thấp, TV), phòng họp-2 8 chỗ (TV 75\", đèn thả), PGĐSX + TGĐ (bàn giám đốc quay lưng ra sân vườn, 2 ghế khách, góc sofa + bàn trà + thảm, tủ sách, tranh, cây), không gian mở dùng `banLV`/`gheVP`. Ảnh so sánh: scratchpad `dh/so-sanh-mat-ben.jpg`, `dh/so-sanh-tang-2.jpg`; kịch bản chụp tầng 2 `dh/t2.js` (bấm vp2). **21/10 – tầng 4 sửa lại theo 2 ảnh (mặt trước + góc Tây Nam):** khối tôn đen phía Nam chỉ nhô khỏi trục D ~1,8 m (y 11,2 → 13; bản 19/10 nhô 5 m tới y 8 là sai), mặt Tây phẳng với tường T4 lùi (x −11,8), chạy tới tường xưởng (x 0), đáy L4−0,9 có đèn lon; lô-gia lõm hết bề sâu khối (x −10,4 → −0,4): trần gỗ, vách kính ở trục D (tường Nam T4 mở ô lớn), lan can kính y 11,35; đầu mặt tiền kín 1,4 m. Phần đen thấp có viền xanh ngọc thấy sau sân hiên ở ảnh mặt trước là tường Tây xưởng trong bóng râm, không phải khối của tòa điều hành. **3D thêm (21/10):** mặc định chế độ ⚡ Nhẹ (`st.hq=false`), nút `#btnToan` ⛶ Toàn màn hình (Fullscreen API; khung không cho thì `parent.sdGon3D` giấu đầu lớp phủ, Esc thoát), nút `#btnBen` ◨ Ẩn/Hiện chi tiết (`body.an-ben`, nhớ `kpi_3d_an_ben`); vá trong va_3d.py, iframe có `allow=fullscreen`. **Bộ nhớ tạm phần SoDo theo mã phiên bản nằm trong Index.html → mỗi lần đổi SoDo phải gửi kèm Index.html** (chủ dự án từng chỉ dán SoDo nên vẫn thấy 3D cũ). Tên file Apps Script phải đúng \"SoDo\" (chủ dự án từng đặt \"Sodo\" → không tải được; `layManhGiaoDien` nay báo lỗi thật của Google). Ghi chú cũ: đã thay `kpi-app/so-do/nha-may-3d.html` (thêm chế độ \"✥ Sắp xếp máy\" kéo thả/xoay/nhân đôi/xuất bố trí, nút Sân hiên T2, \"Công nhân đi lại\", máy mới kehc/thungrac/quattuong/bangtrang/carton…, đổi tên phòng: Khu chuốt→Khu rà tròn phôi, P. quản lý→Phòng trưởng bộ phận, Khu vực ngọn/Khu làm đầu→Khu vực taro/Khu vực tip, P. ráp tuốt lót→Khu ráp và tuốt lót…); GHEP trong `tests/so-do/so-do-chung.js` đã sửa theo; `tests/so-do-web.js` đếm 22 khu tầng 1. **Chưa đưa lên web:** Index.html/SoDo.html trong repo vẫn là bản cũ; khi dựng lại với bản mới, phần 2D đạt nhưng **lớp phủ 3D không hiện canvas** (`#c3d canvas` chờ 60 s) – cần dò lỗi JS trong khung 3D (gói three@0.160.0 lấy bằng `npm pack` vào scratchpad, `THREE=<thư mục package>`). Chủ dự án chưa cho biết xưởng của 3 phòng mới: \"Khu chuốt ráp nước\" (T1), \"Kho thành phẩm\", \"Phòng kế toán kho\" (T3). Lưu ý: mat-bang-moi.py ghi đè DATA – chạy lại sẽ mất chỉnh sửa của chủ dự án trong bản 13/10.\n", "duong": "bo-nao/KPI/KPI Sơ đồ nhà máy 3D.md", "lk": ["KPI Phần giao diện tải sau", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Sửa lỗi 21-10 và dữ liệu sheet", "nhom": "KPI", "txt": "# KPI Sửa lỗi 21-10 và dữ liệu sheet\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Bảo mật và vận hành]] · [[Việc chờ chủ dự án]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\n- **Sửa 4 lỗi chủ dự án báo 21/10 (chưa dán; chỉ Code.gs + Index.html, HUONG-DAN mục \"BẢN SỬA 21/10\"):** máy chủ `tests/sua-loi-21-10/va-sua.py` (exec cuối va-code.py), web = va-index.py **mục 25** `tests/sua-loi-21-10/va-sua-web.py` + `lam-moi.html`. (1) `layKPIKy`: TP/PP bị ép `maXuong = me.xuong`; tiêu đề tab KPI ghi tên xưởng. (2) Phạt nhập trễ chạy 17h ngày LV thứ 3, ngày nghỉ hay được chấm SAU đó (dữ liệu thật: C713 nghỉ 3–8/9, phạt 10/9, chấm 28/9) → `goPhatNgayNghi_()` gỡ PhatNhapTre + ViPham NHAPTRE tự động (NguoiGhi \"Hệ thống…\" hoặc GhiChu \"Tự động…\"; dữ liệu cũ NguoiGhi rỗng) của ngày nghỉ cả ngày / nghỉ dài hạn / ngày lễ; gọi trong `chayPhatNhapTre`, `luuDiemDanh`, `luuLichThang`, `dangKyNghiDaiHan`; 0.5x vẫn phạt. Dải nhắc CN (`capNhatDucBar`) thêm kiểm `gioCoMatNgay` + `laNgayLeKH`. Tháng đã chốt giữ số cũ (chủ sở hữu chốt bù). (3) Nhật ký của TP lọc theo MỌI công đoạn xưởng (cả \"Ngừng\"), `out.cdNgung` cho `cd()`; dữ liệu trước chỉ tải lúc đăng nhập → `lmTai` tải lặng `napPhan(['nk','cc'])` khi mở tab (TP: duyetsl/homnay/dash; CN: cnnhap/kpica; tối đa 1 lần/20 s, TP thêm mỗi 5 phút), vẽ lại tab đang mở nếu dữ liệu đổi và không đang sửa ô / chờ Hoàn tác. (4) `canNhapLai` bỏ ngày đã có dòng Chờ duyệt/Đã chốt. **Rà soát đợt 2 (21/10):** \"Tạm nghỉ\" không nhắc/không phạt (`chayPhatNhapTre`, `thieuNhap_`, client `phaiNhapSL`); `goPhatNgayNghi_` gỡ cả phạt sót của TP/PP (`mapQuanLy_`); hàm chạy tay `KIEM_TRA_DU_LIEU` (`tests/sua-loi-21-10/kiem-tra-du-lieu.gs`, chỉ đọc, ghi sheet `KiemTraDuLieu`); script soát bản xuất JSON `tests/sua-loi-21-10/ra-du-lieu.py <csdl.json>`. Dữ liệu 28/9 còn lỗi phải sửa tay trong sheet: ~18 dòng nhật ký ngày sai (#VALUE!, rỗng, năm 1483, trước 07/2026), điểm danh ngày 2001-08-11, 3 tên đăng nhập trùng (c631/c638/c640), 9 tài khoản Đang dùng của người Nghỉ việc, c060 vai trò CN nhưng chức danh Trưởng phòng, ~90 nhân sự thiếu NgayVaoLam, 2 công đoạn đang dùng chưa định mức, 95 vi phạm NHAPTRE thiếu MaGhi; phạt nhập trễ trước 15/09 (349 lượt) không có vi phạm NHAPTRE nên CN không bị trừ nề nếp nhưng TP vẫn bị trừ \"không nhắc\" – chờ chủ dự án quyết; TrongSoKPI TranKPI = 500 (trần KPI 500%) – hỏi lại. **Sheet thật 21/10 (đọc qua Google Drive, file \"CSDL KPI\" id 1znHlbc3ulMRQILePmLZbwNQx-mMXFxd9sm0PBG9lrF8; bản xuất ở scratchpad, KHÔNG commit):** đã dán bản 18/10 (có LichSuDinhMuc, HoiNhap, BoTriMay); tên đăng nhập trùng, TK người nghỉ việc, MaGhi thiếu đã được dọn; còn: 29 dòng nhật ký ngày sai (NhatKySanXuat dòng 588–609 của C049 bị đảo ngày/tháng 2026-01/03/05/06-08 = 01/03/05/06 tháng 8 + 5 ô #VALUE!; dòng 733–735 C638, 2707–2709 C075 (từ chối), 4324 C080 ngày trống), DiemDanhNghi dòng 100–120 + XacNhanDiemDanh 88–90 ngày 2001-08-11; 21 lượt phạt + 16 vi phạm NHAPTRE rơi vào ngày nghỉ (cả tháng 10: C755 10–15/10, C666 12/10 → tự gỡ khi dán bản 21/10); C285 tạm nghỉ bị phạt 7 lượt; 10 người mới thiếu NgayVaoLam; giamdoc/phogd2 vẫn chung mật khẩu mặc định. Kiểm thử `tests/sua-loi-21-10.js` (31, DATA=), `tests/sua-loi-21-10-web.js` (9, bản xem thử GIO=2026-10-14); kiem-tra.js mục 8 gọi `goPhatNgayNghi_` trước khi đếm.\n", "duong": "bo-nao/KPI/KPI Sửa lỗi 21-10 và dữ liệu sheet.md", "lk": ["KPI Bảo mật và vận hành", "Việc chờ chủ dự án", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Sửa lỗi giao diện", "nhom": "KPI", "txt": "# KPI Sửa lỗi giao diện\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Công cụ Claude]] · [[KPI Demo giao diện]] · [[00 Mục lục]]\n\n- **Sửa lỗi giao diện (11/10)** = va-index.py **mục 18** `tests/sua-loi/va-sua-loi.py` (chạy cuối, sửa thẳng chuỗi gốc qua `_thay18` – có assert số chỗ): cỡ chữ CSS 10/10,5 → 11px, 11 → 12px, 11,5 → 12,5px (cả `font:<đậm> Npx`); placeholder #gate #8c8c8c, `--chu3` #939393, `--red` tối #f77e7e, bỏ vạch trái `.kpi::before` / `.hn-viec::before` / `.cn-formula`, bỏ chữ tô dải màu `.cn-h` / `.vuot-chu`, `pulseDot` tắt. Kiểm `../.claude/skills/impeccable/scripts/impeccable detect --json Index.html` còn 6 mục cố ý giữ: hiệu ứng màn đăng nhập đã duyệt (lkGoi, nảy, rhChay, đèn LED), sọc băng keo, font Inter. Bộ kỹ năng thiết kế Impeccable + Taste nằm ở `.claude/skills/`.\n", "duong": "bo-nao/KPI/KPI Sửa lỗi giao diện.md", "lk": ["Công cụ Claude", "KPI Demo giao diện", "00 Mục lục"]}, {"id": "KPI Sửa nhỏ trên web", "nhom": "KPI", "txt": "# KPI Sửa nhỏ trên web\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[00 Mục lục]]\n\n- **Bỏ thẻ \"KPI Quản lý (Trưởng/Phó phòng)\" ở tab Bảng KPI của ban điều hành (13/10)** = va-index.py **mục 21** (`kpiql_khoi` + `napKPIQuanLyKhoi` chỉ còn cho TP ở tab \"KPI phòng\", vì TP không có tab KPI Quản lý riêng).\n- **Cột Ngày trong thẻ \"Chờ chốt\" (09/10, đã vá vào Index.html):** va-index.py mục 13 sửa `renderDraft` – gom theo `MaNV|Ngay`, cột Ngày (dd/mm + thứ), ngày ≠ hôm nay tô `--amber` + \"không phải hôm nay\", nhiều ngày thì cảnh báo. Kiểm thử `tests/cho-chot-ngay.js` (16, `F=<bản xem thử>`). Dòng \"Tổng\" trong thẻ này vẫn hiện \"–\" cho SL/Lỗi như bản gốc (chưa hỏi chủ dự án có muốn cộng không).\n", "duong": "bo-nao/KPI/KPI Sửa nhỏ trên web.md", "lk": ["KPI Tổng quan và cách dựng", "00 Mục lục"]}, {"id": "KPI Thao tác và hiệu ứng bên trong", "nhom": "KPI", "txt": "# KPI Thao tác và hiệu ứng bên trong\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập Khắc laser]] · [[KPI Bảo mật và vận hành]] · [[00 Mục lục]]\n\n- **Demo thao tác mới bên trong (11/10, chờ chọn; chủ dự án: \"bỏ qua màn đăng nhập\"):** `kpi-app/demo-thao-tac-2.html` (1 file tự chứa, số liệu mẫu): 1 bảng xếp hạng sắp xếp mượt FLIP (`el.animate`) + vạch lên/xuống hạng, 2 thẻ phóng thành trang chi tiết (View Transitions API, `view-transition-name:the`, trình duyệt cũ thì chuyển thẳng), 3 nhấn giữ 450 ms xem nhanh (pointer events, hủy nếu kéo >8px, `.peek` mờ nền), 4 ô tìm nhanh Ctrl+K (tìm không dấu `bo()`, ↑↓ Enter), 5 gợi ý nhập số hôm qua (chữ mờ, Tab/→/chạm nhãn), 6 đèn tháp Andon xanh/vàng/đỏ nhấp nháy, 7 băng chuyền tiến độ ca (hộp rơi vào thùng, vạch định mức), 8 kéo thả người vào công đoạn (pointer, chip nổi `position:fixed`, đếm đủ/thiếu), 9 số lật kiểu bảng ga tàu (split-flap). Mỗi ô ghi chỗ sẽ gắn trên web thật. Chưa gắn vào web.\n  - Phần B (bên trong): `kpi-app/demo-thao-tac.html` (nguồn `tests/thao-tac/demo.src.html`, dựng bằng `tests/thao-tac/tao-demo.py`): 7 vuốt để gửi + số bay vào thùng, 8 số đếm cơ khí + đồng hồ kim % định mức (>130% đỏ), 9 vuốt thẻ duyệt/trả lại + Hoàn tác, 10 cần gạt chốt ca, 11 điểm danh đóng dấu (chạm / vuốt dọc cột dấu), 12 vuốt trái xóa + Hoàn tác 5 giây, 13 kéo xuống làm mới (cơ đánh bi; cảm ứng dùng touchmove passive:false ở đầu danh sách), 14 nhập sai: ô rung + Mai chỉ tay, 15 pháo giấy 1 lần/ngày, 16 hết phiên: tối + dây kéo + hộp đăng nhập lại. Hàm chung `keo()` (ngưỡng 6px; `giuNgay` cho tay nắm nhỏ để vuốt nhanh không tuột), `bao()` thanh báo/Hoàn tác, `rung()` (Android). Kiểm tra `tests/demo-thao-tac.js` (43, gồm vuốt bằng ngón tay qua CDP `Input.dispatchTouchEvent`). Chưa gắn vào web: khi duyệt từng mục thì vá vào va-index.py (mục mới) đúng màn thật (`cnGui`, `vDuyetSL`, chốt ca `chot()`, điểm danh, `renderDraft`/`delD`, `hetHan`…).\n- **ĐÃ GẮN VÀO WEB (10/10):** (1) hiệu ứng màn đăng nhập – `LK_HU` mặc định bật `{chay, cua, mat, ket, gio}` (cửa cuốn thay dây kéo; `window.LK_HU={}` để tắt; các demo so mẫu truyền `{}`; lề né nút `m=26`, đà nảy `cubic-bezier(.3,1.2,.5,1)` để nút không lọt mép); kiểm tra web `tests/dang-nhap-web.js` (15). (2) Phần B mục 9, 10, 12–16 = va-index.py **mục 14** (`tests/thao-tac/va-thao-tac.py` chèn `.css` + `.js` trước `<\/body>` cuối, bọc lại hàm gốc): `duyetNguoi`/`tuChoiNguoi` chờ `TT_MS`=4 giây có Hoàn tác (`ttHen`, số đã sửa chụp lúc bấm; việc mới thì việc cũ gửi ngay; Từ chối bỏ confirm), vuốt nhóm trên điện thoại (`ttGanDuyet`; **touch-action phải đặt ở `td`**, không áp cho `tr`); cần gạt `ttCanGat` thay `#bchot` (ẩn, vẫn giữ); `delD` có Hoàn tác + vuốt trái; kéo xuống làm mới (trừ `cnnhap`, `dd`); `rungONhap` → `ttMaiChi` (trừ `cnnhap`); pháo giấy `ttPhao` trong `vKPICaNhanToi` (khóa `kpi_phao_<tk>`); `hetHan` → **cửa cuốn** sập xuống (13/10, thay dây kéo đèn vì khó kéo; giống cửa cuốn màn đăng nhập, dùng lại logo `#gate .lk-dau img`): vuốt lên >1/4 màn hình, chạm/bấm không kéo, hoặc nhấn phím bất kỳ đều mở → hộp đăng nhập lại tại chỗ (`dangNhap(ME.tk,mk)`, thay lớp phủ Lottie hết phiên – đã sửa `tests/lottie-web.js`). `#ttBao` z-index 8600 và tự đóng bong bóng Mai góc (che nút Hoàn tác). Kiểm tra `tests/thao-tac-web.js` (32). **Giữ nguyên theo yêu cầu: trang công nhân nhập sản lượng (mục 7, 8) và điểm danh (mục 11).** Demo: mục 8 làm lại bàn phím số to + nút nhanh, mục 11 có ngăn chọn lý do vắng (`tests/demo-thao-tac.js` 60) – chỉ là demo, chưa gắn.\n", "duong": "bo-nao/KPI/KPI Thao tác và hiệu ứng bên trong.md", "lk": ["KPI Màn đăng nhập Khắc laser", "KPI Bảo mật và vận hành", "00 Mục lục"]}, {"id": "KPI Tăng tốc và giao diện 29-09", "nhom": "KPI", "txt": "# KPI Tăng tốc và giao diện 29-09\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[KPI Kiểm thử]] · [[00 Mục lục]]\n\n- Bản 29/09: tăng tốc máy chủ (`tests/toc-do.gs`: gom ghi, nhớ tạm kết quả, `napPhan` + `phanDoi`, Sheets API, lưu trữ nhật ký) và giao diện bên trong mới (`tests/giao-dien-moi.html`: menu nhóm, thanh dưới điện thoại, tab Việc hôm nay, bảng màu xám than + cyan, nút ☀/☾, hiệu ứng chỉ chạy khi có sự kiện và tôn trọng prefers-reduced-motion). Bản xem thử 1 file: `tests/tao-ban-xem-thu.js` (kết quả có số liệu thật đã ẩn danh, không commit). Kiểm thử: `kpi-app/README.md` (cần dữ liệu JSON xuất từ Sheet, không commit vì có dữ liệu cá nhân).\n", "duong": "bo-nao/KPI/KPI Tăng tốc và giao diện 29-09.md", "lk": ["KPI Tổng quan và cách dựng", "KPI Kiểm thử", "00 Mục lục"]}, {"id": "KPI Tăng tốc đợt 2 (21-10)", "nhom": "KPI", "txt": "# KPI Tăng tốc đợt 2 (21-10)\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[KPI Tăng tốc và giao diện 29-09]] · [[KPI Phần giao diện tải sau]] · [[KPI Cập nhật bằng clasp]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\nChủ dự án báo 21/10: đăng nhập vẫn lâu; tab Bảng KPI và KPI quản lý tải lâu.\n\n## Đo trên dữ liệu thật 21/10 (CSDL KPI tải qua Google Drive, bản xuất ở scratchpad, KHÔNG commit)\n- NhatKySanXuat 14.460 dòng (~7.000 dòng/tháng), NhatKyThaoTac 26.856 dòng. Mỗi lượt nạp đọc ~265.000 ô.\n- `napDuLieu` gửi về: ban điều hành 2,9 MB (riêng `nhatky` 12.417 dòng = 2,2 MB), TP 1,06 MB, CN 0,9 MB.\n- `layKPIKy` / `layKPIQuanLy` có bộ nhớ tạm 10 phút (`nho_`) nhưng khóa theo `KPI_PB`, mà mọi lượt ghi có khóa (`xong_` → `tangPhienBan_`) đều đổi số này – kể cả công nhân gửi sản lượng, đăng ký cơm – nên giờ làm việc gần như luôn tính lại từ đầu.\n\n## Đã sửa (chưa dán – gộp với bản sửa 21/10: Code.gs + Index.html)\n- Máy chủ `tests/tang-toc-2/va-tang-toc.py` (exec cuối va-code.py):\n  - `napDuLieu`/`napPhan` → `goiNap_`: trả MỘT chuỗi JSON; mảng ≥30 dòng mà mọi dòng cùng thứ tự cột thì gói `{__b:1,c:[cột],h:[[giá trị]]}`. Ban điều hành 2,9 → 1,36 MB, TP 1,06 → 0,58 MB, CN 0,91 → 0,46 MB.\n  - Bộ nhớ tạm KPI có số phiên bản riêng `KPI_PB_KPI` (`phienBanKPI_`, `NHO_KPI_` = layKPIKy, layKPIQuanLy, layLichSuKPI). `xong_` chỉ đổi khi `anhHuongKPI_()`: bỏ qua lượt chỉ ghi `SHEET_KHONG_KPI_` (DangKyCom, ThucDon, SuatAnThang, NhatKyThaoTac, ThongBao, BoTriMay, HoiNhap, YeuCauSuaHoSo, KiemTraDuLieu, NguoiNhanBaoCao) và `congNhanGuiSanLuong` (`__KPI_KHONG_DOI`: dòng \"Chờ duyệt\" không vào KPI; KPI quản lý tính duyệt trễ theo ThoiDiemDuyet nên cũng không đổi). `tangPhienBan_()` gọi thẳng (XOA_BO_NHO_TAM…) vẫn xóa cả nhớ KPI.\n  - Làm nóng: `LAM_NONG_KPI` (trigger 10 phút, chỉ 6h–22h, `noiBo_`) tính sẵn layKPIKy tháng này cho '' + từng xưởng PhongBan và layKPIQuanLy cho ADMIN (owner/không owner) + TP từng xưởng; `layKPIKyGoc_`/`layKPIQuanLyGoc_` nhận thêm `meSan`. Cài: chạy tay `CAI_TRIGGER_LAM_NONG_KPI`; tắt: `TAT_TRIGGER_LAM_NONG_KPI`. Trên giả lập ~2,5 giây/lượt.\n- Web = va-index.py **mục 26** `tests/tang-toc-2/va-tang-toc-web.py`: `moGoi_` mở gói ở napTruoc_, napCo_, reload, lmTai.\n- Giả lập: `gia-lap-kpi.js` `__goi` tự mở gói như trình duyệt, `__goiTho` lấy bản thô; đếm ô đọc `__thongKe.o`; `everyMinutes`. `tao-ban-xem-thu.js` reset `__PB_KPI`, `__KPI_KHONG_DOI`.\n- Kiểm thử `tests/tang-toc-2.js` (31, DATA=). Các bộ cũ (sua-loi-21-10, bao-mat, van-hanh, com-trua, bao-cao, kiem-tra; web: sua-loi-21-10-web, van-hanh-web, thao-tac-web, dang-nhap-web) cho kết quả **giống hệt** bản trước sửa – các lỗi / dừng còn lại có từ trước do dữ liệu thật đã khác lúc viết kiểm thử (vd. van-hanh dừng ở `SLGoc`, com-trua ở `TenDangNhap`).\n\n## Còn có thể làm\n- Chưa biết bản thật đã bật Sheets API (`KIEM_TRA_SHEETS_API`) chưa – nếu chưa, mỗi lượt nạp đọc 23 sheet riêng lẻ, rất chậm. Đã ghi vào hướng dẫn dán.\n- `nhatky` gửi từ đầu tháng trước (`SO_THANG_GUI_VE` = 2); có thể giảm nếu giao diện không cần tháng trước.\n- Index.html ~0,83 MB tải mỗi lần mở trang (ảnh nền đăng nhập 131 KB base64).\n", "duong": "bo-nao/KPI/KPI Tăng tốc đợt 2 (21-10).md", "lk": ["KPI Tăng tốc và giao diện 29-09", "KPI Phần giao diện tải sau", "KPI Cập nhật bằng clasp", "Lần dán lên Apps Script", "00  "00 Mục lục"]}, {"id": "CLAUDE.md", "nhom": "Bắt đầu", "duong": "CLAUDE.md", "txt": "# Web KPI sản xuất – bối cảnh cho phiên Claude Code mới\n\nFile này được Claude Code tự đọc khi mở repo. Nó giữ **quy tắc bắt buộc** và chỉ đường vào **bộ não thứ hai** `bo-nao/`, nơi chứa toàn bộ \"trí nhớ\" chi tiết của các phiên trước. Đọc hết file này, rồi đọc `bo-nao/00 Mục lục.md` trước khi làm việc.\n\n## Nhánh này chỉ chứa web KPI\n- **Web KPI sản xuất** (`kpi-app/`, Google Apps Script) của Carbon Billiards (thương hiệu RHINO), công ty của chủ dự án.\n- **Mỗi dự án một nhánh** (chủ dự án chốt 21/10). Commit và push việc KPI lên **`claude/beautiful-ptolemy-f2j7za`**. Không tạo PR nếu chủ dự án không yêu cầu.\n- Dự án khác của chủ dự án, không liên quan, nằm ở nhánh riêng – đừng đưa vào nhánh này:\n  - **Thiên Cơ Các** (`tuvi-app/`, web luận vận mệnh 6 hệ): nhánh `claude/happy-brown-lttkz3` (có bộ não riêng). Bản `tuvi-app/` cũ ở nhánh này đã gỡ 21/10 (bản 28/9, cũ hơn nhánh kia).\n  - **Trợ lý KPI qua Zalo** (`tro-ly-kpi/`): nhánh `claude/awesome-heisenberg-iulbd6`.\n\n## Chủ dự án – cách làm việc (bắt buộc)\n- **Trả lời bằng tiếng Việt.**\n  - Chủ dự án không phải dân IT, nên hướng dẫn từng bước theo dạng **\"MỞ FILE X → xóa hết → dán bản mới\"**.\n  - Luôn nói rõ **file nào cần dán lại** vào Apps Script, kèm bước **Triển khai → Quản lý triển khai → ✏️ → Phiên bản mới → Triển khai**, rồi Ctrl+F5.\n- Nhắc **sao lưu** (Tổng quan → Tạo bản sao dự án) trước khi dán thay đổi lớn.\n- **Cái gì xong trước thì gửi trước** (chủ dự án nhắc 19/10): khi làm nhiều sản phẩm một lúc (vd. PPT + video), phần nào xong và đã kiểm tra thì gửi ngay, không chờ xong hết mới gửi.\n- Chủ dự án hay gửi file đã tự sửa. Khi nhận:\n  - **Gộp 3 chiều** với bản trong repo (`git merge-file`), không ghi đè mất thay đổi của họ.\n  - Rồi rà lỗi.\n- Trước khi đề xuất gì, xem `bo-nao/Quyết định của chủ dự án.md`: những gì đã nói \"không cần\" thì đừng đề xuất lại.\n\n## Bảo mật (bắt buộc)\n- **Không bao giờ ghi
