nh báo bếp sửa món, giới hạn món thay, suất chay – đừng đề xuất lại. **người nghỉ dài hạn** (sheet `NghiDaiHan`, `comNghiDai_(ngay)` MaNV→Loai) chưa đăng ký thì `comTongHop_` tự tính không ăn (`dsKhongCT[].nghi`, web \"(tự động – Thai sản)\"), `hoDK[ngay][tk]=[0,'',loai]` để \"đăng ký ăn cho tất cả\" bỏ qua; đã đăng ký thì theo đăng ký; **nhóm báo cơm có suất ăn ở nơi kia** (12/10, chỉ tài khoản NHOM): cột `SoSuatNoiKhac` (SoSuat vẫn là TỔNG), `baoSuatNhom(token, ngay, so, khac)`, `comKhac_`, tổng hợp cộng `haNam/haNoi` theo nơi ăn + `sangNoiKhac` + `x.noiKhac/noiKhacTen`; napComTrua trả `cuaToiKhac`, `noiNha`, `noiKia`; web 2 ô `.cm-so-o` `[data-noi=nha|kia]`, dòng `.cm-sang-ghi`, `luuThucDon` / `xoaThucDon` (BEP + ADMIN), `comTongHop_` (người = tài khoản Đang dùng trừ NV nghỉ việc; không xưởng → nhóm `VP` tên \"Ban điều hành và trưởng bộ phận\" (`COM_TEN_VP`); tổng hợp có `haNam` / `haNoi` (`comHaNoi_`: mã nhóm `HNOI_*` = Hà Nội, còn lại kể cả xưởng = Hà Nam), dòng tổng cuối đổi thành \"Tổng tất cả\"; **tài khoản HR + QC KHÔNG tính suất cơm** (`comKhongTinh_`: không đăng ký, không vào tổng hợp, lượt cũ bị bỏ qua; HR vẫn báo thực đơn + xem tổng hợp, `quyen.khongTinh`); trợ lý TL vẫn ở nhóm VP; **chỉ trưởng phòng TP ăn cùng ban điều hành → suất vào nhóm VP (`comMx_`); phó phòng PP và trưởng bộ phận TBP vẫn tính theo xưởng / bộ phận** (chủ dự án 11/10); tên: ADMIN/HR/BEP mọi xưởng, TP xưởng mình), `dsKhongCT` = danh sách không ăn {ten, ma, xuong} (chủ dự án yêu cầu admin thấy đủ họ tên, mã NV, xưởng; web `comKhongHtml`); DangKyCom có cột MaNV, file lưu tháng có cột Mã NV; `comTongKetThang_` gọi trong `chotThangTuDong` trước `guiBaoCaoThang_`: ghi SuatAnThang, tạo bảng tính \"Đăng ký cơm trưa <kỳ>\" vào `bcThuMuc_(ky)`, rồi xóa DangKyCom/ThucDon của kỳ (lỗi Drive thì không xóa); báo cáo tháng `bcCom_`/`bcComHtml_` (bao-cao.gs). Vai trò mới **BEP**: `napDuLieuLoi_` trả dữ liệu rỗng. Web = va-index.py **mục 16** (`tests/com-trua/va-com.{py,css,js}`): `#combar` trên mọi trang (`comTai` sau `buildNav`, tự tải lại 5 phút), tab `com` cho mọi vai trò, `TABS.BEP`. Đăng ký hộ (11/10): `dangKyComHo(token, ngay, dsTk, an)` – TP/PP người trong xưởng mình, ADMIN mọi người; cột mới `DangKyHo` (tên người đăng ký hộ, `comSheet_` tự thêm cột thiếu); `napComTrua` trả `hoNguoi` + `hoDK[ngay][tk]=[an, ai]` và `cuaToiHo`; web `comHoHtml` (chọn ngày, tìm tên, lọc chưa đăng ký, nút đăng ký ăn cho tất cả người chưa đăng ký). Phạm vi (`comHoDuoc_`, chủ dự án 11/10): TP/PP chỉ xưởng mình; ADMIN + TL chỉ người khối văn phòng (tài khoản không gắn xưởng, nhóm `VP`). Đổi vai trò tài khoản có sẵn sang TL: sửa ô VaiTro trong sheet TaiKhoan (web chưa có nút đổi vai trò). Vai trò mới **TL = Trợ lý ban điều hành** (11/10): TABS.TL = Hướng dẫn, Tổng quan, Bảng KPI, Sơ đồ nhà máy, Cơm trưa; máy chủ không coi TL là ADMIN nên mọi hàm sửa từ chối (đã rà bằng gọi thử toàn bộ hàm công khai trên giả lập – chỉ hàm cơm trưa đổi dữ liệu; lưu ý cũ: `chayPhatNhapTre`, `chotThangTuDong`, `snapshotKPIHangNgay` là hàm trigger không kiểm tra phiên, ai gọi qua google.script.run cũng chạy được); cơm trưa TL như ban điều hành (báo thực đơn, đăng ký hộ mọi người, xem tên). Họ tên / mã NV trong tổng hợp cơm: chỉ ADMIN + TL (cả nhà máy) và TP (xưởng mình); BEP + HR chỉ thấy số. **Chế độ chỉ xem** (11/10, va-com.js `CHI_XEM_TAB`, `chiXemDon`): TL xem thêm Điểm danh, Công đoạn, Nhân sự, Máy móc; HR có các tab như TL (+ cơm trưa như TL: tên, báo thực đơn, đăng ký hộ khối VP) và SỬA được Hồ sơ nhân sự. Các tab chỉ xem được vẽ tạm với `ME.vaiTro='ADMIN'` (thấy toàn nhà máy) rồi ẩn nút / thẻ sửa (MutationObserver), `call()` chặn mọi hàm không phải hàm đọc (`laHamDoc_`). **Nhóm ngoài xưởng báo tổng số suất** (11/10, thay 4 bộ phận cũ – vai trò NV/TBP đã bỏ khỏi form, máy chủ từ chối tạo mới): `COM_BO_PHAN` = HNAM_BEP / HNAM_KTK / HNOI_MAY / HNOI_MKT / HNOI_STORE / HNOI_HCKT (thêm 11/10) (khai báo ở cả com-trua.gs và va-com.js, giữ trùng mã), không nằm trong PhongBan nên không vào KPI; vai trò `NHOM` (1 tài khoản / nhóm, chỉ tab Cơm trưa, `napDuLieuLoi_` trả rỗng) xem tổng hợp số suất toàn công ty như bếp (`comXem_` có NHOM, chỉ số, không tên), báo số suất mỗi ngày bằng `baoSuatNhom(token, ngay, so)` (0–`COM_MAX_SUAT`=300, sửa tới hết ngày ăn) → cột mới `SoSuat` của DangKyCom; `comTongHop_` thêm dòng `nhom:true` (an = số đã báo, `baoChua` + `nhomChua` nếu chưa báo), xếp sau các xưởng, trước VP; không tính vào số người; file lưu tháng có dòng \"(nhóm báo tổng)\". Web: `comNhom()`, ô `.cm-so-in` + `comBaoNhom` thay nút Ăn/Không ăn. Tài khoản bếp (vai trò BEP) không đăng ký suất, không tính vào số người; thanh/thẻ hiện số suất thay nút. Kiểm thử `tests/com-trua.js` (81, giả lập + DATA) và `tests/com-trua-web.js` (41, bản xem thử `GIO=2026-10-12T14:30:00+07:00`; đổi người trong trang qua `__MAY_CHU.taoPhien_`). gia-lap-kpi.js thêm `SpreadsheetApp.create`, `DriveApp.getFileById`.\n- **24/10 (chủ dự án): nhắc trưởng / phó phòng số người chưa báo cơm** – `tests/com-trua/va-com.js`.\n  - `comNhacTP(t)` thêm 1 dòng vào thanh `#combar`: \"⚠ Xưởng còn x / y người chưa báo cơm <ngày> – chốt lúc 22:00\".\n  - Chỉ hiện khi `ME.vaiTro==='TP'`, có thực đơn ngày tới, `comMo(t)` (trước 22:00 theo giờ máy chủ) và còn người chưa báo. Thanh tự tải lại 5 phút/lần nên sau 22:00 tự tắt.\n  - Danh sách lấy từ `hoNguoi` + `hoDK` (sẵn có cho đăng ký hộ; người nghỉ dài hạn tính là đã báo).\n  - Bấm \"Xem tên / báo hộ\" (`comMoBaoHo`): mở tab Cơm trưa, khối Đăng ký hộ lọc sẵn người chưa báo.\n  - Đã thử: TP thấy (máy tính + điện thoại), công nhân và ban điều hành không thấy.\n  - `com-trua-web.js` vẫn lỗi như trước: kiểm thử viết cho mốc 12/10 và dữ liệu chưa có thực đơn.\n", "duong": "bo-nao/KPI/KPI Cơm trưa.md", "lk": ["KPI Báo cáo tháng", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)", "nhom": "KPI", "txt": "# KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11)\n\nLiên quan: [[KPI Quy trình sản xuất]] · [[KPI Bảo mật và vận hành]] · [[KPI Phần giao diện tải sau]] · [[KPI Kiểm thử]] · [[Việc chờ chủ dự án]] · [[00 Mục lục]]\n\n## Yêu cầu chủ dự án (08/11)\n- Trước làm cấu hình gậy bằng Excel nên thiếu sót; muốn đầy đủ như bản vẽ `cue-carbon.html` (chủ dự án làm bằng Qoder: cơ pool carbon 58 in, 12 chi tiết, mặt cắt, detail joint / đuôi).\n- Chọn phương án B: **bản vẽ tự vẽ theo bảng thông số**. **Tab riêng \"Cấu hình gậy\"**; **C077 đo đạc, nhập, lưu**; **Giám đốc SX C019 duyệt** mới có hiệu lực; có **nút tải PDF**.\n- **Tài liệu mật**: chỉ **C019, C056 (chủ sở hữu), C077, C067** xem. PDF có dấu chìm tên người tải + giờ + **logo Rhino mờ**; mỗi lần tải ghi nhật ký.\n- Danh sách dòng gậy **dùng chung** Đơn hàng › Cấu hình sản phẩm (PL_DONG + CauHinhSP).\n- Bản vẽ: **ngọn và chuôi vẽ riêng, dựng đứng, cạnh nhau**; mặt cắt cũng dựng đứng; ghi sẵn Ø các mốc, chiều dài từng đoạn, cấu tạo trong, ren + vật liệu.\n\n## Cách dựng\n- Máy chủ `tests/cau-hinh-gay/cau-hinh-gay.gs` (+ `va-cau-hinh-gay.py`, chạy cuối va-code.py):\n  - `CG_QUYEN = {C056:xem, C019:duyet, C077:sua, C067:xem}`; `cgQuyenCua_(me)` – mã NV phải gắn **đúng 1** tài khoản đang dùng (chặn tạo tài khoản trùng mã); `docPhien_` thêm `o.cg`; `layManhGiaoDien` cho mảnh `CauHinhGay` theo mã NV.\n  - Sheet ẩn `CauHinhGay` (Id, MaDong, PhienBan, TrangThai: Chờ duyệt / Hiệu lực / Bản cũ / Từ chối, DuLieu JSON, NguoiLuu, ThoiDiemLuu, GhiChu, NguoiDuyet, ThoiDiemDuyet, LyDo).\n  - Hàm: `layDsCauHinhGay`, `layCauHinhGay(ma, phienBan)` (người chỉ xem không thấy bản chờ; ghi nhật ký \"Xem cấu hình gậy\" mỗi người/dòng/6 giờ), `luuCauHinhGay` (C077 – mỗi dòng 1 bản chờ, lưu lại thì thay, giữ số bản), `duyetCauHinhGay` (C019 – từ chối bắt buộc lý do; duyệt → bản hiệu lực cũ thành \"Bản cũ\"), `ghiTaiPdfCauHinhGay`, `demCauHinhGayCho` (Việc hôm nay của C019).\n  - `cgLoc_`: chỉ lưu trường trong `CG_KHOA` (khớp `CG_TRUONG` ở web – va-cau-hinh-gay-web.py **kiểm khớp khi dựng**), đúng kiểu, số 0–5000, chữ ≤ 120.\n- Web: mảnh tải sau **`CauHinhGay.html`** (nguồn `tests/cau-hinh-gay/cau-hinh-gay-web.html`, mục 42 `va-cau-hinh-gay-web.py`): tab `cgay` (nhóm Sản xuất), chỉ hiện khi `ME.cg`; logo Rhino xám chèn base64 cho dấu chìm. Đã thêm `CauHinhGay` vào `danh-sach-file.txt` + `cai-dat-clasp/chung.ps1` + `tao-ban-xem-thu.js`.\n  - Danh sách nhóm: Gậy (đánh / nhảy / phá / phá nhảy) → Ngọn lẻ → Chuôi lẻ; trong nhóm: ngọn full carbon → mix → glassfiber; chip v-số / Chờ duyệt / Chưa có.\n  - 62 ô thông số (`CG_TRUONG`), mẫu = cơ 58 in của bản tham chiếu; ô vàng = chưa đo, ✓ xác nhận số mẫu; `cgKiemTra` báo ghép sai (collar ngọn/chuôi, insert lọt ống, ren insert ↔ pin ↔ ren khai báo, pin thò > insert, bậc cap/sleeve, khoang/bolt…).\n  - Bộ vẽ: `cgKhuc(t,'ngon'|'chuoi')` (hình ngoài + mặt cắt dọc dựng đứng, trục đúng tỉ lệ, Ø phóng ~3×, dây kích thước bên trái, Ø ngang trên hình, nhãn vật liệu bên phải xếp không chồng), `cgCT(t,'A'|'C'|'D')` (đầu ngọn, joint, đuôi – đúng tỉ lệ thật phóng to); bấm hình để phóng to.\n  - PDF: jsPDF 2.5.1 + html2canvas 1.4.1 (cdnjs, có `integrity`), **2 trang A4 dọc**; mạng chặn thư viện → mở hộp in \"Lưu thành PDF\".\n- `bao-mat-ung-dung` 08/11: không lỗi nặng; đã vá: onclick dùng `data-ma`, chống trùng mã NV, lọc khóa (chặn `__proto__`), người chỉ xem không nhận bản chờ, nhật ký xem, SRI cho thư viện. Giới hạn: dấu chìm chỉ ở PDF (chụp màn hình vẫn được); ai có quyền sửa Google Sheet vẫn đọc được sheet CauHinhGay.\n\n## Kiểm thử (08/11)\n- `tests/cau-hinh-gay.js` 45/45 (quyền, lưu / duyệt / từ chối / phiên bản, nhật ký, dữ liệu xấu, mã NV trùng).\n- `tests/cau-hinh-gay-web.js` 40/40 (máy tính + điện thoại; LIB=<node_modules có jspdf + html2canvas> để thử PDF: 2 trang, ~690 KB).\n- Không ảnh hưởng: manh-web 8/8, tong-quan-web 26/26, nhan-su-loc-web 13/13, tang-toc-4 14/14, luu-tru 15/15, dieu-phoi 24/24.\n\n## Tra cứu cấu tạo chuẩn (08/11, chủ dự án yêu cầu \"search internet để vẽ cho chuẩn\")\n- Ngọn carbon: ống carbon quấn trên lõi thép + epoxy, thành 0,8–1,2 mm (nhiều hãng ~1,0); lõi foam polyurethane (có hãng nhiều tỉ trọng), có hãng bịt nút gỗ maple 2 đầu lõi (Meucci); ferrule gậy carbon 6–13 mm (gỗ cổ điển 19–25). Predator: đầu joint Ø21,31–21,38 mm.\n- Chuôi: đa số gậy carbon vẫn chuôi gỗ; A-joint = mộng tròn cắm lỗ khoan (thợ hay dùng 5/8\" ≈ Ø16 × 16); joint pin tổng ~80 mm, phần lớn chôn trong forearm; weight bolt thường 3/8-16, chỉnh ~17,5–21,5 oz.\n- Ren joint (`CG_REN` trong web): 3/8-8 (Ø9,525 · bước 3,175), 3/8-10 (2,54), 3/8-11 (2,309, không lắp lẫn 3/8-10), 3/8-14 (1,814), 5/16-14 (Ø7,938 · 1,814), 5/16-18 (1,411), Radial (~Ø9,42 · ~7,6 ren/inch ≈ 3,34, ren tròn, vặn thẳng vào gỗ / phenolic – số đo thợ, hãng không công bố), Uni-Loc / Q-loc / VQR… (độc quyền – đo thật).\n- Đã thêm vào bản vẽ / form (67 ô): nút bịt đầu / cuối lõi + vật liệu, pin chôn trong chuôi, profile ren (V / tròn – Detail C vẽ ren răng cưa hoặc ren tròn); đổi ren pin → tự điền Ø, bước, profile, ren insert (ô chưa đo); kiểm tra: Ø / bước khác chuẩn của ren, pin chôn chạm mộng A-joint, nút bịt + tenon + insert dài hơn ống. Hộp \"Tham khảo khi đo\" (bảng ren + cấu tạo) trong tab, không in PDF.\n- Nguồn: pooldawg.com (What's my joint style), predatorcues.com (joint types, Uni-Loc guide), uni-loc.com, meuccicues.com (Carbon Pro), forums.azbilliards.com (Radial), dzcues.com (A-joint), bizubilliards.com (quy trình làm ngọn carbon).\n\n## Đổi quyền (09/11)\n- Chủ dự án: **cả 4 tài khoản sửa được**, **C019 hoặc C056 duyệt**, **được tự duyệt** bản mình lưu. `CG_QUYEN = {C056: duyet, C019: duyet, C077: sua, C067: sua}`; `cgQuyen_(…, 'sua')` nhận cả `duyet`. Bản chờ: mỗi dòng gậy 1 bản, ai lưu sau thay bản đang chờ (web báo tên người lưu). Tổng quan chủ sở hữu tự nạp số bản chờ duyệt (`demCauHinhGayCho`). Kiểm thử `cau-hinh-gay.js` 50/50.\n\n## Chuôi carbon theo bản vẽ thực tế Rhino (09/11)\n- Chủ dự án gửi 7 PDF tham khảo (Omega shaft/butt, Radial pin, Rhino cue butt, Rhino carbon fiber, Uni-Loc, \"Cao Su Bịt Nối Ø26mm\", \"Cao Su Ø26mm\") – \"vẽ chuẩn như vậy\".\n- Thêm ô **Kiểu chuôi** (`chuoi.kieu`: carbon mặc định / gỗ). Form chỉ hiện nhóm ô đúng kiểu (`cgTruongHien`), đếm \"đã đo x / y\" theo nhóm đang hiện. Ô kiểu là ô chọn.\n- Chuôi carbon (`cgTrongCb` dùng chung cho hình chuôi + chi tiết C / D, `cgNgoaiCb` viền trên hình ngoài): vỏ (thành `vo.day`) · veneer đầu dưới collar · **khối POM đen giữ pin** (lỗ pin, đáy kín) · lõi foam 2 đoạn (forearm xanh nhạt, tay cầm xanh đậm, chấm như bản vẽ) · **thanh thép nối** forearm / tay cầm (`thanhNoi.l` = 0 → không có, bản \"Bịt Nối\" có) · 2 vòng inlay be · cap veneer · **ống POM ren trong** (đáy kín trên) + **quả cân đồng** (số quả × dài, rãnh vặn) · ren cắm bumper · bumper cao su Ø26.\n- Mẫu mới: cap 4 (veneer xanh), bumper Ø26 × 15 ren cắm 12, sleeve 117,6 (giữ tổng 58 in), khối pin Ø16 × 75, ống Ø18 × 150 ren M12, 2 quả Ø12 × 25, thanh nối Ø10 × 100, vỏ 1,6. Chất liệu chuôi FC/MIX/GF → \"Carbon\"/\"Mix…\"/\"Glassfiber\".\n- Chuôi gỗ giữ nguyên cách vẽ cũ (mộng A-joint + khoang cân + weight bolt) – nhóm ô \"Chuôi – gỗ: mộng + khoang cân\".\n- 90 trường (CG_KHOA máy chủ sinh lại từ CG_TRUONG). Kiểm tra mới: khối pin lọt lòng vỏ / to hơn pin, pin chôn sâu hơn veneer + khối, thanh nối lọt lòng / quá dài, ống lọt lòng / quá dài, quả cân quá to, số quả × dài + ren bumper vừa ống, bumper to hơn cap. Bảng chi tiết chuôi carbon 15 dòng.\n- Màu mới `CG_VL`: POM (`cgHpo`), veneer (`cgHve`), inlay, foam xanh nhạt (`cgHfx`) / đậm (`cgHfd`).\n- Kiểm thử: `cau-hinh-gay.js` 50/50, `cau-hinh-gay-web.js` 40/40 (thay ô \"bậc đuôi\" bằng kiểm đủ chi tiết chuôi carbon).\n- Chưa chắc (đã hỏi chủ dự án): \"Bịt Nối\" có đúng là thanh thép nối không; ngọn có cần vẽ lại cùng kiểu màu không; kích thước thật ống POM / quả cân / khối pin.\n\n## Joint pin = ảnh cắt từ bản vẽ gốc Rhino (09/11)\n- Chủ dự án: \"phần joint pin không vẽ chính xác được thì cắt ảnh ghép vào\"; chọn **ghép thẳng vào file** (biết repo đang công khai) và **thay vào chi tiết chuôi, bỏ số kích thước trên ảnh**.\n- Nguồn: 4 PDF bản vẽ pin (3/8-8 Radial xẻ rãnh, Uniloc, 5/16-18 Inox/Mạ, 5/16-14 ren cái). Cách làm: `pdftocairo -svg` → bỏ chữ (`<use>`) và nét kích thước (stroke-width 1, 2), giữ nét thân pin (5, 6; Uniloc 4, 6, bỏ 2 đường dẫn ghi chú) → chụp 4× → cắt sát → xoay đứng (đầu ren nối ngọn lên trên) → nền ngoài trong suốt, trong thân tô xám thép → `kpi-app/anh/pin/pin-{radial,uniloc,r1618,r1614}.png` (~23–27 KB).\n- `va-cau-hinh-gay-web.py` chèn ảnh base64 + kích thước vào `CG_PIN` (giữa `/*PIN*/`): L dài, T thò khỏi vai, D Ø lớn nhất – Radial 85,20 / 35,85 / 9,80; Uniloc 80,80 / ~50,7 / 9,71; 5/16-18 76,55 / 27,20 / 9,80; 5/16-14 ~79,6 / ~30,6 / 9,70 (5/16-14 và Uniloc đo trên hình).\n- Web: `cgPinAnh(c)` chọn ảnh theo ô Pin ren (`CG_REN[8]`), `cgVePin` đặt ảnh đúng tỉ lệ thật (vai tại mặt joint), cắt theo vùng nhìn (svg lồng). Thay pin tự vẽ ở hình chuôi (ngoài: chỉ phần thò; mặt cắt: cả pin) và chi tiết C (cả chuôi carbon lẫn gỗ). Ren khác (3/8-10, 11, 14, 5/16 khác) vẫn tự vẽ.\n- `CG_REN` theo bản vẽ công ty: **3/8-8 = Radial** (Ø9,36 · bước 3,20 · ren tròn), 5/16-18 Ø7,70 · 1,41, Uniloc Ø9,71 · 2,30 (60°); thêm [6] thò, [7] chôn → mẫu và ô tự điền khi đổi ren; insert ngọn mẫu ≥ thò + 2 (Radial 38). Kiểm tra mới: pin thò / chôn lệch bản vẽ > 1 mm.\n- Kiểm thử: cau-hinh-gay 50/50, cau-hinh-gay-web 40/40 (đổi số mẫu pin thò 12,7 → 35,85), manh-web 8/8. CauHinhGay.html ~240 KB.\n\n## Gậy nhảy / phá nhảy 3 khúc + khối đối trọng (09/11)\n- Chủ dự án gửi 4 bản vẽ mặt cắt nhà máy: \"mặt cắt chuôi 1/2\" (chuôi full carbon 736 có khối 100 ở 550 / 600 / 300, Komet khối 50 ở 420, mix khối 70 ở 300, trọng lượng trước sơn 14–14,6 oz; Nhảy full carbon 220-360), \"chuôi nhảy, phá nhảy\" (**Nhảy 350-150**: ren radial ngắn, foam nặng, lõi carbon mix; **Phá nhảy lùn 380-250**: ren radial dài, POM dài, foam nặng, lõi carbon mix), \"mặt cắt ngọn\" (735, bảng Ø mỗi 50 mm 21,37 → 13,87).\n- Chủ dự án chốt: ngọn gậy 3 khúc **C077 đo riêng**; thêm ô **Số khúc** (2 / 3); khối giữa lõi = **khối đối trọng**; bảng Ø ngọn mỗi 50 mm **chưa cần**.\n- Trường mới (101 trường): `chuoi.soKhuc`; nhóm \"Chuôi – khớp giữa (gậy 3 khúc)\" (`chuoi.noi.dai` đuôi rời / khớp cách đuôi, `ren`, `pinD`, `tho`, `chon`, `insD`, `vl`) chỉ hiện khi 3 khúc (`cgK3`, nhóm `'k3'` trong `cgTruongHien`); `chuoi.khoiCan.{dai,vt,vl}` (tâm cách đuôi) trong nhóm carbon.\n- Mẫu: kiểu NHAY / PHANHAY → 3 khúc (trừ tên có \"2 khúc\"; tên có \"3 khúc\" luôn 3). Tên dạng \"(390-100)\" → khúc trên 390 + đuôi rời 100; mặc định 350-150 (nhảy) / 380-250 (phá nhảy); forearm / tay cầm / sleeve chia theo tổng; ống quả cân vừa đuôi rời, thanh nối 0, khối đối trọng 0. Gậy 2 khúc: khối đối trọng FC 100 ở 550, MIX 70 ở 300.\n- Vẽ: `cgKhopGiua` (ống ren POM ở đáy khúc trên + pin nối thép cắm từ đuôi rời + vạch tháo rời) trên hình chuôi + kích thước KHÚC TRÊN / ĐUÔI RỜI bên trái; chi tiết mới **K · KHỚP GIỮA** (`cgCT(t,'B')`, lưới 4 cột khi có); khối đối trọng trong `cgTrongCb`. Bảng chi tiết thêm nhóm KHỚP GIỮA (K1–K3) + dòng khối đối trọng; thông số ghi \"3 khúc: trên + đuôi\".\n- Kiểm tra: đuôi rời hợp lệ, pin < ống ren, ống ren lọt lòng vỏ, ống quả cân + pin chôn ≤ đuôi rời, thanh nối ≠ 0 ở gậy 3 khúc (vàng), khối đối trọng chạm ống quả cân / khối pin / khớp giữa. Bỏ cảnh báo \"ngọn – chuôi chênh nhiều\" cho gậy 3 khúc.\n- Kiểm thử: cau-hinh-gay 50/50, cau-hinh-gay-web 46/46 (thêm TKNHAY 390-100, EVOVAL 380-250, RETRO không khớp giữa). PDF EVOVAL 2 trang có đủ A · C · K · D.\n\n## Chuôi 2 mảnh vẽ tách rời + kích thước mẫu theo bản vẽ nhà máy (09/11)\n- Chủ dự án: \"chuôi 2 khúc thì vẽ rời 2 khúc ra, đừng vẽ dính liền\"; \"xem lại kích thước toàn bộ phần ngọn\".\n- Hình chuôi gậy 3 khúc: vẽ 2 lần cắt theo khớp giữa (clipPath `cgKT/cgKD` + số `CG_SO`), mảnh đuôi rời dời xuống G px (≥ 54, đủ chỗ pin thò); **pin nối đi cùng đuôi rời** (`cgPinNoi`, cả hình ngoài + mặt cắt), khúc trên còn lỗ ống ren; chữ \"⇅ tháo rời / khớp giữa\"; nhãn + kích thước phía dưới dời theo (`Y` mới), KHÚC TRÊN / ĐUÔI RỜI tách 2 đoạn. `cgKhopGiua(..., roi)`; chi tiết K vẫn vẽ ghép để thấy pin cắm vào ống ren.\n- Mẫu theo bản vẽ nhà máy: **ngọn 735 từ mặt joint tới hết ferrule** (ống 719 + collar 12 + ferrule 4; tổng hiển thị 745,7 gồm tip 9,5 + pad 1,2, có thêm đường kích thước \"735 KHÔNG TÍNH TIP + PAD\"); **chuôi 2 khúc 736** (sleeve 117). Gậy nhảy / phá nhảy: Ø ngọn theo bảng \"Nhảy full carbon\" (joint 21,37 → 16,14 cách đầu 335 → đầu 13,87), collar + forearm đầu Ø21,37 cho khớp joint. Gậy đánh giữ Ø mẫu cũ (bản vẽ ngọn 735 không ghi Ø).\n- Kiểm thử: cau-hinh-gay 50/50, cau-hinh-gay-web 46/46 (tổng mẫu 1.481,7 mm).\n\n## Đơn vị đo: giữ như cũ (09/11)\n- Chủ dự án yêu cầu \"chuyển hết đơn vị đo về mm\" → tôi lỡ bỏ cả inch ở tổng dài, đổi ghi chú \"ren/inch\", bỏ oz (commit bd2aff0) → chủ dự án: **trả lại như cũ**; tên ren / ghi chú ren giữ nguyên, **oz vẫn dùng**; chỉ cần chiều dài + đường kính của ngọn và chuôi bằng mm. Đã revert (d22b709). Hiện mọi chiều dài / Ø ngọn, chuôi (hình, chi tiết, bảng, ô nhập, PDF) đều đã là mm; chỉ dòng tổng cả cây ghi thêm \"· x in\".\n", "duong": "bo-nao/KPI/KPI Cấu hình gậy – bản vẽ kỹ thuật (08-11).md", "lk": ["KPI Quy trình sản xuất", "KPI Bảo mật và vận hành", "KPI Phần giao diện tải sau", "KPI Kiểm thử", "Việc chờ chủ dự án", "00 Mục lục"]}, {"id": "KPI Cập nhật bằng clasp", "nhom": "KPI", "txt": "# KPI Cập nhật bằng clasp\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[Lần dán lên Apps Script]] · [[KPI Tổng quan và cách dựng]] · [[KPI Tăng tốc đợt 2 (21-10)]] · [[00 Mục lục]]\n\nChủ dự án 21/10 nhờ \"tự dùng máy tính của tôi cài clasp\": phiên đám mây không có công cụ điều khiển máy tính, và Claude không được gõ vào cửa sổ lệnh → làm bộ cài bấm đúp cho Windows.\n\n- Thư mục `kpi-app/cai-dat-clasp/` (repo công khai nên tải được thẳng từ GitHub raw): `1-CAI-DAT.bat`, `2-CAP-NHAT.bat`, `3-KHOI-PHUC.bat` gọi `cai-dat.ps1`, `cap-nhat.ps1`, `khoi-phuc.ps1` (UTF-8 có BOM, CRLF – PowerShell 5.1 cần BOM), hàm chung `chung.ps1`, hướng dẫn `HUONG-DAN.md`.\n- Cài: winget cài Node.js LTS nếu thiếu → `npm i -g @google/clasp@2.4.2` (ghim bản 2.x để `fileExtension:\"gs\"` và cú pháp `deploy --deploymentId` không đổi) → mở trang bật Apps Script API → `clasp login` → hỏi Mã tập lệnh → `.clasp.json` + `clasp pull` vào `%USERPROFILE%\\KPI-AppsScript\\ma` → sao lưu → chọn bản triển khai web (bỏ @HEAD) → `cau-hinh.json` {scriptId, deployId, tuTrienKhai = manifest có \"webapp\"}.\n- Cập nhật: sao lưu (`clasp pull` → `sao-luu\\yyyy-MM-dd_HH-mm-ss`) → tải Code.gs + Index/SoDo/HoatAnh/AmThanh.html từ nhánh `claude/beautiful-ptolemy-f2j7za` (kiểm tra kích thước + có `function napDuLieu`) → ghi đè file .gs đang chứa `function napDuLieu` (tên có thể là \"Mã\"), xóa file html sai hoa/thường (vd. \"Sodo\") → `clasp push -f` → `clasp deploy --deploymentId` (giữ link). Khôi phục: chọn bản sao lưu → push + deploy.\n- Bẫy đã gặp khi thử: hàm PowerShell tên `Clasp` trùng lệnh `clasp` → tự gọi lại vô hạn (đã đổi `GoiClasp`, gọi `clasp.cmd` trên Windows); PowerShell 5 coi chữ in ra stderr là lỗi khi `ErrorActionPreference=Stop` → tạm đặt Continue khi gọi clasp.\n- Đã thử trên Linux bằng PowerShell 7.4.6 (tải về /tmp/pwsh) + \"clasp giả\" (scratchpad `thu-clasp/bin/clasp`): cả 3 bước chạy đúng. **Chưa chạy trên Windows thật / clasp thật** – lần đầu nên làm cùng chủ dự án.\n- 22/10: chủ dự án **cài xong**. Lỗi gặp lần đầu: bấm .bat ngay trong file ZIP (Windows chỉ giải nén .bat ra Temp) → PowerShell báo \"-File … không tồn tại\". 3 file .bat nay kiểm tra .ps1 có cạnh không, báo \"CHUA GIAI NEN THU MUC\" + cách sửa.\n- 22/10: lần cập nhật đầu báo \"ĐÃ DÁN XONG – CÒN 1 BƯỚC\" (lúc cài, dự án KPI thiếu 1 trong 2 điều kiện tự triển khai: tìm được bản triển khai web + appsscript.json có mục \"webapp\"; bộ Thiên Cơ Các cùng mã nhưng dự án đủ điều kiện nên tự triển khai được). `cap-nhat.ps1` nay **tự kiểm tra lại mỗi lần**: đủ điều kiện thì ghi `tuTrienKhai=true` vào cau-hinh.json và triển khai luôn; chưa đủ thì in lý do. Thử bằng clasp giả (pwsh `/tmp/pwsh/pwsh`, thư mục `scratchpad/thu-clasp`): 3 trường hợp đúng. Chủ dự án phải chép đè `cap-nhat.ps1` mới vào thư mục cai-dat-clasp trên máy (file .ps1 chạy ở máy, không tự tải).\n- 22/10 chiều: chủ dự án báo \"làm đủ các bước\" mà không thấy khối Ban điều hành & HCNS. Soát sheet thật (tải 16:50): từ 12:10 có 174 lượt đăng nhập, 42 người gửi sản lượng sau 13h trong đó **34 người đang thiếu hồ sơ** mà vẫn gửi được, 0 lượt \"Tự điền hồ sơ\", chưa có sheet HoSoVanPhong → **web công ty vẫn chạy bản trước 12:04** (bản hồ sơ bắt buộc chưa lên). Nghi: clasp nối nhầm dự án (vd. bản sao \"Tạo bản sao dự án\") hoặc triển khai nhầm bản triển khai (không phải link công nhân dùng). Mã không lỗi (bản thử chạy đúng; Index không có `<?` – trang dựng bằng `createTemplateFromFile`).\n- Thêm mục 32 `tests/phien-ban/va-phien-ban.py`: dòng **\"Bản web: dd/mm/yyyy hh:mm\"** cuối thanh menu (giờ dựng Index; nếu Code.gs dựng giờ khác thì thêm \"· máy chủ: …\" từ `me.banMay` = `KPI_BAN_MAY` trong va-ho-so.py). Cập nhật xong mà dòng này không đổi = web vẫn chạy bản cũ.\n- 22/10 tối: chủ dự án gửi 3 link: `AKfycbze…` (link công ty dùng), `AKfycbyQ…` (\"tự cài do clasp\"), `AKfycbz2…`. Rà mã: bộ cài chỉ gọi `clasp deploy --deploymentId <mã có sẵn>` (cập nhật link cũ), KHÔNG có lệnh tạo bản triển khai mới; lần đầu còn báo \"CÒN 1 BƯỚC\" (không triển khai gì). Kết luận khả năng cao: lúc cài đã chép Mã tập lệnh từ tab **bản sao** (\"Tạo bản sao dự án\" để sao lưu) → clasp đẩy vào bản sao; bản sao chưa có triển khai nên bước làm tay sinh link mới; link gốc ở dự án gốc không được cập nhật. Nhánh GitHub đúng (đã so Code.gs / Index.html trên raw = bản dựng). Chờ chủ dự án so Mã tập lệnh dự án gốc với scriptId trong cau-hinh.json.\n- Chặn lặp lại: `cai-dat.ps1` cảnh báo đỏ + hỏi lại nếu dự án chưa có bản triển khai web nào (dấu hiệu bản sao); `cap-nhat.ps1` cảnh báo tương tự, dặn đừng bấm \"Triển khai mới\"; HUONG-DAN bước 5 nhắc lấy Mã tập lệnh của đúng dự án (không phải \"Bản sao của …\"). Thử bằng clasp giả: đúng.\n- 22/10 tối – **NGUYÊN NHÂN THẬT (đính chính giả thuyết \"bản sao\" ở trên – sai)**: chủ dự án chạy lại 1-CAI-DAT, màn chọn cho thấy cả 3 link CÙNG một dự án: 1) phiên bản 225 \"Cập nhật … bằng clasp\" `AKfycbyQ…`, 2) 226 `AKfycbz2…`, 3) 227 `AKfycbzeCiG2…` (link công ty). Lúc cài lần đầu đã chọn số 1 → clasp cập nhật đều vào link cũ `AKfycbyQ…` (không phải do clasp tạo); link công ty không được cập nhật. Lần cài lại gõ \"227\" (số phiên bản) thay vì số thứ tự → `$ds[226]` rỗng → hiện nhầm cảnh báo \"chưa có bản triển khai\".\n- Sửa `ChonTrienKhai` (chung.ps1): hiện \"link …/s/AKfy… (phiên bản N · mô tả)\", nhận số thứ tự / số phiên bản / vài ký tự đầu mã, sai thì hỏi lại. Thử bằng clasp giả 4 cách gõ: đúng. Chủ dự án đã tự triển khai phiên bản 227 vào link công ty.\n- Bài học: khi chọn bản triển khai phải so với **link công nhân đang dùng**; dòng \"Bản web\" cuối menu để kiểm tra.\n- 22/10 (khuya): sau khi cài lại chọn đúng link, 2-CAP-NHAT **tự triển khai thành công** phiên bản 229 vào `AKfycbzeCiG2…` (\"=== XONG ===\"). Chữ đỏ \"NativeCommandError … Deploying project…\" là PowerShell 5 hiện dòng tiến trình clasp in ra stderr – không phải lỗi; `GoiClasp` nay đổi từng dòng stderr về chữ thường (lỗi thật vẫn bắt qua `$LASTEXITCODE`).\n", "duong": "bo-nao/KPI/KPI Cập nhật bằng clasp.md", "lk": ["Lần dán lên Apps Script", "KPI Tổng quan và cách dựng", "KPI Tăng tốc đợt 2 (21-10)", "00 Mục lục"]}, {"id": "KPI Demo giao diện", "nhom": "KPI", "txt": "# KPI Demo giao diện\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Sửa lỗi giao diện]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[00 Mục lục]]\n\n- Demo giao diện (chủ dự án thích phong cách **thiết bị đo nhà máy**: kim lò xo, đồng hồ cơ, mặt tối; chê bộ 3D và 7 mẫu đầu demo-2 là \"xấu, không đạt\"). Mẫu đã duyệt nằm trong `kpi-app/mau-da-chon/`: `dong-ho-hieu-suat.html` (demo-2 số 8), `cum-dong-ho-xuong.html` (demo-3 số 1), `dong-ho-lat-dem-nguoc.html` (demo-3 số 8), `thuoc-truot-dinh-muc.html` (demo-4 số 5). `demo-4.html` (trừ số 5) và `demo-5.html` bị chê \"không ổn\" – chủ dự án muốn thêm **demo tương tác** và **giao diện nền**: `kpi-app/demo-tuong-tac.html` (6 thao tác nhập liệu) và `kpi-app/demo-giao-dien-nen.html` (khung web 4 kiểu nền × 3 bố cục) – cả hai cũng chưa vừa ý (\"trông như đồ chơi, không sát công việc\"). Hướng mới: **làm lại đúng màn hình đang dùng, đặt bản cũ cạnh bản mới**, bỏ trang trí giả đồ vật. Bắt đầu với `kpi-app/demo-duyet-san-luong.html` (dựa trên `vDuyetSL` thật), chờ góp ý.\n- **Demo giao diện mới (11/10, chờ chọn):** `kpi-app/demo-giao-dien-moi.html` (1 file tự chứa, số liệu MẪU, ảnh Rhino 3B nhúng base64): 3 màn Việc hôm nay (danh sách việc theo mức gấp, bảng xưởng, tiến độ ca so với giờ) / Bảng KPI (lọc 1 dòng, sắp xếp cột, bấm dòng mở 4 phần điểm, điện thoại thành danh sách) / KPI của tôi (câu \"thiếu bao nhiêu lên loại trên\", thước C/B/A, cột sản lượng ngày, Rhino gợi ý) × 2 hướng A sáng \"Giấy kỹ thuật\" (Be Vietnam Pro, xanh ngọc #0f766e) / B tối \"Rhino\" (Arimo, #2b2b2b + #f7b829); khung điện thoại dùng container query `app`. Impeccable detect: 0 lỗi.\n- **Bốn kiểu giao diện độc đáo (22/10, chờ chọn):** `kpi-app/demo-giao-dien-doc-dao.html` (1 file, số liệu MẪU, ảnh bản đang dùng nhúng base64), trang xem trên điện thoại: https://claude.ai/artifact/S35dXvGWZFSHA6UFSh4bb6\n  - Chủ dự án nhờ \"tham khảo chuyên gia thiết kế, tìm trên mạng\". Đã hỏi vai `soat-giao-dien-cuoi`, tìm: chuẩn HMI ISA-101 (màn xám, chỉ tô màu khi bất thường, thước có dải mục tiêu), bảng Andon (kế hoạch / thực tế / chênh, đèn từng giờ), phong cách thiết bị Teenage Engineering.\n  - 4 hướng, đều làm lại đúng 2 màn đang dùng: Tổng quan (BĐH) + KPI của tôi (điện thoại). Thêm tab \"Bản đang dùng\" là ảnh chụp bản xem thử:\n    1. **Tủ đồng hồ**: đồng hồ có vạch đúng ngưỡng xếp loại C70/B80/A85/A+90/S95, số lật, thước kim theo xưởng, \"còn x điểm lên hạng\". Chuyên gia chọn hướng này.\n    2. **Phòng điều khiển** (ISA-101): danh sách cần xử lý theo mức, thước xám có dải 80–100, đường sản lượng cộng dồn so với kế hoạch.\n    3. **Bảng Andon**: kế hoạch / thực tế / chênh + 8 ô giờ, gồm xanh = đạt (≥ 97%), vàng = hơi chậm, đỏ = chậm (< 85%), ô viền = giờ đang chạy. Hợp TV treo xưởng.\n    4. **Bản vẽ kỹ thuật**: đường kích thước từ mốc 85, khung tên, chuỗi kích thước SL + CL + (TT + AT) = KPI, thước du xích sản lượng hôm nay.\n  - Lưu ý kỹ thuật: file mở trực tiếp không có `<!doctype>` → chế độ quirks, bảng không kế thừa màu/font → `.k3 table{color:var(--c);font:inherit}`. Mỗi màn dùng container query nên tự co khi khung hẹp.\n  - **23/10 – thêm kiểu 5 \"Hologram vũ trụ\"** theo ảnh chủ dự án gửi (bảng hologram xanh phát sáng giữa nền sao, vòng tròn lớn giữa, bảng phụ hai bên). Trang mở sẵn ở kiểu 5; khóa nhớ kiểu đổi thành `kpi_kieu_gd2`.\n    - Tổng quan: \"Đài quan sát KPI\", với chòm sao KPI ở giữa. Mỗi xưởng là 1 sao, khoảng cách tới tâm = KPI (60–100). Vòng đồng tâm là ngưỡng C/B/A/A+/S, vòng 80 đỏ đứt. Sao vàng ≥ 90, sao hồng < 80. Hai bên là danh sách xưởng, vòng sản lượng ca và người dưới 80%.\n    - Điện thoại: vòng KPI tổng màu vàng có mốc hạng, bên trong là 4 vòng thành phần (SL, CL, TT, AT). Thêm vòng sản lượng hôm nay và chòm sao 12 ngày.\n    - Nền sao vẽ bằng canvas (`veSao`), nhấp nháy khoảng 16 hình/giây. Tắt khi người dùng bật giảm chuyển động. Đổi kiểu thì dừng (`SAO_RAF`). Font tiêu đề Exo 2 (có tiếng Việt).\n\n\n## 08/11 – demo phong cách Apple (chỉ ở scratchpad, chưa áp vào web)\n- `scratchpad/demo/Bento-va-apple-design-4-man-hinh.html` (tao2.py): apple-design và Bento × 4 màn (nhập nhiều công đoạn, KPI của tôi, duyệt, tổng quan).\n- `scratchpad/demo/8-kieu-Apple-dien-thoai-may-tinh.html` (tao3.py, style3.css, tao3.js): 8 kiểu (danh sách nhóm, Liquid Glass, thẻ tóm tắt, vòng hoạt động, widget, thẻ xếp chồng, bảng trượt, thanh bên) + 7 bản máy tính. Chuyên gia `soat-giao-dien-cuoi`: công nhân = bảng trượt (7) + thẻ tóm tắt (3); TP = thanh bên (8) + widget (5); chủ = widget; **không dùng kính mờ** trên điện thoại (máy Android cũ), nút ≥ 44 px, chữ ≥ 13 px.\n- `scratchpad/cn/Web-cong-nhan-demo.html` (tao.py, cn.js, cn.css): toàn bộ màn tài khoản công nhân, thanh dưới 5 nút Nhập · KPI · Cơm · Xưởng · Tôi; số từ bản xem thử (C040, tên giả). Đã sửa theo `dong-vai-nguoi-dung`: D màu cam, mục tiêu lên trước, bảng xưởng chỉ top 3 + người trên + mình, bàn phím mở trống, nút Aa mọi trang. Chờ chủ dự án chốt – [[Việc chờ chủ dự án]].\n- Tốc độ: CSS cả 8 kiểu ~15 KB (nén ~4 KB) so với Index.html ~890 KB (nén ~310 KB) → không ảnh hưởng tải; chỉ kính mờ ảnh hưởng độ mượt.\n", "duong": "bo-nao/KPI/KPI Demo giao diện.md", "lk": ["Việc chờ chủ dự án", "KPI Sửa lỗi giao diện", "KPI Thao tác và hiệu ứng bên trong", "00 Mục lục"]}, {"id": "KPI Demo đã bỏ", "nhom": "KPI", "txt": "# KPI Demo đã bỏ\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n- Demo 3D lần 2 (08/10, chủ dự án hỏi \"3D cho xịn xò hơn\" dù trước đó chê bộ 3D \"như đồ chơi\"): `kpi-app/demo-3d.html` – 3D gắn đúng thao tác thật, CSS 3D thuần, cạnh bản hiện tại; chờ góp ý. Lưu ý kỹ thuật: khung kéo-xoay chỉ `setPointerCapture` sau khi kéo >6px, nếu không cú bấm vào phần tử con bị nuốt. **Chủ dự án bỏ qua 3D (08/10).**\n", "duong": "bo-nao/KPI/KPI Demo đã bỏ.md", "lk": ["Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Dọn dẹp hằng tháng và sao lưu (08-11)", "nhom": "KPI", "txt": "# KPI Dọn dẹp hằng tháng và sao lưu (08-11)\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[KPI Tăng tốc đợt 4 – đăng nhập (08-11)]] · [[KPI Tăng tốc đợt 3 (08-11)]] · [[KPI Kiểm thử]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\nChủ dự án 08/11: \"sheet nhật ký sản lượng và nhật ký thao tác có xóa bớt sau mỗi tháng không? chỉ nên giữ tháng hiện tại và tháng trước… có sao lưu hàng tháng / hàng ngày?\"\n\n## Trước khi sửa (số thật 07/11)\n- NhatKySanXuat 19.252 dòng (từ tháng 8), **chưa từng lưu trữ** (`LUU_TRU_NHAT_KY` có sẵn, giữ 3 tháng, lịch `CAI_TRIGGER_LUU_TRU` phải chạy tay – chưa chạy).\n- NhatKyThaoTac 34.319 dòng (~14.000 dòng/tháng), **không bao giờ xóa**.\n- Sao lưu: `saoLuuHangNgay` 1h sáng, chép cả file vào Drive `KPI_Backup`, giữ 30 ngày. Không có bản tháng giữ lâu.\n\n## Chủ dự án chọn\n- Nhật ký sản lượng: sheet chính giữ **tháng này + tháng trước**, cũ hơn **chuyển** sang `NhatKySanXuat_LuuTru` cùng file (không xóa).\n- Nhật ký thao tác: giữ 2 tháng, cũ hơn **xóa** (tra lại trong bản sao tháng).\n- Sao lưu tháng: **giữ 24 bản**.\n\n## Đã làm (`tests/luu-tru/`, exec cuối va-code.py)\n- `DON_DEP_HANG_THANG` – lịch **ngày 1 hằng tháng 3h** (tự cài `ldCaiLich_` khi chủ sở hữu mở web, xóa lịch cũ `LUU_TRU_NHAT_KY` ngày 5; lần đầu chạy sau 15 phút):\n  1. `saoLuuThang_`: chép file vào Drive `KPI_Backup_Thang` tên \"… — thang yyyy-MM\" (đã có thì thôi), giữ 24 bản mới nhất (cũ hơn vào thùng rác).\n  2. Chỉ khi đã có bản sao tháng này (`LD_SAO_LUU`): `LUU_TRU_NHAT_KY` với `SO_THANG_GIU = 1` (vẫn chỉ chuyển tháng **đã chốt chính thức**), `donNhatKyThaoTac_` xóa dòng trước đầu tháng trước.\n  - Kết quả lần chạy cuối: ScriptProperties `LD_LAN_CUOI` + 1 dòng Nhật ký thao tác \"Dọn dẹp hằng tháng\".\n- `docNKTu_(tu)`: nhật ký từ ngày `tu` – ghép trang lưu trữ khi `tu` cũ hơn mốc. Dùng ở `hoSoNhanVien`, `layQuyTrinh`, `dhDongGoiNgay_`, `dhSanLuongXuong_` (200 ngày), `dpTinh_`, `kiemTraTonThang`, `layThongKe`. Bảng KPI / KPI quản lý / phân tích định mức đã có sẵn `canLuuTru_`.\n- Máy giả lập: Drive giả thêm `getFiles`, `makeCopy`.\n\n## Kiểm thử\n- `tests/luu-tru.js` 15/15 (số thật): tháng 8, 9 sang lưu trữ đủ dòng; sheet chính còn 10 + 11; nhật ký thao tác xóa 17.488 dòng (còn từ 01/10); **Bảng KPI T9, T10, Thống kê T9, sản lượng xưởng 200 ngày, Quy trình 90 ngày, Điều phối, hồ sơ nhân viên giống hệt trước khi dọn**; đăng nhập đọc 345k → 202k ô; chạy lại cùng tháng không chuyển trùng.\n- Bộ cũ giống bản trước (quy-trinh 72/76, van-hanh 3 lỗi, don-hang 124/135 – bản 08/11 sáng cũng 124 do phụ thuộc ngày chạy).\n\n## Để ý sau\n- Trang lưu trữ lớn dần (~7–9k dòng/tháng): các màn của chủ sở hữu đọc dài ngày (Thống kê tháng cũ, đóng gói 200 ngày) sẽ chậm dần. Khi quá ~12 tháng có thể cắt trang lưu trữ (đã có bản sao tháng) – hỏi chủ dự án.\n", "duong": "bo-nao/KPI/KPI Dọn dẹp hằng tháng và sao lưu (08-11).md", "lk": ["KPI Tăng tốc đợt 4 – đăng nhập (08-11)", "KPI Tăng tốc đợt 3 (08-11)", "KPI Kiểm thử", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Gộp công đoạn và tiến độ BTP", "nhom": "KPI", "txt": "# KPI Gộp công đoạn và tiến độ BTP\n\nLiên quan: [[KPI Quy trình sản xuất]] · [[KPI Phân tích định mức]] · [[Quyết định của chủ dự án]]\nNhóm: KPI · Cập nhật 03/11/2026\n\nPhân tích cho yêu cầu đợt 3 (01/11): gộp nhóm công đoạn để vẽ lưu đồ, tư vấn gộp công đoạn thật, nhân sự cần, cách thu thập tiến độ bán thành phẩm (BTP). Nguồn: danh sách 195 công đoạn + sản lượng TB/ngày (nhật ký 29 ngày), chuyên gia `quan-ly-van-hanh` và `soat-giao-dien-cuoi`.\n\n## Số công đoạn và người mỗi xưởng (01/11)\nPHOICB 57 CĐ / 33 NV · PHOITHO 35 / 27 · HT 25 / 24 · ĐG 24 / 21 · NGONTARO 19 / 16 · SƠN 13 / 21 · CNC 12 / 13 · NGONTIP 7 / 11 · INUV 3 / 15.\n\n## Nhóm công đoạn để vẽ lưu đồ (đề xuất chuyên gia vận hành)\n| Xưởng | Nhóm theo dòng chảy |\n|---|---|\n| PHOICB | ① Nhập & xả vải → ② Cắt tấm (cắt / đo tấm, chọn vải – tỉa vỏ – đo mẫu) → ③ Tỉa vải (chuôi, ngọn CB / GF, xếp bộ) → ④ Cuốn (phôi + màng nilong) → ⑤ Rút khuôn → ⑥ Cắt – tiện – chuốt – đánh bóng → ⑦ Kiểm – xuất (lau dầu, check cong / gồ / bề mặt, đo, kiểm đếm, đóng gói ngọn). Ngoài dòng: Làm lại (8), Hỗ trợ (vệ sinh khuôn) |\n| PHOITHO | ① Nhận – check – cân – cắt → ② Khoan – epoxy – foam – đạn → ③ CNC – ren (CNC, taro, chôn / nắn ren, quấn cao) → ④ Đúc keo (đúc, màng co, cắt mặt, cắt 2 ly) → ⑤ Hoàn tất chuôi (check ren, mài nhám, cắt POM đáy, vệ sinh) → ⑥ Ngọn (epoxy, foam, cân, taro, mài phíp) → ⑦ Nối. Ngoài dòng: sửa hàng hỏng |\n| NGONTARO | ① Check ngọn → ② Taro ren (5 loại) → ③ Epoxy ren đồng → ④ Cắt mặt → ⑤ Đánh giáp + Tester. Nhánh: SX POM (5 loại) + taro ren POM → cấp Phôi Thô |\n| NGONTIP | ① Làm bằng → ② Dán tip → ③ Làm đầu → ④ CNC bo đầu |\n| CNC | ① Phíp → ② Tấm da 8 lớp → ③ Dập logo → ④ Tip. Khác: sừng |\n| SƠN | ① Tuốt lót → ② Ráp → ③ Cuốn wrap → ④ Sơn → ⑤ Cắt mặt nhảy → ⑥ Vệ sinh – lắp POM. Nhánh: gậy 1 khúc |\n| INUV | ① In họa tiết → ② (In +) phủ bóng |\n| HT | ① Cắt → ② Hạ khấc → ③ Bọc da → ④ Ráp – đánh bóng → ⑤ Kiểm (vặn ngọn, tổ check, ISO). Nhánh: nối, gậy 1 khúc, ráp ngọn GF |\n| ĐG | ① Check trước laser → ② Laser → ③ Vệ sinh → ④ Check bàn giao → ⑤ Seal – đóng gói – đai. Nhánh: đơn lẻ (7), phụ kiện (6), hỗ trợ |\n\n## Tư vấn gộp công đoạn thật (đổi danh mục tính KPI) – chưa làm, chờ chủ dự án\n- Nguyên tắc: định mức chênh ≤ 15% → gộp thẳng; chênh hơn → gộp nhưng giữ ô \"loại\" + **hệ số quy đổi** (SL quy đổi = SL × ĐM chuẩn ÷ ĐM loại), không lấy ĐM bình quân (người làm loại khó bị thiệt). Chạy song song 2 tuần, lệch > 5% thì chỉnh.\n- Top 10: (1) Cuốn phôi ngọn / Full / Mix (cùng ĐM 12); (2) Cuốn màng nilong ngọn ×3 (ĐM 32); (3) **ẩn** (không xóa) CĐ SL ≈ 0: Check phôi trước SX, Taro chuôi, Mài phíp – dán phíp, Chạy nối, Cuốn wrap, Sơn phủ bóng, Cắt mặt nhảy, Gậy 1 khúc ×3, VS buồng sơn, Tester, Dập logo TIME, Laser tag, Đóng đơn lẻ custom, Hỗ trợ tổ, Quấn lại phôi chuôi, Vệ sinh khuôn; (4) Check bề mặt / Đo – đánh dấu Tq + Toray (hệ số, lệch 2,6 lần); (5) Tiện rà tròn 1 / 2 máy (hệ số); (6) Xả khổ 3 loại (T700 tính mét); (7) Epoxy ngọn có đạn / thường, Khoan cắt GF / CB (hệ số); (8) Bôi keo chuôi + bôi keo da (ĐM 30); (9) Vệ sinh gậy / ngọn / nối, đóng đơn lẻ (hệ số); (10) Taro ren 5 loại → 2 (thường / đồng).\n\n## Nhân sự cần (chuyên gia)\n- Người cần = giờ chuẩn cần ÷ (8 × tỷ lệ có mặt ~0,92 × hiệu suất 0,85); SL cần ở xưởng trước cộng thêm hỏng ở xưởng sau.\n- Người làm nhiều xưởng chia theo giờ thực làm (nhật ký); LAMLAI tính riêng (\"chi phí chất lượng\", PHOICB ~30 giờ/ngày ≈ 4 người); HOTRO trừ xưởng cho, cộng xưởng nhận; POM tính ở Ngọn Taro theo nhu cầu Phôi Thô.\n- Cảnh báo: theo SL TB hiện tại mỗi xưởng chỉ cần ~40–65% số người đang có → kiểm lại (SL ghi thiếu, ĐM thấp, hay người chờ). Vài SL lạ cần xem: \"Bọc – Bóc màng co\" 5.696/ngày, \"Ráp máy + Ráp tay chuôi\" ~2.660/ngày, \"Tỉa vải ngọn carbon\" 1.814/ngày (nhu cầu ~346 sản phẩm/ngày).\n\n## Giao diện lưu đồ (chuyên gia soát giao diện)\n- Sơ đồ hiện tại **chưa đạt**: dọc ~20 tầng, đường chéo, nút thắt ở đáy, tên bị cắt, tải chỉ có trong bảng, hộp Rhino che.\n- 1 xưởng: **làn bơi** (hàng = nhánh, Chung dưới cùng; cột = nhóm theo bước); thẻ nhóm có thanh tải + số, \"cần / biết\", huy hiệu 1 người biết; bấm mở công đoạn con (tên đầy đủ); mũi tên chỉ ngang trong làn; **dải \"Nút thắt\" trên cùng**. Màu: ≤ 60% dịu, 60–85% vàng, > 85% đỏ, kèm số. Điện thoại: danh sách bậc thang dọc, chip nhánh.\n- Toàn nhà máy: 2 làn chuôi / ngọn; PHOICB, PHOITHO, HT, ĐG là ô cao chung 2 làn; CNC dưới → Ngọn Tip (đứt nét), POM Ngọn Taro → Phôi Thô (đứt nét), ngọn lẻ Tip → ĐG. Ô: có / cần người, thanh tải, nút thắt xưởng. Nút thắt nhà máy viền đỏ + nhãn. Điện thoại: 2 tab Chuôi | Ngọn.\n- 5 lỗi tránh: đường chéo / dọc vô tận; nút thắt chỉ bằng màu hoặc ở cuối; cắt chữ không xem được đủ; điện thoại chỉ thu nhỏ SVG hoặc bảng tràn; lớp phủ che nội dung.\n\n## Tab Đơn hàng (chuyên gia giao diện)\n- Như web app đơn hàng: 6 thẻ tổng, thanh lọc dính (điện thoại: nút \"Lọc (n)\"), 4 chế độ (Chi tiết, Gom theo đơn, **Đơn cần chú ý = mặc định**, Thay đổi hôm nay), xuất Excel / PDF theo bộ lọc.\n- 5 thống kê thêm: đúng hạn % 30 ngày + trễ TB; tải đơn theo xưởng (ngày cần); lịch giao 14 ngày (đỏ ngày vượt năng lực); tuổi đơn đang SX (0–7 / 8–14 / > 14); ma trận nhóm gậy × chất liệu.\n- Nhóm cố định 3 cấp gập được: Đánh / Nhảy / Phá → Full carbon / Mix / Glassfiber → Chuôi / Chuôi nhảy / Ngọn; mỗi tiêu đề nhóm có tổng, số trễ, còn thiếu.\n\n## Thu thập tiến độ BTP (cho buổi bàn sau)\n| Phương án | Nhập lần đầu | Hằng ngày / xưởng | Chính xác | Phức tạp |\n|---|---|---|---|---|\n| A. Suy từ nhật ký KPI (SL ở CĐ \"xuất\" cuối mỗi xưởng; WIP = nhận − xuất − hỏng) | ~0 | 0 phút | thấp–TB, không gắn đơn | thấp |\n| B. Kiểm kê WIP 1 lần + phiếu chuyển giao giữa xưởng (mã BTP, đơn, SL giao / nhận / hỏng) | 1–2 ngày đếm | 5–10 phút | cao, theo đơn | TB |\n| C. Thẻ kanban / QR theo lô, quét khi giao / nhận | ~1 tuần | ~2 phút | cao nhất | cao |\n- Chuyên gia khuyên: tuần 1–2 bật A; tháng 1 kiểm kê 1 lần rồi B ở 3 điểm giao chính (PHOICB→PHOITHO, PHOITHO→SƠN / NGONTARO, HT→ĐG), đối chiếu A hằng tuần; phiếu ổn định (≥ 95%) mới lên QR.\n\n## Giai đoạn 2: hạn từng xưởng + bàn giao nhiều đợt (03/11, chỉ tư vấn)\n- Ý tưởng chủ dự án: giám đốc SX đặt hạn đơn; từng xưởng tự đặt \"ngày hẹn trả\" nối tiếp xưởng trước; so hạn HT / ĐG với hạn BGĐ; các xưởng báo số bàn giao từng đợt (gối đầu).\n- Dữ liệu Sheet đơn (đọc 03/11): ~790 dòng đang làm, chỉ ~117 dòng có ≥ 1 ngày hẹn (gần hết ở KHO, chủ yếu ngày phôi), ~13 dòng có ≥ 2; DEALER / WEB LẺ / POD gần như không có. Cột số lũy kế từng xưởng có điền một phần.\n- `quan-ly-van-hanh`: không nên để mỗi xưởng tự hẹn nối tiếp (~5.500 ngày hẹn, trễ dồn, cộng dồn dự phòng, đơn nhỏ không đáng). Thay bằng: hạn ngược tự tính từ hạn BGĐ − thời gian chuẩn mỗi xưởng (2 nhánh chuôi / ngọn gặp ở HT); chỉ nhập tay đơn lớn (≥ 28 cây) / ưu tiên (~10–15%); DBR quanh xưởng nút thắt; bàn giao suy từ chụp số lũy kế mỗi đêm. Lộ trình 2a (3 tuần đo) → 2b (DBR, danh sách ưu tiên mỗi xưởng) → 2c (giao khai – nhận xác nhận trên web).\n- `dong-vai-nguoi-dung` (vai trưởng xưởng Sơn): bỏ Sheet; dùng nếu ≤ 4 chạm / 20 giây mỗi lần, ≤ 2 phút / ngày; thích web tự điền ngày, chỉ bấm \"Kịp\" / \"Lùi đến…\"; thẻ \"Hàng đang ở xưởng\" trong Việc hôm nay cạnh duyệt KPI, nút [+ Giao]; bên nhận xác nhận sau, không chặn bên giao; nhắc 16h.\n- Claude khuyến nghị B (hạn ngược tự tính + xác nhận đơn lớn / ưu tiên, tiến độ từ số lũy kế Sheet) trước, C (form bàn giao) sau. Chờ chủ dự án trả lời.\n\n", "duong": "bo-nao/KPI/KPI Gộp công đoạn và tiến độ BTP.md", "lk": ["KPI Quy trình sản xuất", "KPI Phân tích định mức", "Quyết định của chủ dự án"]}, {"id": "KPI Hologram chủ sở hữu", "nhom": "KPI", "txt": "# KPI Hologram chủ sở hữu\n\nNhóm: KPI · Cập nhật 03/11/2026\nLiên quan: [[KPI Demo giao diện]] · [[KPI Kiểm thử]] · [[Quyết định của chủ dự án]] · [[KPI Cập nhật bằng clasp]]\n\n## Chủ dự án yêu cầu 23/10\n- \"Chỉ muốn áp dụng hologram vào giao diện của tài khoản chủ sở hữu\" (sau khi xem kiểu 5 \"Hologram vũ trụ\" trong `kpi-app/demo-giao-dien-doc-dao.html`).\n- Chốt qua câu hỏi: **cả web + Tổng quan**; chuyển động **mặc định bật, có nút tắt**. 5 ảnh vòng hoàng đạo / bát quái gửi kèm là **gửi nhầm, bỏ qua**.\n\n## Làm (Index mục 34: `kpi-app/tests/holo/holo-web.js` + `va-holo-web.py`, trước mục 27)\n- Chỉ chạy khi `ME.laOwner`. Mọi tài khoản khác giữ nguyên giao diện.\n- **Lớp áo** `html.holo`:\n  - Đổi biến màu: nền vũ trụ, `.card` kính viền xanh phát sáng. Phải dùng `!important` vì CSS gốc dòng 802–803 có `!important`.\n  - Header và thanh menu mờ kính, mục đang chọn có vạch vàng, tiêu đề dùng font Exo 2 (chỉ tải font khi bật).\n  - Canvas `#holoSao` cố định phía sau: sao nhấp nháy khoảng 15 hình/giây, dừng khi tab ẩn.\n- **Đài quan sát KPI** chèn ở đầu Tổng quan, bằng cách bọc `window.vDash`. `kpiMayVeLai_` gọi `vDash` lúc vẽ lại nên vẫn qua lớp bọc.\n  - KPI xưởng = trung bình `kpi(MaNV).tong` (số Bảng KPI máy chủ) của người \"Đang làm\", không tính TP/PP, chỉ người đã có KPI tháng này (tong > 0).\n  - Tâm vòng = trung bình nhà máy. Vòng đồng tâm = ngưỡng C/B/A/A+/S; chữ hạng đặt ở khe giữa 2 sao đầu để không đè sao.\n  - Bên phải: % người đã khai sản lượng hôm nay, người dưới 80%. Chân khung: sản lượng chờ duyệt, đề xuất định mức chờ, số xưởng đạt A.\n  - Bấm sao hoặc dòng xưởng: `xuongLoc` = mã xưởng, rồi `go('kpi')`.\n  - Ẩn ô Hiệu suất / Tỷ lệ đạt cũ (`.kpis.hl-an`).\n  - Các nét trang trí trong SVG có `pointer-events:none` (`.hl-tri`), nếu không sẽ chặn cú bấm vào sao.\n- **Nút cuối menu** `#btnHolo` (bọc `window.veNav`): mỗi lần bấm chuyển \"Bật · có chuyển động\" → \"Bật · nền tĩnh\" → \"Đang tắt\". Lựa chọn nhớ trong localStorage `kpi_holo` (dong / tinh / tat). Máy bật giảm chuyển động (`GIAM_CD`) thì nền luôn tĩnh.\n- Không tách file riêng: bộ clasp trên máy chủ dự án ghi cứng `$CacFileHtml` (Index, SoDo, HoatAnh, AmThanh) trong `chung.ps1`, file mới sẽ không được đẩy. Index tăng khoảng 20 KB.\n\n## Kiểm thử\n- `tests/holo-web.js`: 19 lần kiểm (bản xem thử `BO_HO_SO=1`).\n  - Chủ sở hữu: mặc định bật; số sao bằng số xưởng; tâm và từng xưởng khớp với cách tính lại.\n  - Bấm sao mở Bảng KPI đúng xưởng.\n  - Nút qua 3 chế độ đúng.\n  - Không tràn ở 1360 và 390px.\n  - giamdoc / tpphoicb / c360 không có hologram.\n- **24/10 sửa:** bấm sao mở Bảng KPI trước đây chỉ đặt `xuongLoc`, nhưng Bảng KPI lọc theo `kpiXuong`, nên không lọc đúng xưởng. Nay đặt cả hai. Kiểm thử nay kiểm `kpiXuong` và chỉ còn 1 bảng.\n\n## Sửa lỗi 25/10 – menu điện thoại không bấm được tab\n- Chủ dự án báo: trên điện thoại, chế độ hologram, bấm nút menu thì menu hiện ra nhưng không chọn được tab.\n- Nguyên nhân: `html.holo #app{position:relative;z-index:1}` biến #app thành một lớp riêng (để nằm trên nền sao). Menu `#nav` (z-index 160) nằm trong lớp đó, nên lớp nền tối `body.mo-nav::after` (z-index 155, ngoài #app) che lên menu.\n- Sửa trong `holo-web.js` (HOLO_CSS):\n  - `html.holo body.mo-nav #app{z-index:156}`;\n  - `::after` trong suốt;\n  - phần tối làm bằng bóng của menu (`box-shadow:0 0 0 100vmax`);\n  - nền menu đặc hơn (.97) để chữ phía sau không lẫn vào.\n- Kiểm thử `holo-web.js` 20 (thêm: mở menu, bấm Bảng KPI → sang tab và menu đóng; bấm ra ngoài thì đóng).\n\n## 03/11: chỉ dùng ở nền tối\n- Chủ dự án báo giao diện sáng thiếu tương phản. Hologram (nền vũ trụ tối) trộn với giao diện sáng làm chữ / thẻ không đọc được → `holoSang()`; ở nền sáng hologram tự tắt, nút ghi \"Chỉ dùng ở nền tối…\", bấm nút thì chuyển sang nền tối + bật hologram. `gdDat` gọi lại `holoApDung()` + `holoNut()`. Chi tiết: [[KPI Quy trình sản xuất]] (Đợt 8).\n", "duong": "bo-nao/KPI/KPI Hologram chủ sở hữu.md", "lk": ["KPI Demo giao diện", "KPI Kiểm thử", "Quyết định của chủ dự án", "KPI Cập nhật bằng clasp", "KPI Quy trình sản xuất"]}, {"id": "KPI Hồ sơ bắt buộc", "nhom": "KPI", "txt": "# KPI Hồ sơ bắt buộc\n\nNhóm: KPI · Cập nhật 22/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[KPI Kiểm thử]] · [[Quyết định của chủ dự án]] · [[Việc chờ chủ dự án]]\n\n## Chủ dự án yêu cầu 22/10\n- Đăng nhập mà hồ sơ còn thiếu thì hiện bảng điền, điền đủ mới dùng tiếp; ai đủ rồi thì thôi; thống kê số người chưa đủ.\n- Chốt cuối 22/10: **chỉ tài khoản admin (chủ sở hữu, ban điều hành) không phải điền; mọi tài khoản còn lại đều phải điền** (trợ lý BĐH, nhân sự, bếp, nhóm báo cơm, trưởng / phó phòng, công nhân…).\n- Tab Nhân sự thiếu người ban điều hành / hành chính nhân sự → thêm khối liệt kê, **chỉ chủ sở hữu xem**.\n\n## Làm (máy chủ `kpi-app/tests/ho-so/ho-so.gs` + `va-ho-so.py`, cuối va-code.py; web mục 31 `ho-so-web.js` + `va-ho-so-web.py`)\n- 6 mục `HS_MUC`: DienThoai (10 số, đầu 0), SoCCCD (12 số), DiaChi (≥ 5 ký tự), SdtKhanCap (khác SĐT của mình), NamSinh (1950 … 15 tuổi), NgayVaoLam (≤ hôm nay). Giá trị đang có trong sheet được dễ dãi: SĐT 9 số / CCCD 11 số (mất số 0 đầu do lưu dạng số) vẫn coi là đủ.\n- `hsVaiTroPhai_`: mọi vai trò trừ `HS_KHONG_BAT_BUOC = ['OWNER','ADMIN']`; chỉ hồ sơ NhanSu \"Đang làm\", tài khoản có MaNV.\n- `napDuLieu` gửi `me.hoSoThieu`; `luuHoSoThieu(token, o)` chỉ ghi các mục đang thiếu (mục đã có không bị đè; SĐT/CCCD ghi dạng chữ `suaOText_`), không cần duyệt; sửa mục đã có vẫn qua \"Hồ sơ của tôi\" (duyệt). `thongKeHoSoThieu(token)`: ADMIN/TL/HR cả nhà máy, TP xưởng mình.\n- Web: bảng `#hsBox` (z-index 8950 – trên tour Rhino 8800/8900, dưới hộp \"phiên hết hạn\" 9000), hiện sau `buildNav`; lỗi ngay dưới từng ô; nút Thoát = đăng xuất. Tab Nhân sự: thẻ `#hsTk` \"Hồ sơ chưa đủ: x/y người\" + số theo mục + danh sách theo xưởng.\n- `tao-ban-xem-thu.js` có `BO_HO_SO=1` để tắt bảng (cho kiểm thử cũ đăng nhập bằng tài khoản thiếu hồ sơ – `cho-chot-ngay` cần).\n\n## Số liệu 22/10 (sheet thật)\n- 148/184 người phải điền (CN 129, PP 15, TP 4). Thiếu: SĐT khẩn cấp 133, CCCD 125, địa chỉ 78, SĐT 75, ngày vào làm 73, năm sinh 52. 41 người thiếu cả 6 mục, 65 người chỉ thiếu 1–2.\n- Theo xưởng: Phôi Thô 27, Phôi Carbon 25, Sơn 21, Đóng gói 20, Hoàn thiện 18, Ngọn Taro 15, CNC 13, In UV 7, Ngọn Tip 2.\n\n## Kiểm thử\n- `tests/ho-so.js` 28 (DATA=) · `tests/ho-so-web.js` 12 (bản xem thử dữ liệu 22/10).\n\n## 22/10 (tối): tài khoản không gắn mã nhân viên + khối \"Ban điều hành & Hành chính nhân sự\"\n- Nguyên nhân tab Nhân sự thiếu họ: ban điều hành, trợ lý BĐH, nhân sự, bếp, nhóm báo cơm chỉ có dòng TaiKhoan (MaNV trống), không có dòng NhanSu – nên trước đó bảng hồ sơ bắt buộc cũng không áp được cho họ.\n- Sheet mới `HoSoVanPhong` (`VP_COT`: TenDangNhap, HoTen, VaiTro, DienThoai, SoCCCD, DiaChi, SdtKhanCap, NamSinh, NgayVaoLam, CapNhat; SĐT/CCCD dạng chữ), tự tạo khi lưu lần đầu (`vpSheet_`). Không thêm vào NhanSu để khỏi lọt Bảng KPI công nhân.\n- `hsCuaToi_`: có MaNV → NhanSu; không có → `vpHoSo_(tk, vaiTro, ten)` (bản trống `_moi` nếu chưa có dòng). `hsVaiTroPhai_`: mọi vai trò trừ `HS_KHONG_BAT_BUOC = ['OWNER','ADMIN']`. `me.hoSoThieu` tính ngay sau kiểm tra đổi mật khẩu trong `napDuLieu` (cả nhánh rút gọn của BEP / NHOM / NV / TBP).\n- `danhSachVanPhong(token)` (chỉ `laOwner`): tài khoản OWNER/ADMIN/TL/HR đang dùng + hồ sơ + số mục thiếu + lần đăng nhập cuối. Web `vpDanhSach()` – khối ở tab Nhân sự, trên khung \"Gán công đoạn\".\n- `thongKeHoSoThieu`: chủ sở hữu thấy thêm nhóm \"Tài khoản không gắn mã nhân viên\" (`MaXuong: 'VAN_PHONG'`); ban điều hành / nhân sự / TP không thấy nhóm này.\n- Số liệu: 160/197 phải điền (gồm 13 tài khoản không gắn mã NV). Khối BĐH & HCNS: 10 người (1 chủ sở hữu, 3 BĐH, 3 trợ lý, 3 nhân sự).\n- Chủ dự án 22/10: tài khoản nhóm báo cơm tổng (NHOM, dùng chung) **không cần điền** → `HS_KHONG_BAT_BUOC = ['OWNER','ADMIN','NHOM']`. C ả lại (bắt buộc ghi lý do) / Đã duyệt / Ngừng. Không xóa.\n  - Chặn trùng tên trong cùng xưởng (so không dấu, không phân biệt hoa thường).\n  - TP sửa kỹ năng đã duyệt → lưu `BanSua` chờ duyệt lại, trong lúc chờ vẫn dùng nội dung cũ. Đổi tiêu chí thì `PhienBan` tăng.\n- **Gán cho nhân viên** (sheet `KyNangNhanVien`, mỗi lần một dòng, không ghi đè):\n  - 4 cấp: 1 Đang học · 2 Làm được · 3 Thành thạo · 4 Kèm được.\n  - Từ cấp 2: phải tích đủ tiêu chí và ghi bằng chứng.\n  - TP/PP ghi cấp 1–2 có hiệu lực ngay. Cấp 3–4 chờ BĐH xác nhận; trong lúc chờ vẫn tính cấp cũ.\n  - Không tự gán cho mình. TP không gán cho TP/PP khác (BĐH làm).\n  - Hạ cấp và thu hồi phải có lý do. Ngày kiểm không được sau hôm nay và không trước ngày vào làm.\n  - Hạn kiểm lại 24 tháng (từ cấp 2).\n  - Trạng thái dòng: Đã xác nhận / Chờ xác nhận / Từ chối / Thu hồi / Thay thế / Hủy.\n- **Điểm kỹ năng (mô phỏng, CHƯA gắn lương)**:\n  - Điểm = trọng số (A 1 · B 2 · C 3) × hệ số cấp (cấp 2 → 1 · cấp 3 → 1,5 · cấp 4 → 2). Cấp 1 không tính.\n  - Quá hạn, hoặc kỹ năng đã ngừng → không tính.\n  - Chuyên gia khuyên chạy thử 3–6 tháng để hiệu chỉnh rồi mới gắn lương.\n- **Quyền**: BĐH (ADMIN) toàn quyền. TP/PP làm trong xưởng mình. Nhân sự (HR) và trợ lý chỉ xem. Công nhân xem \"Kỹ năng của tôi\", kỹ năng có thể học, và tên người \"Kèm được\" trong xưởng. Công nhân không thấy điểm của người khác.\n\n## Mã\n- Máy chủ `kpi-app/tests/ky-nang/ky-nang.gs` (nối cuối va-code.py qua `va-ky-nang.py`):\n  - Ghi: `deXuatKyNang`, `suaKyNang`, `bdhDuyetKyNang` (không đặt tên bắt đầu bằng \"duyet\" vì `call` sẽ chạy hiệu ứng duyệt), `ngungKyNang`, `ganKyNang`, `bdhXacNhanKyNang`, `thuHoiKyNang`.\n  - Đọc: `layKyNang`.\n  - Mọi hàm ghi trả kèm dữ liệu mới của tab (`knDuLieu_`). Web vẽ lại luôn (`knNhan`), không gọi tải lại lần 2: nhanh hơn, và hết lỗi thỉnh thoảng vẫn thấy dữ liệu cũ sau khi duyệt.\n- Web mục 33 `ky-nang/ky-nang-web.js` + `va-ky-nang-web.py` (trước mục 27 chia đôi):\n  - Tab khóa `kyn`, nhóm menu \"Danh mục\". Có cho ADMIN, TP, HR, TL, CN (CN thấy tên \"Kỹ năng của tôi\").\n  - Các trang con: Ma trận · Danh mục · Chờ duyệt · Báo cáo.\n  - Báo cáo: điểm nghẽn (dưới 2 người làm được hoặc chưa ai kèm được), tỉ lệ đa năng (≥ 3 kỹ năng), sắp hết hạn trong 60 ngày.\n- Hộp thoại `.kn-hop`: CSS riêng cho nút chọn và ô tích, vì CSS chung `label` (in hoa) và `input{width:100%}` làm vỡ bố cục.\n- Lỗi đã sửa khi rà: bỏ gạch đầu dòng ở tiêu chí từng cắt luôn số đầu câu (\"10 cây…\"). Nay chỉ bỏ `-`, `•`, `1.`, `2)`.\n\n## Kiểm thử\n- `tests/ky-nang.js`: 49.\n- `tests/ky-nang-web.js`: 19, dùng bản xem thử `BO_HO_SO=1`. Đổi tài khoản bằng `login()` đè lên, không `logout()`, vì tải lại trang sẽ mất dữ liệu thử.\n\n## Để sau (đợt 2–3)\n- Ảnh bằng chứng cho cấp 3–4.\n- Tự gia hạn khi có sản lượng ở công đoạn liên quan trong 6 tháng; trạng thái \"Tạm ngưng\" khi 12 tháng không dùng.\n- Cảnh báo lạm phát (xưởng nâng cấp quá nhiều), hậu kiểm ngẫu nhiên 10%/quý.\n- Cộng điểm kỹ năng hiếm, thưởng một lần cho người kèm.\n- Quy tắc chuyển xưởng (ân hạn 6 tháng).\n- Bảng quy đổi điểm → bậc / phụ cấp kỹ năng: nhờ nhân sự rà pháp lý (BLLĐ 2019 Điều 93; nên dùng \"phụ cấp kỹ năng\" có điều kiện hưởng; tính BHXH).\n", "duong": "bo-nao/KPI/KPI Kỹ năng.md", "lk": ["KPI Tổng quan và cách dựng", "KPI Kiểm thử", "Quyết định của chủ dự án", "Việc chờ chủ dự án", "Công cụ Claude"]}, {"id": "KPI Lottie", "nhom": "KPI", "txt": "# KPI Lottie\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[KPI Demo giao diện]] · [[00 Mục lục]]\n\n- Demo Lottie: `kpi-app/demo-lottie.html` (4 chỗ: chờ báo cáo, duyệt xong, trang trống, mất mạng; hoạt ảnh tự vẽ `kpi-app/lottie/*.json` bằng `tests/tao-lottie.py`; sandbox chặn cdnjs nên nhúng thẳng lottie-web lấy từ npm) – chủ dự án duyệt cả 4, **đã gắn vào web thật** (va-index.py mục 8, kiểm thử `tests/lottie-web.js`); demo Lottie đợt 2 `kpi-app/demo-lottie-2.html` (chốt tháng, điểm danh, CN gửi sản lượng, xuất Excel, kỳ chưa có dữ liệu, hết phiên; sinh bằng `tests/tao-lottie-2.py`, hàm chung `tests/lottie_cu.py`) – chủ dự án duyệt, **đã gắn vào web** (va-index.py mục 9; hết phiên không tự tải lại trang nữa). Demo Lottie đợt 3 `kpi-app/demo-lottie-3.html` (trả lại sản lượng, máy đang sửa, ghi vi phạm, nghỉ dài hạn, thêm nhân sự, đổi mật khẩu; `tests/tao-lottie-3.py`) – chủ dự án duyệt, **đã gắn vào web** (va-index.py mục 10). **Lỗi đã sửa 07/10:** hai hiệu ứng \"thanh mọc từ 0\" (`play` cũ trong goc + `hieuUngMoi` của giao-dien-moi.html) chạy chồng làm thanh `.hbar .hfill` (So sánh hiệu suất giữa các xưởng) kẹt ở 0 – nay cùng đọc chiều rộng thật qua `data-w` (va-index.py mục 11, kiểm tra trong `tests/hieu-ung.js`). Demo Lottie đợt 4 `kpi-app/demo-lottie-4.html` (chốt ca, đề xuất định mức, miễn trừ KPI, cấp lại mật khẩu có nút Chép, gán công đoạn, thanh lý máy; `tests/tao-lottie-4.py`) chờ góp ý, chưa gắn vào web.\n- Quy ước hoạt ảnh Lottie: tự vẽ bằng `tests/tao-lottie*.py` (hàm chung `tests/lottie_cu.py`), màu CY #2fd3c6 / XAM #aab5bc / AM #f0b04e / DO #f26b6b; mỗi đợt làm demo \"Hiện tại\" cạnh \"Có Lottie\", chủ dự án duyệt rồi mới gắn vào web (va-index.py, mỗi đợt một mục mới), luôn có hình tĩnh dự phòng `LT_TINH` và tôn trọng giảm chuyển động. Chỉ nói đúng chức năng thật trong câu chữ hoạt ảnh (đã kiểm tra thông điệp máy chủ).\n", "duong": "bo-nao/KPI/KPI Lottie.md", "lk": ["Việc chờ chủ dự án", "KPI Demo giao diện", "00 Mục lục"]}, {"id": "KPI Mai", "nhom": "KPI", "txt": "# KPI Mai\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Rhino]] · [[00 Mục lục]]\n\n- Chờ góp ý: `kpi-app/demo-duyet-san-luong.html`, `kpi-app/demo-lottie-4.html`, `kpi-app/demo-huong-dan-cn.html` (nhân vật anime Mai hướng dẫn công nhân nhập sản lượng khi đăng nhập lần đầu; SVG tự vẽ kiểu **chibi** (08/10: chủ dự án muốn dễ thương hơn, mặt lấy cảm hứng ảnh AI của họ – tóc bob nâu đen mái lệch, mắt nâu mật ong, khuyên tai; áo khoác đồng phục thể thao kín đáo; KHÔNG dùng ảnh gốc vì có logo LA Dodgers/CrossFit/Rogue và trang phục hở) – nguồn chung `kpi-app/tests/mai/mai-chibi.js`, chép vào biến `MAI`, các bước trong `BUOC`, kiểm tra theo quy tắc `cnGui`; khi gắn vào web: gọi từ `vaoHeThong` cho vai trò CN nếu chưa có cờ đã xem, rọi vào phần tử thật của `vCNNhap`). Và `kpi-app/demo-khau-hieu.html` (Mai nói khẩu hiệu khích lệ ở 6 chỗ, 33 câu theo 6 chủ đề, đổi theo ngày; giọng khen, không chê; không bịa số liệu web không có).\n- **Mai đã gắn vào web (08/10, chủ dự án nói \"Do your best\")** – `kpi-app/tests/mai/va-mai.py` = mục 12 của va-index.py (exec): `maiChao` (mỗi ngày 1 lần, lùi lại nếu đang hướng dẫn), `maiBang` (khẩu hiệu của ngày ở `vHomNay` + `vCNNhap`), `maiTourCN` (rọi sáng phần tử thật, KHÔNG tự gõ vào ô; tự mở lần đầu, khóa `kpi_mai_hd_cn_<tk>`; nút \"? Hướng dẫn nhập\"), `maiXacNhan` chen vào `cnGui` trước `congNhanGuiSanLuong` (đọc lại từng dòng + tổng, cảnh báo >5.000; \"Sửa lại\" gọi `huy`), `maiKhenGui` + `maiChuoi` (chuỗi ngày gửi đều, bỏ CN), `maiKPI` trong `vKPICaNhanToi` (số % còn thiếu tính từ `loai`), `maiNghi` 10:00/15:00, nút `#btnMai` tắt/bật (`kpi_mai`='tat'). Không làm \"tin vui cả xưởng\" vì web chưa có kế hoạch tháng theo xưởng. Kiểm thử `tests/mai-web.js` (32, đặt múi giờ Asia/Ho_Chi_Minh). Câu khẩu hiệu đang nằm trong mã (`MAI_KH`); việc tiếp theo có thể: chuyển sang sheet `KhauHieu`.\n", "duong": "bo-nao/KPI/KPI Mai.md", "lk": ["KPI Rhino", "00 Mục lục"]}, {"id": "KPI Màn đăng nhập Khắc laser", "nhom": "KPI", "txt": "# KPI Màn đăng nhập Khắc laser\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập demo chờ duyệt]] · [[KPI Thao tác và hiệu ứng bên trong]] · [[KPI Rhino]] · [[00 Mục lục]]\n\n- Demo màn đăng nhập (08/10): `kpi-app/demo-dang-nhap.html` – 5 kiểu A Bản vẽ kỹ thuật / B Dây chuyền 5 xưởng / C Mai chào đón / D Thẻ chấm công / E Bảng điều khiển ca; nguồn `kpi-app/tests/dang-nhap/demo.src.html` dựng bằng `tao-demo.py`; kiểm tra `tests/demo-dang-nhap.js`. Chủ dự án chọn **giữ màn bi-a hiện tại nhưng xịn hơn + thêm Mai** → `kpi-app/demo-dang-nhap-bi-a.html` (bản mới cạnh bản cũ; nguồn `kpi-app/tests/dang-nhap-bi-a-2.html`, giữ nguyên API `bbCho/bbTrung/bbTruot/bbTha/bbXep/bbChu/bbKhoiDong`; Mai vẽ trễ qua `bbMaiNap` vì MAI_SVG (mục 12) nạp sau màn đăng nhập; id gradient của Mai đổi thành `gbb*` vì #gate bị ẩn sau khi vào). Bản góc bàn nỉ xanh + bi vàng KPI bị chê \"xấu quá\" → làm lại: giữ nguyên bản cũ, chỉ thêm chân dung Mai tròn cạnh lời chào (đang là nội dung `dang-nhap-bi-a-2.html`). Chủ dự án vẫn muốn **đẳng cấp hơn**, gợi ý tham khảo rhino-billiards.com (hãng cơ carbon Hà Nội; trang bị chặn trong sandbox). Đã xin ảnh chụp trang, logo, ảnh cận cảnh cơ, video ngắn; đề xuất 3 hướng dùng ảnh/video thật: A Phòng chụp sản phẩm, B Vân carbon, C Xưởng chế tác (Mai giữ dạng chân dung nhỏ). Chủ dự án mở mạng → đọc được rhino-billiards.com: **RHINO là thương hiệu của Carbon Billiards Co., Ltd.** (công ty chủ dự án); nhận diện: than chì #2b2b2b, vàng #f7b829, chữ Arimo, logo tê giác trắng \"MADE BY VIETNAM\". Đã làm `kpi-app/demo-dang-nhap-rhino.html` (nguồn `kpi-app/tests/dang-nhap-rhino.html`, cùng API bb*; trái = phòng trưng bày 4 ảnh studio thật Must/Eclipse II/Retro II/Must Pool Cue đã cắt bỏ chữ quảng cáo, lưu ở `kpi-app/anh/rhino/` (~430 KB, chèn base64 qua `anh_rhino()` trong `tests/dang-nhap/tao-demo-bi-a.py`); phải = bảng than chì, nút vàng, Mai chân dung tròn). Kiểm tra `tests/demo-dang-nhap-rhino.js` (42); đã ghép thử vào web: mai-web 32, lottie-web 53, hieu-ung 29 đạt, Index.html ~1,5 MB. Chủ dự án khen \"khá đẹp\" nhưng muốn **độc đáo, khác web Rhino hơn** (09/10) → `kpi-app/demo-dang-nhap-khac.html` **\"Khắc laser\"** (nguồn `kpi-app/tests/dang-nhap-khac.html`; nền = khung hình đầu video khắc laser của hãng, đã xóa logo in sẵn + chỉnh tông tối, `anh/rhino/khac-laser.jpg` 98 KB, placeholder `{{RH_KHAC}}`; gõ mã nhân viên → laser khắc từng ký tự lên ngọn cơ số 3 (SVG viewBox 1600x900 cùng ảnh, trục `LK.x0=671,y0=430,góc -82.4°`); mật khẩu chỉ lóe tia, không khắc; sai = tia đỏ + chữ mờ; đúng = chữ vàng + vệt sáng; bảng kính nổi bên phải; điện thoại: ảnh 50vh `xMinYMid slice` + `display:flow-root` chống lọt margin). Demo đặt 3 bản cạnh nhau (Khắc laser / Phòng trưng bày / Hiện tại). Kiểm tra `tests/demo-dang-nhap-khac.js` (54); ghép thử vào web: mai-web 32, lottie-web 53, hieu-ung 29, cho-chot-ngay 16 đạt, Index.html ~0,95 MB. **Chủ dự án chọn Khắc laser (09/10) → ĐÃ GẮN VÀO WEB**: va-index.py mục 5 đọc `tests/dang-nhap-khac.html` + `anh_rhino()` (module chung `tests/dang-nhap/anh_rhino.py`, chèn ảnh + font base64), mục 4b thêm Arimo, `tests/tao-xem-thu.py` cũng dùng bản này; bản bi-a cũ vẫn ở `tests/dang-nhap-bi-a.html`. Theo góp ý \"font khác + khắc đúng dọc thân\": font khắc Orbitron (tự nhúng, cắt còn A–Z 0–9 . _ -; demo có nút đổi Michroma/Oswald/Saira, các font ở `anh/rhino/font/`), trục đo lại từ ảnh: tâm x = 0.1464·y + 616.2, thân rộng ~139px, **góc chữ −98,33°** (bản đầu xoay ngược chiều −82°, đó là lý do trông lệch), mã tối đa 14 ký tự, tự thu cỡ chữ (`lkCo`), dải màu trụ tròn `#lkTru`. Kiểm tra `tests/demo-dang-nhap-khac.js` (60, có kiểm góc + font). **13/10:** đăng nhập đúng thì laser khắc lại **2 chữ cuối họ tên thật** (`lkKhacTen` trong `bbTrung`, font Arimo có dấu – Orbitron không có dấu; `lkXep` trả về mã nếu lỗi), thời gian vào chậm thêm ~0,7 giây; tên khắc thấp hơn mã, sát mặt cát (`LK.tenLech`=125: `LK.lech` dời điểm đầu chữ, `lkDauBut` + `lkCo` tính theo). Tải trang trong sandbox: Chromium không tin CA của proxy → chụp trang bằng `page.route` + Node `fetch` (NODE_USE_ENV_PROXY=1); ffmpeg đủ codec lấy từ pip `imageio-ffmpeg`.\n- **24/10 – nền ảnh tòa nhà + thẻ nhân viên carbon (ĐÃ GẮN VÀO WEB).** Chủ dự án gửi ảnh mặt tiền nhà máy ban đêm, muốn làm nền đăng nhập \"nhưng vẫn giữ hình ngọn carbon và hiệu ứng laser\".\n  - Thử 1: tách 3 ngọn cơ khỏi tường của `khac-laser.jpg` (đo mép thân cơ từng hàng, đa giác + mặt nạ cát) rồi ghép lên nền. Chủ dự án chê \"xấu quá\" vì ảnh chụp ánh ấm trên nền xám bị lệch tông với ảnh đêm xanh.\n  - Đưa 2 mẫu vẽ bằng SVG (thẻ nhân viên vân carbon / ngọn cơ vẽ chéo). Chủ dự án **chọn thẻ nhân viên carbon**.\n  - Nền: `<image class=\"anh\" href=\"{{NEN_DN}}\">` lấy từ repo qua jsDelivr (`anh_cdn('anh/web/nen-dang-nhap.jpg')`, 25/10, xem [[KPI Ảnh web qua jsDelivr]]). Không có ảnh thì còn gradient xanh đêm trên `#gate`.\n  - Thẻ `#lkNhom.lk-the` (380×240, `translate(150 300) rotate(-7)` = `LK.tf`): vân carbon `#lkVai`, ánh sáng `#lkTheSang`, vệt lóe, logo `#lkTheLogo` lấy lại từ `.lk-dau img` (không nhúng 2 lần), chip vàng, chữ \"THẺ NHÂN VIÊN\" / \"CARBON BILLIARDS · KPI SẢN XUẤT\". Chữ khắc `#lkChu` tại (24,152) trên thẻ, `LK.co` 50, `LK.dai` 332, `tenLech` 0 (tên khắc cùng dòng thay mã).\n  - Tia laser `#lkLua` vẽ ngoài thẻ nên luôn thẳng đứng từ mép trên: `lkDauBut` đổi tọa độ thẻ → ảnh 1600×900. Đăng nhập đúng: chữ vàng, viền thẻ sáng (`.sang`), khắc 2 chữ cuối họ tên, vệt sáng lướt qua thẻ. `lkXep` trả về như cũ.\n  - Index.html khoảng 823 KB (bỏ `khac-laser.jpg` 100 KB khỏi web; ảnh này vẫn dùng cho các bản demo).\n  - Kiểm thử: `demo-dang-nhap-khac.js` 60 (thay kiểm tra góc −98,33° bằng kiểm tra đầu khắc nằm trên thẻ), `dang-nhap-web.js` 15, `manh-web.js` 8 (logo nhúng 1 lần, nền từ Drive).\n- **Hiệu ứng thêm cho màn Khắc laser (09/10, chờ duyệt):** chủ dự án hài lòng màn hiện tại, muốn thêm (1) màn tối với **sợi dây kéo bật đèn** (`lkDay`/`lkBatDen`: kéo >50px, bấm hoặc Enter; đèn chớp kiểu đèn tuýp rồi ô nhập hiện) và (2) **nút Đăng nhập chạy trốn** khi chưa điền đủ (`lkNe`/`lkNutVe`, chỉ máy có chuột; né 6 lần thì đứng yên lắc; Enter/cảm ứng vẫn bình thường). Cả hai nằm trong `tests/dang-nhap-khac.html` sau công tắc `LK_HU = {day, chay}` – **mặc định TẮT** nên Index.html chưa đổi; khi duyệt: đổi mặc định thành true rồi dựng lại Index.html. Demo `kpi-app/demo-dang-nhap-hieu-ung.html` (nguồn `tests/dang-nhap/demo-hieu-ung.src.html`, dựng bằng `tao-demo-bi-a.py`), kiểm tra `tests/demo-dang-nhap-hieu-ung.js` (22).\n- **Hiệu ứng đợt 2 (09/10, chờ duyệt) – chủ dự án chọn: phần A mục 1, 2, 4, 5, 6 (bỏ \"giữ để vào ca\") và toàn bộ phần B (mục 7–16); mọi hiệu ứng phải chạy trên điện thoại.**\n  - Phần A (màn đăng nhập) nằm trong `tests/dang-nhap-khac.html`, thêm cờ vào `LK_HU` (mặc định tắt): `cham` = nút nhảy khi chạm (`lkChayCham`, chặn click ở pha capture; nhảy 3 lần rồi để login() báo lỗi; máy có chuột vẫn dùng kiểu né `lkChay`, mỗi lúc một kiểu), `cua` = cửa cuốn (`lkCua`/`lkMoCua`, thay dây kéo; kéo >1/3 hoặc bấm tay nắm/Enter), `mat` = mắt Mai theo chữ (`lkMat`, dịch con ngươi trong `.mat-g`) + bịt tai khi Caps Lock (`lkCaps`, hình `BB_TAI`), `ket` = két sắt sai 3 lần khóa 30 giây (`lkKhoa`, nhớ ở localStorage `lk_khoa_den`; chỉ là nhắc phía trình duyệt), `gio` = theo giờ (`lkGio`, `window.LK_GIO` để giả lập; ca đêm 22–5h tông vàng ấm `lk-dem`). Lời chào 22–24h đổi thành \"Chúc ca đêm thuận lợi\". Demo có công tắc + giờ giả lập: `kpi-app/demo-dang-nhap-hieu-ung-2.html` (nguồn `tests/dang-nhap/demo-hieu-ung-2.src.html`, khung nằm trong `<textarea>` và dựng lại srcdoc khi đổi công tắc), kiểm tra `tests/demo-dang-nhap-hieu-ung-2.js` (20); đợt 1 `tests/demo-dang-nhap-hieu-ung.js` (22) đã cập nhật (điện thoại giờ nhảy khi chạm).\n", "duong": "bo-nao/KPI/KPI Màn đăng nhập Khắc laser.md", "lk": ["KPI Màn đăng nhập demo chờ duyệt", "KPI Thao tác và hiệu ứng bên trong", "KPI Rhino", "00 Mục lục", "KPI Ảnh web qua jsDelivr"]}, {"id": "KPI Màn đăng nhập demo chờ duyệt", "nhom": "KPI", "txt": "# KPI Màn đăng nhập demo chờ duyệt\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập Khắc laser]] · [[Việc chờ chủ dự án]] · [[00 Mục lục]]\n\n- **Demo hiệu ứng động màn đăng nhập đợt 3 + video nền Remotion (11/10, chờ duyệt):** `kpi-app/demo-dang-nhap-hieu-ung-3.html` (dựng bằng `tests/dang-nhap/tao-demo-hieu-ung-3.py`: lấy `khung()` của tao-demo-bi-a.py + exec `mai/va-rhino.py` lên khung để giống web; công tắc dựng lại srcdoc). Mã `tests/dang-nhap/hieu-ung-3.{css,js}`, cờ `
