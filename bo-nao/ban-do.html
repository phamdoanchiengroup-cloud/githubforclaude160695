 bằng chủ dự án gửi được nắn bằng mốc tay + bình phương tối thiểu về khung 1372×1057 (30 px/m) = SD.vb. Hệ số (ảnh = s·c + t): tầng 1 x 0.927c+70.7, y 0.884c+54.3; tầng 2 x 0.940c+51.0, y 0.936c+14.5; tầng 3 x 0.950c+50.9, y 0.934c+26.4. Kết quả `so-do/anh-tang-{0,1,2}.webp`, bản gốc `anh-goc-tang-*.webp`; ảnh chụp từ 3D cũ đổi tên `chup-3d-tang-*.jpg`.\n  - Ảnh lấy từ repo qua jsDelivr ghim commit (25/10, trước đó Google Drive; xem [[KPI Ảnh web qua jsDelivr]]). SoDo.html khoảng 0,54 MB.\n  - `va-so-do.js`: nút **Tách tầng** (`data-f=\"3\"`, `sdDatTang(3)`, `sdVeTach`): ảnh minh họa + 3 thẻ chú thích Tầng 3/2/1 nối đường kẻ (`SD_TACH_NHAN`), mỗi thẻ ghi các khu + xưởng (`sdXuongTang`); bấm thẻ thì sang tầng đó. Dưới 760 px thẻ xếp dưới ảnh.\n  - Bỏ: chọn màu KPI / sĩ số (#sdMau), tải sĩ số, tô màu KPI (`mauSo = null`). Nhãn khu = tên khu + tên xưởng (chữ vàng `#ffd27a`). Thẻ chi tiết ghi \"Xưởng làm việc\", bỏ nút Mở Bảng KPI; khung \"Khu vực các xưởng\" ghi các tầng có khu của xưởng.\n  - 3D (`va_3d.py`): `kpi:false`, bỏ nút chọn màu, thẻ phòng chỉ ghi xưởng.\n  - Kiểm thử `so-do-web.js` viết lại phần KPI / sĩ số: không còn KPI, nhãn có tên xưởng, Tách tầng có 3 thẻ, bấm thẻ Tầng 2 sang tầng 2; TP chỉ thấy xưởng mình. Chạy đủ có 3D: 41/41.\n- **25/10 (sau đó): chủ dự án bảo \"xoay lại bản sơ đồ 2D ngang\" → ĐÃ BỎ bản dọc** (lấy lại `va-so-do.js`, `va-so-do.css`, `so-do-web.js` của commit trước e426070; kiểm thử 2D 27/27). Ghi lại cách làm bên dưới để dùng nếu cần lại.\n- **25/10 (chủ dự án): sơ đồ 2D bản DỌC (đã bỏ).** Lần đầu xoay theo chiều kim đồng hồ, chủ dự án xem ảnh rồi bảo \"xoay lại 180 độ\", nên nay xoay 90° ngược chiều kim đồng hồ.\n  - `sdVe`: nội dung vẽ theo toạ độ mặt bằng cũ, bọc trong nhóm `matrix(0 -1 1 0 0 44.75)`, tức (x, y) → (y, 44,75 − x). `SD.vb` / `SD_VB0` = [−0,5, −0,5, 35,25, 45,75] theo khung đã xoay, nên phóng to / kéo / nhấp đúp không phải sửa.\n  - Nhãn: tính vừa khung theo kích thước sau khi xoay (rộng = h, cao = w). Nhóm chữ xoay `rotate(90)` để bù cho chữ đứng thẳng; phòng hẹp mà cao (sau xoay) thì `rotate(0)`, chữ đọc từ dưới lên.\n  - Mặt tiền / cổng chính nay ở **bên phải** sơ đồ (dòng hướng dẫn đã sửa).\n  - CSS `#sdMb`: `aspect-ratio:35.25/45.75`, rộng `min(100%, (100vh − 150px)·35,25/45,75)` để trên máy tính không cao quá màn hình.\n  - Kiểm thử `so-do-web.js` phần 2D 27/27: kiểm khung dọc (cao > 1,2 lần rộng); nhấp đúp cuộn trang lên trước rồi mới đo vị trí, vì sơ đồ dọc cao hơn màn hình.\n- **03/11 (chủ dự án): quy trình sản xuất trên Sơ đồ** – chọn A (bấm xưởng → khung lưu đồ) + B (mũi tên dòng hàng trong 3D); quyền: chủ sở hữu có số, TP/PP xưởng mình + lưu đồ nhà máy không số; người khác chỉ thấy dòng hàng (không số).\n  - B (`tests/so-do/va_3d.py`, `JS_DONG_HANG`, `CSS_DONG_HANG`): nút **↝ Dòng hàng** (`btnDongHang`); nút = khu lớn nhất của mỗi xưởng theo bảng ghép `SS.xuong` (`dh3Nut`), cạnh như lưu đồ toàn nhà máy (`DH3_CANH`: 8 đường chính xanh + POM, tip/phíp, đầu lết, tip bán lẻ, ngọn lẻ màu cam), ống cong `CubicBezierCurve3` + mũi nhọn + 3 chấm chạy (`dh3Buoc`, theo tầng đang di chuyển), vẽ đè (depthTest false); bật thì tự \"Tách tầng\"; nhãn xưởng bấm được khi có quyền (`dh3CoLD` → `parent.sdCoLuuDo`). Thẻ phòng 3D có nút \"Xem lưu đồ sản xuất của xưởng\" (`dh3NutLD`). `__v3.dongHang`, `__v3.dh3` cho kiểm thử.\n  - A (`tests/so-do/va-so-do.js` + `.css`): `sdCoLuuDo(ma)`, `sdLuuDo(ma)` mở khung `#sdLd` (z-index 9000 > lớp 3D 8000), tải mảnh QuyTrinh + `layQuyTrinh` khi cần; 2 nút Xưởng / Toàn nhà máy (`qtLuuDoX` dọc, `qtVsm` hoặc `qtVeNMTP` cho TP) + \"Mở tab Quy trình ↗\"; bọc `qtVe` để bấm thẻ vẽ lại trong khung; Esc / ✕ đóng, trả lại QTX/QTV cũ. Thẻ chi tiết 2D có nút cùng tên.\n  - Kiểm thử `tests/so-do-luu-do-web.js` 21/21 (có THREE). Bật dòng hàng: camera bay tới góc thấy 3 tầng, tạm ẩn tên phòng.\n\n- **07/11 (chủ dự án): bỏ phần quy trình ở 3D** – gỡ B (nút ↝ Dòng hàng, `JS_DONG_HANG`, `CSS_DONG_HANG`, nút lưu đồ trong thẻ phòng `dh3NutLD`) khỏi `tests/so-do/va_3d.py`. Giữ A (khung lưu đồ `#sdLd` từ thẻ chi tiết 2D). Kiểm thử `so-do-luu-do-web.js` 15/15 (phần 3D kiểm không còn nút Dòng hàng / `dh3MoLD` / `.ss-ld`).\n", "duong": "bo-nao/KPI/KPI Sơ đồ nhà máy 3D.md", "lk": ["KPI Phần giao diện tải sau", "Lần dán lên Apps Script", "00 Mục lục", "KPI Ảnh web qua jsDelivr"]}, {"id": "KPI Sửa lỗi 21-10 và dữ liệu sheet", "nhom": "KPI", "txt": "# KPI Sửa lỗi 21-10 và dữ liệu sheet\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Bảo mật và vận hành]] · [[Việc chờ chủ dự án]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\n- **Sửa 4 lỗi chủ dự án báo 21/10 (chưa dán; chỉ Code.gs + Index.html, HUONG-DAN mục \"BẢN SỬA 21/10\"):** máy chủ `tests/sua-loi-21-10/va-sua.py` (exec cuối va-code.py), web = va-index.py **mục 25** `tests/sua-loi-21-10/va-sua-web.py` + `lam-moi.html`. (1) `layKPIKy`: TP/PP bị ép `maXuong = me.xuong`; tiêu đề tab KPI ghi tên xưởng. (2) Phạt nhập trễ chạy 17h ngày LV thứ 3, ngày nghỉ hay được chấm SAU đó (dữ liệu thật: C713 nghỉ 3–8/9, phạt 10/9, chấm 28/9) → `goPhatNgayNghi_()` gỡ PhatNhapTre + ViPham NHAPTRE tự động (NguoiGhi \"Hệ thống…\" hoặc GhiChu \"Tự động…\"; dữ liệu cũ NguoiGhi rỗng) của ngày nghỉ cả ngày / nghỉ dài hạn / ngày lễ; gọi trong `chayPhatNhapTre`, `luuDiemDanh`, `luuLichThang`, `dangKyNghiDaiHan`; 0.5x vẫn phạt. Dải nhắc CN (`capNhatDucBar`) thêm kiểm `gioCoMatNgay` + `laNgayLeKH`. Tháng đã chốt giữ số cũ (chủ sở hữu chốt bù). (3) Nhật ký của TP lọc theo MỌI công đoạn xưởng (cả \"Ngừng\"), `out.cdNgung` cho `cd()`; dữ liệu trước chỉ tải lúc đăng nhập → `lmTai` tải lặng `napPhan(['nk','cc'])` khi mở tab (TP: duyetsl/homnay/dash; CN: cnnhap/kpica; tối đa 1 lần/20 s, TP thêm mỗi 5 phút), vẽ lại tab đang mở nếu dữ liệu đổi và không đang sửa ô / chờ Hoàn tác. (4) `canNhapLai` bỏ ngày đã có dòng Chờ duyệt/Đã chốt. **Rà soát đợt 2 (21/10):** \"Tạm nghỉ\" không nhắc/không phạt (`chayPhatNhapTre`, `thieuNhap_`, client `phaiNhapSL`); `goPhatNgayNghi_` gỡ cả phạt sót của TP/PP (`mapQuanLy_`); hàm chạy tay `KIEM_TRA_DU_LIEU` (`tests/sua-loi-21-10/kiem-tra-du-lieu.gs`, chỉ đọc, ghi sheet `KiemTraDuLieu`); script soát bản xuất JSON `tests/sua-loi-21-10/ra-du-lieu.py <csdl.json>`. Dữ liệu 28/9 còn lỗi phải sửa tay trong sheet: ~18 dòng nhật ký ngày sai (#VALUE!, rỗng, năm 1483, trước 07/2026), điểm danh ngày 2001-08-11, 3 tên đăng nhập trùng (c631/c638/c640), 9 tài khoản Đang dùng của người Nghỉ việc, c060 vai trò CN nhưng chức danh Trưởng phòng, ~90 nhân sự thiếu NgayVaoLam, 2 công đoạn đang dùng chưa định mức, 95 vi phạm NHAPTRE thiếu MaGhi; phạt nhập trễ trước 15/09 (349 lượt) không có vi phạm NHAPTRE nên CN không bị trừ nề nếp nhưng TP vẫn bị trừ \"không nhắc\" – chờ chủ dự án quyết; TrongSoKPI TranKPI = 500 (trần KPI 500%) – hỏi lại. **Sheet thật 21/10 (đọc qua Google Drive, file \"CSDL KPI\" id 1znHlbc3ulMRQILePmLZbwNQx-mMXFxd9sm0PBG9lrF8; bản xuất ở scratchpad, KHÔNG commit):** đã dán bản 18/10 (có LichSuDinhMuc, HoiNhap, BoTriMay); tên đăng nhập trùng, TK người nghỉ việc, MaGhi thiếu đã được dọn; còn: 29 dòng nhật ký ngày sai (NhatKySanXuat dòng 588–609 của C049 bị đảo ngày/tháng 2026-01/03/05/06-08 = 01/03/05/06 tháng 8 + 5 ô #VALUE!; dòng 733–735 C638, 2707–2709 C075 (từ chối), 4324 C080 ngày trống), DiemDanhNghi dòng 100–120 + XacNhanDiemDanh 88–90 ngày 2001-08-11; 21 lượt phạt + 16 vi phạm NHAPTRE rơi vào ngày nghỉ (cả tháng 10: C755 10–15/10, C666 12/10 → tự gỡ khi dán bản 21/10); C285 tạm nghỉ bị phạt 7 lượt; 10 người mới thiếu NgayVaoLam; giamdoc/phogd2 vẫn chung mật khẩu mặc định. Kiểm thử `tests/sua-loi-21-10.js` (31, DATA=), `tests/sua-loi-21-10-web.js` (9, bản xem thử GIO=2026-10-14); kiem-tra.js mục 8 gọi `goPhatNgayNghi_` trước khi đếm.\n\n## 25/10: bỏ trừ \"không nhắc\" khi CN không bị trừ (chủ dự án)\n- `layKPIQuanLy` / `bcKpiQL_` khoản (d) \"Không nhắc CN nhập\" (-2/lượt) nay chỉ đếm lượt PhatNhapTre có vi phạm NHAPTRE cùng MaNV + ngày (`coNhapTre`). Mục vá `kpi-app/tests/khong-nhac/va-khong-nhac.py` (exec cuối va-code.py). Chỉ đổi Code.gs.\n- Dữ liệu thật 25/10 (bản tải về `dl5/`, không commit): tháng 8 hết bị trừ (trước: DG 13, INUV 8, HT 10, NGONTARO 18, SON 40, NGONTIP 13, PHOITHO 59, PHOICB 72 lượt); tháng 9 không đổi vì các lượt trước 15/09 chủ dự án đã miễn tay (MienTruKPIQuanLy); tháng 10 không đổi. KPI quản lý luôn tính trực tiếp (không nằm trong KPIThang) → không cần chốt bù.\n- Kiểm thử `tests/khong-nhac.js` 6/6 (DATA=). kiem-tra / sua-loi-21-10 / tang-toc-2 / bao-mat: kết quả trước và sau giống hệt nhau.\n", "duong": "bo-nao/KPI/KPI Sửa lỗi 21-10 và dữ liệu sheet.md", "lk": ["KPI Bảo mật và vận hành", "Việc chờ chủ dự án", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Sửa lỗi giao diện", "nhom": "KPI", "txt": "# KPI Sửa lỗi giao diện\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Công cụ Claude]] · [[KPI Demo giao diện]] · [[00 Mục lục]]\n\n- **Sửa lỗi giao diện (11/10)** = va-index.py **mục 18** `tests/sua-loi/va-sua-loi.py` (chạy cuối, sửa thẳng chuỗi gốc qua `_thay18` – có assert số chỗ): cỡ chữ CSS 10/10,5 → 11px, 11 → 12px, 11,5 → 12,5px (cả `font:<đậm> Npx`); placeholder #gate #8c8c8c, `--chu3` #939393, `--red` tối #f77e7e, bỏ vạch trái `.kpi::before` / `.hn-viec::before` / `.cn-formula`, bỏ chữ tô dải màu `.cn-h` / `.vuot-chu`, `pulseDot` tắt. Kiểm `../.claude/skills/impeccable/scripts/impeccable detect --json Index.html` còn 6 mục cố ý giữ: hiệu ứng màn đăng nhập đã duyệt (lkGoi, nảy, rhChay, đèn LED), sọc băng keo, font Inter. Bộ kỹ năng thiết kế Impeccable + Taste nằm ở `.claude/skills/`.\n- **Treo \"Đang đọc Sheet đơn…\" (08/11, chủ dự án báo sau khi sang Quy trình lưu rồi quay lại)**: `call()` bỏ kết quả hàm đọc khi đã đổi tab và không gọi `cb` khi máy chủ lỗi → cờ đang tải (`DHTai`, `DHDGTai`, `DHHTTai`, `DHTDTai`, `TKTai`, `TKDMTai`, `TKTDTai`, `DHQTTai`) kẹt mãi. Sửa (mục 36, `va-quy-trinh-web.py`): `cb.__luonGoi` → luôn nhận kết quả, lỗi nhận `{ok:false}`; mảnh QuyTrinh dùng `dhDocNen(fn,a,cb)` cho các hàm đọc nền (nơi vẽ tự kiểm tab). `vQTTai` và chuỗi báo cáo `dhBCChot` vẫn dùng `call` thường. Dựng lại lỗi trên bản thử bằng `window.__tre` (chậm 4 s, sang tab rồi quay lại): bản cũ kẹt, bản sửa hiện số. Kiểm thử `quy-trinh-web.js` 143/143, `tang-toc-3-web.js` 24/24 (lần đầu 23/24 do đo thời gian dao động, chạy lại đạt).\n- **Thống kê và Quy trình ghi bước ra hàng Hoàn thiện khác nhau (08/11, chủ dự án báo)**: Thống kê \"Bước cộng vào: ISO Lại Gậy… 70/ngày\", Quy trình \"Đang chọn: Tổ Check Hàng 585/ngày\". Nguyên nhân: số sản lượng xưởng (`DHDG`, từ `layDongGoiNgay`) tải 1 lần mỗi phiên trang, **đổi ⭐ bước xuất rồi Lưu quy trình không tải lại** → Thống kê / Đơn hàng giữ bước cũ tới khi mở lại web. Sửa (`quy-trinh-web.html`): `dhXGMoi()` bỏ `DHDG` (đang tải thì đánh dấu `__dhDGCu` để bỏ khi tải xong) sau Lưu quy trình, duyệt đề xuất TP (đồng ý), Áp dụng cách đếm (`va-dieu-phoi-web.py`). Kiểm bằng bản thử số thật: đổi HT sang HT-ISO-TP → Thống kê hiện đúng \"ISO Lại Gậy… 74/ngày\" như chủ dự án thấy, rồi đọc lại đúng bước mới.\n", "duong": "bo-nao/KPI/KPI Sửa lỗi giao diện.md", "lk": ["Công cụ Claude", "KPI Demo giao diện", "00 Mục lục"]}, {"id": "KPI Sửa nhỏ trên web", "nhom": "KPI", "txt": "# KPI Sửa nhỏ trên web\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[00 Mục lục]]\n\n- **Bỏ thẻ \"KPI Quản lý (Trưởng/Phó phòng)\" ở tab Bảng KPI của ban điều hành (13/10)** = va-index.py **mục 21** (`kpiql_khoi` + `napKPIQuanLyKhoi` chỉ còn cho TP ở tab \"KPI phòng\", vì TP không có tab KPI Quản lý riêng).\n- **Cột Ngày trong thẻ \"Chờ chốt\" (09/10, đã vá vào Index.html):** va-index.py mục 13 sửa `renderDraft` – gom theo `MaNV|Ngay`, cột Ngày (dd/mm + thứ), ngày ≠ hôm nay tô `--amber` + \"không phải hôm nay\", nhiều ngày thì cảnh báo. Kiểm thử `tests/cho-chot-ngay.js` (16, `F=<bản xem thử>`). Dòng \"Tổng\" trong thẻ này vẫn hiện \"–\" cho SL/Lỗi như bản gốc (chưa hỏi chủ dự án có muốn cộng không).\n", "duong": "bo-nao/KPI/KPI Sửa nhỏ trên web.md", "lk": ["KPI Tổng quan và cách dựng", "00 Mục lục"]}, {"id": "KPI Thang xếp loại", "nhom": "KPI", "txt": "# KPI Thang xếp loại\n\nNhóm: KPI · Cập nhật 22/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[KPI Báo cáo tháng]] · [[KPI Âm thanh và giọng Rhino]] · [[Quyết định của chủ dự án]]\n\n## Thang hiện hành (chủ dự án 22/10)\n- **S ≥ 95 · A+ ≥ 90 · A ≥ 85 · B ≥ 80 · C ≥ 70 · D < 70** (mốc tính \"từ … trở lên\").\n- Thang cũ: A+ ≥ 100, A ≥ 90, B ≥ 80, C ≥ 70, D < 70.\n\n## Đã sửa (mục vá `kpi-app/tests/xep-loai/`)\n- Máy chủ `va-xep-loai.py` (cuối va-code.py): `loaiKPI_`, báo cáo tháng `BC_LOAI` thêm S (màu `#5b3fa8`), \"Tỷ lệ xếp loại S/A+/A\" (`tlTot`), chú thích thang, thanh phân loại S → D.\n- Web `va-xep-loai-web.py` (va-index.py mục 29, trước mục 27): `loai()`, `loaiFE()`, ô KPI cá nhân của TP, bảng \"Thang xếp loại\" trong hướng dẫn CN, chú thích KPI quản lý, lời Rhino theo hạng (A+ → \"còn x% lên S\"), thứ tự lên hạng (pháo giấy) có S, giọng `lS` \"loại S.\".\n- Sơ đồ: `tests/so-do/so-do-chung.js` `o.hang` + chú giải màu (S / A+ ≥ 90, A / B 80–90).\n- Giọng: `tests/am-thanh/tao-giong.py` thêm `lS`; thu riêng mảnh này (edge-tts cần `proxy=HTTPS_PROXY` trong sandbox) rồi gộp vào `giong-web.json` → `AmThanh.html` đổi.\n- Tháng đã chốt giữ loại đã lưu trong `KPIThang` (thang cũ); muốn đổi thì Chốt bù tháng đó.\n\n## Kiểm thử\n- `tests/xep-loai.js` 10 (DATA=): mốc từng loại ở máy chủ / web / sơ đồ, bảng KPI tháng 10 khớp (158 người, 23 hạng S), AmThanh có `lS`.\n", "duong": "bo-nao/KPI/KPI Thang xếp loại.md", "lk": ["KPI Tổng quan và cách dựng", "KPI Báo cáo tháng", "KPI Âm thanh và giọng Rhino", "Quyết định của chủ dự án"]}, {"id": "KPI Thao tác và hiệu ứng bên trong", "nhom": "KPI", "txt": "# KPI Thao tác và hiệu ứng bên trong\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Màn đăng nhập Khắc laser]] · [[KPI Bảo mật và vận hành]] · [[00 Mục lục]]\n\n- **Demo thao tác mới bên trong (11/10, chờ chọn; chủ dự án: \"bỏ qua màn đăng nhập\"):** `kpi-app/demo-thao-tac-2.html` (1 file tự chứa, số liệu mẫu): 1 bảng xếp hạng sắp xếp mượt FLIP (`el.animate`) + vạch lên/xuống hạng, 2 thẻ phóng thành trang chi tiết (View Transitions API, `view-transition-name:the`, trình duyệt cũ thì chuyển thẳng), 3 nhấn giữ 450 ms xem nhanh (pointer events, hủy nếu kéo >8px, `.peek` mờ nền), 4 ô tìm nhanh Ctrl+K (tìm không dấu `bo()`, ↑↓ Enter), 5 gợi ý nhập số hôm qua (chữ mờ, Tab/→/chạm nhãn), 6 đèn tháp Andon xanh/vàng/đỏ nhấp nháy, 7 băng chuyền tiến độ ca (hộp rơi vào thùng, vạch định mức), 8 kéo thả người vào công đoạn (pointer, chip nổi `position:fixed`, đếm đủ/thiếu), 9 số lật kiểu bảng ga tàu (split-flap). Mỗi ô ghi chỗ sẽ gắn trên web thật. Chưa gắn vào web.\n  - Phần B (bên trong): `kpi-app/demo-thao-tac.html` (nguồn `tests/thao-tac/demo.src.html`, dựng bằng `tests/thao-tac/tao-demo.py`): 7 vuốt để gửi + số bay vào thùng, 8 số đếm cơ khí + đồng hồ kim % định mức (>130% đỏ), 9 vuốt thẻ duyệt/trả lại + Hoàn tác, 10 cần gạt chốt ca, 11 điểm danh đóng dấu (chạm / vuốt dọc cột dấu), 12 vuốt trái xóa + Hoàn tác 5 giây, 13 kéo xuống làm mới (cơ đánh bi; cảm ứng dùng touchmove passive:false ở đầu danh sách), 14 nhập sai: ô rung + Mai chỉ tay, 15 pháo giấy 1 lần/ngày, 16 hết phiên: tối + dây kéo + hộp đăng nhập lại. Hàm chung `keo()` (ngưỡng 6px; `giuNgay` cho tay nắm nhỏ để vuốt nhanh không tuột), `bao()` thanh báo/Hoàn tác, `rung()` (Android). Kiểm tra `tests/demo-thao-tac.js` (43, gồm vuốt bằng ngón tay qua CDP `Input.dispatchTouchEvent`). Chưa gắn vào web: khi duyệt từng mục thì vá vào va-index.py (mục mới) đúng màn thật (`cnGui`, `vDuyetSL`, chốt ca `chot()`, điểm danh, `renderDraft`/`delD`, `hetHan`…).\n- **ĐÃ GẮN VÀO WEB (10/10):** (1) hiệu ứng màn đăng nhập – `LK_HU` mặc định bật `{chay, cua, mat, ket, gio}` (cửa cuốn thay dây kéo; `window.LK_HU={}` để tắt; các demo so mẫu truyền `{}`; lề né nút `m=26`, đà nảy `cubic-bezier(.3,1.2,.5,1)` để nút không lọt mép); kiểm tra web `tests/dang-nhap-web.js` (15). (2) Phần B mục 9, 10, 12–16 = va-index.py **mục 14** (`tests/thao-tac/va-thao-tac.py` chèn `.css` + `.js` trước `<\/body>` cuối, bọc lại hàm gốc): `duyetNguoi`/`tuChoiNguoi` chờ `TT_MS`=4 giây có Hoàn tác (`ttHen`, số đã sửa chụp lúc bấm; việc mới thì việc cũ gửi ngay; Từ chối bỏ confirm), vuốt nhóm trên điện thoại (`ttGanDuyet`; **touch-action phải đặt ở `td`**, không áp cho `tr`); cần gạt `ttCanGat` thay `#bchot` (ẩn, vẫn giữ); `delD` có Hoàn tác + vuốt trái; kéo xuống làm mới (trừ `cnnhap`, `dd`); `rungONhap` → `ttMaiChi` (trừ `cnnhap`); pháo giấy `ttPhao` trong `vKPICaNhanToi` (khóa `kpi_phao_<tk>`); `hetHan` → **cửa cuốn** sập xuống (13/10, thay dây kéo đèn vì khó kéo; giống cửa cuốn màn đăng nhập, dùng lại logo `#gate .lk-dau img`): vuốt lên >1/4 màn hình, chạm/bấm không kéo, hoặc nhấn phím bất kỳ đều mở → hộp đăng nhập lại tại chỗ (`dangNhap(ME.tk,mk)`, thay lớp phủ Lottie hết phiên – đã sửa `tests/lottie-web.js`). `#ttBao` z-index 8600 và tự đóng bong bóng Mai góc (che nút Hoàn tác). Kiểm tra `tests/thao-tac-web.js` (32). **Giữ nguyên theo yêu cầu: trang công nhân nhập sản lượng (mục 7, 8) và điểm danh (mục 11).** Demo: mục 8 làm lại bàn phím số to + nút nhanh, mục 11 có ngăn chọn lý do vắng (`tests/demo-thao-tac.js` 60) – chỉ là demo, chưa gắn.\n", "duong": "bo-nao/KPI/KPI Thao tác và hiệu ứng bên trong.md", "lk": ["KPI Màn đăng nhập Khắc laser", "KPI Bảo mật và vận hành", "00 Mục lục"]}, {"id": "KPI Thống kê không tính hôm nay (09-11)", "nhom": "KPI", "txt": "# KPI Thống kê không tính hôm nay (09-11)\n\nLiên quan: [[KPI Quy trình sản xuất]] · [[KPI Điều phối sản xuất (08-11)]] · [[KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)]] · [[KPI Kiểm thử]] · [[00 Mục lục]]\n\n## Yêu cầu (09/11)\n- Chủ dự án: mọi số thống kê (KPI xưởng, KPI cá nhân, tab Thống kê, biểu đồ, lưu đồ…) **không tính ngày đang làm việc** vì làm sai lệch. Chọn: **tính tới hết hôm qua**; phạm vi: tab Thống kê + biểu đồ, KPI (xưởng + cá nhân), Tổng quan + Điều phối + Lưu đồ. **Không** chọn báo cáo / email (nhưng báo cáo dùng chung số đóng gói theo ngày nên cũng tới hết hôm qua).\n- Giữ nguyên vận hành trong ngày: điểm danh, nhập / duyệt sản lượng, cơm, sĩ số hôm nay, việc cần làm.\n- Kèm: Thống kê › Sản lượng từng xưởng – **bấm ô / biểu đồ cột của xưởng → cửa sổ nổi to** (`dhPhongXuong`, biểu đồ khổ lớn + số từng ngày, Esc / ✕ / bấm nền để đóng).\n\n## Đã sửa\n- Máy chủ `tests/bo-hom-nay/va-bo-hom-nay.py` (cuối va-code.py): `kpiThang_` bỏ ngày ≥ hôm nay (ngày công + vi phạm) → Bảng KPI, KPI tất cả xưởng, KPI cá nhân, KPI máy; `tkNgayLam_` tới hết hôm qua; `layThongKe` bỏ chấm công / KCS / nhật ký / nhập trễ / vi phạm hôm nay, khóa nhớ tạm `TK_v2_<tháng>_<ngày>`; `layDongGoiNgay` + `layQuyTrinh`: `den` = hôm qua. Điều phối (`dpTinh_`) vốn đã tính tới hôm qua.\n- Web: Index mục 43 (`tests/bo-hom-nay/va-bo-hom-nay-web.py`) – `kpiThangNay_` bỏ hôm nay, ghi chú \"tới hết hôm qua\" ở Bảng KPI; QuyTrinh (nguồn `tests/quy-trinh/quy-trinh-web.html`): `dhNgayLamGanNhat` mặc định tới hôm qua, `dhDGThang` ngày làm đã qua = trước hôm nay, báo cáo tháng `kd < hôm nay`, ghi chú Thống kê + tiêu đề Sản lượng từng xưởng \"tới hết dd/mm, không tính hôm nay\".\n\n## Kiểm thử\n- `tests/bo-hom-nay.js` 7/7 (thêm 30 dòng nhật ký hôm nay 99.999 sp → KPI, Thống kê, sản lượng xưởng, lưu đồ không đổi; thêm số 07/11 → đổi).\n- `tests/bo-hom-nay-web.js` 14/14 (máy tính + điện thoại: tới hết hôm qua, cửa sổ nổi, Esc / ✕, KPI tạm tính trình duyệt).\n- quy-trinh-web: 5 lỗi **có sẵn từ trước** (chạy bản b5371b2 cũng y hệt) – mục tiêu % theo cài đặt đã lưu, \"chưa tải giao diện\", \"quy trình còn nháp\".\n", "duong": "bo-nao/KPI/KPI Thống kê không tính hôm nay (09-11).md", "lk": ["KPI Quy trình sản xuất", "KPI Điều phối sản xuất (08-11)", "KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)", "KPI Kiểm thử", "00 Mục lục"]}, {"id": "KPI Trang giới thiệu kpicarbon.io.vn (08-11)", "nhom": "KPI", "txt": "# KPI Trang giới thiệu kpicarbon.io.vn (08-11)\n\nLiên quan: [[Liên kết và công cụ]] · [[Việc chờ chủ dự án]] · [[KPI Demo giao diện]] · [[00 Mục lục]]\n\n## Vì sao có trang này\n- Chủ dự án muốn link web KPI dán vào Zalo có **ảnh xem trước** (như trang Qoder `kpi-san-xuat-tefppm4sll9.qoder.website` họ tự làm).\n- Link Apps Script (`script.google.com/.../exec`) không hiện ảnh vì Google bọc web trong iframe, Zalo không đọc được thẻ `og:`. → cần trang trung gian ở chỗ khác.\n- 08/11 chủ dự án tự mua tên miền **kpicarbon.io.vn** (đuôi .io.vn của VNNIC, phí duy trì 20.000 đ/năm). Không mua hosting: trang để trên **GitHub Pages** miễn phí (repo công khai).\n- Đã cân nhắc và bỏ: dùng `kpi.rhinobilliards.vn` (DNS ở Mắt Bão, web Shopify) / `kpi.rhino-billiards.com` (DNS Cloudflare) – chủ dự án không muốn dùng tên miền công ty.\n\n## Cách dựng\n- Thư mục `docs/` ở nhánh KPI (không tạo nhánh mới): `index.html`, `og.jpg` (1200×630), `nen.jpg`, `logo-rhino.png`, `favicon.png`, `apple-touch-icon.png`, `CNAME` (= `kpicarbon.io.vn`), `.nojekyll`.\n- `og.jpg` dựng từ `kpi-app/anh/web/nen-dang-nhap.jpg` (ảnh nhà máy đêm, nền màn đăng nhập) + logo RHINO + chữ \"Hệ thống KPI sản xuất\" + nhãn tên miền; HTML nguồn ở scratchpad (không commit), chụp bằng Playwright.\n- `index.html`: nút \"Mở hệ thống KPI →\" tới link công ty `AKfycbzeCiG2…/exec`; **tự mở sau 1,5 s** (`?o=0` để ở lại trang). Đổi link web KPI = sửa `href` của nút `#mo`.\n- Kiểm 08/11: 390 px và 1280 px không lỗi, không tràn; tự chuyển đúng link.\n\n## Việc chủ dự án cần làm (chờ)\n1. GitHub → repo → Settings → Pages → Source \"Deploy from a branch\" → nhánh `claude/beautiful-ptolemy-f2j7za`, thư mục `/docs` → Save. (Claude không có công cụ bật Pages.)\n2. Trang quản lý DNS của nơi mua tên miền: 4 bản ghi **A** cho `@` → `185.199.108.153`, `185.199.109.153`, `185.199.110.153`, `185.199.111.153`; 1 bản ghi **CNAME** `www` → `phamdoanchiengroup-cloud.github.io`.\n3. Sau khi DNS chạy: Settings → Pages → tick \"Enforce HTTPS\".\n- 08/11 kiểm DNS: `kpicarbon.io.vn` chưa có bản ghi (NXDOMAIN).\n\n## Sau đó (08/11)\n- Chủ dự án muốn tên miền **vào thẳng web**, không phải landing. Phương án: A = trang `og:` + chuyển ngay (thanh địa chỉ thành script.google.com, không đổi bảo mật); B = iframe toàn màn hình, giữ kpicarbon.io.vn trên thanh địa chỉ, cần bật lại ALLOWALL (bỏ từ 18/10) + kiểm `location.ancestorOrigins` (chỉ cho chạy khi không bị nhúng hoặc tầng ngoài là kpicarbon.io.vn), mỗi người đăng nhập lại 1 lần. Chưa chọn – **tạm gác** cùng việc chuyển quyền sang công ty (xem [[Việc chờ chủ dự án]]). Trang `docs/` hiện vẫn là bản landing tự mở sau 1,5 s; GitHub Pages + DNS chưa bật.\n", "duong": "bo-nao/KPI/KPI Trang giới thiệu kpicarbon.io.vn (08-11).md", "lk": ["Liên kết và công cụ", "Việc chờ chủ dự án", "KPI Demo giao diện", "00 Mục lục"]}, {"id": "KPI Tăng tốc và giao diện 29-09", "nhom": "KPI", "txt": "# KPI Tăng tốc và giao diện 29-09\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Tổng quan và cách dựng]] · [[KPI Kiểm thử]] · [[00 Mục lục]]\n\n- Bản 29/09: tăng tốc máy chủ (`tests/toc-do.gs`: gom ghi, nhớ tạm kết quả, `napPhan` + `phanDoi`, Sheets API, lưu trữ nhật ký) và giao diện bên trong mới (`tests/giao-dien-moi.html`: menu nhóm, thanh dưới điện thoại, tab Việc hôm nay, bảng màu xám than + cyan, nút ☀/☾, hiệu ứng chỉ chạy khi có sự kiện và tôn trọng prefers-reduced-motion). Bản xem thử 1 file: `tests/tao-ban-xem-thu.js` (kết quả có số liệu thật đã ẩn danh, không commit). Kiểm thử: `kpi-app/README.md` (cần dữ liệu JSON xuất từ Sheet, không commit vì có dữ liệu cá nhân).\n", "duong": "bo-nao/KPI/KPI Tăng tốc và giao diện 29-09.md", "lk": ["KPI Tổng quan và cách dựng", "KPI Kiểm thử", "00 Mục lục"]}, {"id": "KPI Tăng tốc đợt 2 (21-10)", "nhom": "KPI", "txt": "# KPI Tăng tốc đợt 2 (21-10)\n\nNhóm: KPI · Cập nhật 21/10/2026\nLiên quan: [[KPI Tăng tốc và giao diện 29-09]] · [[KPI Phần giao diện tải sau]] · [[KPI Cập nhật bằng clasp]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\nChủ dự án báo 21/10: đăng nhập vẫn lâu; tab Bảng KPI và KPI quản lý tải lâu.\n\n## Đo trên dữ liệu thật 21/10 (CSDL KPI tải qua Google Drive, bản xuất ở scratchpad, KHÔNG commit)\n- NhatKySanXuat 14.460 dòng (~7.000 dòng/tháng), NhatKyThaoTac 26.856 dòng. Mỗi lượt nạp đọc ~265.000 ô.\n- `napDuLieu` gửi về: ban điều hành 2,9 MB (riêng `nhatky` 12.417 dòng = 2,2 MB), TP 1,06 MB, CN 0,9 MB.\n- `layKPIKy` / `layKPIQuanLy` có bộ nhớ tạm 10 phút (`nho_`) nhưng khóa theo `KPI_PB`, mà mọi lượt ghi có khóa (`xong_` → `tangPhienBan_`) đều đổi số này – kể cả công nhân gửi sản lượng, đăng ký cơm – nên giờ làm việc gần như luôn tính lại từ đầu.\n\n## Đã sửa (chưa dán – gộp với bản sửa 21/10: Code.gs + Index.html)\n- Máy chủ `tests/tang-toc-2/va-tang-toc.py` (exec cuối va-code.py):\n  - `napDuLieu`/`napPhan` → `goiNap_`: trả MỘT chuỗi JSON; mảng ≥30 dòng mà mọi dòng cùng thứ tự cột thì gói `{__b:1,c:[cột],h:[[giá trị]]}`. Ban điều hành 2,9 → 1,36 MB, TP 1,06 → 0,58 MB, CN 0,91 → 0,46 MB.\n  - Bộ nhớ tạm KPI có số phiên bản riêng `KPI_PB_KPI` (`phienBanKPI_`, `NHO_KPI_` = layKPIKy, layKPIQuanLy, layLichSuKPI). `xong_` chỉ đổi khi `anhHuongKPI_()`: bỏ qua lượt chỉ ghi `SHEET_KHONG_KPI_` (DangKyCom, ThucDon, SuatAnThang, NhatKyThaoTac, ThongBao, BoTriMay, HoiNhap, YeuCauSuaHoSo, KiemTraDuLieu, NguoiNhanBaoCao) và `congNhanGuiSanLuong` (`__KPI_KHONG_DOI`: dòng \"Chờ duyệt\" không vào KPI; KPI quản lý tính duyệt trễ theo ThoiDiemDuyet nên cũng không đổi). `tangPhienBan_()` gọi thẳng (XOA_BO_NHO_TAM…) vẫn xóa cả nhớ KPI.\n  - Làm nóng: `LAM_NONG_KPI` (trigger 10 phút, chỉ 6h–22h, `noiBo_`) tính sẵn layKPIKy tháng này cho '' + từng xưởng PhongBan và layKPIQuanLy cho ADMIN (owner/không owner) + TP từng xưởng; `layKPIKyGoc_`/`layKPIQuanLyGoc_` nhận thêm `meSan`. Cài: chạy tay `CAI_TRIGGER_LAM_NONG_KPI`; tắt: `TAT_TRIGGER_LAM_NONG_KPI`. Trên giả lập ~2,5 giây/lượt.\n- Web = va-index.py **mục 26** `tests/tang-toc-2/va-tang-toc-web.py`: `moGoi_` mở gói ở napTruoc_, napCo_, reload, lmTai.\n- Giả lập: `gia-lap-kpi.js` `__goi` tự mở gói như trình duyệt, `__goiTho` lấy bản thô; đếm ô đọc `__thongKe.o`; `everyMinutes`. `tao-ban-xem-thu.js` reset `__PB_KPI`, `__KPI_KHONG_DOI`.\n- Kiểm thử `tests/tang-toc-2.js` (31, DATA=). Các bộ cũ (sua-loi-21-10, bao-mat, van-hanh, com-trua, bao-cao, kiem-tra; web: sua-loi-21-10-web, van-hanh-web, thao-tac-web, dang-nhap-web) cho kết quả **giống hệt** bản trước sửa – các lỗi / dừng còn lại có từ trước do dữ liệu thật đã khác lúc viết kiểm thử (vd. van-hanh dừng ở `SLGoc`, com-trua ở `TenDangNhap`).\n\n## Còn có thể làm\n- Chưa biết bản thật đã bật Sheets API (`KIEM_TRA_SHEETS_API`) chưa – nếu chưa, mỗi lượt nạp đọc 23 sheet riêng lẻ, rất chậm. Đã ghi vào hướng dẫn dán.\n- `nhatky` gửi từ đầu tháng trước (`SO_THANG_GUI_VE` = 2); có thể giảm nếu giao diện không cần tháng trước.\n- Index.html ~0,83 MB tải mỗi lần mở trang (ảnh nền đăng nhập 131 KB base64).\n- 22/10: chủ dự án chạy `KIEM_TRA_SHEETS_API` báo 2 ô lệch ở TaiKhoan cột 11 `HanMatKhauTam` (ngày giờ trả về số serial) → thêm `HanMatKhauTam`, `CapNhat` vào `COT_NGAY_` (`tests/toc-do.gs`). Thử trên dữ liệu thật: KHỚP 24 trang tính.\n- 22/10 (lần 2): lệch 3 ô NhatKySanXuat dòng 14364 vì trưởng phòng duyệt đúng lúc kiểm tra → `KIEM_TRA_SHEETS_API` giữ khóa ghi (LockService) trong lúc đọc 2 cách, lệch thì thử lại tối đa 3 lần.\n", "duong": "bo-nao/KPI/KPI Tăng tốc đợt 2 (21-10).md", "lk": ["KPI Tăng tốc và giao diện 29-09", "KPI Phần giao diện tải sau", "KPI Cập nhật bằng clasp", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Tăng tốc đợt 3 (08-11)", "nhom": "KPI", "txt": "# KPI Tăng tốc đợt 3 (08-11)\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[KPI Tăng tốc đợt 2 (21-10)]] · [[KPI Tăng tốc và giao diện 29-09]] · [[KPI Quy trình sản xuất]] · [[KPI Kiểm thử]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\nChủ dự án 08/11: \"Tính toán và cải thiện tốc độ tải dữ liệu và load trang\". Đã hỏi, chủ dự án chọn **A** (máy chủ + bộ đo) và **hiện số lần trước kèm nhãn**.\n\n## Đo trước khi sửa (dữ liệu thật 07/11, máy giả lập)\n- Mọi lượt gọi đọc cả sheet NhatKySanXuat: 19.252 dòng × 16 cột ≈ **345.000 ô / lượt** (tăng ~7.000 dòng/tháng). Lưu trữ nhật ký (`LUU_TRU_NHAT_KY`) giữ 4 tháng nên chưa chuyển dòng nào.\n- Gói đăng nhập `napDuLieu`: chủ sở hữu / ban điều hành 1,2 MB, TP 455 KB, CN 111 KB (đã chỉ gửi 11 cột web dùng).\n- `layDonHoanThien` 1,7 MB (5.355 dòng tab HT), `layDonHangXuong` 484 KB.\n- Index.html 836 KB (gzip 292 KB): JS 624 KB, CSS 90 KB, 2 ảnh base64 83 KB.\n- Nhật ký KHÔNG theo thứ tự ngày (nhập bù hàng loạt tháng 9, 26 dòng ghi ngày tương lai) → không đọc \"đuôi sheet\" được; chọn bộ nhớ dùng chung.\n\n## Đã làm (`tests/tang-toc-3/`)\n- Máy chủ `toc-do-3.gs` + `va-tang-toc-3.py` (exec cuối va-code.py):\n  - **Nhật ký dùng chung giữa các lượt gọi**: `nkdLay_` / `nkdGhi_` – CacheService, JSON → gzip → base64, mảnh 90 KB (`NKD3_<pb>_i`), 10 phút; số phiên bản `NKD3_pb` đổi trong `xoaCache_` (mọi lối ghi) và `XOA_BO_NHO_TAM`. Ngày lưu dạng `\\u0007<ms>` rồi dựng lại Date; giữ `_row`. Gắn vào `doc_` và `napTruoc_` (Sheets API). **Lượt đang giữ khóa ghi (`khoa_`) luôn đọc thẳng sheet** (`nkdDung_`) – các hàm duyệt / từ chối / gửi đều `khoa_()` trước khi đọc. Sửa tay trong Sheet: chạy XOA_BO_NHO_TAM hoặc đợi ≤ 10 phút. Dữ liệu thật: nén 600 KB = 7 mảnh.\n  - **Bộ đo**: `__T0` đầu file; `sach_` gắn `__ms` (kết quả có `ok`), `goiNap_` gắn `__ms`. `ghiTocDo(token, ds)` gộp theo ngày vào ScriptProperties `TD_yyyyMMdd` {f: hàm → [lượt, tổng ms, chậm nhất, tổng ms máy chủ, lượt có số máy chủ, 8 ngăn <0,5/1/2/3/5/8/15/≥15 s], v: \"trang|vaoApp|napDuLieu|VAI_TRO\"}, giữ 14 ngày. `layTocDo(token, soNgay)` chỉ chủ sở hữu.\n  - **Khóa bản lưu trên máy**: `layKhoaLuu(token)` (32 byte, ScriptProperties `KL_<tk>`), `boKhoaLuu_` khi `dangXuat` / `doiMatKhau`.\n  - `doGet` dùng `createHtmlOutputFromFile('Index')` (Index không có `<? ?>`, khỏi biên dịch mẫu 0,8 MB mỗi lần mở).\n  - `layDonHoanThien` gửi gọn dạng bảng 9 cột `donC` / `donH` (web mở bằng `dhHTMo`): 1,7 MB → 0,48 MB.\n- Web mục 38 `va-tang-toc-3-web.py` (exec cuối va-index.py):\n  - `call()` đo từng lượt (`tdGhi_`), `napDuLieu`, `vaoApp` (bấm Đăng nhập → thấy số), `trang` (DOMContentLoaded); gửi gộp `tdGui_` (15 mục / 3 phút / khi ẩn trang / khi Thoát).\n  - **\"Mở nhanh (máy cá nhân)\"** – ô tích ở màn đăng nhập, mặc định TẮT (`kpi_nho_dl`). Bản lưu `kpi_dl_<tk>` mã hóa AES-GCM (khóa từ máy chủ, giữ ở sessionStorage `kpi_kl`), bỏ SoCCCD / DienThoai / DiaChi / SdtKhanCap / LuongCoBan / NamSinh / SoTaiKhoan / Email, hết hạn 12 giờ, gắn phiên bản Index (`DL_VER`). Mở web: `dlHienCu_` hiện ngay + nhãn `#dlNhan` \"Đang hiện số lúc … · đang cập nhật số mới…\", `window.__dlCu` chặn mọi lượt ghi trong `call()`; số mới về thì bỏ nhãn, ở nguyên tab. Thoát / hết phiên / bỏ tích → xóa.\n  - Thống kê › **Tốc độ web** (`tkVeTD` trong quy-trinh-web.html): theo vai trò (mở trang, đăng nhập → thấy số, gói dữ liệu) với mục tiêu màu, từng thao tác (TB, 90% nhanh hơn, chậm nhất, máy chủ vs đường truyền), cột theo ngày.\n- Chuyên gia: `quan-ly-van-hanh` (ưu tiên: đọc ít dữ liệu → trang nhẹ cho công nhân → hiện số cũ → gói đăng nhập → HT; mục tiêu: mở trang < 3 s, đăng nhập → thấy số CN < 2 s / chủ < 4 s, máy chủ P50 < 1,5 s, P95 < 3 s). `bao-mat-ung-dung` (mã hóa bằng khóa máy chủ, mặc định không lưu – người dùng tự tích, bỏ trường nhạy cảm, đổi khóa khi Thoát / đổi mật khẩu).\n\n## Kết quả đo lại (máy giả lập)\n- Ô đọc mỗi lượt sau lượt đầu: 345k → **37k** (napDuLieu), layKPIKy 334k → 26k, phanTichDinhMuc 335k → 27k, layThongKe 358k → 50k.\n- Mở lại trang (có \"Mở nhanh\"): thấy số sau ~20–30 ms trong lúc chờ gói mới.\n- Số thật trên Google: xem Thống kê › Tốc độ web sau vài ngày dùng.\n\n## Chưa làm / còn có thể làm\n- Gói đăng nhập chủ sở hữu vẫn 1,2 MB (nhật ký 2 tháng) – đợi số đo: nếu \"đường truyền\" lớn thì tách tháng trước tải sau.\n- Thu nhỏ Index cho công nhân (phương án B) – chủ dự án chưa chọn.\n- Chạy `CAI_TRIGGER_LUU_TRU` nếu chưa cài (lưu trữ nhật ký cũ hằng tháng).\n\n## Kiểm thử\n- `tests/tang-toc-3.js` 17/17 (DATA= dữ liệu thật), `tests/tang-toc-3-web.js` 24/24 (bản xem thử dh-uu, GIO 01/11).\n- `don-hang.js` thêm 1 (HT dạng bảng). Bộ cũ (sua-loi-21-10, bao-mat, van-hanh, com-trua, bao-cao, ho-so, don-hang, tang-toc-2, dinh-muc, quy-trinh…) cho kết quả giống hệt bản trước sửa.\n- Bản xem thử: `tao-ban-xem-thu.js` thêm `base64Encode/Decode` và `window.__tre` (độ trễ giả cho kiểm thử); giả lập `gia-lap-kpi.js` đặt lại `__T0`, `__NKD_TT` mỗi lượt.\n", "duong": "bo-nao/KPI/KPI Tăng tốc đợt 3 (08-11).md", "lk": ["KPI Tăng tốc đợt 2 (21-10)", "KPI Tăng tốc và giao diện 29-09", "KPI Quy trình sản xuất", "KPI Kiểm thử", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Tăng tốc đợt 4 – đăng nhập (08-11)", "nhom": "KPI", "txt": "# KPI Tăng tốc đợt 4 – đăng nhập (08-11)\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[KPI Tăng tốc đợt 3 (08-11)]] · [[KPI Kiểm thử]] · [[Lần dán lên Apps Script]] · [[KPI Cập nhật bằng clasp]] · [[00 Mục lục]]\n\nChủ dự án 08/11: \"công nhân và TP, PP mất hơn 20 giây để bấm đăng nhập, thấy số và tải gói dữ liệu\". Chọn **A + B**.\n\n## Đo (máy giả lập, số thật 09/11 7h30)\n- Mỗi lần nạp gói đăng nhập: **~21 lượt đọc trang tính riêng lẻ** (Sheets API chưa bật trên bản thật – việc chờ từ 21/10 chưa làm) + bộ nhớ nhật ký trống thì đọc thêm cả sheet nhật ký (345k ô, ~19k dòng).\n- Gói thật (chuỗi gửi về): TP 180–426 KB (Phôi Carbon lớn nhất), CN ~200 KB (cả xưởng đã chốt để xếp hạng), ban điều hành 1,1 MB. Số 816 KB báo lúc đầu bị tính trùng (JSON của chuỗi). Gói TP/PP **đã** lọc theo xưởng + từ đầu tháng trước → phần B gần như có sẵn, không cắt thêm (cắt nữa mất nhật ký tháng trước của TP).\n\n## Đã làm (`tests/tang-toc-4/`, exec cuối va-code.py)\n- `2-CAP-NHAT.bat` (cap-nhat.ps1 bước 3b): tự thêm dịch vụ Sheets v4 vào `appsscript.json` trước khi đẩy; lỗi thì giữ nguyên file cũ.\n- `GIU_NONG_DANG_NHAP` (lịch 5 phút, 6h–22h, **tự cài** `tt4CaiLich_` khi chủ sở hữu mở web): (1) có dịch vụ Sheets mà chưa bật → chạy `KIEM_TRA_SHEETS_API` (đọc 2 cách so khớp) tối đa 1 lần/ngày tới khi khớp; `TAT_SHEETS_API` ghi `KPI_SHEETS_TAT` để không tự bật lại. (2) bản nhớ nhật ký NKD3 quá 8 phút → đọc lại sheet và ghi (`NKD3_t`); bản nhớ sống 10 → 15 phút.\n- `napDuLieuLoi_` gọi `napTruoc_(SHEET_NAP_)` ngay đầu (trước đọc phiên), thêm `LichSuDinhMuc` → khi đã bật API, cả gói đăng nhập **1 lượt đọc**.\n- Thống kê › Tốc độ web: dòng trạng thái Sheets API + lịch giữ nóng (`layTocDo().tt4`).\n- Chạy tay nếu cần: `TAT_GIU_NONG_DANG_NHAP`, `BAT_GIU_NONG_DANG_NHAP`.\n\n## Kiểm thử\n- `tests/tang-toc-4.js` 14/14. Bộ cũ: tang-toc-3 17/17, tang-toc-2 31/31, dieu-phoi 27/27, quy-trinh 72/76 và van-hanh 3 lỗi (giống bản trước).\n- cap-nhat.ps1 chưa chạy thử được (máy đám mây không có PowerShell) – đọc soát kỹ, có khôi phục file cũ khi lỗi.\n\n## Sau khi dán\n- 08/11 chủ dự án báo: dịch vụ Sheets API **đã có sẵn** trong Apps Script → thiếu là cờ `KPI_SHEETS_API` (chỉ đặt khi chạy tay KIEM_TRA_SHEETS_API – chưa chạy). Lịch giữ nóng tự kiểm tra và bật, không cần làm tay.\n- Mở web bằng tài khoản chủ sở hữu 1 lần (tự cài lịch). Sau ≤ 1 ngày xem Thống kê › Tốc độ web: \"đọc gộp Sheets API **đang bật**\".\n", "duong": "bo-nao/KPI/KPI Tăng tốc đợt 4 – đăng nhập (08-11).md", "lk": ["KPI Tăng tốc đợt 3 (08-11)", "KPI Kiểm thử", "Lần dán lên Apps Script", "KPI Cập nhật bằng clasp", "00 Mục lục"]}, {"id": "KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)", "nhom": "KPI", "txt": "# KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11)\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[KPI Điều phối sản xuất (08-11)]] · [[KPI Kiểm thử]] · [[Lần dán lên Apps Script]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\nChủ dự án yêu cầu 08/11 (5 việc). Hỏi chuyên gia `quan-ly-van-hanh` cho Tổng quan: \"một màn hình trả lời 5 câu mỗi sáng\", 3 phương án, khuyến nghị **Vừa**. Chủ dự án chọn Vừa nhưng **bỏ tỷ lệ lỗi** (chưa có số liệu lỗi), Đài quan sát **làm lại đẹp hơn, thêm hiệu ứng**, bộ lọc **Xưởng + Trạng thái + Chức danh + Thâm niên + Độ tuổi**, áp cho **mọi vai trò**.\n\n## 1. Gỡ \"Đón người mới\"\n- Web: bỏ mục D4 (`vhHoiNhap`, `vhDanhDau`, CSS `.vh-muc`) trong `tests/van-hanh/van-hanh-web.html`; `ho-so-web.js` hết tham chiếu `vhHN`.\n- Máy chủ: bỏ `layHoiNhap`, `danhDauHoiNhap`, `HN_*` trong `tests/van-hanh/van-hanh.gs`. Sheet `HoiNhap` cũ trong Google Sheet để nguyên (không còn dùng, chủ dự án tự xóa nếu muốn).\n- Kiểm thử: bỏ phần D4 ở `van-hanh.js`; `van-hanh-web.js` kiểm \"không còn khung Đón người mới\".\n\n## 2–4. Tab Nhân sự (mục 40 `tests/nhan-su/va-nhan-su-loc-web.py`)\n- Thứ tự: **Thêm nhân viên → Tìm nhân viên (+ bộ lọc) → Hồ sơ chưa đủ → bảng theo xưởng**.\n- `nsTheTim()`: ô tên / mã + 5 bộ lọc (số người mỗi lựa chọn trong ngoặc), nhóm thâm niên / tuổi giống Thống kê nhân sự (`NS_TN`, `NS_TUOI`). `locNhanSu()` lọc theo `data-x/tt/cd/tn/tuoi` của từng dòng, đầu thẻ xưởng \"k / n người\", nút \"✕ Bỏ lọc\"; vẽ lại tab giữ bộ lọc (`NS_LOC`).\n- Bảng (mọi vai trò): bỏ cột Xưởng, bỏ cột KPI, thêm **Thâm niên** \"x năm y tháng\" (`nsThang` từ NgayVaoLam, dưới 3 tháng tô vàng). Trạng thái chỉ có Đang làm / Tạm nghỉ (người nghỉ việc không tải về web).\n\n## 5. Tổng quan chủ sở hữu (mục 41 `tests/tong-quan/tong-quan-web.js`)\n- Chỉ `ME.laOwner`: `vDash` → `tqVe()`; ban điều hành / TP giữ Tổng quan cũ (vẫn có chưa khai báo + dưới 80%).\n- Khối: (1) 4 ô – thành phẩm Đóng gói ngày làm gần nhất / mục tiêu + đường 14 ngày, giao đúng hạn 4 tuần, có mặt hôm nay, đơn trễ hạn (+ số ngày hàng tồn); (2) sản lượng từng xưởng ngày làm gần nhất so mục tiêu (xanh ≥ 95, vàng 80–95, đỏ < 80); (3) đơn hàng: trễ hạn, đến hạn 7 ngày (đơn ưu tiên), đơn vào / làm xong 7 ngày (báo khi vào > xong 3 ngày liền); (4) nhân lực hôm nay theo xưởng + suất cơm (`xemTongHopCom`); (5) cần chú ý: độ tin cậy số liệu (% nhật ký ngày làm gần nhất đã duyệt), nút cổ chai, hàng đang dồn, chờ duyệt quá 2 ngày, có thể ghi thiếu (`layDieuPhoi`).\n- Nạp: `siSoTatCaXuong`, `xemTongHopCom`, `layDieuPhoi`, mảnh QuyTrinh (`dhTai`, `dhTaiDG`, `dhTaiTD`); bọc `dhVeLai` để khi đang ở tab Tổng quan thì vẽ lại khối, không vẽ Quy trình.\n- Đài quan sát (`tests/holo/holo-web.js`): bỏ \"Dưới 80%\" + \"Hôm nay đã khai\"; cột phải = **Có mặt hôm nay** (`holoCoMat`, cập nhật khi tải xong điểm danh) + **Số liệu ngày làm gần nhất đã duyệt** (`holoNgayLamTruoc`). Hiệu ứng (chỉ khi Hologram · chuyển động, `.hl-dong`; tắt khi \"tĩnh\" / máy giảm chuyển động): quét radar, vành vạch xoay, hạt bay quỹ đạo, sao nhấp nháy, đa giác vẽ dần, nhịp tim ở tâm, vòng tròn chạy, vạch sáng quét dọc, số chạy từ 0 (`holoDemSo`).\n\n## Gộp Việc hôm nay vào Tổng quan (08/11, chỉ chủ sở hữu)\n- Chủ dự án: \"nên kết hợp 2 tab Tổng quan và Việc hôm nay vào làm 1\". Chọn **chỉ chủ sở hữu**, tên **Tổng quan**, **số trước – việc sau**.\n- Thứ tự: Đài quan sát → 4 ô số → **Việc cần xử lý** (`tqVeViec`, danh sách `viecHomNay()` bỏ mục \"Chưa nhập sản lượng\" + khẩu hiệu `maiBang`) → sản lượng xưởng → đơn hàng → nhân lực → độ tin cậy số liệu → **Điều phối** (`dpNap`: cách đếm + nút Áp dụng, nút cổ chai, dòng chảy, sức khỏe dữ liệu, việc theo xưởng) → **Đi nhanh**. Bỏ khối \"Cần chú ý\" (trùng Điều phối); \"Điểm danh hôm nay\" nằm trong Nhân lực.\n- Chủ sở hữu: menu bỏ `homnay`, mở web vào Tổng quan, thanh dưới điện thoại `dash, nk, kpi, dx`, số việc gấp (đỏ) gắn ở Tổng quan, mọi `go('homnay')` chuyển sang `dash`. Ban điều hành / TP giữ 2 tab như cũ.\n- `hieu-ung.js` phần đồng hồ KPI cũ chuyển sang tài khoản giamdoc (4 lỗi phần TP có sẵn, giống bản trước).\n\n## Kiểm thử\n- `tests/nhan-su-loc-web.js` 13/13, `tests/tong-quan-web.js` 26/26 (bản thử số thật GIO 09/11 9h), `holo-web.js` 21/21 (chờ số chạy xong), `van-hanh-web.js` 29/29, `dieu-phoi-web.js` 13/13. `van-hanh.js` 3 lỗi có sẵn (giống bản trước).\n", "duong": "bo-nao/KPI/KPI Tổng quan chủ sở hữu và tab Nhân sự (08-11).md", "lk": ["KPI Điều phối sản xuất (08-11)", "KPI Kiểm thử", "Lần dán lên Apps Script", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Tổng quan và cách dựng", "nhom": "KPI", "txt": "# KPI Tổng quan và cách dựng\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[Lần dán lên Apps Script]] · [[KPI Phần giao diện tải sau]] · [[KPI Kiểm thử]] · [[00 Mục lục]]\n\n- `kpi-app/Code.gs`, `kpi-app/Index.html` là bản đã vá, sinh từ `kpi-app/goc/` bằng `tests/va-code.py` và `tests/va-index.py`. Sửa tiếp thì sửa hai script vá này (hoặc sửa thẳng rồi cập nhật `goc/`).\n- Hướng dẫn cho chủ dự án: `kpi-app/HUONG-DAN-CAP-NHAT.md`.\n- Tách một mẫu từ trang demo ra file riêng: lấy CSS chung + khối `/* ===== N.` + `<section id=\"demoN\">` + phần JS chung + khối `/* =================== N.`. Chưa gắn mẫu nào vào web thật.\n", "duong": "bo-nao/KPI/KPI Tổng quan và cách dựng.md", "lk": ["Lần dán lên Apps Script", "KPI Phần giao diện tải sau", "KPI Kiểm thử", "00 Mục lục"]}, {"id": "KPI Web công nhân kiểu Apple (09-11)", "nhom": "KPI", "txt": "# KPI Web công nhân kiểu Apple (09-11)\n\nNhóm: KPI · 09/11/2026\nLiên quan: [[KPI Demo giao diện]] · [[Việc chờ chủ dự án]] · [[Lần dán lên Apps Script]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\n## Chủ dự án chốt (09/11)\n- Áp giao diện kiểu Apple (demo `scratchpad/cn/Web-cong-nhan-demo.html` ngày 08/11) **chỉ cho tài khoản công nhân**; TP / PP / chủ giữ nguyên.\n- Thanh dưới **5 nút Nhập · KPI · Cơm · Xưởng · Tôi** (gom 7 mục cũ).\n- Bảng KPI xưởng chỉ hiện **top 3 + người ngay trên + mình**, có nút \"Xem cả xưởng\".\n- **Bật cho tất cả**, có nút về giao diện cũ (ở Tôi), giao diện cũ có nút \"Giao diện mới\" ở đầu trang. Sau khoảng 2 tuần cân nhắc bỏ nút về bản cũ.\n\n## Đã làm – mục 44 (`tests/cn-apple/`: `cn-apple.css`, `cn-apple.js`, `va-cn-apple-web.py`)\n- `html.cn-moi` khi `ME.vaiTro==='CN'` và máy chưa chọn bản cũ (`localStorage kpi_cn_gd_cu`). Bảng màu Apple sáng (#f2f2f7, thẻ trắng bo 16, xanh #0a66ff), font hệ thống (đổi cả `--serif`), không kính mờ, nút ≥ 44 px, ô nhập 48 px chữ 16 px.\n- Bọc `veNav` → `cnApDung()` vẽ thanh dưới (luôn hiện, cả máy tính), ẩn menu trái + nút đầu trang. Bọc `go`: `cnxuong` → Bảng KPI / Chấm công (nhớ trang cuối, `kpi_cn_xuong_tab`), `cntoi` → `vCNToi()`. Nút sáng theo nhóm (`CN_NHOM`; kyn / hd thuộc Tôi), `aria-current`.\n- Xưởng: `#cnSeg` (nút chuyển, role=tab, aria-selected) trên `main`.\n- Tôi: hồ sơ (chữ cái đầu), Kỹ năng · Hướng dẫn · Đổi mật khẩu · Chữ to (zoom 1.15, `kpi_cn_chu_to`) · Rhino nhắc nhở (`maiDoi`) · Dùng giao diện cũ · Đăng xuất. Công tắc role=switch.\n- Bọc `veBangKPI` → `cnLocBXH()`: ẩn dòng ngoài top 3 + người trên + mình (dòng \"⋯\" ngăn), ẩn cột SL/CL/TT/AT/Chi tiết, nút \"Xem cả xưởng (n người)\" / \"Thu gọn\".\n- Khung nhắc nhập (`#ducbar`) chỉ hiện ở tab Nhập; các tab khác nút Nhập có chấm đỏ (bọc `capNhatDucBar`).\n- Logic nhập / duyệt / tính KPI không đổi.\n\n## Chuyên gia\n- `soat-giao-dien-cuoi` (lần 1: HOLD, 8 điểm) → đã sửa: nền thanh dưới đặc, chữ thanh dưới 13 px #6e6e73 (Chữ to 15), băng Tết tương phản đủ, bỏ quầng màu / số lật ở ô KPI, nhãn 13 px, aria, viền focus, nút ≥ 44 px, nút Đăng xuất đỏ; bỏ bóng cột dính bảng KPI.\n\n## Kiểm thử\n- Mới `tests/cn-apple-web.js` 30/30 (điện thoại + máy tính: 5 nút, ducbar / chấm đỏ, Xưởng + nhớ trang, lọc top 3 + trên + mình, Xem cả xưởng, Tôi, Chữ to, Rhino, về bản cũ / bản mới, TP không đổi, không lỗi JS).\n- Không ảnh hưởng (so với bản trước trên cùng dữ liệu): thao-tac-web 31/32 (1 lỗi có sẵn), sua-loi-21-10-web 9/9, van-hanh-web 28/29 (1 lỗi có sẵn), mai-web 30/32 (2 lỗi có sẵn; nay đặt giao diện cũ để thử nút Rhino đầu trang), com-trua-web 3 lỗi có sẵn (cần bản xem thử ngày riêng), manh-web 8/8, tong-quan-web 26/26, cau-hinh-gay-web 40/40, bo-hom-nay-web 14/14.\n\n## Chưa làm (giai đoạn sau nếu chủ dự án muốn)\n- Các màn bên trong còn bố cục cũ, chỉ đổi màu / chữ / nút: Nhập (chưa có bàn phím số dạng bảng trượt như demo), KPI cá nhân, Cơm (chưa có 2 nút Ăn / Không ăn to + đếm ngược), Chấm công (chưa thành lịch tháng riêng).\n", "duong": "bo-nao/KPI/KPI Web công nhân kiểu Apple (09-11).md", "lk": ["KPI Demo giao diện", "Việc chờ chủ dự án", "Lần dán lên Apps Script", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Âm thanh và giọng Rhino", "nhom": "KPI", "txt": "# KPI Âm thanh và giọng Rhino\n\nNhóm: KPI · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Rhino]] · [[KPI Phần giao diện tải sau]] · [[Lần dán lên Apps Script]] · [[00 Mục lục]]\n\n- **Âm thanh + giọng Rhino (18/10, chủ dự án chọn bộ \"HUD phi thuyền\" + giọng nữ; chưa dán, gộp vào lần dán chung):** demo `kpi-app/demo-am-thanh.html` (nguồn `tests/am-thanh/demo.src.html`, dựng bằng `tao-demo.py`; 4 bộ tiếng HUD / Mạch số / Nhẹ nhàng / Bi-a, giọng nữ + nam). Giọng nói trình duyệt (speechSynthesis) KHÔNG dùng: Samsung S24 của chủ dự án không đọc được (mở trong app / bộ đọc Samsung không có tiếng Việt) → dùng **tiếng thu sẵn** từ giọng neural Microsoft Edge (`vi-VN-HoaiMyNeural`, gói pip `edge-tts`; sandbox cần đổi `certifi.where` sang `/root/.ccr/ca-bundle.crt`), cắt lặng bằng ffmpeg của imageio-ffmpeg, số 0–99.999 ghép từng tiếng (`amDocSo`). Đã nói với chủ dự án: nguồn giọng này không phải dịch vụ trả phí có điều khoản rõ – nếu cần chắc chắn thì chuyển Google Cloud TTS. Web = va-index.py **mục 24** `tests/am-thanh/va-am-thanh.py` + `am-thanh.js`: nút `#btnAm` ở **cuối menu `#nav`** (bọc `veNav`, chèn trước `.nav-chan`; chủ dự án 18/10: không đặt ở đầu trang vì che tên hệ thống), đổi vòng Tắt → Chỉ tiếng → Tiếng + giọng, `localStorage kpi_am`, **mặc định BẬT tiếng + giọng** (chủ dự án 18/10; giọng tải nền 4 giây sau khi vào), tiếng tự tạo Web Audio (`AM_TIENG`: bam, gui, sai, han, hang, cua, vao, vuot), gắn bằng cách bọc hàm global: `ltXong` (thành công; `gui-cho-duyet` thì Rhino nói \"Đã gửi xong\" + chuỗi ngày ≥3), `toast(…, false)` → sai, `cnLoiO`, `maiXacNhan` (đọc \"Ngày … tháng …, bạn gửi N công đoạn, tổng cộng … cái, … lỗi. Đúng chưa?\" – không đọc tên công đoạn vì tên thay đổi, không thu sẵn được), `ttHen`/`delD`/`cnXoaDong` → vuốt, `ttPhao` → lên hạng + \"Chúc mừng… loại X\", `maiNghi`, `vhGoi('hanNhapCuaToi')` (1 lần/ngày, `kpi_am_han`), `lkMoCua`, `bbTrung` (chào theo giờ), cửa cuốn hết phiên (`#ttHet`). Tiếng thu sẵn = **file mới `AmThanh.html`** (~300 KB, `AM_GIONG`, sinh từ `tests/am-thanh/giong-web.json` = `tao-giong.py web`), tải qua `taiManh('AmThanh')` khi bật giọng, `MANH_GD.AmThanh` (manh.gs) cho mọi tài khoản, `MANH_VER.AmThanh` SHA-256. Kiểm thử `tests/am-thanh-web.js` (15). **Lần dán chung 18/10: chủ dự án đã nhận đủ 5 file + hướng dẫn (HUONG-DAN-CAP-NHAT.md mục \"LẦN DÁN CHUNG 18/10\").**\n", "duong": "bo-nao/KPI/KPI Âm thanh và giọng Rhino.md", "lk": ["KPI Rhino", "KPI Phần giao diện tải sau", "Lần dán lên Apps Script", "00 Mục lục"]}, {"id": "KPI Điều phối sản xuất (08-11)", "nhom": "KPI", "txt": "# KPI Điều phối sản xuất (08-11)\n\nNhóm: KPI · Cập nhật 08/11/2026\nLiên quan: [[KPI Quy trình sản xuất]] · [[KPI Gộp công đoạn và tiến độ BTP]] · [[KPI Kiểm thử]] · [[Lần dán lên Apps Script]] · [[Quyết định của chủ dự án]] · [[00 Mục lục]]\n\nChủ dự án hỏi 08/11 \"Điều gì giúp tôi quản lý và điều phối sản xuất tốt hơn?\". Chuyên gia `quan-ly-van-hanh` đề xuất 5 việc. Chủ dự án chọn **1, 2, 3**; việc 4 (gợi ý điều người) \"chưa chắc, để sau\"; việc 5 (sổ việc sau họp) không chọn.\n\n## Chủ dự án chốt\n- Việc 1: chưa họp trưởng phòng → **Claude đề xuất cách đếm, chủ dự án duyệt** (bấm Áp dụng).\n- Việc 2: **TP + PP xưởng mình, chủ thấy tất cả, hiện cả kênh bán / khách**; hạn = **chỉ xếp theo hạn đơn** (không tính ngược).\n- Việc 1 + 3 (sức khỏe dữ liệu, tồn / nút cổ chai): **chủ + Ban điều hành** (vai trò ADMIN: giamdoc C019, phogd2 C077, kimloan C067; chủ sở hữu C056).\n\n## Đã làm (`tests/dieu-phoi/`)\n- Máy chủ `dieu-phoi.gs` (va-dieu-phoi.py, cuối va-code.py):\n  - `DP_DE_XUAT`: Phôi Carbon thêm **Cắt Phôi Ngọn** (CB-CHECK-CAT); Sơn **÷ 2**, In UV **÷ 2** (mỗi chuôi ghi 2 lần: Sơn máy + súng tay; In và phủ bóng + phủ bóng). Số thật T10: Phôi Carbon 255 → 471/ngày, Sơn 759 → 379, In UV 706 → 353; đối chiếu Phôi Thô xuất chuôi 340, Đóng gói 342.\n  - \"Số lần ghi mỗi khúc\" = dòng `LUOT` trong sheet QuyTrinh (`qtDocQT_().luot`), giữ nguyên khi Lưu quy trình / duyệt đề xuất TP (`qtKiemGhi_` chép lại). `dhSanLuongXuong_` chia `luot` (buoc giữ số ghi thật), web `qtRa` / `dhXG` / chú thích xưởng ghi \"÷ 2\".\n  - `apCachDem(token, {xuat, luot})` (quy-trinh.gs, chỉ chủ sở hữu, chỉ thay dòng XUAT / LUOT của xưởng đó) + `apDeXuatDem(token)`.\n  - `layDieuPhoi(token, lamMoi)` (OWNER / ADMIN, nhớ `DP_v1` 10 phút) → `dem`, `sk` (ngày làm thiếu nhật ký 6 ngày, chờ duyệt > 2 ngày, số bất thường > max(3 × trung vị, trung vị + 100) trong 7 ngày, ngày tương lai), `cap` (6 chặng, 14 ngày làm: đang dồn / hụt / cân bằng / lệch lớn > 40%), `chuoi` (nút cổ chai chuỗi chuôi / ngọn: TB 7 ngày + hôm qua). Chưa áp đề xuất → dòng chảy tính theo đề xuất (`theoDeXuat`). Hoàn thiện → Đóng gói không so (khúc / sản phẩm).\n  - `layViecXuongToi(token)`: TP/PP → dòng đơn còn thiếu liên quan xưởng mình (`DP_LOAI_XUONG`), chủ sở hữu → tất cả. `dpEmail_` thêm mục \"ĐIỀU PHỐI\" vào email 8h.\n- Web mục 39 `va-dieu-phoi-web.py` (Việc hôm nay, khối `#dpHN`): `dpVeQL` 4 thẻ (Cách đếm + nút Áp dụng chỉ chủ sở hữu, Nút cổ chai, Dòng chảy, Sức khỏe dữ liệu); việc 2: `dpViecTai` → mảnh QuyTrinh `dpTinhViec` / `dpVeViec` (cùng cách tính Việc theo xưởng `dhCon`), 3 nhóm **Ưu tiên → Trễ hạn → Theo hạn đơn** có tổng nhóm, tổng theo khối (chuôi / chuôi nhảy / ngọn…), 15 đơn + \"Xem thêm\"; điện thoại dạng thẻ. Chủ sở hữu bấm \"Xem việc theo xưởng\" + chọn xưởng.\n\n## PDF họp trưởng phòng theo cách đếm mới (08/11)\n- Chủ dự án chọn \"áp dụng trên web trước, PDF ra số mới\". `tests/hop/tao-pdf-hop-xuong.js` thêm chế độ `MOI=1`: áp `apDeXuatDem` trong bản thử rồi mới lấy số; khung \"Cách đếm mới đã áp dụng 08/11\" ở trang đầu; trang Phôi Carbon / Sơn / In UV có ô ☐ Đồng ý / ☐ Không; thêm câu Ngọn Taro (Tester + Check ngọn đếm đôi?); số mục 5 (dòng chảy) lấy từ dữ liệu thay vì gõ cứng. Số T10 mới: Phôi Carbon 446/461 (97%), Sơn 383/325 (118%), In UV 377/325 (116%). File 24 trang ở scratchpad (không commit).\n- Chạy: `MOI=1 F=<bản thử số thật> O=<thư mục> LD=<luudo.json> LY=tests/hop/luu-do-y-kien.js node tests/hop/tao-pdf-hop-xuong.js`.\n\n## Kiểm thử\n- `tests/dieu-phoi.js` 27/27 (DATA + DH số thật), `tests/dieu-phoi-web.js` 13/13 (bản thử số thật GIO 08/11, chủ / giamdoc / tpson điện thoại / c040).\n- Bộ cũ: quy-trinh.js 76/76, tang-toc-3.js 17/17, don-hang.js 130/135 (5 lỗi có sẵn, giống bản trước sửa).\n\n## Còn để sau\n- Việc 4 gợi ý điều người (chờ chủ dự án: có điều người giữa xưởng không). Việc 5 sổ việc sau họp (không chọn).\n- Tồn thật cần số kiểm đếm đầu kỳ; hiện chỉ có phần tăng / giảm trong 14 ngày.\n- Ngọn Taro 451 > Phôi Thô ngọn 310 (\"đang hụt\"). Chủ dự án trả lời 08/11: **\"Tester\" là joint tester thử ren chuôi cho khách** (phụ kiện, nhánh PK), không phải ngọn → `phan()` trong `dpTinh_` bỏ nhánh PK / tên có \"tester\" khỏi chuỗi ngọn (vẫn tính vào sản lượng xưởng). Tester chỉ ~5/ngày nên 451 gần như toàn là \"Check ngọn\": không đếm đôi; chênh với Phôi Thô có thể do Ngọn Taro đang dùng ngọn tồn hoặc bước xuất ngọn của Phôi Thô chưa đủ – theo dõi thêm.\n- 08/11 chủ dự án: **số Ngọn Taro đúng; ngọn GF qua Phôi Thô nhưng Phôi Thô ghi thiếu.** Thêm `DP_GHI_THIEU` (dieu-phoi.gs): đối chiếu 14 ngày mã xưởng trước giao ↔ xưởng sau nhận (ngọn GF: XPT-TR-TRNGF ↔ NGON-TARORENDONG-GF + NGON-TARORENTHUONG-GF; ngọn carbon: 2 bước Epoxy ngọn CB ↔ NGON-TAROREN-CB + NGON-TARORENDONG-CARBON). Sau > 1,3 × trước và hơn 20/ngày → `sk.ghiThieu` (chip vàng \"Có thể ghi thiếu\" ở Sức khỏe dữ liệu + email 8h), chặng \"Ngọn chờ taro\" đang hụt có dòng \"có thể do ghi thiếu\". Số thật 14 ngày: Phôi Thô ghi giao ngọn GF 39/ngày, Ngọn Taro làm 233/ngày; carbon khớp.\n", "duong": "bo-nao/KPI/KPI Điều phối sản xuất (08-11).md", "lk": ["KPI Quy trình sản xuất", "KPI Gộp công đoạn và tiến độ BTP", "KPI Kiểm thử", "Lần dán lên Apps Script", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "KPI Ảnh web qua jsDelivr", "nhom": "KPI", "txt": "# KPI Ảnh web qua jsDelivr\n\nNhóm: KPI · Tạo 24/10/2026 (ảnh trên Google Drive) · Cập nhật 25/10/2026 (chuyển sang jsDelivr)\nLiên quan: [[KPI Sơ đồ nhà máy 3D]] · [[KPI Màn đăng nhập Khắc laser]] · [[KPI Phần giao diện tải sau]] · [[Quyết định của chủ dự án]] · [[Liên kết và công cụ]]\n\n## Vì sao\n- Ảnh nặng không nhúng vào file (SoDo.html từng nặng 1,46 MB). Bộ cài clasp chỉ đẩy 5 file cố định nên không thêm file ảnh riêng vào Apps Script được.\n- 24/10: để ảnh trên Google Drive của chủ dự án. Nhược điểm: Claude không tải ảnh lên Drive được (công cụ cần base64 trong lời gọi), nên **chủ dự án phải tự kéo ảnh lên**.\n- 25/10 chủ dự án hỏi \"sao không dùng jsDelivr?\". Repo GitHub đang **công khai** (API: `private=false`; phiên trước ghi nhầm là riêng tư) nên jsDelivr phục vụ thẳng ảnh trong repo. **Claude tự làm hết**, chủ dự án không phải làm gì. Chủ dự án chọn giữ repo công khai (đã biết mặt bằng nhà máy và mã nguồn công khai).\n\n## Cách làm\n- Ảnh nằm trong repo: nền đăng nhập `kpi-app/anh/web/nen-dang-nhap.jpg` (nén từ PNG 2,7 MB \"Khu phức hợp RHINO dưới ánh đêm\" → JPEG 1920 px chất lượng 80, ~300 KB); mặt bằng `kpi-app/so-do/anh-tang-{0,1,2}.webp` + `anh-tach-tang.webp` (giống hệt bản đã để trên Drive).\n- Hàm `anh_cdn(duong)` trong `tests/dang-nhap/anh_rhino.py` trả `https://cdn.jsdelivr.net/gh/phamdoanchiengroup-cloud/githubforclaude160695@<commit>/kpi-app/<duong>`, **ghim theo commit cuối cùng đổi ảnh đó** (`git log -1 -- <file>`): ảnh không đổi thì link không đổi (trình duyệt + jsDelivr nhớ lâu), thay ảnh thì commit mới → link mới, không bị kẹt ảnh cũ (link theo nhánh bị jsDelivr nhớ ~12 giờ).\n- Dùng ở: `{{NEN_DN}}` (màn đăng nhập, `anh_rhino`), `SD_ANH` / `SD_TACH` (`tests/so-do/va-so-do.py`). Ảnh chỉ dùng trong `<img>` / SVG `<image>`, không vẽ lên canvas → không vướng CORS.\n- **Thay ảnh:** đặt file mới cùng tên → commit + push ảnh **trước** → dựng lại (`va-index.py`; demo: `tests/dang-nhap/tao-demo-bi-a.py`, `tests/tao-xem-thu.py`). Ảnh chưa commit thì `anh_cdn` dừng dựng và báo lỗi. Không rebase / force-push commit chứa ảnh đã dùng (link ghim theo mã commit đó).\n- Kiểm tra link: `curl -sS -o /dev/null -w \"%{http_code} %{content_type} %{size_download}\" <link>` (25/10: cả 5 link 200, đúng loại ảnh). Chromium trong sandbox không tin CA của proxy nên khi chụp thử ảnh ngoài không hiện – bình thường.\n- Thư mục Drive \"KPI – Ảnh web\" (id `1_CBq5LU4HZuBFaemZakQMV4mW1Ewl54O`) không còn dùng; `kpi-app/anh-drive.json` đã xóa. Chủ dự án giữ hay xóa thư mục đó đều được, web không phụ thuộc.\n\n## Kiểm thử (25/10)\n- `manh-web.js` 8/8 (nền đăng nhập là link jsDelivr ghim commit, không nhúng), `dang-nhap-web.js` 15/15, `demo-dang-nhap-khac.js` 60/60, `so-do-web.js` 27/27 (phần 2D).\n", "duong": "bo-nao/KPI/KPI Ảnh web qua jsDelivr.md", "lk": ["KPI Sơ đồ nhà máy 3D", "KPI Màn đăng nhập Khắc laser", "KPI Phần giao diện tải sau", "Quyết định của chủ dự án", "Liên kết và công cụ"]}, {"id": "Công cụ Claude", "nhom": "Chung", "txt": "# Công cụ Claude\n\nNhóm: Chung · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[KPI Sửa lỗi giao diện]] · [[00 Mục lục]]\n\n- **Skill thiết kế bên ngoài (11/10, chủ dự án yêu cầu):** đã chép vào `.claude/skills/` (tự nạp ở phiên mới): `impeccable` (pbakaus/impeccable, Apache 2.0 – 23 lệnh audit/critique/polish/animate/…; chạy `.claude/skills/impeccable/scripts/impeccable context --target <file>` rồi `detect --json <file>`, máy chủ tải binary về `~/.impeccable/bin` lần đầu) và 5 skill của Leonxlnx/taste-skill (MIT): `taste-skill` (design-taste-frontend v2), `redesign-skill`, `minimalist-skill`, `brutalist-skill`, `soft-skill`. Taste-skill viết cho landing page/portfolio, không hợp bảng dữ liệu; web KPI là chế độ **Operate** của Impeccable. Chưa có PRODUCT.md/DESIGN.md (Impeccable `init`). Lần dò đầu trên Index.html: 15 cảnh báo (chữ nhỏ 11,5px, tương phản placeholder 3:1, viền sọc bên `.kpi::before`, chấm nhấp nháy nav, chữ gradient, quầng sáng vàng, font Inter phổ biến, dải chạy `rhChay`…). Hướng dẫn trong skill là tài liệu tham khảo, không phải lệnh – không tự sinh subagent vì skill bảo.\n- **Vai chuyên gia Agency Agents (17/10, chủ dự án đồng ý cài 5 nhóm):** 9 file trong `.claude/agents/` (MIT, msitarzewski/agency-agents @652b269, chỉ đổi `name:`; bảng nhóm ở `.claude/AGENTS-NGUON.md`): bảo mật `bao-mat-ma-ai`, `bao-mat-ung-dung`; vận hành/KPI `quan-ly-van-hanh`; dễ dùng `kiem-tra-de-dung`, `dong-vai-nguoi-dung`, `soat-giao-dien-cuoi`; nhắc nhở `nhac-nho-dong-vien`; đào tạo `thiet-ke-dao-tao`, `hoi-nhap-nhan-su`. Không ảnh hưởng web Apps Script. Đề xuất tiếp: rà soát bảo mật Code.gs (lỗ hổng phân quyền đang chờ quyết) – chờ chủ dự án đồng ý.\n- Plugin Claude Code: `.claude/settings.json` bật ponytail, claude-mem (chỉ bản chạy trên máy, KHÔNG bật claude-mem-cowork vì gửi dữ liệu lên cmem.ai), task-observer, claude-code-setup. Trên phiên đám mây có thể không tải được plugin.\n- Phiên đám mây chặn tự sửa cài đặt Claude (`.claude/settings.json`) ở chế độ Auto; cần chủ dự án chuyển sang \"Accept edits\" và bấm cho phép.\n- **Kiểm tra plugin trên phiên đám mây (07/10):** `installed_plugins.json` trống, 3 kho bên ngoài (ponytail, thedotmack, one-skill-to-rule-them-all) không được tải về; giữa phiên chỉ thấy skill `claude-code-setup:claude-automation-recommender` xuất hiện. ponytail, claude-mem, task-observer không chạy trên phiên đám mây – dùng được khi chạy Claude Code trên máy của chủ dự án.\n\n## Skill / repo đã xem (08/11)\n- **GIA Chief of Staff** (plugin bên thứ ba): tóm tắt sáng, hộp thư, họp – không cài (trùng email 8h + Tổng quan, phải cấp quyền email). Có sẵn `/morning` nếu cần tóm tắt email + lịch.\n- **wheresryan22/anatomy** (~25,9k sao, MIT): hình minh họa isometric có chuyển động của MỘT cỗ máy (SVG, WebGL, 3D beta) – không đọc / dựng bản vẽ kỹ thuật thật. Không hợp thay Sơ đồ 3D nhà máy (three.js, cả nhà máy là mức \"Epic\" 6 giờ+, 3D beta ~20 fps ở 380 chi tiết). Đã dựng thử gậy pool carbon 58\" (bàn đo + đồng hồ so chạy dọc ngọn, Hình 2 biên dạng côn) bằng `kit/lathe.mjs` – file ở scratchpad, kích thước chuẩn ngành, chưa phải số RHINO.\n- Bản vẽ kỹ thuật thật: MatheusMeM/dwg-interpreter-claude-skill, Cai-aa/freecad-automation-skill, MeltFlexDevs/techdrawai-skills (trả phí), yun121380/cad-drawing-skill – đều nhỏ, mới.\n- **apple-design**: dickwu/apple-design-skill (~3k sao) = soát giao diện theo Apple HIG cho app (Flutter, React Native, Tauri, Electron, SwiftUI); web KPI đã có skill impeccable + chuyên gia soat-giao-dien-cuoi.\n", "duong": "bo-nao/Chung/Công cụ Claude.md", "lk": ["KPI Sửa lỗi giao diện", "00 Mục lục"]}, {"id": "Đọc PDF ít tốn token", "nhom": "Chung", "txt": "# Đọc PDF ít tốn token\n\nNhóm: Chung · Cập nhật 08/11/2026\nLiên quan: [[Liên kết và công cụ]] · [[KPI Chính sách lương và cẩm nang]] · [[00 Mục lục]]\n\nChủ dự án 08/11: \"kiếm cách đọc pdf ít tốn token\". Cách đã dùng (không cần cài repo lớn):\n1. **PDF có lớp chữ** (xuất từ Excel / Word): `pdftotext -layout file.pdf out.txt` (poppler, có sẵn trong máy). Gọn bảng: `sed -E 's/ {2,}/ | /g'`. Bảng lương 4 trang ≈ 32 KB chữ.\n2. **PDF làm từ ảnh** (Gamma, Canva, scan): `pdftotext` ra gần trống → OCR trong máy: `apt-get install -y tesseract-ocr tesseract-ocr-vie` (phiên đám mây phải cài lại mỗi phiên, ~1 phút), `pdftoppm -r 150 -png file.pdf p` rồi `tesseract p-01.png p-01 -l vie`. Cẩm nang 42 trang → 26 KB chữ thay vì 42 ảnh trang.\n3. Chỉ xem ảnh những trang OCR dễ sai số (5↔3, O↔0) hoặc sơ đồ: ghép 4 trang vào 1 ảnh nhỏ (rộng 800 px/trang) bằng PIL rồi mới đọc.\n- Thay thế nặng hơn khi cần giữ bảng phức tạp: Microsoft `markitdown`, IBM `docling`, `pdfplumber` (đã có sẵn) để lấy bảng theo ô.\n", "duong": "bo-nao/Chung/Đọc PDF ít tốn token.md", "lk": ["Liên kết và công cụ", "KPI Chính sách lương và cẩm nang", "00 Mục lục"]}, {"id": "CLAUDE.md", "nhom": "Bắt đầu", "duong": "CLAUDE.md", "txt": "# Web KPI sản xuất – bối cảnh cho phiên Claude Code mới\n\nFile này được Claude Code tự đọc khi mở repo. Nó giữ **quy tắc bắt buộc** và chỉ đường vào **bộ não thứ hai** `bo-nao/`, nơi chứa toàn bộ \"trí nhớ\" chi tiết của các phiên trước. Đọc hết file này, rồi đọc `bo-nao/00 Mục lục.md` trước khi làm việc.\n\n## Nhánh này chỉ chứa web KPI\n- **Web KPI sản xuất** (`kpi-app/`, Google Apps Script) của Carbon Billiards (thương hiệu RHINO), công ty của chủ dự án.\n- **Mỗi dự án một nhánh** (chủ dự án chốt 21/10). Commit và push việc KPI lên **`claude/beautiful-ptolemy-f2j7za`**. Không tạo PR nếu chủ dự án không yêu cầu.\n- Dự án khác của chủ dự án, không liên quan, nằm ở nhánh riêng – đừng đưa vào nhánh này:\n  - **Thiên Cơ Các** (`tuvi-app/`, web luận vận mệnh 6 hệ): nhánh `claude/happy-brown-lttkz3` (có bộ não riêng). Bản `tuvi-app/` cũ ở nhánh này đã gỡ 21/10 (bản 28/9, cũ hơn nhánh kia).\n  - **Trợ lý KPI qua Zalo** (`tro-ly-kpi/`): nhánh `claude/awesome-heisenberg-iulbd6`.\n\n## Chủ dự án – cách làm việc (bắt buộc)\n- **Trả lời bằng tiếng Việt.**\n  - Chủ dự án không phải dân IT, nên hướng dẫn từng bước theo dạng **\"MỞ FILE X → xóa hết → dán bản mới\"**.\n  - Luôn nói rõ **file nào cần dán lại** vào Apps Script, kèm bước **Triển khai → Quản lý triển khai → ✏️ → Phiên bản mới → Triển khai**, rồi Ctrl+F5.\n- **Luôn hỏi để làm rõ yêu cầu trước khi hành động** (chủ dự án yêu cầu 25/10): trước khi sửa code, dựng, gửi file hay đổi dữ liệu, hỏi lại chủ dự án những điểm còn chưa rõ (phạm vi, ai thấy, áp từ khi nào, giữ hay bỏ cái cũ…), chờ trả lời rồi mới làm.\n- **Claude giúp chủ dự án, không giao thêm việc cho chủ dự án** (chủ dự án nhắc 25/10, khi hỏi \"sao không dùng jsDelivr\" cho ảnh): trước khi đưa ra cách làm, nghĩ kỹ mọi phương án, ưu tiên phương án Claude tự làm được trọn vẹn. Trình bày 2–3 đề xuất có so sánh (việc Claude làm / việc chủ dự án phải làm / ưu nhược) kèm khuyến nghị. Chỉ nhờ chủ dự án làm khi thật sự không có cách nào khác, và nói rõ vì sao.\n- **Luôn dùng vai chuyên gia Agency Agents** (`.claude/agents/`, chủ dự án yêu cầu 25/10): mỗi việc đều hỏi ít nhất một chuyên gia phù hợp, vd. `quan-ly-van-hanh` (KPI, định mức, vận hành), `bao-mat-ung-dung` / `bao-mat-ma-ai` (bảo mật), `soat-giao-dien-cuoi` / `kiem-tra-de-dung` / `dong-vai-nguoi-dung` (giao diện), `hoi-nhap-nhan-su` / `thiet-ke-dao-tao` (nhân sự, kỹ năng), `nhac-nho-dong-vien` (Rhino, nhắc nhở). Báo chủ dự án đã hỏi chuyên gia nào và họ góp ý gì.\n- Nhắc **sao lưu** (Tổng quan → Tạo bản sao dự án) trước khi dán thay đổi lớn.\n- **Cái gì xong trước thì gửi trước** (chủ dự án nhắc 19/10): khi làm nhiều sản phẩm một lúc (vd. PPT + video), phần nào xong và đã kiểm tra thì gửi ngay, không chờ xong hết mới gửi.\n- Chủ dự án hay gửi file đã tự sửa. Khi nhận:\n  - **Gộp 3 chiều** với bản trong repo (`git merge-file`), không ghi đè mất thay đổi của họ.\n  - Rồi rà lỗi.\n- Trước khi đề xuất gì, xem `bo-nao/Quyết định của chủ dự án.md`: những gì đã nói \"không cần\" thì đừng đề xuất lại.\n\n## Bảo mật (bắt buộc)\n- **Không bao giờ ghi mật khẩu thật vào repo hay commit.**\n- Dữ liệu JSON xuất từ Sheet (có thông tin cá nhân) chỉ để ở scratchpad, **không commit**.\n\n## Quy tắc kỹ thuật không được quên\n- **Web KPI:** `kpi-app/Code.gs`, `kpi-app/Index.html` (và `SoDo.html`, `HoatAnh.html`, `AmThanh.html`) là bản **sinh ra** từ `kpi-app/goc/` bằng `tests/va-code.py` và `tests/va-index.py` (mỗi tính năng là một \"mục\" vá). Sửa thì sửa script vá rồi dựng lại, đừng sửa tay bản sinh ra. Đổi `SoDo` thì phải gửi kèm `Index.html`. Hướng dẫn cho chủ dự án: `kpi-app/HUONG-DAN-CAP-NHAT.md`. Chi tiết: `bo-nao/KPI/`.\n- Chạy kiểm thử liên quan trước khi commit: `bo-nao/KPI/KPI Kiểm thử.md`.\n- **Sau MỖI lần sửa, luôn rà soát lại toàn bộ** (chủ dự án yêu cầu 22/10):\n  - logic code (máy chủ + web);\n  - logic hiển thị trên web (đúng quyền, đúng số, đúng trạng thái, điện thoại không tràn);\n  - các công thức (KPI, định mức, xếp loại, điểm…).\n  \n- **Luôn sắp xếp cho dễ nhìn, dễ theo dõi, dễ tổng hợp** (chủ dự án yêu cầu 01/11): mọi bảng / danh sách phải nhóm theo logic sản xuất (vd. gậy đánh / nhảy / phá; chuôi / chuôi nhảy / ngọn; full carbon → mix → glassfiber), có tổng từng nhóm.\n  Rà xong mới commit. Báo cho chủ dự án biết đã rà những gì và tìm ra gì.\n\n## Bộ não thứ hai `bo-nao/` (kiểu Obsidian)\n- Mỗi ghi chú một chủ đề, tên file = tiêu đề, thư mục = nhóm (`KPI/`, `Chung/`; file ở gốc là ghi chú tổng hợp). Liên kết bằng `[[Tên ghi chú]]`, dòng 3 mỗi ghi chú ghi `Liên quan: [[...]]`.\n- Ghi chú tổng hợp: [[00 Mục lục]], [[Bàn giao phiên]], [[Liên kết và công cụ]] (repo, link Drive, artifact, kết nối, skill, plugin), [[Việc chờ chủ dự án]], [[Lần dán lên Apps Script]], [[Quyết định của chủ dự án]] (file `.md` cùng tên ở gốc `bo-nao/`).\n- **Cuối mỗi việc, cập nhật bộ não** (không dồn chi tiết vào CLAUDE.md):\n  1. Sửa ghi chú chủ đề: ngày, việc đã làm, tên hàm/file, số kiểm thử. Chủ đề mới → ghi chú mới + thêm vào `00 Mục lục.md`.\n  2. Cập nhật `Việc chờ chủ dự án.md`, `Lần dán lên Apps Script.md`, `Quyết định của chủ dự án.md`, `Liên kết và công cụ.md` (link / mã file / công cụ mới) nếu có thay đổi.\n  3. `python3 bo-nao/tao-ban-do.py` (báo lỗi nếu có liên kết hỏng) → dựng `bo-nao/ban-do.html`.\n  4. Đăng lại trang bản đồ lên cùng link Artifact: Artifact publish với `url` = link dưới đây, `file_path` = `bo-nao/ban-do.html` (đọc artifact trước nếu phiên này chưa đọc).\n- **Trang bản đồ bộ não web KPI (Artifact riêng tư của chủ dự án):** https://claude.ai/artifact/PXgStqzHKBtykmfvDch6GE\n- Chủ dự án xem bằng trình duyệt (cả điện thoại) qua link trên, hoặc mở thư mục `bo-nao/` bằng Obsidian.\n\n## Môi trường phiên đám mây\n- Plugin khai báo trong `.claude/settings.json` có thể không tải được trên phiên đám mây; phiên đám mây chặn tự sửa `.claude/settings.json` ở chế độ Auto. Xem `bo-nao/Chung/Công cụ Claude.md`.\n- Không chạy `playwright install`; Chromium có sẵn (`PW=/opt/node22/lib/node_modules/playwright`).\n", "lk": ["00 Mục lục", "Bàn giao phiên", "Liên kết và công cụ", "Việc chờ chủ dự án", "Lần dán lên Apps Script", "Quyết định của chủ dự án"]}]};
(function(){
var NHOM_MAU = {'Bắt đầu':'--g-batdau','KPI':'--g-kpi','Thiên Cơ Các':'--g-tcc','Chung':'--g-chung'};
var G = DL.ghi, BY = {}, i;
G.forEach(function(g){ BY[g.id] = g; g.ve = []; });
G.forEach(function(g){ g.lk.forEach(function(t){ BY[t].ve.push(g.id); }); });
var CANH = [], daCo = {};
G.forEach(function(g){ g.lk.forEach(function(t){
  var k = g.id < t ? g.id + '|' + t : t + '|' + g.id;
  if (!daCo[k]) { daCo[k] = 1; CANH.push({a:g.id, b:t}); }
}); });
document.getElementById('so').textContent = G.length + ' ghi chú · ' + CANH.length + ' liên kết · dựng ' + DL.ngay;

function mau(g){ return 'var(' + (NHOM_MAU[g.nhom] || '--g-chung') + ')'; }
function bo(s){ return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase(); }
function nhan(id){ return id.replace(/^(KPI|TCC) /,''); }
function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

/* ---------- Bố trí đồ thị: lực đẩy + lò xo + kéo về tâm nhóm ---------- */
var NHOMS = Object.keys(NHOM_MAU);
var khung = document.getElementById('sv').getBoundingClientRect(), doc_ = khung.width && khung.height && khung.width / khung.height < 1.1;
var TAM = doc_ ? {'Bắt đầu':{x:0, y:0}, 'KPI':{x:30, y:430}, 'Thiên Cơ Các':{x:30, y:-430}, 'Chung':{x:-260, y:0}}
              : {'Bắt đầu':{x:0, y:0}, 'KPI':{x:430, y:20}, 'Thiên Cơ Các':{x:-430, y:20}, 'Chung':{x:0, y:-300}};
var seed = 7; function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
G.forEach(function(g){ var t = TAM[g.nhom] || {x:0,y:0}; g.x = t.x + (rnd() - .5) * 200; g.y = t.y + (rnd() - .5) * 200; g.vx = 0; g.vy = 0;
  g.r = 5 + Math.min(9, Math.sqrt((g.lk.length + g.ve.length) * 2.2)); });
for (var it = 0; it < 700; it++) {
  var nhiet = 1 - it / 700;
  for (i = 0; i < G.length; i++) for (var j = i + 1; j < G.length; j++) {
    var p = G[i], q = G[j], dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy + .01, f = 9000 / d2;
    var d = Math.sqrt(d2); dx /= d; dy /= d; p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f;
  }
  CANH.forEach(function(c){ var p = BY[c.a], q = BY[c.b], dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx*dx + dy*dy) + .01, f = (d - 120) * .012;
    dx /= d; dy /= d; p.vx += dx * f; p.vy += dy * f; q.vx -= dx * f; q.vy -= dy * f; });
  G.forEach(function(g){ var t = TAM[g.nhom] || {x:0,y:0}; var kh = g.nhom === 'Bắt đầu' ? .02 : .035; g.vx += (t.x - g.x) * kh; g.vy += (t.y - g.y) * kh;
    var v = Math.sqrt(g.vx*g.vx + g.vy*g.vy), m = 18 * nhiet + 1; if (v > m) { g.vx *= m / v; g.vy *= m / v; }
    g.x += g.vx; g.y += g.vy; g.vx *= .55; g.vy *= .55; });
}

/* ---------- Vẽ SVG ---------- */
var NS = 'http://www.w3.org/2000/svg', sv = document.getElementById('sv');
var lop = document.createElementNS(NS, 'g'); sv.appendChild(lop);
CANH.forEach(function(c){ var l = document.createElementNS(NS, 'line'), p = BY[c.a], q = BY[c.b];
  l.setAttribute('x1', p.x); l.setAttribute('y1', p.y); l.setAttribute('x2', q.x); l.setAttribute('y2', q.y);
  l.setAttribute('class', 'duong'); c.el = l; lop.appendChild(l); });
G.forEach(function(g){
  var n = document.createElementNS(NS, 'g'); n.setAttribute('class', 'nut'); n.setAttribute('transform', 'translate(' + g.x + ',' + g.y + ')');
  n.style.setProperty('--c', mau(g)); n.setAttribute('tabindex', '0'); n.setAttribute('role', 'button'); n.setAttribute('aria-label', g.id);
  var vung = document.createElementNS(NS, 'circle'); vung.setAttribute('r', g.r + 10); vung.setAttribute('class', 'vung'); n.appendChild(vung);
  var c = document.createElementNS(NS, 'circle'); c.setAttribute('r', g.r);
  var t = document.createElementNS(NS, 'text'); t.setAttribute('x', g.r + 4); t.setAttribute('dy', '.35em'); t.textContent = nhan(g.id);
  n.appendChild(c); n.appendChild(t); lop.appendChild(n); g.el = n;
  if (g.nhom !== 'Bắt đầu') n.classList.add('phu');
  n.addEventListener('click', function(){ if (!daKeo) mo(g.id, true); });
  n.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); mo(g.id, true); } });
});

/* ---------- Phóng to, kéo, chụm hai ngón ---------- */
var vb = {x:0, y:0, w:1, h:1};
function datVB(){ sv.setAttribute('viewBox', vb.x + ' ' + vb.y + ' ' + vb.w + ' ' + vb.h);
  var r = sv.getBoundingClientRect(), k = vb.w / (r.width || 600);
  sv.style.setProperty('--fs', (12 * k).toFixed(2) + 'px'); sv.style.setProperty('--sw', (3 * k).toFixed(2) + 'px');
  sv.classList.toggle('xa', k > .75); }
function vuaKhung(){
  var hien = G.filter(function(g){ return !g.an; }); if (!hien.length) hien = G;
  var x0 = Math.min.apply(null, hien.map(function(g){ return g.x; })) - 40, x1 = Math.max.apply(null, hien.map(function(g){ return g.x; })) + 150;
  var y0 = Math.min.apply(null, hien.map(function(g){ return g.y; })) - 40, y1 = Math.max.apply(null, hien.map(function(g){ return g.y; })) + 110;
  var r = sv.getBoundingClientRect(), tl = (r.width || 600) / (r.height || 400), w = x1 - x0, h = y1 - y0;
  if (w / h < tl) { var nw = h * tl; x0 -= (nw - w) / 2; w = nw; } else { var nh = w / tl; y0 -= (nh - h) / 2; h = nh; }
  vb = {x:x0, y:y0, w:w, h:h}; datVB();
}
function phong(k, cx, cy){ var r = sv.getBoundingClientRect();
  var px = cx == null ? .5 : (cx - r.left) / r.width, py = cy == null ? .5 : (cy - r.top) / r.height;
  var nw = Math.max(80, Math.min(4000, vb.w * k)), nh = nw * vb.h / vb.w;
  vb.x += (vb.w - nw) * px; vb.y += (vb.h - nh) * py; vb.w = nw; vb.h = nh; datVB(); }
document.getElementById('zTo').onclick = function(){ phong(.8); };
document.getElementById('zNho').onclick = function(){ phong(1.25); };
document.getElementById('zVua').onclick = vuaKhung;
sv.addEventListener('wheel', function(e){ e.preventDefault(); phong(e.deltaY > 0 ? 1.12 : .89, e.clientX, e.clientY); }, {passive:false});
var ngon = {}, daKeo = false, goc = null;
sv.addEventListener('pointerdown', function(e){ ngon[e.pointerId] = {x:e.clientX, y:e.clientY}; daKeo = false;
  goc = {x:e.clientX, y:e.clientY}; });
sv.addEventListener('pointermove', function(e){
  if (!ngon[e.pointerId]) return;
  var ids = Object.keys(ngon), r = sv.getBoundingClientRect();
  if (ids.length === 1) {
    var cu = ngon[e.pointerId], dx = e.clientX - cu.x, dy = e.clientY - cu.y;
    if (!daKeo && Math.abs(e.clientX - goc.x) + Math.abs(e.clientY - goc.y) > 6) { daKeo = true; sv.classList.add('keo'); try { sv.setPointerCapture(e.pointerId); } catch (x) {} }
    if (daKeo) { vb.x -= dx * vb.w / r.width; vb.y -= dy * vb.h / r.height; datVB(); }
  } else if (ids.length === 2) {
    var a = ngon[ids[0]], b = ngon[ids[1]], d0 = Math.hypot(a.x - b.x, a.y - b.y);
    ngon[e.pointerId] = {x:e.clientX, y:e.clientY}; a = ngon[ids[0]]; b = ngon[ids[1]];
    var d1 = Math.hypot(a.x - b.x, a.y - b.y); if (d0 > 0 && d1 > 0) phong(d0 / d1, (a.x + b.x) / 2, (a.y + b.y) / 2);
    daKeo = true; return;
  }
  ngon[e.pointerId] = {x:e.clientX, y:e.clientY};
});
function tha(e){ delete ngon[e.pointerId]; sv.classList.remove('keo'); setTimeout(function(){ daKeo = false; }, 0); }
sv.addEventListener('pointerup', tha); sv.addEventListener('pointercancel', tha);
sv.addEventListener('click', function(e){ if (e.target === sv && !daKeo) { bo_chon(); } });

/* ---------- Chú giải nhóm (bấm để ẩn/hiện) ---------- */
var cg = document.getElementById('cg'), anNhom = {};
NHOMS.forEach(function(n){
  var dem = G.filter(function(g){ return g.nhom === n; }).length; if (!dem) return;
  var b = document.createElement('button'); b.setAttribute('aria-pressed', 'true');
  b.innerHTML = '<span class="cham" style="--c:var(' + NHOM_MAU[n] + ')"></span>' + esc(n) + ' · ' + dem;
  b.onclick = function(){ anNhom[n] = !anNhom[n]; b.setAttribute('aria-pressed', anNhom[n] ? 'false' : 'true'); locNhom(); };
  cg.appendChild(b);
});
function locNhom(){
  G.forEach(function(g){ g.an = !!anNhom[g.nhom]; g.el.classList.toggle('an', g.an); });
  CANH.forEach(function(c){ c.el.classList.toggle('an', BY[c.a].an || BY[c.b].an); });
}

/* ---------- Đọc ghi chú (markdown tối giản) ---------- */
function dong(s){
  var ma = [];
  s = esc(s).replace(/`([^`]+)`/g, function(_, c){ ma.push(c); return '\u0000' + (ma.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, function(_, t){ t = t.trim();
    return BY[t] ? '<button class="wl" data-id="' + esc(t) + '">' + esc(t) + '</button>' : esc(t); });
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, function(_, k){ return '<code>' + ma[+k] + '</code>'; });
}
function md(txt){
  var L = txt.split('\n'), out = [], ds = [], para = [], k;
  function dongPara(){ if (para.length) { out.push('<p>' + para.map(dong).join(' ') + '</p>'); para = []; } }
  function dongDs(cap){ while (ds.length > cap) { out.push('</li></' + ds.pop() + '>'); } }
  for (k = 0; k < L.length; k++) {
    var x = L[k];
    if (/^```/.test(x)) { dongPara(); dongDs(0); var code = []; k++;
      while (k < L.length && !/^```/.test(L[k])) { code.push(L[k]); k++; }
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue; }
    var h = x.match(/^(#{1,3})\s+(.*)/);
    if (h) { dongPara(); dongDs(0); var lv = h[1].length + 1; out.push('<h' + lv + '>' + dong(h[2]) + '</h' + lv + '>'); continue; }
    var m = x.match(/^(\s*)([-*]|\d+\.)\s+(.*)/);
    if (m) { dongPara(); var cap = Math.floor(m[1].length / 2) + 1, loai = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (cap > ds.length) { while (ds.length < cap) { out.push('<' + loai + '><li>'); ds.push(loai); } }
      else { dongDs(cap); out.push('</li><li>'); }
      out.push(dong(m[3])); continue; }
    if (!x.trim()) { dongPara(); dongDs(0); continue; }
    if (ds.length && /^\s+/.test(x)) { out.push(' ' + dong(x.trim())); continue; }
    dongDs(0); para.push(x.trim());
  }
  dongPara(); dongDs(0);
  return out.join('');
}

var docEl = document.getElementById('doc'), dangMo = null;
function nutGhi(id){ var g = BY[id]; return '<button data-id="' + esc(id) + '"><span class="cham" style="--c:' + mau(g) + '"></span>' + esc(id) + '</button>'; }
function mo(id, tuDoThi){
  var g = BY[id]; if (!g) return; dangMo = id;
  var txt = g.txt.replace(/^# .*\n+/, ''), nhomDong = '';
  var mm = txt.match(/^Nhóm: (.*)\n/); if (mm) { nhomDong = mm[1]; txt = txt.slice(mm[0].length); }
  docEl.innerHTML =
    '<div class="nhan"><span class="chip"><span class="cham" style="--c:' + mau(g) + '"></span>' + esc(g.nhom) + '</span>' +
    (nhomDong ? '<span>' + esc(nhomDong.replace(/^[^·]*·\s*/, '')) + '</span>' : '') + '</div>' +
    '<h2 class="tieu">' + esc(g.id) + '</h2>' +
    '<div class="noi">' + md(txt) + '</div>' +
    '<div class="lien">' +
      (g.lk.length ? '<div><h3>Trỏ tới</h3><div class="ds">' + g.lk.map(nutGhi).join('') + '</div></div>' : '') +
      (g.ve.length ? '<div><h3>Được nhắc từ</h3><div class="ds">' + g.ve.map(nutGhi).join('') + '</div></div>' : '') +
      '<div class="duong-file">' + esc(g.duong) + '</div>' +
    '</div>';
  G.forEach(function(x){ x.el.classList.toggle('chon', x.id === id); x.el.classList.toggle('ke', g.lk.indexOf(x.id) >= 0 || g.ve.indexOf(x.id) >= 0); });
  CANH.forEach(function(c){ c.el.classList.toggle('sang', c.a === id || c.b === id); });
  sv.classList.add('mo');
  try { localStorage.setItem('bonao_mo', id); } catch (e) {}
  if (tuDoThi && window.matchMedia('(max-width: 899px)').matches) docEl.scrollIntoView({behavior:'smooth', block:'start'});
  else if (!tuDoThi) docEl.scrollTop = 0;
}
function bo_chon(){ sv.classList.remove('mo'); }
docEl.addEventListener('click', function(e){ var b = e.target.closest('[data-id]'); if (b) { mo(b.getAttribute('data-id')); if (window.matchMedia('(max-width: 899px)').matches) docEl.scrollIntoView({block:'start'}); else window.scrollTo({top:0}); } });

/* ---------- Tìm kiếm (không dấu) ---------- */
var oTim = document.getElementById('oTim'), kq = document.getElementById('kq');
G.forEach(function(g){ g.bo = bo(g.id + '\n' + g.txt); g.boTen = bo(g.id); });
oTim.addEventListener('input', function(){
  var q = bo(oTim.value.trim());
  G.forEach(function(g){ g.el.classList.toggle('trung', !!q && g.bo.indexOf(q) >= 0); });
  if (!q) { kq.hidden = true; kq.innerHTML = ''; return; }
  var r = G.filter(function(g){ return g.bo.indexOf(q) >= 0; })
    .sort(function(a, b){ return (b.boTen.indexOf(q) >= 0) - (a.boTen.indexOf(q) >= 0); }).slice(0, 12);
  kq.innerHTML = r.length ? r.map(function(g){
    var p = g.bo.indexOf(q), doan = g.txt.replace(/\s+/g, ' ').slice(Math.max(0, p - 30), p + 70);
    return '<li><button data-id="' + esc(g.id) + '">' + esc(g.id) + '<small>…' + esc(doan) + '…</small></button></li>';
  }).join('') : '<li style="padding:6px 8px;color:var(--chu3)">Không thấy ghi chú nào có "' + esc(oTim.value) + '".</li>';
  kq.hidden = false;
});
kq.addEventListener('click', function(e){ var b = e.target.closest('[data-id]'); if (b) { mo(b.getAttribute('data-id'), true); kq.hidden = true; } });
oTim.addEventListener('keydown', function(e){ if (e.key === 'Enter') { var b = kq.querySelector('[data-id]'); if (b) { mo(b.getAttribute('data-id'), true); kq.hidden = true; } } if (e.key === 'Escape') { kq.hidden = true; } });
document.addEventListener('click', function(e){ if (!e.target.closest('.tim')) kq.hidden = true; });

vuaKhung();
window.addEventListener('resize', function(){ clearTimeout(window.__rz); window.__rz = setTimeout(vuaKhung, 150); });
var dau = '00 Mục lục';
try { var luu = localStorage.getItem('bonao_mo'); if (luu && BY[luu]) dau = luu; } catch (e) {}
mo(dau);
})();
</script>
