 con người, tình duyên, đường đời, mật mã; mở vĩnh viễn. Client: `tongKhoa(r)`, `tongKhoaHtml` (tab Tổng quan khóa), `tinhTrangMua` mời mở Tổng hợp (trừ ở tab Vận hạn). Mua vận hạn/biến cố/PDF không cần `co_ban`; riêng `phoi_ngau` cần `co_ban` (nằm trong phần Tổng hợp).\n- **Vận hạn bán lẻ theo giai đoạn.** Mỗi lần mở ghi một dòng vào sheet `MoKhoa` (cột \"Phần\") với mã:\n  - `dv:<năm bắt đầu>`: một đại vận, 9 xu.\n  - `nam:<năm>`: vận năm, 19 xu.\n  - `thang:<yyyy-mm>`: nhật vận một tháng, 9 xu.\n  - `dong_hanh:<năm>`: đồng hành cả năm, 39 xu (trừ phần đã mua).\n- **Gói trọn:** `tron_dai_van` 39 xu. `tron_goi` (Trọn đời, 49 xu) gồm `TT_TRON_GOI`, **không gồm năm/tháng** (vẫn giữ nguồn thu định kỳ).\n- **Gói gia đình:** `gia_dinh_3` / `gia_dinh_5` cộng lượt vào sheet `Ve`. `dungLuotGiaDinh` dùng 1 lượt = Bản mở + vận năm cho 1 lá số.\n- **Quyền:** `ttQuyen_` trả `q` gồm cờ từng phần, `q.dvMo`, `q.namMo`, `q.thangMo`, `q.dhNam` và `dvAll/namAll/thangAll`.\n  - **Chú ý:** không đặt tên map trùng tên gói (`nam`, `thang`), vì từng gây lỗi ghi đè.\n- **Cắt nội dung ở máy chủ:** `ttCatPhan_` bỏ lời luận của phần chưa mở, chỉ giữ điểm làm mồi, và gắn `r.vanTom`.\n- **Gói cũ:** người đã mua `luu_nien` được xem mọi năm/tháng.\n- **Phía trình duyệt:** `data-mua=\"phan|id\"` → `muaGo`; `tinhTrangMua` quyết định thanh kêu gọi mua; `chenKhoa` chèn thẻ khóa; `bangGiaHtml` là bảng giá 3 bậc.\n- **Bản miễn phí:** `renderKhach` có câu mở, nút nghiệm chứng, dòng thời gian đại vận bị che, bảng giá và cam kết minh bạch.\n- Giá bán là mức khởi đầu, chưa qua thử nghiệm; nên xem doanh thu trong Quản trị rồi điều chỉnh.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Bán hàng.md", "lk": ["TCC Tiện ích bán lẻ", "TCC Nghiệm chứng", "Quyết định của chủ dự án", "00 Mục lục"]}, {"id": "TCC Báo cáo ngày", "nhom": "Thiên Cơ Các", "txt": "# TCC Báo cáo ngày\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Bán hàng]] · [[TCC Tiện ích bán lẻ]] · [[00 Mục lục]]\n\n- **Báo cáo ngày cho chủ sở hữu (ThanhToan.gs › `bcSoLieu_`, `bcHtml_`, `guiBaoCaoNgay`, `caiDatBaoCaoNgay`, `tatBaoCaoNgay`):** email 7 giờ sáng (trigger `everyDays(1).atHour(7)`): doanh thu 24h/7/30 ngày (DonHang `DA_TRA` theo cột Trả lúc), tài khoản mới (Script Properties `TK_*.taoLuc`) + người giới thiệu, phần đã mở theo loại (MoKhoa), xu dùng/tặng (SoCai), lá số lập, gieo quẻ, bản tin; mục \"Cần chú ý\": lỗi `kiemTraCaiDat_`, đơn chờ, đơn treo >1 ngày, mất trigger quét payOS, 7 ngày không có đơn. Người nhận: Thuộc tính tập lệnh `BAO_CAO_EMAIL`, không có thì `Session.getEffectiveUser()` (không ghi email vào mã). Chủ dự án chạy `caiDatBaoCaoNgay` một lần (gửi kèm một bản thử). Kiểm thử: `tests/bao-cao.js`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Báo cáo ngày.md", "lk": ["TCC Bán hàng", "TCC Tiện ích bán lẻ", "00 Mục lục"]}, {"id": "TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn", "nhom": "Thiên Cơ Các", "txt": "# TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn\n\nLiên quan: [[TCC Sáu hệ]] · [[TCC Tử Vi đối chiếu các phái]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\nNhóm: Thiên Cơ Các · Tạo 22/10/2026\n\n## Yêu cầu\nChủ dự án (22/10): tìm cách luận Bát Tự Hà Lạc và Tứ Trụ trên các web để mang về web của mình.\n\n## Nguồn đã đọc (chỉ phần công khai)\n- Hà Lạc: lyso.vn (chủ đề \"Học Bát tự hà lạc\": 10 thể cách tốt, bậc tam phúc thần), thienviet.wordpress.com (bài 2: nguyên đường, 4 ví dụ), hocvienlyso.org (Hóa công theo Đông chí/Xuân phân/Hạ chí/Thu phân), sohu.com \"六爻飞支与元堂爻位式\" (quy tắc đi hai lượt / một lượt), mục lục 河洛理數 (sourcelibrary, ctext – ctext chặn truy cập tự động).\n- Tứ Trụ: bảng điều hậu 窮通寶鑑 – suanzhun.net/article/1555 và blog Vương Minh (Sina) – hai bản khớp gần hết, lệch vài lỗi chép; masterseanchan.com (Tian Qi) chỉ có bài khái quát thập thần.\n\n## Đã đưa vào web (22/10)\n- **Sửa lỗi hào nguyên đường** (HaLac.gs › `hlNguyenDuong_`): giờ dương đi trên hào dương, giờ âm đi trên hào âm, từ dưới lên; 1–3 hào cùng loại đi hai lượt, 4–5 hào đi một lượt, giờ thừa \"ký cung\" sang hào khác loại. Bản cũ vòng lại trên hào cùng loại nên sai với quẻ có 1, 2, 4, 5 hào cùng loại (kéo theo sai quẻ Hậu thiên, đại vận, lưu niên). Đối chiếu: Khiêm giờ Tỵ → 5, Đại Hữu giờ Thân → 1, Đại Quá giờ Dậu → 6, Thăng giờ Thìn → 1, Tụy giờ Dần → 4.\n- **Tam phúc thần** (`hlThoiVi_`): thêm Địa nguyên khí (chi năm theo Hậu thiên: Tý Khảm, Sửu Dần Cấn, Mão Chấn, Thìn Tỵ Tốn, Ngọ Ly, Mùi Thân Khôn, Dậu Đoài, Tuất Hợi Càn – `HL_CHI_QUAI`) và xếp bậc theo lyso.vn: đủ ba / có Hóa công / đủ hai nguyên khí / một nguyên khí / không có. Trả thêm `bac`.\n- **Mười thể cách tốt** (\"Quý mệnh thập cát thể\", `hlThapCat_` → `luan.thapCat`): tên quẻ, hào vị, hào nguyên đường, đắc thời (quẻ tiêu tức `HL_BICH_QUAI`), hữu viện, số thuận thời (Thiên số/25 so Địa số/30 theo tháng âm – dương), đắc thể (quái chứa nguyên đường sinh/đồng hành mạng nạp âm), đáng vị, hợp lý (quái của can năm có mặt và hợp mùa), chúng tông. Đếm số cách → bậc. Tab Hà Lạc có khung \"Mười thể cách tốt của mệnh\"; văn dễ hiểu thêm đoạn \"Nền mệnh bẩm sinh\".\n- **Điều hậu 10 can × 12 tháng** (BatTuPhanTich.gs › `BTP_DIEU_HAU`, `dungThan.dieuHauBang`): thêm vào danh sách phương pháp chọn dụng thần (chỉ tham khảo, không đổi dụng thần ức phù); xét can điều hậu thấu, tàng hay chưa có. Văn dễ hiểu Bát Tự thêm đoạn \"Khí hậu của lá số\" (cùng ngưỡng 8% với đoạn \"Cán cân ngũ hành\" để hai đoạn không mâu thuẫn).\n- Kiểm thử: ha-lac 8401, bat-tu 4008, cai-dat 79. Mã giao diện `2026.10.22.4`.\n\n## Còn khác nhau giữa các nguồn / chưa làm\n- **Hóa công**: mã đang dùng hành vượng theo mùa (Xuân Chấn Tốn, Hạ Ly, Thu Càn Đoài, Đông Khảm, tứ quý Khôn Cấn); hocvienlyso dùng bốn quái chính theo phân – chí (Khảm từ Đông chí, Chấn từ Xuân phân, Ly từ Hạ chí, Đoài từ Thu phân). Chưa đổi – chờ chủ dự án chọn hoặc tìm sách Học Năng / Hoàng Tuấn.\n- **384 lời hào** (thể cách số 3) chưa có kho – đang chấm theo cát – hung quẻ + vị hào.\n- Lưu niên Hà Lạc (quy tắc năm trong vận hào dương 9 năm / âm 6 năm) có nhiều dị bản – giữ cách cũ.\n- Ý tưởng tiếp: luận 60 nhật trụ (Tứ Trụ), lưu nguyệt Hà Lạc.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn.md", "lk": ["TCC Sáu hệ", "TCC Tử Vi đối chiếu các phái", "TCC Kiểm thử", "00 Mục lục"]}, {"id": "TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu", "nhom": "Thiên Cơ Các", "txt": "# TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu\n\nLiên quan: [[TCC Sáu hệ]] · [[TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\nNhóm: Thiên Cơ Các · Tạo 23/10/2026\n\n## Yêu cầu\nChủ dự án (22/10): tìm cách luận chuyên sâu Human Design, Thần số học, Chiêm tinh để nâng cấp luận giải.\n\n## Rà soát trước khi làm\nBa hệ đã sâu (Chiêm tinh 7 bước có profection, chủ tinh từng nhà; Thần số 6 bước có bài học nghiệp, số tiềm thức, đam mê ẩn; HD 11 bước có biến số, giao điểm hóa thân, chủ đề bản ngã giả trong văn dễ hiểu). Chỉ bổ sung kỹ thuật **còn thiếu và có quy tắc rõ ràng**:\n\n## Đã làm (23/10)\n- **Chiêm tinh – phe ngày/đêm (sect) + Phần may mắn (Fortune) + Phần tinh thần (Spirit)** (Hy Lạp cổ, Vettius Valens): ChiemTinh.gs › `chiemTinhLap` thêm `sect.ngay` (Mặt Trời ở nhà 7–12), `lot.fortune` (ngày = Mọc + Trăng − Trời, đêm đảo), `lot.spirit` (ngược Fortune); `ctPhanTich_` → `phucLoc` (văn chuyên sâu + bản `tron*` dễ hiểu; chủ tinh của cung chứa phần). Tab Chiêm tinh: khung \"Phe ngày/đêm · Phần may mắn · Phần tinh thần\" trong Trường hợp đặc biệt; văn dễ hiểu thêm khối \"Nguồn may mắn và chí hướng\". Nguồn đối chiếu: Wikipedia \"Arabic parts\", Cafe Astrology, Skyscript.\n- **Thần số – chữ cái chuyển tiếp & số tinh chất** (Transit letters / Essence, Pythagoras – Decoz): ThanSoHoc.gs › `tsChuCai_`, `tsChuyenTiep_` → `phanTich.chuyenTiep` (10 năm: chữ thể chất = tên gọi, trí tuệ = đệm, tâm linh = họ; mỗi chữ kéo dài số năm bằng giá trị; tinh chất = tổng, giữ 11/22; đánh dấu năm trùng năm cá nhân). Tab Thần số: bảng 10 năm trong Phần 4 Chu kỳ; văn dễ hiểu thêm đoạn \"Chủ đề năm theo tên của bạn\".\n- **Human Design – câu tự hỏi cho trung tâm mở** (`HD_CENTER_HOI`, 9 trung tâm: câu hỏi bản ngã giả + trí tuệ khi sống đúng) → `trungTam[].hoi/triTue`, nối vào văn \"Bài học\"; văn dễ hiểu thêm đoạn \"Câu hỏi giúp bạn sống đúng mình\".\n- Bỏ **4 mặt phẳng biểu hiện** (Planes of Expression): các nguồn gán chữ cái vào mặt phẳng khác nhau – không đủ tin cậy.\n- Không dùng Gene Keys (bản quyền của tác giả).\n- `BAN_MOI_CAN_CO`: ThanSoHoc `tsChuyenTiep_`, ChiemTinh `lot: lot`, HumanDesign `HD_CENTER_HOI`. Mã giao diện `2026.10.23.2`.\n- Kiểm thử: chiem-tinh 1820 (công thức Fortune/Spirit), than-so 2651 (mẫu Nguyễn Văn An 36 tuổi: A + N + N = 11), human-design 2100, cai-dat 83.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu.md", "lk": ["TCC Sáu hệ", "TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn", "TCC Kiểm thử", "00 Mục lục"]}, {"id": "TCC Chuyên gia Agency Agents", "nhom": "Thiên Cơ Các", "txt": "# TCC Chuyên gia Agency Agents\n\nLiên quan: [[TCC Kiểm thử]] · [[TCC Giao diện]] · [[TCC Bán hàng]] · [[00 Mục lục]]\n\nNhóm: Thiên Cơ Các · Tạo 22/10/2026\n\n## Nguồn\n- Repo GitHub `msitarzewski/agency-agents` (giấy phép MIT, bản commit `4e3ac3c` ngày 19/10/2026) – khoảng 300 \"chuyên gia\" (subagent) cho Claude Code.\n- Chủ dự án (22/10) yêu cầu tải về và đưa vào dự án. Chỉ chọn **25 chuyên gia hợp với Thiên Cơ Các** (chép cả bộ sẽ làm danh sách trợ lý rối và tốn ngữ cảnh); đã đọc lướt từng file, không có lệnh tải ngầm hay chỉ dẫn lạ.\n- Đặt ở `.claude/agents/` (Claude Code tự nạp khi mở repo). Đổi `name:` sang dạng chữ thường nối gạch; cuối mỗi file thêm mục \"Bối cảnh Thiên Cơ Các\" (tiếng Việt, đọc CLAUDE.md, bảo mật, chạy kiểm thử). Giấy phép gốc: `.claude/agents/LICENSE-agency-agents.txt`.\n\n## Danh sách (tên để gọi → việc nên giao)\n- **Thiết kế:** `ui-designer` (hệ thống giao diện, Bạch Kim) · `ux-architect` (bố cục, luồng người dùng) · `brand-guardian` (giọng thương hiệu Thiên Cơ Các) · `visual-storyteller` (kể chuyện bằng hình, trang bìa, PDF).\n- **Kỹ thuật:** `frontend-developer` (Script/Styles/Index) · `code-reviewer` (rà lỗi trước khi đẩy) · `minimal-change-engineer` (sửa đúng chỗ, không lan) · `payments-billing-engineer` (payOS, xu, đơn hàng) · `pdf-engine-architect` (báo cáo PDF) · `technical-writer` (hướng dẫn cài đặt) · `prompt-engineer` (nếu làm trợ lý AI luận giải).\n- **Tiếp thị – bán hàng:** `content-creator` · `growth-hacker` (phễu, mời bạn, quà đăng ký) · `seo-specialist` · `tiktok-strategist` · `social-media-strategist` · `offer-lead-gen-strategist` (gói giá, ưu đãi, bản xem thử).\n- **Sản phẩm:** `product-manager` · `feedback-synthesizer` (tổng hợp góp ý khách) · `behavioral-nudge-engine` (nhắc nhở, email hằng ngày).\n- **Kiểm thử:** `reality-checker` (mặc định \"chưa đạt\" cho tới khi có bằng chứng) · `evidence-collector` (chụp màn hình làm bằng chứng) · `accessibility-auditor` (dễ dùng cho người lớn tuổi, điện thoại).\n- **Khác:** `legal-compliance-checker` (điều khoản, dữ liệu cá nhân, thanh toán) · `personal-growth-mentor` (giọng văn lời khuyên tầng 2).\n\n## Đã dùng\n- 23/10: ui-designer, ux-architect, accessibility-auditor, growth-hacker (+ offer-lead-gen-strategist) tư vấn thiết kế lại web – xem [[TCC Giao diện]] mục 23/10.\n\n## Cách dùng\n- Trong phiên Claude Code: nói \"dùng chuyên gia `ui-designer` xem lại tab Tổng quan\" hoặc \"nhờ `reality-checker` kiểm tra bản PDF\". Claude sẽ giao việc cho chuyên gia đó (chạy như trợ lý con).\n- Phiên mới đọc lại danh sách ở ghi chú này; muốn thêm chuyên gia khác từ repo gốc thì tải file `.md` tương ứng, đổi `name:`, thêm mục bối cảnh, ghi vào đây.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Chuyên gia Agency Agents.md", "lk": ["TCC Kiểm thử", "TCC Giao diện", "TCC Bán hàng", "00 Mục lục"]}, {"id": "TCC Giao diện", "nhom": "Thiên Cơ Các", "txt": "# TCC Giao diện\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC PDF]] · [[TCC Lá số 3D]] · [[TCC Văn dễ hiểu và Tổng hợp 6 hệ]] · [[00 Mục lục]]\n\n- **Bố cục chuyên sâu thống nhất:** tab Tử Vi chia Phần 1–4 (`khoiPhan`, chân dung lá số gộp một khung; thẻ xem nhanh cung chỉ hiện khi bấm). Tab Hà Lạc (`renderHaLac`, Phần 1–5), Thần số (`renderThanSo`, Phần 1–8), Chiêm tinh (`renderAstro`, Phần 1–8) và Human Design (`renderHD`, Phần 1–11) tự dựng khung (`PHAN_HE` đều = null; `xepPhan` giữ lại cho tương thích). `veDeHieu` chèn văn dễ hiểu lên đầu mỗi tab rồi gom các khung chuyên sâu vào `details.chuyen-sau`.\n- **Vòm trời 6 hệ (Script.html › `vuTruHtml`, `vtThe`, `vtChon`, CSS `.vt-*`):** bánh xe SVG 9 lĩnh vực × 4 vòng hệ (trong → ngoài: Hà Lạc, Chiêm tinh, Bát Tự, Tử Vi; màu `th6Mau`), vùng phát sáng khi ≥3/4 hệ cùng chiều, quỹ đạo hành tinh thật lúc sinh làm nền. Bấm/phím mũi tên để xoay (`--q`, đường ngắn nhất) và đổi thẻ luận giải; nút chip làm nổi 1 hệ; \"Đọc đầy đủ\" mở mục `details` tương ứng. Đặt trong `th6Html` (bảng nhiệt chuyển vào \"Xem dạng bảng điểm\") và `th6KhachHtml` (bản miễn phí: 1 vòng điểm chung, vùng khóa mời mua). PDF: `chuanHoa` cố định SVG 640px và đổi xoay CSS thành thuộc tính `transform`. Tôn trọng `prefers-reduced-motion`.\n- **Dòng thời gian cuộc đời (Script.html › `dtHtml`, `dtThe`, `dtChon`, CSS `.dt-*`):** đầu tab Vận hạn (cả bản miễn phí). SVG 0–90 tuổi: dải đại vận (`chiTiet.daiVan` hoặc `moi.daiVan`), cột từng năm (`tieuVanNhieuNam`), chấm biến cố (`tongHop.hoiTu.chuDe`, thiếu thì lấy `th6.namToi/namQua`). Thanh trượt + ‹ › chọn năm → thẻ: tuổi mụ, can chi, đại vận, biến cố, nút mở năm (`nutNam`) / đại vận / `bien_co` / `co_ban`. Không in vào PDF.\n- **Hành trình dẫn dắt (Script.html › `htMo`, `htToi`, `htKetQua`, `htLaBai`; modal `#htModal` trong Index.html):** nút \"✦ Nhập từng bước\" (form) và nút \"Khám phá ngay\" mở hộp 4 bước (tên → ngày → giờ → nơi sinh), ghi vào form chính bằng `setForm` rồi `submit()`; `HT.cho` báo `submit` gọi `htKetQua` → màn khởi quẻ → 8 lá hé lộ hiện sẵn nội dung, bấm \"Lá tiếp\" để chuyển (dữ liệu `res.teaser.*.lo` + lĩnh vực mạnh nhất `th6`, lọc tên sao bằng `htCau`). Lá cuối: bản miễn phí mời kiểm chứng / mở khóa; bản đầy đủ dẫn tới Vòm trời, Dòng thời gian, Lá số, Kiểm chứng. `showErr` trả hộp về bước cuối nếu lỗi.\n- **Sinh động & gần gũi (Script.html › `veChao`, `chaoHtml`, `hieuUng`, `huDem`, `mungMo`, `huPhaoHoa`; CSS `.chao*`, `.cho-hien/.hien`, `.an-sao`, `.hu-*`):** lời chào theo giờ + tên + ngày/tháng/năm cá nhân (công thức giống `namCaNhan` ở ThanSoHoc.gs) + đếm ngược sinh nhật (ẩn được trong ngày, `sessionStorage`); khung hiện dần khi cuộn (IntersectionObserver, gắn trong `sauHienThi`), điểm số đếm lên và thanh điểm dâng khi hiện; lá số \"an sao\" 12 cung hiện lần lượt từ cung Mệnh (`renderChart`); con dấu \"Đã mở khóa\" + kim sa khi mua thành công (`muaGo`). Tắt hết khi `prefers-reduced-motion`; `.pdf-root` tắt mọi animation và buộc hiện đủ.\n- **Giao diện chuyên nghiệp (khối cuối Styles.html \"GIAO DIỆN CHUYÊN NGHIỆP\" + Script.html › `veHoSo`, `moForm`, `dongForm`):** giữ bảng màu cũ; bỏ quả cầu/núi/góc trang trí/chữ chuyển màu; tiêu đề khung chữ không chân; `.tg-head` thành đầu mục có vạch vàng (không còn tấm băng); nút chính màu đặc; tab trái dạng danh sách có vạch sáng. Khi có kết quả: `body.co-ket-qua` ẩn ô nhập, bố cục 2 cột (tab | nội dung ≤1080px), thẻ hồ sơ `#hoSoTom` (✎ Sửa thông tin / ＋ Lá số mới) mở ô nhập dạng ngăn kéo phải (`body.mo-form`, nền `#formNen`, Esc để đóng; `submit` tự đóng). Dải quảng cáo sau khi có kết quả chỉ còn 1 dòng. Gợi ý kiểm chứng `#ncBanner.nc-goi` gọn (chi tiết trong `details`). Xóa khối CSS này là về giao diện cũ.\n- **Bố cục trang (máy tính ≥1081px):** cột trái `#navCol` (tab xếp dọc + mục lục, JS chuyển vào lúc khởi động), giữa là kết quả, phải là form. Điện thoại: tab ngang như cũ. Lá số Tử Vi trên điện thoại được thu nhỏ vừa màn hình (`coLaSo`; `chupLaSo` bỏ thu nhỏ khi chụp PNG/PDF; `drawOverlay` quy toạ độ về kích thước gốc).\n- **Tab (Index.html):** Lá số → Tổng quan 6 hệ → **Vận hạn** (`page-vh`, dựng bởi `veVanHan` trong Script.html; gom đại vận, năm, tháng, ngày, biến cố) → Bát Tự, Chiêm tinh, Thần số, HD, Hà Lạc → Cặp đôi → Lịch sử.\n- **Khởi động trang:** gắn tab và Lịch sử **trước tiên**, mỗi bước bọc trong `buoc(...)`. Một bước lỗi (vd. Index.html cũ thiếu phần tử) không được làm chết cả trang.\n- **Mã phiên bản giao diện:** `<meta name=\"tcc-ban\">` (Index.html), `--tcc-ban` (đầu Styles.html) và `BAN_GIAO_DIEN` (Script.html) phải **trùng nhau** – mỗi đợt sửa giao diện hãy tăng cả 3. Bước khởi động \"kiểm tra phiên bản\" chỉ đích danh file cũ; mọi lỗi khởi động hiện trong khung `baoLoiKhoiDong` (ghi tên bước + thông điệp lỗi) để chủ dự án chụp gửi, thay cho câu báo chung chung trước đây.\n- **Lớp phủ:** `.modal` z-index 120 (trên thanh CTA 85 và mục lục 90). `.toast` có `pointer-events: none`.\n- **Giao diện tối sang trọng \"Kim Sa Trầm\" (21/10/2026, chủ dự án chọn kiểu Tian Qi, làm toàn bộ web):**\n  - **Bảng màu:** nâu khói, vàng kim và son, viết lại ở token `:root` đầu Styles.html.\n    - Bản in (`.theme-light`, `.chart-frame`) chuyển sang tông giấy ngà và nâu vàng.\n    - Mọi màu xanh ngọc, xanh đêm viết thẳng trong Styles/Script đã đổi sang nâu – vàng.\n    - Màu \"tốt\" là `#6f9f5e`.\n  - **Khối cuối Styles.html \"GIAO DIỆN TỐI SANG TRỌNG\":**\n    - tiêu đề khung và Phần dùng chữ có chân Cormorant, góc 3–6px, viền vàng mảnh;\n    - nút chính vàng kim chữ nâu, nút phụ viền vàng;\n    - tab vàng; thanh CTA và thanh tab điện thoại nâu.\n  - **Ảnh nhân vật** (`Anh.html` = **ảnh của chủ dự án, bắt buộc giữ**) đặt trong khung vàng hai lớp ở trang chủ (`.wl-anh`).\n  - **Bảng chỉ số đầu tab Bát Tự** (`renderBatTu` › `chiSo`, CSS `.bcs-*`; `veDeHieu` đưa `.bt-chiso` lên trên văn dễ hiểu):\n    - can nhật chủ;\n    - thanh vượng – nhược theo `diem.phe`;\n    - 4 tiêu chí ✓/✗;\n    - 5 chip Dụng / Hỷ / Kỵ / Nhàn thần.\n  - PDF nền tối `#120d09`. Phiên bản giao diện 2026.10.14.\n- **Demo giao diện \"Hỏa Tinh\" (21/10/2026, chờ chủ dự án duyệt):** chủ dự án chê cả 3 phương án Tinh Hà / Giấy Dó / Lục Bảo (`tuvi-app/demo/giao-dien/`) và yêu cầu làm lại cả bố cục.\n  - **Màu hợp mệnh Sơn Đầu Hỏa:**\n    - nền đỏ rượu vang thẫm `#140809` (tránh đen, vì đen thuộc Thủy khắc Hỏa);\n    - dải lửa cam → hồng → tím (màu Hỏa);\n    - xanh ngọc `#3fd69c` cho tín hiệu tốt (Mộc sinh Hỏa);\n    - vàng kim `#f6c76c` chỉ điểm xuyết (Thổ).\n  - **Kiểu chữ:** Cormorant Garamond (tiêu đề), Be Vietnam Pro (nội dung), Chakra Petch (số, nhãn).\n  - **Bố cục mới:**\n    - thanh kính dạng viên thuốc dính trên đầu trang;\n    - hero: chân dung trong viền xoay phát sáng và quỹ đạo, tên lớn chữ dải lửa, tứ trụ, bộ đếm, 2 nút;\n    - lưới bento 12 cột.\n  - **Biểu đồ động** (vẽ tay bằng SVG, chạy khi cuộn tới):\n    - radar 12 cung;\n    - vòng ngũ hành có dụng thần;\n    - đồng hồ vượng – nhược có kim;\n    - 9 lĩnh vực: thanh lửa + chấm từng hệ;\n    - đường vận 0–85 tuổi (tài lộc, quan lộc, rủi ro sức khỏe lấy từ `duDoan.chuDe.*.diem`): dải đại vận, ◆ năm nóng, rê chuột hoặc chạm để xem thẻ từng năm;\n    - cột 12 tháng (`hoSoThang`);\n    - vòng % 6 sự kiện (`hoSoNam`);\n    - lá số 12 cung bấm được: tam hợp viền lửa, xung chiếu viền tím.\n  - **Hiệu ứng:** tàn lửa bay (canvas), quầng sáng trôi, lưới mờ. Tắt khi `prefers-reduced-motion`.\n  - **Bản demo** dùng lá số chủ dự án nên lưu riêng tư: https://claude.ai/artifact/PBz32Cc5qPqNCoesKaJxCK. Trình dựng nằm ngoài repo.\n  - **Khi duyệt:** chuyển vào Styles/Script/Index (tab giữ nguyên dữ liệu; Tổng quan thành bảng bento), giữ `Anh.html`.\n  - **Đổi màu theo góp ý \"trông máu me quá\" (21/10), bố cục giữ nguyên.** Bảng màu mới **\"Tử Ngọc\"**, vẫn hợp mệnh Hỏa vì tím và hồng là màu Hỏa:\n    - nền tím mận `#120a1c`;\n    - dải sâm panh `#ffd29a` → hồng phấn `#f0a6ca` → tím lan `#c084fc` → tím `#9d6bff`;\n    - xanh ngọc `#46d9a4` cho tín hiệu tốt; vàng `#f3cf8a`;\n    - màu hành Hỏa trong dữ liệu là `#ff9a6b`.\n    - Đường rủi ro sức khỏe và viền xung chiếu dùng hồng phấn. Cùng link demo.\n\n  - **Đổi màu lần 2 theo góp ý về ngũ hành của chủ dự án (21/10; chi tiết lá số chỉ ở artifact riêng), bố cục giữ nguyên.** Bảng màu **\"Bạch Kim\"** (cùng link demo, phiên bản 3):\n    - Kim: bạch kim, bạc (`#f7f5f0`, `#eef0f2`, `#cfd3d8`); Thổ: sâm panh `#e8cf8f`, `#d9c3a0`; Hỏa: vàng hồng / đồng hồng `#e3a588`, `#b8806a`.\n    - Nền than ấm `#14110e` / `#1c1814` (không dùng đen xanh của Thủy); bỏ xanh lá (Mộc), xanh lá chỉ còn để tô hành Mộc trong dữ liệu (`#7fc79a`); màu xấu `#e48a8a`.\n    - Biểu đồ đời: tài lộc sâm panh, quan lộc vàng hồng, sức khỏe nét đứt bạc. Hạt sáng vàng + bạc.\n    - Kim chỉ là màu nhấn, Hỏa – Thổ vẫn giữ vai trò chính.\n- **22/10/2026 – chủ dự án \"Duyệt màu\" → áp Bạch Kim + bento vào app (mã giao diện `2026.10.22`):**\n  - `Styles.html`: token `:root` đổi sang Bạch Kim (thêm `--bk-grad`, `--bk-bac`, `--bk-sam`, `--bk-hong`, `--bk-dong`, `--bk-xau`). Màu viết thẳng đổi hàng loạt: nền nâu → than ấm, vàng kim → sâm panh, son → đồng hồng; tín hiệu tốt xanh lá → bạc, xấu đỏ → hồng dịu. Không đổi: khối `.theme-light` (bản in), màu Tứ Hóa, màu ngũ hành trong dữ liệu. Khối cuối \"BẠCH KIM – HIỆU ỨNG NỀN + BẢNG ĐIỀU KHIỂN BENTO\" (`.bk-nen`, `.bk-hat`, `.bdk-*`); nút chính dùng dải `--bk-grad` chạy nhẹ; ẩn mây, núi cũ.\n  - `Index.html`: thêm `.bk-nen` (khối sáng trôi + lưới) và canvas `#bkHat`; `<div id=\"bdk\">` ở đầu `#page-chart`; thêm font Chakra Petch.\n  - `Script.html`: `bkDuLieu`, `veBangDieuKhien` (gọi trong `render`, bọc try/catch; khách chưa đăng nhập thì ẩn), các biểu đồ `bkRadar`, `bkDonut`, `bkGauge`, `bkLv`, `bkDoi`, `bkThang`, `bkSk`; `bkHat` (hạt sáng, chạy ở `init`). Mọi biểu đồ chạy hiệu ứng khi cuộn tới (IntersectionObserver), tắt khi người dùng chọn giảm chuyển động.\n  - **Bản khóa:** chưa mở Biến cố thì đường vận cả đời chỉ vẽ bậc thang điểm đại vận + khung khóa `data-mua=\"bien_co\"`; chưa mở Vận năm thì chỉ hiện sự kiện mồi + khung khóa `data-mua=\"nam\"`; chưa mở Tổng hợp thì 9 lĩnh vực lấy từ `res.th6` (không chấm từng hệ), bỏ nguyên mẫu và bộ đếm từ `tomLuoc`.\n  - Ảnh nhân vật (`Anh.html`) vẫn ở trang chào; bảng điều khiển của khách hàng dùng vòng ấn chữ cái đầu tên, không dùng ảnh chủ dự án.\n  - Đã chụp kiểm tra ở 1366px và 390px, cả chủ sở hữu lẫn tài khoản thường: không lỗi trang, không tràn ngang. Kiểm thử: cai-dat 74/74, tong-hop, ho-so-nam, van-sau, nghiem-chung, lich-su, tien-ich, bao-cao, giai-doan, tai-khoan, thanh-toan đều đạt.\n- **23/10/2026 – sửa theo tư vấn 4 chuyên gia** (ui-designer, ux-architect, accessibility-auditor, growth-hacker; mã giao diện `2026.10.23.1`):\n  - Thanh mời mua (`veCta`, `capNhatCuon`): chỉ hiện khi đã cuộn quá 1,5 màn hình **và** dải mời đầu trang đã khuất (hết cảnh 3 lời mời cùng lúc); khách chưa đăng nhập chỉ thấy 1 nút quà (bỏ nút Trọn đời cạnh nút miễn phí, cả ở `veQc`); điện thoại: thanh cách lề 12px, tối đa 2 dòng, chừa đáy trang.\n  - Lời cũ \"bản giới hạn\" → \"Luận giải 6 hệ đã mở miễn phí…\" (`tinhTrangMua` nhánh khách, `moDangNhap`); tab Vận hạn: khách chưa đăng ký thấy \"🎁 tặng 19 xu – đủ mở 10 năm bạn đang sống\".\n  - Biểu đồ bento vẽ sẵn giá trị cuối (`ve(1)` trước `bkKhiThay`, thanh 9 lĩnh vực có sẵn `width`) – không còn \"0%\" khi chưa cuộn tới/in/chụp.\n  - Tab là `<button role=\"tab\" aria-selected>` trong `#tabs[role=tablist]`; phím ←/→/Home/End chuyển tab; `showTab` đặt `body[data-tab]` và cuộn tab đang chọn vào giữa thanh tab điện thoại (mép phải mờ dần).\n  - Khối CSS cuối Styles.html \"TƯ VẤN CHUYÊN GIA 10/2026\": viền focus rõ, placeholder sáng hơn, nút 3D/2D chữ tối, `.dh-diem` dùng màu giao diện tối, văn luận giải 16px/1.7 (tối đa 72 ký tự/dòng), vùng bấm ≥ 44px trên điện thoại, nút hồ sơ lưới 2×2, bớt khung lồng trên điện thoại, lời chào chỉ ở tab Lá số, in thì hiện đủ khung \"hiện dần\".\n  - **Chưa làm – chờ chủ dự án duyệt** (đụng bố cục bento đã duyệt / thứ tự bán hàng): gom bớt khung bento trên điện thoại, gom 11 tab thành 4 nhóm, đưa dòng thời gian lên đầu tab Vận hạn và gom các gói thành một bảng, hé câu đầu kết luận của lĩnh vực khóa, gắn nguồn cho nút mua để đo, sửa màu khung lá số 3D (sửa trong `tools/demo-3d.js` rồi sinh lại `LaSo3D.gs`), điểm \"Con cái\" lệch nhau giữa bánh xe và thẻ.\n\n## 23/10 – Demo phong cách \"Vũ trụ vàng\" (chưa áp vào app)\n- Chủ dự án gửi 3 ảnh mẫu (nền xanh đêm có sao, quả cầu + vòng hoàng đạo, vàng kim; bảng thiết kế \"ASTRA – 5 hệ 1 bản đồ\"). Đã dựng trang demo riêng: https://claude.ai/artifact/GarfMYuDq6bsT7biUfxBMZ\n- Bảng màu demo: nền #0B0F17, thẻ #1A2332, vàng #D4AF37 / #F7E7B5, nhấn tím #6B5BFF, thông tin #00D1C1; chữ Playfair Display (tiêu đề) / Inter (thân) / Montserrat (nút). Gồm: thanh menu, hero \"6 Hệ thống – 1 Bản đồ Bản thân\" với quả cầu sao xoay (canvas, tắt chuyển động nếu máy đặt giảm chuyển động), 6 thẻ hệ, ô nhập ngày/giờ/nơi sinh có 3 bước, bảng tổng quan mẫu (điểm tổng, 9 lĩnh vực, tab Luận giải / Vận 12 tháng). Dữ liệu lá số mẫu, không phải người thật.\n- **Lưu ý:** nền xanh đêm + tím/xanh ngọc trái với quyết định Bạch Kim (\"không dùng xanh lá, đen xanh, xanh dương để trang trí\"). Chờ chủ dự án chọn: giữ Bạch Kim, chuyển hẳn sang Vũ trụ vàng, hay thêm làm chế độ giao diện thứ ba.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Giao diện.md", "lk": ["TCC PDF", "TCC Lá số 3D", "TCC Văn dễ hiểu và Tổng hợp 6 hệ", "00 Mục lục"]}, {"id": "TCC Kiểm thử", "nhom": "Thiên Cơ Các", "txt": "# TCC Kiểm thử\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Lịch sử lá số]] · [[TCC Lá số 3D]] · [[00 Mục lục]]\n\n```bash\ncd tuvi-app\nnode tests/cai-dat.js                          # bộ kiemTraCaiDat: HAM_CAN_CO đủ file, BAN_MOI_CAN_CO khớp mã hiện tại (tránh báo nhầm \"bản cũ\")\nnode tests/bao-cao.js                          # báo cáo ngày cho chủ sở hữu: số liệu 24h/7/30 ngày, người nhận, trigger 7 giờ\nnode tests/giai-doan.js                        # bán theo giai đoạn, gói gia đình, phần cắt ở máy chủ (34 kiểm tra)\nnode tests/lich-su.js                          # lịch sử: lá số trùng chỉ giữ bản mới nhất, ẩn trùng, dọn trùng\nnode tests/nghiem-chung.js                     # nghiệm chứng dựa trên tổng hợp 6 hệ\nnode tests/tong-hop.js                         # Tổng hợp 6 hệ bản 2: nhãn khớp điểm, không tên sao, bản miễn phí chỉ lộ 1 lĩnh vực\nnode tests/ho-so-nam.js                        # Hồ sơ biến cố năm: 19 sự kiện, xác suất, đồng thuận/đối lập, bản khóa\nnode tests/tam-phap.js                        # Tử Vi đối chiếu các phái: ba vòng nhân sinh, 8 thế Mệnh – Thân, vận Thái Tuế, Lai Nhân (đối chiếu iztro), tự hóa, phi hóa\nnode tests/van-sau.js                          # Vận hạn chuyên sâu: 12 tháng, hiệu chỉnh, đại vận 5 hệ, 12 cung lưu niên, nhật vận, ứng kỳ Mai Hoa\nnode tests/bat-tu.js                           # Bát Tự 9 bước trên 400 lá số\nnode tests/ha-lac.js                           # Hà Lạc lục hào nạp giáp (bát cung, lục thân, phục thần) trên 200 lá số\nnode tests/than-so.js                          # Thần số học 6 bước (nợ nghiệp, số 0, số bậc thầy…) trên 300 lá số\nnode tests/chiem-tinh.js                       # Chiêm tinh 7 bước: Chiron/Lilith, cấu hình, 8 lĩnh vực, chu kỳ, so sánh (~40 giây)\nnode tests/human-design.js                     # Human Design 11 bước; đối chiếu màu Mặt Trời với hd-chart-engine nếu đã npm install trong tests/\nnode tests/chiem-tinh.js   # (23/10) + công thức Phần may mắn/tinh thần theo phe ngày/đêm\nnode tests/van-ngay.js                         # luận giải hằng ngày qua email: 7 lá số × 12 ngày, không tên sao, ngày xung không khuyên việc lớn, đủ 4 lĩnh vực/4 hệ/3 buổi, không mâu thuẫn lịch cổ, ngày mai không viết \"hôm nay\", quyền, trigger bản Zalo (≤1900 ký tự/tin, chỉ lá số chủ sở hữu) (1599 kiểm tra; TK_PASS cho phần chủ sở hữu)\nnode tests/tien-ich.js                         # 7 tiện ích bán lẻ: công thức, miễn phí/trả phí, mua, gieo quẻ, bản tin (55 kiểm tra)\nTK_PASS='<mật khẩu chủ>' node tests/tai-khoan.js   # cần mật khẩu chủ sở hữu – hỏi chủ dự án hoặc đặt biến môi trường TK_PASS\nTK_PASS='<mật khẩu chủ>' node tests/thanh-toan.js\ncd tests && npm install && node thien-van.mjs && node doi-chieu.js   # đối chiếu thiên văn / an sao với thư viện nguồn mở\n```\n- **Mô phỏng Apps Script:** `tools/gia-lap.js` gồm Sheet trong bộ nhớ, Properties, Cache, Lock và payOS giả. Dùng `const { ctx } = require('./tools/gia-lap.js')`, rồi gọi thẳng các hàm `.gs`.\n- **Xem giao diện:**\n  - `python3 tools/xem-truoc.py` → `tools/preview.html`. `google.script.run` được thay bằng `window.srv`.\n  - `PW=/opt/node22/lib/node_modules/playwright node tools/chup.js` chụp các tab (`W=390` để giả điện thoại).\n  - Không chạy `playwright install`; Chromium có sẵn.\n- **Xuất thử PDF:** `tools/xuat-pdf.js` (cần `npm install --no-save html2canvas@1.4.1 jspdf@2.5.1` trong tests/) – xem [[TCC PDF]].\n- **Kiểm tra cú pháp:** `.gs` thì copy ra `.js` rồi `node --check`. `Script.html` thì trích nội dung `<script>` rồi `node --check`.\n- **Giới hạn mạng:** WebFetch bị chặn với một số trang tiếng Việt (vd. lasobattu.com, 4thuman.com); WebSearch dùng được.\n- **Thêm file `.gs` mới:** phải thêm vào `HAM_CAN_CO` trong Code.gs (hàm `kiemTraCaiDat`) và cập nhật số file trong HUONG-DAN-CAI-DAT.md.\n- **`BAN_MOI_CAN_CO` = [hàm, chuỗi phải có trong thân hàm đó]:** chọn đúng hàm thực sự chứa lời gọi (đã từng đặt nhầm `htHoiTu_` thay vì `htTinHieu_` → chủ dự án dán đúng vẫn bị báo bản cũ). Luôn chạy `node tests/cai-dat.js`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Kiểm thử.md", "lk": ["TCC Lịch sử lá số", "TCC Lá số 3D", "00 Mục lục", "TCC PDF"]}, {"id": "TCC Luận giải hằng ngày qua email", "nhom": "Thiên Cơ Các", "txt": "# TCC Luận giải hằng ngày qua email\n\nLiên quan: [[TCC Tiện ích bán lẻ]] · [[TCC Báo cáo ngày]] · [[TCC Vận hạn chuyên sâu và biến cố]]\n\nNhóm: Thiên Cơ Các · Tạo 22/10/2026 · Cập nhật 22/10 tối\n\n## Yêu cầu\nChủ dự án (22/10): email hằng ngày không phải báo cáo doanh thu mà là **luận giải lá số của mình theo từng ngày**: những điều cần lưu ý cho hôm nay và cả ngày mai.\n\n## Cách làm (TienIch.gs › mục 8)\n- Sheet `VanNgay`: Tài khoản, Email, Lá số (JSON), Đăng ký lúc, Gửi gần nhất, Trạng thái. **Lá số lưu trong sheet, không ghi vào mã** (repo công khai).\n- API:\n  - `dangKyVanNgay(input, email, token)`: chỉ chủ sở hữu và VIP (`ttToanQuyen_`); thay dòng cũ cùng email; gửi ngay bản thử.\n  - `huyVanNgay`, `dsVanNgay`.\n- Nội dung:\n  - `tiVanNgayDuLieu_` gọi `lapLaSoDayDu_` với `viewDate` = hôm nay, lấy `chiTiet.nhatVan[0..1]`, `tongHop.ngay[0..1]` (điểm 4 hệ) và tháng hiện tại trong `hoSoThang`.\n  - `tiVanMotNgay_` dựng văn dễ hiểu từ dữ liệu cấu trúc, không nêu tên sao:\n    - lời khuyên theo quan hệ can ngày với bạn (`TI_VN_TT`, 10 loại);\n    - lĩnh vực nổi bật (cung ngày → `LG_LINH_VUC`);\n    - khí ngày hợp hay không hợp (`danhGiaVan_`);\n    - xung, hợp tuổi; trong nhà dễ bất đồng; ngày dễ gặp người giúp;\n    - nên, tránh theo trực; Mặt Trăng và ngày cá nhân thần số;\n    - giờ tốt, hướng tốt, hoàng đạo hay hắc đạo (có giải nghĩa).\n  - Hai tầng không mâu thuẫn: ngày xung tuổi hạ nhãn tối đa \"Ngày bình\"; ngày xung hoặc ngày kém thì bỏ các việc lớn khỏi mục \"Nên\".\n  - `tiVanNgayHtml_`: email nền sáng, màu Bạch Kim. Hôm nay đầy đủ, ngày mai rút gọn, kèm bối cảnh tháng âm lịch.\n- Gửi:\n  - `guiVanNgay` (trigger 6 giờ sáng; mỗi email một lần mỗi ngày).\n  - `caiDatVanNgay` / `tatVanNgay` chạy trong trình soạn thảo.\n- Giao diện (Script.html):\n  - Thẻ \"🌅 Luận giải hằng ngày qua email\" trong tab Tiện ích, chỉ hiện khi `toanQuyen()`.\n  - `tiVanNgay`; nút \"Ngừng nhận\" (`data-huy-van-ngay`).\n  - `veTienIch` vẽ lại khi quyền đổi (`pg._toan`).\n- `BAN_MOI_CAN_CO` thêm `'TienIch.gs': ['guiVanNgay', 'tiGuiVanNgay_']`. Mã giao diện `2026.10.22.2`.\n\n## Làm dày nội dung (22/10, sau)\nChủ dự án thấy email sơ sài → làm lại theo đề xuất (chỉ sửa `TienIch.gs`):\n- Mở đầu mỗi ngày: nhãn ngày + **chip 4 hệ** (Tử Vi theo `nv.danhGia`, Bát Tự theo khí ngày, Chiêm tinh theo nhà Mặt Trăng: 1/5/9/10/11 thuận, 6/8/12 cần giữ, Thần số theo `TI_VN_SO`).\n- **4 lĩnh vực** Công việc / Tiền bạc / Tình cảm – gia đình / Sức khỏe: câu gốc theo nhóm quan hệ can ngày (`TI_VN_NHOM` → `TI_VN_LV`, 5 nhóm × 4 mảng, có mức +1/0/-1); cộng câu mảng nổi bật (cung ngày → `TI_VN_CUNG_LV`), khí ngày, xung/hợp tuổi, xung trong nhà, người giúp, Mặt Trăng (`TI_VN_NHA_LV`). Mức \"thuận / bình / cần giữ\" (`tiVanMuc_`); ngày xung hoặc kém không gắn \"thuận\".\n- **Lịch theo buổi** sáng/chiều/tối: giờ Hoàng đạo không xung tuổi là giờ đẹp; \"giờ đẹp nhất\" ưu tiên giờ hợp hành của bạn.\n- **Điều kiêng lịch cổ** bằng lời ngày nay (`TI_VN_KY_CAN`, `TI_VN_KY_CHI`); bỏ khỏi \"Nên\" việc lịch cổ kiêng (`TI_VN_KY_BO`) và lễ lớn trong ngày Hắc đạo.\n- Hôm nay có \"Một việc nhỏ nên làm\" (`TI_VN_VIEC_NHO`) + màu, số hợp; ngày mai đầy đủ như hôm nay + \"Chuẩn bị từ tối nay\" (`tiVanChuanBi_`).\n- Bối cảnh tháng viết lại bằng lời đời thường (`TI_VN_THANG`, việc dễ đến, nên để ý, nhịp tháng) + mốc đang hiệu lực hoặc trong 7 ngày tới (`tiVanMocGan_`).\n- Sửa lỗi chữ: ngày mai không còn mở đầu bằng \"Hôm nay mọi việc…\".\n\n## Gửi thêm qua Zalo (22/10, tối)\nChủ dự án chốt: **dùng chung bot Zalo của Trợ lý KPI, bỏ bản tin sản xuất 7 giờ của KPI** (chủ dự án tự xóa trigger `guiBanTinSang` bên dự án Trợ lý KPI – không sửa mã nhánh KPI).\n- Thuộc tính tập lệnh của Thiên Cơ Các: `ZALO_TOKEN` (cùng token bot KPI) và `ZALO_CHAT_ID` (chép giá trị `CHU_CHAT_ID` bên dự án Trợ lý KPI). Chủ dự án tự dán, không ghi vào mã. Không cần webhook: chỉ gọi `sendMessage`.\n- `tiZaloCo_`, `tiZaloGui_` (chia khúc ≤1900 ký tự, báo lỗi nếu Zalo từ chối), `tiVanNgayZalo_` (2 tin chữ thường: hôm nay đầy đủ gọn, ngày mai + tháng).\n- `guiVanNgay`: email như cũ; dòng của chủ sở hữu (`TK_CHU`) gửi thêm Zalo, mỗi lá số một lần/ngày; lỗi Zalo không làm hỏng email. `dangKyVanNgay` của chủ sở hữu gửi thử cả Zalo. `thuZaloVanNgay()` chạy trong trình soạn thảo để thử ngay.\n- `BAN_MOI_CAN_CO` TienIch đổi thành `['guiVanNgay', 'tiZaloCo_']`.\n\n## Kiểm thử\n- `tests/van-ngay.js` đạt 1599/1599 (thêm phần Zalo; 1590 sau khi làm dày; trước đó 628).\n- Đã chụp thử email cho lá số chủ dự án: chỉ giữ trong scratchpad và gửi trong chat, không vào repo.\n\n## Mở rộng sau (chưa làm)\n- Bán cho khách như sản phẩm định kỳ (giá theo tháng), nếu chủ dự án muốn.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Luận giải hằng ngày qua email.md", "lk": ["TCC Tiện ích bán lẻ", "TCC Báo cáo ngày", "TCC Vận hạn chuyên sâu và biến cố"]}, {"id": "TCC Lá số 3D", "nhom": "Thiên Cơ Các", "txt": "# TCC Lá số 3D\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Giao diện]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\n- **Lá số 3D (Tử Vi + Bát Tự) – file Tập lệnh tùy chọn `LaSo3D.gs`:** khuôn `demo/la-so-3d.tpl.html` và `demo/bat-tu-3d.tpl.html` → `node tools/demo-3d.js ['{json input}']` dựng 2 trang demo **và** `LaSo3D.gs` (đừng sửa tay; sửa khuôn rồi chạy lại). **Không dùng file HTML cho phần này:** `HtmlService.createHtmlOutputFromFile` từ chối HTML nó cho là “sai định dạng” và `includeTuyChon` nuốt lỗi → 3D biến mất âm thầm (đã gặp với `LaSo3D.html`). `LaSo3D.gs`: `layMa3D()` trả mã JS (mảng dòng ngắn ≤ ~550 ký tự để dán vào trình soạn thảo an toàn), `kiemTra3D()` để chủ dự án tự kiểm tra. Mã JS chứa 2 khuôn + `duLieuTV/duLieuBT` (rút dữ liệu từ `lapLaSo`), mở toàn màn hình trong iframe `srcdoc` (`#ls3dNen`, nút ✕ Đóng, Esc) → `window.moLaSo3D(r, input)`, `window.moBatTu3D(r, input)`. Trong khuôn: Three.js nạp lần lượt jsdelivr → unpkg (`window.__cho3D`), lỗi chạy hiện ngay ở `#loi`. Script.html: `mo3D('tv'|'bt')` (lần đầu `call('layMa3D')` rồi chèn thẻ script), nút `[data-ls3d]` (thanh công cụ lá số, thẻ hồ sơ), `[data-bt3d]` trong khung `veMoi3D` đầu tab Bát Tự (CSS `.xem3d`); PDF bỏ các nút/khung này. **Tứ Trụ 3D** (`bat-tu-3d.tpl.html`): 4 cột trụ trên đàn tròn (đá chân = Địa Chi, lõi pha lê = tàng can, đầu cột = Thiên Can có tranh `VE_CAN` 10 hình tượng), bánh xe ngũ hành (quả cầu theo `phanTram`, vòng sinh vàng, đường khắc mờ, vầng dụng thần/kỵ), đường hợp – xung giữa các trụ (`capTru`, `laCan`), vòng cung đại vận phía sau, 11 chặng luận (`BUOC`: dùng văn `deHieu.battu` + câu tự sinh không thuật ngữ; `TT` giải nghĩa thập thần). Tử Vi 3D (bản 10/2026, theo ảnh mẫu của chủ dự án): **thiên địa bàn 4×4 như lá số giấy, chỉ nổi khối 3D** (Three.js module + bloom nhẹ qua importmap, dự phòng UMD). Mỗi ô (`veThe`, giấy ngà + tranh thủy mặc mờ theo `BANG` ngũ hành, khung vàng): tên cung, huy hiệu hành, đại hạn, can chi, Thân, Tuần/Triệt, **tên chính tinh thật** kèm độ sáng và tứ hóa (màu theo hành `CHU_HANH`), **phụ tinh hai cột** (tốt trái, xấu phải), tràng sinh `ts`, địa chi, điểm. Ô giữa là tấm Thiên Bàn (`veTam`, bốn trụ `D.tru`), băng \"Tử Vi 12 cung\" (`veBang`). Chọn cung: ô nâng lên, nghiêng về người xem, tam hợp – xung chiếu vẽ dần; bấm vào tên chính tinh mở chi tiết. **3D là chế độ xem mặc định của tab Lá số** (Script.html › `ve3DMacDinh`, `datCheDo`, `napMa3D`; nút `[data-che-do=3d|2d]`, nhớ ở `localStorage.tccCheDo`; CSS `#chartArea.xem-3d`, `.ls3d-khung`): nhúng iframe bằng `window.nhung3D(el, loai, r, input)` (khuôn nhận `D.nhung` → lớp `html.nhung`: ẩn tiêu đề, sân khấu cao cố định 720/540px, cuộn chuột chỉ phóng to sau khi bấm vào lá số hoặc giữ Ctrl; khung ngoài tự khớp chiều cao theo `body`). Thiếu LaSo3D.gs / không WebGL → tự về 2D; lá số 2D vẫn dựng sẵn, `chupLaSo` hiện tạm để tải ảnh/PDF. **Chủ dự án không muốn tên hình mẫu (\"Người mẹ hiền\"…)**: khung bên phải ghi tên sao thật, bộ sưu tập hình mẫu đã bỏ khỏi trang 3D. Các mô tả cũ dưới đây (đền, đèn dẫn đường, sprite hình mẫu) là bản trước; 14 chính tinh thành \"hình mẫu\" (`HM`: biểu tượng, tên hình mẫu, nhân vật Phong Thần, mặt sáng/tối, lời khuyên; vẽ canvas `veHinhMau`), cung vô chính diệu mượn hình mẫu cung đối (mờ), đường tam hợp (vàng) – xung chiếu (lam), đèn dẫn đường nhảy qua 12 cung theo thứ tự Mệnh → Phụ Mẫu (`diToi`, `tuChay`), thẻ luận dễ hiểu không nêu tên sao (`vanCung`). Phụ tinh: 59 hình mẫu (`PT`: biểu tượng, tên hình mẫu, họ, ý nghĩa) chia 8 họ (`NHOM_PT`, mỗi họ một lời khuyên), là huy hiệu tròn (`veHuy`, viền vàng = sao tốt, đỏ = sao xấu theo vị trí trong `cat/hung`) xoay quanh đền, bấm được (`moPT`); thẻ cung có mục \"Nhân vật phụ quanh cung\" (`ptChips`), văn dễ hiểu nêu tên hình mẫu (không nêu tên sao); bộ sưu tập theo họ (`veBoPT`). Tranh tự vẽ bằng SVG (không dùng emoji): `TRANH` (14 chính tinh, khung 200, nét vàng kim + quầng ngũ hành) và `HIEU` (59 phụ tinh, nét mảnh khung 100, màu nét theo tốt/xấu); `napTranh()` nạp trước thành ảnh rồi mới dựng thẻ canvas/texture (`ANH`); rà soát bằng bảng xem tất cả hình trước khi đổi nét. Thử trong sandbox: chặn jsdelivr thì route tới `three/build/three.min.js` cài bằng npm, chạy Chromium với `--use-angle=swiftshader --enable-unsafe-swiftshader`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Lá số 3D.md", "lk": ["TCC Giao diện", "TCC Kiểm thử", "00 Mục lục"]}, {"id": "TCC Lập lá số và bốn tầng luận", "nhom": "Thiên Cơ Các", "txt": "# TCC Lập lá số và bốn tầng luận\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Văn dễ hiểu và Tổng hợp 6 hệ]] · [[TCC Sáu hệ]] · [[TCC Bán hàng]] · [[00 Mục lục]]\n\n- **Lập lá số:**\n  - `Code.gs › lapLaSoDayDu_` → `lapMoRong_` gọi các hệ phụ, `tongHopLuan` (TongHop.gs) và `deHieuLap_` (DeHieu.gs).\n  - `TaiKhoan.gs › lapLaSo(input, token)` áp quyền. **Từ 10/2026: mọi người (kể cả chưa đăng nhập) nhận bản đầy đủ luận giải 6 hệ**; máy chủ chỉ cắt phần khóa: `ttCatPhan_` (vận hạn, biến cố, phối ngẫu) và `ttCatTongHop_` khi chưa có `co_ban` (bỏ `deHieu.th6/tongHop`, các mục Tổng hợp trong `moRong.tongHop`; gắn `r.th6 = th6Moi_(r)` làm mồi, `r.tongKhoa = true`). `khachRutGon_` không còn dùng.\n- **Bốn tầng luận** (thiết kế của chủ dự án):\n  1. Dữ liệu.\n  2. Facts: `taoFact_` trong Facts.gs, gồm he / linhVuc / nhom / loai / yNghia / trongSo.\n  3. Kho văn: `renderVanCung_` trong Script.html; TuViHeThong.gs sinh văn 12 cung.\n  4. Đồng thuận 6 hệ: `dhTongHop_` trong DeHieu.gs, gồm 9 lĩnh vực và điểm /10.\n- **Thang điểm:** điểm thô → /10 bằng `chuanHoa10_(d) = round(100/(1+e^(-d/3)))/10`. Nhãn phải khớp điểm (có bài kiểm tra).\n", "duong": "bo-nao/Thiên Cơ Các/TCC Lập lá số và bốn tầng luận.md", "lk": ["TCC Văn dễ hiểu và Tổng hợp 6 hệ", "TCC Sáu hệ", "TCC Bán hàng", "00 Mục lục"]}, {"id": "TCC Lịch sử lá số", "nhom": "Thiên Cơ Các", "txt": "# TCC Lịch sử lá số\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Kiểm thử]] · [[00 Mục lục]]\n\n- **Lịch sử lá số (Code.gs):** trùng = cùng tài khoản + họ tên (bỏ hoa/thường, khoảng trắng) + giới tính + ngày dương + giờ + phút (`lsKhoa_`). `luuLichSu_` xóa bản cũ trùng trong 400 dòng gần nhất rồi ghi bản mới; `getLichSu` ẩn trùng; `donLichSu(token)` (nút \"🧹 Dọn lá số trùng\") xóa trùng cũ trong Sheet.\n- `google.script.run` **không trả được Date**, ra null. Vì vậy lịch sử dùng `getDisplayValues` và ghi ngày có tiền tố `'`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Lịch sử lá số.md", "lk": ["TCC Kiểm thử", "00 Mục lục"]}, {"id": "TCC Nghiệm chứng", "nhom": "Thiên Cơ Các", "txt": "# TCC Nghiệm chứng\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Bán hàng]] · [[TCC Văn dễ hiểu và Tổng hợp 6 hệ]] · [[00 Mục lục]]\n\n- **Nghiệm chứng:** từ 6/8 nhóm \"đúng cao\" trở lên là xác nhận, 4–5 nhóm là có thể đúng. Mã hiện quy ra tỷ lệ kèm ngưỡng %.\n- **NghiemChung.gs (v6 trên nền v5):** thêm câu đồng thuận từ `th6` (`ncLv_`), năm đã qua từ ≥3 hệ cùng báo (`ncNamQua_`, bỏ năm trước 16 tuổi, gộp cùng năm), phiếu 3 hệ Tử Vi – Bát Tự – Hà Lạc cho anh em / cha mẹ (`ncBaHe_`).\n- **NghiemChung.gs (v5):** 8 nhóm mô tả để khách tự chấm độ khớp giờ sinh, **lấy kết luận từ tổng hợp 6 hệ** (TongHop: vóc dáng, dấu vết cơ thể, trục tính cách, xuất thân, phối ngẫu + năm cưới đã qua, con cái, nghề, chặng đời) và đối chiếu Tử Vi × Bát Tự. Mỗi câu có nhãn đồng thuận; bỏ câu thiểu số (<1/3) và câu \"cân bằng\"; nhóm có độ tin làm trọng số; có lựa chọn \"Không áp dụng\".\n- **Phễu nghiệm chứng:** `phieuNc` trong Script.html. Khớp → mời mở; nửa khớp → dò giờ; không khớp → nói thật \"phương pháp có thể không hợp với bạn, đừng mua\".\n", "duong": "bo-nao/Thiên Cơ Các/TCC Nghiệm chứng.md", "lk": ["TCC Bán hàng", "TCC Văn dễ hiểu và Tổng hợp 6 hệ", "00 Mục lục"]}, {"id": "TCC PDF", "nhom": "Thiên Cơ Các", "txt": "# TCC PDF\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Giao diện]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\n- **PDF bản đầy đủ (~82 trang, ~70 giây):** mỗi hệ lấy biểu đồ chính (`PDF_CHINH`) + văn dễ hiểu + các phần luận lĩnh vực/tổng hợp/lời khuyên (`PDF_LUAN`, theo `data-g` của khung Phần/Bước); Tử Vi lấy ảnh lá số + Phần 1 chân dung + Phần 3 Tử Vi × Bát Tự; vận hạn bỏ lịch ngày. Không chép bảng kỹ thuật. `tg-head` được coi là tiêu đề để không mồ côi cuối trang.\n- **PDF:** `xuatPdf` trong Script.html dựng từ nội dung đang hiển thị.\n  - `chuanHoa` bỏ giao diện bán hàng (thẻ khóa, ưu đãi, bảng giá).\n  - Các mục: tom, linhvuc, nguoi, duyen, doi, vh, bien, chart, battu, astro, so, hd, halac, them. Nhóm hiển thị theo `PDF_NHOM`.\n\n## Thiết kế lại (22/10/2026, chủ dự án chê \"hơi loạn\")\nBản cũ chụp lại các thẻ giao diện web (97 trang, 23 MB, nhiều chip/nhãn kỹ thuật, khung \"↳ tiếp\" cắt ngang). Bản mới **dựng riêng cho khổ A4 từ dữ liệu luận giải**, không chụp giao diện:\n- Script.html › mục XUẤT PDF: khối dựng sẵn `bcMo` (trang mở chương), `bcH2/bcH3`, `bcDs` (danh sách có chấm màu thuận/cần lưu ý, chữ nhỏ ghi hệ nào nói), `bcBang`, `bcHop` (ô lời khuyên), `bcO` (ô số liệu), `bcVach`/`bcThanh` (thanh điểm vẽ bằng gradient nền – html2canvas bỏ sót khối con rỗng và cắt khi có `overflow:hidden` + bo góc), `bcKhoa` (phần chưa mở).\n- Nội dung theo phần: `pdfTom` (tomLuoc + 10 mật mã), `pdfLinhVuc` (deHieu.th6: bảng điểm 9 lĩnh vực, từng lĩnh vực, năm nên hành động), `pdfNguoi`, `pdfDuyen` (phoiNgau, tuổi hợp, năm kết hôn/sinh con), `pdfDoi` (chặng đời, nghề), `pdfVh` (daiVanSau – chi tiết 4 đại vận từ hiện tại, hoSoNam, hoSoThang), `pdfBien` (bienCo.nong, hoiTu), `pdfChart` (ảnh lá số + 12 cung qua `taoCungDeHieu_`), `pdfHe` (bảng Tứ Trụ/ngũ hành, hành tinh, các số, HD, quẻ + deHieu.khoi), `pdfThem` (bảng may mắn). Phần thiếu dữ liệu (máy chủ đã cắt) thì in dòng 🔒 hoặc bỏ phần.\n- Bản xem thử: `demoPhan` (res.teaser: hé lộ + \"trong bản đầy đủ\"), các phần chạy liền mạch (`bcMo(..., nho)`), trang mời mua `trangMua`.\n- Giao diện: CSS khối \"BÁO CÁO PDF (bc-*)\" cuối Styles.html; nền giấy ngà `bc-sang` (mặc định) hoặc than ấm `bc-toi`; lề trang 42/46/50 pt, nội dung rộng 760 px; mục lục có số trang + ô \"Cách đọc báo cáo\"; chân trang số trang. Bìa giữ kiểu cũ (tối, vòng hoàng đạo).\n- Kết quả với lá số mẫu: đầy đủ 55 trang ~13 MB, xem thử 11 trang ~2 MB. Mã giao diện `2026.10.22.3`.\n- Xuất thử trong phiên đám mây: `cd tests && npm install --no-save html2canvas@1.4.1 jspdf@2.5.1`, rồi `python3 tools/xem-truoc.py && PW=/opt/node22/lib/node_modules/playwright node tools/xuat-pdf.js /đường/dẫn.pdf` (`TYPE=demo`, `THEME=dark`). Xem trang bằng `pdftoppm`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC PDF.md", "lk": ["TCC Giao diện", "TCC Kiểm thử", "00 Mục lục"]}, {"id": "TCC Sáu hệ", "nhom": "Thiên Cơ Các", "txt": "# TCC Sáu hệ\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Lập lá số và bốn tầng luận]] · [[TCC Vận hạn chuyên sâu và biến cố]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\n- **BatTuPhanTich.gs:** Bát Tự theo quy trình 9 bước (vượng suy Thiệu Vĩ Hoa, dụng thần 4 phương pháp + bảng ưu tiên, cách cục đủ ngoại cách, cát hung, phương diện, đại vận, lưu niên đặc biệt). `batTuLap` gọi `btPhanTich_` rồi ghi đè `vuong/cuong/tyLeTro/phanTram/goiY` (giữ quy ước `goiY.hy[0]` = dụng thần) để mọi module dùng chung. Tab Bát Tự hiển thị theo Bước 1–9.\n- Chủ dự án muốn làm **kỹ từng hệ một**. Đã xong (22/10 bổ sung nguyên đường đúng sách, tam phúc thần, 10 thể cách, điều hậu – [[TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn]]): Bát Tự 9 bước; Hà Lạc lục hào (HaLac.gs: `hlLucHao_` nạp giáp/Thế Ứng/lục thân/lục thú/phục thần/vượng suy theo tháng–ngày sinh/không vong/hào động hóa; `hlLinhVuc_` 8 lĩnh vực; `hlThoiVi_` hóa công – nguyên khí; `hlQueKhac_` Biến/Thác/Tổng). Thần số học 6 bước (ThanSoHoc.gs `tsPhanTich_`: chỉ số cốt lõi + bổ sung, nợ nghiệp, chu kỳ năm/tháng/ngày, 4 đỉnh cao, luận 5 lĩnh vực, lời khuyên, trường hợp đặc biệt; tab 8 phần có biểu đồ ngày sinh/tên/tổng hợp, đỉnh cao, chu kỳ 9 năm, tháng, lịch 30 ngày, ô \"Thử tên\"). Chiêm tinh 7 bước (ChiemTinh.gs `ctPhanTich_`: giờ sao, Nút Nam/Chiron/Lilith, Big Three, 12 nhà, cấu hình Stellium/T-Square/Grand Trine/Grand Cross/Yod, 8 lĩnh vực, `ctChuKyThoiGian_` transit/tiến triển/Solar Arc/Solar Return/Lunar Return, lời khuyên, trường hợp đặc biệt; `ctSoSanh_` nhà chồng lấn/Composite/Davison dùng trong CapDoi; tab 8 phần có lưới góc chiếu). Human Design 11 bước (HumanDesign.gs `hdPhanTich_`: 5 loại, 7 thẩm quyền, định nghĩa + cổng cầu nối, 12 hồ sơ, 9 trung tâm, 36 kênh theo mạch cá nhân/hợp tác, 64 cổng đen–đỏ/treo/trống, 4 biến số từ màu – tông, hồi quy Mặt Trời, chu kỳ 7 năm, transit, luận tổng hợp; tab 11 phần). **Cả 6 hệ đã làm lại theo quy trình của chủ dự án.** Việc có thể làm tiếp: chờ chủ dự án góp ý sau khi dán; PDF đã kiểm tra (82 trang; trong sandbox cdnjs bị chặn nên phải chép html2canvas/jspdf vào tests/node_modules để thử).\n", "duong": "bo-nao/Thiên Cơ Các/TCC Sáu hệ.md", "lk": ["TCC Lập lá số và bốn tầng luận", "TCC Vận hạn chuyên sâu và biến cố", "TCC Kiểm thử", "00 Mục lục", "TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn"]}, {"id": "TCC Tiến trình", "nhom": "Thiên Cơ Các", "txt": "# TCC Tiến trình\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Sáu hệ]] · [[Việc chờ chủ dự án]] · [[00 Mục lục]]\n\n**Đã xong** (xem `git log`):\n- Lá số và 6 hệ; tài khoản, ví xu, payOS; cặp đôi.\n- Văn dễ hiểu 12 cung (của chủ dự án) và 5 hệ, cùng phần đồng thuận 6 hệ.\n- Nghiệm chứng theo sách cổ.\n- Bán theo giai đoạn, tab Vận hạn, gói gia đình, bản miễn phí có phễu.\n- PDF theo bố cục mới.\n\n**Việc có thể làm tiếp / còn ngỏ:**\n- Bản PDF xem thử: mục \"Kết hợp 6 hệ theo lĩnh vực\" chưa có ảnh xem trước mờ, trông trống (có thể bỏ khỏi bản xem thử).\n- Giá bán là mức khởi đầu, chưa qua thử nghiệm; nên xem doanh thu trong Quản trị rồi điều chỉnh.\n- Chủ dự án nên đổi mật khẩu chủ sở hữu sau lần đăng nhập đầu, nếu chưa đổi.\n\n**Phiên 21–22/10/2026 (tóm tắt):**\n- Phương pháp Tử Vi: nghiên cứu aituvi + nhiều trang Việt/nước ngoài (chỉ phần công khai). Thêm `TuViTamPhap.gs`: ba vòng nhân sinh, thế Mệnh–Thân, đại vận đắc thời, Phi Tinh (tham khảo). – [[TCC Tử Vi đối chiếu các phái]]\n- Trang riêng tư lá số chủ dự án (artifact, không vào repo). – [[Quyết định của chủ dự án]]\n- Giao diện: tối sang trọng → demo bento + biểu đồ động → màu Bạch Kim (đã duyệt) → áp vào app: bảng điều khiển `#bdk`, hiệu ứng nền. – [[TCC Giao diện]]\n- Cập nhật code: thử GitHub Actions rồi bỏ; dùng bộ bấm đúp clasp `tuvi-app/cai-dat-clasp/` (dự phòng raw + `ds-file.txt`). – [[TCC Tự đẩy code lên Apps Script]]\n- Email luận giải hằng ngày (hôm nay + ngày mai) cho chủ sở hữu / VIP. – [[TCC Luận giải hằng ngày qua email]]\n- 22/10 tối: email luận giải hằng ngày làm dày theo lĩnh vực. – [[TCC Luận giải hằng ngày qua email]]\n- 22/10: PDF thiết kế lại cho khổ A4, dựng từ dữ liệu (55 trang, nền giấy ngà). – [[TCC PDF]]\n- 22/10: Hà Lạc sửa hào nguyên đường + tam phúc thần + 10 thể cách; Tứ Trụ thêm điều hậu 10 can × 12 tháng. – [[TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn]]\n- 23/10: giao diện theo 4 chuyên gia; Chiêm tinh sect + Fortune/Spirit, Thần số chữ chuyển tiếp, HD câu tự hỏi. – [[TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu]]\n- Kiểm thử đều đạt: cai-dat 83, chiem-tinh 1820, than-so 2651, human-design 2100, ha-lac 8401, bat-tu 4008, tam-phap 14659, van-ngay 1590, tong-hop 3088, ho-so-nam 3867, van-sau 2924, nghiem-chung 967, tien-ich 55, tai-khoan, thanh-toan.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Tiến trình.md", "lk": ["TCC Sáu hệ", "Việc chờ chủ dự án", "00 Mục lục", "TCC Tử Vi đối chiếu các phái", "Quyết định của chủ dự án", "TCC Giao diện", "TCC Tự đẩy code lên Apps Script", "TCC Luận giải hằng ngày qua email", "TCC PDF", "TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn", "TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu"]}, {"id": "TCC Tiện ích bán lẻ", "nhom": "Thiên Cơ Các", "txt": "# TCC Tiện ích bán lẻ\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Bán hàng]] · [[TCC Báo cáo ngày]] · [[00 Mục lục]]\n\n- **Tiện ích bán lẻ (TienIch.gs + Script.html › `veTienIch`, `tiChay`, `tiKqHtml`; tab `ti` \"✦ Tiện Ích\"):** 7 công cụ, mỗi công cụ có phần hé lộ miễn phí + phần trả phí, luôn kèm mục \"Cơ sở\" và câu \"chỉ để tham khảo\" (`TI_THAM_KHAO`). API `tienIch(input, loai, thamSo, token)`:\n  - `xem_tuoi` (9 xu): Kim Lâu, Hoang Ốc, Tam Tai theo tuổi mụ; miễn phí năm nay, trả phí bảng 10 năm + hóa giải.\n  - `phong_thuy` (19 xu): cung phi Bát trạch (`tiCungPhi_`), miễn phí hướng Sinh Khí, trả phí 8 hướng + bố trí.\n  - `chon_ngay` (9 xu/việc/tháng, mã `ngay:<việc>:<yyyy-mm>`): chấm điểm ngày (hoàng đạo, trực, tú, Tam Nương, Nguyệt Kỵ, xung tuổi, Bành Tổ); \"Nên tránh\" khi xung tuổi hoặc điểm ≤ −4.\n  - `hop_tac` (19 xu, khóa theo cặp như `cap_doi`), `dat_ten` (29 xu, từ điển `TI_TEN` theo ngũ hành dụng thần).\n  - `gieoQue` (Mai Hoa theo thời gian; câu đầu miễn phí, sau đó 9 xu/câu; sheet `GieoQue`).\n  - `dangKyBanTin` (39 xu, 12 tháng; email hằng tháng qua `guiBanTinThang`, chủ dự án chạy `caiDatBanTin` một lần để tạo trigger).\n  - `xem_tuoi`, `phong_thuy` nằm trong `TT_TRON_GOI`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Tiện ích bán lẻ.md", "lk": ["TCC Bán hàng", "TCC Báo cáo ngày", "00 Mục lục"]}, {"id": "TCC Tổng quan", "nhom": "Thiên Cơ Các", "txt": "# TCC Tổng quan\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Lập lá số và bốn tầng luận]] · [[TCC Bán hàng]] · [[TCC Tiến trình]] · [[00 Mục lục]]\n\n## Dự án\n- Web app **Google Apps Script** luận vận mệnh 6 hệ: Tử Vi, Bát Tự, Hà Lạc, Chiêm tinh, Thần số học, Human Design. Có bán nội dung bằng **xu**.\n- Toàn bộ mã nằm trong `tuvi-app/`:\n  - 26 file `.gs` (chạy chung một phạm vi toàn cục như Apps Script).\n  - `Index.html`, `Styles.html`, `Script.html`, `Anh.html` (tùy chọn) và `NghiemChungUI.html`.\n  - Bảng vai trò từng file: `tuvi-app/README.md`. Hướng dẫn cài đặt cho chủ dự án: `tuvi-app/HUONG-DAN-CAI-DAT.md`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Tổng quan.md", "lk": ["TCC Lập lá số và bốn tầng luận", "TCC Bán hàng", "TCC Tiến trình", "00 Mục lục"]}, {"id": "TCC Tử Vi đối chiếu các phái", "nhom": "Thiên Cơ Các", "txt": "# TCC Tử Vi đối chiếu các phái\n\nNhóm: Thiên Cơ Các · Tạo 21/10/2026\nLiên quan: [[TCC Sáu hệ]] · [[TCC Lập lá số và bốn tầng luận]] · [[TCC Giao diện]] · [[Việc chờ chủ dự án]]\n\n## Yêu cầu của chủ dự án (21/10)\n- Nghiên cứu cách luận Tử Vi trên aituvi.com và các trang tương tự (trong nước + nước ngoài), lập lá số giả định, học rồi đưa vào Thiên Cơ Các.\n- **Ưu tiên số 1 là phương pháp luận giải** (\"chất lượng của toàn bộ web nằm ở phần đó\"); giao diện xử lý sau.\n- Không đăng nhập tài khoản của chủ dự án trên trang khác (bộ an toàn chặn; không nhận mật khẩu qua chat). Chỉ xem phần miễn phí, không lách lớp khóa trả phí, không lách chặn bot.\n\n## Đã khảo sát (21/10)\n| Trang | Phái / cách luận | Điều học được |\n|---|---|---|\n| aituvi.com (Horus AI, VN) | Chỉ Tử Vi; văn do AI viết theo khung cố định | Khung tổng quan miễn phí: mở bài → Mệnh chính tinh + miếu hãm → bộ sao tam hợp (Cơ Nguyệt Đồng Lương, Âm Dương Lương…) → **\"mẫu người\" vòng Thái Tuế** (Tuế Hổ Phù, Phù Dương Đức…) → Thân cư → điểm yếu (cung kém) → đại vận hiện tại → tiểu vận 3 năm → kết. Điểm 0–100 cho 12 cung + Thân + tổng, biểu đồ radar. Giá: 319k (12 cung + 10 đại vận + Cách cục), 1.450k (vận hạn), 1.999k (trọn bộ 14 chuyên đề); chuyên đề Cách cục 150 xu; trợ lý AI chat. Chưa có xem hợp hai người. |\n| tuvi.cohoc.net (Tử Vi Cổ Học, VN) | 7 \"cách xem\": Phổ biến, Bắc phái, Nam phái, Tổng hợp, Phi tinh, Tạp luận, Trung châu | Chặn trình duyệt tự động (ua-limit) – không lách. Bài về phương pháp phái Thiên Lương dùng vòng Thái Tuế. |\n| Tian Qi – masterseanchan.com (Singapore) | Bát Tự + Tử Vi + Kỳ Môn + Chiêm tinh phương Tây, đối chiếu chéo | Cùng triết lý \"nhiều hệ, chỗ đồng thuận thì chắc, chỗ kéo ngược thì nêu ra\" như Thiên Cơ Các. Bảng chỉ số đầu trang (thanh vượng – nhược, 3 dấu ✓/✗ đắc lệnh – đắc địa – đắc thế, chip dụng/hỷ/kỵ/cừu/nhàn thần), công tắc lớp Thần sát / Hình xung hợp, mồi \"Năm 2027 của bạn\" không cần giờ sinh. |\n| ziwei.pub (dùng iztro, Trung Quốc) | Tam hợp + Phi tinh; có Bát Tự, Mai Hoa, Kỳ Môn | Công cụ \"Tìm giờ sinh\" bằng câu hỏi, trang thống kê sao, hỏi đáp AI. iztro có `isOriginalPalace` (Lai Nhân cung), `fliesTo`, `selfMutaged`, giáp cung. |\n| lichngaytot.com, yeutuvi.com (VN) | Luận chung theo năm sinh | Ít giá trị cho luận cá nhân. |\n\n## Phương pháp đã đúc kết và đưa vào app (`TuViTamPhap.gs`, 21/10)\n- **Ba vòng nhân sinh** (phái Thiên Lương – \"Tử Vi Nghiệm Lý\"; Tử Vi Chân Cơ):\n  - Vòng Thái Tuế = thế đứng, gồm 4 nhóm tam hợp: Tuế–Hổ–Phù chính danh, Dương–Phù–Đức lanh lợi, Tang–Phá–Điếu đấu tranh, Âm–Long–Trực nhẫn nại.\n  - Vòng Lộc Tồn (Bác Sĩ) = thực lực, 4 nhóm.\n  - Vòng Tràng Sinh = nhịp thịnh suy, 4 nhóm.\n  - `TP_TT_NHOM`, `TP_LT_NHOM`, `TP_TS_NHOM`, `tpBaVong_`.\n- **Tám thế Mệnh – Thân** so với hành tam hợp của Thái Tuế (`tpTheMenhThan_`; quân tử chính danh, lời cứng việc ngay, nghĩ hay hơn làm…). Ngoài 8 thế thì luận từng vế.\n- **Mệnh – Di** luôn đối nhóm (Tuế ↔ Tang, Dương ↔ Âm): `TP_MENH_DI`.\n- **Tuế Lộc**: Lộc Tồn nằm trong tam hợp Thái Tuế thì có thực lộc suốt đời; nếu không, liệt kê các đại vận đi qua tam hợp Lộc Tồn.\n- **Đại vận \"đắc thời\"** (`vanThaiTue`): đại vận nằm ở tam hợp Thái Tuế.\n  - Tại Thái Tuế: chính đáng. Tại Quan Phù: nhờ tính toán. Tại Bạch Hổ: vất vả.\n  - Các nhóm khác có lời riêng, kèm tiền bạc theo vòng Lộc Tồn.\n  - Chỉ hiện đến 90 tuổi.\n- **Phi Tinh** (`tpPhiTinh_`; phái Đài Loan hiện đại, cổ thư ít ghi): **tham khảo, không cộng điểm**.\n  - Lai Nhân cung: can cung = can năm, bỏ Tý/Sửu. Khớp iztro trên 119 lá số.\n  - Tự hóa 12 cung.\n  - Mệnh phi Lộc/Kỵ; cung khác phi Lộc/Kỵ nhập Mệnh; Kỵ nhập Thiên Di (xung Mệnh); Tài Bạch/Quan Lộc phi Kỵ.\n- **Kết quả:** `chiTiet.tamPhap` = { baVong { de, ky, menh, the, tueLoc }, vanThaiTue, phiTinh, coSo }, gọi từ `LuanGiai.gs › luanChiTiet` (có `typeof`).\n  - Văn `de` không nêu tên sao; tên sao chỉ ở `ky`.\n  - Lưu ý: \"Phúc Đức\" vừa là tên cung vừa là tên sao.\n- **Giao diện:** tab Tử Vi thêm **Phần 2 \"Thế đứng & nguồn cội\"** (`Script.html › tamPhapHtml`, CSS `.tp-van`).\n  - Các phần sau lùi số: 12 cung = 3, Tử Vi × Bát Tự = 4, Vận hạn = 5.\n  - PDF lấy `tvp-1`, `tvp-2`, `tvp-4`.\n  - Phiên bản giao diện 2026.10.13.\n- **Cài đặt:** `HAM_CAN_CO` thêm `TuViTamPhap.gs: tpLap_`; `BAN_MOI_CAN_CO` thêm `LuanGiai.gs: [luanChiTiet, tpLap_]`; 27 file .gs.\n- **Kiểm thử:** `tests/tam-phap.js` (14.659 kiểm tra trên 300 lá số + đối chiếu iztro).\n\n## Ý tưởng chưa làm (chờ chủ dự án)\n- **Trình tự tổng quan kiểu aituvi:** viết lại mở đầu Phần 1 thành một bài liền mạch: Mệnh → bộ sao tam hợp → thế đứng → Thân → điểm yếu → vận hiện tại → 3 năm tới.\n- **Giao diện:**\n  - điểm 0–100 + biểu đồ radar 12 cung;\n  - thanh tab theo thang thời gian (Lá số / Luận cung / Đại vận / Tiểu vận / Nguyệt vận / Nhật vận / Chuyên đề);\n  - bảng chỉ số đầu tab Bát Tự kiểu Tian Qi.\n- **Chuyên đề bán lẻ** (aituvi có 14 chuyên đề, Cách cục 150 xu).\n- **Trợ lý AI hỏi đáp về lá số:** cần khóa API và chi phí – hỏi chủ dự án.\n- **Mồi \"Năm 2027 của bạn\"** không cần giờ sinh.\n- Phái Trung Châu (tinh hệ, sát diệu) và Kỳ Môn: chưa nghiên cứu sâu.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Tử Vi đối chiếu các phái.md", "lk": ["TCC Sáu hệ", "TCC Lập lá số và bốn tầng luận", "TCC Giao diện", "Việc chờ chủ dự án"]}, {"id": "TCC Tự đẩy code lên Apps Script", "nhom": "Thiên Cơ Các", "txt": "# TCC Tự đẩy code lên Apps Script\n\nLiên quan: [[Lần dán lên Apps Script]] · [[TCC Kiểm thử]] · [[Việc chờ chủ dự án]]\n\nNhóm: Thiên Cơ Các · Tạo 22/10/2026\n\n## Lịch sử\n- 22/10: làm bản GitHub Actions (workflow + secret). Chủ dự án so sánh với bộ bấm đúp của web KPI, chọn **bộ bấm đúp** và yêu cầu **tắt GitHub Actions**. Đã xóa `.github/workflows/day-len-apps-script.yml`, `tools/day-len-apps-script.sh`, `HUONG-DAN-CLASP.md`.\n- 22/10: làm bộ bấm đúp `tuvi-app/cai-dat-clasp/`, dựa trên `kpi-app/cai-dat-clasp/` ở nhánh KPI.\n\n## Bộ bấm đúp (Windows, clasp 2.4.2)\n- `1-CAI-DAT.bat` → `cai-dat.ps1`:\n  - Cài Node (winget) và clasp, bật API, đăng nhập. Nếu máy đã có `.clasprc.json` từ bộ KPI thì hỏi dùng lại.\n  - Nhập Script ID, `clasp pull`, gọi `KiemTraDungDuAn` (chặn dự án có `function napDuLieu` của KPI; dự án chưa có `lapLaSo` thì hỏi xác nhận).\n  - Sao lưu, chọn bản triển khai, ghi `cau-hinh.json`.\n- `2-CAP-NHAT.bat` → `cap-nhat.ps1`: sao lưu, `KiemTraDungDuAn`, `TaiBanMoi`, `ChepVaoThuMucMa`, `push -f`, `deploy --deploymentId`.\n  - `TaiBanMoi` lấy sha mới nhất của nhánh qua GitHub API, liệt kê `tuvi-app/*.gs|*.html`, tải raw theo sha, so dung lượng từng file.\n  - Kiểm tra `Code.gs` có `kiemTraCaiDat` và 3 mã phiên bản giao diện trùng nhau.\n  - `ChepVaoThuMucMa` giữ `Anh.html` đang có trên Apps Script (`$KhongDe`) và giữ file chỉ có trên Apps Script.\n- `3-KHOI-PHUC.bat` → `khoi-phuc.ps1`: chọn bản sao lưu, đẩy lại, triển khai.\n- `chung.ps1`: thư mục `%USERPROFILE%\\ThienCoCac-AppsScript` (`ma`, `sao-luu`, `cau-hinh.json`), nhánh `claude/happy-brown-lttkz3`.\n- File `.ps1` lưu UTF-8 có BOM + CRLF để PowerShell 5 đọc đúng tiếng Việt.\n- Đã chạy thử bằng PowerShell 7 trên Linux với clasp giả, kết quả:\n  - cài đặt đạt;\n  - cập nhật đạt: tải 33 file thật từ GitHub, giữ Anh và file riêng, triển khai đúng mã;\n  - khôi phục đạt;\n  - chặn nhầm dự án KPI đạt.\n- Hướng dẫn cho chủ dự án: `tuvi-app/cai-dat-clasp/HUONG-DAN.md`. File ZIP gửi trong chat.\n\n## Sửa 22/10 (sau lần chạy thật đầu tiên)\n- Máy chủ dự án báo `The remote name could not be resolved: 'api.github.com'`: máy không phân giải được tên miền api.github.com (lỗi mạng hoặc DNS, không phải sai nhánh).\n- `TaiBanMoi` thử API trước. Lỗi thì chuyển sang chỉ dùng raw.githubusercontent.com với danh sách `cai-dat-clasp/ds-file.txt` (tên file + byte), mỗi file tải lại tối đa 3 lần, `LoiMang` báo lỗi mạng dễ hiểu.\n- **Mỗi lần thêm hoặc sửa file .gs/.html phải chạy `python3 tools/tao-ds-file.py`**: `tests/cai-dat.js` báo lỗi nếu quên.\n- Đã thử cả hai đường (API, và raw khi API hỏng): đều tải đủ 33 file.\n\n## Lưu ý\n- Mỗi push đổi mã lên nhánh có thể lên web thật khi chủ dự án bấm cập nhật, nên chỉ push sau khi kiểm thử đạt.\n- Nếu web KPI và Thiên Cơ Các ở hai tài khoản Google khác nhau, phải đăng nhập lại clasp khi chuyển dự án.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Tự đẩy code lên Apps Script.md", "lk": ["Lần dán lên Apps Script", "TCC Kiểm thử", "Việc chờ chủ dự án"]}, {"id": "TCC Văn dễ hiểu và Tổng hợp 6 hệ", "nhom": "Thiên Cơ Các", "txt": "# TCC Văn dễ hiểu và Tổng hợp 6 hệ\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Giao diện]] · [[TCC Nghiệm chứng]] · [[TCC Bán hàng]] · [[00 Mục lục]]\n\n- **DeHieu.gs:** văn dễ hiểu cho Bát Tự, Chiêm tinh, Thần số, HD, Hà Lạc, cùng cấu trúc với phần Tử Vi. Hiển thị đầu mỗi tab; phần kỹ thuật gom vào `<details class=\"chuyen-sau\">` (mặc định đóng, PDF tự mở).\n- **Tổng hợp 6 hệ bản 2 (DeHieu.gs › `th6Lap_`, kết quả `deHieu.th6`):** 9 lĩnh vực, mỗi lĩnh vực lấy điểm /10 + câu dễ hiểu của Tử Vi (điểm cung, câu mẫu `TH6_TV_CAU`), Bát Tự (12 lĩnh vực, điểm trong \"Kết luận\"), Hà Lạc và Chiêm tinh (8 lĩnh vực); Thần số, HD, văn Chiêm tinh là \"góc nhìn thêm\". Điểm chung có trọng số (TV 1,2 · BT 1,1 · CT 1,0 · HL 0,8), ngưỡng điểm chung ≥6 thuận / ≤4,8 cần lưu ý; số hệ cùng chiều; năm nổi bật sắp tới và đã qua lấy từ Biến cố hội tụ (`th: th` truyền vào `deHieuLap_`). Client `th6Html` (bảng nhiệt 9 lĩnh vực × 4 hệ, nút mở vận năm `nam|y` hoặc sang tab Vận hạn nếu đã mở, thẻ `tinhTrangMua`). Bản miễn phí: `th6Moi_` (TaiKhoan.gs) → `th6KhachHtml` chỉ lộ lĩnh vực mạnh nhất.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Văn dễ hiểu và Tổng hợp 6 hệ.md", "lk": ["TCC Giao diện", "TCC Nghiệm chứng", "TCC Bán hàng", "00 Mục lục"]}, {"id": "TCC Vận hạn chuyên sâu và biến cố", "nhom": "Thiên Cơ Các", "txt": "# TCC Vận hạn chuyên sâu và biến cố\n\nNhóm: Thiên Cơ Các · Tách từ CLAUDE.md ngày 21/10/2026\nLiên quan: [[TCC Sáu hệ]] · [[TCC Giao diện]] · [[TCC Bán hàng]] · [[00 Mục lục]]\n\n- **Hồ sơ biến cố năm (HoiTu.gs › `htHoSoNam_`, kết quả `tongHop.hoSoNam`; Script.html › `hsnHtml`, `hsnSk`, CSS `.hsn-*`; khối `data-g=\"vh-hsn\"` trong tab Vận hạn, ngay sau Vận năm):** 19 sự kiện (`HSN_SK`) trong 8 khía cạnh (`HSN_KC`). Tín hiệu từng năm vẫn từ `htTinHieu_`, thêm 6 nhóm (`hocHanh, diXa, quyNhan, thiPhi, nhaDat, tinhThan`; Tử Vi qua `htTinTuViThem_`, nhóm quẻ thêm trong `HT_QUE`, năm cá nhân trong `HT_SO`). Mỗi sự kiện có tín hiệu ủng hộ (`ung`) và ngược chiều (`nghich`); E = Σ trọng số hệ (`HSN_W`) × (ủng hộ − ngược). Xác suất: N lần/đời phân bổ theo tuổi × e^(βE) (`HSN_BETA` 0,9), p = 1 − e^(−λ), kẹp 2–90%; `rel` = gấp mấy lần mức thường của chính người đó; nhãn `htMucP_(p, rel)`. Đồng thuận = ≥3 hệ ủng hộ, không hệ ngược; Đối lập = có cả hai (văn giải thích hệ nào nói gì + cách hiểu). Tháng thuận/cần để ý lấy từ `T.thang` + thập thần tháng. Văn dễ hiểu không nêu tên sao (cơ sở kỹ thuật nằm trong \"Cơ sở từng hệ\"). Chưa mở vận năm: `ttCatPhan_` chỉ giữ 1 câu tóm tắt, thế đứng 5 hệ, nhãn khía cạnh và 1 sự kiện nổi bật. Đã sửa lỗi cũ: `/Tài/` khớp nhầm \"Kiếp Tài\" (nay `/Chính Tài|Thiên Tài/`). Kiểm thử: `tests/ho-so-nam.js`.\n- **Vận hạn chuyên sâu (VanSau.gs, gọi từ TongHop.gs › `tongHopLuan` sau Hồ sơ năm, có `typeof` để thiếu file vẫn chạy; LuanGiai.gs › `lgTieuVan_`; TienIch.gs › `tiQueKetQua_`):**\n  - **Hiệu chỉnh theo người xem** (`vsHieuChinh_` → `tongHop.hieuChinh`): đối chiếu `input.events` (form \"Sự kiện đã biết\", `EV_LOAI` thêm 10 loại khớp `HSN_SK`; loại cũ quy đổi qua `VS_EV_MAP`). Mỗi hệ: phân vị tín hiệu ở năm sự kiện so với cả đời → hệ số ×0,6–×1,7 (co theo k/(k+3)); từ 2 sự kiện mới áp dụng. Trọng số `W` dùng cho Hồ sơ năm (`htHoSoNam_(…, W)`), tháng và đại vận. Client: hộp `.hc-box` đầu Hồ sơ năm (chưa khai thì nút `[data-mo-sk]` mở form).\n  - Dùng chung trong HoiTu.gs: `htNet_`, `htE_(n, sk, W)`, `htTuoiA_`, `htSkLuoi_(namTin, W)` (λ, rel, p của 19 sự kiện × mọi năm), `htBtTin_` (tín hiệu Bát Tự của can chi lưu năm/tháng, có phục ngâm – phản ngâm), tuế vận tịnh lâm / thiên khắc địa xung đại vận trong `htTinHieu_`.\n  - **Hồ sơ 12 tháng** (`vsHoSoThang_` → `tongHop.hoSoThang`; client `hstHtml`, khối `data-g=\"vh-hst\"`): 4 hệ có lịch tháng (`VS_HE_THANG`; Hà Lạc không chia tháng) qua `vsTinThang_`: Tử Vi nguyệt hạn (`lgNguyetCung_`) + Tứ Hóa lưu nguyệt theo can tháng + lưu tinh năm; Bát Tự `htBtTin_(…, 'tháng')`; Chiêm tinh `vsThienVan_` (nhà của Mặt Trời/Kim/Hỏa giữa tháng, nghịch hành Thủy/Kim/Hỏa dò từng ngày, trăng non/tròn, thực khi gần nút ≤15°/10°); Thần số tháng cá nhân. Xác suất tháng = λ năm × phần chia e^(βE) của tháng; `dauMoc` là các mốc ngày viết lời thường. Bảng nhiệt sự kiện × tháng. Khóa theo vận năm.\n  - **12 đại vận nhìn từ 5 hệ** (`vsDaiVan_` → `tongHop.daiVanSau`; client `dvsHtml`, khối `data-g=\"vh-dvs\"` sau dòng thời gian đại vận): Tử Vi điểm đại hạn, Bát Tự đại vận phủ lên, Hà Lạc vận hào, Chiêm tinh chu kỳ lớn + tín hiệu năm, Thần số đỉnh cao/thử thách (`VS_DC_Y`, `VS_TT_Y`); năm đỉnh từng sự kiện (rel ≥1,8) và năm bản lề. Khóa theo `ttCoDv_` (bản khóa giữ thế đứng 5 hệ làm mồi).\n  - **Tử Vi lưu niên** (`vsTieuVanThem_`): thêm \"Mười hai cung của năm\" và \"Tứ Hóa năm phi nhập – xung chiếu\" (Lộc Kỵ đồng cung/xung, song Kỵ, song Lộc) vào `chiTiet.tieuVan.secs`.\n  - **Nhật vận** (`vsNhatThem_`): mỗi ngày thêm Bát Tự (thập thần can ngày, hỷ kỵ, xung hợp nhật chi, Thiên Ất quý nhân), Mặt Trăng qua nhà, ngày cá nhân.\n  - **Mai Hoa** (`vsUngKy_`): ý nghĩa hào động theo Hệ Từ (\"nhị đa dự, tứ đa cụ, tam đa hung, ngũ đa công\"), ứng kỳ quái khí (hành quẻ sinh Thể → ngày/tháng gần nhất) và quái số (số tiên thiên hai quẻ + hào động); kết quả `ungKy`.\n  - Kiểm thử: `tests/van-sau.js` (có kiểm nhật thực 17/2 và nguyệt thực 3/3/2026). Hiển thị \"gấp ×\" qua `relTxt` (≥5 ghi ×5+).\n  - **Lệch mốc giữa các hệ (yêu cầu của chủ dự án):** mỗi hệ chia thời gian theo cách riêng – không ép về một mốc. Bát Tự tháng tính theo **tiết khí** (`vsTietThang_`: chi theo kinh độ Mặt Trời, can theo năm Bát Tự đổi tại Lập Xuân; ghi ngày đổi tiết nếu tháng âm vắt qua). Đại vận 5 hệ: mốc theo Tử Vi nhưng Bát Tự/Hà Lạc/Thần số tính theo **từng năm** rồi cộng, ghi rõ khoảng năm của từng vận (`Tân Dậu (2019–2024) → Nhâm Tuất (2025–2028)`), `moc` = mốc đổi vận từng hệ, `lech` = lời giải thích giai đoạn chuyển tiếp. coSo Hồ sơ năm ghi ranh giới năm khác nhau (Tết / Lập Xuân / dương lịch).\n  - **Thế mạnh từng hệ (không luận hệ này theo hệ kia):** `VS_THE_MANH` (Tử Vi: việc gì – lĩnh vực nào; Bát Tự: thịnh suy thời vận; Hà Lạc: thế của thời, cách ứng xử; Chiêm tinh: thời điểm cụ thể; Thần số: nhịp chủ đề; Human Design: cách hành động và ra quyết định). Mỗi sự kiện `HSN_SK.manh` nhân trọng số hệ giỏi nhất việc đó (dùng trong `htE_`), trả `heManh`. `vsGocNhin_` → `hoSoNam.gocNhin` (mỗi hệ một câu đúng thế mạnh), `hoSoNam.hanhDong` (kế hoạch: việc nổi bật + việc cần phòng → khi nào theo tháng, nên làm, cách làm theo HD `VS_HD_LAM` + thẩm quyền `VS_HD_TQ`, lời quẻ năm Hà Lạc), `hoSoNam.cauNoi` (cổng HD = quẻ Kinh Dịch cùng số thứ tự Văn Vương = `HL_QUE[g-1]`; so quẻ mệnh Tiên thiên và quẻ năm Hà Lạc với cổng HD đang kích hoạt). Client: `.gn-*`, `.hd-ke`, `.hsn-cau`.\n  - **Bố cục tab Vận hạn sau khi gộp:** dòng thời gian → `vh-dvs` (đại vận 5 hệ; lời luận đại vận Tử Vi `#van-dai` chuyển vào `#dvs-slot-<năm>` trong mục \"Căn cứ Tử Vi\"; thẻ đại vận cũ chỉ còn khi thiếu VanSau.gs) → `vh-nam` (chọn năm + `hsnHtml(res, {than:true})` + `details.vs-canco` chứa `#van-tieu`) → `vh-hst` (biểu đồ điểm 12 tháng `hstBars` + bảng nhiệt + thẻ tháng + `vs-canco` chứa `#van-nguyet`) → `vh-ngay` (nhật vận) → `bien`. Đã bỏ hiển thị \"năm lăng kính\", bảng 12 tháng 3 hệ, bảng 7 ngày (dữ liệu `T.namNay/T.thang/T.ngay` vẫn giữ cho mồi khóa, PDF, mật mã). Tiểu vận Tử Vi bỏ mục \"Các lĩnh vực trong năm\" khi có `vsTieuVanThem_`.\n  - **Biến cố 30 năm** (`vsBienCo_` → `tongHop.bienCo`; client `bienCoHtml`, vẫn `data-g=\"bien\"`): cùng bộ máy 19 sự kiện (`htSkLuoi_`), năm đỉnh rel ≥1,8 + số hệ cùng báo, năm đã qua để kiểm chứng, \"năm nóng\" (≥2 việc rel ≥2,2), bảng nhiệt 19 × 30 năm (PDF bỏ bảng này). `hoiTu` cũ vẫn tính cho dòng thời gian, Tổng hợp 6 hệ, cặp đôi, mật mã. Khóa theo `bien_co`.\n", "duong": "bo-nao/Thiên Cơ Các/TCC Vận hạn chuyên sâu và biến cố.md", "lk": ["TCC Sáu hệ", "TCC Giao diện", "TCC Bán hàng", "00 Mục lục"]}, {"id": "CLAUDE.md", "nhom": "Bắt đầu", "duong": "CLAUDE.md", "txt": "# Thiên Cơ Các – bối cảnh cho phiên Claude Code mới\n\nFile này được Claude Code tự đọc khi mở repo. Nó giữ **quy tắc bắt buộc** và chỉ đường vào **bộ não thứ hai** `bo-nao/`, nơi chứa toàn bộ \"trí nhớ\" chi tiết của các phiên trước. Đọc hết file này, rồi đọc `bo-nao/00 Mục lục.md` trước khi làm việc.\n\n## Dự án\n- Web app **Google Apps Script** luận vận mệnh 6 hệ: Tử Vi, Bát Tự, Hà Lạc, Chiêm tinh, Thần số học, Human Design. Có bán nội dung bằng **xu**. Mã trong `tuvi-app/` (bảng vai trò từng file: `tuvi-app/README.md`; hướng dẫn cài đặt: `tuvi-app/HUONG-DAN-CAI-DAT.md`). Chi tiết: `bo-nao/Thiên Cơ Các/`.\n- **Mỗi dự án một nhánh** (chủ dự án chốt 21/10). Nhánh này chỉ chứa Thiên Cơ Các: commit và push lên **`claude/happy-brown-lttkz3`**. Không tạo PR nếu chủ dự án không yêu cầu.\n- Dự án khác của chủ dự án, không liên quan, nằm ở nhánh riêng – đừng đưa vào nhánh này: **web KPI sản xuất** (`kpi-app/`) ở `claude/beautiful-ptolemy-f2j7za`; **Trợ lý KPI qua Zalo** (`tro-ly-kpi/`) ở `claude/awesome-heisenberg-iulbd6`.\n\n## Chủ dự án – cách làm việc (bắt buộc)\n- **Trả lời bằng tiếng Việ var cg = document.getElementById('cg'), anNhom = {};
NHOMS.forEach(function(n){
  var dem = G.filter(function(g){ return g.nhom === n; }).length; if (!dem) return;
  var b = document.createElement('button'); b.setAttribute('aria-pressed', 'true');
  b.innerHTML = '<span class="cham" style="--c:var(' + NHOM_MAU[n] + ')"></span>' + esc(n) + ' · ' + dem;
  b.onclick = function(){ anNhom[n] = !anNhom[n]; b.setAttribute('aria-pressed', anNhom[n] ? 'false' : 'true'); locNhom(); };
  cg.appendChild(b);
});
function locNhom(){
  G.forEach(function(g){ g.an = !!anNhom[g.nhom]; g.el.classList.toggle('an', g.an); });
  CANH.forEach(function(c){ c.el.classList.toggle('an', BY[c.a].an || BY[c.b].an); });
}

/* ---------- Đọc ghi chú (markdown tối giản) ---------- */
function dong(s){
  var ma = [];
  s = esc(s).replace(/`([^`]+)`/g, function(_, c){ ma.push(c); return '\u0000' + (ma.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[\[([^\]|#]+)(?:[|#][^\]]*)?\]\]/g, function(_, t){ t = t.trim();
    return BY[t] ? '<button class="wl" data-id="' + esc(t) + '">' + esc(t) + '</button>' : esc(t); });
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, function(_, k){ return '<code>' + ma[+k] + '</code>'; });
}
function md(txt){
  var L = txt.split('\n'), out = [], ds = [], para = [], k;
  function dongPara(){ if (para.length) { out.push('<p>' + para.map(dong).join(' ') + '</p>'); para = []; } }
  function dongDs(cap){ while (ds.length > cap) { out.push('</li></' + ds.pop() + '>'); } }
  for (k = 0; k < L.length; k++) {
    var x = L[k];
    if (/^```/.test(x)) { dongPara(); dongDs(0); var code = []; k++;
      while (k < L.length && !/^```/.test(L[k])) { code.push(L[k]); k++; }
      out.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>'); continue; }
    var h = x.match(/^(#{1,3})\s+(.*)/);
    if (h) { dongPara(); dongDs(0); var lv = h[1].length + 1; out.push('<h' + lv + '>' + dong(h[2]) + '</h' + lv + '>'); continue; }
    var m = x.match(/^(\s*)([-*]|\d+\.)\s+(.*)/);
    if (m) { dongPara(); var cap = Math.floor(m[1].length / 2) + 1, loai = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (cap > ds.length) { while (ds.length < cap) { out.push('<' + loai + '><li>'); ds.push(loai); } }
      else { dongDs(cap); out.push('</li><li>'); }
      out.push(dong(m[3])); continue; }
    if (!x.trim()) { dongPara(); dongDs(0); continue; }
    if (ds.length && /^\s+/.test(x)) { out.push(' ' + dong(x.trim())); continue; }
    dongDs(0); para.push(x.trim());
  }
  dongPara(); dongDs(0);
  return out.join('');
}

var docEl = document.getElementById('doc'), dangMo = null;
function nutGhi(id){ var g = BY[id]; return '<button data-id="' + esc(id) + '"><span class="cham" style="--c:' + mau(g) + '"></span>' + esc(id) + '</button>'; }
function mo(id, tuDoThi){
  var g = BY[id]; if (!g) return; dangMo = id;
  var txt = g.txt.replace(/^# .*\n+/, ''), nhomDong = '';
  var mm = txt.match(/^Nhóm: (.*)\n/); if (mm) { nhomDong = mm[1]; txt = txt.slice(mm[0].length); }
  docEl.innerHTML =
    '<div class="nhan"><span class="chip"><span class="cham" style="--c:' + mau(g) + '"></span>' + esc(g.nhom) + '</span>' +
    (nhomDong ? '<span>' + esc(nhomDong.replace(/^[^·]*·\s*/, '')) + '</span>' : '') + '</div>' +
    '<h2 class="tieu">' + esc(g.id) + '</h2>' +
    '<div class="noi">' + md(txt) + '</div>' +
    '<div class="lien">' +
      (g.lk.length ? '<div><h3>Trỏ tới</h3><div class="ds">' + g.lk.map(nutGhi).join('') + '</div></div>' : '') +
      (g.ve.length ? '<div><h3>Được nhắc từ</h3><div class="ds">' + g.ve.map(nutGhi).join('') + '</div></div>' : '') +
      '<div class="duong-file">' + esc(g.duong) + '</div>' +
    '</div>';
  G.forEach(function(x){ x.el.classList.toggle('chon', x.id === id); x.el.classList.toggle('ke', g.lk.indexOf(x.id) >= 0 || g.ve.indexOf(x.id) >= 0); });
  CANH.forEach(function(c){ c.el.classList.toggle('sang', c.a === id || c.b === id); });
  sv.classList.add('mo');
  try { localStorage.setItem('bonao_mo', id); } catch (e) {}
  if (tuDoThi && window.matchMedia('(max-width: 899px)').matches) docEl.scrollIntoView({behavior:'smooth', block:'start'});
  else if (!tuDoThi) docEl.scrollTop = 0;
}
function bo_chon(){ sv.classList.remove('mo'); }
docEl.addEventListener('click', function(e){ var b = e.target.closest('[data-id]'); if (b) { mo(b.getAttribute('data-id')); if (window.matchMedia('(max-width: 899px)').matches) docEl.scrollIntoView({block:'start'}); else window.scrollTo({top:0}); } });

/* ---------- Tìm kiếm (không dấu) ---------- */
var oTim = document.getElementById('oTim'), kq = document.getElementById('kq');
G.forEach(function(g){ g.bo = bo(g.id + '\n' + g.txt); g.boTen = bo(g.id); });
oTim.addEventListener('input', function(){
  var q = bo(oTim.value.trim());
  G.forEach(function(g){ g.el.classList.toggle('trung', !!q && g.bo.indexOf(q) >= 0); });
  if (!q) { kq.hidden = true; kq.innerHTML = ''; return; }
  var r = G.filter(function(g){ return g.bo.indexOf(q) >= 0; })
    .sort(function(a, b){ return (b.boTen.indexOf(q) >= 0) - (a.boTen.indexOf(q) >= 0); }).slice(0, 12);
  kq.innerHTML = r.length ? r.map(function(g){
    var p = g.bo.indexOf(q), doan = g.txt.replace(/\s+/g, ' ').slice(Math.max(0, p - 30), p + 70);
    return '<li><button data-id="' + esc(g.id) + '">' + esc(g.id) + '<small>…' + esc(doan) + '…</small></button></li>';
  }).join('') : '<li style="padding:6px 8px;color:var(--chu3)">Không thấy ghi chú nào có "' + esc(oTim.value) + '".</li>';
  kq.hidden = false;
});
kq.addEventListener('click', function(e){ var b = e.target.closest('[data-id]'); if (b) { mo(b.getAttribute('data-id'), true); kq.hidden = true; } });
oTim.addEventListener('keydown', function(e){ if (e.key === 'Enter') { var b = kq.querySelector('[data-id]'); if (b) { mo(b.getAttribute('data-id'), true); kq.hidden = true; } } if (e.key === 'Escape') { kq.hidden = true; } });
document.addEventListener('click', function(e){ if (!e.target.closest('.tim')) kq.hidden = true; });

vuaKhung();
window.addEventListener('resize', function(){ clearTimeout(window.__rz); window.__rz = setTimeout(vuaKhung, 150); });
var dau = '00 Mục lục';
try { var luu = localStorage.getItem('bonao_mo'); if (luu && BY[luu]) dau = luu; } catch (e) {}
mo(dau);
})();
</script>
