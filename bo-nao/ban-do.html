:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;

  --g-batdau:#f7b829; --g-kpi:#2fd3c6; --g-tcc:#b9a2ff; --g-chung:#aab5bc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1f1e; --mat:#2b2b2b; --vien:#3d3c39; --chu:#ecebe6; --chu2:#b3b0a7; --chu3:#85827a;
  --vang:#f7b829; --vang-nen:#3a3220; --luoi:#2f2f2d;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--chu);font:15px/1.6 var(--f-chu);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--vang);outline-offset:2px}

.dau{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 12px;border-bottom:1px solid var(--vien)}
.dau h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em;text-wrap:balance}
.dau h1 b{color:var(--vang)}
.so{font:12px var(--f-ma);color:var(--chu3);font-variant-numeric:tabular-nums}
.tim{position:relative;margin-left:auto;flex:1 1 240px;max-width:360px}
.tim input{width:100%;padding:8px 12px;border:1px solid var(--vien);border-radius:6px;background:var(--mat);color:var(--chu);font:inherit;font-size:14px}
.tim ul{position:absolute;z-index:5;top:calc(100% + 4px);left:0;right:0;margin:0;padding:4px;list-style:none;background:var(--mat);border:1px solid var(--vien);border-radius:6px;max-height:50vh;overflow:auto;box-shadow:0 8px 24px rgb(0 0 0 / .18)}
.tim li button{all:unset;display:block;width:100%;box-sizing:border-box;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:14px}
.tim li button:hover,.tim li button:focus-visible{background:var(--vang-nen)}
.tim li small{display:block;color:var(--chu3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.than{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:14px 32px}
@media (min-width:900px){.than{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
  .do-thi{position:sticky;top:12px;height:calc(100vh - 110px)}}
.do-thi{position:relative;height:56vh;min-height:320px;border:1px solid var(--vien);border-radius:8px;background:var(--mat);overflow:hidden;touch-action:none}
.do-thi svg{display:block;width:100%;height:100%;cursor:grab}
.do-thi svg.keo{cursor:grabbing}
.nut-do{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.nut-do button,.chu-giai button{font:12px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:4px 9px;cursor:pointer}
.nut-do button{width:30px;padding:4px 0;font-size:15px}
.chu-giai{position:absolute;left:8px;bottom:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px}
.chu-giai button{display:inline-flex;align-items:center;gap:6px}
.chu-giai button[aria-pressed="false"]{opacity:.45}
.cham{width:9px;height:9px;border-radius:50%;background:var(--c)}

.duong{stroke:var(--chu3);stroke-opacity:.35;stroke-width:1}
.duong.sang{stroke:var(--vang);stroke-opacity:.9;stroke-width:1.6}
.nut circle{fill:var(--c);stroke:var(--mat);stroke-width:2}
.nut text{font:var(--fs,11px) var(--f-chu);stroke-width:var(--sw,3px)!important;fill:var(--chu2);paint-order:stroke;stroke:var(--mat);stroke-width:3px;stroke-linejoin:round}
.nut circle.vung{fill:transparent!important;stroke:none!important}
.nut{cursor:pointer}
.nut.chon circle{stroke:var(--vang);stroke-width:3}
.nut.chon text,.nut.ke text{fill:var(--chu);font-weight:700}
.mo .nut:not(.chon):not(.ke),.mo .duong:not(.sang){opacity:.18}
.nut.an,.duong.an{display:none}
.xa .nut.phu:not(.chon):not(.trung):not(:hover):not(:focus) text{display:none}
.nut.trung circle{stroke:var(--vang);stroke-width:3}

.doc{min-width:0;background:var(--mat);border:1px solid var(--vien);border-radius:8px;padding:18px clamp(16px,3vw,28px) 28px}
.doc .nhan{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--chu3)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;border:1px solid var(--vien);color:var(--chu2);font-size:12px}
.doc h2.tieu{margin:.4em 0 .2em;font-size:1.45rem;line-height:1.25;text-wrap:balance}
.noi{max-width:72ch}
.noi h1,.noi h2,.noi h3{line-height:1.3;text-wrap:balance;margin:1.3em 0 .4em}
.noi h1{font-size:1.25rem}.noi h2{font-size:1.1rem}.noi h3{font-size:1rem}
.noi p{margin:.6em 0}
.noi ul,.noi ol{padding-left:1.25em;margin:.5em 0}
.noi li{margin:.3em 0}
.noi li::marker{color:var(--chu3)}
.noi code{font:0.86em var(--f-ma);background:var(--luoi);padding:.05em .35em;border-radius:3px;overflow-wrap:anywhere}
.noi pre{overflow-x:auto;background:var(--luoi);padding:10px 12px;border-radius:6px}
.noi pre code{background:none;padding:0;white-space:pre}
.noi strong{font-weight:700}
.wl{color:var(--vang);text-decoration:none;border-bottom:1px solid currentColor;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding:0;font:inherit}
.wl:hover{background:var(--vang-nen)}
.lien{margin-top:24px;padding-top:14px;border-top:1px solid var(--vien);display:grid;gap:10px;font-size:13px}
.lien h3{margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--chu3)}
.lien .ds{display:flex;flex-wrap:wrap;gap:6px}
.lien .ds button{font:13px var(--f-chu);border:1px solid var(--vien);background:var(--bg);color:var(--chu);border-radius:5px;padding:3px 9px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.duong-file{font:12px var(--f-ma);color:var(--chu3);overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

var DL = {"ngay": "22/10/2026", "ghi": [{"id": "00 Mục lục", "nhom": "Bắt đầu", "txt": "# 00 Mục lục\n\nBộ não thứ hai của **Thiên Cơ Các** (nhánh `claude/happy-brown-lttkz3`). Web KPI sản xuất có bộ não riêng trên nhánh `claude/beautiful-ptolemy-f2j7za`. Mỗi ghi chú một chủ đề, nối với nhau bằng `[[liên kết]]`. Mở thư mục `bo-nao/` bằng Obsidian để xem dạng đồ thị, hoặc mở trang bản đồ https://claude.ai/artifact/ATmkGiUrZzEGjhRTxjyFjW (bản trong repo: `bo-nao/ban-do.html`).\n\n## Bắt đầu từ đây\n- [[Việc chờ chủ dự án]]: việc còn ngỏ, câu hỏi chờ trả lời.\n- [[Lần dán lên Apps Script]]: bản nào đã dán, bản nào chưa.\n- [[Quyết định của chủ dự án]]: những gì đã chốt – đừng đề xuất ngược lại.\n- Quy tắc làm việc, văn luận giải, nghiệm chứng, bảo mật: nằm ở `CLAUDE.md` (ô \"CLAUDE.md\" trên bản đồ).\n\n## Thiên Cơ Các (`tuvi-app/`)\n- Nền tảng: [[TCC Tổng quan]] · [[TCC Tiến trình]] · [[TCC Kiểm thử]] · [[TCC Lịch sử lá số]] · [[TCC Tự đẩy code lên Apps Script]] · [[TCC Chuyên gia Agency Agents]]\n- Lõi luận giải: [[TCC Lập lá số và bốn tầng luận]] · [[TCC Sáu hệ]] · [[TCC Văn dễ hiểu và Tổng hợp 6 hệ]] · [[TCC Nghiệm chứng]] · [[TCC Vận hạn chuyên sâu và biến cố]] · [[TCC Tử Vi đối chiếu các phái]] · [[TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn]] · [[TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu]]\n- Giao diện: [[TCC Giao diện]] · [[TCC Lá số 3D]] · [[TCC PDF]]\n- Kinh doanh: [[TCC Bán hàng]] · [[TCC Tiện ích bán lẻ]] · [[TCC Báo cáo ngày]] · [[TCC Luận giải hằng ngày qua email]]\n\n## Cách giữ bộ não sống (cho phiên Claude)\n1. Đầu phiên: đọc `CLAUDE.md`, ghi chú này, rồi [[Việc chờ chủ dự án]] và các ghi chú của chủ đề sắp làm.\n2. Làm xong một việc: sửa ghi chú chủ đề đó (thêm ngày, việc đã làm, tên hàm/file, kiểm thử), cập nhật [[Việc chờ chủ dự án]], [[Lần dán lên Apps Script]] và [[Quyết định của chủ dự án]] nếu có thay đổi. Chủ đề mới thì tạo ghi chú mới trong `Thiên Cơ Các/`, dòng 3 ghi `Liên quan: [[...]]`, và thêm vào mục lục này.\n3. Dựng lại bản đồ: `python3 bo-nao/tao-ban-do.py` rồi đăng lại `bo-nao/ban-do.html` lên đúng link Artifact ghi trong `CLAUDE.md`.\n", "duong": "bo-nao/00 Mục lục.md", "lk": ["Việc chờ chủ dự án", "Lần dán lên Apps Script", "Quyết định của chủ dự án", "TCC Tổng quan", "TCC Tiến trình", "TCC Kiểm thử", "TCC Lịch sử lá số", "TCC Tự đẩy code lên Apps Script", "TCC Chuyên gia Agency Agents", "TCC Lập lá số và bốn tầng luận", "TCC Sáu hệ", "TCC Văn dễ hiểu và Tổng hợp 6 hệ", "TCC Nghiệm chứng", "TCC Vận hạn chuyên sâu và biến cố", "TCC Tử Vi đối chiếu các phái", "TCC Bát Tự Hà Lạc và Tứ Trụ đối chiếu nguồn", "TCC Chiêm tinh Thần số HD nâng cấp chuyên sâu", "TCC Giao diện", "TCC Lá số 3D", "TCC PDF", "TCC Bán hàng", "TCC Tiện ích bán lẻ", "TCC Báo cáo ngày", "TCC Luận giải hằng ngày qua email"]}, {"id": "Lần dán lên Apps Script", "nhom": "Bắt đầu", "txt": "# Lần dán lên Apps Script\n\nNhóm: Bắt đầu · Cập nhật 22/10/2026\nLiên quan: [[Việc chờ chủ dự án]] · [[TCC Kiểm thử]] · [[00 Mục lục]]\n\n## Tình trạng\n- 23/10 (sau): nâng cấp Chiêm tinh, Thần số, HD – đổi **ChiemTinh, ThanSoHoc, HumanDesign, DeHieu, Code, Script, Styles, Index** (mã `2026.10.23.2`). Bấm `2-CAP-NHAT.bat`, Ctrl+F5.\n- 23/10: giao diện theo tư vấn chuyên gia – đổi **Script, Styles, Index** (mã `2026.10.23.1`). Bấm `2-CAP-NHAT.bat`, Ctrl+F5.\n- 22/10: Hà Lạc & Tứ Trụ – đổi **HaLac, BatTuPhanTich, DeHieu, Code, Script, Styles, Index** (mã giao diện `2026.10.22.4`). Bấm `2-CAP-NHAT.bat`, Ctrl+F5.\n- 22/10: PDF thiết kế lại – đổi **Script, Styles, Index** (mã giao diện `2026.10.22.3`). Bấm `2-CAP-NHAT.bat`, rồi Ctrl+F5.\n- 22/10 (khuya): gửi luận giải hằng ngày qua Zalo – đổi **TienIch, Code**. Bấm `2-CAP-NHAT.bat`, rồi dán `ZALO_TOKEN`, `ZALO_CHAT_ID` vào Thuộc tính tập lệnh và chạy `thuZaloVanNgay`.\n- 22/10 (tối): email luận giải hằng ngày làm dày – chỉ đổi **TienIch.gs** (giao diện không đổi). Bấm `2-CAP-NHAT.bat`, không cần chạy lại `caiDatVanNgay`.\n- **22/10 (cuối phiên): chủ dự án cập nhật xong bằng bộ bấm đúp** (`2-CAP-NHAT.bat`, tải dự phòng qua raw sau lỗi api.github.com). Web đang chạy bản mới nhất trên nhánh, mã giao diện `2026.10.22.2` (gồm TuViTamPhap, Bạch Kim + bento, luận giải hằng ngày). Các dòng 21–22/10 bên dưới là lịch sử. Từ nay: push lên nhánh → nhắc chủ dự án bấm `2-CAP-NHAT.bat`.\n- 22/10 (sau): luận giải hằng ngày qua email – cần cập nhật **TienIch, Code, Script, Styles, Index** (mã giao diện `2026.10.22.2`), rồi chạy `caiDatVanNgay` một lần. Dùng bộ bấm đúp `2-CAP-NHAT.bat` nếu đã cài.\n- 22/10: đã có **bộ bấm đúp** `tuvi-app/cai-dat-clasp/` (GitHub Actions đã tắt theo yêu cầu). Chưa ghi nhận chủ dự án cài. Cài xong thì mỗi lần có bản mới chỉ cần bấm `2-CAP-NHAT.bat`. – [[TCC Tự đẩy code lên Apps Script]]\n- 22/10: giao diện **Bạch Kim** + bảng điều khiển bento, biểu đồ động (mã giao diện `2026.10.22`) – cần dán **Styles, Script, Index**. Thay cho bản 21/10 (sau) nếu chưa dán. Giữ nguyên `Anh.html`.\n- 21/10 (sau): giao diện tối sang trọng – cần dán **Styles, Script, Index** (cùng đợt với TuViTamPhap, LuanGiai, Code nếu chưa dán). Giữ nguyên file `Anh.html`.\n- 21/10: bản \"Tử Vi đối chiếu các phái\" – cần dán: **TuViTamPhap (file mới)**, LuanGiai, Code, Script, Styles, Index (và ThanhToan nếu chưa dán bản báo cáo ngày). Chưa xác nhận đã dán.\n- Chưa ghi nhận chủ dự án đã dán những bản nào. Lần lưu mới nhất trên nhánh: 09/10 (báo cáo ngày qua email, sửa kiểm tra cài đặt báo nhầm HoiTu.gs, vận hạn gộp phần trùng). Hỏi lại trước khi làm thay đổi mới.\n- Ứng dụng tự báo file nào còn bản cũ: `kiemTraCaiDat` (`HAM_CAN_CO`, `BAN_MOI_CAN_CO`) và mã phiên bản giao diện (`tcc-ban` / `--tcc-ban` / `BAN_GIAO_DIEN` phải trùng nhau). – [[TCC Kiểm thử]], [[TCC Giao diện]]\n- File tùy chọn `LaSo3D.gs` sinh bằng `node tools/demo-3d.js`, không sửa tay. – [[TCC Lá số 3D]]\n\n## Nhắc khi gửi file cho chủ dự án\n- Nói rõ file nào cần dán, theo dạng \"MỞ FILE X → xóa hết → dán bản mới\", rồi Triển khai → Quản lý triển khai → ✏️ → Phiên bản mới → Triển khai, Ctrl+F5.\n- Nhắc sao lưu (T
