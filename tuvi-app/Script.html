<script>
/* ================================================================
   THIÊN CƠ CÁC — JavaScript phía trình duyệt
   ================================================================ */
(function () {
  'use strict';

  var CAN_HAN = '甲乙丙丁戊己庚辛壬癸';
  var CHI_HAN = '子丑寅卯辰巳午未申酉戌亥';

  var CAN_HANH = ['Mộc', 'Mộc', 'Hỏa', 'Hỏa', 'Thổ', 'Thổ', 'Kim', 'Kim', 'Thủy', 'Thủy'];
  var CHI_HANH = ['Thủy', 'Thổ', 'Mộc', 'Mộc', 'Thổ', 'Hỏa', 'Hỏa', 'Thổ', 'Kim', 'Kim', 'Thổ', 'Thủy'];
  // vị trí 12 cung trên lưới 4x4 [hàng, cột]
  var GRID = { 5: [1, 1], 6: [1, 2], 7: [1, 3], 8: [1, 4], 4: [2, 1], 9: [2, 4], 3: [3, 1], 10: [3, 4], 2: [4, 1], 1: [4, 2], 0: [4, 3], 11: [4, 4] };
  var MAJOR = ['Tả Phù', 'Hữu Bật', 'Văn Xương', 'Văn Khúc', 'Thiên Khôi', 'Thiên Việt', 'Lộc Tồn', 'Thiên Mã',
    'Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Địa Không', 'Địa Kiếp',
    'Thiên Hình', 'Thiên Riêu', 'Hồng Loan', 'Thiên Hỷ', 'Đào Hoa', 'Thiên Khốc', 'Thiên Hư', 'Tam Thai', 'Bát Tọa',
    'Ân Quang', 'Thiên Quý', 'Long Trì', 'Phượng Các', 'Thiên Y', 'Thiên Không', 'Kiếp Sát', 'Cô Thần', 'Quả Tú'];

  var $ = function (id) { return document.getElementById(id); };
  var state = { result: null, sel: null, token: '', nguoiDung: null };
  var CAN_TOKEN = { lapLaSo: 1, doGioSinh: 1, getLichSu: 1, xoaLichSu: 1, lapCapDoi: 1 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } }

  function hasServer() { return typeof google !== 'undefined' && google.script && google.script.run; }
  function call(fn, args, ok, fail) {
    if (!hasServer()) { (fail || showErr)({ message: 'Không tìm thấy máy chủ Apps Script. Hãy mở ứng dụng qua URL Web App.' }); return; }
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || showErr), a = (args || []).slice();
    if (CAN_TOKEN[fn]) a.push(state.token || '');
    r[fn].apply(r, a);
  }

  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3800);
  }
  function showErr(e) { loading(false); toast((e && e.message) || String(e), true); }
  function loading(on) { $('loading').className = 'loading' + (on ? ' show' : ''); }

  /* ------------------------ FORM ------------------------ */
  function fillSelect(sel, from, to, label, selected) {
    var html = '';
    for (var i = from; i <= to; i++) html += '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + label(i) + '</option>';
    sel.innerHTML = html;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var NOI_SINH = [
    ['Việt Nam', [['Hà Nội', 21.03, 105.85], ['TP. Hồ Chí Minh', 10.78, 106.70], ['Hải Phòng', 20.86, 106.68], ['Đà Nẵng', 16.05, 108.20], ['Cần Thơ', 10.03, 105.78],
      ['Huế', 16.46, 107.59], ['Nha Trang', 12.24, 109.19], ['Đà Lạt', 11.94, 108.44], ['Vinh (Nghệ An)', 18.68, 105.68], ['Thanh Hóa', 19.81, 105.78],
      ['Nam Định', 20.42, 106.17], ['Thái Bình', 20.45, 106.34], ['Ninh Bình', 20.25, 105.97], ['Phủ Lý (Hà Nam)', 20.54, 105.91], ['Hải Dương', 20.94, 106.33],
      ['Hưng Yên', 20.65, 106.05], ['Bắc Ninh', 21.19, 106.08], ['Bắc Giang', 21.27, 106.19], ['Vĩnh Yên (Vĩnh Phúc)', 21.31, 105.60], ['Việt Trì (Phú Thọ)', 21.32, 105.40],
      ['Thái Nguyên', 21.59, 105.85], ['Hạ Long (Quảng Ninh)', 20.95, 107.08], ['Lạng Sơn', 21.85, 106.76], ['Cao Bằng', 22.67, 106.26], ['Bắc Kạn', 22.15, 105.83],
      ['Hà Giang', 22.82, 104.98], ['Tuyên Quang', 21.82, 105.21], ['Lào Cai', 22.49, 103.97], ['Yên Bái', 21.72, 104.91], ['Lai Châu', 22.40, 103.46],
      ['Điện Biên Phủ', 21.39, 103.02], ['Sơn La', 21.33, 103.91], ['Hòa Bình', 20.82, 105.34], ['Hà Tĩnh', 18.34, 105.91], ['Đồng Hới (Quảng Bình)', 17.47, 106.62],
      ['Đông Hà (Quảng Trị)', 16.82, 107.10], ['Tam Kỳ (Quảng Nam)', 15.57, 108.47], ['Hội An', 15.88, 108.33], ['Quảng Ngãi', 15.12, 108.80], ['Quy Nhơn (Bình Định)', 13.78, 109.22],
      ['Tuy Hòa (Phú Yên)', 13.09, 109.30], ['Phan Rang (Ninh Thuận)', 11.56, 108.99], ['Phan Thiết (Bình Thuận)', 10.93, 108.10], ['Kon Tum', 14.35, 108.00], ['Pleiku (Gia Lai)', 13.98, 108.00],
      ['Buôn Ma Thuột (Đắk Lắk)', 12.67, 108.04], ['Gia Nghĩa (Đắk Nông)', 12.00, 107.69], ['Đồng Xoài (Bình Phước)', 11.54, 106.89], ['Tây Ninh', 11.31, 106.10], ['Thủ Dầu Một (Bình Dương)', 10.98, 106.65],
      ['Biên Hòa (Đồng Nai)', 10.95, 106.82], ['Vũng Tàu', 10.35, 107.08], ['Bà Rịa', 10.50, 107.17], ['Tân An (Long An)', 10.54, 106.41], ['Mỹ Tho (Tiền Giang)', 10.36, 106.36],
      ['Bến Tre', 10.24, 106.38], ['Vĩnh Long', 10.25, 105.97], ['Trà Vinh', 9.93, 106.35], ['Cao Lãnh (Đồng Tháp)', 10.46, 105.63], ['Long Xuyên (An Giang)', 10.39, 105.44],
      ['Châu Đốc', 10.70, 105.12], ['Rạch Giá (Kiên Giang)', 10.01, 105.08], ['Phú Quốc', 10.23, 103.96], ['Vị Thanh (Hậu Giang)', 9.78, 105.47], ['Sóc Trăng', 9.60, 105.97],
      ['Bạc Liêu', 9.29, 105.72], ['Cà Mau', 9.18, 105.15]], 7],
    ['Quốc tế (tự đặt múi giờ chuẩn)', [['Bangkok', 13.75, 100.50, 7], ['Viêng Chăn', 17.97, 102.63, 7], ['Phnôm Pênh', 11.56, 104.92, 7], ['Singapore', 1.35, 103.82, 8], ['Kuala Lumpur', 3.14, 101.69, 8],
      ['Bắc Kinh', 39.90, 116.40, 8], ['Đài Bắc', 25.03, 121.57, 8], ['Hồng Kông', 22.32, 114.17, 8], ['Seoul', 37.57, 126.98, 9], ['Tokyo', 35.68, 139.69, 9],
      ['Sydney', -33.87, 151.21, 10], ['Melbourne', -37.81, 144.96, 10], ['Moskva', 55.76, 37.62, 3], ['Praha', 50.08, 14.44, 1], ['Warszawa', 52.23, 21.01, 1],
      ['Berlin', 52.52, 13.40, 1], ['Paris', 48.86, 2.35, 1], ['London', 51.51, -0.13, 0], ['Toronto', 43.65, -79.38, -5], ['New York', 40.71, -74.01, -5],
      ['Houston', 29.76, -95.37, -6], ['Los Angeles', 34.05, -118.24, -8], ['San Jose', 37.34, -121.89, -8]], null]
  ];
  function fillPlaces() {
    var html = '';
    NOI_SINH.forEach(function (g) {
      html += '<optgroup label="' + esc(g[0]) + '">' + g[1].map(function (c) {
        var tz = c[3] != null ? c[3] : g[2];
        return '<option value="' + c[1] + '|' + c[2] + '|' + esc(c[0]) + '" data-tz="' + tz + '">' + esc(c[0]) + '</option>';
      }).join('') + '</optgroup>';
    });
    html += '<option value="custom">Nơi khác – tự nhập tọa độ…</option>';
    $('place').innerHTML = html;
  }
  function onPlaceChange() {
    var o = $('place').selectedOptions[0];
    $('placeCustom').style.display = $('place').value === 'custom' ? '' : 'none';
    if (o && o.getAttribute('data-tz') != null) $('tz').value = o.getAttribute('data-tz');
  }
  function placeValue() {
    if ($('place').value !== 'custom') return $('place').value;
    var la = parseFloat($('lat').value), lo = parseFloat($('lon').value);
    return (isNaN(la) || isNaN(lo)) ? '21.03|105.85|Hà Nội' : la + '|' + lo + '|' + la.toFixed(2) + '°, ' + lo.toFixed(2) + '°';
  }

  function initForm() {
    fillPlaces();
    fillSelect($('day'), 1, 31, function (i) { return String(i); }, 1);
    fillSelect($('month'), 1, 12, function (i) { return 'Tháng ' + i; }, 1);
    fillSelect($('hour'), 0, 23, function (i) { return pad(i) + ' giờ · ' + CHI[Math.floor((i + 1) / 2) % 12]; }, 12);
    fillSelect($('minute'), 0, 59, function (i) { return pad(i) + ' phút'; }, 0);
    $('year').value = 1995;
    $('viewYear').value = new Date().getFullYear();
    var td = new Date();
    $('viewDate').value = td.getFullYear() + '-' + pad(td.getMonth() + 1) + '-' + pad(td.getDate());

    var saved = null;
    try { saved = JSON.parse(storeGet('tcc_last_input') || 'null'); } catch (e) { saved = null; }
    var p = (typeof INITIAL_PARAMS === 'object' && INITIAL_PARAMS) || {};
    if (p.year) saved = p;
    if (saved) setForm(saved);

    document.querySelectorAll('input[name=calendar]').forEach(function (r) { r.addEventListener('change', onCalendarChange); });
    ['day', 'month', 'year', 'leap', 'hour', 'minute'].forEach(function (id) {
      $(id).addEventListener('change', schedulePreview);
      $(id).addEventListener('input', schedulePreview);
    });
    $('place').addEventListener('change', onPlaceChange);
    $('form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    $('addEvent').addEventListener('click', function () { addEventRow(); });
    onCalendarChange();
    if (p.year && p.auto !== '0') submit();
  }

  function onCalendarChange() {
    var am = getCal() === 'am';
    $('leapWrap').style.display = am ? '' : 'none';
    if (!am) $('leap').checked = false;
    var d = parseInt($('day').value, 10);
    fillSelect($('day'), 1, am ? 30 : 31, function (i) { return String(i); }, d > (am ? 30 : 31) ? 1 : d);
    schedulePreview();
  }
  function getCal() { return document.querySelector('input[name=calendar]:checked').value; }

  function getForm() {
    return {
      name: $('name').value.trim(),
      gender: document.querySelector('input[name=gender]:checked').value,
      calendar: getCal(),
      day: parseInt($('day').value, 10), month: parseInt($('month').value, 10), year: parseInt($('year').value, 10),
      leap: $('leap').checked,
      hour: parseInt($('hour').value, 10), minute: parseInt($('minute').value, 10),
      viewYear: parseInt($('viewYear').value, 10) || new Date().getFullYear(),
      viewDate: $('viewDate').value,
      lateRat: $('lateRat').checked,
      leapMode: $('leapMode').value,
      tuHoaCanh: $('tuHoaCanh').value,
      hoangDao: $('hoangDao').value,
      trueSolar: $('trueSolar').checked,
      longitude: placeValue().split('|')[1],
      place: placeValue(),
      tz: $('tz').value,
      save: $('save').checked,
      events: getEvents()
    };
  }
  function setForm(v) {
    if (v.name != null) $('name').value = v.name;
    if (v.gender) (v.gender === 'nu' ? $('gNu') : $('gNam')).checked = true;
    if (v.calendar) (v.calendar === 'am' ? $('calAm') : $('calDuong')).checked = true;
    onCalendarChangeSilent();
    if (v.day) $('day').value = v.day;
    if (v.month) $('month').value = v.month;
    if (v.year) $('year').value = v.year;
    $('leap').checked = v.leap === true || v.leap === 'true' || v.leap === '1';
    if (v.hour != null && v.hour !== '') $('hour').value = v.hour;
    if (v.minute != null && v.minute !== '') $('minute').value = v.minute;
    if (v.viewYear) $('viewYear').value = v.viewYear;
    if (v.viewDate) $('viewDate').value = v.viewDate;
    if (v.lateRat != null) $('lateRat').checked = v.lateRat !== false && v.lateRat !== 'false';
    if (v.leapMode) $('leapMode').value = v.leapMode;
    if (v.tuHoaCanh) $('tuHoaCanh').value = v.tuHoaCanh;
    if (v.hoangDao) $('hoangDao').value = v.hoangDao;
    if (v.trueSolar != null) $('trueSolar').checked = v.trueSolar === true || v.trueSolar === 'true';
    if (v.place) {
      var has = Array.prototype.some.call($('place').options, function (o) { return o.value === v.place; });
      if (has) $('place').value = v.place;
      else { var pp = String(v.place).split('|'); $('place').value = 'custom'; $('lat').value = pp[0]; $('lon').value = pp[1]; }
    }
    $('placeCustom').style.display = $('place').value === 'custom' ? '' : 'none';
    if (v.tz != null && v.tz !== '') $('tz').value = v.tz;
    if (v.events) setEvents(v.events);
  }
  /* ---------- Sự kiện đã biết ---------- */
  var EV_LOAI = [['ketHon', 'Kết hôn'], ['sinhCon', 'Sinh con'], ['sucKhoe', 'Ốm nặng / tai nạn / phẫu thuật'], ['taiChinh', 'Mất tiền / thua lỗ / nợ'],
    ['giaDao', 'Biến cố gia đình / ly hôn / tang'], ['taiLoc', 'Phát tài / thu nhập tăng mạnh'], ['quanLoc', 'Thăng chức / đổi việc / mất việc']];
  function addEventRow(ev) {
    var row = document.createElement('div');
    row.className = 'ev-row';
    row.innerHTML = '<input type="number" class="ev-nam" min="1800" max="2300" placeholder="Năm" value="' + (ev && ev.nam ? esc(ev.nam) : '') + '">' +
      '<select class="ev-loai">' + EV_LOAI.map(function (x) { return '<option value="' + x[0] + '"' + (ev && ev.loai === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn btn-ghost btn-sm ev-del" title="Xóa">✕</button>';
    row.querySelector('.ev-del').addEventListener('click', function () { row.remove(); });
    $('events').appendChild(row);
  }
  function getEvents() {
    var out = [];
    document.querySelectorAll('#events .ev-row').forEach(function (r) {
      var n = parseInt(r.querySelector('.ev-nam').value, 10);
      if (n) out.push({ nam: n, loai: r.querySelector('.ev-loai').value });
    });
    return out;
  }
  function setEvents(list) {
    $('events').innerHTML = '';
    (list || []).forEach(addEventRow);
    if (list && list.length) $('evWrap').open = true;
  }

  function onCalendarChangeSilent() {
    var am = getCal() === 'am';
    $('leapWrap').style.display = am ? '' : 'none';
    fillSelect($('day'), 1, am ? 30 : 31, function (i) { return String(i); }, 1);
  }

  var previewTimer = null;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(preview, 350);
  }
  function preview() {
    var f = getForm();
    var box = $('preview');
    if (!(f.year >= 1800 && f.year <= 2200)) { box.innerHTML = 'Năm sinh cần trong khoảng 1800 – 2200.'; return; }
    if (!hasServer()) { box.textContent = ''; return; }
    box.innerHTML = '<span class="muted">Đang đổi lịch…</span>';
    call('doiLich', [f], function (r) {
      var gio = CHI[Math.floor((f.hour + 1) / 2) % 12];
      if (!r.ok) { box.innerHTML = '⚠ ' + esc(r.msg); return; }
      if (f.calendar === 'am') {
        box.innerHTML = '☀ Dương lịch: <b>' + r.solar.day + '/' + r.solar.month + '/' + r.solar.year + '</b> · giờ ' + gio +
          (r.leapMonth ? '<br><small class="muted">Năm ' + f.year + ' có tháng ' + r.leapMonth + ' nhuận</small>' : '');
      } else {
        var l = r.lunar;
        box.innerHTML = '☾ Âm lịch: <b>' + l.day + '/' + l.month + (l.leap ? ' (nhuận)' : '') + '/' + l.year + '</b> · giờ ' + gio;
      }
    }, function () { box.textContent = ''; });
  }

  function submit() {
    var f = getForm();
    if (!(f.year >= 1800 && f.year <= 2200)) { toast('Năm sinh cần trong khoảng 1800 – 2200.', true); return; }
    storeSet('tcc_last_input', JSON.stringify(f));
    loading(true);
    state.input = f;
    call('lapLaSo', [f], function (res) {
      loading(false);
      state.result = res;
      if (res.soDu != null) { state.soDu = res.soDu; capNhatUser(); }
      render(res);
      if (res.khach) toast(res.canMo ? 'Đã lập lá số – lá số này chưa mở khóa, bạn đang xem phần hé lộ ✦' : 'Đã lập lá số (bản xem giới hạn – đăng nhập để xem đầy đủ) ✦');
      else if (res.saved) toast('Đã lập lá số và lưu vào Google Sheet ✦');
      else if (res.saveError) toast('Đã lập lá số (chưa lưu được: ' + res.saveError + ')', true);
      else toast('Đã lập lá số ✦');
    });
  }


  /* ------------------------ TÀI KHOẢN ------------------------ */
  var VAI_TRO = { chu: 'Chủ sở hữu', vip: 'Thành viên VIP', thanhVien: 'Thành viên' };
  function toanQuyen() { var u = state.nguoiDung; return !!u && (u.vaiTro === 'chu' || u.vaiTro === 'vip'); }
  function fmtXu(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' xu'; }
  function fmtTien(n) { return (Number(n) || 0).toLocaleString('vi-VN') + 'đ'; }
  function capNhatUser() {
    var u = state.nguoiDung;
    $('btnLogin').style.display = u ? 'none' : '';
    $('btnUser').style.display = u ? '' : 'none';
    if (u) $('btnUser').textContent = (u.vaiTro === 'chu' ? '👑 ' : u.vaiTro === 'vip' ? '⭐ ' : '👤 ') + (u.hienThi || u.ten) +
      (!toanQuyen() && state.soDu != null ? ' · ' + fmtXu(state.soDu) : '');
    $('btnNapTop').style.display = u && !toanQuyen() ? '' : 'none';
    if (state.result) { dungMucLuc(); veCta(); veQc(); }
  }
  function datPhien(token, u) {
    state.token = token || ''; state.nguoiDung = u || null;
    if (!u) state.soDu = null;
    storeSet('tcc_token', state.token);
    capNhatUser();
  }
  function lapLai() { if (state.result && hasServer()) submit(); }
  function authTab(t) {
    document.querySelectorAll('[data-auth]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-auth') === t); });
    $('loginForm').style.display = t === 'in' ? '' : 'none';
    $('regForm').style.display = t === 'up' ? '' : 'none';
  }
  function moDangNhap(ghiChu, tab) {
    $('lgErr').textContent = ''; $('rgErr').textContent = ''; $('lgPass').value = '';
    $('authNote').textContent = ghiChu || 'Chưa đăng nhập bạn vẫn lập được lá số và xem phần hé lộ. Đăng nhập để mở khóa luận giải, lưu lịch sử và tải PDF.';
    authTab(tab || 'in');
    $('loginModal').classList.add('show');
    setTimeout(function () { $(tab === 'up' ? 'rgUser' : 'lgUser').focus(); }, 50);
  }
  function sauDangNhap(r) {
    datPhien(r.token, r.nguoiDung);
    $('loginModal').classList.remove('show');
    toast('Xin chào ' + (r.nguoiDung.hienThi || r.nguoiDung.ten) + ' ✦');
    taiVi();
    if (state.result && state.result.khach) lapLai();
    if (state.sauDangNhap) { var f = state.sauDangNhap; state.sauDangNhap = null; f(); }
  }
  function dangNhapGo(e) {
    if (e) e.preventDefault();
    var u = $('lgUser').value.trim(), p = $('lgPass').value;
    if (!u || !p) { $('lgErr').textContent = 'Nhập tên đăng nhập và mật khẩu.'; return; }
    $('lgGo').disabled = true; $('lgErr').textContent = 'Đang kiểm tra…';
    call('dangNhap', [u, p], function (r) { $('lgGo').disabled = false; $('lgPass').value = ''; sauDangNhap(r); },
      function (err) { $('lgGo').disabled = false; $('lgErr').textContent = (err && err.message) || String(err); });
  }
  function dangKyGo(e) {
    if (e) e.preventDefault();
    if ($('rgPass').value !== $('rgPass2').value) { $('rgErr').textContent = 'Hai lần nhập mật khẩu không khớp.'; return; }
    $('rgGo').disabled = true; $('rgErr').textContent = 'Đang tạo tài khoản…';
    call('dangKy', [$('rgUser').value, $('rgPass').value, $('rgName').value, $('rgContact').value, $('rgRef').value], function (r) {
      $('rgGo').disabled = false; ['rgPass', 'rgPass2'].forEach(function (id) { $(id).value = ''; }); sauDangNhap(r);
    }, function (err) { $('rgGo').disabled = false; $('rgErr').textContent = (err && err.message) || String(err); });
  }
  function dangXuatGo() {
    var t = state.token;
    datPhien('', null);

  /** Tình trạng mua của lá số đang xem → nội dung kêu gọi mở khóa (null nếu đã đủ quyền) */

  function starHtml(s, cls) {
    var sup = s.b ? '<sup>' + s.b + '</sup>' : '';
    var hoa = s.hoa ? '<span class="hoa-tag hoa-' + s.hoa + '">' + s.hoa.charAt(0) + '</span>' : '';

    return '<span class="star h-' + s.h + (cls ? ' ' + cls : '') + '" title="' + esc(s.n + (info[2] ? ' – ' + info[2] : '')) + '">' + esc(s.n) + sup + hoa + '</span>';
  }
  function phuList(arr) {
    return arr.filter(function (s) { return !s.hoaOf; })
      .sort(function (a, b) {
        var ia = MAJOR.indexOf(a.n), ib = MAJOR.indexOf(b.n);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
      })
      .map(function (s) {
        var minor = MAJOR.indexOf(s.n) < 0 ? ' minor' : '';
        var sup = s.b ? '<sup>' + s.b + '</sup>' : '';
        var hoa = s.hoa ? '<span class="hoa-tag hoa-' + s.hoa + '">' + s.hoa.charAt(0) + '</span>' : '';
        var weight = MAJOR.indexOf(s.n) >= 0 && MAJOR.indexOf(s.n) < 18 ? 'font-weight:600' : '';
        return '<div class="h-' + s.h + minor + '" style="' + weight + '">' + esc(s.n) + sup + hoa + '</div>';
      }).join('');
  }

  // Sao vòng Bác Sĩ – Thái Tuế đặt chung cột phụ tinh: cát/trung bên trái, hung bên phải
  function vongList(p, hung) {

  function renderChart(res) {
    var tv = res.tuvi, I = tv.info, P = tv.palaces;

      var chinh = p.chinh.length ? p.chinh.map(function (s) { return starHtml(s); }).join('')
        : '<span class="vcd">Vô chính diệu</span>';
      html += '<div class="' + cls + '" data-chi="' + p.chi + '" style="grid-row:' + g[0] + ';grid-column:' + g[1] + '">' +

        '<span class="c-dh">' + p.daiHan + flags + '</span></div>' +
        '<div class="c-chinh">' + chinh + '</div>' +

        (p.luu.length ? '<div class="c-luu">' + p.luu.map(function (x) { return '<span>' + esc(x) + '</span>'; }).join('') + '</div>' : '') +
        '<div class="c-foot"><span class="ts">' + esc(p.trangSinh || '') + '</span><span class="th">' + esc(p.tieuHan || '') + '</span></div>' +
        '</div>';
    });

    var B = res.battu;
    var l = I.lunar, s = I.solar;
    var pill = B.pillars.map(function (x) {
      return '<div>' + x.tru + '<b><span class="h-' + x.canHanh + '">' + CAN_HAN[x.can] + '</span><span class="h-' + x.chiHanh + '">' + CHI_HAN[x.chi] + '</span></b>' + esc(x.canTen + ' ' + x.chiTen) + '</div>';
    }).join('');
    html += '<div class="center">' +
      '<svg class="chart-lines" id="chartLines"></svg><div class="bg-han">紫微</div>' +

      '<div class="ct-name">' + esc(I.name) + '</div>' +
      '<dl class="ct-grid">' +
      '<dt>Dương lịch</dt><dd>' + pad(I.hour) + ':' + pad(I.minute) + ' · ' + s.day + '/' + s.month + '/' + s.year + '</dd>' +
      '<dt>Âm lịch</dt><dd>' + l.day + '/' + l.month + (l.leap ? ' nhuận' : '') + '/' + l.year + ' · giờ ' + esc(I.gioTen) + '</dd>' +
      '<dt>Can chi</dt><dd>Năm ' + esc(I.namCanChi) + ' · Tháng ' + esc(I.thangCanChi) + '<br>Ngày ' + esc(I.ngayCanChi) + ' · Giờ ' + esc(I.gioCanChi) + '</dd>' +
      '<dt>Âm dương</dt><dd>' + esc(I.amDuong) + ' · ' + (I.thuan ? 'đi thuận' : 'đi nghịch') + '</dd>' +
      '<dt>Bản mệnh</dt><dd class="h-' + I.banMenh.hanh + '">' + esc(I.banMenh.ten) + '</dd>' +
      '<dt>Cục</dt><dd class="h-' + I.cucHanh + '">' + esc(I.cuc) + '</dd>' +

      '<dt>Năm xem</dt><dd>' + I.viewYear + ' (' + esc(I.viewCanChi) + ') · ' + I.tuoi + ' tuổi</dd>' +

    var chart = $('chart');

  function applyOptions() {

  function cellOf(chi) { return $('chart').querySelector('.cung[data-chi="' + chi + '"]'); }

  function selectPalace(chi) {
    state.sel = chi;
    var tam = [(chi + 4) % 12, (chi + 8) % 12], xung = (chi + 6) % 12;
    $('chart').querySelectorAll('.cung').forEach(function (el) {
      var c = parseInt(el.getAttribute('data-chi'), 10);
      el.classList.toggle('sel', c === chi);
      el.classList.toggle('tamhop', tam.indexOf(c) >= 0);
      el.classList.toggle('xungchieu', c === xung);
    });
    drawOverlay();
    renderPalaceDetail(chi);
  }

  function drawOverlay() {
    var svg = $('chartLines');
    var chart = $('chart');
    if (!svg || !chart || !state.result) return;
    var cr = chart.getBoundingClientRect();
    if (!cr.width) return;
    var ctr = chart.querySelector('.center').getBoundingClientRect();
    svg.setAttribute('viewBox', '0 0 ' + ctr.width + ' ' + ctr.height);
    svg.setAttribute('width', ctr.width);
    svg.setAttribute('height', ctr.height);
    var cx = cr.width / 2, cy = cr.height / 2;
    // điểm neo: điểm trên cạnh cung gần tâm lá số nhất (toạ độ theo khung Thiên Bàn)
    function anchor(chi) {
      var r = cellOf(chi).getBoundingClientRect();
      var x0 = r.left - cr.left, y0 = r.top - cr.top, x1 = x0 + r.width, y1 = y0 + r.height;
      return [Math.min(Math.max(cx, x0), x1) - (ctr.left - cr.left), Math.min(Math.max(cy, y0), y1) - (ctr.top - cr.top)];
    }
    var out = '';
    if ($('optLines').checked && state.sel != null) {
      var c = state.sel, a = anchor(c), b = anchor((c + 4) % 12), d = anchor((c + 8) % 12), x = anchor((c + 6) % 12);
      out += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
      out += '<line x1="' + b[0] + '" y1="' + b[1] + '" x2="' + d[0] + '" y2="' + d[1] + '"/>';
      out += '<line x1="' + d[0] + '" y1="' + d[1] + '" x2="' + a[0] + '" y2="' + a[1] + '"/>';
      out += '<line class="xung" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + x[0] + '" y2="' + x[1] + '"/>';
    }
    svg.innerHTML = out;

    // Huy hiệu Tuần – Triệt nằm trên ranh giới 2 cung
    chart.querySelectorAll('.badge-tt').forEach(function (e) { e.remove(); });
    var P = state.result.tuvi.palaces;
    ['tuan', 'triet'].forEach(function (k) {
      var list = P.filter(function (p) { return p[k]; }).map(function (p) { return p.chi; });
      if (list.length !== 2) return;
      var ra = cellOf(list[0]).getBoundingClientRect(), rb = cellOf(list[1]).getBoundingClientRect();
      // đặt trên giao điểm ranh giới hai cung với Thiên Bàn
      var x, y, midX = cr.width / 2, midY = cr.height / 2;
      if (Math.abs(ra.top - rb.top) < 2) {
        x = Math.max(ra.left, rb.left) - cr.left;
        y = (ra.top - cr.top < midY) ? ra.bottom - cr.top : ra.top - cr.top;
      } else {
        y = Math.max(ra.top, rb.top) - cr.top;
        x = (ra.left - cr.left < midX) ? ra.right - cr.left : ra.left - cr.left;
      }
      var el = document.createElement('div');
      el.className = 'badge-tt ' + k;
      el.textContent = k === 'tuan' ? 'TUẦN' : 'TRIỆT';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.transform = 'translate(-50%, -50%)';
      chart.appendChild(el);
    });
  }

  function chipStar(s, info) {

    return '<span class="chip ' + cls + '"><b class="h-' + s.h + '">' + esc(s.n) + '</b>' + (s.b ? ' <small>(' + ({ M: 'Miếu', V: 'Vượng', 'Đ': 'Đắc', B: 'Bình', H: 'Hãm' }[s.b]) + ')</small>' : '') +

  }

  function renderPalaceDetail(chi) {
    var res = state.result, P = res.tuvi.palaces[chi], SI = res.saoInfo || {};
    var luan = (res.tuvi.luanGiai.cung || []).filter(function (c) { return c.cung === P.cung; })[0];

    var html = '<h3>Cung ' + esc(P.cung) + (P.isThan ? ' · Thân cư' : '') + ' <small class="muted" style="font-size:15px">(' + esc(P.canTen + ' ' + P.chiTen) + ' – hành ' + CHI_HANH[P.chi] + ')</small></h3>' +
      '<div class="sub">Chủ về ' + esc(luan ? luan.yNghia : '') + '. Đại hạn ' + P.daiHan + '–' + (P.daiHan + 9) + ' tuổi · Tiểu hạn năm ' + esc(P.tieuHan) +
      (P.tuan ? ' · <b>Tuần</b>' : '') + (P.triet ? ' · <b>Triệt</b>' : '') + '</div>' +
      '<div class="star-list">' + all.map(function (s) { return chipStar(s, SI[s.n]); }).join('') + '</div>' +
      '<div class="star-list">' + rings.map(function (r) {
        var inf = SI[r[1]] || [];
        return '<span class="chip neutral"><small>' + r[0] + ':</small> <b>' + esc(r[1] || '') + '</b>' + (inf[2] ? ' <small>· ' + esc(inf[2]) + '</small>' : '') + '</span>';
      }).join('') + '</div>' +
      (P.luu.length ? '<div class="star-list">' + P.luu.map(function (x) { return '<span class="chip" style="color:var(--lavender)">' + esc(x) + '</span>'; }).join('') + '</div>' : '');
    if (luan && !luan.lines) html += '<div class="lock-cta"><p>🔒 Lời luận chi tiết của cung này hiện khi mở khóa lá số (Bản mở ' + fmtXu(giaPhan('co_ban').xu) + ').</p><button type="button" class="btn btn-primary btn-sm" data-mua="co_ban">Mở khóa</button></div>';
    if (luan && luan.lines) {
      html += '<div class="meter"><i style="width:' + scorePct(luan.diem) + '%"></i></div>' +
        '<p><b>Đánh giá: ' + esc(luan.danhGia) + '</b> (' + d10(luan.diem) + '/10)</p><ul>' +
        luan.lines.map(function (x) { return '<li>' + hl(x) + '</li>'; }).join('') + '</ul>';
    }
    html += '<p class="muted" style="font-size:12.5px">Tam hợp: ' + CHI[(chi + 4) % 12] + ' – ' + CHI[(chi + 8) % 12] + ' · Xung chiếu: ' + CHI[(chi + 6) % 12] +
      ' · Nhấp vào cung khác trên lá số để xem.</p>';
    $('palaceDetail').innerHTML = html;
  }

  function d10(d) { return fmt(Math.round(100 / (1 + Math.exp(-d / 3))) / 10); }
  function scorePct(d) { return Math.max(4, Math.min(100, Math.round((d + 6) / 16 * 100))); }
  function rateClass(d) { return d >= 5 ? 'r5' : d >= 2.5 ? 'r4' : d >= 0.5 ? 'r3' : d > -1.5 ? 'r2' : d > -4 ? 'r1' : 'r0'; }

  /* ---------- Khối luận giải dùng chung ---------- */
  function itemHtml(x) {
    var t = String(x), cls = '';

  var CACH_CHAM = [
    'Mọi điểm hiển thị đều quy về THANG 10: 5 = trung bình; 7 trở lên = tốt; 8,5 trở lên = rất tốt; dưới 4 = kém; dưới 2,5 = cần thận trọng. Điểm không phải xác suất, mà là mức "thuận – nghịch" so với mặt bằng chung.',

  /** Ghép phần "Đối chiếu Tứ Trụ" vào lời luận một cung Tử Vi */
  function voiTuTru(res, c) {
    var L = (res.battuChiTiet && res.battuChiTiet.linhVuc) || [], b = L.filter(function (x) { return x.key === c.cung; })[0];

    var dong = (c.diem >= 0.5) === (b.diem >= 0.5), o = heSo(c, 1);

  function tvCungDiem(res, key) { var c = (res.tuvi.luanGiai.cung || []).filter(function (x) { return x.cung === key; })[0]; return c ? c.diem : null; }

            '<span class="yr-bar"><i class="' + c.loai + '" style="width:' + Math.min(100, x.diem * 10) + '%"></i></span><em>' + fmt(Math.min(10, x.diem)) + '/10</em></summary>' +
            '<div class="yr-meta">Tiểu hạn tại ' + esc(x.cungTH) + ' · lưu đại hạn tại ' + esc(x.ldh) + ' · đại hạn ' + esc(x.daiHan) + '</div><ul class="yr-ly">' +

    bad: ['Hãm', 'Cẩn trọng', 'cần thận trọng', 'tương khắc', 'Lục xung', 'xung', 'Tương hại', 'Tương hình', 'kỵ thần', 'Kém']
  };
  var KW_RE = null, KW_LOAI = {};
  function kwInit(res) {
    var ds = [];
    Object.keys((res && res.saoInfo) || {}).forEach(function (n) { if (n.length > 2) { ds.push(n); KW_LOAI[n] = 'star'; } });
    Object.keys(KW_THEM).forEach(function (k) { KW_THEM[k].forEach(function (n) { ds.push(n); if (!KW_LOAI[n]) KW_LOAI[n] = k; }); });
    ds.sort(function (a, b) { return b.length - a.length; });
    var L = 'A-Za-zÀ-ỹĐđ';
    KW_RE = new RegExp('(?<![' + L + '])(' + ds.map(function (x) { return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|') + ')(?![' + L + '])', 'g');
  }
  function hl(t) {
    var s = esc(String(t == null ? '' : t));
    if (!KW_RE) return s;
    var i = s.indexOf(': '), lead = '';
    if (i > 2 && i < 80 && s.slice(0, i).indexOf('. ') < 0) { lead = s.slice(0, i + 1); s = s.slice(i + 1); }
    function rep(x) { return x.replace(KW_RE, function (m) { return '<b class="kw kw-' + (KW_LOAI[m] || 'kw') + '">' + m + '</b>'; }); }
    return (lead ? '<b class="lead">' + rep(lead) + '</b>' : '') + rep(s);
  }

  /* ======================== TOOLTIP ======================== */
  function tipInit() {
    var tip = document.createElement('div'); tip.id = 'tip'; tip.className = 'tip'; document.body.appendChild(tip);
    function show(e, el) {
      tip.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g, '<br>');
      tip.classList.add('show');
      var x = e.clientX + 14, y = e.clientY + 14, w = tip.offsetWidth, h = tip.offsetHeight;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
      if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
      tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
    }
    document.addEventListener('mousemove', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(e, el); else tip.classList.remove('show'); });
    document.addEventListener('click', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) show(e, el); });
    window.addEventListener('scroll', function () { tip.classList.remove('show'); }, { passive: true });
  }

  /* ======================== BIỂU ĐỒ (SVG) ======================== */
  var C_GOLD = '#b08a2c', C_JADE = '#1fa688', C_VIOLET = '#4f8ff0', C_CORAL = '#d9503f';
  function fmt(v) { return (Math.round(v * 10) / 10).toString().replace('.', ','); }
  /** Đường vận trình cả đời (một chuỗi) */
  function lifeChart(chang, tieuDe, phu) {
    if (!chang || !chang.length) return '';
    var W = 760, H = 250, L = 40, R = 16, T = 26, B = 42, n = chang.length;
    // quy về thang 10 (5 = trung bình) cho mọi hệ
    chang = chang.map(function (c) { var o2 = {}; for (var k in c) o2[k] = c[k]; o2.diem = Math.round(100 / (1 + Math.exp(-c.diem / 3))) / 10; return o2; });
    var vals = chang.map(function (c) { return c.diem; }), mx = 10, mn = 0;
    function X(i) { return L + (n === 1 ? 0 : i * (W - L - R) / (n - 1)); }
    function Y(v) { return T + (mx - v) * (H - T - B) / (mx - mn); }
    var o = '<figure class="chart-fig"><figcaption><b>' + esc(tieuDe || 'Đường vận trình cả đời') + '</b><span>' + esc(phu || 'Thang 10 (đường giữa = 5, trung bình) · tổng hợp Tử Vi + Bát Tự + Hà Lạc theo từng chặng · rê chuột để xem') + '</span></figcaption>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" class="vchart" role="img" aria-label="Đường vận trình theo các chặng đời">';
    o += '<defs><linearGradient id="lcFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + C_GOLD + '" stop-opacity=".35"/><stop offset="1" stop-color="' + C_GOLD + '" stop-opacity="0"/></linearGradient></defs>';
    o += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(5) + '" y2="' + Y(5) + '" class="ch-zero"/>';
    for (var g = mn; g <= mx; g += 2) o += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(g) + '" y2="' + Y(g) + '" class="' + 'ch-grid' + '"/><text x="' + (L - 8) + '" y="' + (Y(g) + 4) + '" class="ch-ax" text-anchor="end">' + g + '</text>';
    var pts = chang.map(function (c, i) { return X(i) + ',' + Y(c.diem); });
    o += '<path d="M' + X(0) + ',' + Y(mn) + ' L' + pts.join(' L') + ' L' + X(n - 1) + ',' + Y(mn) + ' Z" fill="url(#lcFill)"/>';
    o += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + C_GOLD + '" stroke-width="2.2" stroke-linejoin="round"/>';
    var iMax = vals.indexOf(Math.max.apply(null, vals));

    function laTieuDe(n) {
      if (n.nodeType !== 1) return false;
      return /^H[1-6]$/.test(n.tagName) || n.tagName === 'SUMMARY' || ['panel-title', 'dd-h', 'lede', 'pdf-tiep', 'meter'].some(function (c) { return n.classList.contains(c); }) ||
        n.classList.contains('lg-sec') && n.children.length === 1;
    }
    function voRong(el, tiep) {
      var v = el.cloneNode(false), giu = v;
      if (el.tagName === 'TABLE') {
        Array.prototype.forEach.call(el.children, function (c) { if (c.tagName !== 'TBODY') v.appendChild(c.cloneNode(true)); });
        giu = document.createElement('tbody'); v.appendChild(giu);
      } else if (el.tagName === 'OL' && tiep) v.setAttribute('start', (+el.getAttribute('start') || 1) + el.children.length);
      if (tiep && el.classList && (el.classList.contains('panel') || el.classList.contains('ht-card') || el.classList.contains('dd-card'))) {
        var t = el.querySelector('.panel-title, h3');
        if (t) { var d = document.createElement('div'); d.className = 'pdf-tiep'; d.textContent = '↳ tiếp: ' + t.textContent.trim(); giu.appendChild(d); }
      }
      return { v: v, giu: giu };
    }
    function danTrang(sec) {
      var trang = [], pg;
      function moi() { pg = document.createElement('div'); pg.className = 'pdf-pg'; sec.parentNode.insertBefore(pg, sec); trang.push(pg); }
      function tran() { return pg.scrollHeight > pageHpx + 1; }
      function datVao(el, cha) {                         // trả về phần còn lại chưa xếp được (hoặc null)
        cha.appendChild(el);
        if (!tran()) return null;
        cha.removeChild(el);
        if (!tachDuoc(el)) return el;
        var ds = danhSachCon(el), a = voRong(el, false);
        cha.appendChild(a.v);
        if (tran()) { cha.removeChild(a.v); return el; }
        var i = 0, du = null;
        for (; i < ds.length; i++) { du = datVao(ds[i], a.giu); if (du) break; }
        if (!du) return null;
        var sau = [du].concat(ds.slice(i + 1)), doi = [];
        while (a.giu.lastChild && laTieuDe(a.giu.lastChild)) doi.unshift(a.giu.removeChild(a.giu.lastChild)); // không để tiêu đề mồ côi
        var coNoi = Array.prototype.some.call(a.giu.childNodes, function (n) { return coY(n) && !laTieuDe(n); });
        var b = voRong(el, coNoi);
        if (!coNoi) { cha.removeChild(a.v); Array.prototype.slice.call(a.giu.childNodes).forEach(function (n) { b.giu.appendChild(n); }); }
        doi.concat(sau).forEach(function (n) { b.giu.appendChild(n); });
        return b.v;
      }
      moi();
      danhSachCon(sec).forEach(function (khoi) {
        var con = khoi;
        while (con) {
          con = datVao(con, pg);
          if (con) {
            if (!Array.prototype.some.call(pg.childNodes, coY)) { pg.appendChild(con); con = null; } // quá khổ: để riêng 1 trang, thu nhỏ khi in
            moi();
          }
        }
      });
      if (!Array.prototype.some.call(pg.childNodes, coY)) { pg.remove(); trang.pop(); }
      sec.remove();
      return trang;
    }
    function chupPhan(sec, trangDau) {
      var ds = danTrang(sec);
      var cao = ds.map(function (pg) { var h = Math.max(pageHpx, pg.scrollHeight); pg.style.height = Math.ceil(h) + 'px'; return Math.ceil(h); });
      var lo = [], cur = null;                             // gom vài trang một lần chụp cho nhanh
      ds.forEach(function (pg, i) {
        if (!cur || cur.h + cao[i] > 5200) { cur = { ds: [], h: 0 }; lo.push(cur); }
        cur.ds.push(i); cur.h += cao[i];
      });
      var p = Promise.resolve(), dau = true;
      lo.forEach(function (L) {
        p = p.then(function () {
          var goc = ds[L.ds[0]], r0 = goc.getBoundingClientRect();
          var wrap = document.createElement('div'); wrap.className = 'pdf-lo'; goc.parentNode.insertBefore(wrap, goc);
          L.ds.forEach(function (i) { wrap.appendChild(ds[i]); });
          var o = {}; Object.keys(opt).forEach(function (k) { o[k] = opt[k]; });
          return html2canvas(wrap, o).then(function (cv) {
            var off = 0;
            L.ds.forEach(function (i) {
              var sy = Math.round(off * scale), sh = Math.min(cv.height - sy, Math.round(cao[i] * scale)); off += cao[i];
              if (sh <= 2) return;
              var c = document.createElement('canvas'); c.width = cv.width; c.height = sh;
              c.getContext('2d').drawImage(cv, 0, sy, cv.width, sh, 0, 0, cv.width, sh);
              trangMoi();
              if (dau && trangDau) { trangDau(soTrang); dau = false; }
              var k = Math.min(1, pageHpx / cao[i]), wPt = CW * k, hPt = cao[i] * pxPt * k;
              pdf.addImage(c.toDataURL('image/jpeg', 0.8), 'JPEG', MX + (CW - wPt) / 2, MT, wPt, hPt, undefined, 'FAST');
            });
            wrap.remove();
          });
        });
      });
      return p;
    }
    loading(true); setLoadingText('Đang chuẩn bị báo cáo PDF…');
    var tabCu = document.querySelector('.tab.active') ? document.querySelector('.tab.active').getAttribute('data-tab') : 'chart';
    var chuoi = Promise.resolve(), anhLaSo = null, kichLaSo = [1, 1];
    if (chon.indexOf('chart') >= 0) {
      chuoi = chuoi.then(function () { showTab('chart'); return sleep(150); }).then(function () {
        drawOverlay();
        return html2canvas($('chartFrame'), { scale: 2, backgroundColor: null, useCORS: true, logging: false });
      }).then(function (c) { anhLaSo = c.toDataURL('image/png'); kichLaSo = [c.width, c.height]; });
    }
    var dsPhan = chon.map(function (k) { return { k: k, ten: PDF_TEN[k], hook: PDF_HOOK[k], trang: 0 }; });
    var coTom = !!(res.moRong && res.moRong.tongHop.tomLuoc) || !!(res.khach && res.teaser && res.teaser.tom);
    if (coTom) dsPhan.unshift({ k: 'tom', ten: PDF_TEN.tom, hook: PDF_HOOK.tom, trang: 0 });
    return chuoi.then(function () {
      var html = '<div class="pdf-page-cover">' + bia(res, brand, demo) + '</div>';
      dsPhan.forEach(function (x, i) {
        html += '<div class="pdf-sec" data-k="' + x.k + '"><div class="pdf-h"><span class="pdf-no">Phần ' + pad(i + 1) + '</span><b>' + esc(x.ten) + '</b><em>' + esc(x.hook) + '</em></div></div>';
      });
      html += '<div class="pdf-sec" data-k="ket">' + (demo ? trangMua(brand) : trangKet(brand)) + '</div>';
      root.innerHTML = html;
      var DM = demo ? (res.teaser || {}) : null;
      root.querySelectorAll('.pdf-sec').forEach(function (sec) {
        var k = sec.getAttribute('data-k');
        if (demo && k !== 'ket') {
          var src = document.createElement('div'); src.className = 'pdf-sec pdf-src'; src.setAttribute('data-src', k); root.appendChild(src);
          var d = DM[k];
          var card = document.createElement('div'); card.innerHTML = demoCard(d || { lo: [], an: ['Nội dung phần này có trong bản đầy đủ'] }); while (card.firstChild) sec.appendChild(card.firstChild);
          if (k === 'chart' && anhLaSo) { var im = document.createElement('div'); im.className = 'panel section'; var hh2 = 640, ww2 = Math.min(W - 40, hh2 * kichLaSo[0] / kichLaSo[1]); im.innerHTML = '<img class="pdf-chart" src="' + anhLaSo + '" style="width:' + Math.round(ww2) + 'px;height:' + Math.round(ww2 * kichLaSo[1] / kichLaSo[0]) + 'px">'; sec.insertBefore(im, sec.querySelector('.demo-card')); sec.querySelector('.demo-prev').remove(); return; }
          sec = src;
        }
        if (k === 'tom') {
          var t = document.createElement('div'); t.innerHTML = tongHopHtml(res, true); if (t.firstChild) sec.appendChild(chuanHoa(t.firstChild));
          var mm = $('page-tong').querySelector('.tg[data-g="chan"] .mm-wrap'); if (mm) sec.appendChild(chuanHoa(mm.cloneNode(true)));
          return;
        }
        if (PDF_TG.indexOf(k) >= 0) {
          var g = $('page-tong').querySelector('.tg[data-g="' + k + '"]');
          if (g) Array.prototype.forEach.call(g.children, function (c) { if (!c.classList.contains('tg-head')) sec.appendChild(chuanHoa(c.cloneNode(true))); });
          return;
        }
        if (k === 'chart') {
          var w = document.createElement('div'); w.className = 'panel section'; var hMax = 1000, wMax = W - 40, ww = wMax, hh = ww * kichLaSo[1] / kichLaSo[0];
          if (hh > hMax) { hh = hMax; ww = hh * kichLaSo[0] / kichLaSo[1]; }
          w.innerHTML = '<img class="pdf-chart" src="' + anhLaSo + '" alt="Lá số Tử Vi" width="' + Math.round(ww) + '" height="' + Math.round(hh) + '" style="width:' + Math.round(ww) + 'px;height:' + Math.round(hh) + 'px">';
          sec.appendChild(w); var pd = $('palaceDetail'); if (pd) sec.appendChild(chuanHoa(pd.cloneNode(true)));
          Array.prototype.forEach.call($('page-luan').children, function (c) { sec.appendChild(chuanHoa(c.cloneNode(true))); });
          return;
        }
        var page = $('page-' + k);
        if (page) Array.prototype.forEach.call(page.children, function (c) { if (!c.classList.contains('subtabs') && !c.classList.contains('reveal') && !c.classList.contains('tab-lede')) sec.appendChild(chuanHoa(c.cloneNode(true))); });
      });
      return sleep(200);
    }).then(function () {
      // html2canvas vẽ SVG như ảnh độc lập → chép style tính toán vào thuộc tính để giữ màu
      var PROPS = ['fill', 'stroke', 'stroke-width', 'stroke-dasharray', 'opacity', 'fill-opacity', 'stroke-opacity', 'font-size', 'font-family', 'font-weight', 'font-style'];
      root.querySelectorAll('svg *').forEach(function (el) {
        var cs = getComputedStyle(el);
        PROPS.forEach(function (pp) { var v = cs.getPropertyValue(pp); if (v && v !== 'none' || pp === 'fill' || pp === 'stroke') el.setAttribute(pp, v); });
      });
      return sleep(50);
    }).then(function () {
      if (!demo) return;
      var srcs = root.querySelectorAll('.pdf-src'), p = Promise.resolve();
      Array.prototype.forEach.call(srcs, function (src) {
        p = p.then(function () {
          var k = src.getAttribute('data-src'), img = root.querySelector('.pdf-sec[data-k="' + k + '"] .demo-prev img');
          if (!img || src.scrollHeight < 20) { if (img) img.parentNode.remove(); return; }
          var o = {}; Object.keys(opt).forEach(function (x) { o[x] = opt[x]; }); o.scale = 1; o.y = 0; o.height = Math.min(src.scrollHeight, 640);
          return html2canvas(src, o).then(function (cv) {
            var c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; var g = c.getContext('2d');
            g.filter = 'blur(5px)'; g.drawImage(cv, 0, 0); g.filter = 'none';
            var gr = g.createLinearGradient(0, c.height * 0.45, 0, c.height); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, NEN_HEX);
            g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
            img.src = c.toDataURL('image/jpeg', 0.7); img.style.width = '100%';
          });
        });
      });
      return p.then(function () { srcs.forEach(function (x) { x.remove(); }); return sleep(120); });
    }).then(function () {
      setLoadingText('Đang dựng trang bìa…');
      var cv = root.querySelector('.pdf-page-cover');
      cv.style.height = Math.round(W * PH / CW * (CW / PW)) + 'px';
      var o = {}; Object.keys(opt).forEach(function (k) { o[k] = opt[k]; }); o.backgroundColor = '#08172e';
      return html2canvas(cv, o).then(function (c) { trangMoi(); dat(c, true); trangMoi(); /* chỗ cho mục lục */ });
    }).then(function () {
      var secs = root.querySelectorAll('.pdf-sec'), p = Promise.resolve();
      Array.prototype.forEach.call(secs, function (sec, i) {
        p = p.then(function () {
          setLoadingText('Đang dựng PDF – phần ' + (i + 1) + '/' + secs.length + '…');
          return chupPhan(sec, function (so) { if (dsPhan[i]) { dsPhan[i].trang = so; pdf.outline.add(null, dsPhan[i].ten, { pageNumber: so }); } });
        });
      });
      return p;
    }).then(function () {
      setLoadingText('Đang dựng mục lục…');
      var toc = document.createElement('div'); toc.className = 'pdf-sec'; toc.innerHTML = mucLuc(dsPhan); root.appendChild(toc);
      return sleep(80).then(function () { return html2canvas(toc, opt); }).then(function (c) {
        pdf.setPage(2); y = 0; dat(c);
      });
    }).then(function () {
      var tong = pdf.getNumberOfPages(), ten = res.tuvi.info.name || 'la-so';
      var txt = (demo ? 'BẢN XEM THỬ  ·  ' : '') + (brand.ten || 'Thiên Cơ Các') + '  ·  Bản đồ vận mệnh của ' + ten + (brand.lienHe ? '  ·  ' + brand.lienHe : '');
      for (var i = 2; i <= tong; i++) { pdf.setPage(i); pdf.addImage(chanTrang(txt, i, tong, sang), 'PNG', MX, PH - 26, CW, CW * 44 / 1600); }
      var slug = ten.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[đĐ]/g, 'd').replace(/\s+/g, '-').toLowerCase();
      pdf.setProperties({ title: 'Bản đồ vận mệnh – ' + ten, author: brand.ten || 'Thiên Cơ Các', subject: 'Tử Vi · Bát Tự · Chiêm tinh · Thần số học · Human Design' });
      pdf.save((demo ? 'xem-thu-' : '') + 'ban-do-van-menh-' + slug + '.pdf');
      toast('Đã tạo PDF ' + tong + ' trang ✦');
    }).catch(showErr).then(function () {
      root.remove(); loading(false); setLoadingText('Đang khởi quẻ, an sao…'); showTab(tabCu);
    });
  }

  /* ------------------------ LỊCH SỬ ------------------------ */
  function loadHistory() {
    var box = $('histBox');
    if (!state.token) { box.innerHTML = '<h2 class="panel-title"><span class="han">錄</span> Lịch sử lá số</h2><div class="lock-cta"><p>Đăng nhập để lưu và xem lại các lá số đã lập.</p><button type="button" class="btn btn-primary btn-sm" data-login>🔑 Đăng nhập</button></div>'; return; }
    box.innerHTML = '<h2 class="panel-title"><span class="han">錄</span> Lịch sử lá số</h2><span class="muted">Đang tải…</span>';
    call('getLichSu', [], function (list) {
      if (!list || !list.length) { box.innerHTML = '<h2 class="panel-title"><span class="han">錄</span> Lịch sử lá số</h2><p class="muted">Chưa có lá số nào được lưu.</p>'; return; }
      box.innerHTML = '<h2 class="panel-title"><span class="han">錄</span> Lịch sử lá số</h2><div class="hist-list">' + list.map(function (h) {
        return '<div class="hist-item"><div><b>' + esc(h.name) + '</b> · ' + esc(h.gender) + ' · ' + esc(h.canChi) +
          '<small>DL ' + esc(h.duong) + ' · ÂL ' + esc(h.am) + ' · ' + esc(h.cuc) + ' · lập lúc ' + esc(h.time) + '</small></div>' +
          '<div><button class="btn btn-ghost btn-sm" data-open="' + h.row + '">Mở</button> <button class="btn btn-ghost btn-sm" data-del="' + h.row + '">✕</button></div></div>';
      }).join('') + '</div>';
      box.querySelectorAll('[data-open]').forEach(function (b) {
        b.addEventListener('click', function () {
          var h = list.filter(function (x) { return String(x.row) === b.getAttribute('data-open'); })[0];
          if (h && h.input) { setForm(h.input); $('save').checked = false; submit(); }
        });
      });
      box.querySelectorAll('[data-del]').forEach(function (b) {
        b.addEventListener('click', function () {
          if (!confirm('Xóa lá số này khỏi Google Sheet?')) return;
          call('xoaLichSu', [b.getAttribute('data-del')], function () { toast('Đã xóa'); loadHistory(); });
        });
      });
    }, function (e) { box.innerHTML = '<p class="muted">Không tải được lịch sử: ' + esc(e && e.message) + '</p>'; });
  }

  /* ------------------------ KHỞI TẠO ------------------------ */
  document.addEventListener('DOMContentLoaded', function () {
    // Ảnh quảng bá (Anh.html – tùy chọn)
    if (typeof ANH_QC === 'string' && ANH_QC) $('anhQC').src = ANH_QC; else $('wlHero').classList.add('no-anh');
    function khamPha() {
      if (window.innerWidth < 1080) document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (!$('name').value.trim()) { $('name').focus(); toast('Nhập họ tên và ngày giờ sinh, rồi bấm "Lập Lá Số" để bắt đầu ✦'); return; }
      submit();
    }
    $('wlGo').addEventListener('click', khamPha); $('wlAnh').addEventListener('click', khamPha);
    initDieuHuong();
    initTaiKhoan();
    initForm();
    initCapDoi();
    tipInit();
    $('tabs').addEventListener('click', function (e) {
      var t = e.target.closest('.tab');
      if (t) showTab(t.getAttribute('data-tab'));
    });
    $('btnHistoryTop').addEventListener('click', function () { showTab('hist'); });
    ['optLuu', 'optMinor', 'optLines'].forEach(function (id) { $(id).addEventListener('change', applyOptions); });
    $('btnPrint').addEventListener('click', function () { window.print(); });
    $('btnPdfTop').addEventListener('click', moPdf);
    if ($('btnPdf')) $('btnPdf').addEventListener('click', moPdf);
    $('pdfCancel').addEventListener('click', function () { $('pdfModal').classList.remove('show'); });
    $('pdfModal').addEventListener('click', function (e) { if (e.target === $('pdfModal')) $('pdfModal').classList.remove('show'); });
    $('pdfAll').addEventListener('click', function () {
      var cb = $('pdfOpts').querySelectorAll('input'), all = Array.prototype.every.call(cb, function (x) { return x.checked; });
      cb.forEach(function (x) { x.checked = !all; });
    });
    $('pdfGo').addEventListener('click', function () {
      var chon = Array.prototype.filter.call($('pdfOpts').querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return x.value; });
      if (!chon.length) { toast('Hãy chọn ít nhất một phần.', true); return; }
      $('pdfModal').classList.remove('show');
      var brand = { ten: $('pdfBrand').value.trim(), lienHe: $('pdfContact').value.trim() };
      storeSet('tcc_pdf_brand', brand.ten); storeSet('tcc_pdf_contact', brand.lienHe);
      brand.uuDai = $('pdfOffer').value.trim(); storeSet('tcc_pdf_offer', brand.uuDai);
      xuatPdf(chon, parseFloat($('pdfQuality').value) || 1.5, $('pdfTheme').value === 'light', brand, $('pdfType').value === 'demo');
    });
    $('btnPng').addEventListener('click', function () {
      if (typeof html2canvas === 'undefined') { toast('Không tải được thư viện chụp ảnh – hãy dùng nút In.', true); return; }
      loading(true);
      html2canvas($('chartFrame'), { scale: 2, backgroundColor: getComputedStyle(document.body).backgroundColor || '#0a0c19', useCORS: true }).then(function (canvas) {
        loading(false);
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'la-so-tu-vi-' + (state.result.tuvi.info.name || 'thien-co-cac').replace(/\s+/g, '-') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(showErr);
    });
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawOverlay, 120); });
  });
})();
</script>
