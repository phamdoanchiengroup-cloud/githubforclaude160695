<script>
/* ================================================================

  var GRID = { 5: [1, 1], 6: [1, 2], 7: [1, 3], 8: [1, 4], 4: [2, 1], 9: [2, 4], 3: [3, 1], 10: [3, 4], 2: [4, 1], 1: [4, 2], 0: [4, 3], 11: [4, 4] };
  var MAJOR = ['Tả Phù', 'Hữu Bật', 'Văn Xương', 'Văn Khúc', 'Thiên Khôi', 'Thiên Việt', 'Lộc Tồn', 'Thiên Mã',
    'Hóa Lộc', 'Hóa Quyền', 'Hóa Khoa', 'Hóa Kỵ', 'Kình Dương', 'Đà La', 'Hỏa Tinh', 'Linh Tinh', 'Địa Không', 'Địa Kiếp',

  var $ = function (id) { return document.getElementById(id); };
  var state = { result: null, sel: null, token: '', nguoiDung: null };
  var CAN_TOKEN = { lapLaSo: 1, doGioSinh: 1, getLichSu: 1, xoaLichSu: 1, lapCapDoi: 1 };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function storeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* bỏ qua */ } }

  function hasServer() { return typeof google !== 'undefined' && google.script && google.script.run; }
  function call(fn, args, ok, fail) {
    if (!hasServer()) { (fail || showErr)({ message: 'Không tìm thấy máy chủ Apps Script. Hãy mở ứng dụng qua URL Web App.' }); return; }
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(fail || showErr), a = (args || []).slice();
    if (CAN_TOKEN[fn]) a.push(state.token || '');
    r[fn].apply(r, a);
  }

  function toast(msg, isErr) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.className = 'toast'; }, 3800);
  }
  function showErr(e) { loading(false); toast((e && e.message) || String(e), true); }
  function loading(on) { $('loading').className = 'loading' + (on ? ' show' : ''); }

  /* ------------------------ FORM ------------------------ */
  function fillSelect(sel, from, to, label, selected) {
    var html = '';
    for (var i = from; i <= to; i++) html += '<option value="' + i + '"' + (i === selected ? ' selected' : '') + '>' + label(i) + '</option>';
    sel.innerHTML = html;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }

  var NOI_SINH = [
    ['Việt Nam', [['Hà Nội', 21.03, 105.85], ['TP. Hồ Chí Minh', 10.78, 106.70], ['Hải Phòng', 20.86, 106.68], ['Đà Nẵng', 16.05, 108.20], ['Cần Thơ', 10.03, 105.78],
      ['Huế', 16.46, 107.59], ['Nha Trang', 12.24, 109.19], ['Đà Lạt', 11.94, 108.44], ['Vinh (Nghệ An)', 18.68, 105.68], ['Thanh Hóa', 19.81, 105.78],
      ['Nam Định', 20.42, 106.17], ['Thái Bình', 20.45, 106.34], ['Ninh Bình', 20.25, 105.97], ['Phủ Lý (Hà Nam)', 20.54, 105.91], ['Hải Dương', 20.94, 106.33],
      ['Hưng Yên', 20.65, 106.05], ['Bắc Ninh', 21.19, 106.08], ['Bắc Giang', 21.27, 106.19], ['Vĩnh Yên (Vĩnh Phúc)', 21.31, 105.60], ['Việt Trì (Phú Thọ)', 21.32, 105.40],
      ['Thái Nguyên', 21.59, 105.85], ['Hạ Long (Quảng Ninh)', 20.95, 107.08], ['Lạng Sơn', 21.85, 106.76], ['Cao Bằng', 22.67, 106.26], ['Bắc Kạn', 22.15, 105.83],
      ['Hà Giang', 22.82, 104.98], ['Tuyên Quang', 21.82, 105.21], ['Lào Cai', 22.49, 103.97], ['Yên Bái', 21.72, 104.91], ['Lai Châu', 22.40, 103.46],
      ['Điện Biên Phủ', 21.39, 103.02], ['Sơn La', 21.33, 103.91], ['Hòa Bình', 20.82, 105.34], ['Hà Tĩnh', 18.34, 105.91], ['Đồng Hới (Quảng Bình)', 17.47, 106.62],
      ['Đông Hà (Quảng Trị)', 16.82, 107.10], ['Tam Kỳ (Quảng Nam)', 15.57, 108.47], ['Hội An', 15.88, 108.33], ['Quảng Ngãi', 15.12, 108.80], ['Quy Nhơn (Bình Định)', 13.78, 109.22],
      ['Tuy Hòa (Phú Yên)', 13.09, 109.30], ['Phan Rang (Ninh Thuận)', 11.56, 108.99], ['Phan Thiết (Bình Thuận)', 10.93, 108.10], ['Kon Tum', 14.35, 108.00], ['Pleiku (Gia Lai)', 13.98, 108.00],
      ['Buôn Ma Thuột (Đắk Lắk)', 12.67, 108.04], ['Gia Nghĩa (Đắk Nông)', 12.00, 107.69], ['Đồng Xoài (Bình Phước)', 11.54, 106.89], ['Tây Ninh', 11.31, 106.10], ['Thủ Dầu Một (Bình Dương)', 10.98, 106.65],
      ['Biên Hòa (Đồng Nai)', 10.95, 106.82], ['Vũng Tàu', 10.35, 107.08], ['Bà Rịa', 10.50, 107.17], ['Tân An (Long An)', 10.54, 106.41], ['Mỹ Tho (Tiền Giang)', 10.36, 106.36],
      ['Bến Tre', 10.24, 106.38], ['Vĩnh Long', 10.25, 105.97], ['Trà Vinh', 9.93, 106.35], ['Cao Lãnh (Đồng Tháp)', 10.46, 105.63], ['Long Xuyên (An Giang)', 10.39, 105.44],
      ['Châu Đốc', 10.70, 105.12], ['Rạch Giá (Kiên Giang)', 10.01, 105.08], ['Phú Quốc', 10.23, 103.96], ['Vị Thanh (Hậu Giang)', 9.78, 105.47], ['Sóc Trăng', 9.60, 105.97],
      ['Bạc Liêu', 9.29, 105.72], ['Cà Mau', 9.18, 105.15]], 7],
    ['Quốc tế (tự đặt múi giờ chuẩn)', [['Bangkok', 13.75, 100.50, 7], ['Viêng Chăn', 17.97, 102.63, 7], ['Phnôm Pênh', 11.56, 104.92, 7], ['Singapore', 1.35, 103.82, 8], ['Kuala Lumpur', 3.14, 101.69, 8],
      ['Bắc Kinh', 39.90, 116.40, 8], ['Đài Bắc', 25.03, 121.57, 8], ['Hồng Kông', 22.32, 114.17, 8], ['Seoul', 37.57, 126.98, 9], ['Tokyo', 35.68, 139.69, 9],
      ['Sydney', -33.87, 151.21, 10], ['Melbourne', -37.81, 144.96, 10], ['Moskva', 55.76, 37.62, 3], ['Praha', 50.08, 14.44, 1], ['Warszawa', 52.23, 21.01, 1],
      ['Berlin', 52.52, 13.40, 1], ['Paris', 48.86, 2.35, 1], ['London', 51.51, -0.13, 0], ['Toronto', 43.65, -79.38, -5], ['New York', 40.71, -74.01, -5],
      ['Houston', 29.76, -95.37, -6], ['Los Angeles', 34.05, -118.24, -8], ['San Jose', 37.34, -121.89, -8]], null]
  ];
  window.NOI_SINH = NOI_SINH;
  function fillPlaces() {
    var html = '';
    NOI_SINH.forEach(function (g) {
      html += '<optgroup label="' + esc(g[0]) + '">' + g[1].map(function (c) {
        var tz = c[3] != null ? c[3] : g[2];
        return '<option value="' + c[1] + '|' + c[2] + '|' + esc(c[0]) + '" data-tz="' + tz + '">' + esc(c[0]) + '</option>';
      }).join('') + '</optgroup>';
    });
    html += '<option value="custom">Nơi khác – tự nhập tọa độ…</option>';
    $('place').innerHTML = html;
  }
  function onPlaceChange() {
    var o = $('place').selectedOptions[0];
    $('placeCustom').style.display = $('place').value === 'custom' ? '' : 'none';
    if (o && o.getAttribute('data-tz') != null) $('tz').value = o.getAttribute('data-tz');
  }
  function placeValue() {
    if ($('place').value !== 'custom') return $('place').value;
    var la = parseFloat($('lat').value), lo = parseFloat($('lon').value);
    return (isNaN(la) || isNaN(lo)) ? '21.03|105.85|Hà Nội' : la + '|' + lo + '|' + la.toFixed(2) + '°, ' + lo.toFixed(2) + '°';
  }

  function initForm() {
    fillPlaces();
    fillSelect($('day'), 1, 31, function (i) { return String(i); }, 1);
    fillSelect($('month'), 1, 12, function (i) { return 'Tháng ' + i; }, 1);
    fillSelect($('hour'), 0, 23, function (i) { return pad(i) + ' giờ · ' + CHI[Math.floor((i + 1) / 2) % 12]; }, 12);
    fillSelect($('minute'), 0, 59, function (i) { return pad(i) + ' phút'; }, 0);
    $('year').value = 1995;
    $('viewYear').value = new Date().getFullYear();
    var td = new Date();
    $('viewDate').value = td.getFullYear() + '-' + pad(td.getMonth() + 1) + '-' + pad(td.getDate());

    var saved = null;
    try { saved = JSON.parse(storeGet('tcc_last_input') || 'null'); } catch (e) { saved = null; }
    var p = (typeof INITIAL_PARAMS === 'object' && INITIAL_PARAMS) || {};
    if (p.year) saved = p;
    if (saved) setForm(saved);

    document.querySelectorAll('input[name=calendar]').forEach(function (r) { r.addEventListener('change', onCalendarChange); });
    ['day', 'month', 'year', 'leap', 'hour', 'minute'].forEach(function (id) {
      $(id).addEventListener('change', schedulePreview);
      $(id).addEventListener('input', schedulePreview);
    });
    $('place').addEventListener('change', onPlaceChange);
    $('form').addEventListener('submit', function (e) { e.preventDefault(); submit(); });
    $('addEvent').addEventListener('click', function () { addEventRow(); });
    onCalendarChange();
    if (p.year && p.auto !== '0') submit();
  }

  function onCalendarChange() {
    var am = getCal() === 'am';
    $('leapWrap').style.display = am ? '' : 'none';
    if (!am) $('leap').checked = false;
    var d = parseInt($('day').value, 10);
    fillSelect($('day'), 1, am ? 30 : 31, function (i) { return String(i); }, d > (am ? 30 : 31) ? 1 : d);
    schedulePreview();
  }
  function getCal() { return document.querySelector('input[name=calendar]:checked').value; }

  function getForm() {
    return {
      name: $('name').value.trim(),
      gender: document.querySelector('input[name=gender]:checked').value,
      calendar: getCal(),
      day: parseInt($('day').value, 10), month: parseInt($('month').value, 10), year: parseInt($('year').value, 10),
      leap: $('leap').checked,
      hour: parseInt($('hour').value, 10), minute: parseInt($('minute').value, 10),
      viewYear: parseInt($('viewYear').value, 10) || new Date().getFullYear(),
      viewDate: $('viewDate').value,
      lateRat: $('lateRat').checked,
      leapMode: $('leapMode').value,
      tuHoaCanh: $('tuHoaCanh').value,
      hoangDao: $('hoangDao').value,
      trueSolar: $('trueSolar').checked,
      longitude: placeValue().split('|')[1],
      place: placeValue(),
      tz: $('tz').value,
      save: $('save').checked,
      events: getEvents()
    };
  }
  function setForm(v) {
    if (v.name != null) $('name').value = v.name;
    if (v.gender) (v.gender === 'nu' ? $('gNu') : $('gNam')).checked = true;
    if (v.calendar) (v.calendar === 'am' ? $('calAm') : $('calDuong')).checked = true;
    onCalendarChangeSilent();
    if (v.day) $('day').value = v.day;
    if (v.month) $('month').value = v.month;
    if (v.year) $('year').value = v.year;
    $('leap').checked = v.leap === true || v.leap === 'true' || v.leap === '1';
    if (v.hour != null && v.hour !== '') $('hour').value = v.hour;
    if (v.minute != null && v.minute !== '') $('minute').value = v.minute;
    if (v.viewYear) $('viewYear').value = v.viewYear;
    if (v.viewDate) $('viewDate').value = v.viewDate;
    if (v.lateRat != null) $('lateRat').checked = v.lateRat !== false && v.lateRat !== 'false';
    if (v.leapMode) $('leapMode').value = v.leapMode;
    if (v.tuHoaCanh) $('tuHoaCanh').value = v.tuHoaCanh;
    if (v.hoangDao) $('hoangDao').value = v.hoangDao;
    if (v.trueSolar != null) $('trueSolar').checked = v.trueSolar === true || v.trueSolar === 'true';
    if (v.place) {
      var has = Array.prototype.some.call($('place').options, function (o) { return o.value === v.place; });
      if (has) $('place').value = v.place;
      else { var pp = String(v.place).split('|'); $('place').value = 'custom'; $('lat').value = pp[0]; $('lon').value = pp[1]; }
    }
    $('placeCustom').style.display = $('place').value === 'custom' ? '' : 'none';
    if (v.tz != null && v.tz !== '') $('tz').value = v.tz;
    if (v.events) setEvents(v.events);
  }
  /* ---------- Sự kiện đã biết ---------- */
  var EV_LOAI = [['ketHon', 'Kết hôn'], ['sinhCon', 'Sinh con'], ['sucKhoe', 'Ốm nặng / tai nạn / phẫu thuật'], ['taiChinh', 'Mất tiền / thua lỗ / nợ'],
    ['giaDao', 'Biến cố gia đình / ly hôn / tang'], ['taiLoc', 'Phát tài / thu nhập tăng mạnh'], ['quanLoc', 'Thăng chức / đổi việc / mất việc']];
  function addEventRow(ev) {
    var row = document.createElement('div');
    row.className = 'ev-row';
    row.innerHTML = '<input type="number" class="ev-nam" min="1800" max="2300" placeholder="Năm" value="' + (ev && ev.nam ? esc(ev.nam) : '') + '">' +
      '<select class="ev-loai">' + EV_LOAI.map(function (x) { return '<option value="' + x[0] + '"' + (ev && ev.loai === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
      '<button type="button" class="btn btn-ghost btn-sm ev-del" title="Xóa">✕</button>';
    row.querySelector('.ev-del').addEventListener('click', function () { row.remove(); });
    $('events').appendChild(row);
  }
  function getEvents() {
    var out = [];
    document.querySelectorAll('#events .ev-row').forEach(function (r) {
      var n = parseInt(r.querySelector('.ev-nam').value, 10);
      if (n) out.push({ nam: n, loai: r.querySelector('.ev-loai').value });
    });
    return out;
  }
  function setEvents(list) {
    $('events').innerHTML = '';
    (list || []).forEach(addEventRow);
    if (list && list.length) $('evWrap').open = true;
  }

  function onCalendarChangeSilent() {
    var am = getCal() === 'am';
    $('leapWrap').style.display = am ? '' : 'none';
    fillSelect($('day'), 1, am ? 30 : 31, function (i) { return String(i); }, 1);
  }

  var previewTimer = null;
  function schedulePreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(preview, 350);
  }
  function preview() {
    var f = getForm();
    var box = $('preview');
    if (!(f.year >= 1800 && f.year <= 2200)) { box.innerHTML = 'Năm sinh cần trong khoảng 1800 – 2200.'; return; }
    if (!hasServer()) { box.textContent = ''; return; }
    box.innerHTML = '<span class="muted">Đang đổi lịch…</span>';
    call('doiLich', [f], function (r) {
      var gio = CHI[Math.floor((f.hour + 1) / 2) % 12];
      if (!r.ok) { box.innerHTML = '⚠ ' + esc(r.msg); return; }
      if (f.calendar === 'am') {
        box.innerHTML = '☀ Dương lịch: <b>' + r.solar.day + '/' + r.solar.month + '/' + r.solar.year + '</b> · giờ ' + gio +
          (r.leapMonth ? '<br><small class="muted">Năm ' + f.year + ' có tháng ' + r.leapMonth + ' nhuận</small>' : '');
      } else {
        var l = r.lunar;
        box.innerHTML = '☾ Âm lịch: <b>' + l.day + '/' + l.month + (l.leap ? ' (nhuận)' : '') + '/' + l.year + '</b> · giờ ' + gio;
      }
    }, function () { box.textContent = ''; });
  }

  function submit() {
    var f = getForm();
    if (!(f.year >= 1800 && f.year <= 2200)) { toast('Năm sinh cần trong khoảng 1800 – 2200.', true); return; }
    storeSet('tcc_last_input', JSON.stringify(f));
    loading(true);
    state.input = f;
    call('lapLaSo', [f], function (res) {
      loading(false);
      state.result = res;
      if (res.soDu != null) { state.soDu = res.soDu; capNhatUser(); }
      render(res);
      if (res.khach) toast(res.canMo ? 'Đã lập lá số – lá số này chưa mở khóa, bạn đang xem phần hé lộ ✦' : 'Đã lập lá số (bản xem giới hạn – đăng nhập để xem đầy đủ) ✦');
      else if (res.saved) toast('Đã lập lá số và lưu vào Google Sheet ✦');
      else if (res.saveError) toast('Đã lập lá số (chưa lưu được: ' + res.saveError + ')', true);
      else toast('Đã lập lá số ✦');
    });
  }


  /* ------------------------ TÀI KHOẢN ------------------------ */
  var VAI_TRO = { chu: 'Chủ sở hữu', vip: 'Thành viên VIP', thanhVien: 'Thành viên' };
  function toanQuyen() { var u = state.nguoiDung; return !!u && (u.vaiTro === 'chu' || u.vaiTro === 'vip'); }
  function fmtXu(n) { return (Number(n) || 0).toLocaleString('vi-VN') + ' xu'; }
  function fmtTien(n) { return (Number(n) || 0).toLocaleString('vi-VN') + 'đ'; }
  function capNhatUser() {
    var u = state.nguoiDung;
    $('btnLogin').style.display = u ? 'none' : '';
    $('btnUser').style.display = u ? '' : 'none';
    if (u) $('btnUser').textContent = (u.vaiTro === 'chu' ? '👑 ' : u.vaiTro === 'vip' ? '⭐ ' : '👤 ') + (u.hienThi || u.ten) +
      (!toanQuyen() && state.soDu != null ? ' · ' + fmtXu(state.soDu) : '');
    $('btnNapTop').style.display = u && !toanQuyen() ? '' : 'none';
    if (state.result) { dungMucLuc(); veCta(); veQc(); }
  }
  function datPhien(token, u) {
    state.token = token || ''; state.nguoiDung = u || null;
    if (!u) state.soDu = null;
    storeSet('tcc_token', state.token);
    capNhatUser();
  }
  function lapLai() { if (state.result && hasServer()) submit(); }
  function authTab(t) {
    document.querySelectorAll('[data-auth]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-auth') === t); });
    $('loginForm').style.display = t === 'in' ? '' : 'none';
    $('regForm').style.display = t === 'up' ? '' : 'none';
  }
  function moDangNhap(ghiChu, tab) {
    $('lgErr').textContent = ''; $('rgErr').textContent = ''; $('lgPass').value = '';
    $('authNote').textContent = ghiChu || 'Chưa đăng nhập bạn vẫn lập được lá số và xem phần hé lộ. Đăng nhập để mở khóa luận giải, lưu lịch sử và tải PDF.';
    authTab(tab || 'in');
    $('loginModal').classList.add('show');
    setTimeout(function () { $(tab === 'up' ? 'rgUser' : 'lgUser').focus(); }, 50);
  }
  function sauDangNhap(r) {
    datPhien(r.token, r.nguoiDung);
    $('loginModal').classList.remove('show');
    toast('Xin chào ' + (r.nguoiDung.hienThi || r.nguoiDung.ten) + ' ✦');
    taiVi();
    if (state.result && state.result.khach) lapLai();
    if (state.sauDangNhap) { var f = state.sauDangNhap; state.sauDangNhap = null; f(); }
  }
  function dangNhapGo(e) {
    if (e) e.preventDefault();
    var u = $('lgUser').value.trim(), p = $('lgPass').value;
    if (!u || !p) { $('lgErr').textContent = 'Nhập tên đăng nhập và mật khẩu.'; return; }
    $('lgGo').disabled = true; $('lgErr').textContent = 'Đang kiểm tra…';
    call('dangNhap', [u, p], function (r) { $('lgGo').disabled = false; $('lgPass').value = ''; sauDangNhap(r); },
      function (err) { $('lgGo').disabled = false; $('lgErr').textContent = (err && err.message) || String(err); });
  }
  function dangKyGo(e) {
    if (e) e.preventDefault();
    if ($('rgPass').value !== $('rgPass2').value) { $('rgErr').textContent = 'Hai lần nhập mật khẩu không khớp.'; return; }
    $('rgGo').disabled = true; $('rgErr').textContent = 'Đang tạo tài khoản…';
    call('dangKy', [$('rgUser').value, $('rgPass').value, $('rgName').value, $('rgContact').value, $('rgRef').value], function (r) {
      $('rgGo').disabled = false; ['rgPass', 'rgPass2'].forEach(function (id) { $(id).value = ''; }); sauDangNhap(r);
    }, function (err) { $('rgGo').disabled = false; $('rgErr').textContent = (err && err.message) || String(err); });
  }
  function dangXuatGo() {
    var t = state.token;

      if (e.target.closest('[data-mo-nc]')) { var nb = $('ncBannerGo') || $('btnNghiemChung'); if (nb) nb.click(); }
      var nx = e.target.closest('[data-nam-xem]'); if (nx && state.result) { $('viewYear').value = nx.getAttribute('data-nam-xem'); lapLai(); }
      if (e.target.closest('[data-nap]')) moNap();
    });
    ['loginModal', 'accModal', 'qtModal'].forEach(function (id) { $(id).addEventListener('click', function (e) { if (e.target === $(id)) $(id).classList.remove('show'); }); });
    $('pwGo').addEventListener('click', function () {

      call('doiMatKhau', [state.token, $('pwOld').value, $('pwNew').value], function () {
        ['pwOld', 'pwNew', 'pwNew2'].forEach(function (id) { $(id).value = ''; }); toast('Đã đổi mật khẩu ✦');
      });
    });
    var ref = (typeof INITIAL_PARAMS === 'object' && INITIAL_PARAMS && INITIAL_PARAMS.ref) || storeGet('tcc_ref') || '';
    if (ref) { storeSet('tcc_ref', ref); $('rgRef').value = ref; }
    capNhatUser();
    var t = storeGet('tcc_token');
    if (t && hasServer()) {
      state.token = t;                    // dùng ngay để lá số tự lập lần đầu nhận đúng quyền; máy chủ vẫn tự kiểm tra

        if (u) { datPhien(t, u); taiVi(); }
        else { datPhien('', null); if (state.result && !state.result.khach) lapLai(); }
      }, function () {});
    }
  }

  // Sao vòng Bác Sĩ – Thái Tuế đặt chung cột phụ tinh: cát/trung bên trái, hung bên phải
  function vongList(p, hung) {
    var ds = p.vong || [{ n: p.bacSi, h: '', t: '' }, { n: p.thaiTue, h: '', t: '' }].filter(function (x) { return x.n; });
    return ds.filter(function (s) { return (s.t === 'hung') === hung; }).map(function (s) {

  function renderChart(res) {
    var tv = res.tuvi, I = tv.info, P = tv.palaces;

    var B = res.battu;

      '<dt>Âm lịch</dt><dd>' + l.day + '/' + l.month + (l.leap ? ' nhuận' : '') + '/' + l.year + ' · giờ ' + esc(I.gioTen) + '</dd>' +
      '<dt>Can chi</dt><dd>Năm ' + esc(I.namCanChi) + ' · Tháng ' + esc(I.thangCanChi) + '<br>Ngày ' + esc(I.ngayCanChi) + ' · Giờ ' + esc(I.gioCanChi) + '</dd>' +
      '<dt>Âm dương</dt><dd>' + esc(I.amDuong) + ' · ' + (I.thuan ? 'đi thuận' : 'đi nghịch') + '</dd>' +
      '<dt>Bản mệnh</dt><dd class="h-' + I.banMenh.hanh + '">' + esc(I.banMenh.ten) + '</dd>' +
      '<dt>Cục</dt><dd class="h-' + I.cucHanh + '">' + esc(I.cuc) + '</dd>' +
      '<dt>Mệnh chủ</dt><dd>' + esc(I.menhChu) + ' · Thân chủ: ' + esc(I.thanChu) + '</dd>' +
      '<dt>Năm xem</dt><dd>' + I.viewYear + ' (' + esc(I.viewCanChi) + ') · ' + I.tuoi + ' tuổi</dd>' +
      '</dl>' +

      (I.notes && I.notes.length ? '<div class="ct-note">' + I.notes.map(esc).join('<br>') + '</div>' : '') +
      '</div>';
    var chart = $('chart');

  /** Điện thoại: thu nhỏ lá số vừa bề ngang (không phải kéo ngang); chạm một cung để xem chi tiết bên dưới */
  function coLaSo() {
    var fr = $('chartFrame'), sc = fr && fr.parentNode;
    if (!fr || !sc || !sc.classList.contains('chart-scroll')) return;
    fr.style.transform = ''; sc.style.height = ''; sc.classList.remove('co');
    var w = sc.clientWidth, n = fr.offsetWidth;
    if (!w || !n || w >= n) return;
    var k = w / n;
    fr.style.transformOrigin = '0 0'; fr.style.transform = 'scale(' + k + ')';
    sc.style.height = Math.ceil(fr.offsetHeight * k) + 'px'; sc.classList.add('co');
  }
  /** Chụp lá số ở kích thước gốc (bỏ thu nhỏ tạm thời) */
  function chupLaSo(opt) {
    var fr = $('chartFrame'), sc = fr.parentNode, tf = fr.style.transform, h = sc.style.height;
    fr.style.transform = ''; sc.style.height = '';
    return html2canvas(fr, opt).then(function (c) { fr.style.transform = tf; sc.style.height = h; return c; }, function (e) { fr.style.transform = tf; sc.style.height = h; throw e; });
  }
  function applyOptions() {
    var frame = $('chartFrame');

  }

  function cellOf(chi) { return $('chart').querySelector('.cung[data-chi="' + chi + '"]'); }

  function selectPalace(chi, chiToMau) {
    state.sel = chi;
    var tam = [(chi + 4) % 12, (chi + 8) % 12], xung = (chi + 6) % 12;
    $('chart').querySelectorAll('.cung').forEach(function (el) {
      var c = parseInt(el.getAttribute('data-chi'), 10);
      el.classList.toggle('sel', c === chi);

    if (chiToMau) { $('palaceDetail').innerHTML = '<div class="pd-goiy">👆 Bấm vào một cung trên lá số để xem nhanh các sao và lời luận của cung đó. Luận đầy đủ Mệnh, Thân và 12 cung ở ngay bên dưới.</div>'; return; }
    renderPalaceDetail(chi);

  function drawOverlay() {
    var svg = $('chartLines');
    var chart = $('chart');
    if (!svg || !chart || !state.result) return;
    var cr0 = chart.getBoundingClientRect();
    if (!cr0.width) return;
    var k = cr0.width / (chart.offsetWidth || cr0.width);   // hệ số thu nhỏ (điện thoại) – quy mọi toạ độ về kích thước gốc
    function goc(r) { return { left: r.left / k, top: r.top / k, width: r.width / k, height: r.height / k }; }
    var cr = goc(cr0), ctr = goc(chart.querySelector('.center').getBoundingClientRect());
    svg.setAttribute('viewBox', '0 0 ' + ctr.width + ' ' + ctr.height);
    svg.setAttribute('width', ctr.width);
    svg.setAttribute('height', ctr.height);
    var cx = cr.width / 2, cy = cr.height / 2;
    // điểm neo: điểm trên cạnh cung gần tâm lá số nhất (toạ độ theo khung Thiên Bàn)
    function anchor(chi) {
      var r = goc(cellOf(chi).getBoundingClientRect());
      var x0 = r.left - cr.left, y0 = r.top - cr.top, x1 = x0 + r.width, y1 = y0 + r.height;
      return [Math.min(Math.max(cx, x0), x1) - (ctr.left - cr.left), Math.min(Math.max(cy, y0), y1) - (ctr.top - cr.top)];
    }
    var out = '';
    if ($('optLines').checked && state.sel != null) {
      var c = state.sel, a = anchor(c), b = anchor((c + 4) % 12), d = anchor((c + 8) % 12), x = anchor((c + 6) % 12);
      out += '<line x1="' + a[0] + '" y1="' + a[1] + '" x2="' + b[0] + '" y2="' + b[1] + '"/>';
      out += '<line x1="' + b[0] + '" y1="' + b[1] + '" x2="' + d[0] + '" y2="' + d[1] + '"/>';
      out += '<line x1="' + d[0] + '" y1="' + d[1] + '" x2="' + a[0] + '" y2="' + a[1] + '"/>';
      out += '<line class="xung" x1="' + a[0] + '" y1="' + a[1] + '" x2="' + x[0] + '" y2="' + x[1] + '"/>';
    }
    svg.innerHTML = out;

    // Huy hiệu Tuần – Triệt nằm trên ranh giới 2 cung
    chart.querySelectorAll('.badge-tt').forEach(function (e) { e.remove(); });
    var P = state.result.tuvi.palaces;
    ['tuan', 'triet'].forEach(function (k) {
      var list = P.filter(function (p) { return p[k]; }).map(function (p) { return p.chi; });
      if (list.length !== 2) return;
      var ra = cellOf(list[0]).getBoundingClientRect(), rb = cellOf(list[1]).getBoundingClientRect();
      // đặt trên giao điểm ranh giới hai cung với Thiên Bàn
      var x, y, midX = cr.width / 2, midY = cr.height / 2;
      if (Math.abs(ra.top - rb.top) < 2) {
        x = Math.max(ra.left, rb.left) - cr.left;
        y = (ra.top - cr.top < midY) ? ra.bottom - cr.top : ra.top - cr.top;
      } else {
        y = Math.max(ra.top, rb.top) - cr.top;
        x = (ra.left - cr.left < midX) ? ra.right - cr.left : ra.left - cr.left;
      }
      var el = document.createElement('div');
      el.className = 'badge-tt ' + k;
      el.textContent = k === 'tuan' ? 'TUẦN' : 'TRIỆT';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.transform = 'translate(-50%, -50%)';
      chart.appendChild(el);
    });
  }

  function chipStar(s, info) {
    var t = s.t || (info && info[1]);

    return '<span class="chip ' + cls + '"><b class="h-' + s.h + '">' + esc(s.n) + '</b>' + (s.b ? ' <small>(' + ({ M: 'Miếu', V: 'Vượng', 'Đ': 'Đắc', B: 'Bình', H: 'Hãm' }[s.b]) + ')</small>' : '') +

  function renderPalaceDetail(chi) {
    var res = state.result, P = res.tuvi.palaces[chi], SI = res.saoInfo || {};

      '<div class="sub">Chủ về ' + esc(luan ? luan.yNghia : '') + '. Đại hạn ' + P.daiHan + '–' + (P.daiHan + 9) + ' tuổi · Tiểu hạn năm ' + esc(P.tieuHan) +

      }).join('') + '</div>' +

    if (luan && !luan.lines) html += '<div class="lock-cta"><p>🔒 Lời luận chi tiết của cung này hiện khi mở khóa lá số (Bản mở ' + fmtXu(giaPhan('co_ban').xu) + ').</p><button type="button" class="btn btn-primary btn-sm" data-mua="co_ban">Mở khóa</button></div>';
    if (luan && luan.lines) {
      html += '<div class="meter"><i style="width:' + scorePct(luan.diem) + '%"></i></div>' +
        '<p><b>Đánh giá: ' + esc(luan.danhGia) + '</b> (' + d10(luan.diem) + '/10)</p><ul>' +
        luan.lines.map(function (x) { return '<li>' + hl(x) + '</li>'; }).join('') + '</ul>';
    }
    html += '<p class="muted" style="font-size:12.5px">Tam hợp: ' + CHI[(chi + 4) % 12] + ' – ' + CHI[(chi + 8) % 12] + ' · Xung chiếu: ' + CHI[(chi + 6) % 12] +
      ' · Nhấp vào cung khác trên lá số để xem.</p>';

  }

  function d10(d) { var x = 100 / (1 + Math.exp(-(Number(d) || 0) / 3)) / 10; return fmt(Math.round(x * 10) / 10); }   // điểm thô → thang 10
  function scorePct(d) { return Math.max(4, Math.min(100, Math.round((d + 6) / 16 * 100))); }
  function rateClass(d) { return d >= 5 ? 'r5' : d >= 2.5 ? 'r4' : d >= 0.5 ? 'r3' : d > -1.5 ? 'r2' : d > -4 ? 'r1' : 'r0'; }

  /* ---------- Khối luận giải dùng chung ---------- */
  function itemHtml(x) {
    var t = String(x), cls = '';

  }
  function blockHtml(item, title, meta, open, id) {

      '<span class="lg-t">' + esc(title) + '</span>' + (meta ? '<span class="lg-meta">' + esc(meta) + '</span>' : '') +
      '<span class="rate ' + rateClass(item.diem) + '">' + esc(item.danhGia) + ' · ' + d10(item.diem) + '/10</span></summary>' +
      '<div class="meter"><i style="width:' + scorePct(item.diem) + '%"></i></div>' +
      '<div class="lg-body">' + item.secs.map(function (sec) {
        return '<div class="lg-sec"><h5>' + esc(sec.tieuDe) + '</h5><ul>' + sec.items.map(itemHtml).join('') + '</ul></div>';
      }).join('') + '</div></details>';

  var CACH_CHAM = [
    'Mọi điểm hiển thị đều quy về THANG 10: 5 = trung bình; 7 trở lên = tốt; 8,5 trở lên = rất tốt; dưới 4 = kém; dưới 2,5 = cần thận trọng. Điểm không phải xác suất, mà là mức "thuận – nghịch" so với mặt bằng chung.',
    'Tử Vi (cung, đại vận, tiểu vận, nguyệt/nhật vận): cộng trừ trọng số từng sao. Chính tinh: Miếu +3, Vượng +2, Đắc +1, Bình 0, Hãm −2. Cát tinh lớn (Tả Hữu, Xương Khúc, Khôi Việt, Khoa, Quyền) +1,5; Lộc Tồn, Hóa Lộc +2; sát tinh (Kình, Đà, Hỏa, Linh) −1,5; Không Kiếp, Hóa Kỵ −2; sao nhỏ ±0,4; Tuần/Triệt giảm 40%. Cung được tính tam phương tứ chính (bản cung 50%, xung chiếu 25%, hai tam hợp 12,5% mỗi cung); vận có thêm lưu tinh (lưu Lộc +2, lưu Kỵ −2,5, lưu Kình −1,5…) và cách lưu gặp gốc (song Lộc +0,8, song Kỵ −1…). Tổng điểm thô không có trần, được quy về thang 10 bằng đường cong chữ S: 0 → 5; +2,5 → 7; +5 → 8,4; −4 → 2,1.',
    'Bát Tự: can chi mang hành Dụng thần +2, Hỷ thần +1,2, Kỵ thần −1,2 đến −1,4; mỗi xung/hình chạm vào trụ −0,8, mỗi hợp +0,4; thần sát cát/hung ±0,5; rồi quy về thang 10 như trên. Đánh giá vận/năm Bát Tự theo ngũ hành can chi so với dụng – hỷ – kỵ thần: Đại cát / Cát / Bình / Hơi kém / Cẩn trọng.',

  ];
  function coSoHtml(title, arr) {

  }
  function stripHtml(list, labelFn, subFn, activeFn, target) {

  /* ---------- Bát Tự chi tiết ---------- */
  function listHtml(arr) { return '<ul class="yr-ly">' + arr.map(itemHtml).join('') + '</ul>'; }
  /** Ghép phần "Đối chiếu Tứ Trụ" vào lời luận một cung Tử Vi */
  function voiTuTru(res, c) {
    var L = (res.battuChiTiet && res.battuChiTiet.linhVuc) || [], b = L.filter(function (x) { return x.key === c.cung; })[0];
    if (!b) return c;
    var it = [];
    b.secs.forEach(function (s) { if (/Thập thần|Cung vị|Thần sát/.test(s.tieuDe)) s.items.forEach(function (t) { if (/^[✓✗]/.test(t)) it.push(t); }); });
    var dong = (c.diem >= 0.5) === (b.diem >= 0.5), o = heSo(c, 1);
    o.secs = c.secs.slice(0, -1).concat([{ tieuDe: 'Đối chiếu Tứ Trụ – ' + b.ten, items: ['Tử Vi ' + d10(c.diem) + '/10 · Tứ Trụ ' + d10(b.diem) + '/10 → ' +
      (dong ? 'hai hệ đồng chiều, kết luận chắc chắn hơn.' : 'hai hệ khác chiều – lĩnh vực có cả thuận lẫn nghịch, xem thêm tab Bát Tự.')].concat(it.slice(0, 5)) }], c.secs.slice(-1));

  function heSo(x, k) { var o = {}; for (var key in x) o[key] = x[key]; o.diem = x.diem * k; return o; }

  /** Xác định mức của đại vận dựa vào danhGia backend */
  function danhGiaDaiVan_(d) {
    var x = String(d.danhGia || '').trim();
    // Nhãn thang 10 (Rất tốt / Tốt / Khá / Trung bình / Kém / Cần thận trọng) và nhãn cát hung (Đại cát / Cát / Bình / Hơi kém / Cẩn trọng)
    if (/^(Rất tốt|Đại cát|Tháng vàng)$/i.test(x)) return 'rat_tot';
    if (/^(Tốt|Khá|Cát|Thuận)$/i.test(x)) return 'tot';
    if (/^(Trung bình|Bình)$/i.test(x)) return 'trung_binh';
    if (/^(Kém|Hơi kém|Cần giữ)$/i.test(x)) return 'kho_khan';
    if (/^(Cần thận trọng|Cẩn trọng|Thận trọng)$/i.test(x)) return 'rat_kho';
    var s10 = 100 / (1 + Math.exp(-(Number(d.diem) || 0) / 3)) / 10;   // không có nhãn → dùng điểm thô quy thang 10
    return s10 >= 8.5 ? 'rat_tot' : s10 >= 5.5 ? 'tot' : s10 >= 4 ? 'trung_binh' : s10 >= 2.5 ? 'kho_khan' : 'rat_kho';
  }


  /** Sinh HTML 4 đoạn văn cho 1 đại vận */
  function sinhVanDaiVanHtml_(d) {

    var dacThu = KHO_VAN_DAIVAN_CUNG[d.cung] || '';

    var doan = [];
    var khoang = String(d.khoang).replace(/\s*tuổi\s*$/, '');   // d.khoang đã có chữ "tuổi"
    doan.push({ tieuDe: 'Tóm tắt 10 năm', text: 'Giai đoạn ' + khoang + ' tuổi (từ năm ' + d.nam + '), đại vận đi vào cung ' + d.cung + '. ' + van.tomTat });
    doan.push({ tieuDe: 'Bản chất giai đoạn', text: van.banChat });
    if (dacThu) doan.push({ tieuDe: 'Đặc thù theo cung', text: dacThu });
    doan.push({ tieuDe: 'Điểm mạnh & lưu ý', text: van.diemManh + ' ' + van.diemLuuY });
    doan.push({ tieuDe: 'Lời khuyên cho 10 năm này', text: '', list: van.loiKhuyen.slice() });

    return renderVanCung_(doan, 'Đại vận ' + khoang + ' tuổi');
  }

  /** Sinh HTML 4 đoạn văn cho Tiểu vận */
  function sinhVanTieuVanHtml_(T) {
    var muc = danhGiaDaiVan_(T);
    var van = KHO_VAN_TIEUVAN_MUC[muc];
    if (!van) return '';

    var doan = [];
    doan.push({ tieuDe: 'Tóm tắt năm ' + T.nam + ' (' + T.canChi + ')', text: van.tomTat });
    doan.push({ tieuDe: 'Bản chất năm nay', text: van.banChat });
    doan.push({ tieuDe: 'Điểm mạnh & lưu ý', text: van.diemManh + ' ' + van.diemLuuY });
    doan.push({ tieuDe: 'Lời khuyên cho năm nay', text: '', list: van.loiKhuyen.slice() });

    return renderVanCung_(doan, 'Tiểu vận ' + T.nam);
  }

  /** Sinh HTML 2 đoạn văn ngắn cho 1 tháng Nguyệt vận */
  function sinhVanNguyetVanHtml_(m) {
    var muc = danhGiaDaiVan_(m);
    var van = KHO_VAN_NGUYETVAN_MUC[muc];
    if (!van) return '';

    var doan = [];
    doan.push({ tieuDe: 'Tháng ' + m.thang + ' (' + m.canChi + ')', text: van.tomTat });
    doan.push({ tieuDe: 'Lời khuyên', text: van.loiKhuyen });

    return renderVanCung_(doan, 'Tháng ' + m.thang);
  }
  function renderVan(res) {
    var CT = res.chiTiet, I = res.tuvi.info;

      '<button type="button" class="subtab" data-v="nguyet">Nguyệt vận</button>' +
      '<button type="button" class="subtab" data-v="nhat">Nhật vận</button></div>';

    // Đại vận
    html += '<div class="van-page active" id="van-dai"><div class="panel section"><h2 class="panel-title"><span class="han">大限</span> Đại vận 10 năm</h2>' +
      coSoHtml('Cơ sở lý luận đại vận', CT.coSo.daiVan) +
      stripHtml(CT.daiVan, function (d) { return d.khoang; }, function (d) { return d.cung + ' · ' + d.nam; }, function (d) { return d.isNow; }, 'dv-') +
      '<div class="lg-list">' + CT.daiVan.map(function (d, i) {
        if (d.khoa && parseInt(d.khoang, 10) >= 85) return '';
        if (d.khoa) return dvKhoaHtml(d, i);
        return sinhVanDaiVanHtml_(d) + blockHtml(d, 'Đại vận ' + d.khoang + (d.isNow ? ' ★ hiện tại' : ''), 'Cung ' + d.cung + ' (' + d.canChi + ') · ' + d.sao + ' · năm ' + d.nam, d.isNow, 'dv-' + i);
      }).join('') + '</div></div></div>';

    // Tiểu vận
    var T = CT.tieuVan;
    html += '<div class="van-page" id="van-tieu"><div class="panel section"><h2 class="panel-title"><span class="han">流年</span> Tiểu vận – Lưu niên</h2>' +
      coSoHtml('Cơ sở lý luận tiểu vận', CT.coSo.tieuVan) +
      stripHtml(CT.tieuVanNhieuNam, function (y) { return y.nam + ''; }, function (y) { return y.canChi + ' · ' + y.cung; }, function (y) { return y.nam === I.viewYear; }, 'tv-') +

     (T.khoa ? '' : sinhVanTieuVanHtml_(T) + blockHtml(T, 'Năm ' + T.nam + ' ' + T.canChi + ' · ' + T.tuoi + ' tuổi', 'Tiểu hạn tại ' + T.cung + ' (' + T.chi + ')', true)) + '</div></div>';

    // Nguyệt vận
    if (CT.nguyetVan.length) html += '<div class="van-page" id="van-nguyet"><div class="panel section"><h2 class="panel-title"><span class="han">流月</span> Nguyệt vận năm ' + I.viewYear + '</h2>' +

      stripHtml(CT.nguyetVan, function (m) { return 'Th.' + m.thang; }, function (m) { return m.canChi + ' · ' + m.cung; }, function () { return false; }, 'nv-') +
      '<div class="lg-grid">' + CT.nguyetVan.map(function (m, i) {
      return sinhVanNguyetVanHtml_(m) + blockHtml(m, m.ten + ' · ' + m.canChi, 'từ ' + m.batDau + ' · cung ' + m.cung, false, 'nv-' + i);
      }).join('') + '</div></div></div>';

    // Nhật vận
    if (CT.nhatVan.length) html += '<div class="van-page" id="van-nhat"><div class="panel section"><h2 class="panel-title"><span class="han">流日</span> Nhật vận 7 ngày</h2>' +

      stripHtml(CT.nhatVan, function (d) { return d.thu; }, function (d) { return d.ngay + ' · ' + d.canChi; }, function (d, i) { return false; }, 'nd-') +

        return blockHtml(d, d.thu + ' ' + d.ngay + ' (ÂL ' + d.am + ')', d.canChi + ' · ' + (d.hoangDao ? '☀ Hoàng đạo ' : '☾ Hắc đạo ') + d.than + ' · trực ' + d.truc, i === 0, 'nd-' + i);
      }).join('') + '</div></div></div>';

    var page = $('page-van');
    page.innerHTML = html;
    page.querySelectorAll('.subtab').forEach(function (b) {
      b.addEventListener('click', function () {
        page.querySelectorAll('.subtab').forEach(function (x) { x.classList.toggle('active', x === b); });
        page.querySelectorAll('.van-page').forEach(function (x) { x.classList.toggle('active', x.id === 'van-' + b.getAttribute('data-v')); });
      });
    });
    page.querySelectorAll('.strip-item').forEach(function (b) {
      b.addEventListener('click', function () {
        var el = document.getElementById(b.getAttribute('data-target'));
        if (el) { el.open = true; el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      });
    });
  }

    'D': {  // Thất Sát / Phá Quân / Liêm Trinh — Quyết liệt
      tomTat: 'Mệnh của bạn thuộc nhóm "quyết liệt" — cuộc đời nhiều biến động nhưng bạn là người dám nghĩ dám làm.',
      banChat: 'Bạn sinh ra với tinh thần chiến binh. Bạn không chấp nhận sự tầm thường, không thích bị trói buộc, luôn muốn phá bỏ giới hạn để vươn xa hơn. Bạn sống mãnh liệt, yêu ghét rõ ràng, và sẵn sàng đánh đổi để đạt được điều mình muốn.',

        'VCD-1': {  // Đối cung Tử Phủ Vũ Tướng — mượn uy quyền + ổn định

  /* Xác định nhóm VCD con (1-6) cho cung Mệnh Vô Chính Diệu */
  function xacDinhVcdCon_(palace, P, pi) {
    // Ưu tiên 1: đắc Tam Không (Tuần + Triệt + Địa Không / Thiên Không — từ 2 yếu tố trở lên)
    var soKhong = 0;
    if (palace.tuan) soKhong++;
    if (palace.triet) soKhong++;
    var tenSao = [].concat(palace.chinh, palace.cat, palace.hung, palace.tieu).map(function(s){ return s.n; });
    if (tenSao.indexOf('Địa Không') >= 0) soKhong++;
    if (tenSao.indexOf('Thiên Không') >= 0) soKhong++;
    if (soKhong >= 2) return 'VCD-6';

    // Ưu tiên 2: xét chính tinh ở cung đối chiếu
    var xc = (pi + 6) % 12;
    var doiCung = P[xc].chinh.map(function(s){ return s.n; });
    if (!doiCung.length) return 'VCD-5'; // đối cung cũng VCD

    if (doiCung.some(function(s){ return ['Tử Vi','Thiên Phủ','Vũ Khúc','Thiên Tướng'].indexOf(s) >= 0; })) return 'VCD-1';
    if (doiCung.some(function(s){ return ['Thất Sát','Phá Quân','Tham Lang'].indexOf(s) >= 0; })) return 'VCD-2';
    if (doiCung.some(function(s){ return ['Thiên Cơ','Thái Âm','Thiên Đồng','Thiên Lương'].indexOf(s) >= 0; })) return 'VCD-3';
    if (doiCung.some(function(s){ return ['Cự Môn','Thái Dương'].indexOf(s) >= 0; })) return 'VCD-4';
    return 'VCD-3'; // mặc định
  }

  /* Sinh câu bổ trợ cho VCD: Tuần/Triệt, phụ tinh mạnh ở Mệnh, Không Kiếp */
  function sinhBoTroVcd_(palace, P, pi) {
    var cau = [];
    var xc = (pi + 6) % 12;
    var doiCung = P[xc];
    var tenSao = [].concat(palace.chinh, palace.cat, palace.hung, palace.tieu).map(function(s){ return s.n; });

    // Tuần/Triệt
    if (palace.tuan && palace.triet) {
      cau.push('Cung Mệnh của bạn đồng thời bị cả Tuần và Triệt — đây là dấu hiệu cho thấy cuộc đời bạn có một giai đoạn đầu khá mờ nhạt, nhưng sau 30 tuổi sẽ sáng rõ dần theo cách bất ngờ.');
    } else if (palace.triet) {
      cau.push('Cung Mệnh của bạn bị Triệt che phủ — tuổi trẻ thường gặp khó khăn trong việc định hình bản thân, sau 30 tuổi mới hanh thông rõ.');
    } else if (palace.tuan) {
      cau.push('Cung Mệnh của bạn bị Tuần che phủ — cuộc đời bạn có thể chậm hơn người khác một nhịp, nhưng điều đó giúp bạn tránh được nhiều sai lầm.');
    }

    // Tuần/Triệt ở cung đối → sao mượn bị chặn
    if (doiCung.tuan || doiCung.triet) {
      cau.push('Cung đối diện — nơi bạn mượn sao — lại bị Tuần/Triệt chặn một nửa, nên dù mượn được tính cách của cung đó, bạn vẫn chỉ có được khoảng một nửa sức mạnh thật sự. Bạn cần tự lực nhiều hơn.');
    }

    // Phụ tinh đặc biệt ở bản cung
    var saoManh = ['Tả Phù','Hữu Bật','Văn Xương','Văn Khúc','Thiên Khôi','Thiên Việt','Hóa Lộc','Hóa Quyền','Hóa Khoa','Lộc Tồn'];
    var saoPhongManh = saoManh.filter(function(s){ return tenSao.indexOf(s) >= 0; });
    if (saoPhongManh.length >= 2) {
      cau.push('May mắn thay, cung Mệnh của bạn tuy không có sao chính nhưng lại có nhiều sao hỗ trợ tốt — điều này giúp bù đắp phần nào sự mờ nhạt và mang lại cho bạn nhiều cơ hội, quý nhân.');
    }

    var saoManh2 = ['Kình Dương','Đà La','Hỏa Tinh','Linh Tinh','Địa Không','Địa Kiếp','Hóa Kỵ'];
    var saoPhongHung = saoManh2.filter(function(s){ return tenSao.indexOf(s) >= 0; });
    if (saoPhongHung.length >= 2) {
      cau.push('Tuy nhiên, cung Mệnh của bạn cũng có nhiều sao thử thách — cuộc đời bạn sẽ có những giai đoạn khá sóng gió, cần đặc biệt kiên nhẫn và bình tĩnh.');
    }

    return cau;
  }

    function xacDinhNhomMenh_(palace, P, pi) {
    if (!palace.chinh.length) return xacDinhVcdCon_(palace, P, pi);
    var sao = palace.chinh.map(function(s){ return s.n; });
    if (sao.some(function(s){ return ['Tử Vi','Thái Dương','Thiên Tướng'].indexOf(s) >= 0; })) return 'A';
    if (sao.some(function(s){ return ['Thất Sát','Phá Quân','Liêm Trinh'].indexOf(s) >= 0; })) return 'D';
    if (sao.some(function(s){ return ['Thiên Cơ','Cự Môn','Thái Âm'].indexOf(s) >= 0; })) return 'B';
    if (sao.some(function(s){ return ['Vũ Khúc','Thiên Phủ','Thiên Đồng'].indexOf(s) >= 0; })) return 'C';
    if (sao.some(function(s){ return ['Tham Lang','Thiên Lương'].indexOf(s) >= 0; })) return 'E';
    return 'C';
  }

     function sinhVanCungMenh_(palace, P, pi, vanFacts) {
    var nhom = xacDinhNhomMenh_(palace, P, pi);
    var van = KHO_VAN_MENH[nhom];
    if (!van) van = KHO_VAN_MENH['VCD-3'];
    var doan = [];
    var laVcd = nhom.indexOf('VCD-') === 0;

    doan.push({ tieuDe: 'Tóm tắt', text: van.tomTat });
    if (vanFacts && vanFacts.hoanCanh) doan.push(vanFacts.hoanCanh);
    doan.push({ tieuDe: 'Bản chất con người bạn', text: van.banChat });

    // Đoạn 3 — Điểm mạnh: dùng facts backend
    if (vanFacts && vanFacts.diemManh) {
      doan.push({ tieuDe: 'Điểm mạnh nổi bật', text: vanFacts.diemManh });
    }

    // Đoạn 4 — Điểm lưu ý: dùng facts backend
    if (vanFacts && vanFacts.diemYeu) {
      doan.push({ tieuDe: 'Điểm cần lưu ý', text: vanFacts.diemYeu });
    }

    doan.push({ tieuDe: 'Khí chất bề ngoài và nội tâm', text: van.khiChat });

    // Đầu đời: với VCD, KHÔNG chèn câu chung về Tuần/Triệt (đã có fact riêng)
    var textDauDoi = van.dauDoi;
    if (!laVcd && (palace.tuan || palace.triet)) {
      textDauDoi += ' Ngoài ra, tuổi trẻ của bạn có một lớp mờ che phủ — giai đoạn đầu thường gặp khó khăn, sau 30 tuổi mới dần hanh thông rõ rệt.';
    }
    doan.push({ tieuDe: 'Đầu đời và hậu vận', text: textDauDoi });

    // Đoạn 7 — Ảnh hưởng: facts backend
    if (vanFacts && vanFacts.anhHuong) {
      doan.push({ tieuDe: 'Ảnh hưởng từ các cung xung quanh bạn', text: vanFacts.anhHuong });
    }

    // Đoạn 8 — Đặc biệt: facts backend
    if (vanFacts && vanFacts.dacBiet) {
      doan.push({ tieuDe: 'Những yếu tố đặc biệt của cung này', text: vanFacts.dacBiet });
    }

    // Lời khuyên ở cuối
    doan.push({ tieuDe: 'Lời khuyên cụ thể', text: '', list: van.loiKhuyen.slice() });

    return doan;
  }

    function renderVanCung_(doan, tenCung) {
    var html = '<div class="cung-van-de-hieu">';
    if (tenCung) {
      html += '<div class="cvdh-tieude">' + (/^(Đại vận|Tiểu vận|Tháng)/.test(tenCung) ? '' : 'Cung ') + tenCung + '</div>';
    }
    doan.forEach(function(d) {
      html += '<div class="cv-doan">';
      html += '<h5>' + d.tieuDe + '</h5>';
      if (d.text) html += '<p>' + d.text + '</p>';
      if (d.list && d.list.length) {
        html += '<ol class="cv-list">';
        d.list.forEach(function(x) { html += '<li>' + x + '</li>'; });
        html += '</ol>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // Dispatcher: cung Mệnh dùng kho văn mới, các cung khác tạm để trống
  function taoCungDeHieu_(c) {
    var res = state.result;

}
if (c.cung === 'Nô Bộc' && c.vanFacts && c.vanFacts.kieu === 'noboc') {

  /** Khối "Phần N" dùng chung cho phần chuyên sâu của mọi hệ (tiêu đề lớn, hiện trong mục lục) */
  function khoiPhan(nhom, so, ten, phu, noi) { return '<div class="tg ' + nhom + '" data-g="' + nhom + '-' + so + '"><div class="tg-head"><span>Phần ' + so + '</span><b>' + ten + '</b><em>' + phu + '</em></div>' + noi + '</div>'; }
  function renderLuan(res) {

    var p1 = '<div class="panel section tv-chandung"><h2 class="panel-title"><span class="han">命</span> Chân dung lá số</h2>' +

  /* ---------- Biến cố hội tụ ---------- */
  var HT_MAU = { tot: '#1fa688', xau: '#d9503f', dong: '#b08a2c' };
  function hoiTuChart(L, vy) {
    if (!L || !L.nam.length) return '';
    var n = L.nam.length, W = 760, LBL = 176, R = 8, T = 24, rowH = 30, H = T + L.dong.length * rowH + 30, cw = (W - LBL - R) / n;
    var o = '<figure class="chart-fig"><figcaption><b>Bản đồ hội tụ 30 năm</b><span>Mỗi chấm là số hệ cùng báo trong năm đó · chấm lớn, đậm = từ 3 hệ trở lên (xác suất cao) · rê chuột xem các hệ</span></figcaption><svg viewBox="0 0 ' + W + ' ' + H + '" class="vchart" role="img" aria-label="Bản đồ hội tụ biến cố">';
    L.nam.forEach(function (y, i) {
      var x = LBL + i * cw + cw / 2;
      if (y === vy) o += '<rect x="' + (x - cw / 2) + '" y="' + (T - 14) + '" width="' + cw + '" height="' + (L.dong.length * rowH + 16) + '" rx="4" fill="#ffffff" fill-opacity=".08"/>';
      if (i % 5 === 0 || y === vy) o += '<text x="' + x + '" y="' + (H - 8) + '" class="ch-ax" text-anchor="middle">' + y + '</text>';
    });
    L.dong.forEach(function (d, r) {
      var y = T + r * rowH + rowH / 2, mau = HT_MAU[d.loai];
      o += '<text x="' + (LBL - 8) + '" y="' + (y + 4) + '" class="ch-ax" text-anchor="end">' + esc(d.ten.split(' – ')[0].split(' / ')[0]) + '</text>';
      o += '<line x1="' + LBL + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" class="ch-grid"/>';
      d.gt.forEach(function (c, i) {
        if (!c.so) return;
        var x = LBL + i * cw + cw / 2, rr = c.so >= 3 ? 4 + c.so * 1.4 : 2 + c.so, op = c.so >= 3 ? 1 : 0.4;
        o += '<g data-tip="' + esc(L.nam[i] + ' · ' + d.ten + '\n' + c.so + ' hệ cùng báo: ' + c.he.join(', ')) + '"><circle cx="' + x + '" cy="' + y + '" r="12" fill="transparent"/><circle cx="' + x + '" cy="' + y + '" r="' + rr + '" fill="' + mau + '" fill-opacity="' + op + '"' + (c.so >= 4 ? ' stroke="#fff1c9" stroke-width="1.5"' : '') + '/></g>';

    return o;

        if (window.innerWidth < 1080) document.querySelector('.form-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (!$('name').value.trim()) { $('name').focus(); toast('Nhập họ tên và ngày giờ sinh, rồi bấm "Lập Lá Số" để bắt đầu ✦'); return; }
        submit();
      }
      if ($('wlGo')) $('wlGo').addEventListener('click', khamPha);
      if ($('wlAnh')) $('wlAnh').addEventListener('click', khamPha);
    });
    buoc('điều hướng', initDieuHuong);
    buoc('tài khoản', initTaiKhoan);
    buoc('biểu mẫu', initForm);
    buoc('cặp đôi', initCapDoi);
    buoc('chú giải', tipInit);
    buoc('nút cơ sở', function () {
        // Nút bật/tắt hiện cơ sở phân tích (mặc định: ẩn để gọn)
    (function () {
      var nut = $('nutCoso');
      if (!nut) return;
      var TIET_MUC_AN = /^(Cơ sở|Tương tác các cung|Sao đặc thù tại cung|Thần sát|Căn cứ|lý do|Lý do)/i;
      function danhDau() {
        document.querySelectorAll('.lg-sec').forEach(function (sec) {
          var h = sec.querySelector('h5');
          if (!h) return;
          var t = h.textContent.trim();
          if (TIET_MUC_AN.test(t)) sec.classList.add('an-mac-dinh');
        });
      }
      function apDung(bat) {
        document.body.classList.toggle('gon-coso', !bat);
        nut.classList.toggle('on', bat);
        nut.title = bat ? 'Ẩn cơ sở phân tích' : 'Hiện cơ sở phân tích';
        document.querySelectorAll('details.coso-ly-luan').forEach(function (d) { d.open = bat; });
      }
      // Mặc định: ẩn (gon)
      apDung(false);
      nut.addEventListener('click', function () {
        var bat = !nut.classList.contains('on');
        apDung(bat);
        toast(bat ? '🔍 Đã hiện cơ sở phân tích' : '🔍 Đã ẩn cơ sở phân tích (chế độ gọn)');
      });
      // Đánh dấu lại mỗi khi có nội dung mới render
      window.addEventListener('click', function (e) {
        if (e.target.closest('.tab, .subtab')) setTimeout(danhDau, 100);
      });
      danhDau();
      window._danhDauCoso = danhDau;
    })();
    });
    buoc('tùy chọn & xuất file', function () {
    ['optLuu', 'optMinor', 'optLines'].forEach(function (id) { $(id).addEventListener('change', applyOptions); });
    $('btnPrint').addEventListener('click', function () { window.print(); });
    $('btnPdfTop').addEventListener('click', moPdf);
    if ($('btnPdf')) $('btnPdf').addEventListener('click', moPdf);
    $('pdfCancel').addEventListener('click', function () { $('pdfModal').classList.remove('show'); });
    $('pdfModal').addEventListener('click', function (e) { if (e.target === $('pdfModal')) $('pdfModal').classList.remove('show'); });
    $('pdfAll').addEventListener('click', function () {
      var cb = $('pdfOpts').querySelectorAll('input'), all = Array.prototype.every.call(cb, function (x) { return x.checked; });
      cb.forEach(function (x) { x.checked = !all; });
    });
    $('pdfGo').addEventListener('click', function () {
      var chon = Array.prototype.filter.call($('pdfOpts').querySelectorAll('input'), function (x) { return x.checked; }).map(function (x) { return x.value; });
      if (!chon.length) { toast('Hãy chọn ít nhất một phần.', true); return; }
      $('pdfModal').classList.remove('show');
      var brand = { ten: $('pdfBrand').value.trim(), lienHe: $('pdfContact').value.trim() };
      storeSet('tcc_pdf_brand', brand.ten); storeSet('tcc_pdf_contact', brand.lienHe);
      brand.uuDai = $('pdfOffer').value.trim(); storeSet('tcc_pdf_offer', brand.uuDai);
      xuatPdf(chon, parseFloat($('pdfQuality').value) || 1.5, $('pdfTheme').value === 'light', brand, $('pdfType').value === 'demo');
    });
    $('btnPng').addEventListener('click', function () {
      if (typeof html2canvas === 'undefined') { toast('Không tải được thư viện chụp ảnh – hãy dùng nút In.', true); return; }
      loading(true);
      chupLaSo({ scale: 2, backgroundColor: getComputedStyle(document.body).backgroundColor || '#0a0c19', useCORS: true }).then(function (canvas) {
        loading(false);
        var a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'la-so-tu-vi-' + (state.result.tuvi.info.name || 'thien-co-cac').replace(/\s+/g, '-') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(showErr);
    });
    });
    var rt;
    window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { coLaSo(); drawOverlay(); }, 120); });
    if (loiKhoiDong.length) {
      toast('⚠ Một phần giao diện chưa khởi động được (' + loiKhoiDong.length + ' lỗi). Hãy dán lại cùng lúc 3 file Index, Styles, Script bản mới nhất rồi deploy phiên bản mới.', true);
    }
  });
})();


/* ============================================================
 *  PATCH 8G — NGHIỆM CHỨNG LÁ SỐ (tích hợp vào web app chính)
 *  Độc lập với IIFE trên — chỉ dùng server: getDoanNghiemChung
 *  và tinhDiemNghiemChung đã có trong NghiemChung.gs.
 * ============================================================ */
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  function hasServer() {
    return typeof google !== 'undefined' && google.script && google.script.run;
  }
  var cauTraLoi = {};
  var NC_MUC = [
    { ma: 'dung_het',       ten: '✓ Đúng hết' },
    { ma: 'dung_phan_lon',  ten: '◐ Đúng phần lớn' },
    { ma: 'dung_mot_nua',   ten: '◑ Đúng một nửa' },
    { ma: 'sai_phan_lon',   ten: '◒ Sai phần lớn' },
    { ma: 'sai_hoan_toan',  ten: '✗ Sai hoàn toàn' },
    { ma: 'khong_ap_dung',  ten: '— Không áp dụng' }
  ];
  var ncDoTin = {};   // độ tin từng nhóm (mức đồng thuận 6 hệ) – gửi kèm khi tính điểm

  function showBuoc(n) {
    ['ncBuoc1','ncBuoc2','ncBuoc3'].forEach(function (id, i) {
      var el = $(id); if (el) el.style.display = (i === n - 1) ? '' : 'none';
    });
  }
  function err(m) { var e = $('ncErr'); if (e) e.textContent = m || ''; }

      function fillNcNoi() {
    var sel = $('ncNoi');
    if (!sel || sel.options.length) return;
    var ds = window.NOI_SINH || [];
    var h = '';
    if (ds.length) {
      ds.forEach(function (g) {
        h += '<optgroup label="' + g[0] + '">';
        g[1].forEach(function (c) {
          var val = c[1] + '|' + c[2] + '|' + c[0];
          h += '<option value="' + val + '">' + c[0] + '</option>';
        });
        h += '</optgroup>';
      });
    }
    h += '<option value="custom">Nơi khác – tự nhập tọa độ…</option>';
    sel.innerHTML = h;
    if (!ds.length) {
      // Fallback nếu NOI_SINH chưa load kịp: dùng Hà Nội
      sel.innerHTML = '<option value="21.03|105.85|Hà Nội">Hà Nội</option>' +
        '<option value="10.78|106.70|TP. Hồ Chí Minh">TP. Hồ Chí Minh</option>' +
        '<option value="20.45|106.34|Thái Bình">Thái Bình</option>' +
        '<option value="custom">Nơi khác – tự nhập tọa độ…</option>';
    }
    sel.addEventListener('change', function () {
      var cust = $('ncNoiCustom');
      if (cust) cust.style.display = (sel.value === 'custom') ? '' : 'none';
    });
  }

  function prefill() {
    fillNcNoi();
    try {
      var s = JSON.parse(localStorage.getItem('tcc_last_input') || 'null');
      if (!s || !s.day || !s.month || !s.year) return false;
      if (s.gender) $('ncGioi').value = s.gender;
      if (s.calendar) $('ncLich').value = s.calendar;
      $('ncNgay').value = s.day;
      $('ncThang').value = s.month;
      $('ncNam').value = s.year;
      if (s.hour != null && s.hour !== '') $('ncGio').value = s.hour;
      if (s.minute != null && s.minute !== '') $('ncPhut').value = s.minute;
      if (s.place) {
        var sel = $('ncNoi');
        var co = false;
        for (var i = 0; i < sel.options.length; i++) {
          if (sel.options[i].value === s.place) { sel.value = s.place; co = true; break; }
        }
        if (!co) {
          // Nơi sinh cũ không có trong danh sách → dùng custom
          sel.value = 'custom';
          $('ncNoiCustom').style.display = '';
          var pp = String(s.place).split('|');
          if (pp[0]) $('ncLat').value = pp[0];
          if (pp[1]) $('ncLon').value = pp[1];
        }
      }
      return true;
    } catch (e) { return false; }
  }

  function thongTinTomTat() {
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    var g = $('ncGioi').value === 'nu' ? 'Nữ' : 'Nam';
    var lich = $('ncLich').value === 'am' ? 'ÂL' : 'DL';
    var ngay = pad(parseInt($('ncNgay').value, 10)) + '/' + pad(parseInt($('ncThang').value, 10)) + '/' + $('ncNam').value;
    var gio = pad(parseInt($('ncGio').value, 10)) + 'h' + pad(parseInt($('ncPhut').value, 10));
    var noi = ($('ncNoi').value || '').split('|')[2] || '';
    return g + ' · ' + lich + ' ' + ngay + ' · ' + gio + (noi ? ' · ' + noi : '');
  }

      function mo() {
    err('');
    cauTraLoi = {};
    $('ncDs').innerHTML = '';
    $('ncChiTiet').innerHTML = '';
    $('ncDiem').textContent = '—%';
    $('ncKhuyen').textContent = '';
    fillNcNoi();
    $('ncModal').classList.add('show');

    var coThongTin = prefill();
    if (coThongTin) {
      showBuoc(2);
      $('ncThongTin').innerHTML = '<b>Đang nghiệm chứng:</b> ' + thongTinTomTat();
      $('ncDs').innerHTML = '<p class="muted" style="margin:0">Đang tính 6 hệ… vui lòng đợi 3-5 giây.</p>';
      lap();
    } else {
      showBuoc(1);
    }
  }
      function lap() {
    err('');
    var placeVal;
    if ($('ncNoi').value === 'custom') {
      var la = parseFloat($('ncLat').value), lo = parseFloat($('ncLon').value);
      if (isNaN(la) || isNaN(lo)) { err('Nhập vĩ độ và kinh độ cho nơi sinh tùy chỉnh.'); return; }
      placeVal = la + '|' + lo + '|Tùy chỉnh';
    } else {
      placeVal = $('ncNoi').value;
      if (!placeVal) { err('Chọn nơi sinh.'); return; }
    }

    var input = {
      name: 'NguoiDung',
      gender: $('ncGioi').value,
      calendar: $('ncLich').value,
      day: parseInt($('ncNgay').value, 10),
      month: parseInt($('ncThang').value, 10),
      year: parseInt($('ncNam').value, 10),
      hour: parseInt($('ncGio').value, 10),
      minute: parseInt($('ncPhut').value, 10),
      place: placeVal,
      tz: 7,
      viewYear: new Date().getFullYear()
    };
    if (!input.day || !input.month || !input.year) { err('Nhập đủ ngày/tháng/năm sinh.'); return; }
    if (input.hour < 0 || input.hour > 23) { err('Giờ phải từ 0 đến 23.'); return; }
    if (!hasServer()) { err('Không tìm thấy máy chủ Apps Script.'); return; }

    var tt = $('ncThongTin');
    if (tt) tt.innerHTML = '<b>Đang nghiệm chứng:</b> ' + thongTinTomTat();
    if ($('ncDs')) $('ncDs').innerHTML = '<p class="muted" style="margin:0">Đang tính 6 hệ… vui lòng đợi 3-5 giây.</p>';

    if ($('ncLap')) { $('ncLap').disabled = true; $('ncLap').textContent = 'Đang tính 6 hệ…'; }

    google.script.run
      .withSuccessHandler(function (doan) {
        if ($('ncLap')) { $('ncLap').disabled = false; $('ncLap').textContent = 'Lập 8 đoạn'; }
        if (!doan || !doan.length) {
          if ($('ncDs')) $('ncDs').innerHTML = '';
          err('Không sinh được đoạn mô tả. Kiểm tra lại thông tin.');
          showBuoc(1);
          return;
        }
        hienDoan(doan);
        showBuoc(2);
      })
      .withFailureHandler(function (e) {
        if ($('ncLap')) { $('ncLap').disabled = false; $('ncLap').textContent = 'Lập 8 đoạn'; }
        if ($('ncDs')) $('ncDs').innerHTML = '';
        err('Lỗi: ' + (e && e.message ? e.message : 'không xác định'));
        showBuoc(1);
      })
      .getDoanNghiemChung(input);
  }



  function hienDoan(doan) {
    var h = '<p class="nc-huongdan">Mỗi câu dưới đây là kết luận mà <b>nhiều hệ cùng chỉ ra</b> (nhãn bên cạnh cho biết bao nhiêu hệ đồng thuận). Hãy chấm cả nhóm theo cuộc đời thật của bạn. Nhóm nào chưa áp dụng (chưa lập gia đình, chưa có con…) thì chọn <b>Không áp dụng</b>.</p>';
    ncDoTin = {};
    doan.forEach(function (d) {
      ncDoTin[d.ma] = d.doTin;
      var mt = Math.round((d.doTin || 0) * 100);
      h += '<div class="nc-doan' + (d.apDung === false ? ' nc-na' : '') + '" data-ma="' + d.ma + '">';
      h += '<div class="nc-tieude">【' + d.ma + '】 ' + d.ten + '<span class="nc-tin" title="Mức đồng thuận trung bình của các hệ trong nhóm này">độ tin ' + mt + '%<i style="width:' + mt + '%"></i></span></div>';
      if (d.ghiChu) h += '<div class="nc-ghichu">ⓘ ' + d.ghiChu + '</div>';
      if (d.dong && d.dong.length) h += '<ul class="nc-ds">' + d.dong.map(function (x) {
        return '<li>' + x.t + (x.nhan ? ' <span class="nc-nhan">' + x.nhan + '</span>' : '') + '</li>'; }).join('') + '</ul>';
      else h += '<div class="nc-text">' + d.text + '</div>';
      h += '<div class="nc-muc-group">';
      NC_MUC.forEach(function (m) {
        h += '<button type="button" class="nc-muc' + (m.ma === 'khong_ap_dung' ? ' nc-muc-na' : '') + '" data-ma="' + d.ma + '" data-muc="' + m.ma + '">' + m.ten + '</button>';
      });
      h += '</div></div>';
    });
    $('ncDs').innerHTML = h;
    $('ncDs').querySelectorAll('.nc-muc').forEach(function (b) {
      b.addEventListener('click', function () {
        var ma = b.getAttribute('data-ma');
        var box = b.parentNode;
        box.querySelectorAll('.nc-muc').forEach(function (x) { x.classList.remove('chon'); });
        b.classList.add('chon');
        cauTraLoi[ma] = b.getAttribute('data-muc');
      });
    });
    showBuoc(2);
  }

  function xacNhan() {
    var so = Object.keys(cauTraLoi).filter(function (k) { return cauTraLoi[k] !== 'khong_ap_dung'; }).length;
    if (so < 4) { alert('Cần chấm ít nhất 4 nhóm (không tính nhóm "Không áp dụng"). Hiện có ' + so + ' nhóm.'); return; }
    cauTraLoi._doTin = ncDoTin;
    $('ncXacNhan').disabled = true;
    $('ncXacNhan').textContent = 'Đang tính…';
    google.script.run
      .withSuccessHandler(function (kq) {
        $('ncXacNhan').disabled = false;
        $('ncXacNhan').textContent = 'Xác nhận & tính điểm';
        hienKetQua(kq);
      })
      .withFailureHandler(function (e) {
        $('ncXacNhan').disabled = false;
        $('ncXacNhan').textContent = 'Xác nhận & tính điểm';
        alert('Lỗi: ' + (e && e.message ? e.message : 'không xác định'));
      })
      .tinhDiemNghiemChung(cauTraLoi);
  }

  function hienKetQua(kq) {
    var mau = { jade: 'var(--good-ink)', gold: 'var(--mid-ink)', coral: 'var(--bad-ink)' }[kq.mau] || 'var(--head)';
    $('ncDiem').textContent = kq.pct + '%';
    $('ncDiem').style.color = mau;
    $('ncKhuyen').textContent = kq.khuyen;
    var h = '<div style="margin-bottom:8px"><b>Tổng:</b> ' + kq.soDungCao + ' nhóm đúng cao · ' + kq.soSai + ' nhóm sai</div>';
    kq.chiTiet.forEach(function (c) {
      h += '<div style="padding:3px 0">【' + c.ma + '】 ' + c.ten + ' — ' + c.mucTen + (c.diem == null ? ' (bỏ qua)' : ' (' + Math.round(c.diem * 100) + '%)') + '</div>';
    });
    $('ncChiTiet').innerHTML = phieuNc(kq) + h;
    showBuoc(3);
  }
  /** Phễu sau nghiệm chứng: khớp → mời mở; nửa khớp → dò giờ; không khớp → nói thật "có thể không hợp với bạn" */
  function phieuNc(kq) {
    var tt = window.tccTrangThai ? window.tccTrangThai() : null;
    if (!tt || tt.toanQuyen) return '';
    function nut(attr, nhan, cls) { return '<button type="button" class="btn ' + (cls || 'btn-primary') + ' btn-sm" ' + attr + ' data-dong="ncModal">' + nhan + '</button>'; }
    var doGio = tt.coBan ? (tt.doGio ? nut('data-den="dc"', '🔍 Mở công cụ dò giờ') : nut('data-mua="do_gio"', '🔍 Dò chính xác giờ sinh · ' + tt.giaDoGio + ' xu')) : '';
    var thuGio = '<button type="button" class="btn btn-ghost btn-sm" data-nc-thu>↺ Thử giờ lân cận (miễn phí)</button>';
    var h;
    if (kq.ketLuan === 'XAC_NHAN') h = '<div class="nc-phieu ok"><b>🎯 Giờ sinh của bạn đáng tin.</b> Lá số này đúng là "của bạn" – phần luận giải chi tiết và vận hạn sẽ bám sát cuộc đời bạn.' +
      '<div class="kg-nut">' + (tt.khach ? nut('data-mua="co_ban"', 'Mở luận giải đầy đủ · ' + tt.giaCoBan + ' xu') + nut('data-mua="tron_goi"', 'Trọn đời · ' + tt.giaTron + ' xu', 'btn-ghost') : nut('data-den="vh"', '⏳ Xem vận hạn của bạn')) + '</div></div>';
    else if (kq.ketLuan === 'CO_THE_DUNG') h = '<div class="nc-phieu mid"><b>⚠ Có thể lệch giờ sinh.</b> Hay gặp khi sinh sát ranh giới hai giờ (±15 phút) hoặc giờ được nhớ ước lượng. Thử các giờ lân cận miễn phí, hoặc để hệ thống dò đủ 12 giờ theo các sự kiện bạn đã trải qua.' +
      '<div class="kg-nut">' + thuGio + (doGio || nut('data-mua="co_ban"', 'Mở Bản mở (kèm công cụ dò giờ) · ' + tt.giaCoBan + ' xu')) + '</div></div>';
    else h = '<div class="nc-phieu bad"><b>✋ Lá số chưa khớp với bạn.</b> Có hai khả năng: giờ sinh chưa đúng, hoặc <b>phương pháp luận của chúng tôi không phù hợp với bạn</b>. Hãy thử giờ lân cận' + (tt.coBan ? ' hoặc dò giờ theo sự kiện' : '') +
      '. Nếu vẫn dưới 50%, chúng tôi khuyên bạn <b>đừng mua</b> – cảm ơn bạn đã thử.<div class="kg-nut">' + thuGio + doGio + '</div></div>';
    return h;
  }

    function init() {
    var nut1 = $('btnNghiemChung');        // nút cũ ở header (nếu còn sót)
    if (nut1) nut1.addEventListener('click', mo);
    var nut2 = $('ncBannerGo');            // nút mới ở banner
    if (nut2) nut2.addEventListener('click', mo);

    // Theo dõi #chartArea: khi hiện → bật banner, khi ẩn → tắt
    var ca = $('chartArea'), nb = $('ncBanner');
    if (ca && nb) {
      function capNhat() { nb.style.display = (ca.style.display === 'none') ? 'none' : 'block'; }   // block: nội dung trên, nút xuống dòng dưới (flex làm nút bị bóp thành cột)
      capNhat();
      new MutationObserver(capNhat).observe(ca, { attributes: true, attributeFilter: ['style'] });
    }

    if ($('ncLap')) $('ncLap').addEventListener('click', lap);
    if ($('ncXacNhan')) $('ncXacNhan').addEventListener('click', xacNhan);
    if ($('ncBack')) $('ncBack').addEventListener('click', function () { showBuoc(1); });
    if ($('ncThuLai')) $('ncThuLai').addEventListener('click', function () { cauTraLoi = {}; showBuoc(1); });
    if ($('ncChiTiet')) $('ncChiTiet').addEventListener('click', function (e) { if (e.target.closest('[data-nc-thu]')) { cauTraLoi = {}; showBuoc(1); } });
    var modal = $('ncModal');
    if (modal) modal.addEventListener('click', function (e) {
      if (e.target === modal) modal.classList.remove('show');
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
