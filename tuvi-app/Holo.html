    CH.forEach(function (ch) { var a = GP[ch[0]], b = GP[ch[1]], mm = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; half(a, mm, ch[0]); half(mm, b, ch[1]); });
    var dinh = HD.dinh || {};
    Object.keys(POS).forEach(function (c) {
      var on = !!dinh[c], cc = CCOL[c], g = el('g', { class: 'cen', 'data-c': c, tabindex: 0, role: 'button', 'aria-label': CTEN[c] + (on ? ' – có định nghĩa' : ' – mở'), style: 'cursor:pointer' }, s);
      shape(c, POS[c], { fill: on ? cc : '#081022', 'fill-opacity': on ? .9 : 1, stroke: on ? '#FFF6DA' : cc, 'stroke-opacity': on ? .9 : .55, 'stroke-width': on ? 1.6 : 1.2, 'stroke-linejoin': 'round', filter: on ? 'url(#hdGl)' : '' }, g);
    });
    Object.keys(GP).forEach(function (g) {
      var c = CEN[g], C = POS[c], p = GP[g], dx = C[0] - p[0], dy = C[1] - p[1], L2 = Math.sqrt(dx * dx + dy * dy) || 1, q = [p[0] + dx / L2 * 8, p[1] + dy / L2 * 8], v = HD.gates[g] || '', on = !!v, dk = !!dinh[c];
      if (on) el('circle', { cx: q[0], cy: q[1], r: 5.8, fill: 'rgba(6,11,22,.9)', stroke: v.indexOf('d') >= 0 && v.indexOf('p') >= 0 ? '#FFE6A8' : v.indexOf('d') >= 0 ? '#FF6B7A' : '#CFF8FF', 'stroke-width': 1 }, s);
      el('text', { x: q[0], y: q[1] + 3, 'text-anchor': 'middle', 'font-size': on ? 7 : 6.3, 'font-weight': on ? 700 : 500, fill: on ? '#FFFFFF' : (dk ? 'rgba(10,15,30,.75)' : 'rgba(168,184,204,.55)'), 'font-family': 'Chakra Petch, sans-serif', 'pointer-events': 'none' }, s, g);

    var tip = document.createElement('div'); tip.className = 'holo-tip'; tip.setAttribute('aria-live', 'polite'); tip.textContent = 'Bấm vào một trung tâm để xem nó đang có định nghĩa hay mở.';

  }

  // Không tải ảnh nền/ghép bảng hologram trên điện thoại hoặc khi người dùng giảm chuyển động.
  function nenDuocTai() {
    try {
      return window.innerWidth > 760 &&
        !window.matchMedia('(pointer: coarse)').matches &&
        !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) { return window.innerWidth > 760; }
  }
  function ve(res, api) {
    // Luôn dựng sơ đồ Hologram cho đủ 6 hệ trên cả điện thoại và máy tính.
    // Điều kiện nenDuocTai() chỉ dùng để giới hạn ảnh nền/hiệu ứng nền, không chặn bản thân lá số.
    api = api || {}; tenNguoi = (res.tuvi && res.tuvi.info && res.tuvi.info.name) || '';
    [['tv', veTuVi], ['bt', veBatTu], ['hl', veHaLac], ['ct', veChiemTinh], ['ts', veThanSo], ['hd', veHD]].forEach(function (x) {
      try { x[1](res, api); } catch (e) { if (window.console) console.error('[Holo ' + x[0] + ']', e); }
    });
  }
  /* Tải ảnh riêng của từng hệ: chụp bảng trên tranh (Bát Tự chụp cả bảng gộp bên dưới) */
  var tenNguoi = '';
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-holo-tai]'); if (!b) return;
    if (typeof html2canvas === 'undefined') { alert('Không tải được thư viện chụp ảnh – hãy thử lại sau.'); return; }
    var w = b.closest('.holo-wrap'), nut = w.querySelector('.board'), ten = b.getAttribute('data-holo-tai');
    var cu = b.textContent; b.disabled = true; b.textContent = 'Đang chụp…';
    var chup = w.querySelector('.holo-bt') ? w : nut, an = [].slice.call(w.querySelectorAll('.holo-tai'));
    an.forEach(function (x) { x.style.visibility = 'hidden'; });
    // html2canvas đặt sai vị trí SVG nằm tuyệt đối → tạm thay mỗi SVG bằng ảnh <img> cùng kích thước, chụp xong trả lại
    var svgs = [].slice.call(chup.querySelectorAll('svg')).map(function (sv) {
      var r = sv.getBoundingClientRect(), pr = sv.parentNode.getBoundingClientRect(), cs = getComputedStyle(sv), c = sv.cloneNode(true);
      c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('width', Math.round(r.width)); c.setAttribute('height', Math.round(r.height));
      var im = document.createElement('img'); im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(c));
      im.style.cssText = 'display:block;width:' + r.width + 'px;height:' + r.height + 'px;' + (cs.position === 'absolute' ? 'position:absolute;left:' + (r.left - pr.left) + 'px;top:' + (r.top - pr.top) + 'px;z-index:' + cs.zIndex + ';' : '');
      sv.parentNode.insertBefore(im, sv); sv.style.display = 'none'; return [sv, im];
    });
    new Promise(function (ok) { setTimeout(ok, 120); }).then(function () { return html2canvas(chup, { scale: 2, backgroundColor: '#060B16', useCORS: true, logging: false }); }).then(function (cv) {
      var a = document.createElement('a'); a.href = cv.toDataURL('image/png');
      a.download = ten + '-' + (tenNguoi || 'thien-co-cac').replace(/\s+/g, '-') + '.png';
      document.body.appendChild(a); a.click(); a.remove();
    }).catch(function (err) { alert('Chưa chụp được ảnh: ' + (err && err.message || err)); })
      .then(function () { svgs.forEach(function (o) { o[1].remove(); o[0].style.display = ''; }); an.forEach(function (x) { x.style.visibility = ''; }); b.disabled = false; b.textContent = cu; });
  });
  /* Nền card từng tab (tải chậm khi mở tab) */
  var NEN_TAB = { tong: 'TabTong', chart: 'TabTuVi', battu: 'TabBatTu', halac: 'TabHaLac', astro: 'TabChiemTinh', so: 'TabThanSo', hd: 'TabHD', vh: 'TabVanHan', capdoi: 'TabCapDoi', ti: 'Nen', hist: 'Nen', que64: 'TabHaLac' };
  var NEN_DA = {};
  function nenTab(name) {
    if (!nenDuocTai()) return;
    var pg = document.getElementById('page-' + name), ten = NEN_TAB[name]; if (!pg || !ten) return;
    if (pg._nen) return; pg._nen = 1;
    var gan = { style: { setProperty: function (k, v) { pg.style.setProperty('--nen-tab', v); pg.classList.add('co-nen'); } } };
    anh(ten, gan);
  }
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (tvBd) { veTuanTriet(); veDuongTV(); } if (nenDuocTai()) veDuongTV(); }, 150); });

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', nen); else nen();
  window.TCCHolo = { nenTab: nenTab, ve: ve, veTuVi: veTuVi, chonCung: chonCung, veDuong: veDuongTV, anh: anh };
})();
