<style>
/* ================================================================
   THIÊN CƠ CÁC — phong cách tiên hiệp sáng: ngọc bích, kim sa, mây trắng
   ================================================================ */
/* Bảng màu "Huyền Bí": đêm sâu – kim sa – tinh vân. Mọi màu đi qua token để có thể đổi sang nền sáng (bản in). */
:root, .theme-dark {
  --paper: #2c2e5a;
  --paper-2: #34366a;
  --card: rgba(62, 64, 118, 0.62);
  --card-solid: #3a3c70;
  --surface: #3a3d72;
  --surface-2: #41447a;
  --surface-3: #4b4e86;
  --surface-glass: rgba(255, 255, 255, 0.08);
  --cell: linear-gradient(180deg, #3d4076, #35386a);
  --cell-hover: linear-gradient(180deg, #474b86, #3d4076);
  --cell-hi: linear-gradient(180deg, #4a4480, #3c3a70);
  --cell-menh: linear-gradient(180deg, #56497f, #433e74);
  --cell-center: radial-gradient(circle at 50% 40%, #4a4d8a, #313466 75%);
  --cover-bg: radial-gradient(900px 600px at 80% 0%, rgba(185, 160, 255, .35), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(255, 196, 150, .25), transparent 60%), linear-gradient(180deg, #2a2c5c, #1c1e44);
  --ink: #f5f0e4;
  --ink-soft: #cfc9e4;
  --head: #ffe1a3;
  --accent: #8c74e6;
  --accent-deep: #4a3f96;
  --jade: #7fe0cc;
  --jade-deep: #ffe1a3;
  --jade-mist: rgba(127, 224, 204, 0.12);
  --gold: #e3bd68;
  --gold-hi: #ffe1a3;
  --gold-soft: rgba(227, 189, 104, 0.18);
  --gold-deep: #c79a3e;
  --cinnabar: #ff8a78;
  --lavender: #c9bbff;
  --line: rgba(255, 225, 163, 0.26);
  --shadow: 0 12px 34px rgba(16, 14, 44, 0.35), 0 0 0 1px rgba(255, 225, 163, 0.06);
  --radius: 18px;
  --good-bg: rgba(92, 201, 138, 0.18); --good-ink: #a6f0c4;
  --bad-bg: rgba(255, 138, 120, 0.18); --bad-ink: #ffb3a8;
  --mid-bg: rgba(216, 178, 90, 0.16); --mid-ink: #f1d58f;
  --kw: #ffe1a3; --kw-star: #dcd0ff; --kw-good: #a6f0c4; --kw-bad: #ffb3a8;

  --kim: #c3c9d6;
  --moc: #5cc98a;
  --thuy: #6fa3f0;
  --hoa: #ef6a5c;
  --tho: #e0a44a;

  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-title: 'Cormorant Garamond', 'Noto Serif', Georgia, serif;
  --font-serif: 'Noto Serif', Georgia, serif;
  --font-han: 'Ma Shan Zheng', 'Noto Serif SC', serif;
  color-scheme: dark;
}
/* Nền sáng – dùng cho bản PDF để in */
.theme-light {
  --paper: #fbf8f1; --paper-2: #f5efe2; --card: #ffffff; --card-solid: #fffdf8;
  --surface: #ffffff; --surface-2: #fffdf7; --surface-3: #f3efe6; --surface-glass: rgba(255,255,255,.7);
  --cell: linear-gradient(180deg, #fff, #fbf8f1); --cell-hover: linear-gradient(180deg, #fff, #f8f1df);
  --cell-hi: linear-gradient(180deg, #fffdf6, #fdf5e2); --cell-menh: linear-gradient(180deg, #fffaf0, #fdf1d8);
  --cell-center: linear-gradient(180deg, #fffdf6, #fbf5e6);
  --cover-bg: linear-gradient(180deg, #1b1840, #2b2266 55%, #3a2f7a);
  --ink: #26283a; --ink-soft: #5d6072; --head: #2b2266; --accent: #5a44b8; --accent-deep: #2b2266;
  --jade: #1f7a70; --jade-deep: #2b2266; --jade-mist: #ece9f8;
  --gold: #b98f35; --gold-hi: #8a6414; --gold-soft: #f3e3b8; --gold-deep: #9a7324;
  --cinnabar: #b83a2e; --line: rgba(120, 100, 60, 0.25); --shadow: none;
  --good-bg: #e7f5ec; --good-ink: #1e6b3b; --bad-bg: #fbe9e6; --bad-ink: #9e2b22; --mid-bg: #fbf3dc; --mid-ink: #8a6414;
  --kw: #6a4a0c; --kw-star: #4b36a8; --kw-good: #1e6b3b; --kw-bad: #9e2b22;
  --kim: #6d7480; --moc: #2d8a4e; --thuy: #1f4f99; --hoa: #c8372d; --tho: #b0761a;
  color-scheme: light; color: var(--ink);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.55;
}

/* ---------- Bầu trời & mây ---------- */
.sky {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 82% -12%, rgba(196, 172, 255, 0.40), transparent 60%),
    radial-gradient(1000px 620px at 5% 18%, rgba(128, 176, 236, 0.28), transparent 60%),
    radial-gradient(1500px 560px at 50% 118%, rgba(255, 200, 160, 0.42), transparent 62%),
    linear-gradient(180deg, #25285a 0%, #34376e 42%, #4a4684 78%, #5d5089 100%);
}
.sky::before {
  content: ''; position: absolute; inset: 0; background-repeat: repeat;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 200px 150px, rgba(255,225,163,.85), transparent 60%),
    radial-gradient(1px 1px at 260px 40px, rgba(220,208,255,.65), transparent 60%);
  background-size: 300px 220px; opacity: .55;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%); mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%);
  animation: twinkle 7s ease-in-out infinite alternate;
}
/* màn sương trôi – cảm giác gần mà không chạm tới */
.sky::after {
  content: ''; position: absolute; inset: -10% -20%;
  background:
    radial-gradient(600px 180px at 20% 70%, rgba(255, 255, 255, .10), transparent 70%),
    radial-gradient(700px 200px at 75% 60%, rgba(230, 220, 255, .10), transparent 70%),
    radial-gradient(900px 240px at 50% 88%, rgba(255, 236, 214, .14), transparent 70%);
  filter: blur(8px); animation: mist 60s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .7; } }
@keyframes mist { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
.sky .sun {
  position: absolute; top: -40px; right: 3%; width: 150px; height: 150px; border-radius: 50%; opacity: .75;
  background: radial-gradient(circle at 35% 35%, rgba(255, 248, 228, .95), rgba(255, 225, 163, .55) 35%, rgba(196, 172, 255, .18) 62%, transparent 72%);
  box-shadow: 0 0 80px 20px rgba(241, 213, 143, .12);
}
.cloud { display: none; }
.mountains { position: fixed; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; opacity: .9; }
.mountains svg { width: 100%; height: 26vh; display: block; }

/* ---------- Header ---------- */
.app-header {
  max-width: 1320px; margin: 0 auto; padding: 26px 20px 8px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.seal {
  width: 62px; height: 62px; flex: none; border-radius: 12px;
  background: linear-gradient(145deg, #c9463a, #9e2b22);
  color: #fff4e6; display: grid; place-items: center;
  font-family: var(--font-han); font-size: 26px; line-height: 1; letter-spacing: 2px;
  box-shadow: 0 6px 16px rgba(158, 43, 34, 0.35), inset 0 0 0 3px rgba(255, 240, 220, 0.35);
  writing-mode: vertical-rl;
  transform: rotate(-4deg);
}
.brand h1 {
  font-family: var(--font-title); font-weight: 700; font-size: 38px; margin: 0; line-height: 1.05;
  background: linear-gradient(90deg, #fff1c9, var(--gold) 45%, #c9b8ff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: .5px;
}
.brand p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.brand p .han { font-family: var(--font-han); color: var(--gold-hi); font-size: 18px; margin-right: 6px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; }

/* ---------- Layout ---------- */
.container { max-width: 1320px; margin: 0 auto; padding: 8px 20px 60px; }
.layout { display: grid; grid-template-columns: 360px 1fr; gap: 22px; align-items: start; }
@media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }

.panel {
  background: var(--card);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
}
.panel::before, .panel::after {
  content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid var(--gold); opacity: .55; pointer-events: none;
}
.panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

.panel-title {
  font-family: var(--font-title); font-weight: 700; font-size: 27px; color: var(--head);
  margin: 0 0 14px; display: flex; align-items: center; gap: 12px; letter-spacing: .3px;
  text-shadow: 0 0 18px rgba(241, 213, 143, .25);
}
.panel-title .han { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 10px;
  background: linear-gradient(145deg, rgba(216,178,90,.22), rgba(124,92,214,.22)); border: 1px solid var(--line); }
.panel-title .han { font-family: var(--font-han); font-weight: 400; font-size: 22px; color: var(--gold-hi); }
.panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }

/* ---------- Form ---------- */
.form-panel { padding: 22px 20px 20px; position: sticky; top: 14px; }
@media (max-width: 1080px) { .form-panel { position: relative; top: 0; } }
.field { margin-bottom: 13px; }
.field label, .field .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase; }
.row { display: grid; gap: 8px; }
.row.c3 { grid-template-columns: 0.8fr 1.3fr 1.1fr; }
.row.c2 { grid-template-columns: 1fr 1fr; }
input[type=text], input[type=number], input[type=date], select {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--card-solid); border: 1px solid rgba(31, 122, 112, 0.22); border-radius: 12px;
  outline: none; transition: border .2s, box-shadow .2s;
  appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
input:focus, select:focus { border-color: var(--jade); box-shadow: 0 0 0 3px rgba(31, 122, 112, 0.14); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.seg { display: flex; background: var(--jade-mist); border-radius: 12px; padding: 4px; gap: 4px; }
.seg input { display: none; }
.seg label {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--head); margin: 0; text-transform: none; letter-spacing: 0;
  transition: all .2s;
}
.seg input:checked + label { background: var(--surface); color: var(--cinnabar); box-shadow: 0 2px 8px rgba(19, 86, 80, .15); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin: 6px 0; }
.field .check { display: flex; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 400; color: var(--ink); margin: 8px 0 0; }
.check input { width: 17px; height: 17px; accent-color: var(--jade); }

.preview-date {
  font-size: 13.5px; padding: 9px 12px; border-radius: 12px; margin: 4px 0 14px;
  background: linear-gradient(90deg, rgba(216, 178, 90, .14), rgba(124, 92, 214, .14));
  border: 1px dashed rgba(200, 155, 60, .5); color: var(--ink);
  min-height: 38px;
}
.preview-date b { color: var(--head); }

details.adv { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
details.adv summary { cursor: pointer; font-weight: 600; color: var(--jade); list-style: none; font-size: 14px; }
details.adv summary::before { content: '✦ '; color: var(--gold); }
details.adv[open] summary { margin-bottom: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  width: 100%; padding: 14px; font-size: 17px; margin-top: 12px; letter-spacing: .5px;
  color: #fffaf0;
  background: linear-gradient(135deg, #d9b156 0%, #c08f2e 45%, #a8771f 100%);
  box-shadow: 0 8px 20px rgba(168, 119, 31, .35), inset 0 1px 0 rgba(255, 255, 255, .4);
  font-family: var(--font-title); font-size: 21px; font-weight: 700;
}
.btn-primary:hover { box-shadow: 0 10px 26px rgba(168, 119, 31, .45), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn-ghost { background: var(--surface-glass); color: var(--head); border: 1px solid rgba(31, 122, 112, .25); }
.btn-ghost:hover { background: var(--surface); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }

/* ---------- Tabs ---------- */
.result-wrap { min-width: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab {
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14.5px;
  background: var(--surface-glass); border: 1px solid var(--line); color: var(--ink-soft);
  transition: all .2s;
}
.tab:hover { color: var(--head); }
.tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(19, 86, 80, .25); }
.tab-page { display: none; animation: fadeUp .45s ease; }
.tab-page.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .sp { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-soft); }
.legend span::before { content: '●'; margin-right: 4px; }
.legend .h-Kim::before { color: var(--kim); } .legend .h-Mộc::before { color: var(--moc); }
.legend .h-Thủy::before { color: var(--thuy); } .legend .h-Hỏa::before { color: var(--hoa); } .legend .h-Thổ::before { color: var(--tho); }

/* ---------- Welcome ---------- */
.welcome { padding: 40px 30px; text-align: center; }
.welcome .taiji { width: 120px; height: 120px; margin: 0 auto 16px; animation: spin 30s linear infinite; }
.welcome h2 { font-family: var(--font-title); font-size: 34px; margin: 6px 0; color: var(--head); }
.welcome p { color: var(--ink-soft); max-width: 620px; margin: 8px auto; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 24px; text-align: left; }
.feature { padding: 14px; border-radius: 14px; background: var(--surface-glass); border: 1px solid var(--line); }
.feature .han { font-family: var(--font-han); font-size: 26px; color: var(--cinnabar); }
.feature b { display: block; color: var(--head); margin: 2px 0; }
.feature small { color: var(--ink-soft); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   LÁ SỐ 12 CUNG
   ================================================================ */
.chart-scroll { overflow-x: auto; padding-bottom: 6px; }
.chart-frame {
  position: relative; min-width: 820px;
  padding: 10px; border-radius: 20px;
  background:
    linear-gradient(var(--card-solid), var(--card-solid)) padding-box,
    linear-gradient(135deg, #e6c878, #c89b3c 30%, #f3e3b8 50%, #c89b3c 70%, #e6c878) border-box;
  border: 3px solid transparent;
  box-shadow: var(--shadow);
}
.chart {
  position: relative;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, minmax(208px, auto));
  gap: 0; border: 1px solid rgba(154, 115, 36, .55);
  background: var(--surface);
}
.chart-lines { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.center > *:not(.chart-lines):not(.bg-han) { position: relative; z-index: 1; }
.chart-lines line { stroke: var(--cinnabar); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .45; }
.chart-lines line.xung { stroke: var(--jade); stroke-dasharray: none; stroke-width: 1.6; }

.cung {
  position: relative; border: 1px solid rgba(154, 115, 36, .35);
  padding: 6px 7px 26px; font-size: 12px; line-height: 1.32; cursor: pointer;
  background: var(--cell);
  transition: background .25s, box-shadow .25s;
  min-width: 0;
}
.cung:hover { background: var(--cell-hover); }
.cung.sel { background: linear-gradient(180deg, #fff9e8, #fbefd0); box-shadow: inset 0 0 0 2px var(--gold); z-index: 2; }
.cung.tamhop { background: var(--cell-hi); box-shadow: inset 0 0 0 1.5px rgba(184, 58, 46, .45); }
.cung.xungchieu { box-shadow: inset 0 0 0 1.5px rgba(31, 122, 112, .55); }
.cung.is-menh { background: var(--cell-menh); }

.c-head { display: flex; align-items: baseline; gap: 4px; justify-content: space-between; border-bottom: 1px dotted rgba(154, 115, 36, .4); padding-bottom: 3px; margin-bottom: 4px; }
.c-canchi { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.c-name {
  font-family: var(--font-serif); font-weight: 700; font-size: 12.5px; color: var(--head); text-transform: uppercase; letter-spacing: .4px;
  text-align: center; flex: 1; white-space: nowrap;
}
.cung.is-menh .c-name { color: var(--cinnabar); }
.c-than { display: inline-block; font-size: 10px; background: var(--cinnabar); color: #fff; padding: 0 5px; border-radius: 6px; margin-left: 3px; vertical-align: 1px; }
.c-dh { font-weight: 700; font-size: 12px; color: var(--gold-hi); }

.c-chinh { text-align: center; min-height: 20px; margin: 2px 0 4px; }
.c-chinh .star { display: inline-block; font-family: var(--font-serif); font-weight: 700; font-size: 13.5px; margin: 0 3px; white-space: nowrap; text-transform: uppercase; }
.c-chinh .vcd { color: #aa9b7a; font-style: italic; font-weight: 400; font-size: 11.5px; }
.star sup { font-size: 9px; font-weight: 600; margin-left: 1px; opacity: .85; text-transform: none; }
.hoa-tag { display: inline-block; font-size: 9.5px; font-weight: 700; color: #fff; border-radius: 4px; padding: 0 3px; margin-left: 2px; vertical-align: 2px; text-transform: none; font-family: var(--font-body); }
.hoa-Lộc { background: #2d8a4e; } .hoa-Quyền { background: #c8372d; } .hoa-Khoa { background: #1f4f99; } .hoa-Kỵ { background: #333; }

.c-phu { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; }
.c-phu .col div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.c-phu .hung { text-align: right; }
.c-phu .hung div { font-style: normal; }
.c-luu { margin-top: 3px; font-size: 10.5px; font-style: italic; color: var(--lavender); line-height: 1.25; }
.c-luu span { display: inline-block; margin-right: 4px; }
.hide-luu .c-luu { display: none; }
.hide-minor .minor { display: none; }

.c-foot {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px;
  display: flex; justify-content: space-between; gap: 4px;
  font-size: 10.5px; color: var(--ink-soft);
  border-top: 1px dotted rgba(154, 115, 36, .35);
  background: rgba(0, 0, 0, .22);
}
.c-foot .ts { color: var(--head); font-weight: 600; }
.c-foot .th { color: var(--gold-hi); font-weight: 600; }

.h-Kim { color: var(--kim); } .h-Mộc { color: var(--moc); } .h-Thủy { color: var(--thuy); } .h-Hỏa { color: var(--hoa); } .h-Thổ { color: var(--tho); }

.badge-tt {
  position: absolute; z-index: 4; font-size: 10px; font-weight: 700; color: #fff; padding: 1px 6px; border-radius: 6px;
  letter-spacing: .5px; box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
}
.badge-tt.tuan { background: #4b5563; }
.badge-tt.triet { background: #111827; }
.flag { display: inline-block; font-size: 9.5px; font-weight: 700; padding: 0 5px; border-radius: 5px; margin-left: 2px; }
.flag.dh { background: #fde8c8; color: #9a5b00; }
.flag.th { background: var(--good-bg); color: var(--head); }
.cung.dh-now { outline: 2px dashed rgba(200, 155, 60, .75); outline-offset: -4px; }

/* Thiên bàn (giữa) */
.center {
  grid-column: 2 / span 2; grid-row: 2 / span 2;
  border: 1px solid rgba(154, 115, 36, .35);
  padding: 14px 18px; position: relative; overflow: hidden;
  background:
    radial-gradient(circle at 50% 40%, rgba(216, 178, 90, .18), transparent 65%),
    var(--cell-center);
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.center .bg-han {

  background: radial-gradient(700px 520px at 85% 8%, rgba(196,172,255,.45), transparent 62%), radial-gradient(700px 460px at 0% 100%, rgba(255,200,160,.30), transparent 60%), linear-gradient(180deg, #2c2f63, #1c1e44); }

/* ---------- Nhấn mạnh từ khóa ---------- */

/* ---------- Tooltip ---------- */
.tip { position: fixed; z-index: 90; max-width: 320px; pointer-events: none; opacity: 0; transition: opacity .12s; background: #0e1026; color: #efe8d6;
  border: 1px solid rgba(216,178,90,.45); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,.5); }

/* ---------- Biểu đồ ---------- */
.chart-fig { margin: 14px 0; padding: 12px 14px 8px; border-radius: 14px; background: linear-gradient(180deg, #1d1f45, #171a3a); border: 1px solid var(--line); color: #efe9da; }

.hbars { display: grid; gap: 7px; }

/* ---------- Chân dung hé lộ ---------- */

  background: radial-gradient(700px 360px at 90% -10%, rgba(124,92,214,.35), transparent 60%), radial-gradient(500px 300px at 0% 110%, rgba(216,178,90,.18), transparent 60%), var(--card); }
.rv-eyebrow { color: var(--gold-hi); font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; }

  background: linear-gradient(90deg, #fff1c9, var(--gold) 50%, #c9b8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
