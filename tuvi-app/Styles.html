<style>
/* Mã phiên bản giao diện – phải trùng với Index.html (meta tcc-ban) và Script.html (BAN_GIAO_DIEN) */
:root { --tcc-ban: "2026.10.31.5"; }
/* ================================================================
   THIÊN CƠ CÁC — phong cách tiên hiệp sáng: ngọc bích, kim sa, mây trắng
   ================================================================ */
/* Bảng màu "Huyền Bí": đêm sâu – kim sa – tinh vân. Mọi màu đi qua token để có thể đổi sang nền sáng (bản in). */
/* Bảng màu "Thanh Thủy": nền cyan – card xanh đen nổi khối – điểm hổ phách. Mọi màu đi qua token để đổi sang nền sáng (bản in). */
:root, .theme-dark {
  /* Bảng màu "Bạch Kim" (22/10/2026, chủ dự án duyệt): than ấm – bạch kim, bạc (Kim) – sâm panh (Thổ) – vàng hồng, đồng hồng (Hỏa).
     Không dùng xanh lá (Mộc) và đen xanh, xanh dương (Thủy) cho phần trang trí; tín hiệu "tốt" là bạc sáng, "xấu" là hồng dịu. */
  --paper: #14110e;
  --paper-2: #1c1814;
  --card: rgba(31, 27, 23, 0.96);
  --card-solid: #1f1b17;
  --surface: #26211c;
  --surface-2: #2e2822;
  --surface-3: #3a332b;
  --surface-glass: rgba(255, 236, 200, 0.06);
  --cell: linear-gradient(180deg, #26211c, #1f1b17);
  --cell-hover: linear-gradient(180deg, #302a24, #26211c);
  --cell-hi: linear-gradient(180deg, #3a3229, #2b2620);
  --cell-menh: linear-gradient(180deg, #463c30, #2f2922);
  --cell-center: radial-gradient(circle at 50% 40%, #2a2520, #171410 75%);
  --cover-bg: radial-gradient(900px 600px at 80% 0%, rgba(226, 198, 144, .22), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(227, 165, 136, .14), transparent 60%), linear-gradient(180deg, #1d1915, #100e0b);
  --ink: #f5f1ea;
  --ink-soft: #c9bdad;
  --head: #f3e3bf;
  --accent: #d9b98a;
  --accent-deep: #9a7a55;
  --jade: #dfe3e8;
  --jade-deep: #f3e3bf;
  --jade-mist: rgba(226, 198, 144, 0.10);
  --gold: #e2c690;
  --gold-hi: #f3e3bf;
  --gold-soft: rgba(226, 198, 144, 0.16);
  --gold-deep: #b8956a;
  --cinnabar: #e3a588;
  --lavender: #cdb9e6;
  --line: rgba(226, 198, 144, 0.22);
  --shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(226, 198, 144, 0.08);
  --radius: 6px;
  --good-bg: rgba(238, 240, 242, 0.10); --good-ink: #eef0f2;
  --bad-bg: rgba(228, 138, 138, 0.18); --bad-ink: #f0a8a0;
  --mid-bg: rgba(226, 198, 144, 0.15); --mid-ink: #f3e3bf;
  --kw: #f3e3bf; --kw-star: #f7f5f0; --kw-good: #eef0f2; --kw-bad: #f0a8a0;

  --kim: #e2dccd;
  --moc: #93c08b;
  --thuy: #7ea9d9;
  --hoa: #e27c60;
  --tho: #d2a35b;
  --bk-grad: linear-gradient(120deg, #f7f5f0 0%, #d9c3a0 28%, #e3a588 62%, #b8806a 100%);
  --bk-bac: #eef0f2; --bk-sam: #e8cf8f; --bk-hong: #e3a588; --bk-dong: #b8806a; --bk-xau: #e48a8a;

  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-title: 'Cormorant Garamond', 'Noto Serif', Georgia, serif;
  --font-serif: 'Noto Serif', Georgia, serif;
  --font-han: 'Ma Shan Zheng', 'Noto Serif SC', serif;
  color-scheme: dark;
}
/* Nền sáng – bản PDF để in; lá số dùng nền giấy ngà để nổi trên nền cyan */
.theme-light, .chart-frame {
  --paper: #fbf7ef; --paper-2: #f4ecdc; --card: #ffffff; --card-solid: #fdfefe;
  --surface: #ffffff; --surface-2: #fbfdfd; --surface-3: #f4ecdc; --surface-glass: rgba(255,255,255,.7);
  --cell: linear-gradient(180deg, #fffdf7, #f9f2e1); --cell-hover: linear-gradient(180deg, #fffef9, #f4ead2);
  --cell-hi: linear-gradient(180deg, #fbf3df, #f3e4c2); --cell-menh: linear-gradient(180deg, #fff6e0, #fbe7bb);
  --cell-center: radial-gradient(circle at 50% 40%, #fffdf6, #f3ead4 80%);
  --cover-bg: linear-gradient(180deg, #1c140d, #2a1f15 55%, #3a2b1d);
  --ink: #2a2118; --ink-soft: #6b5d4c; --head: #6b4a12; --accent: #8a6424; --accent-deep: #6b4a12;
  --jade: #5f7f4f; --jade-deep: #6b4a12; --jade-mist: #f6ecd6;
  --gold: #b7791f; --gold-hi: #8a5a12; --gold-soft: #fbecc8; --gold-deep: #9a6a1c;
  --cinnabar: #b8322b; --lavender: #4054b2; --line: rgba(138, 100, 36, 0.28); --shadow: none;
  --good-bg: #e7f5ec; --good-ink: #1e6b3b; --bad-bg: #fbe9e6; --bad-ink: #9e2b22; --mid-bg: #fbf3dc; --mid-ink: #8a6414;
  --kw: #8a5a12; --kw-star: #7a4f12; --kw-good: #1e6b3b; --kw-bad: #9e2b22;
  --kim: #6d7480; --moc: #2d8a4e; --thuy: #1f4f99; --hoa: #c8372d; --tho: #b0761a;
  color-scheme: light; color: var(--ink);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.55;
}

/* ---------- Bầu trời & mây ---------- */
.sky {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 82% -12%, rgba(226, 198, 144, 0.40), transparent 60%),
    radial-gradient(1000px 620px at 5% 18%, rgba(200, 150, 80, 0.28), transparent 60%),
    radial-gradient(1500px 560px at 50% 118%, rgba(255, 210, 120, 0.42), transparent 62%),
    linear-gradient(180deg, #100e0b 0%, #161310 42%, #1a120c 78%, #21170f 100%);
}
.sky::before {
  content: ''; position: absolute; inset: 0; background-repeat: repeat;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 200px 150px, rgba(240, 210, 150,.85), transparent 60%),
    radial-gradient(1px 1px at 260px 40px, rgba(240, 210, 150,.65), transparent 60%);
  background-size: 300px 220px; opacity: .55;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%); mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%);
  animation: twinkle 7s ease-in-out infinite alternate;
}
/* màn sương trôi – cảm giác gần mà không chạm tới */
.sky::after {
  content: ''; position: absolute; inset: -10% -20%;
  background:
    radial-gradient(600px 180px at 20% 70%, rgba(255, 255, 255, .10), transparent 70%),
    radial-gradient(700px 200px at 75% 60%, rgba(255, 236, 200, .10), transparent 70%),
    radial-gradient(900px 240px at 50% 88%, rgba(255, 236, 200, .14), transparent 70%);
  filter: blur(8px); animation: mist 60s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .7; } }
@keyframes mist { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
.sky .sun {
  position: absolute; top: -40px; right: 3%; width: 150px; height: 150px; border-radius: 50%; opacity: .75;
  background: radial-gradient(circle at 35% 35%, rgba(255, 240, 210, .95), rgba(240, 210, 150, .55) 35%, rgba(226, 198, 144, .18) 62%, transparent 72%);
  box-shadow: 0 0 80px 20px rgba(240, 220, 176, .12);
}
.cloud { display: none; }
.mountains { position: fixed; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; opacity: .9; }
.mountains svg { width: 100%; height: 26vh; display: block; }

/* ---------- Header ---------- */
.app-header {
  max-width: 1320px; margin: 0 auto; padding: 26px 20px 8px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.seal {
  width: 62px; height: 62px; flex: none; border-radius: 12px;
  background: linear-gradient(145deg, #e3a588, #b8806a);
  color: #fff4e6; display: grid; place-items: center;
  font-family: var(--font-han); font-size: 26px; line-height: 1; letter-spacing: 2px;
  box-shadow: 0 6px 16px rgba(184, 128, 106, 0.35), inset 0 0 0 3px rgba(255, 240, 220, 0.35);
  writing-mode: vertical-rl;
  transform: rotate(-4deg);
}
.brand h1 {
  font-family: var(--font-title); font-weight: 700; font-size: 38px; margin: 0; line-height: 1.05;
  background: linear-gradient(90deg, #f7efdf, var(--gold) 45%, #f3e3bf);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: .5px;
}
.brand p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.brand p .han { font-family: var(--font-han); color: var(--gold-hi); font-size: 18px; margin-right: 6px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Layout ---------- */
.container { max-width: 1560px; margin: 0 auto; padding: 8px 20px 60px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; grid-template-areas: "nav qc form" "nav res form"; gap: 0 20px; align-items: start; }
.qc-top { grid-area: qc; min-width: 0; margin-bottom: 14px; } .form-panel { grid-area: form; } .result-wrap { grid-area: res; } .nav-col { grid-area: nav; }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "qc" "form" "res"; row-gap: 0; } .form-panel { margin-bottom: 18px; } }

.panel {
  background: var(--card);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
}
.panel::before, .panel::after {
  content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid var(--gold); opacity: .55; pointer-events: none;
}
.panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

.panel-title {
  font-family: var(--font-title); font-weight: 700; font-size: 27px; color: var(--head);
  margin: 0 0 14px; display: flex; align-items: center; gap: 12px; letter-spacing: .3px;
  text-shadow: 0 0 18px rgba(240, 220, 176, .25);
}
.panel-title .han { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 10px;
  background: linear-gradient(145deg, rgba(227, 185, 138,.22), rgba(226, 198, 144,.22)); border: 1px solid var(--line); }
.panel-title .han { font-family: var(--font-han); font-weight: 400; font-size: 22px; color: var(--gold-hi); }
.panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }

/* ---------- Form ---------- */
.form-panel { padding: 22px 20px 20px; position: sticky; top: 14px; }
@media (max-width: 1080px) { .form-panel { position: relative; top: 0; } }
.field { margin-bottom: 13px; }
.field label, .field .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase; }
.row { display: grid; gap: 8px; }
.row.c3 { grid-template-columns: 0.8fr 1.3fr 1.1fr; }
.row.c2 { grid-template-columns: 1fr 1fr; }
input[type=text], input[type=password], input[type=number], input[type=date], select {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--card-solid); border: 1px solid rgba(226, 198, 144, 0.22); border-radius: 12px;
  outline: none; transition: border .2s, box-shadow .2s;
  appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
input:focus, select:focus { border-color: var(--jade); box-shadow: 0 0 0 3px rgba(226, 198, 144, 0.14); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.seg { display: flex; background: var(--jade-mist); border-radius: 12px; padding: 4px; gap: 4px; }
.seg input { display: none; }
.seg label {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--head); margin: 0; text-transform: none; letter-spacing: 0;
  transition: all .2s;
}
.seg input:checked + label { background: var(--surface); color: var(--cinnabar); box-shadow: 0 2px 8px rgba(138, 100, 36, .15); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin: 6px 0; }
.field .check { display: flex; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 400; color: var(--ink); margin: 8px 0 0; }
.check input { width: 17px; height: 17px; accent-color: var(--jade); }

.preview-date {
  font-size: 13.5px; padding: 9px 12px; border-radius: 12px; margin: 4px 0 14px;
  background: linear-gradient(90deg, rgba(227, 185, 138, .14), rgba(226, 198, 144, .14));
  border: 1px dashed rgba(226, 198, 144, .5); color: var(--ink);
  min-height: 38px;
}
.preview-date b { color: var(--head); }

details.adv { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
details.adv summary { cursor: pointer; font-weight: 600; color: var(--jade); list-style: none; font-size: 14px; }
details.adv summary::before { content: '✦ '; color: var(--gold); }
details.adv[open] summary { margin-bottom: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  width: 100%; padding: 14px; font-size: 17px; margin-top: 12px; letter-spacing: .5px;
  color: #fffaf0;
  background: linear-gradient(135deg, #2fd0e6 0%, #13a9c2 50%, #0b7c93 100%);
  box-shadow: 0 8px 20px rgba(138, 100, 36, .35), inset 0 1px 0 rgba(255, 255, 255, .4);
  font-family: var(--font-title); font-size: 21px; font-weight: 700;
}
.btn-primary:hover { box-shadow: 0 10px 26px rgba(138, 100, 36, .45), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn-ghost { background: var(--surface-glass); color: var(--head); border: 1px solid rgba(226, 198, 144, .25); }
.btn-ghost:hover { background: var(--surface); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }

/* ---------- Tabs ---------- */
.result-wrap { min-width: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab {
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14.5px;
  background: var(--surface-glass); border: 1px solid var(--line); color: var(--ink-soft);
  transition: all .2s;
}
.tab:hover { color: var(--head); }
.tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(138, 100, 36, .25); }
.tab-page { display: none; animation: fadeUp .45s ease; }
/* Khi bật chế độ gọn: ẩn các khối cơ sở, tương tác, đặc thù, thần sát */
body.gon-coso .lg-sec.an-mac-dinh { display: none; }
body.gon-coso details.coso-ly-luan { display: none; }   /* chỉ ẩn khung "cơ sở lý luận" – không đụng khung cài đặt, đổi mật khẩu, cặp đôi */
.tab-page.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .sp { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-soft); }
.legend span::before { content: '●'; margin-right: 4px; }
.legend .h-Kim::before { color: var(--kim); } .legend .h-Mộc::before { color: var(--moc); }
.legend .h-Thủy::before { color: var(--thuy); } .legend .h-Hỏa::before { color: var(--hoa); } .legend .h-Thổ::before { color: var(--tho); }

/* ---------- Welcome ---------- */
.welcome { padding: 40px 30px; text-align: center; }
.welcome .taiji { width: 120px; height: 120px; margin: 0 auto 16px; animation: spin 30s linear infinite; }
.welcome h2 { font-family: var(--font-title); font-size: 34px; margin: 6px 0; color: var(--head); }
.welcome p { color: var(--ink-soft); max-width: 620px; margin: 8px auto; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 24px; text-align: left; }
.feature { padding: 14px; border-radius: 14px; background: var(--surface-glass); border: 1px solid var(--line); }
.feature .han { font-family: var(--font-han); font-size: 26px; color: var(--cinnabar); }
.feature b { display: block; color: var(--head); margin: 2px 0; }
.feature small { color: var(--ink-soft); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   LÁ SỐ 12 CUNG
   ================================================================ */
.chart-scroll { overflow-x: auto; padding-bottom: 6px; }
.chart-scroll.co { overflow: hidden; padding-bottom: 0; }
.chart-frame {
  position: relative; min-width: 820px;
  padding: 10px; border-radius: 20px;
  background:
    linear-gradient(var(--card-solid), var(--card-solid)) padding-box,
    linear-gradient(135deg, #e6c878, #d4b07a 30%, #f3e3b8 50%, #d4b07a 70%, #e6c878) border-box;
  border: 3px solid transparent;
  box-shadow: var(--shadow);
}
.chart {
  position: relative;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, minmax(208px, auto));
  gap: 0; border: 1px solid rgba(154, 115, 36, .55);
  background: var(--surface);
}
.chart-lines { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.center > *:not(.chart-lines):not(.bg-han) { position: relative; z-index: 1; }
.chart-lines line { stroke: var(--cinnabar); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .45; }
.chart-lines line.xung { stroke: var(--jade); stroke-dasharray: none; stroke-width: 1.6; }

.cung {
  position: relative; border: 1px solid rgba(154, 115, 36, .35);
  padding: 6px 7px 26px; font-size: 12px; line-height: 1.32; cursor: pointer;
  background: var(--cell);
  transition: background .25s, box-shadow .25s;
  min-width: 0;
}
.cung:hover { background: var(--cell-hover); }
.cung.sel { background: linear-gradient(180deg, #fff9e8, #fbefd0); box-shadow: inset 0 0 0 2px var(--gold); z-index: 2; }
.cung.tamhop { background: var(--cell-hi); box-shadow: inset 0 0 0 1.5px rgba(184, 58, 46, .45); }
.cung.xungchieu { box-shadow: inset 0 0 0 1.5px rgba(226, 198, 144, .55); }
.cung.is-menh { background: var(--cell-menh); }

.c-head { display: flex; align-items: baseline; gap: 4px; justify-content: space-between; border-bottom: 1px dotted rgba(154, 115, 36, .4); padding-bottom: 3px; margin-bottom: 4px; }
.c-canchi { font-size: 11px; font-weight: 600; white-space: nowrap; }
.c-name {
  font-family: var(--font-body); font-weight: 700; font-size: 11.5px; color: var(--head); text-transform: uppercase; letter-spacing: .3px;
  text-align: center; flex: 1; white-space: nowrap;
}
.cung.is-menh .c-name { color: var(--cinnabar); }
.c-than { display: inline-block; font-size: 10px; background: var(--cinnabar); color: #fff; padding: 0 5px; border-radius: 6px; margin-left: 3px; vertical-align: 1px; }
.c-dh { font-weight: 600; font-size: 11.5px; color: var(--ink); }

.c-chinh { text-align: center; min-height: 20px; margin: 4px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.c-chinh .star { display: block; font-family: var(--font-body); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.c-chinh .star small { font-size: inherit; font-weight: inherit; }
.c-chinh .vcd { color: #aa9b7a; font-style: italic; font-weight: 400; font-size: 11.5px; }
.star sup { font-size: 9px; font-weight: 600; margin-left: 1px; opacity: .85; text-transform: none; }
.hoa-tag { display: inline-block; font-size: 9.5px; font-weight: 700; color: #fff; border-radius: 4px; padding: 0 3px; margin-left: 2px; vertical-align: 2px; text-transform: none; font-family: var(--font-body); }
.hoa-Lộc { background: #2d8a4e; } .hoa-Quyền { background: #c8372d; } .hoa-Khoa { background: #1f4f99; } .hoa-Kỵ { background: #333; }

.c-phu { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 6px; }

/* =====================================================================
   GIAO DIỆN TỐI SANG TRỌNG (10/2026 – chủ dự án chọn kiểu Tian Qi; 22/10 đổi màu sang "Bạch Kim")
   Than ấm + bạch kim + sâm panh + vàng hồng; tiêu đề chữ có chân (Cormorant Garamond); khung vuông vức,
   viền vàng mảnh; ảnh nhân vật (ảnh chủ dự án, Anh.html) đặt trong khung vàng như tranh treo.
   Token màu ở :root đầu file; khối này chỉ tinh chỉnh thành phần. Xóa khối = bỏ phần tinh chỉnh.
   ===================================================================== */
:root { --radius: 6px; --shadow: 0 1px 0 rgba(255, 236, 200, .04) inset, 0 10px 28px rgba(0, 0, 0, .5); --vien-kim: rgba(226, 198, 144, .28); }
body { background: var(--paper); }
.sky { background: radial-gradient(1100px 520px at 72% -8%, rgba(226, 198, 144, .16), transparent 62%), radial-gradient(900px 600px at -10% 110%, rgba(227, 165, 136, .10), transparent 60%), linear-gradient(180deg, #110f0c 0%, #161310 55%, #1c1814 100%); }
.sky::before { opacity: .12; }
/* Đầu trang */
.app-header { border-bottom: 1px solid var(--vien-kim); max-width: none; padding-left: max(20px, calc((100vw - 1320px) / 2 + 20px)); padding-right: max(20px, calc((100vw - 1320px) / 2 + 20px)); background: linear-gradient(180deg, rgba(26, 22, 18, .9), rgba(20, 17, 14, .6)); }
.seal { border-radius: 4px; background: linear-gradient(145deg, #e3a588, #b8806a); box-shadow: inset 0 0 0 1px rgba(255, 220, 180, .35), 0 2px 10px rgba(0, 0, 0, .45); }
.brand h1 { font-family: var(--font-title); font-weight: 700; font-size: 30px; letter-spacing: .5px; color: var(--gold-hi); }
.brand p { color: var(--ink-soft); letter-spacing: .4px; }
/* Khung */
.panel { background: linear-gradient(180deg, rgba(38, 33, 28, .96), rgba(29, 25, 21, .96)); border: 1px solid var(--vien-kim); border-radius: var(--radius); box-shadow: var(--shadow); }
.section { padding: 24px 26px; }

.panel-title .han { font-family: var(--font-han); background: none; border: 1px solid var(--vien-kim); border-radius: 3px; color: var(--cinnabar); font-size: 17px; }
.tg-head { border-left: 0; padding: 0 0 8px; border-bottom: 1px solid var(--vien-kim); margin: 34px 0 14px; }
.tg-head span { font-family: var(--font-body); font-size: 11px; letter-spacing: 3px; color: var(--cinnabar); font-weight: 600; }
.tg-head b { font-family: var(--font-title); font-size: 30px; font-weight: 700; color: var(--gold-hi); }

details.chuyen-sau, details.cung-chitiet { border-radius: 3px; border-color: var(--vien-kim); }
/* Nút: chính = vàng kim đặc chữ nâu; phụ = viền vàng */
.btn { border-radius: 4px; }
.btn-primary { background: linear-gradient(180deg, #efe3cc, #d9a98a); color: #1b1712; box-shadow: 0 6px 18px rgba(0, 0, 0, .45), inset 0 1px 0 rgba(255, 245, 220, .45); text-shadow: none; }
.btn-primary:hover { background: linear-gradient(180deg, #f6ecd8, #e3b598); box-shadow: 0 8px 22px rgba(0, 0, 0, .5), inset 0 1px 0 rgba(255, 245, 220, .5); }

input[type=text], input[type=password], input[type=number], input[type=date], input[type=email], input[type=month], select, textarea { border-radius: 4px; background-color: #171410; border-color: var(--vien-kim); color: var(--ink); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(226, 198, 144, .18); }
/* Tab */

body.co-ket-qua.mo-form .form-panel { background: #1b1713; border-left: 1px solid var(--vien-kim); }
/* Điểm, chip, bảng */

table td, table th { border-color: rgba(226, 198, 144, .14); }
/* Lá số giấy ngà trong khung vàng */

@media (max-width: 760px) {

}

/* =====================================================================
   BẠCH KIM – HIỆU ỨNG NỀN + BẢNG ĐIỀU KHIỂN BENTO (22/10/2026, chủ dự án duyệt demo)
   Nền: khối sáng trôi + lưới mờ + hạt sáng (canvas #bkHat). Bảng điều khiển #bdk ở đầu tab Lá số,
   vẽ bởi Script.html › veBangDieuKhien: chân dung số, radar 12 cung, vòng ngũ hành, đồng hồ vượng–nhược,
   9 lĩnh vực, đường vận cả đời, 12 tháng, sự kiện trong năm. Chỉ dùng token --bk-*.
   ===================================================================== */
.bk-nen { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.bk-nen i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .42; animation: bkTroi 18s ease-in-out infinite alternate; }
.bk-nen i.a { width: 620px; height: 620px; left: -180px; top: -160px; background: radial-gradient(circle, #b8806a, transparent 65%); }
.bk-nen i.b { width: 560px; height: 560px; right: -160px; top: 220px; background: radial-gradient(circle, #d9c3a0, transparent 65%); animation-delay: -6s; }
.bk-nen i.c { width: 700px; height: 500px; left: 30%; bottom: -260px; background: radial-gradient(circle, #eef0f2, transparent 65%); opacity: .12; animation-delay: -12s; }
.bk-nen b { position: absolute; inset: 0; opacity: .35; background: linear-gradient(rgba(230, 205, 160, .05) 1px, transparent 1px) 0 0 / 56px 56px, linear-gradient(90deg, rgba(230, 205, 160, .05) 1px, transparent 1px) 0 0 / 56px 56px;
  -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); }
@keyframes bkTroi { to { transform: translate(60px, 40px) scale(1.08); } }
.bk-hat { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.sky .sun, .sky .cloud, .mountains { display: none; }
/* Nút chính: dải bạch kim – sâm panh – vàng hồng chạy nhẹ */
.btn-primary, .res-top .tab.active, .qs-nut .btn-vang { background: var(--bk-grad); background-size: 200% 100%; color: #1b1712; animation: bkChay 6s ease infinite; }
.btn-primary:hover { background: var(--bk-grad); background-size: 200% 100%; filter: brightness(1.06); box-shadow: 0 12px 30px rgba(210, 150, 120, .38); }
@keyframes bkChay { 50% { background-position: 100% 0; } }
.brand h1 { background: var(--bk-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* Bảng điều khiển */
.bdk { --bk-kinh: rgba(34, 30, 27, .55); --bk-vien: rgba(230, 205, 160, .16); --bk-vien2: rgba(240, 215, 175, .32); display: grid; gap: 22px; margin-bottom: 22px; }

.bdk-so { font-family: 'Chakra Petch', var(--font-body); font-variant-numeric: tabular-nums; }
.bdk-nhan { font-family: 'Chakra Petch', var(--font-body); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--bk-sam); }
.bdk-hero { position: relative; display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 36px; align-items: center; padding: 30px 30px 26px; border-radius: 18px; border: 1px solid var(--bk-vien2);
  background: radial-gradient(600px 300px at 85% 0%, rgba(217, 195, 160, .14), transparent 65%), linear-gradient(180deg, var(--bk-kinh), rgba(28, 24, 21, .6)); overflow: hidden; }
.bdk-an { position: relative; width: 200px; aspect-ratio: 1; justify-self: center; display: grid; place-items: center; }
.bdk-an .vong { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from var(--bk-g, 0deg), #f7f5f0, #d9c3a0, #e3a588, #b8806a, #e8cf8f, #f7f5f0); animation: bkXoay 7s linear infinite; }
.bdk-an .vong::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #2a2520, #14110e 72%); }

.bdk-an .quy i { position: absolute; top: -5px; left: 50%; width: 10px; height: 10px; border-radius: 50%; background: var(--bk-sam); box-shadow: 0 0 14px var(--bk-sam); }
.bdk-an .loi { position: relative; text-align: center; }
.bdk-an .loi b { display: block; font-family: var(--font-title); font-size: 64px; line-height: 1; font-weight: 700; background: var(--bk-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bdk-an .loi small { display: block; margin-top: 6px; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-soft); }

@keyframes bkXoay { to { --bk-g: 360deg; } }
@keyframes bkQuay { to { transform: rotate(360deg); } }
.bdk-hero h2 { margin: 8px 0 4px; font-family: var(--font-title); font-weight: 700; font-size: clamp(36px, 4.6vw, 60px); line-height: 1; background: var(--bk-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bdk-mau { font-family: var(--font-title); font-style: italic; font-size: clamp(20px, 2.2vw, 26px); color: var(--ink); }
.bdk-phu { color: var(--ink-soft); margin: 4px 0 0; max-width: 62ch; }
.bdk-sinh { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 13.5px; color: var(--ink-soft); }

.bdk-tru { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; max-width: 520px; }
.bdk-tru > div { padding: 10px 6px 8px; text-align: center; border-radius: 14px; background: var(--bk-kinh); border: 1px solid var(--bk-vien); }
.bdk-tru > div.ngay { border-color: var(--bk-vien2); background: linear-gradient(180deg, rgba(217, 195, 160, .16), rgba(34, 30, 27, .55)); }

.bdk-tru i { font-style: normal; font-size: 11.5px; color: var(--ink-soft); }
.bdk .H-Kim { color: #efe6d6; } .bdk .H-Mộc { color: #7fc79a; } .bdk .H-Thủy { color: #8fb4ff; } .bdk .H-Hỏa { color: #ff9a6b; } .bdk .H-Thổ { color: var(--bk-sam); }
.bdk-dem { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
.bdk-dem > div { padding: 6px 12px; border-left: 1px solid var(--bk-vien2); }
.bdk-dem b { display: block; font-family: 'Chakra Petch', var(--font-body); font-size: 22px; font-weight: 600; line-height: 1.2; background: var(--bk-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.bdk-dem small { display: block; font-size: 12px; color: var(--ink-soft); }
.bdk-nut { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.bdk-nut .btn, .bdk-khoa .btn { width: auto; flex: none; }
.bdk-muc { display: grid; gap: 14px; }
.bdk-dau { display: flex; align-items: end; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; }
.bdk-dau h3 { margin: 2px 0 0; font-family: var(--font-title); font-size: clamp(26px, 3vw, 36px); font-weight: 700; line-height: 1.05; color: var(--head); }
.bdk-dau p { margin: 0; color: var(--ink-soft); max-width: 60ch; font-size: 14px; }
.bdk-bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.bdk-o { position: relative; min-width: 0; padding: 18px 20px; border-radius: 18px; border: 1px solid var(--bk-vien); background: linear-gradient(180deg, var(--bk-kinh), rgba(28, 24, 21, .6)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); overflow: hidden; transition: border-color .3s, transform .3s; }
.bdk-o::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; background: linear-gradient(140deg, rgba(230, 205, 160, .45), transparent 35%, transparent 70%, rgba(227, 165, 136, .35)); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; opacity: .6; }
.bdk-o:hover { border-color: var(--bk-vien2); transform: translateY(-2px); }
.bdk-o h4 { margin: 0; font-family: 'Chakra Petch', var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; color: var(--bk-sam); }
.bdk-o .lon { font-family: var(--font-title); font-size: 24px; font-weight: 700; margin: 2px 0 8px; line-height: 1.15; color: var(--ink); }
.bdk-o svg { display: block; width: 100%; height: auto; }
.bdk-o svg text { font-family: var(--font-body); }
.bdk .s3 { grid-column: span 3; } .bdk .s4 { grid-column: span 4; } .bdk .s5 { grid-column: span 5; } .bdk .s7 { grid-column: span 7; } .bdk .s12 { grid-column: span 12; }
.bdk-ghi { font-size: 12.5px; color: var(--ink-soft); opacity: .85; }
.bdk .tot { color: var(--bk-bac); } .bdk .vua { color: var(--bk-sam); } .bdk .xau { color: var(--bk-xau); }
.bdk-lv { display: grid; gap: 9px; margin-top: 6px; }
.bdk-lv > div { display: grid; grid-template-columns: minmax(0, 170px) minmax(0, 1fr) 46px; gap: 12px; align-items: center; font-size: 13.5px; }
.bdk-ray { position: relative; height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .06); }
.bdk-ray i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: var(--bk-grad); box-shadow: 0 0 14px rgba(217, 195, 160, .45); transition: width 1.4s cubic-bezier(.2, .8, .2, 1); }
.bdk-ray s { position: absolute; top: 50%; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: #fff; opacity: .75; }
.bdk-lv b { text-align: right; font-family: 'Chakra Petch', var(--font-body); font-weight: 600; }
.bdk-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.bdk-mini > div { padding: 11px 13px; border-radius: 14px; background: rgba(230, 205, 160, .05); border: 1px solid var(--bk-vien); }
.bdk-mini small { display: block; font-family: 'Chakra Petch', var(--font-body); font-size: 10.5px; letter-spacing: 1.8px; color: var(--ink-soft); text-transform: uppercase; opacity: .8; }
.bdk-mini b { display: block; font-family: var(--font-title); font-size: 19px; line-height: 1.2; margin-top: 2px; }
.bdk-tc { display: grid; gap: 5px; margin-top: 4px; font-size: 13px; }
.bdk-doi { position: relative; overflow-x: auto; }
.bdk-doi svg { min-width: 720px; touch-action: pan-y; }
.bdk-the { position: absolute; top: 10px; pointer-events: none; min-width: 210px; max-width: 260px; padding: 12px 14px; border-radius: 14px; background: rgba(22, 19, 16, .94); border: 1px solid var(--bk-vien2); box-shadow: 0 14px 40px rgba(0, 0, 0, .5); font-size: 13px; transition: left .12s; }
.bdk-the b { font-family: var(--font-title); font-size: 20px; }
.bdk-cg { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); margin-top: 8px; }
.bdk-cg i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.bdk-khoa { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding: 10px 14px; border-radius: 12px; border: 1px dashed var(--bk-vien2); background: rgba(230, 205, 160, .05); font-size: 13.5px; }
.bdk-sk { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 4px; }
.bdk-sk > div { text-align: center; }
.bdk-sk svg { max-width: 104px; margin: 0 auto; }
.bdk-sk small { display: block; font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; margin-top: 4px; }
@media (max-width: 980px) {
  .bdk .s3, .bdk .s4, .bdk .s5, .bdk .s7 { grid-column: span 12; }
  .bdk-hero { grid-template-columns: 1fr; gap: 22px; padding: 22px 18px; }
  .bdk-an { width: 160px; }
  .bdk-an .loi b { font-size: 50px; }
}
@media (max-width: 620px) {
  .bdk-dem { grid-template-columns: 1fr 1fr; }
  .bdk-tru b { font-size: 21px; }
  .bdk-lv > div { grid-template-columns: minmax(0, 1fr) 40px; } .bdk-ray { grid-column: 1 / -1; order: 3; }
  .bdk-sk { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bdk-o { padding: 16px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  .bk-nen i, .bdk-an .vong, .bdk-an .quy, .btn-primary, .res-top .tab.active { animation: none !important; }
  .bdk-ray i { transition: none; }
}

/* ===================== BÁO CÁO PDF (bc-*) – bản 10/2026 =====================
 * Báo cáo dựng riêng cho khổ A4 (Script.html › xuatPdf, pdfTom…pdfThem). Nền giấy ngà (bc-sang) hoặc than ấm (bc-toi), màu Bạch Kim. */
.bc-root { width: 760px; font-family: "Be Vietnam Pro", system-ui, sans-serif; font-size: 15.5px; line-height: 1.62;
  --bc-nen: #fbf8f2; --bc-chu: #2a2118; --bc-nhat: #7d6c58; --bc-dau: #3a2a1a; --bc-nhan: #9a7a55; --bc-vien: #e7dccb; --bc-the: #fffdf9; --bc-the2: #f4ede1;
  --bc-tot: #4f7a52; --bc-tot-nen: #e7efe4; --bc-xau: #a2583f; --bc-xau-nen: #f6e3dc; --bc-vua: #8a6d48; --bc-vua-nen: #f2eadc; --bc-vang: #b8956a; --bc-soc: #f7f1e7;
  background: var(--bc-nen); color: var(--bc-chu); }
.bc-root.bc-toi { --bc-nen: #181410; --bc-chu: #ece4d6; --bc-nhat: #b3a58f; --bc-dau: #f3e6cc; --bc-nhan: #e3c79a; --bc-vien: #3b3127; --bc-the: #211b15; --bc-the2: #2a221a;
  --bc-tot: #a9c9a3; --bc-tot-nen: #24301f; --bc-xau: #e8a58c; --bc-xau-nen: #3a2219; --bc-vua: #e0c38f; --bc-vua-nen: #2e2619; --bc-vang: #e3b98a; --bc-soc: #1e1913; }
.bc-root .pdf-pg { background: var(--bc-nen); }
.bc-root p, .bc-root li, .bc-root td { color: var(--bc-chu); }
/* Mở đầu chương */
.bc-mo { margin: 0 0 26px; padding: 34px 34px 28px; border-radius: 4px; background: linear-gradient(120deg, #1c1814, #2b231b 55%, #4a3527); color: #f5efe3; position: relative; overflow: hidden; }
.bc-mo::after { content: ""; position: absolute; right: -60px; top: -60px; width: 240px; height: 240px; border-radius: 50%; border: 1px solid rgba(232,207,143,.35); box-shadow: 0 0 0 26px rgba(232,207,143,.05), 0 0 0 60px rgba(232,207,143,.03); }
.bc-mo .bc-so { color: #e8cf8f; }
.bc-mo.nho { margin: 26px 0 14px; padding: 18px 24px 16px; } .bc-mo.nho h1 { font-size: 30px; margin: 4px 0 4px; } .bc-mo.nho p { font-size: 13.5px; }
.bc-mo h1 { font-family: "Cormorant Garamond", serif; font-size: 44px; line-height: 1.05; margin: 8px 0 10px; color: #fff4dc; font-weight: 700; }
.bc-mo p { margin: 0; max-width: 600px; color: #d9cdb8; font-size: 15px; font-style: italic; }
.bc-so { font-size: 12px; letter-spacing: 4px; text-transform: uppercase; font-weight: 700; color: var(--bc-nhan); }
/* Tiêu đề */
.bc-h2 { font-family: "Cormorant Garamond", serif; font-size: 30px; line-height: 1.15; font-weight: 700; color: var(--bc-dau); margin: 30px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--bc-vien); }
.bc-h2 small { font-family: "Be Vietnam Pro", sans-serif; font-size: 13px; font-weight: 500; color: var(--bc-nhat); margin-left: 6px; }
.bc-h3 { font-size: 18px; font-weight: 700; color: var(--bc-dau); margin: 22px 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.bc-h3 small { font-size: 13px; font-weight: 500; }
.bc-doan h4 { font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-nhan); margin: 16px 0 4px; font-weight: 700; }
.bc-tiep { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--bc-nhan); font-weight: 700; margin: 0 0 10px; }
.bc-nhan { font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; color: var(--bc-nhan); margin: 12px 0 2px; }
.bc-nhan.tot { color: var(--bc-tot); } .bc-nhan.xau { color: var(--bc-xau); }
/* Chữ */
.bc-p { margin: 6px 0 10px; }
.bc-nho { font-size: 13.5px; color: var(--bc-nhat) !important; }
.bc-he { font-size: 12px; color: var(--bc-nhat); font-weight: 500; white-space: nowrap; }
.bc-gt { color: var(--bc-dau); font-weight: 700; }
.bc-tot { color: var(--bc-tot); } .bc-xau { color: var(--bc-xau); }
.bc-ul { list-style: none; margin: 6px 0 12px; padding: 0; }
.bc-ul li { position: relative; padding: 3px 0 3px 22px; }
.bc-ul li::before { content: ""; position: absolute; left: 4px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--bc-vang); opacity: .7; }
.bc-ul li.tot::before { background: var(--bc-tot); opacity: 1; } .bc-ul li.xau::before { background: var(--bc-xau); opacity: 1; } .bc-ul li.vua::before { background: var(--bc-vua); opacity: 1; }
.bc-chip { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12.5px; font-weight: 600; background: var(--bc-vua-nen); color: var(--bc-vua); white-space: nowrap; }
.bc-chip.tot { background: var(--bc-tot-nen); color: var(--bc-tot); } .bc-chip.xau { background: var(--bc-xau-nen); color: var(--bc-xau); }
.bc-khoa { margin: 8px 0; padding: 8px 12px; border-radius: 6px; background: var(--bc-the2); color: var(--bc-nhat) !important; font-size: 13.5px; }
/* Khối */
.bc-hop { margin: 12px 0 14px; padding: 14px 18px; border-left: 3px solid var(--bc-vang); background: var(--bc-the2); border-radius: 0 6px 6px 0; }
.bc-hop > b { display: block; font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-nhan); margin-bottom: 2px; }
.bc-hop .bc-p:last-child, .bc-hop .bc-ul:last-child { margin-bottom: 0; }
.bc-mau { margin: 0 0 16px; padding: 22px 24px; border: 1px solid var(--bc-vien); border-radius: 6px; background: var(--bc-the); text-align: center; }
.bc-mau small { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--bc-nhan); font-weight: 700; }
.bc-mau h2 { font-family: "Cormorant Garamond", serif; font-size: 38px; margin: 6px 0 8px; color: var(--bc-dau); line-height: 1.1; }
.bc-mau .bc-p { color: var(--bc-nhat); font-size: 14.5px; }
.bc-o { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 16px; }
.bc-o > div { padding: 12px 14px; border: 1px solid var(--bc-vien); border-radius: 6px; background: var(--bc-the); }
.bc-o small { display: block; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-nhat); font-weight: 600; }
.bc-o b { display: block; font-family: "Cormorant Garamond", serif; font-size: 26px; line-height: 1.15; color: var(--bc-dau); margin-top: 2px; }
.bc-o em { display: block; font-style: normal; font-size: 12.5px; color: var(--bc-nhat); line-height: 1.4; }
.bc-3 { display: grid; grid-template-columns: 1fr; gap: 10px; margin: 10px 0; }
.bc-cot { padding: 12px 16px; border-radius: 6px; background: var(--bc-the); border: 1px solid var(--bc-vien); border-top: 3px solid var(--bc-vang); margin: 0 0 10px; }
.bc-cot.tot { border-top-color: var(--bc-tot); } .bc-cot.xau { border-top-color: var(--bc-xau); } .bc-cot.khoa { border-top-color: var(--bc-nhat); }
.bc-cot > b { display: block; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-dau); }
.bc-cot .bc-ul { margin-bottom: 0; }
.bc-lv, .bc-cung, .bc-dv, .bc-chang { margin: 0 0 8px; padding: 2px 0 8px; border-bottom: 1px dashed var(--bc-vien); }
.bc-dv.nay, .bc-chang.nay { background: var(--bc-the2); border: 1px solid var(--bc-vien); border-radius: 6px; padding: 2px 16px 10px; }
.bc-dv.qua .bc-h3, .bc-chang.qua .bc-h3 { opacity: .75; }
.bc-sk { margin: 8px 0; padding: 10px 14px; border-radius: 6px; background: var(--bc-the); border: 1px solid var(--bc-vien); border-left: 3px solid var(--bc-vua); }
.bc-sk.tot { border-left-color: var(--bc-tot); } .bc-sk.xau { border-left-color: var(--bc-xau); }
.bc-sk .bc-p { margin: 4px 0 0; }
.bc-anh { text-align: center; margin: 0 0 14px; } .bc-anh img { display: inline-block; border-radius: 6px; }
/* Bảng */
.bc-tbl { width: 100%; border-collapse: collapse; margin: 8px 0 16px; font-size: 14px; }
.bc-tbl th { text-align: left; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--bc-nhat); font-weight: 700; padding: 6px 8px; border-bottom: 2px solid var(--bc-vang); }
.bc-tbl td { padding: 7px 8px; border-bottom: 1px solid var(--bc-vien); vertical-align: top; }
.bc-tbl tr:nth-child(even) td { background: var(--bc-soc); }
.bc-tbl.bc-mm td:first-child { width: 170px; } .bc-tbl.bc-mm td:nth-child(2) { width: 120px; }
.bc-tbl.bc-diem-tbl td:nth-child(2) { width: 240px; white-space: nowrap; } .bc-tbl.bc-diem-tbl td:nth-child(3) { width: 110px; color: var(--bc-nhat); }
.bc-tbl.bc-tru td { text-align: center; } .bc-tbl.bc-tru td:first-child { text-align: left; width: 120px; } .bc-tbl.bc-tru .bc-gt { font-family: "Cormorant Garamond", serif; font-size: 22px; }
.bc-tbl.bc-bien td:first-child { width: 80px; } .bc-tbl.bc-bien td:nth-child(2) { width: 90px; } .bc-tbl.bc-bien td:nth-child(3) { width: 110px; }
.bc-tbl.bc-thang td:first-child { width: 70px; } .bc-tbl.bc-thang td:nth-child(2) { width: 120px; white-space: nowrap; } .bc-tbl.bc-thang td:nth-child(3) { width: 120px; }
.bc-thanh { display: inline-block; width: 150px; height: 8px; border-radius: 4px; background: var(--bc-the2); vertical-align: middle; margin-right: 8px; }
.bc-thanh > span { display: block; height: 8px; border-radius: 4px; background: var(--bc-vua); }

/* ===================== TƯ VẤN CHUYÊN GIA 10/2026 (UI, UX, tiếp cận, tăng trưởng) =====================
 * Sửa theo báo cáo của các chuyên gia ui-designer, ux-architect, accessibility-auditor, growth-hacker (22/10).
 * Chỉ chỉnh cỡ chữ, khoảng cách, vùng bấm, độ tương phản trong phạm vi bảng màu Bạch Kim. */
/* Tab là nút bấm thật (bàn phím, trình đọc màn hình) – giữ kiểu chữ cũ */
button.tab { font: inherit; color: inherit; cursor: pointer; }
.tab:focus-visible, .btn:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
/* Viền ô nhập khi đang gõ: rõ ràng (≥ 3:1) */
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 1px; }
input::placeholder, textarea::placeholder { color: #a89a88; opacity: 1; }
/* Nút 3D/2D đang bật: chữ tối trên nền vàng (≈ 11:1) */
.che-do button[aria-pressed="true"] { color: var(--paper); }
/* Nhãn điểm /10: màu của giao diện tối (cũ là màu giao diện sáng, chìm trên nền than) */
.dh-diem { font-size: 14px; }
.dh-diem.tot { color: var(--good-ink); background: rgba(238, 240, 242, .1); }
.dh-diem.vua { color: var(--mid-ink); background: rgba(232, 207, 143, .12); }
.dh-diem.kho { color: var(--bad-ink); background: rgba(228, 138, 138, .12); }
.theme-light .dh-diem.tot, .pdf-root.theme-light .dh-diem.tot { color: #1e6b3b; } .theme-light .dh-diem.vua { color: #8a6414; } .theme-light .dh-diem.kho { color: #9e2b22; }
/* Chữ đọc thoải mái cho người lớn tuổi: cỡ lớn hơn, dòng không quá dài */
.result-wrap .cung-van-de-hieu p, .result-wrap .cung-van-de-hieu li, .result-wrap .dh-panel p, .result-wrap .dh-panel li, .result-wrap .lg-body p, .result-wrap .lg-body li, .result-wrap ul.th-kl > li, .result-wrap .lede { font-size: 16px; line-height: 1.7; }
.result-wrap .cung-van-de-hieu p, .result-wrap .cung-van-de-hieu li, .result-wrap .dh-panel p, .result-wrap .dh-panel li { max-width: 72ch; }
.result-wrap h5, .result-wrap summary, .result-wrap .lg-meta, .result-wrap h4.dd-h { font-size: 14.5px; }
.result-wrap small { font-size: 13px; }
.btn-sm { font-size: 14px; }
.bdk-ghi, .bdk-tru small { opacity: 1; color: var(--ink-soft); font-size: 13px; }
.bdk-nhan, .bdk-o h4 { letter-spacing: 1.5px; }
.tab.tab-vh::after { font-size: 10px; }
/* Vùng bấm tối thiểu 44px trên điện thoại */
@media (max-width: 760px) {
  .btn, .btn-sm, .tab, summary, .che-do button { min-height: 44px; }
  .btn-sm { display: inline-flex; align-items: center; justify-content: center; }
  .chao-x, .cb-x { min-width: 44px; min-height: 44px; }
  input[type="checkbox"] { width: 22px; height: 22px; }
  label.check { min-height: 44px; display: flex; align-items: center; gap: 8px; }
}
/* Thanh tab trên điện thoại: cuộn ngang mượt, mép phải mờ dần báo còn tab, không cắt chữ */
@media (max-width: 1080px) {
  .res-top .tabs { scroll-snap-type: x proximity; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); padding-right: 24px; }
  .res-top .tab { flex: none; scroll-snap-align: center; position: relative; }
  .res-top .tab.tab-vh::after { top: -4px; right: -2px; }
}
/* Thanh mời mua nổi: không lệch mép, không che chữ cuối trang; điện thoại chỉ 2 dòng */
body.co-cta .result-wrap { padding-bottom: 120px; }
/* 25/10: hiệu ứng chung .hien (animation huLen → transform: none) làm mất translate(-50%) – thanh lệch ra mép phải, nút × khuất */
.cta-bar.hien { animation: none; }
/* Chân trang (có dòng lưu ý) không bị thanh mời và hai nút tròn nổi 🔍 ↑ che */

/* Điện thoại: bớt lớp khung lồng nhau để cột chữ rộng hơn */

  .result-wrap .panel { padding-left: 14px; padding-right: 14px; }
  .result-wrap .panel .panel, .result-wrap .panel .cung-van-de-hieu, .result-wrap .panel .lg-block { padding-left: 10px; padding-right: 4px; margin-left: 0; margin-right: 0; }
}

@media (max-width: 640px) { .ho-so-nut { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; } .ho-so-nut .btn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; } }
/* Lời chào chỉ ở tab Lá số – các tab khác vào thẳng nội dung */
body[data-tab]:not([data-tab="chart"]):not([data-tab="tong"]) #chaoBan { display: none; }

/* ================================================================

  --good-bg: rgba(94, 227, 154, .12); --good-ink: #8EF0B8; --bad-bg: rgba(255, 138, 138, .16); --bad-ink: #FFB3B3; --mid-bg: rgba(232, 199, 122, .14); --mid-ink: #FFE6A8;
  --kw: #FFE6A8; --kw-star: #CFF8FF; --kw-good: #8EF0B8; --kw-bad: #FFB3B3;
