<style>
/* ================================================================
   THIÊN CƠ CÁC — phong cách tiên hiệp sáng: ngọc bích, kim sa, mây trắng
   ================================================================ */
/* Bảng màu "Huyền Bí": đêm sâu – kim sa – tinh vân. Mọi màu đi qua token để có thể đổi sang nền sáng (bản in). */
/* Bảng màu "Thanh Thủy": nền cyan – card xanh đen nổi khối – điểm hổ phách. Mọi màu đi qua token để đổi sang nền sáng (bản in). */
:root, .theme-dark {
  --paper: #0b5a69;
  --paper-2: #0d6676;
  --card: rgba(12, 24, 48, 0.94);
  --card-solid: #111d38;
  --surface: #16244a;
  --surface-2: #1b2c55;
  --surface-3: #243866;
  --surface-glass: rgba(255, 255, 255, 0.09);
  --cell: linear-gradient(180deg, #16244a, #111d3b);
  --cell-hover: linear-gradient(180deg, #1d2f5c, #16244a);
  --cell-hi: linear-gradient(180deg, #123f55, #0f2f48);
  --cell-menh: linear-gradient(180deg, #3d3320, #2a2a30);
  --cell-center: radial-gradient(circle at 50% 40%, #1b2f5a, #0e1a36 75%);
  --cover-bg: radial-gradient(900px 600px at 80% 0%, rgba(80, 230, 255, .30), transparent 60%), radial-gradient(700px 500px at 0% 100%, rgba(255, 200, 110, .20), transparent 60%), linear-gradient(180deg, #0f2446, #08172e);
  --ink: #eef8fb;
  --ink-soft: #a9c6d3;
  --head: #8eeefa;
  --accent: #13b5cc;
  --accent-deep: #0b6f86;
  --jade: #5eead4;
  --jade-deep: #8eeefa;
  --jade-mist: rgba(94, 234, 212, 0.12);
  --gold: #f6b64a;
  --gold-hi: #ffd88a;
  --gold-soft: rgba(246, 182, 74, 0.18);
  --gold-deep: #d4912a;
  --cinnabar: #ff7b6b;
  --lavender: #b4c6ff;
  --line: rgba(127, 233, 247, 0.22);
  --shadow: 0 14px 34px rgba(2, 20, 30, 0.45), 0 0 0 1px rgba(127, 233, 247, 0.08);
  --radius: 18px;
  --good-bg: rgba(92, 201, 138, 0.18); --good-ink: #a6f0c4;
  --bad-bg: rgba(255, 110, 96, 0.2); --bad-ink: #ffaca2;
  --mid-bg: rgba(246, 182, 74, 0.15); --mid-ink: #ffd88a;
  --kw: #ffd88a; --kw-star: #a5f3fc; --kw-good: #a6f0c4; --kw-bad: #ffaca2;

  --kim: #c3c9d6;
  --moc: #5cc98a;
  --thuy: #6fb3f5;
  --hoa: #ef6a5c;
  --tho: #e0a44a;

  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-title: 'Cormorant Garamond', 'Noto Serif', Georgia, serif;
  --font-serif: 'Noto Serif', Georgia, serif;
  --font-han: 'Ma Shan Zheng', 'Noto Serif SC', serif;
  color-scheme: dark;
}
/* Nền sáng – bản PDF để in; lá số dùng nền giấy ngà để nổi trên nền cyan */
.theme-light, .chart-frame {
  --paper: #f7fbfc; --paper-2: #eef6f8; --card: #ffffff; --card-solid: #fdfefe;
  --surface: #ffffff; --surface-2: #fbfdfd; --surface-3: #eef6f8; --surface-glass: rgba(255,255,255,.7);
  --cell: linear-gradient(180deg, #fffdf7, #f9f2e1); --cell-hover: linear-gradient(180deg, #fffef9, #f4ead2);
  --cell-hi: linear-gradient(180deg, #f1fbfd, #dff3f7); --cell-menh: linear-gradient(180deg, #fff6e0, #fbe7bb);
  --cell-center: radial-gradient(circle at 50% 40%, #fffdf6, #f3ead4 80%);
  --cover-bg: linear-gradient(180deg, #08172e, #0f2446 55%, #0b5a69);
  --ink: #1d2733; --ink-soft: #52606e; --head: #0b4a5c; --accent: #0e7490; --accent-deep: #0b4a5c;
  --jade: #0e7490; --jade-deep: #0b4a5c; --jade-mist: #e3f4f7;
  --gold: #b7791f; --gold-hi: #8a5a12; --gold-soft: #fbecc8; --gold-deep: #9a6a1c;
  --cinnabar: #b8322b; --lavender: #4054b2; --line: rgba(14, 116, 144, 0.25); --shadow: none;
  --good-bg: #e7f5ec; --good-ink: #1e6b3b; --bad-bg: #fbe9e6; --bad-ink: #9e2b22; --mid-bg: #fbf3dc; --mid-ink: #8a6414;
  --kw: #8a5a12; --kw-star: #0e5f75; --kw-good: #1e6b3b; --kw-bad: #9e2b22;
  --kim: #6d7480; --moc: #2d8a4e; --thuy: #1f4f99; --hoa: #c8372d; --tho: #b0761a;
  color-scheme: light; color: var(--ink);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--paper);
  min-height: 100vh;
  overflow-x: hidden;
  font-size: 15px;
  line-height: 1.55;
}

/* ---------- Bầu trời & mây ---------- */
.sky {
  position: fixed; inset: 0; z-index: -2; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 82% -12%, rgba(80, 230, 255, 0.40), transparent 60%),
    radial-gradient(1000px 620px at 5% 18%, rgba(120, 240, 255, 0.28), transparent 60%),
    radial-gradient(1500px 560px at 50% 118%, rgba(255, 210, 120, 0.42), transparent 62%),
    linear-gradient(180deg, #073642 0%, #0a4f5e 42%, #0c6b7c 78%, #11878f 100%);
}
.sky::before {
  content: ''; position: absolute; inset: 0; background-repeat: repeat;
  background-image:
    radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,.45), transparent 60%),
    radial-gradient(1.5px 1.5px at 200px 150px, rgba(150,240,250,.85), transparent 60%),
    radial-gradient(1px 1px at 260px 40px, rgba(170,200,255,.65), transparent 60%);
  background-size: 300px 220px; opacity: .55;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%); mask-image: linear-gradient(180deg, #000 0%, #000 45%, transparent 80%);
  animation: twinkle 7s ease-in-out infinite alternate;
}
/* màn sương trôi – cảm giác gần mà không chạm tới */
.sky::after {
  content: ''; position: absolute; inset: -10% -20%;
  background:
    radial-gradient(600px 180px at 20% 70%, rgba(255, 255, 255, .10), transparent 70%),
    radial-gradient(700px 200px at 75% 60%, rgba(200, 250, 255, .10), transparent 70%),
    radial-gradient(900px 240px at 50% 88%, rgba(200, 250, 255, .14), transparent 70%);
  filter: blur(8px); animation: mist 60s ease-in-out infinite alternate;
}
@keyframes twinkle { from { opacity: .35; } to { opacity: .7; } }
@keyframes mist { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
.sky .sun {
  position: absolute; top: -40px; right: 3%; width: 150px; height: 150px; border-radius: 50%; opacity: .75;
  background: radial-gradient(circle at 35% 35%, rgba(240, 255, 255, .95), rgba(150, 240, 250, .55) 35%, rgba(80, 230, 255, .18) 62%, transparent 72%);
  box-shadow: 0 0 80px 20px rgba(255, 216, 138, .12);
}
.cloud { display: none; }
.mountains { position: fixed; left: 0; right: 0; bottom: 0; z-index: -1; pointer-events: none; opacity: .9; }
.mountains svg { width: 100%; height: 26vh; display: block; }

/* ---------- Header ---------- */
.app-header {
  max-width: 1320px; margin: 0 auto; padding: 26px 20px 8px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
}
.seal {
  width: 62px; height: 62px; flex: none; border-radius: 12px;
  background: linear-gradient(145deg, #c9463a, #9e2b22);
  color: #fff4e6; display: grid; place-items: center;
  font-family: var(--font-han); font-size: 26px; line-height: 1; letter-spacing: 2px;
  box-shadow: 0 6px 16px rgba(158, 43, 34, 0.35), inset 0 0 0 3px rgba(255, 240, 220, 0.35);
  writing-mode: vertical-rl;
  transform: rotate(-4deg);
}
.brand h1 {
  font-family: var(--font-title); font-weight: 700; font-size: 38px; margin: 0; line-height: 1.05;
  background: linear-gradient(90deg, #fff1c9, var(--gold) 45%, #a5f3fc);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: .5px;
}
.brand p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }
.brand p .han { font-family: var(--font-han); color: var(--gold-hi); font-size: 18px; margin-right: 6px; }
.header-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- Layout ---------- */
.container { max-width: 1560px; margin: 0 auto; padding: 8px 20px 60px; }
.layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 340px; grid-template-areas: "nav qc form" "nav res form"; gap: 0 20px; align-items: start; }
.qc-top { grid-area: qc; min-width: 0; margin-bottom: 14px; } .form-panel { grid-area: form; } .result-wrap { grid-area: res; } .nav-col { grid-area: nav; }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr); grid-template-areas: "qc" "form" "res"; row-gap: 0; } .form-panel { margin-bottom: 18px; } }

.panel {
  background: var(--card);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  position: relative;
}
.panel::before, .panel::after {
  content: ''; position: absolute; width: 22px; height: 22px; border: 2px solid var(--gold); opacity: .55; pointer-events: none;
}
.panel::before { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.panel::after { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }

.panel-title {
  font-family: var(--font-title); font-weight: 700; font-size: 27px; color: var(--head);
  margin: 0 0 14px; display: flex; align-items: center; gap: 12px; letter-spacing: .3px;
  text-shadow: 0 0 18px rgba(255, 216, 138, .25);
}
.panel-title .han { display: inline-grid; place-items: center; min-width: 38px; height: 38px; padding: 0 6px; border-radius: 10px;
  background: linear-gradient(145deg, rgba(246,182,74,.22), rgba(19,181,204,.22)); border: 1px solid var(--line); }
.panel-title .han { font-family: var(--font-han); font-weight: 400; font-size: 22px; color: var(--gold-hi); }
.panel-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold), transparent); }

/* ---------- Form ---------- */
.form-panel { padding: 22px 20px 20px; position: sticky; top: 14px; }
@media (max-width: 1080px) { .form-panel { position: relative; top: 0; } }
.field { margin-bottom: 13px; }
.field label, .field .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); margin-bottom: 5px; letter-spacing: .3px; text-transform: uppercase; }
.row { display: grid; gap: 8px; }
.row.c3 { grid-template-columns: 0.8fr 1.3fr 1.1fr; }
.row.c2 { grid-template-columns: 1fr 1fr; }
input[type=text], input[type=password], input[type=number], input[type=date], select {
  width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
  background: var(--card-solid); border: 1px solid rgba(127, 233, 247, 0.22); border-radius: 12px;
  outline: none; transition: border .2s, box-shadow .2s;
  appearance: none; -webkit-appearance: none;
}
select { background-image: linear-gradient(45deg, transparent 50%, var(--accent) 50%), linear-gradient(135deg, var(--accent) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 26px; }
input:focus, select:focus { border-color: var(--jade); box-shadow: 0 0 0 3px rgba(127, 233, 247, 0.14); }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.seg { display: flex; background: var(--jade-mist); border-radius: 12px; padding: 4px; gap: 4px; }
.seg input { display: none; }
.seg label {
  flex: 1; text-align: center; padding: 8px 6px; border-radius: 9px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: var(--head); margin: 0; text-transform: none; letter-spacing: 0;
  transition: all .2s;
}
.seg input:checked + label { background: var(--surface); color: var(--cinnabar); box-shadow: 0 2px 8px rgba(11, 111, 134, .15); }

.check { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; margin: 6px 0; }
.field .check { display: flex; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 400; color: var(--ink); margin: 8px 0 0; }
.check input { width: 17px; height: 17px; accent-color: var(--jade); }

.preview-date {
  font-size: 13.5px; padding: 9px 12px; border-radius: 12px; margin: 4px 0 14px;
  background: linear-gradient(90deg, rgba(246, 182, 74, .14), rgba(19, 181, 204, .14));
  border: 1px dashed rgba(200, 155, 60, .5); color: var(--ink);
  min-height: 38px;
}
.preview-date b { color: var(--head); }

details.adv { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
details.adv summary { cursor: pointer; font-weight: 600; color: var(--jade); list-style: none; font-size: 14px; }
details.adv summary::before { content: '✦ '; color: var(--gold); }
details.adv[open] summary { margin-bottom: 10px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 10px 16px; cursor: pointer;
  transition: transform .15s, box-shadow .2s, background .2s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  width: 100%; padding: 14px; font-size: 17px; margin-top: 12px; letter-spacing: .5px;
  color: #fffaf0;
  background: linear-gradient(135deg, #2fd0e6 0%, #13a9c2 50%, #0b7c93 100%);
  box-shadow: 0 8px 20px rgba(11, 111, 134, .35), inset 0 1px 0 rgba(255, 255, 255, .4);
  font-family: var(--font-title); font-size: 21px; font-weight: 700;
}
.btn-primary:hover { box-shadow: 0 10px 26px rgba(11, 111, 134, .45), inset 0 1px 0 rgba(255, 255, 255, .4); }
.btn-ghost { background: var(--surface-glass); color: var(--head); border: 1px solid rgba(127, 233, 247, .25); }
.btn-ghost:hover { background: var(--surface); }
.btn-sm { padding: 6px 11px; font-size: 13px; border-radius: 10px; }

/* ---------- Tabs ---------- */
.result-wrap { min-width: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tab {
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14.5px;
  background: var(--surface-glass); border: 1px solid var(--line); color: var(--ink-soft);
  transition: all .2s;
}
.tab:hover { color: var(--head); }
.tab.active { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; border-color: transparent; box-shadow: 0 6px 14px rgba(11, 111, 134, .25); }
.tab-page { display: none; animation: fadeUp .45s ease; }
/* Khi bật chế độ gọn: ẩn các khối cơ sở, tương tác, đặc thù, thần sát */
body.gon-coso .lg-sec.an-mac-dinh { display: none; }
body.gon-coso details.coso-ly-luan { display: none; }   /* chỉ ẩn khung "cơ sở lý luận" – không đụng khung cài đặt, đổi mật khẩu, cặp đôi */
.tab-page.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.toolbar .sp { flex: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--ink-soft); }
.legend span::before { content: '●'; margin-right: 4px; }
.legend .h-Kim::before { color: var(--kim); } .legend .h-Mộc::before { color: var(--moc); }
.legend .h-Thủy::before { color: var(--thuy); } .legend .h-Hỏa::before { color: var(--hoa); } .legend .h-Thổ::before { color: var(--tho); }

/* ---------- Welcome ---------- */
.welcome { padding: 40px 30px; text-align: center; }
.welcome .taiji { width: 120px; height: 120px; margin: 0 auto 16px; animation: spin 30s linear infinite; }
.welcome h2 { font-family: var(--font-title); font-size: 34px; margin: 6px 0; color: var(--head); }
.welcome p { color: var(--ink-soft); max-width: 620px; margin: 8px auto; }
.features { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 24px; text-align: left; }
.feature { padding: 14px; border-radius: 14px; background: var(--surface-glass); border: 1px solid var(--line); }
.feature .han { font-family: var(--font-han); font-size: 26px; color: var(--cinnabar); }
.feature b { display: block; color: var(--head); margin: 2px 0; }
.feature small { color: var(--ink-soft); }
@keyframes spin { to { transform: rotate(360deg); } }

/* ================================================================
   LÁ SỐ 12 CUNG
   ================================================================ */
.chart-scroll { overflow-x: auto; padding-bottom: 6px; }
.chart-scroll.co { overflow: hidden; padding-bottom: 0; }
.chart-frame {
  position: relative; min-width: 820px;
  padding: 10px; border-radius: 20px;
  background:
    linear-gradient(var(--card-solid), var(--card-solid)) padding-box,
    linear-gradient(135deg, #e6c878, #c89b3c 30%, #f3e3b8 50%, #c89b3c 70%, #e6c878) border-box;
  border: 3px solid transparent;
  box-shadow: var(--shadow);
}
.chart {
  position: relative;
  display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, minmax(208px, auto));
  gap: 0; border: 1px solid rgba(154, 115, 36, .55);
  background: var(--surface);
}
.chart-lines { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.center > *:not(.chart-lines):not(.bg-han) { position: relative; z-index: 1; }
.chart-lines line { stroke: var(--cinnabar); stroke-width: 1.4; stroke-dasharray: 5 4; opacity: .45; }
.chart-lines line.xung { stroke: var(--jade); stroke-dasharray: none; stroke-width: 1.6; }

.cung {
  position: relative; border: 1px solid rgba(154, 115, 36, .35);
  padding: 6px 7px 26px; font-size: 12px; line-height: 1.32; cursor: pointer;
  background: var(--cell);
  transition: background .25s, box-shadow .25s;
  min-width: 0;
}
.cung:hover { background: var(--cell-hover); }
.cung.sel { background: linear-gradient(180deg, #fff9e8, #fbefd0); box-shadow: inset 0 0 0 2px var(--gold); z-index: 2; }
.cung.tamhop { background: var(--cell-hi); box-shadow: inset 0 0 0 1.5px rgba(184, 58, 46, .45); }
.cung.xungchieu { box-shadow: inset 0 0 0 1.5px rgba(127, 233, 247, .55); }
.cung.is-menh { background: var(--cell-menh); }

.c-head { display: flex; align-items: baseline; gap: 4px; justify-content: space-between; border-bottom: 1px dotted rgba(154, 115, 36, .4); padding-bottom: 3px; margin-bottom: 4px; }
.c-canchi { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
.c-name {
  font-family: var(--font-serif); font-weight: 700; font-size: 12.5px; color: var(--head); text-transform: uppercase; letter-spacing: .4px;
  text-align: center; flex: 1; white-space: nowrap;
}
.cung.is-menh .c-name { color: var(--cinnabar); }
.c-than { display: inline-block; font-size: 10px; background: var(--cinnabar); color: #fff; padding: 0 5px; border-radius: 6px; margin-left: 3px; vertical-align: 1px; }
.c-dh { font-weight: 700; font-size: 12px; color: var(--gold-hi); }

.c-chinh { text-align: center; min-height: 20px; margin: 2px 0 4px; }
.c-chinh .star { display: inline-block; font-family: var(--font-serif); font-weight: 700; font-size: 13.5px; margin: 0 3px; white-space: nowrap; text-transform: uppercase; }
.c-chinh .vcd { color: #aa9b7a; font-style: italic; font-weight: 400; font-size: 11.5px; }
.star sup { font-size: 9px; font-weight: 600; margin-left: 1px; opacity: .85; text-transform: none; }
.hoa-tag { display: inline-block; font-size: 9.5px; font-weight: 700; color: #fff; border-radius: 4px; padding: 0 3px; margin-left: 2px; vertical-align: 2px; text-transform: none; font-family: var(--font-body); }
.hoa-Lộc { background: #2d8a4e; } .hoa-Quyền { background: #c8372d; } .hoa-Khoa { background: #1f4f99; } .hoa-Kỵ { background: #333; }

.c-phu { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; }
.c-phu .col div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11.5px; }
.c-phu .hung { text-align: right; }
.c-phu .hung div { font-style: normal; }
.c-luu { margin-top: 3px; font-size: 10.5px; font-style: italic; color: var(--lavender); line-height: 1.25; }
.c-luu span { display: inline-block; margin-right: 4px; }
.hide-luu .c-luu { display: none; }
.hide-minor .minor { display: none; }

.c-foot {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 6px;
  display: flex; justify-content: space-between; gap: 4px;
  font-size: 10.5px; color: var(--ink-soft);
  border-top: 1px dotted rgba(154, 115, 36, .35);
  background: rgba(14, 116, 144, .07);
}
.c-foot .ts { color: var(--head); font-weight: 600; }
.c-phu .vg { font-size: 11px; opacity: .92; }
.c-foot .th { color: var(--gold-hi); font-weight: 600; }

/* ---------- Chân dung hé lộ ---------- */

  background: radial-gradient(700px 360px at 90% -10%, rgba(19,181,204,.35), transparent 60%), radial-gradient(500px 300px at 0% 110%, rgba(246,182,74,.18), transparent 60%), var(--card); }
.rv-eyebrow { color: var(--gold-hi); font-size: 12px; letter-spacing: 2.5px; text-transform: uppercase; font-weight: 700; }
.rv-title { font-family: var(--font-title); font-size: 44px; line-height: 1.05; margin: 8px 0 8px;
  background: linear-gradient(90deg, #fff1c9, var(--gold) 50%, #a5f3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
.theme-light .rv-title { background: none; color: var(--head); -webkit-background-clip: initial; }
.rv-sub { font-size: 16px; color: var(--ink); max-width: 820px; margin: 0 0 16px; }
.stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 8px 0 16px; }

.stat { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: linear-gradient(160deg, rgba(246,182,74,.12), rgba(19,181,204,.10)); }
.stat small { display: block; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-soft); }
.stat b { display: block; font-family: var(--font-title); font-size: 28px; color: var(--head); line-height: 1.15; margin: 2px 0; }
.stat span { font-size: 12px; color: var(--ink-soft); }
.rv-cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 900px) { .rv-cols { grid-template-columns: 1fr; } }
.rv-col { border-radius: 14px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface-2); }
.rv-col h4 { margin: 0 0 6px; font-family: var(--font-serif); font-size: 16px; }
.rv-col.good h4 { color: var(--good-ink); } .rv-col.warn h4 { color: var(--bad-ink); } .rv-col.act h4 { color: var(--gold-hi); }
.rv-col.good { border-top: 3px solid #1fa688; } .rv-col.warn { border-top: 3px solid #d9503f; } .rv-col.act { border-top: 3px solid #b08a2c; }
.rv-time { font-size: 14px; color: var(--ink); margin: 6px 0 0; }

/* ---------- Quẻ Hà Lạc ---------- */
.que-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 10px; }
@media (max-width: 900px) { .que-row { grid-template-columns: 1fr 1fr; } }
.que-card { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }

.que-card em { font-style: normal; font-size: 12.5px; color: var(--ink-soft); }

.hl-tbl td { vertical-align: top; }
.sys.s-hl { background: #3f6fd8; }

/* ---------- Bản xem thử ---------- */
.demo-card { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 0 0 14px; }
.demo-lo, .demo-an { border-radius: 16px; padding: 16px 18px; border: 1px solid var(--line); }
.demo-lo { background: linear-gradient(160deg, rgba(246,182,74,.18), rgba(19,181,204,.12)); }
.demo-an { background: repeating-linear-gradient(135deg, rgba(255,255,255,.03) 0 10px, rgba(255,255,255,.06) 10px 20px), var(--surface-2); }
.demo-lo h4, .demo-an h4 { margin: 0 0 8px; font-family: var(--font-serif); font-size: 18px; color: var(--head); }
.demo-lo li, .demo-an li { font-size: 15px; line-height: 1.6; margin: 5px 0; }
.demo-an li { color: var(--ink-soft); }

.demo-prev img { display: block; width: 100%; }

.pc-demo { display: inline-block; margin-left: 12px; background: #ff8a78; color: #fff; font-size: 12px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
.demo-offer { margin: 18px 0; padding: 16px 18px; border-radius: 14px; background: linear-gradient(90deg, #ffd88a, #f6b64a); color: #1c1a33; font-weight: 800; font-size: 18px; text-align: center; }
.demo-cta h2 { font-size: 34px !important; }

@media print {
  .sky, .mountains, .form-panel, .tabs, .toolbar, .app-header .header-actions, .footer, .palace-detail { display: none !important; }
  .layout { grid-template-columns: 1fr; }
  .panel { box-shadow: none; backdrop-filter: none; }
  .tab-page { display: block !important; }
  body { background: var(--surface); }
  .chart-frame { min-width: 0; }
}

@media (max-width: 640px) { .ht-grid { grid-template-columns: 1fr; } .tg-head b { font-size: 24px; } .mm-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 400px) { .mm-grid { grid-template-columns: 1fr; } }

@media (max-width: 640px) { .qr-wrap { grid-template-columns: 1fr; justify-items: center; } .qr-img { width: 200px; } }

/* ---------- Khung chào mừng có ảnh quảng bá ---------- */
.wl-hero { display: grid; grid-template-columns: minmax(220px, 340px) 1fr; gap: 26px; align-items: center; text-align: left; margin-bottom: 22px; }

.wl-anh { padding: 0; border: 1px solid var(--gold); border-radius: 18px; overflow: hidden; background: #0b2a36; cursor: pointer; box-shadow: 0 18px 40px rgba(2, 20, 30, .45); transition: transform .25s; }

@media (max-width: 760px) { .wl-hero { grid-template-columns: 1fr; text-align: left; } .wl-anh { max-width: 380px; margin: 0 auto; } .welcome .wl-nd h2 { font-size: 28px; } .welcome .wl-go { width: 100%; } }
.cta-anh { float: right; width: 240px; margin: 0 0 12px 18px; border-radius: 14px; border: 1px solid var(--gold); }
/* ---------- Cuộn riêng từng cột, thanh tab dính, mục lục ---------- */

.result-wrap [id], .result-wrap .panel, .result-wrap details, .result-wrap .tg-head { scroll-margin-top: calc(var(--top-h) + 14px); }
.res-top { position: sticky; top: 0; z-index: 40; display: flex; align-items: flex-start; gap: 8px; margin: 0 -6px 14px; padding: 8px 6px;
  background: linear-gradient(180deg, rgba(8, 23, 46, .96), rgba(8, 23, 46, .88)); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-radius: 0 0 16px 16px; }

.toc-mua { margin-top: 12px; padding: 12px; border-radius: 12px; border: 1px solid var(--gold-deep); background: linear-gradient(160deg, rgba(246, 182, 74, .16), rgba(19, 181, 204, .08)); font-size: 13px; }

}

/* Thanh tiến độ đọc, nút lên đầu, thanh mở khóa dính */
