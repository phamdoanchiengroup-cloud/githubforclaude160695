<style>
/* ================= HIỆU ỨNG ĐỢT 2 (demo): BXH & ghi bàn · chuyển tab & cuộn · tốc độ chậm ================= */
@keyframes fx2-hang{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes fx2-phai{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes fx2-bat{0%{opacity:0;transform:scale(.3)}70%{opacity:1;transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes fx2-thanh{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fx2-len{from{opacity:0;transform:perspective(1100px) translateY(34px) rotateX(9deg)}to{opacity:1;transform:none}}
@keyframes fx2-quet{0%{transform:translateX(-120%) skewX(-18deg);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(120vw) skewX(-18deg);opacity:0}}
@keyframes fx2-ke{0%{transform:scaleX(0);opacity:1}70%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:.35}}

/* BXH: thanh từng đội trượt vào lần lượt, vệt sáng vàng quét qua cả bảng */
html.fx2-bxh .tv-bxh.fx2-chay .tv-hang{animation:fx2-hang .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*110ms)}
html.fx2-bxh .tv-bxh{position:relative}
.fx2-loe{position:absolute;pointer-events:none;z-index:4;overflow:hidden}
.fx2-loe::after{content:'';position:absolute;top:0;bottom:0;left:0;width:28%;mix-blend-mode:screen;
  background:linear-gradient(100deg,transparent,rgba(255,214,102,.14) 35%,rgba(255,240,200,.32) 50%,rgba(255,214,102,.14) 65%,transparent);
  transform:translateX(-110%) skewX(-16deg);animation:fx2-loeChay 1.6s cubic-bezier(.45,0,.2,1) .5s forwards}
@keyframes fx2-loeChay{to{transform:translateX(420%) skewX(-16deg)}}
/* Ghi bàn: dòng trượt từ phải + thanh vàng tỉ lệ số bàn */
html.fx2-bxh .ds-dong{position:relative;overflow:hidden;isolation:isolate}
html.fx2-bxh .ds-gon.fx2-chay .ds-dong{animation:fx2-phai .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*90ms + .2s)}
html.fx2-bxh .fx2-thanh{position:absolute;left:0;top:0;bottom:0;width:var(--w,0%);z-index:-1;transform-origin:left;
  background:linear-gradient(90deg,rgba(246,196,83,0),rgba(246,196,83,.10) 60%,rgba(255,214,102,.26));
  -webkit-mask:linear-gradient(90deg,#000 85%,transparent);mask:linear-gradient(90deg,#000 85%,transparent)}
html.fx2-bxh .ds-gon.fx2-chay .fx2-thanh{animation:fx2-thanh 1.2s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*90ms + .55s)}

/* Chuyển tab: thanh vàng trượt giữa các tab, vệt sáng quét ngang, khối nội dung nổi lên lần lượt */
html.fx2-tab nav.tabs{position:relative}
html.fx2-tab nav.tabs button.on{background:transparent !important;box-shadow:none !important}
html.fx2-tab .fx2-gach{position:absolute;z-index:0;border-radius:10px;pointer-events:none;background:var(--kim-loai);
  box-shadow:0 0 22px rgba(255,159,46,.45);transition:left .55s cubic-bezier(.65,0,.35,1),width .55s cubic-bezier(.65,0,.35,1),top .3s}
html.fx2-tab nav.tabs button{z-index:1}
.fx2-quet{position:fixed;top:0;bottom:0;left:0;width:34vw;z-index:60;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(90deg,transparent,rgba(255,214,102,.10) 30%,rgba(255,236,190,.26) 50%,rgba(255,214,102,.10) 70%,transparent);
  animation:fx2-quet 1.1s cubic-bezier(.45,0,.2,1) forwards}
html.fx2-tab .fx2-len{animation:fx2-len .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*90ms + .15s)}
/* Cuộn trang: khối ngoài màn hình chờ sẵn, cuộn tới thì nổi lên + kẻ viền vàng */
html.fx2-tab .fx2-cho{opacity:0;transform:perspective(1100px) translateY(48px) rotateX(10deg)}
html.fx2-tab .fx2-hien{opacity:1;transform:none;transition:opacity .8s ease-out,transform 1s cubic-bezier(.22,1,.36,1)}
.fx2-ke{position:absolute;left:0;right:0;top:0;height:2px;z-index:3;pointer-events:none;transform-origin:left;
  background:linear-gradient(90deg,transparent,var(--neon) 20%,#fff3c4 50%,var(--neon) 80%,transparent);animation:fx2-ke 1.3s ease-out forwards}

@media (prefers-reduced-motion:reduce){
  .fx2-quet,.fx2-ke{display:none}
  html.fx2-bxh *,html.fx2-tab *{animation-duration:.01s !important;animation-iteration-count:1 !important}
  html.fx2-tab .fx2-cho{opacity:1;transform:none}
}

/* ---- Bảng điều khiển demo ---- */
#fx2Bang{position:fixed;z-index:9999;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:300px;
  font-family:'Be Vietnam Pro',system-ui,sans-serif;color:#f5efe4;background:linear-gradient(160deg,rgba(255,214,140,.12),rgba(9,8,13,.92) 40%),#0b0a0f;
  border:1px solid rgba(246,196,83,.45);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 30px rgba(255,159,46,.15);padding:14px 14px 12px;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
#fx2Bang h4{margin:0 0 10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffd666;display:flex;justify-content:space-between;align-items:center}
#fx2Bang h4 button{background:none;border:0;color:#a89f90;font-size:18px;cursor:pointer;line-height:1}
#fx2Bang .nhom{display:grid;gap:6px;margin-bottom:11px}
#fx2Bang .nhan{font-size:12px;color:#a89f90}
#fx2Bang .doan{display:flex;gap:4px}
#fx2Bang .doan button,#fx2Bang .bat{flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:7px 6px;border:1px solid rgba(246,196,83,.35);background:rgba(255,255,255,.03);color:#f5efe4;cursor:pointer;border-radius:6px}
#fx2Bang .doan button.on,#fx2Bang .bat.on{background:linear-gradient(180deg,#fff3c4,#ffd666 40%,#e8a531);color:#1a1206;border-color:transparent}
#fx2Bang .bat{display:flex;justify-content:space-between;align-items:center;text-align:left}
#fx2Bang .bat i{font-style:normal;font-size:11px;opacity:.8}
#fx2Bang .lai{width:100%;font:inherit;font-weight:700;font-size:13px;padding:9px;border:0;cursor:pointer;color:#1a1206;background:linear-gradient(180deg,#fff3c4,#ffd666 40%,#e8a531);border-radius:6px}
#fx2Bang .ghi{font-size:11px;color:#a89f90;margin:8px 0 0;line-height:1.45}
#fx2Bang button:focus-visible{outline:2px solid #ffd666;outline-offset:2px}
#fx2Bang.gon .than{display:none}
</style>
<div id="fx2Bang">
  <h4><span>✦ Demo hiệu ứng</span><button type="button" id="fx2Gon" aria-label="Thu gọn">–</button></h4>
  <div class="than">
    <div class="nhom"><span class="nhan">Tốc độ hiệu ứng đang có (đèn, viền, hạt vàng, thẻ…)</span>
      <div class="doan" id="fx2Toc"><button type="button" data-r="1">Như cũ</button><button type="button" data-r="0.55">Chậm</button><button type="button" data-r="0.35">Rất chậm</button></div></div>
    <div class="nhom"><span class="nhan">Hiệu ứng mới</span>
      <button type="button" class="bat" data-k="fx2-bxh">Bảng xếp hạng & ghi bàn <i></i></button>
      <button type="button" class="bat" data-k="fx2-tab">Chuyển tab & cuộn trang <i></i></button></div>
    <button type="button" class="lai" id="fx2Lai">↻ Phát lại hiệu ứng</button>
    <p class="ghi">Thử: bấm qua lại các tab, cuộn xuống bảng xếp hạng. Bấm “Phát lại” để xem lại từ đầu.</p>
  </div>
</div>
<script>
/* ===== Hiệu ứng đợt 2 ===== */
var FX_TOC = 0.55;   // tốc độ hiệu ứng có sẵn: 1 = như cũ, nhỏ hơn = chậm hơn
var FX2_TAB_TRUOC = null, FX2_GACH = null;
/* Áp tốc độ cho mọi hiệu ứng CSS có sẵn (không đụng hiệu ứng mới fx2-) */
function fx2Toc_(){
  if(!document.getAnimations) return;
  document.getAnimations().forEach(function(a){
    if(typeof CSSAnimation!=='undefined' && a instanceof CSSAnimation && String(a.animationName).indexOf('fx2-')!==0 && a.playbackRate!==FX_TOC) a.playbackRate=FX_TOC;
  });
}
document.addEventListener('animationstart', fx2Toc_, true);
setInterval(fx2Toc_, 400);
/* Số chạy từ 0 lên */
function fx2Dem_(el, tre){
  if(FX_GIAM) return;
  var goc=el.textContent, phan=goc.match(/-?\d+/g); if(!phan) return;
  var nut=el.firstChild && el.firstChild.nodeType===3 ? el.firstChild : null;
  if(!nut){ for(var k=0;k<el.childNodes.length;k++) if(el.childNodes[k].nodeType===3 && /\d/.test(el.childNodes[k].nodeValue)){ nut=el.childNodes[k]; break; } }
  if(!nut) return;
  var mau=nut.nodeValue, t0=null, dai=1300;
  function buoc(t){
    if(t0===null) t0=t; var x=Math.min(1,(t-t0)/dai), e=1-Math.pow(1-x,3);
    nut.nodeValue=mau.replace(/-?\d+/g,function(s){ var v=Number(s); return String(Math.round(v*e)); });
    if(x<1) requestAnimationFrame(buoc); else nut.nodeValue=mau;
  }
  nut.nodeValue=mau.replace(/-?\d+/g,'0');
  setTimeout(function(){ requestAnimationFrame(buoc); }, tre||0);
}
function fx2Bxh_(goc){
  var on=document.documentElement.classList.contains('fx2-bxh');
  if(on) goc.querySelectorAll('.tv-bxh').forEach(function(tb){
    fx2KhiThay_(tb,function(){
      tb.classList.add('fx2-chay');
      tb.querySelectorAll('.tv-hang').forEach(function(r,i){ var d=r.querySelector('.tv-diem b'); if(d) fx2Dem_(d, i*110+300); });
      var card=tb.closest('.card'); if(card && !FX_GIAM){
        var l=document.createElement('div'); l.className='fx2-loe'; l.style.left=tb.offsetLeft+'px'; l.style.top=tb.offsetTop+'px'; l.style.width=tb.offsetWidth+'px'; l.style.height=tb.offsetHeight+'px';
        card.appendChild(l); setTimeout(function(){ l.remove(); },2600); }
    });
  });
  goc.querySelectorAll('.ds-gon').forEach(function(box){
    var dong=box.querySelectorAll('.ds-dong'), max=0;
    dong.forEach(function(d){ var n=Number((d.querySelector('.ds-so')||{}).textContent)||0; if(n>max) max=n; });
    dong.forEach(function(d,i){
      d.style.setProperty('--i',i);
      if(on && !d.querySelector('.fx2-thanh')){ var n=Number((d.querySelector('.ds-so')||{}).textContent)||0; d.insertAdjacentHTML('afterbegin','<span class="fx2-thanh" style="--w:'+(max?Math.round(n/max*100):0)+'%"></span>'); }
    });
    if(!on) return;
    fx2KhiThay_(box,function(){
      box.classList.add('fx2-chay');
      dong.forEach(function(d,i){ var s=d.querySelector('.ds-so'); if(s) fx2Dem_(s, i*90+400); });
      var so=box.querySelector('.gbd-so'); if(so) fx2Dem_(so, 900);
    });
  });
  if(on) goc.querySelectorAll('.home-solieu .stat .n').forEach(function(n,i){ fx2KhiThay_(n,function(){ fx2Dem_(n, i*120); }); });
}
/* Chạy hàm khi phần tử lọt vào màn hình (một lần) */
function fx2KhiThay_(el, f){
  if(!('IntersectionObserver' in window)){ f(); return; }
  var io=new IntersectionObserver(function(es){ if(es[0].isIntersecting){ io.disconnect(); f(); } },{threshold:.25});
  io.observe(el);
}
function fx2Tab_(doiTab){
  if(!document.documentElement.classList.contains('fx2-tab')) return;
  var nav=document.getElementById('tabs'), on=nav && nav.querySelector('button.on');
  if(nav && on){
    var g=document.createElement('span'); g.className='fx2-gach'; nav.insertBefore(g, nav.firstChild);
    var dat=function(r){ g.style.left=r.l+'px'; g.style.top=r.t+'px'; g.style.width=r.w+'px'; g.style.height=r.h+'px'; };
    var moi={l:on.offsetLeft,t:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight};
    if(FX2_GACH && doiTab){ g.style.transition='none'; dat(FX2_GACH); g.offsetWidth; g.style.transition=''; }
    dat(moi); FX2_GACH=moi;
  }
  if(FX_GIAM) return;
  var view=document.getElementById('view'); if(!view) return;
  var khoi=view.querySelectorAll('.card,.banner-left,.team-logo-row');
  var cao=window.innerHeight, i=0;
  khoi.forEach(function(k){
    if(k.parentNode.closest && k.parentNode.closest('.card')) return;
    var r=k.getBoundingClientRect();
    if(r.top < cao){
      if(doiTab){ k.style.setProperty('--i',i++); k.classList.add('fx2-len'); }
    } else {
      k.classList.add('fx2-cho');
      fx2KhiThay_(k,function(){ k.classList.add('fx2-hien'); k.classList.remove('fx2-cho');
        if(getComputedStyle(k).position==='static') k.style.position='relative';
        var ke=document.createElement('span'); ke.className='fx2-ke'; k.appendChild(ke); });
    }
  });
  if(doiTab){ var q=document.createElement('div'); q.className='fx2-quet'; document.body.appendChild(q); setTimeout(function(){ q.remove(); },1200); }
}
(function(){
  var goc=renderView;
  renderView=function(){
    goc.apply(this, arguments);
    var doiTab = FX2_TAB_TRUOC!==null && FX2_TAB_TRUOC!==STATE.tab;
    FX2_TAB_TRUOC = STATE.tab;
    try{ fx2Bxh_(document.getElementById('view')); }catch(e){}
    try{ fx2Tab_(doiTab); }catch(e){}
  };
})();
/* Bảng điều khiển demo */
(function(){
  var html=document.documentElement;
  html.classList.add('fx2-bxh','fx2-tab');
  var toc=document.getElementById('fx2Toc');
  function veToc(){ toc.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', Number(b.dataset.r)===FX_TOC); }); }
  toc.onclick=function(e){ var b=e.target.closest('button'); if(!b) return; FX_TOC=Number(b.dataset.r); veToc(); fx2Toc_(); };
  veToc();
  document.querySelectorAll('#fx2Bang .bat').forEach(function(b){
    function ve(){ var on=html.classList.contains(b.dataset.k); b.classList.toggle('on',on); b.querySelector('i').textContent=on?'BẬT':'TẮT'; }
    b.onclick=function(){ html.classList.toggle(b.dataset.k); ve(); FX2_TAB_TRUOC=null; render(); };
    ve();
  });
  document.getElementById('fx2Lai').onclick=function(){ window.scrollTo(0,0); FX2_TAB_TRUOC='~'; FX2_GACH=null; render(); };
  document.getElementById('fx2Gon').onclick=function(){ var p=document.getElementById('fx2Bang'); p.classList.toggle('gon'); this.textContent=p.classList.contains('gon')?'+':'–'; };
})();
</script>
