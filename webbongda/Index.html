<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<!-- Ép điện thoại dựng layout 980px (giống "xem bản máy tính") → mọi thứ hiển thị như bản máy tính.
     Muốn quay lại bản mobile riêng: đổi về content="width=device-width, initial-scale=1" -->
<meta name="viewport" content="width=980">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700;800&family=Oswald:wght@300;400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,700;0,800;1,700;1,800&family=Chakra+Petch:wght@500;600;700&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<!-- Giao diện (CSS) nằm ở web/app.css, tải qua jsDelivr – xem tools/dong-goi.py -->
<!-- TAI-NGUYEN-CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/phamdoanchiengroup-cloud/githubforclaude160695@e674da96744d94306879c2ae34a6cfe2d0669a28/webbongda/web/app.min.css" onerror="this.onerror=null;this.href='https://fastly.jsdelivr.net/gh/phamdoanchiengroup-cloud/githubforclaude160695@e674da96744d94306879c2ae34a6cfe2d0669a28/webbongda/web/app.min.css'">
<!-- /TAI-NGUYEN-CSS -->
</head>
<body>
<header>
  <div class="row">
    <div class="brand">
      <div class="logo">⚽</div>
      <div style="min-width:0">
        <h1 id="tenGiai">Giải bóng đá công ty</h1>
        <div class="sub" id="subline">Đang tải…</div>
      </div>
    </div>
    <div id="authBox"></div>
  </div>
</header>

<main>
  <div id="loading" class="loadwrap">
    <div class="spin"></div>
    <div>Đang tải dữ liệu…</div>
  </div>

  <div id="app" style="display:none">
    <div id="hero" class="hero"></div>
    <div id="adminbar"></div>
    <nav class="tabs" id="tabs"></nav>
    <div id="view"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal" id="mLogin">
  <div class="box">
    <h2 style="margin:0 0 8px;font-size:22px;font-family:'Oswald';letter-spacing:1px;color:var(--neon)">🔐 ĐĂNG NHẬP BTC</h2>
    <p class="muted" style="margin-bottom:14px">Chỉ BTC cần đăng nhập. Mọi người xem lịch, BXH và đăng ký không cần.</p>
    <label>Mật khẩu</label>
    <input type="password" id="mkAdmin" placeholder="Nhập mật khẩu BTC" onkeydown="if(event.key==='Enter')doLogin()">
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn neon block" onclick="doLogin()" id="btnLogin">Đăng nhập</button>
      <button class="btn outline" onclick="closeModal('mLogin')">Đóng</button>
    </div>
  </div>
</div>

<div class="modal" id="mGeneric"><div class="box" id="mGenericBox"></div></div>

<script>/* Dự phòng: jsDelivr chính lỗi thì tải bản sao từ máy chủ phụ */function taiDuPhong_(u){var x=document.createElement("script");x.src=u;document.body.appendChild(x);}</script>
<!-- Mã xử lý (JS) nằm ở web/app.js, tải qua jsDelivr – xem tools/dong-goi.py -->
<!-- TAI-NGUYEN-JS -->
<script src="https://cdn.jsdelivr.net/gh/phamdoanchiengroup-cloud/githubforclaude160695@e674da96744d94306879c2ae34a6cfe2d0669a28/webbongda/web/app.min.js" onerror="taiDuPhong_('https://fastly.jsdelivr.net/gh/phamdoanchiengroup-cloud/githubforclaude160695@e674da96744d94306879c2ae34a6cfe2d0669a28/webbongda/web/app.min.js')"></script>
<!-- /TAI-NGUYEN-JS -->
</body>
</html>
