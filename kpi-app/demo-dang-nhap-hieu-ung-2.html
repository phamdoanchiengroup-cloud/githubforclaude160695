<title>Màn đăng nhập – hiệu ứng đợt 2</title>
<style>
:root{--nen:#0e1012;--the:#171a1d;--chu:#e9eef0;--phu:#8d989f;--cy:#2fd3c6;--vang:#f7b829}
*{box-sizing:border-box}
body{margin:0;background:var(--nen);color:var(--chu);font:15px/1.55 Inter,system-ui,-apple-system,'Segoe UI',sans-serif}
.vo{max-width:1320px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:22px;margin:0 0 6px}
.mo{color:var(--phu);margin:0 0 14px;max-width:920px}.mo b{color:var(--chu)}
.bang{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px;margin:0 0 12px}
.bang label{display:flex;gap:10px;align-items:flex-start;background:var(--the);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13.5px;color:var(--phu)}
.bang label b{display:block;color:var(--chu);font-size:14px}
.bang input{margin-top:4px;accent-color:var(--vang);width:16px;height:16px;flex:none}
.dk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px;font-size:14px;color:var(--phu)}
.dk button,.dk select{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:var(--the);color:var(--chu);cursor:pointer}
.dk button.chon{border-color:var(--cy);color:var(--cy)}
.khung{margin:0 auto;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:#000;width:100%}
.khung iframe{display:block;width:100%;height:800px;border:0}
.khung.dt{width:390px;border-radius:30px;border:9px solid #050607}.khung.dt iframe{height:780px}
</style>
</head>
<body>
<div class="vo">
  <h1>Màn đăng nhập Khắc laser – hiệu ứng đợt 2</h1>
  <p class="mo">Tích chọn hiệu ứng muốn xem rồi khung bên dưới tự tải lại. Mật khẩu thử là <b>"demo"</b>. Trên điện thoại thật mọi hiệu ứng đều chạy; trên máy tính muốn thử kiểu "chạm" thì tích ô số 1.</p>
  <div class="bang" id="bang">
    <label><input type="checkbox" data-k="cham" checked><span><b>1. Nút nhảy khi chạm</b>Chưa điền đủ mà chạm Đăng nhập: nút nhảy sang bên, rung nhẹ (Android), ô trống được chọn sẵn.</span></label>
    <label><input type="checkbox" data-k="cua" checked><span><b>2. Cửa cuốn xưởng</b>Vuốt / kéo cửa cuốn lên để vào (thay cho dây kéo đèn). Bỏ tích để xem lại dây kéo.</span></label>
    <label><input type="checkbox" data-k="mat" checked><span><b>4. Mắt Mai theo chữ</b>Gõ mã nhân viên thì mắt Mai đưa theo; bật Caps Lock thì Mai bịt tai "chữ to quá!".</span></label>
    <label><input type="checkbox" data-k="ket" checked><span><b>5. Két sắt</b>Sai mật khẩu 3 lần liền: bảng khóa kiểu két sắt, đếm ngược 30 giây.</span></label>
    <label><input type="checkbox" data-k="gio" checked><span><b>6. Theo giờ trong ngày</b>Ca đêm đèn vàng ấm; sáng sớm, trưa, tối Mai nói câu hợp giờ. Chọn giờ giả lập ở dưới.</span></label>
  </div>
  <div class="dk">
    Giờ giả lập: <select id="gio"><option value="">Giờ thật</option><option value="6.5">6:30 sáng</option><option value="9">9:00</option><option value="12">12:00 trưa</option><option value="19">19:00 tăng ca</option><option value="23">23:00 ca đêm</option></select>
    <span style="width:12px"></span>
    <button class="chon" data-v="pc">🖥 Máy tính</button><button data-v="dt">📱 Điện thoại</button>
    <button id="lai">↻ Làm lại</button>
  </div>
  <div class="khung" id="khung"><iframe id="f" title="Màn đăng nhập"></iframe></div>
</div>

/* ============================================================
   MÀN ĐĂNG NHẬP — "KHẮC LASER" (Rhino / Carbon Billiards Co., Ltd.)
   Nền (24/10): ảnh tòa nhà nhà máy ban đêm, để trên Google Drive (chỗ giữ NEN_DN, mã file ở kpi-app/anh-drive.json; ảnh lỗi thì còn nền xanh đêm).
   Phía trước: THẺ NHÂN VIÊN vân carbon (vẽ bằng SVG, chủ dự án chọn 24/10 thay cho ảnh ngọn cơ ghép lên nền bị lệch tông), nhóm #lkNhom
   đặt theo LK.tf (dời + xoay); chữ khắc nằm trên thẻ, tia laser vẽ ngoài thẻ nên luôn thẳng đứng (lkDauBut đổi tọa độ thẻ -&gt; ảnh).
   Logo qua RH_LOGO (chỉ nhúng 1 lần: logo trên thẻ và cửa cuốn lấy lại từ .lk-dau img).
   Ý tưởng riêng: gõ MÃ NHÂN VIÊN thì tia laser khắc từng ký tự lên thẻ nhân viên carbon (chữ nóng sáng rồi nguội màu vàng đồng).
   Gõ mật khẩu: laser chỉ lóe tia, không khắc gì. Đúng: vệt sáng chạy dọc ngọn cơ. Sai: tia đỏ, chữ khắc mờ đi.
   Bảng đăng nhập là tấm kính tối nổi trên khoảng tường trống. Giữ nguyên API cho login(): bbCho, bbTrung, bbTruot, bbTha, bbXep, bbChu, bbKhoiDong.
   ============================================================ */

#gate .lk-chu{font-family:var(--lkf,'LkOrb'),var(--sans);font-weight:700;font-size:64px;letter-spacing:.14em;fill:url(#lkTru);opacity:.93;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:1.2px;transition:fill .9s,opacity .6s}
#gate .lk-chu tspan{transition:fill 1.1s ease}
#gate .lk-chu tspan.nong{fill:#fff6dc;filter:url(#lkNong)}
#gate .lk-chu.mo{opacity:.35}
#gate .lk-chu.vang tspan{fill:var(--vang2);filter:url(#lkNong)}
#gate .lk-chu.ten{font-family:'Arimo',var(--sans);letter-spacing:.08em}   /* họ tên thật có dấu tiếng Việt – Orbitron không có dấu */
#gate .lk-lua{opacity:0;pointer-events:none}
#gate .lk-lua.bat{animation:lkBat .45s ease-out}
@keyframes lkBat{0%{opacity:1}35%{opacity:.75}55%{opacity:1}100%{opacity:0}}
#gate .lk-lua line{stroke:#bfe0ff;stroke-width:2.2;filter:url(#lkNong)}
#gate .lk-lua.loi line{stroke:#ff5a4a}
#gate .lk-lua .hoa{fill:url(#lkHoa)}
#gate .lk-lua.loi .hoa{fill:url(#lkHoaDo)}
#gate .lk-lua .tl circle{fill:#ffb347;opacity:0}
#gate .lk-lua.bat .tl circle{animation:lkTia .45s ease-out forwards}
@keyframes lkTia{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
#gate .lk-the-vien{fill:none;stroke:rgba(255,255,255,.2);stroke-width:1.2}
#gate .lk-the-nhan{font:700 11px var(--sans);letter-spacing:.22em;fill:#9aa3ad}
#gate .lk-the.sang .lk-the-vien{stroke:var(--vang);stroke-opacity:.75;filter:url(#lkNong)}
#gate .lk-quet{opacity:0}
#gate .lk-quet.chay{animation:lkQuet 1.3s cubic-bezier(.3,.6,.3,1) forwards}
@keyframes lkQuet{0%{opacity:0;transform:translateX(-160px)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateX(420px)}}
/* chữ trên nền */
#gate .lk-dau{position:absolute;z-index:2;left:clamp(24px,4vw,56px);top:clamp(22px,4vh,40px);display:flex;align-items:center;gap:16px}
#gate .lk-dau img{height:34px;width:auto;display:block}
#gate .lk-dau span{font:700 10.5px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.55);padding-left:16px;border-left:1px solid rgba(255,255,255,.18)}
#gate .lk-goc{position:absolute;z-index:2;left:clamp(24px,4vw,56px);bottom:clamp(22px,5vh,48px);max-width:min(520px,45vw)}
#gate .lk-goc .lk-cau{font:700 clamp(30px,3.4vw,50px)/1.05 var(--sans);letter-spacing:.02em;color:#fff;text-transform:uppercase}
#gate .lk-goc .lk-cau em{font-style:normal;color:var(--vang)}
#gate .lk-goc p{margin:12px 0 0;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.72)}
#gate .lk-may{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:7px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px;background:rgba(0,0,0,.45);
  font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.6)}
#gate .lk-may i{width:7px;height:7px;border-radius:50%;background:#4a4a4a;transition:background .2s,box-shadow .2s}
#gate .lk-may.bat i{background:#8fd0ff;box-shadow:0 0 10px #8fd0ff}
#gate .lk-may b{color:var(--vang);letter-spacing:.12em;min-width:5ch}
/* tấm kính đăng nhập */
#gate .lk-kinh{position:absolute;z-index:3;right:clamp(20px,6vw,96px);top:50%;transform:translateY(-50%);width:min(410px,calc(100% - 40px));
  padding:28px 30px 18px;border-radius:20px;background:rgba(14,14,14,.68);-webkit-backdrop-filter:blur(16px) saturate(1.15);backdrop-filter:blur(16px) saturate(1.15);
  border:1px solid rgba(255,255,255,.09);box-shadow:0 40px 90px -20px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
#gate .lk-kinh::before{content:"";position:absolute;left:30px;right:30px;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--vang),transparent);opacity:.7}
/* ---------------- Phải: bảng đăng nhập ---------------- */
#gate .bb-the{width:100%}
#gate .rh-mai{display:flex;align-items:center;gap:13px;margin-bottom:22px}
#gate .rh-mai-anh{position:relative;flex:none;width:50px;height:50px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#fffdf8,#ece4d4);
  box-shadow:0 0 0 2px var(--vang),0 0 0 5px rgba(247,184,41,.14)}
#gate .rh-mai-anh svg{position:absolute;left:-4px;top:-2px;width:58px;height:58px;display:block}
#gate .rh-mai-chu{min-width:0}
#gate #bbChao{font:700 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--vang)}
#gate .rh-mai-noi{font:400 14.5px/1.45 var(--sans);color:var(--chu);margin-top:3px}
#gate .rh-mai-noi b{color:var(--vang2);font-weight:700}
#gate .rh-mai-noi.lo{color:#ffb0a6}
#gate .rh-mai-noi.doi{animation:rhDoi .35s ease}
@keyframes rhDoi{from{opacity:0;transform:translateY(3px)}}
#gate .rh-mai.tat .rh-mai-anh,#gate .rh-mai.tat .rh-mai-noi{display:none}
#gate h1{font:700 clamp(28px,2.6vw,34px)/1.1 var(--sans);letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;color:#fff}
#gate h1::after{content:"";display:block;width:36px;height:3px;background:var(--vang);margin-top:14px}
#gate #gsub{font-size:14.5px;line-height:1.6;color:var(--chu2);margin:0 0 28px}
#gate .bb-o{margin-bottom:18px}
#gate label{display:block;font:700 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--chu2);margin-bottom:8px}
#gate .bb-nhap{position:relative}
#gate input[type=text],#gate input[type=password]{width:100%;height:50px;padding:0 16px;border-radius:10px;font:400 16px var(--sans);color:#fff;
  background:rgba(0,0,0,.55);border:1px solid var(--vien);outline:none;transition:border-color .2s,box-shadow .2s}
#gate #l_mk{padding-right:76px}
#gate input:hover{border-color:#444}
#gate input:focus{border-color:var(--vang);box-shadow:0 0 0 4px rgba(247,184,41,.14)}
#gate input::placeholder{color:#5c5c5c}
#gate .bb-sai input{border-color:var(--do)!important;box-shadow:0 0 0 4px rgba(255,107,91,.12)!important}
#gate .bb-hien{position:absolute;right:8px;top:50%;transform:translateY(-50%);height:36px;padding:0 12px;border:0;border-radius:8px;background:transparent;
  font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--chu2);cursor:pointer}
#gate .bb-hien:hover{background:#1f1f1f;color:#fff}
#gate .bb-caps{display:none;margin-top:8px;font-size:12.5px;color:var(--vang2)}
#gate .bb-caps.hien{display:block}
#gate .bb-dong{display:flex;justify-content:space-between;align-items:center;margin:2px 0 24px;font-size:13.5px}
#gate .bb-nho{display:flex;align-items:center;gap:9px;margin:0;font:400 13.5px var(--sans);letter-spacing:0;text-transform:none;color:var(--chu2);cursor:pointer;user-select:none}
#gate .bb-nho input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border:1.5px solid #4a4a4a;border-radius:4px;background:#0c0c0c;display:grid;place-items:center;cursor:pointer}
#gate .bb-nho input:checked{background:var(--vang);border-color:var(--vang)}
#gate .bb-nho input:checked::after{content:"";width:9px;height:5px;border:2px solid #111;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
#gate .bb-quen{background:none;border:0;padding:0 0 1px;font:400 13.5px var(--sans);color:#fff;cursor:pointer;border-bottom:1px solid var(--vang)}
#gate .bb-quen:hover{color:var(--vang)}
#gate .bb-nut{position:relative;overflow:hidden;width:100%;height:54px;border:0;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;
  font:700 15px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#111;background:var(--vang);box-shadow:0 14px 30px -14px rgba(247,184,41,.55);transition:background .2s,transform .12s}
#gate .bb-nut:hover{background:var(--vang2)}
#gate .bb-nut:active{transform:translateY(1px)}
#gate .bb-nut svg{width:18px;height:18px;transition:transform .25s}
#gate .bb-nut:hover svg{transform:translateX(4px)}
#gate .bb-nut:disabled{cursor:progress;background:#b88a1f}
#gate .bb-nut:disabled::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,rgba(0,0,0,.12) 0 12px,transparent 12px 24px);background-size:34px 34px;animation:rhSoc .8s linear infinite}
@keyframes rhSoc{to{background-position:34px 0}}
#gate .bb-nut:focus-visible,#gate .bb-hien:focus-visible,#gate .bb-quen:focus-visible,#gate .bb-nho input:focus-visible,#gate .rh-mai-nut:focus-visible{outline:2px solid var(--vang);outline-offset:3px}
#gate #lerr{display:flex;gap:10px;align-items:flex-start;margin:16px 0 0;padding:12px 14px;border-radius:10px;font-size:13.5px;line-height:1.5;color:#ffd0ca;background:rgba(255,107,91,.08);border:1px solid rgba(255,107,91,.35)}
#gate #lerr::before{content:"!";flex:none;width:18px;height:18px;margin-top:1px;border-radius:50%;background:var(--do);color:#111;font:700 11px/18px var(--sans);text-align:center}
#gate #lerr.hide{display:none}
#gate #lerr.bb-tin{color:#f2e3bd;background:rgba(247,184,41,.07);border-color:rgba(247,184,41,.35)}
#gate #lerr.bb-tin::before{content:"i";background:var(--vang)}
#gate #gspin{display:none}
#gate .bb-the.rung{animation:rhRung .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes rhRung{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#gate .rh-chan{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:var(--chu3)}
#gate .rh-chan span{display:inline-flex;align-items:center;gap:7px}
#gate .rh-chan svg{width:14px;height:14px}
#gate .rh-mai-nut{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;border-bottom:1px dotted currentColor}
#gate .rh-mai-nut:hover{color:#fff}
/* Đăng nhập xong */
#gate .bb-vao-hop{display:none}
#gate.bb-vao .bb-the &gt; :not(.bb-vao-hop):not(.rh-mai){display:none}
#gate.bb-vao .bb-vao-hop{display:block;animation:rhDoi .5s ease}
#gate .bb-vao-hop .rh-ok{font:700 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--vang)}
#gate .bb-vao-hop h1{margin-top:12px}
#gate .bb-vao-hop p{font-size:14.5px;line-height:1.6;color:var(--chu2)}
#gate .bb-vao-hop .rh-tai{height:3px;margin-top:22px;background:#262626;overflow:hidden;border-radius:2px}
#gate .bb-vao-hop .rh-tai i{display:block;height:100%;width:40%;background:var(--vang);animation:rhChay 1.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes rhChay{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
/* Mai (hình chung MAI_SVG) */
#gate .mai .duoi{transform-origin:104px 34px;animation:rhmDuoi 2.4s ease-in-out infinite}@keyframes rhmDuoi{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
#gate .mai .mat-g{transform-box:fill-box;transform-origin:center;animation:rhmChop 4.2s infinite}@keyframes rhmChop{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
#gate .mai .mieng-mo,#gate .mai .mo-hoi,#gate .mai .lap-lanh,#gate .mai .may-lo,#gate .mai .ngon,#gate .mai .che-mat{display:none}
#gate .mai.noi .mieng-mo{display:inline;animation:rhmNoi .28s steps(2) infinite}#gate .mai.noi .mieng-cuoi{animation:rhmNoi2 .28s steps(2) infinite}
@keyframes rhmNoi{0%{opacity:1}100%{opacity:0}}@keyframes rhmNoi2{0%{opacity:0}100%{opacity:1}}
#gate .mai.lo .mo-hoi,#gate .mai.lo .may-lo{display:inline}#gate .mai.lo .may-vui{display:none}
#gate .mai .tay-chi{transform-origin:128px 180px;transition:transform .4s}
#gate .mai.covu .tay-chi{transform:rotate(-142deg)}
#gate .mai.che .che-mat{display:inline}#gate .mai.che .tay-chi{display:none}


/* ===== Hiệu ứng thêm (09/10, chờ duyệt) – bật bằng LK_HU = { day: true, chay: true } ===== */
/* 1) Màn tối + sợi dây kéo bật đèn */
#gate .lk-toi{position:absolute;inset:0;z-index:20;background:radial-gradient(55% 45% at var(--dx,50%) 0%,#111,#020202 70%);transition:opacity .8s ease}
#gate .lk-toi.chop{animation:lkChop .85s steps(1) forwards}
@keyframes lkChop{0%{opacity:1}12%{opacity:.3}22%{opacity:.92}34%{opacity:.12}46%{opacity:.6}58%{opacity:0}100%{opacity:0}}
#gate .lk-toi.tat{opacity:0;pointer-events:none}
#gate .lk-day{position:absolute;z-index:21;left:var(--dx,50%);top:0;width:64px;margin-left:-32px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0;animation:lkDua 3.4s ease-in-out infinite;transition:transform .6s cubic-bezier(.5,0,.75,0)}
@keyframes lkDua{0%,100%{rotate:-1.6deg}50%{rotate:1.6deg}}
#gate .lk-day .soi{width:2px;height:calc(var(--dai,36vh) + var(--keo,0px));background:linear-gradient(#1a1a1a,#9a9a9a);transition:height .5s cubic-bezier(.25,1.9,.45,1)}
#gate .lk-day.dang .soi{transition:none}
#gate .lk-day .num{width:24px;height:36px;margin-top:-1px;border:0;padding:0;border-radius:12px 12px 15px 15px;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 35% 30%,#ffe7a3,#f7b829 45%,#9b6b06);box-shadow:0 6px 14px rgba(0,0,0,.6);animation:lkGoi 2.4s ease-in-out infinite}
#gate .lk-day.dang .num{cursor:grabbing}
#gate .lk-day .num:focus-visible{outline:2px solid #fff;outline-offset:4px}
@keyframes lkGoi{0%,100%{box-shadow:0 6px 14px rgba(0,0,0,.6),0 0 0 0 rgba(247,184,41,0)}50%{box-shadow:0 6px 14px rgba(0,0,0,.6),0 0 26px 6px rgba(247,184,41,.4)}}
#gate .lk-day .goi{margin-top:16px;font:700 11px var(--sans);letter-spacing:.26em;text-transform:uppercase;color:rgba(255,255,255,.6);white-space:nowrap;opacity:0;animation:lkHien .8s ease 1.4s forwards}
@keyframes lkHien{to{opacity:1}}
#gate .lk-day.di{transform:translateY(-120%);animation:none}
#gate.lk-chuabat .lk-dau,#gate.lk-chuabat .lk-goc,#gate.lk-chuabat .lk-kinh{opacity:0;filter:blur(6px);pointer-events:none}
#gate .lk-dau,#gate .lk-goc,#gate .lk-kinh{transition:opacity .7s ease,filter .7s ease}
#gate .lk-goc{transition-delay:.15s}#gate .lk-kinh{transition-delay:.3s}
/* 2) Nút Đăng nhập "chạy trốn" khi chưa điền đủ (chỉ máy tính có chuột) */
#gate .bb-nut.chay{z-index:30;width:210px;transition:transform .3s cubic-bezier(.3,1.2,.5,1),background .2s;box-shadow:0 18px 40px -12px rgba(247,184,41,.7)}
#gate .bb-nut.ve{transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .3s}
#gate .bb-nut.met{animation:lkLac .55s ease}
@keyframes lkLac{20%,60%{rotate:-4deg}40%,80%{rotate:4deg}}
#gate .bb-o.thieu input{border-color:var(--vang);animation:lkNhay 1s ease 2}
@keyframes lkNhay{50%{box-shadow:0 0 0 5px rgba(247,184,41,.3)}}
/* 3) Nút nhảy khi chạm (điện thoại) */
#gate .bb-nut.nhay{animation:lkHop .42s cubic-bezier(.3,1.6,.5,1)}
@keyframes lkHop{40%{translate:0 -18px}}
/* 4) Cửa cuốn xưởng */
#gate .lk-cua{position:absolute;inset:0;z-index:20;touch-action:none;cursor:grab;transition:transform .9s cubic-bezier(.6,0,.3,1);
  background:linear-gradient(90deg,rgba(0,0,0,.45),transparent 12%,transparent 88%,rgba(0,0,0,.45)),
    repeating-linear-gradient(180deg,#4a4f55 0 3px,#3a3e43 3px 22px,#2b2e32 22px 26px,#55595f 26px 28px,#34383c 28px 34px);
  box-shadow:inset 0 -14px 0 #1b1d20}
#gate .lk-cua.dang{transition:none;cursor:grabbing}
#gate .lk-cua.mo{transform:translateY(-102%)}
#gate .lk-cua::before{content:"";position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 40%,transparent,rgba(0,0,0,.55));pointer-events:none}
#gate .lk-cua .bien{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;color:rgba(255,255,255,.75);pointer-events:none}
#gate .lk-cua .bien img{height:34px;width:auto;display:block;margin:0 auto 12px;opacity:.85;filter:drop-shadow(0 2px 0 rgba(0,0,0,.6))}
#gate .lk-cua .bien b{display:block;font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.55)}
#gate .lk-cua .tay{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;color:#fff;cursor:pointer;font:700 11px var(--sans);letter-spacing:.24em;text-transform:uppercase}
#gate .lk-cua .tay i{display:block;width:120px;height:16px;border-radius:8px;background:linear-gradient(#f7b829,#a87a10);box-shadow:0 3px 0 #5c4306,0 0 18px rgba(247,184,41,.35)}
#gate .lk-cua .tay span{animation:lkLen 1.6s ease-in-out infinite}
@keyframes lkLen{50%{transform:translateY(-6px);opacity:.6}}
#gate .lk-cua .tay:focus-visible{outline:2px solid #fff;outline-offset:6px;border-radius:8px}
/* 5) Mắt Mai dõi theo chữ, bịt tai khi bật Caps Lock */
#gate .mai .bit-tai{display:none}#gate .mai.bit .bit-tai{display:inline}#gate .mai.bit .tay-chi{display:none}
/* 6) Két sắt: sai 3 lần thì tạm khóa */
#gate .lk-ket{position:absolute;inset:0;z-index:8;border-radius:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;
  background:radial-gradient(120% 90% at 50% 30%,#3a3e44,#1c1e21 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),inset 0 0 40px rgba(0,0,0,.6);transform-origin:0 50%;transition:transform .8s cubic-bezier(.5,0,.3,1),opacity .8s}
#gate .lk-ket.mo{transform:perspective(900px) rotateY(-100deg);opacity:0}
#gate .lk-ket .num{width:130px;height:130px;border-radius:50%;position:relative;background:radial-gradient(circle,#55595f 0 30%,#2d3034 31% 62%,#45494f 63% 66%,#24272a 67%);box-shadow:0 10px 24px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.12);animation:lkXoay 6s linear infinite}
#gate .lk-ket .num::before{content:"";position:absolute;inset:8px;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,.55) 0 1.2deg,transparent 1.2deg 10deg);-webkit-mask:radial-gradient(circle,transparent 54%,#000 55% 60%,transparent 61%);mask:radial-gradient(circle,transparent 54%,#000 55% 60%,transparent 61%)}
#gate .lk-ket .num::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:16px;margin-left:-2px;background:var(--vang);border-radius:2px}
@keyframes lkXoay{to{rotate:360deg}}
#gate .lk-ket .dem{font:700 34px 'LkOrb',var(--sans);color:var(--vang);letter-spacing:.06em}
#gate .lk-ket b{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#fff}
#gate .lk-ket small{font-size:13px;color:var(--chu2);max-width:280px;line-height:1.5}
/* 7) Theo giờ: ca đêm đèn vàng ấm, mờ hơn */
#gate.lk-dem .lk-nen image.anh{filter:brightness(.72) sepia(.28) saturate(1.1)}
#gate.lk-dem .lk-toi{background:radial-gradient(45% 40% at var(--dx,50%) 0%,#2a1d08,#020202 70%)}
/* ---------------- Màn hẹp / điện thoại ---------------- */
@media (max-width:760px){
  #gate .lk-day{--dai:24vh}
  #gate{overflow:visible;display:flow-root}
  #gate .lk-nen,#gate .lk-phu{bottom:auto;height:50vh}
  #gate .lk-phu{background:linear-gradient(180deg,rgba(0,0,0,.45),transparent 30%,transparent 60%,rgba(0,0,0,.75))}
  #gate .lk-goc{top:calc(50vh - 120px);bottom:auto;max-width:none;right:24px}
  #gate .lk-goc .lk-cau{font-size:26px}
  #gate .lk-goc p{display:none}
  #gate .lk-may{margin-top:10px}
  #gate .lk-kinh{position:relative;right:auto;top:auto;transform:none;width:auto;margin:calc(50vh - 22px) 0 0;border-radius:22px 22px 0 0;padding:24px 22px 20px;background:#111;border-left:0;border-right:0;border-bottom:0}
  #gate .lk-dau span{display:none}
}
@media (prefers-reduced-motion:reduce){#gate *,#gate *::after,#gate *::before{animation:none!important;transition:none!important}}
