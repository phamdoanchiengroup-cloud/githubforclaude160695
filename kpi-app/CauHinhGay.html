/* Chuôi carbon (vỏ + lõi foam + ống quả cân, như bản vẽ Rhino) hay chuôi gỗ (mộng A-joint + khoang cân) */
function cgCb(c){ return !/gỗ|go$|^go\b|wood/i.test(String((c&&c.kieu)||'carbon').trim()); }
function cgK3(c){ return Math.round(cgN(c&&c.soKhuc))===3; }
function cgTruongHien(t){ var cb=cgCb(t&&t.chuoi), k3=cgK3(t&&t.chuoi); return CG_TRUONG.filter(function(g){ return !g[2]||(g[2]==='k3'?k3:(g[2]==='cb')===cb); }); }
function cgLay(o,p){ return p.split('.').reduce(function(a,k){return a==null?undefined:a[k]},o); }
function cgDat(o,p,v){ var k=p.split('.'), a=o; for(var i=0;i<k.length-1;i++){ if(!a[k[i]]||typeof a[k[i]]!=='object')a[k[i]]={}; a=a[k[i]]; } a[k[k.length-1]]=v; }
function cgK(p){ return String(p).replace(/\./g,'__'); }   /* khóa daDo: máy chủ chỉ nhận chữ, số, _ */
function cgN(v){ v=Number(v); return isFinite(v)?v:0; }
function cgF(v,n){ if(v===''||v==null||!isFinite(Number(v)))return '–'; var x=Number(v), s=(n==null?(Math.round(x*100)/100):x.toFixed(n)); return String(s).replace('.',','); }
/* Gộp dữ liệu đã lưu lên mẫu (bản cũ thiếu trường mới vẫn vẽ được) */
function cgDu(dl,d){ var m=cgMau(d); if(!dl)return m; (function hop(a,b){ Object.keys(b||{}).forEach(function(k){ if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k])){ if(!a[k]||typeof a[k]!=='object')a[k]={}; hop(a[k],b[k]); } else a[k]=b[k]; }); })(m,dl); return m; }
/* Chiều dài tính ra */
function cgDai(t){ var n=t.ngon,c=t.chuoi;
  var ngon=cgN(n.tip.h)+cgN(n.pad.h)+cgN(n.ferrule.h)+cgN(n.ong.dai)+cgN(n.collar.h);
  var chuoi=cgN(c.collar.h)+cgN(c.forearm.dai)+cgN(c.wrap.dai)+cgN(c.sleeve.dai)+cgN(c.cap.h)+cgN(c.bumper.h);
  return {ngon:ngon,chuoi:chuoi,tong:ngon+chuoi}; }

  if(!cb&&cgN(c.pin.chon)>cgN(c.forearm.dai)-cgN(c.forearm.tenonL)) ra.push({muc:'vang',t:'Pin chôn '+cgF(c.pin.chon)+' mm sâu tới mộng A-joint.',p:['chuoi.pin.chon']});

  if(ls(c.forearm.dDau,c.collar.d)>0.3) ra.push({muc:'vang',t:'Forearm Ø đầu '+cgF(c.forearm.dDau)+' khác collar chuôi Ø'+cgF(c.collar.d)+'.',p:['chuoi.forearm.dDau']});
  if(ls(c.wrap.dDau,c.forearm.dCuoi)>0.3) ra.push({muc:'vang',t:'Wrap Ø đầu khác forearm Ø cuối (có bậc '+cgF(ls(c.wrap.dDau,c.forearm.dCuoi))+' mm).',p:['chuoi.wrap.dDau','chuoi.forearm.dCuoi']});
  if(ls(c.sleeve.dDau,c.wrap.dCuoi)>0.3) ra.push({muc:'vang',t:'Sleeve Ø đầu khác wrap Ø cuối.',p:['chuoi.sleeve.dDau','chuoi.wrap.dCuoi']});

  var duoi=cgN(c.sleeve.dai)+cgN(c.cap.h)+cgN(c.bumper.h)+cgN(c.wrap.dai);

function cgTaiPdf(){
  if(!CG.bv)return; var d=CG.bv.dong, B=cgBanHien(), t=B.dl;

    var L=cgDai(t), p=[ '<h3>'+esc(d.ten)+' – NGỌN VÀ CHUÔI (DỰNG ĐỨNG · TRỤC ĐÚNG TỈ LỆ)</h3><div class="cg-giay"><div class="cg-dung2"><div><h5>NGỌN · '+cgF(L.ngon,1)+' mm</h5>'+cgKhuc(t,'ngon',{cao:1650})+'</div><div><h5>CHUÔI · '+cgF(L.chuoi,1)+' mm</h5>'+cgKhuc(t,'chuoi',{cao:1650})+'</div></div><div style="text-align:center;font:700 13px monospace;margin-top:4px">CẢ CÂY '+cgF(L.tong,1)+' mm · '+cgF(Math.round(L.tong/25.4*10)/10)+' in</div></div>',

    var box=document.createElement('div'); box.className='cg-in'; box.innerHTML=p.map(function(x,i){ return cgTrangPdf(t,d,B,nguoi,luc,i+1,p.length,x); }).join(''); document.body.appendChild(box);

    });
  });
}

}
