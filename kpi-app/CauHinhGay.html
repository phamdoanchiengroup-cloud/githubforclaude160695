function cgDauChim(nguoi,luc){ var h='<div class="cg-dc">'; for(var y=-60;y<1140;y+=250) for(var x=-140;x<820;x+=360) h+='<i style="left:'+(x+(Math.round((y+60)/250)%2?180:0))+'px;top:'+y+'px"><img src="'+CG_LOGO+'" alt="">MẬT · '+esc(nguoi)+' · '+esc(luc)+'</i>'; return h+'</div>'; }
function cgTrangPdf(t,d,B,nguoi,luc,so,tong,than){
  return '<div class="cg-trang">'+than+'<div class="cg-khung"><div><small>DÒNG GẬY</small><b>'+esc(d.ten)+'</b> · '+esc(d.ma)+'</div><div><small>PHIÊN BẢN</small>'+esc(B.nhan)+'</div><div><small>NGƯỜI ĐO / DUYỆT</small>'+esc(B.tt?(B.tt.nguoi+(B.tt.duyet?' / '+B.tt.duyet:'')):'–')+'</div><div><small>TRANG</small>'+so+' / '+tong+' · CARBON BILLIARDS</div></div>'+cgDauChim(nguoi,luc)+'</div>'; }
function cgTaiPdf(){
  if(!CG.bv)return; var d=CG.bv.dong, B=cgBanHien(), t=B.dl;
  toast('Đang tạo PDF…',true);
  call('ghiTaiPdfCauHinhGay',[d.ma,B.tt?B.tt.pb:''],function(g){
    if(!g||!g.ok){ toast((g&&g.msg)||'Không tạo được PDF'); return; }
    var nguoi=g.nguoi+(g.maNV?' ('+g.maNV+')':''), luc=g.luc, W=1055;
    var L=cgDai(t), p=[ '<h3>'+esc(d.ten)+' – NGỌN VÀ CHUÔI (DỰNG ĐỨNG · TRỤC ĐÚNG TỈ LỆ)</h3><div class="cg-giay"><div class="cg-dung2"><div><h5>NGỌN · '+cgF(L.ngon,1)+' mm</h5>'+cgKhuc(t,'ngon',{cao:1650})+'</div><div><h5>CHUÔI · '+cgF(L.chuoi,1)+' mm</h5>'+cgKhuc(t,'chuoi',{cao:1650})+'</div></div><div style="text-align:center;font:700 13px monospace;margin-top:4px">CẢ CÂY '+cgF(L.tong,1)+' mm · '+cgF(Math.round(L.tong/25.4*10)/10)+' in</div></div>',
      '<h3>CHI TIẾT – ĐÚNG TỈ LỆ THẬT, PHÓNG TO</h3><div class="cg-giay"><div class="cg-dung3"><div><h5>A · ĐẦU NGỌN</h5>'+cgCT(t,'A')+'</div><div><h5>C · JOINT</h5>'+cgCT(t,'C')+'</div><div><h5>D · ĐUÔI</h5>'+cgCT(t,'D')+'</div></div></div><div class="cg-2c" style="grid-template-columns:1.3fr 1fr"><div class="cg-giay"><h4>THÔNG SỐ</h4>'+cgBangTS(t)+'</div><div class="cg-giay"><h4>CHÚ THÍCH VẬT LIỆU</h4>'+cgChuThich(t)+'</div></div><div class="cg-giay"><h4>BẢNG CHI TIẾT</h4>'+cgBangCT(t)+'</div>' ];
    var box=document.createElement('div'); box.className='cg-in'; box.innerHTML=p.map(function(x,i){ return cgTrangPdf(t,d,B,nguoi,luc,i+1,p.length,x); }).join(''); document.body.appendChild(box);
    var ten='Cau-hinh-gay-'+d.ma+'-'+(B.tt?'v'+B.tt.pb:'mau')+'.pdf';
    cgTaiThuVien(function(ok){
      if(!ok){ cgInDuPhong(box,ten); return; }
      var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'}), trang=box.querySelectorAll('.cg-trang'), i=0;
      (function tiep(){
        if(i>=trang.length){ try{ pdf.setProperties({title:d.ten+' – cấu hình gậy',subject:'MẬT – '+nguoi+' – '+luc,author:'Carbon Billiards'}); pdf.save(ten); toast('Đã tải '+ten,true); }catch(e){ toast('Lỗi lưu PDF: '+e.message); } box.remove(); return; }
        window.html2canvas(trang[i],{scale:2,backgroundColor:'#ffffff',logging:false}).then(function(cv){ if(i)pdf.addPage(); pdf.addImage(cv.toDataURL('image/jpeg',0.9),'JPEG',0,0,210,297); i++; tiep(); })
          .catch(function(e){ box.remove(); toast('Không tạo được PDF: '+(e&&e.message||e)); });
      })();
    });
  });
}
/* Không tải được thư viện PDF (mạng chặn): mở hộp in của trình duyệt -> "Lưu thành PDF" */
function cgInDuPhong(box,ten){
  var ifr=document.createElement('iframe'); ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.appendChild(ifr);
  var css=Array.prototype.map.call(document.querySelectorAll('style'),function(s){return s.textContent.indexOf('.cg-trang')>=0?s.textContent:''}).join('');
  var doc=ifr.contentWindow.document; doc.open(); doc.write('<html><head><title>'+esc(ten)+'</title><style>'+css+'@page{size:A4 portrait;margin:0}body{margin:0}.cg-trang{page-break-after:always}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>'+box.innerHTML+'</body></html>'); doc.close(); box.remove();
  setTimeout(function(){ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); toast('Chọn "Lưu thành PDF" trong hộp in',true); }catch(e){ toast('Không in được: '+e.message); } setTimeout(function(){ifr.remove()},60000); },400);
}
