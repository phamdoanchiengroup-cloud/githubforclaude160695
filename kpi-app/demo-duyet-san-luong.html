<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt sản lượng – bản mới</title>
<!-- Demo làm lại màn hình "Duyệt sản lượng" theo công việc thật của trưởng phòng: máy tự gắn cờ dòng bất thường,
     dòng bình thường duyệt một lần, sửa số ngay trong dòng, hoàn tác 5 giây thay cho hộp xác nhận, từ chối có lý do.
     Có tab "Bản hiện tại" dựng lại bố cục đang dùng để so. SỐ LIỆU MẪU, tên người giả. CSS/JS thuần, cùng bảng màu web. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#121518;--s1:#1a1e22;--s2:#21262b;--s3:#2a3036;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);--t1:#eef2f4;--t2:#aab5bc;--t3:#7b8891;
  --ac:#2fd3c6;--acr:47,211,198;--ok:#5fd49a;--am:#f0b04e;--rd:#f26b6b;--f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{color:var(--t1);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.so{font-variant-numeric:tabular-nums}
.vo{max-width:1180px;margin:0 auto;padding:22px 18px 120px}
.tab{display:inline-flex;gap:4px;padding:3px;border-radius:11px;background:var(--s1);border:1px solid var(--bd);margin-bottom:18px}
.tab button{border:0;background:transparent;color:var(--t2);font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer}
.tab button.on{background:var(--s3);color:var(--t1)}
.gt{font-size:12.5px;color:var(--t3);margin:-8px 0 18px;max-width:860px}
.gt b{color:var(--t2)}

/* ===== BẢN MỚI ===== */
.dau{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.dau h1{font-size:22px;font-weight:650;letter-spacing:-.01em}
.dau .tom{font-size:13px;color:var(--t2);margin-top:3px}
.dau .tom b{color:var(--t1)}
.han{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:12.5px;background:rgba(242,107,107,.08);border:1px solid rgba(242,107,107,.3);color:#ffc0c0}
.han b{color:#fff}
.loc{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd2);background:var(--s1);color:var(--t2);font-size:12.5px;font-weight:500;padding:6px 11px;border-radius:999px;cursor:pointer}
.chip b{font-weight:600;color:var(--t1)}
.chip.on{background:rgba(var(--acr),.12);border-color:rgba(var(--acr),.45);color:var(--ac)}
.chip.on b{color:var(--ac)}
.chip .c{width:7px;height:7px;border-radius:50%}
.loc select,.loc input{background:var(--s1);border:1px solid var(--bd2);border-radius:9px;padding:6px 10px;font-size:12.5px;outline:none}
.loc input{min-width:170px;flex:1;max-width:260px}
.loc select:focus,.loc input:focus{border-color:rgba(var(--acr),.5)}
.loc .phai{margin-left:auto;display:flex;gap:8px}
.nut{border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.nut:hover{background:var(--s3)}
.nut.chinh{background:var(--ac);border-color:var(--ac);color:#06201e;font-weight:600}
.nut.chinh:hover{background:#4fe0d4}
.nut.do{color:#ffb4b4;border-color:rgba(242,107,107,.4);background:rgba(242,107,107,.08)}
.nut.nho{padding:5px 10px;font-size:12px}
.nut:disabled{opacity:.4;cursor:not-allowed}
.bang{border:1px solid var(--bd);border-radius:14px;background:var(--s1);overflow:hidden}
.hd,.g-dong{display:grid;grid-template-columns:34px minmax(170px,1.6fr) 74px 54px 78px 56px 70px 84px minmax(150px,1.7fr) 150px;gap:8px;align-items:center;padding:0 12px}
.hd{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);height:36px;border-bottom:1px solid var(--bd);background:var(--s2)}
.hd .n,.g-dong .n{text-align:right}
.nhom-x{padding:8px 14px;font-size:12px;font-weight:600;color:var(--t2);background:rgba(255,255,255,.02);border-bottom:1px solid var(--bd);display:flex;gap:10px}
.nhom-x span{color:var(--t3);font-weight:500}
.g{border-bottom:1px solid var(--bd)}
.g:last-child{border-bottom:0}
.g-dong{min-height:54px;cursor:pointer;position:relative}
.g-dong:hover{background:rgba(255,255,255,.02)}
.g.tro .g-dong{box-shadow:inset 3px 0 0 var(--ac);background:rgba(var(--acr),.04)}
.g.chon .g-dong{background:rgba(var(--acr),.06)}
.g.co .g-dong::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--am)}
.g.co.nang .g-dong::before{background:var(--rd)}
.ten b{display:block;font-size:13px;font-weight:600}
.ten small{display:block;font-size:11.5px;color:var(--t3)}
.hs{display:inline-block;min-width:58px;text-align:center;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:7px}
.hs.ok{background:rgba(95,212,154,.12);color:var(--ok)}.hs.wn{background:rgba(240,176,78,.13);color:var(--am)}.hs.bd{background:rgba(242,107,107,.13);color:var(--rd)}.hs.kh{background:var(--s2);color:var(--t3)}
.co-ds{display:flex;flex-wrap:wrap;gap:4px}
.cot{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(240,176,78,.12);color:var(--am);white-space:nowrap}
.cot.nang{background:rgba(242,107,107,.13);color:var(--rd)}
.binh{font-size:11.5px;color:var(--t3)}
.hanh{display:flex;gap:6px;justify-content:flex-end}
.ck{width:18px;height:18px;accent-color:var(--ac);cursor:pointer}
.mo-rong{display:none;padding:4px 14px 14px 54px;background:rgba(0,0,0,.12);border-top:1px solid var(--bd)}
.g.mo .mo-rong{display:block}
.ct-vo{overflow-x:auto;-webkit-overflow-scrolling:touch}
.ct{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;min-width:520px}
.ct th{font-size:11px;font-weight:600;color:var(--t3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd)}
.ct td{padding:5px 8px;border-bottom:1px solid var(--bd)}
.ct .n{text-align:right}
.ct input{width:76px;text-align:right;background:var(--s2);border:1px solid var(--bd2);border-radius:7px;padding:4px 7px;outline:none}
.ct input:focus{border-color:rgba(var(--acr),.6)}
.ct input.sua{border-color:rgba(240,176,78,.7);background:rgba(240,176,78,.08)}
.ct tr.loi td{color:var(--am)}
.ct small{color:var(--t3)}
.so-sanh{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--t2);margin-top:10px}
.so-sanh b{color:var(--t1)}
.ly-do{margin-top:10px;font-size:12.5px;color:var(--t2);display:flex;flex-direction:column;gap:4px}
.ly-do div{display:flex;gap:8px;align-items:flex-start}
.ly-do i{flex:none;width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--am)}
.ly-do i.nang{background:var(--rd)}
.thanh{position:fixed;left:50%;bottom:18px;transform:translate(-50%,140%);z-index:20;display:flex;gap:10px;align-items:center;padding:10px 12px 10px 16px;border-radius:14px;
  background:#262c31;border:1px solid var(--bd2);box-shadow:0 20px 40px -12px #000;transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 24px);flex-wrap:wrap}
.thanh{visibility:hidden}.thanh.hien{transform:translate(-50%,0);visibility:visible}
.thanh span{font-size:13px;color:var(--t2)}.thanh b{color:var(--t1)}
.bao{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);z-index:30;display:flex;gap:12px;align-items:center;padding:10px 12px 10px 16px;border-radius:12px;background:#1f3b38;border:1px solid rgba(var(--acr),.45);box-shadow:0 16px 30px -12px #000;font-size:13px;transition:transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 24px)}
.bao{visibility:hidden}.bao.hien{transform:translate(-50%,0);visibility:visible}
.bao .vach{position:absolute;left:0;bottom:0;height:2px;background:var(--ac);border-radius:2px}
.hop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px}
.hop.mo{display:flex}
.hop>div{width:min(440px,100%);background:var(--s1);border:1px solid var(--bd2);border-radius:16px;padding:18px;box-shadow:0 30px 60px -20px #000}
.hop h3{font-size:15px;margin-bottom:4px}
.hop p{font-size:12.5px;color:var(--t3);margin-bottom:12px}
.hop .ds{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.hop textarea{width:100%;min-height:64px;background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:8px 10px;outline:none;resize:vertical}
.hop .cuoi{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.trong{padding:50px 20px;text-align:center;color:var(--t3)}
.trong b{display:block;font-size:16px;color:var(--t1);margin-bottom:4px}
.phim{margin-top:12px;font-size:11.5px;color:var(--t3)}
.phim kbd{font:600 10.5px var(--f);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:0 5px;margin:0 2px;color:var(--t2)}
.da-duyet{margin-top:14px;font-size:12.5px;color:var(--t3)}
/* điện thoại: mỗi người một thẻ */
@media(max-width:860px){
  .hd{display:none}
  .g-dong{grid-template-columns:28px 1fr auto;grid-template-areas:"ck ten hs" "ck so so" "ck co co" "ck hanh hanh";row-gap:6px;padding:12px}
  .g-dong>.ck{grid-area:ck;align-self:start;margin-top:3px}
  .g-dong>.ten{grid-area:ten}.g-dong>.hs-o{grid-area:hs}
  .g-dong>.xo{display:none}
  .g-dong>.m-so{grid-area:so;display:flex!important;gap:12px;font-size:12px;color:var(--t3)}
  .g-dong>.m-so b{color:var(--t1)}
  .g-dong>.c-so{display:none}
  .g-dong>.co-o{grid-area:co}
  .g-dong>.hanh{grid-area:hanh;justify-content:flex-start}
  .mo-rong{padding:4px 12px 12px}
  .ct input{width:64px}
  .loc .phai{margin-left:0;width:100%}
  .loc input{max-width:none}
}
.m-so{display:none}

/* ===== BẢN HIỆN TẠI (dựng lại để so) ===== */
.cu .ptitle{font-size:20px;font-weight:650;margin-bottom:2px}
.cu .pdesc{font-size:13px;color:var(--t3);margin-bottom:12px}
.cu .alert{padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:10px;border:1px solid}
.cu .a-bd{background:rgba(242,107,107,.08);border-color:rgba(242,107,107,.35);color:#ffc9c9}
.cu .a-nu{background:var(--s1);border-color:var(--bd2);color:var(--t2)}
.cu .card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.cu h3{font-size:14px;margin-bottom:8px}
.cu table{width:100%;border-collapse:collapse;font-size:12.5px}
.cu th{font-size:11.5px;color:var(--t3);text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd2)}
.cu td{padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
.cu .n{text-align:right}
.cu input[type=number]{width:64px;text-align:right;background:var(--s2);border:1px solid var(--bd2);border-radius:6px;padding:4px 6px;font-size:12px}
.cu .tong td{background:rgba(var(--acr),.06);font-size:12px}
.cu .pill{display:inline-block;font-weight:700;font-size:12px;padding:2px 8px;border-radius:7px}
.cu .ghi{font-size:12px;color:var(--t3);margin-top:8px}
</style>
</head>
<body>
<div class="vo">
  <div class="tab" id="tab"><button class="on" data-k="moi">Bản mới (đề xuất)</button><button data-k="cu">Bản hiện tại</button></div>
  <div class="gt" id="gt"></div>

  <div id="moi">
    <div class="dau">
      <div><h1>Duyệt sản lượng</h1><div class="tom" id="tom"></div></div>
      <div class="han" id="han"></div>
    </div>
    <div class="loc">
      <button class="chip on" data-loc="can"><span class="c" style="background:var(--am)"></span>Cần xem <b id="nCan"></b></button>
      <button class="chip" data-loc="binh"><span class="c" style="background:var(--ok)"></span>Bình thường <b id="nBinh"></b></button>
      <button class="chip" data-loc="tat">Tất cả <b id="nTat"></b></button>
      <select id="lXuong" aria-label="Xưởng"><option value="">Mọi xưởng</option></select>
      <select id="lNgay" aria-label="Ngày"><option value="">Mọi ngày</option></select>
      <input id="lTim" placeholder="Tìm tên hoặc mã…" aria-label="Tìm">
      <div class="phai"><button class="nut" id="chonBinh">Chọn tất cả dòng bình thường</button></div>
    </div>
    <div class="bang" id="bang"></div>
    <div class="phim">Phím tắt: <kbd>↑</kbd><kbd>↓</kbd> chuyển người · <kbd>Enter</kbd> mở chi tiết · <kbd>Space</kbd> chọn · <kbd>A</kbd> duyệt · <kbd>R</kbd> từ chối</div>
    <div class="da-duyet" id="daDuyet"></div>
  </div>

  <div id="cu" class="cu" hidden></div>
</div>

<div class="thanh" id="thanh"><span>Đã chọn <b id="tChon"></b></span><button class="nut chinh" id="tDuyet">Duyệt</button><button class="nut do" id="tTuChoi">Từ chối…</button><button class="nut" id="tBo">Bỏ chọn</button></div>
<div class="bao" id="bao"><span id="baoChu"></span><button class="nut nho" id="baoHt">Hoàn tác</button><i class="vach" id="baoVach"></i></div>
<div class="hop" id="hop"><div role="dialog" aria-modal="true" aria-labelledby="hopTd">
  <h3 id="hopTd">Từ chối sản lượng</h3><p id="hopP"></p>
  <div class="ds" id="hopLy"></div>
  <textarea id="hopGhi" placeholder="Ghi thêm cho công nhân (không bắt buộc)"></textarea>
  <div class="cuoi"><button class="nut" id="hopHuy">Hủy</button><button class="nut do" id="hopOk" disabled>Từ chối và báo công nhân</button></div></div></div>

<script>
(function(){
'use strict';
function $(i){return document.getElementById(i)}
function soN(v){return Math.round(v).toLocaleString('vi-VN')}
function so1(v){return Number(v).toLocaleString('vi-VN',{minimumFractionDigits:1,maximumFractionDigits:1})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hsLop(v){ return v>=90?'ok':v>=80?'wn':'bd' }

/* ---------- Số liệu mẫu (cấu trúc giống sheet NhatKySanXuat: MaDong, MaNV, Ngay, MaCD, SoLuongLamRa, số lỗi; giờ có mặt lấy từ chấm công) ---------- */
var XUONG={HT:'Hoàn thiện',SON:'Sơn',DG:'Đóng gói'};
var CD={MB:['Mài bóng',50,'HT'],LR:['Lắp ráp',45,'HT'],KH:['Kiểm hàng',150,'HT'],SL:['Sơn lót',120,'SON'],SP:['Sơn phủ',100,'SON'],PS:['Pha sơn',0,'SON'],DH:['Đóng hộp',110,'DG'],DT:['Dán tem',300,'DG']};
var NV=[['CN201','Đỗ Thị Hoa','HT'],['CN202','Ngô Văn Hùng','HT'],['CN203','Bùi Ngọc Hiếu','HT'],['CN204','Lê Thị Linh','HT'],['CN205','Phạm Văn Long','HT'],['CN206','Trần Thị Bình','HT'],
  ['CN211','Vũ Đức Nam','SON'],['CN212','Hoàng Thị Mai','SON'],['CN213','Đặng Thị Nga','SON'],['CN214','Nguyễn Văn An','SON'],['CN215','Đỗ Minh Quân','SON'],
  ['CN221','Vũ Thị Hà','DG'],['CN222','Bùi Văn Phúc','DG'],['CN223','Ngô Thị Tâm','DG'],['CN224','Lê Đức Cường','DG'],['CN225','Phạm Thu Dung','DG']];
var hat=17; function nn(){ hat=(hat*9301+49297)%233280; return hat/233280 }
var NGAY=['2026-09-28','2026-09-29','2026-09-30','2026-10-01'], CD_X={HT:['MB','LR','KH'],SON:['SL','SP'],DG:['DH','DT']};
var NHOM=[], md=1;
function them(nv,ngay,gio,dong,tb){ var n=NV.filter(function(x){return x[0]===nv})[0]; NHOM=NHOM.filter(function(g){return g.k!==nv+'_'+ngay}); NHOM.push({k:nv+'_'+ngay,ma:nv,ten:n[1],x:n[2],ngay:ngay,gio:gio,tb:tb,dong:dong.map(function(d){ return {id:'D'+(md++),cd:d[0],sl:d[1],loi:d[2]||0,sl0:d[1],loi0:d[2]||0} })}) }
// Nhóm bình thường: sinh tự động quanh 85–110% định mức
NV.forEach(function(n,i){ NGAY.slice(i%3===0?0:1,i%2?3:4).forEach(function(ng,j){ if(NHOM.length>=19) return; var cds=CD_X[n[2]], gio=8, muc=.86+nn()*.24, so=2+(nn()>.6&&cds.length>2?1:0), chia=so===3?[.4,.35,.25]:[.6,.4];
    var dong=cds.slice(0,so).map(function(c,k){ return [c,Math.round(CD[c][1]*gio*chia[k]*muc),nn()>.8?1:0] }); them(n[0],ng,gio,dong,Math.round((88+nn()*14)*10)/10); }) });
// Các trường hợp cần xem (giống lỗi hay gặp thật)
them('CN205','2026-09-30',8,[['KH',5200,0],['LR',150,2]],96.5);           // gõ thừa số 0 → 5.200 (đúng là 520)
them('CN203','2026-09-29',0,[['MB',260,3],['LR',120,0]],91.2);            // chấm công nghỉ phép nhưng có sản lượng
them('CN213','2026-10-01',8,[['SL',520,0],['PS',40,0]],94.0);            // công đoạn Pha sơn chưa có định mức
them('CN224','2026-09-30',8,[['DH',610,74],['DT',700,6]],90.3);          // lỗi 12% ở Đóng hộp
them('CN212','2026-09-28',8,[['SL',210,1],['SP',140,0]],89.4);           // hiệu suất thấp bất thường
them('CN222','2026-10-01',8,[['DH',420,2],['DH',420,2],['DT',600,0]],97.8); // nhập trùng công đoạn
them('CN225','2026-09-29',4,[['DT',1000,0],['DH',190,1]],92.6);           // nửa ngày nhưng sản lượng như cả ngày
var TONG_DONG=NHOM.reduce(function(s,g){return s+g.dong.length},0), GOC=JSON.parse(JSON.stringify(NHOM)); // bản gốc để dựng tab "Bản hiện tại"

/* ---------- Tính hiệu suất & cờ ---------- */
function tinh(g){ var gc=0, coDM=false, sl=0, loi=0; g.dong.forEach(function(d){ var dm=CD[d.cd][1]; sl+=d.sl; loi+=d.loi; if(dm>0){ coDM=true; gc+=Math.max(0,d.sl-d.loi)/dm } });
  return {sl:sl,loi:loi,hs:(coDM&&g.gio>0)?gc/g.gio*100:null}; }
function co(g){ var t=tinh(g), c=[], thay={};
  if(g.gio===0&&t.sl>0) c.push({n:1,ngan:'Nghỉ theo chấm công',dai:'Chấm công ghi <b>nghỉ cả ngày</b> nhưng có '+soN(t.sl)+' sản phẩm. Kiểm tra lại chấm công hoặc ngày nhập.'});
  if(t.hs!==null&&t.hs>130) c.push({n:1,ngan:'Hiệu suất '+Math.round(t.hs)+'%',dai:'Hiệu suất <b>'+so1(t.hs)+'%</b> – cao bất thường (người này thường '+so1(g.tb)+'%). Hay gặp: gõ thừa số 0.'});
  if(t.hs!==null&&t.hs<60&&g.gio>0) c.push({n:0,ngan:'Hiệu suất '+Math.round(t.hs)+'%',dai:'Hiệu suất <b>'+so1(t.hs)+'%</b> – thấp bất thường (người này thường '+so1(g.tb)+'%). Có thể thiếu công đoạn hoặc máy dừng.'});
