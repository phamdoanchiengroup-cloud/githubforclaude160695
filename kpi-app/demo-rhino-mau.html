<body><div class="wrap"><h1>Chọn mẫu nhân vật tê giác Rhino</h1>
<p class="mo">6 mẫu vẽ bằng AI, mỗi mẫu một phong cách. Đây mới là hình để chọn, chưa gắn hiệu ứng hay vào web. Anh/chị chọn mẫu ưng nhất (hoặc kết hợp, ví dụ "dáng mẫu 4 + mũ bảo hộ mẫu 2"), tôi sẽ vẽ thêm các tư thế cùng phong cách đó.</p>
