<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đồng hồ hiệu suất</title>
<!-- MẪU ĐÃ CHỌN (02/10/2026): Đồng hồ hiệu suất công đoạn, kim lò xo. Chủ dự án duyệt để đưa vào web.
     Khi gắn vào web: lấy số thật từ phanTichDinhMuc (hiệu suất thực tế / định mức theo công đoạn).
     Số liệu trong file này là số MẪU. SVG/CSS/JS thuần, không thư viện ngoài. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121518;--s1:#1a1e22;--s2:#21262b;--s3:#2a3036;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --t1:#eef2f4;--t2:#aab5bc;--t3:#7b8891;
  --cy:#2fd3c6;--cy2:#16a89d;--cyr:47,211,198;
  --am:#f0b04e;--rd:#f26b6b;--gr:#5fd49a;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--t1);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 0% -10%,rgba(var(--cyr),.07),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(90,169,255,.04),transparent 60%),var(--bg);
  padding:36px 18px 70px}
.so{font-feature-settings:'tnum' 1,'cv11' 1;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.dau{max-width:1240px;margin:0 auto 26px}
.dau .mat{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.dau h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:8px 0 8px}
.dau p{color:var(--t2);max-width:760px;font-size:14.5px}
.luoi{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px;align-items:start}
.demo{position:relative;min-width:0;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 140px),var(--s1);border:1px solid var(--bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 40px 70px -50px rgba(0,0,0,.9)}
.demo-dau{display:flex;gap:12px;align-items:flex-start}
.stt{flex:none;font-size:11px;font-weight:600;color:var(--t3);border:1px solid var(--bd2);border-radius:8px;padding:5px 7px;line-height:1}
.demo h2{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.demo .vi{color:var(--t2);font-size:13px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11.5px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;line-height:1.5}
.chip.cy{color:var(--cy);border-color:rgba(var(--cyr),.28);background:rgba(var(--cyr),.06)}
.san{position:relative;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--bd);padding:18px;min-height:320px;overflow:hidden}
kbd{font:600 10.5px var(--f);color:var(--t2);background:var(--s3);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:5px;padding:1px 5px}
/* Nút chọn kiểu "segmented" */
.seg{display:inline-flex;position:relative;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--t2);font-size:12.5px;font-weight:500;padding:6px 12px;border-radius:7px;cursor:pointer;transition:color .2s}
.seg button:hover{color:var(--t1)}
.seg button.on{color:var(--t1)}
.seg .tr{position:absolute;top:3px;bottom:3px;left:0;width:0;border-radius:7px;background:var(--s3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 1px 3px rgba(0,0,0,.45);transition:transform .38s var(--ease),width .38s var(--ease)}
.nut{border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.nut:hover{background:var(--s3)}.nut:active{transform:translateY(1px)}
.nut.pri{background:var(--cy);border-color:var(--cy);color:#05211e;font-weight:600}
.nut.pri:hover{background:#45e0d4}
.nut.nho{padding:5px 10px;font-size:12px}
.hang{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ===== 8. Đồng hồ hiệu suất ===== */
.d8{display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:center}
.d8 svg{width:100%;max-width:360px;display:block;margin:0 auto;overflow:visible}
.d8 svg text{fill:var(--t3);font:500 10.5px var(--f)}
.d8-so{text-align:center;margin-top:-6px}
.d8-so b{font-size:40px;font-weight:600;letter-spacing:-.03em;transition:color .3s}
.d8-so b small{font-size:16px;color:var(--t3);font-weight:500}
.d8-so div{font-size:12px;color:var(--t3)}
.d8-cd{display:flex;flex-direction:column;gap:6px}
.d8-cd button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--bd);background:transparent;color:var(--t2);
  padding:10px 12px;border-radius:11px;cursor:pointer;font-size:13px;transition:background .2s,border-color .2s,color .2s}
.d8-cd button small{display:block;font-size:11px;color:var(--t3)}
.d8-cd button em{font-style:normal;font-size:12px;font-weight:600}
.d8-cd button.on{background:rgba(var(--cyr),.08);border-color:rgba(var(--cyr),.35);color:var(--t1)}
.d8-tt{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);margin-top:6px;cursor:pointer;user-select:none}
.d8-tt .cong{width:30px;height:18px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s}
.d8-tt .cong::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--t2);transition:transform .25s var(--ease),background .2s}
.d8-tt.on .cong{background:rgba(var(--cyr),.35)}.d8-tt.on .cong::after{transform:translateX(12px);background:var(--cy)}
.d8-tt .cham{width:7px;height:7px;border-radius:50%;background:var(--rd);opacity:0}
.d8-tt.on .cham{opacity:1;animation:nhay 1.4s infinite}
@keyframes nhay{50%{opacity:.25}}
@media(max-width:600px){.d8{grid-template-columns:1fr}}

.luoi{max-width:760px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="luoi">
<!-- 8 -->
<section class="demo" id="demo8">
  <div class="demo-dau"><span class="stt so">✓</span><div>
    <h2>Đồng hồ hiệu suất công đoạn</h2>
    <div class="vi">Kim chạy như kim đồng hồ thật, có quán tính và nảy nhẹ, chỉ % so với định mức. Vùng đỏ, cam, cyan cho biết ngay đang thiếu, sát hay vượt. Bật "Trực tiếp" để mô phỏng số nhảy theo thời gian thực.</div>
    <div class="chips"><span class="chip cy">Công đoạn & định mức · Phân tích định mức</span></div>
  </div></div>
  <div class="san">
    <div class="d8">
      <div><svg id="d8Svg" viewBox="0 0 320 210"></svg><div class="d8-so"><b class="so" id="d8So">0<small>%</small></b><div class="so" id="d8Phu"></div></div></div>
      <div><div class="d8-cd" id="d8Cd"></div><div class="d8-tt" id="d8Tt"><span class="cong"></span>Trực tiếp<span class="cham"></span></div></div>
    </div>
  </div>
</section>

</main>
<script>
(function(){
'use strict';
var GIAM=false; try{GIAM=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function $(i){return document.getElementById(i)}
function so1(v,n){return Number(v).toLocaleString('vi-VN',{minimumFractionDigits:n===undefined?1:n,maximumFractionDigits:n===undefined?1:n})}
function eOut(t){return 1-Math.pow(1-t,4)}
function eInOut(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function tween(ms,fn,xong,de){ if(GIAM||ms<=0){fn(1);xong&&xong();return function(){}}; var t0=performance.now(),dung=false;
  (function b(t){ if(dung)return; var k=Math.min(1,(t-t0)/ms); fn((de||eOut)(k)); if(k<1)requestAnimationFrame(b); else xong&&xong(); })(t0);
  return function(){dung=true} }
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tbHen=null;
function thongBao(t){var e=$('thongBao');e.textContent=t;e.classList.add('hien');clearTimeout(tbHen);tbHen=setTimeout(function(){e.classList.remove('hien')},2200)}
/* Nút chọn kiểu segmented: thanh nền trượt theo nút đang chọn */
function seg(el,doi){
  var tr=document.createElement('span');tr.className='tr';el.insertBefore(tr,el.firstChild);
  function dat(b,khong){ if(khong)tr.style.transition='none'; tr.style.width=b.offsetWidth+'px'; tr.style.transform='translateX('+(b.offsetLeft-3)+'px)';
    if(khong){void tr.offsetWidth;tr.style.transition=''} }
  var bs=el.querySelectorAll('button');
  bs.forEach(function(b){b.addEventListener('click',function(){ if(b.classList.contains('on'))return;
    bs.forEach(function(x){x.classList.toggle('on',x===b)}); dat(b); doi(b.getAttribute('data-v')); })});
  function lai(){var o=el.querySelector('button.on'); if(o)dat(o,true)}
  lai(); window.addEventListener('resize',lai); if(document.fonts&&document.fonts.ready)document.fonts.ready.then(lai);
}
function an(ten,fn){try{fn()}catch(e){console.error(ten,e)}}

/* =================== 8. ĐỒNG HỒ HIỆU SUẤT =================== */
an('d8',function(){
  var CD=[{t:'Đóng đơn lẻ gậy ngọn',dm:60,tt:62.4},{t:'Sơn tĩnh điện',dm:80,tt:66.1},{t:'Cắt CNC đầu cơ',dm:22,tt:19.3},{t:'Laser check ngọn',dm:90,tt:121.5}];
  var svg=$('d8Svg'), CX=160, CY=150, R=118, A0=-210, A1=30, MAX=150;
  function goc(p){return A0+(A1-A0)*Math.max(0,Math.min(MAX,p))/MAX}
  function dd(a,r){var t=a*Math.PI/180;return [(CX+r*Math.cos(t)).toFixed(2),(CY+r*Math.sin(t)).toFixed(2)]}
  function cung(p0,p1,r){var a=dd(goc(p0),r),b=dd(goc(p1),r),lon=(goc(p1)-goc(p0))>180?1:0;return 'M'+a[0]+','+a[1]+'A'+r+','+r+' 0 '+lon+' 1 '+b[0]+','+b[1]}
  var h='<defs><filter id="d8b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>'+
    '<radialGradient id="d8hub"><stop offset="0" stop-color="#3a434b"/><stop offset="1" stop-color="#20262b"/></radialGradient></defs>';
  h+='<path d="'+cung(0,MAX,R)+'" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="14" stroke-linecap="round"/>';
  [[0,80,'#f26b6b'],[80,100,'#f0b04e'],[100,150,'#2fd3c6']].forEach(function(z){ h+='<path d="'+cung(z[0]+.6,z[1]-.6,R)+'" fill="none" stroke="'+z[2]+'" stroke-opacity=".75" stroke-width="5"/>' });
  for(var p=0;p<=MAX;p+=5){ var lon=p%25===0, a=dd(goc(p),R-14), b=dd(goc(p),R-(lon?26:20));
    h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="rgba(255,255,255,'+(lon?.45:.16)+')" stroke-width="'+(lon?1.6:1)+'"/>';
    if(lon){ var c=dd(goc(p),R-40); h+='<text x="'+c[0]+'" y="'+c[1]+'" text-anchor="middle" dominant-baseline="middle">'+p+'</text>' } }
  h+='<g id="d8Kim"><polygon points="'+CX+','+(CY-4.5)+' '+(CX+R-30)+','+(CY-.8)+' '+(CX+R-30)+','+(CY+.8)+' '+CX+','+(CY+4.5)+' '+(CX-18)+','+(CY+2.5)+' '+(CX-18)+','+(CY-2.5)+'" fill="#eef2f4" filter="drop-shadow(0 2px 3px rgba(0,0,0,.6))"/></g>'+
     '<circle cx="'+CX+'" cy="'+CY+'" r="11" fill="url(#d8hub)" stroke="rgba(255,255,255,.12)"/><circle cx="'+CX+'" cy="'+CY+'" r="3.5" fill="#2fd3c6"/>';
  svg.innerHTML=h;
  var kim=$('d8Kim'), goc0=goc(0), v=0, dich=0, raf=null, chon=0, truc=false, henTT=null, dangPct=0;
  function veKim(a){kim.setAttribute('transform','rotate('+a.toFixed(2)+' '+CX+' '+CY+')')}
  veKim(goc0);
  function mauP(p){return p<80?'var(--rd)':p<100?'var(--am)':'var(--cy)'}
  function so(p,cd,tt){ var b=$('d8So'); b.innerHTML=Math.round(p)+'<small>%</small>'; b.style.color=mauP(p);
    $('d8Phu').textContent=so1(tt)+' / '+cd.dm+' cái/giờ (định mức)'; }
  var a=goc0;
  function lap(){ raf=null; var k=170, c=15, dt=1/60; var f=-k*(a-dich)-c*v; v+=f*dt; a+=v*dt;     // lò xo có giảm chấn: nảy nhẹ rồi dừng
    veKim(a); var p=(a-A0)/(A1-A0)*MAX; so(Math.max(0,p),CD[chon],CD[chon].dm*Math.max(0,p)/100);
    if(Math.abs(a-dich)>.02||Math.abs(v)>.02) raf=requestAnimationFrame(lap); else { a=dich; veKim(a); so(dangPct,CD[chon],CD[chon].dm*dangPct/100); } }
  function den(pct){ dangPct=pct; dich=goc(pct); if(GIAM){a=dich;veKim(a);so(pct,CD[chon],CD[chon].dm*pct/100);return} if(!raf) raf=requestAnimationFrame(lap); }
  var el=$('d8Cd');
  el.innerHTML=CD.map(function(c,i){var p=c.tt/c.dm*100;return '<button data-i="'+i+'"'+(i===0?' class="on"':'')+'><span>'+c.t+'<small class="so">Định mức '+c.dm+' cái/giờ</small></span><em class="so" style="color:'+mauP(p)+'">'+Math.round(p)+'%</em></button>'}).join('');
  el.querySelectorAll('button').forEach(function(b){b.addEventListener('click',function(){ chon=Number(b.getAttribute('data-i')); el.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)});
    den(CD[chon].tt/CD[chon].dm*100); })});
  $('d8Tt').addEventListener('click',function(){ truc=!truc; this.classList.toggle('on',truc); clearInterval(henTT);
    if(truc) henTT=setInterval(function(){ var c=CD[chon], p=c.tt/c.dm*100+(Math.random()-.5)*7; den(p); },1500); else den(CD[chon].tt/CD[chon].dm*100); });
  setTimeout(function(){den(CD[0].tt/CD[0].dm*100)},300);
  window.__d8={so:function(){return $('d8So').textContent},goc:function(){return a}};
});
})();
</script>
</body>
</html>
