<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đồng hồ lật đếm ngược</title>
<!-- MẪU ĐÃ CHỌN (02/10/2026, demo-3 số 8): đồng hồ lật đếm ngược hạn điểm danh 9:00 / nhập sản lượng 17:00 / chốt tháng.
     Khi gắn vào web: giờ hạn lấy theo cấu hình hạn của web (giờ Việt Nam), ngày chốt tháng lấy từ lịch chốt kỳ. Đặt ở Việc hôm nay.
     Giờ tính theo giờ Việt Nam. SVG/CSS/JS thuần, không thư viện ngoài. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121518;--s1:#1a1e22;--s2:#21262b;--s3:#2a3036;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --t1:#eef2f4;--t2:#aab5bc;--t3:#7b8891;
  --cy:#2fd3c6;--cy2:#16a89d;--cyr:47,211,198;
  --am:#f0b04e;--rd:#f26b6b;--gr:#5fd49a;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--t1);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 0% -10%,rgba(var(--cyr),.07),transparent 60%),var(--bg);padding:36px 18px 70px}
.so{font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.dau{max-width:1240px;margin:0 auto 26px}
.dau .mat{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.dau h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:8px 0 8px}
.dau p{color:var(--t2);max-width:780px;font-size:14.5px}
.luoi{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px;align-items:start}
.demo{position:relative;min-width:0;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 140px),var(--s1);border:1px solid var(--bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 40px 70px -50px rgba(0,0,0,.9)}
.demo-dau{display:flex;gap:12px;align-items:flex-start}
.stt{flex:none;font-size:11px;font-weight:600;color:var(--t3);border:1px solid var(--bd2);border-radius:8px;padding:5px 7px;line-height:1}
.demo h2{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.demo .vi{color:var(--t2);font-size:13px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11.5px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;line-height:1.5}
.chip.cy{color:var(--cy);border-color:rgba(var(--cyr),.28);background:rgba(var(--cyr),.06)}
.san{position:relative;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--bd);padding:18px;overflow:hidden}
.hang{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nut{border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:background .15s}
.nut:hover{background:var(--s3)}.nut.on{background:rgba(var(--cyr),.12);border-color:rgba(var(--cyr),.4);color:var(--cy)}
.nho{font-size:12px;color:var(--t3)}
.cong{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);cursor:pointer;user-select:none}
.cong i{width:30px;height:18px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s}
.cong i::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--t2);transition:transform .25s var(--ease),background .2s}
.cong.on i{background:rgba(var(--cyr),.35)}.cong.on i::after{transform:translateX(12px);background:var(--cy)}
.cong b{width:7px;height:7px;border-radius:50%;background:var(--rd);opacity:0}
.cong.on b{opacity:1;animation:nhay 1.4s infinite}
@keyframes nhay{50%{opacity:.25}}
svg text{font-family:var(--f)}

/* ===== 8. Đồng hồ lật ===== */
.c8{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}
.c8-nhom{display:flex;flex-direction:column;align-items:center;gap:6px}.c8-so{display:flex;gap:5px}.c8-nh{font-size:10.5px;color:var(--t3);letter-spacing:.12em;text-transform:uppercase}
.c8-cham{font-size:40px;font-weight:600;color:var(--t3);margin-top:-30px}
.c8-nhan{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.lat{position:relative;width:54px;height:80px;perspective:300px;font-size:58px;font-weight:600;color:#f2f5f7;line-height:80px;text-align:center}
.lat .n,.lat .l{position:absolute;left:0;right:0;height:50%;overflow:hidden;background:linear-gradient(180deg,#2a3137,#1f2429);border-radius:8px 8px 0 0}
.lat .l{top:50%;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#1b1f23,#23292e)}
.lat .l span{display:block;transform:translateY(-50%)}
.lat .n span{display:block}
.lat .tren,.lat .duoi{position:absolute;left:0;right:0;height:50%;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.lat .tren{top:0;transform-origin:50% 100%;background:linear-gradient(180deg,#2a3137,#1f2429);border-radius:8px 8px 0 0;z-index:2}
.lat .duoi{top:50%;transform-origin:50% 0;background:linear-gradient(180deg,#1b1f23,#23292e);border-radius:0 0 8px 8px;transform:rotateX(90deg);z-index:2}
.lat .duoi span{display:block;transform:translateY(-50%)}
.lat.chay .tren{animation:latTren .3s ease-in forwards}
.lat.chay .duoi{animation:latDuoi .3s .3s ease-out forwards}
@keyframes latTren{to{transform:rotateX(-90deg)}}
@keyframes latDuoi{to{transform:rotateX(0)}}
.lat::after{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55);z-index:3}
.lat::before{content:'';position:absolute;inset:0;border-radius:8px;box-shadow:0 6px 14px -4px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.05);z-index:4;pointer-events:none}
.c8.qua .lat{color:#ffb4b4}
.c8-nho{display:none}
.c8-tt{text-align:center;margin-top:14px;font-size:13px;color:var(--t2)}
.c8-tt b{color:var(--t1)}.c8-tt .do{color:var(--rd)}
@media(max-width:480px){.c8{gap:4px}.c8-so{gap:3px}.lat{width:34px;height:54px;font-size:36px;line-height:54px}.c8-cham{font-size:24px;margin-top:-24px}}


.cuoi{max-width:1240px;margin:26px auto 0;color:var(--t3);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="luoi" style="grid-template-columns:minmax(0,640px);justify-content:center">
<section class="demo" id="demo8">
  <div class="demo-dau"><span class="stt so">08</span><div>
    <h2>Đồng hồ lật đếm ngược hạn</h2>
    <div class="vi">Bảng lật như ở nhà ga: còn bao lâu tới hạn điểm danh, hạn nhập sản lượng hay chốt tháng. Quá hạn thì chữ chuyển đỏ và đếm thời gian trễ.</div>
    <div class="chips"><span class="chip cy">Việc hôm nay · màn hình treo tại xưởng</span></div>
  </div></div>
  <div class="san">
    <div class="c8-nhan" id="c8Chon" style="margin-bottom:18px"><button class="nut" data-k="dd">Hạn điểm danh 9:00</button><button class="nut on" data-k="sl">Hạn nhập sản lượng 17:00</button><button class="nut" data-k="chot">Chốt tháng 9</button></div>
    <div class="c8" id="c8"></div>
    <div class="c8-nho" id="c8Nho"></div>
    <div class="c8-tt" id="c8Tt"></div>
  </div>
</section>
</main>
<script>
(function(){
'use strict';
var GIAM=false; try{GIAM=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function $(i){return document.getElementById(i)}
function so1(v,n){n=n===undefined?1:n;return Number(v).toLocaleString('vi-VN',{minimumFractionDigits:n,maximumFractionDigits:n})}
function soN(v){return Math.round(v).toLocaleString('vi-VN')}
function an(ten,fn){try{fn()}catch(e){console.error(ten,e)}}
function hien(el,cb){ try{ new IntersectionObserver(function(es){cb(es[0].isIntersecting)}).observe(el) }catch(e){cb(true)} }
function congTac(el,cb){ el.addEventListener('click',function(){ var on=!el.classList.contains('on'); el.classList.toggle('on',on); cb(on); }); }
function gioVN(){ var d=new Date(Date.now()+7*3600e3); return {h:d.getUTCHours(),m:d.getUTCMinutes(),s:d.getUTCSeconds(),ms:d.getUTCMilliseconds(),ngay:d.getUTCDate(),thang:d.getUTCMonth()+1,nam:d.getUTCFullYear()} }
function mauP(p){return p<80?'#f26b6b':p<100?'#f0b04e':'#2fd3c6'}

/* Đồng hồ kim lò xo dùng chung (cùng kiểu mẫu đã chọn) */
var soDH=0;
function dongHo(svg,o){
  o=Object.assign({cx:160,cy:150,r:118,max:150,vachNho:5,vachLon:25,nhan:true,bang:5,ray:14},o||{}); var id='dh'+(soDH++);
  var A0=-210,A1=30, CX=o.cx, CY=o.cy, R=o.r;
  function goc(p){return A0+(A1-A0)*Math.max(0,Math.min(o.max,p))/o.max}
  function dd(a,r){var t=a*Math.PI/180;return [(CX+r*Math.cos(t)).toFixed(2),(CY+r*Math.sin(t)).toFixed(2)]}
  function cung(p0,p1,r){var a=dd(goc(p0),r),b=dd(goc(p1),r),lon=(goc(p1)-goc(p0))>180?1:0;return 'M'+a[0]+','+a[1]+'A'+r+','+r+' 0 '+lon+' 1 '+b[0]+','+b[1]}
  var k=R/118, h='<defs><radialGradient id="'+id+'h"><stop offset="0" stop-color="#3a434b"/><stop offset="1" stop-color="#20262b"/></radialGradient></defs>';
  h+='<path d="'+cung(0,o.max,R)+'" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="'+(o.ray*k)+'" stroke-linecap="round"/>';
  [[0,80,'#f26b6b'],[80,100,'#f0b04e'],[100,o.max,'#2fd3c6']].forEach(function(z){ h+='<path d="'+cung(z[0]+.6,z[1]-.6,R)+'" fill="none" stroke="'+z[2]+'" stroke-opacity=".75" stroke-width="'+(o.bang*k)+'"/>' });
  for(var p=0;p<=o.max;p+=o.vachNho){ var lon=p%o.vachLon===0, a=dd(goc(p),R-14*k), b=dd(goc(p),R-(lon?26:20)*k);
    h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="rgba(255,255,255,'+(lon?.45:.16)+')" stroke-width="'+(lon?1.6:1)*Math.max(.7,k)+'"/>';
    if(lon&&o.nhan){ var c=dd(goc(p),R-40*k); h+='<text x="'+c[0]+'" y="'+c[1]+'" text-anchor="middle" dominant-baseline="middle">'+p+'</text>' } }
  var L=R-30*k, w=4.5*k;
  h+='<g class="kim"><polygon points="'+CX+','+(CY-w)+' '+(CX+L)+','+(CY-.8*k)+' '+(CX+L)+','+(CY+.8*k)+' '+CX+','+(CY+w)+' '+(CX-18*k)+','+(CY+2.5*k)+' '+(CX-18*k)+','+(CY-2.5*k)+'" fill="#eef2f4" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))"/></g>'+
     '<circle cx="'+CX+'" cy="'+CY+'" r="'+(11*k)+'" fill="url(#'+id+'h)" stroke="rgba(255,255,255,.12)"/><circle cx="'+CX+'" cy="'+CY+'" r="'+(3.5*k)+'" fill="#2fd3c6"/>';
  svg.innerHTML=h;
  var kim=svg.querySelector('.kim'), a=goc(0), v=0, dich=a, raf=null, theo=null;
  function veKim(){kim.setAttribute('transform','rotate('+a.toFixed(2)+' '+CX+' '+CY+')')}
  veKim();
  function lap(){ raf=null; var f=-170*(a-dich)-15*v; v+=f/60; a+=v/60; veKim(); theo&&theo((a-A0)/(A1-A0)*o.max);
    if(Math.abs(a-dich)>.02||Math.abs(v)>.02) raf=requestAnimationFrame(lap); else { a=dich; veKim(); theo&&theo((a-A0)/(A1-A0)*o.max,true); } }
  return { den:function(p){ dich=goc(p); if(GIAM){a=dich;veKim();theo&&theo(p,true);return} if(!raf) raf=requestAnimationFrame(lap); },
           theo:function(f){theo=f}, pct:function(){return (a-A0)/(A1-A0)*o.max} };
}

/* =================== 8. ĐỒNG HỒ LẬT =================== */
an('c8',function(){
  var el=$('c8'), che='sl', o=[];
  function dung(soO){ el.innerHTML=''; o=[]; var nhom=soO===3?[2,2,2]:[2,2,2];
    nhom.forEach(function(n,gi){ if(gi) el.insertAdjacentHTML('beforeend','<span class="c8-cham">:</span>'); var g=document.createElement('div'); g.className='c8-nhom'; var hs=document.createElement('div'); hs.className='c8-so';
      for(var i=0;i<n;i++){ var c=document.createElement('div'); c.className='lat'; c.innerHTML='<div class="n"><span>0</span></div><div class="l"><span>0</span></div><div class="tren"><span>0</span></div><div class="duoi"><span>0</span></div>'; c.__v='0'; hs.appendChild(c); o.push(c); }
      g.appendChild(hs); g.insertAdjacentHTML('beforeend','<span class="c8-nh"></span>'); el.appendChild(g); }); }
  function dat(c,v){ if(c.__v===v)return; var cu=c.__v; c.__v=v;
    var n=c.querySelector('.n span'), l=c.querySelector('.l span'), tr=c.querySelector('.tren span'), du=c.querySelector('.duoi span');
    if(GIAM){ n.textContent=l.textContent=tr.textContent=du.textContent=v; return; }
    tr.textContent=cu; n.textContent=v; du.textContent=v; l.textContent=cu;
    c.classList.remove('chay'); void c.offsetWidth; c.classList.add('chay');
    clearTimeout(c.__h); c.__h=setTimeout(function(){ l.textContent=v; tr.textContent=v; c.classList.remove('chay'); },620); }
  function han(){ var g=gioVN(), bay=Date.UTC(g.nam,g.thang-1,g.ngay,g.h,g.m,g.s);
    if(che==='dd') return {dich:Date.UTC(g.nam,g.thang-1,g.ngay,9,0,0),ten:'hạn điểm danh 9:00 hôm nay',bay:bay};
    if(che==='sl') return {dich:Date.UTC(g.nam,g.thang-1,g.ngay,17,0,0),ten:'hạn nhập sản lượng 17:00 hôm nay',bay:bay};
    return {dich:Date.UTC(2026,9,3,23,0,0),ten:'chốt tháng 9 chính thức (23:00 ngày 03/10/2026, ngày làm việc thứ 3 của tháng 10)',bay:bay}; }
  function ve(){ var h=han(), con=Math.round((h.dich-h.bay)/1000), qua=con<0; con=Math.abs(con);
    var a,b,c,nhan; if(che==='chot'){ a=Math.floor(con/86400); b=Math.floor(con%86400/3600); c=Math.floor(con%3600/60); nhan=['ngày','giờ','phút']; }
    else { a=Math.floor(con/3600); b=Math.floor(con%3600/60); c=con%60; nhan=['giờ','phút','giây']; }
    var s=[a,b,c].map(function(x){return String(Math.min(99,x)).padStart(2,'0')}).join('');
    for(var i=0;i<6;i++) dat(o[i],s[i]);
    el.classList.toggle('qua',qua);
    el.querySelectorAll('.c8-nh').forEach(function(x,i){x.textContent=nhan[i]});
    $('c8Tt').innerHTML=qua?'<span class="do">Đã quá '+h.ten+'</span> · đang đếm thời gian trễ':'Còn lại tới <b>'+h.ten+'</b>'; }
  dung(); ve(); setInterval(ve,1000);
  $('c8Chon').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ che=b.getAttribute('data-k'); $('c8Chon').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)}); ve(); }) });
  window.__c8={so:function(){return o.map(function(c){return c.__v}).join('')},tt:function(){return $('c8Tt').textContent}};
});
})();
</script>
</body>
</html>
