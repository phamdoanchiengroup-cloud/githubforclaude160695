<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thước trượt định mức</title>
<!-- MẪU ĐÃ CHỌN (02/10/2026, demo-4 số 5): thước trượt định mức công đoạn, kim tam giác lò xo, vạch mờ = kỳ trước.
     Khi gắn vào web: mỗi dòng = một công đoạn trong phanTichDinhMuc (định mức sp/giờ, thực tế, % định mức) theo kỳ Hôm nay / 7 ngày / Tháng; kỳ trước để so sánh. Đặt ở trang Phân tích định mức.
     Số liệu trong file là số MẪU. CSS/JS thuần, không thư viện ngoài. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121518;--s1:#1a1e22;--s2:#21262b;--s3:#2a3036;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.12);
  --t1:#eef2f4;--t2:#aab5bc;--t3:#7b8891;
  --cy:#2fd3c6;--cy2:#16a89d;--cyr:47,211,198;
  --am:#f0b04e;--rd:#f26b6b;--gr:#5fd49a;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;color:var(--t1);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 500px at 0% -10%,rgba(var(--cyr),.07),transparent 60%),var(--bg);padding:36px 18px 70px}
.so{font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums}
button{font-family:inherit}
.dau{max-width:1240px;margin:0 auto 26px}
.dau .mat{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--cy)}
.dau h1{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:8px 0 8px}
.dau p{color:var(--t2);max-width:780px;font-size:14.5px}
.luoi{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:20px;align-items:start}
.demo{position:relative;min-width:0;border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,0) 140px),var(--s1);border:1px solid var(--bd);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 40px 70px -50px rgba(0,0,0,.9)}
.demo-dau{display:flex;gap:12px;align-items:flex-start}
.stt{flex:none;font-size:11px;font-weight:600;color:var(--t3);border:1px solid var(--bd2);border-radius:8px;padding:5px 7px;line-height:1}
.demo h2{font-size:16px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.demo .vi{color:var(--t2);font-size:13px;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.chip{font-size:11.5px;color:var(--t2);background:var(--s2);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;line-height:1.5}
.chip.cy{color:var(--cy);border-color:rgba(var(--cyr),.28);background:rgba(var(--cyr),.06)}
.san{position:relative;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--bd);padding:18px;overflow:hidden}
.hang{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nut{border:1px solid var(--bd2);background:var(--s2);color:var(--t1);font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:background .15s}
.nut:hover{background:var(--s3)}.nut.on{background:rgba(var(--cyr),.12);border-color:rgba(var(--cyr),.4);color:var(--cy)}
.nho{font-size:12px;color:var(--t3)}
.cong{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);cursor:pointer;user-select:none}
.cong i{width:30px;height:18px;border-radius:999px;background:var(--s3);position:relative;transition:background .2s}
.cong i::after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:var(--t2);transition:transform .25s var(--ease),background .2s}
.cong.on i{background:rgba(var(--cyr),.35)}.cong.on i::after{transform:translateX(12px);background:var(--cy)}
.cong b{width:7px;height:7px;border-radius:50%;background:var(--rd);opacity:0}
.cong.on b{opacity:1;animation:nhay 1.4s infinite}
@keyframes nhay{50%{opacity:.25}}
svg text{font-family:var(--f)}


/* ===== 5. Thước trượt định mức ===== */
.b5-dau{display:grid;grid-template-columns:92px 1fr 58px;gap:10px;font-size:10px;color:var(--t3);margin-bottom:4px}
.b5-moc{position:relative;height:14px}.b5-moc span{position:absolute;transform:translateX(-50%)}
.b5-dong{display:grid;grid-template-columns:92px 1fr 58px;gap:10px;align-items:center;padding:6px 0;cursor:pointer;border-radius:8px}
.b5-dong:hover .b5-ten{color:var(--t1)}
.b5-ten{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b5-ray{position:relative;height:22px;border-radius:5px;background:#0d1012;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);overflow:visible}
.b5-vung{position:absolute;inset:0;border-radius:5px;opacity:.28}
.b5-vach{position:absolute;inset:0;border-radius:5px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 1px,transparent 1px var(--b))}
.b5-100{position:absolute;top:-3px;bottom:-3px;width:2px;background:rgba(255,255,255,.55);border-radius:1px}
.b5-ma{position:absolute;top:2px;bottom:2px;width:2px;margin-left:-1px;background:rgba(255,255,255,.28);border-radius:1px}
.b5-kim{position:absolute;top:-6px;bottom:-6px;width:0}
.b5-kim::before{content:'';position:absolute;left:-1px;top:6px;bottom:6px;width:2px;background:var(--c);box-shadow:0 0 6px var(--c)}
.b5-kim::after{content:'';position:absolute;left:-6px;top:-2px;border:6px solid transparent;border-top:8px solid var(--c)}
.b5-gt{font-size:14px;font-weight:600;text-align:right}
.b5-chu{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--t3)}
.b5-chu i{display:inline-block;width:2px;height:12px;vertical-align:middle;margin-right:6px}
.b5-ct{margin-top:10px;font-size:12.5px;color:var(--t2);min-height:20px}.b5-ct b{color:var(--t1)}
@media(max-width:480px){.b5-moc .phu{display:none}.b5-dau,.b5-dong{grid-template-columns:70px 1fr 48px;gap:8px}.b5-ten{font-size:11.5px}.b5-gt{font-size:12.5px}}

.cuoi{max-width:1240px;margin:26px auto 0;color:var(--t3);font-size:12.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="luoi" style="grid-template-columns:minmax(0,640px);justify-content:center">
<section class="demo" id="demo5">
  <div class="demo-dau"><span class="stt so">05</span><div>
    <h2>Thước trượt định mức công đoạn</h2>
    <div class="vi">Mỗi công đoạn một thước đo cơ khí: kim tam giác trượt tới hiệu suất so với định mức, vạch mờ là kỳ trước. Đổi kỳ thì kim trượt có quán tính. Bấm một dòng để xem số chi tiết.</div>
    <div class="chips"><span class="chip cy">Phân tích định mức</span></div>
  </div></div>
  <div class="san">
    <div class="hang" style="margin-bottom:12px"><div style="display:flex;gap:6px;flex-wrap:wrap" id="b5Ky"><button class="nut on" data-k="0">Hôm nay</button><button class="nut" data-k="1">7 ngày</button><button class="nut" data-k="2">Tháng 9</button></div></div>
    <div id="b5"></div>
    <div class="b5-chu"><span><i style="background:var(--cy)"></i>Kỳ đang xem</span><span><i style="background:rgba(255,255,255,.3)"></i>Kỳ trước</span><span><i style="background:rgba(255,255,255,.6)"></i>Định mức 100%</span></div>
    <div class="b5-ct" id="b5Ct"></div>
  </div>
</section>
</main>
<script>
(function(){
'use strict';
var GIAM=false; try{GIAM=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function $(i){return document.getElementById(i)}
function so1(v,n){n=n===undefined?1:n;return Number(v).toLocaleString('vi-VN',{minimumFractionDigits:n,maximumFractionDigits:n})}
function soN(v){return Math.round(v).toLocaleString('vi-VN')}
function an(ten,fn){try{fn()}catch(e){console.error(ten,e)}}
function hien(el,cb){ try{ new IntersectionObserver(function(es){cb(es[0].isIntersecting)}).observe(el) }catch(e){cb(true)} }
function congTac(el,cb){ el.addEventListener('click',function(){ var on=!el.classList.contains('on'); el.classList.toggle('on',on); cb(on); }); }
function gioVN(){ var d=new Date(Date.now()+7*3600e3); return {h:d.getUTCHours(),m:d.getUTCMinutes(),s:d.getUTCSeconds(),ms:d.getUTCMilliseconds(),ngay:d.getUTCDate(),thang:d.getUTCMonth()+1,nam:d.getUTCFullYear()} }
function mauP(p){return p<80?'#f26b6b':p<100?'#f0b04e':'#2fd3c6'}

/* Đồng hồ kim lò xo dùng chung (cùng kiểu mẫu đã chọn) */
var soDH=0;
function dongHo(svg,o){
  o=Object.assign({cx:160,cy:150,r:118,max:150,vachNho:5,vachLon:25,nhan:true,bang:5,ray:14},o||{}); var id='dh'+(soDH++);
  var A0=-210,A1=30, CX=o.cx, CY=o.cy, R=o.r;
  function goc(p){return A0+(A1-A0)*Math.max(0,Math.min(o.max,p))/o.max}
  function dd(a,r){var t=a*Math.PI/180;return [(CX+r*Math.cos(t)).toFixed(2),(CY+r*Math.sin(t)).toFixed(2)]}
  function cung(p0,p1,r){var a=dd(goc(p0),r),b=dd(goc(p1),r),lon=(goc(p1)-goc(p0))>180?1:0;return 'M'+a[0]+','+a[1]+'A'+r+','+r+' 0 '+lon+' 1 '+b[0]+','+b[1]}
  var k=R/118, h='<defs><radialGradient id="'+id+'h"><stop offset="0" stop-color="#3a434b"/><stop offset="1" stop-color="#20262b"/></radialGradient></defs>';
  h+='<path d="'+cung(0,o.max,R)+'" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="'+(o.ray*k)+'" stroke-linecap="round"/>';
  [[0,80,'#f26b6b'],[80,100,'#f0b04e'],[100,o.max,'#2fd3c6']].forEach(function(z){ h+='<path d="'+cung(z[0]+.6,z[1]-.6,R)+'" fill="none" stroke="'+z[2]+'" stroke-opacity=".75" stroke-width="'+(o.bang*k)+'"/>' });
  for(var p=0;p<=o.max;p+=o.vachNho){ var lon=p%o.vachLon===0, a=dd(goc(p),R-14*k), b=dd(goc(p),R-(lon?26:20)*k);
    h+='<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'" stroke="rgba(255,255,255,'+(lon?.45:.16)+')" stroke-width="'+(lon?1.6:1)*Math.max(.7,k)+'"/>';
    if(lon&&o.nhan){ var c=dd(goc(p),R-40*k); h+='<text x="'+c[0]+'" y="'+c[1]+'" text-anchor="middle" dominant-baseline="middle">'+p+'</text>' } }
  var L=R-30*k, w=4.5*k;
  h+='<g class="kim"><polygon points="'+CX+','+(CY-w)+' '+(CX+L)+','+(CY-.8*k)+' '+(CX+L)+','+(CY+.8*k)+' '+CX+','+(CY+w)+' '+(CX-18*k)+','+(CY+2.5*k)+' '+(CX-18*k)+','+(CY-2.5*k)+'" fill="#eef2f4" style="filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))"/></g>'+
     '<circle cx="'+CX+'" cy="'+CY+'" r="'+(11*k)+'" fill="url(#'+id+'h)" stroke="rgba(255,255,255,.12)"/><circle cx="'+CX+'" cy="'+CY+'" r="'+(3.5*k)+'" fill="#2fd3c6"/>';
  svg.innerHTML=h;
  var kim=svg.querySelector('.kim'), a=goc(0), v=0, dich=a, raf=null, theo=null;
  function veKim(){kim.setAttribute('transform','rotate('+a.toFixed(2)+' '+CX+' '+CY+')')}
  veKim();
  function lap(){ raf=null; var f=-170*(a-dich)-15*v; v+=f/60; a+=v/60; veKim(); theo&&theo((a-A0)/(A1-A0)*o.max);
    if(Math.abs(a-dich)>.02||Math.abs(v)>.02) raf=requestAnimationFrame(lap); else { a=dich; veKim(); theo&&theo((a-A0)/(A1-A0)*o.max,true); } }
  return { den:function(p){ dich=goc(p); if(GIAM){a=dich;veKim();theo&&theo(p,true);return} if(!raf) raf=requestAnimationFrame(lap); },
           theo:function(f){theo=f}, pct:function(){return (a-A0)/(A1-A0)*o.max} };
}


function loxo(n,dt){ var f=-170*(n.p-n.d)-15*n.v; n.v+=f*dt; n.p+=n.v*dt; }

/* =================== 5. THƯỚC TRƯỢT ĐỊNH MỨC =================== */
an('b5',function(){
  var CD=[['Cắt phôi',140,[104.2,101.5,101.9,99.8,100.6,98.4]],['Tiện thô',96,[96.8,95.1,95.9,97.2,97.4,96.0]],['Phay CNC',60,[112.5,108.9,108.1,104.6,106.3,103.2]],['Mài',110,[88.1,90.4,90.0,91.3,91.2,92.8]],
    ['Sơn lót',120,[79.4,83.6,82.1,84.9,85.0,86.2]],['Sơn phủ',100,[83.0,84.2,84.8,83.1,86.7,85.5]],['In UV',180,[101.3,99.0,99.6,98.0,98.2,97.1]],['Đóng gói',300,[91.6,88.7,89.4,90.9,90.3,89.0]]];
  var KY=['hôm qua','7 ngày trước đó','tháng 8'], LO=50, HI=130, ky=0, chon=-1, el=$('b5'), raf=null;
  function pos(v){return (Math.max(LO,Math.min(HI,v))-LO)/(HI-LO)*100}
  var vung='linear-gradient(90deg,#f26b6b 0 '+pos(80)+'%,#f0b04e '+pos(80)+'% '+pos(100)+'%,#2fd3c6 '+pos(100)+'% 100%)';
  var moc=''; for(var m=LO;m<=HI;m+=10) moc+='<span'+(m%20?' class="phu"':'')+' style="left:'+pos(m)+'%">'+m+'</span>';
  el.innerHTML='<div class="b5-dau"><span>Công đoạn</span><div class="b5-moc">'+moc+'</div><span></span></div>'+
    CD.map(function(c,i){ return '<div class="b5-dong" data-i="'+i+'"><span class="b5-ten">'+c[0]+'</span><div class="b5-ray"><div class="b5-vung" style="background:'+vung+'"></div><div class="b5-vach" style="--b:calc(100% / 16)"></div>'+
      '<div class="b5-100" style="left:calc('+pos(100)+'% - 1px)"></div><div class="b5-ma"></div><div class="b5-kim"></div></div><span class="b5-gt so"></span></div>' }).join('');
  var dong=[].map.call(el.querySelectorAll('.b5-dong'),function(d,i){ return {el:d,kim:d.querySelector('.b5-kim'),ma:d.querySelector('.b5-ma'),gt:d.querySelector('.b5-gt'),p:LO,v:0,d:LO} });
  function lap(){ raf=null; var chay=false; dong.forEach(function(r){ for(var i=0;i<2;i++) loxo(r,1/120); if(Math.abs(r.p-r.d)>.02||Math.abs(r.v)>.02) chay=true; else {r.p=r.d;r.v=0} r.kim.style.left=pos(r.p)+'%'; });
    if(chay) raf=requestAnimationFrame(lap); }
  function ve(){ dong.forEach(function(r,i){ var v=CD[i][2][ky*2], tr=CD[i][2][ky*2+1]; r.d=v; r.ma.style.left=pos(tr)+'%'; r.kim.style.setProperty('--c',mauP(v)); r.gt.textContent=so1(v)+'%'; r.gt.style.color=mauP(v);
      if(GIAM){ r.p=v; r.kim.style.left=pos(v)+'%'; } });
    if(!GIAM&&!raf) raf=requestAnimationFrame(lap); ct(); }
  function ct(){ if(chon<0){ var duoi=dong.filter(function(r,i){return CD[i][2][ky*2]<80}).length, dat=dong.filter(function(r,i){return CD[i][2][ky*2]>=100}).length;
      $('b5Ct').innerHTML='<b>'+dat+'</b> công đoạn đạt định mức, <b style="color:var(--rd)">'+duoi+'</b> công đoạn dưới 80%. Bấm một dòng để xem chi tiết.'; return; }
    var c=CD[chon], v=c[2][ky*2], tr=c[2][ky*2+1], d=v-tr;
    $('b5Ct').innerHTML='<b>'+c[0]+'</b>: định mức '+soN(c[1])+' sp/giờ, thực tế '+soN(c[1]*v/100)+' sp/giờ (<b style="color:'+mauP(v)+'">'+so1(v)+'%</b>). So với '+KY[ky]+' ('+so1(tr)+'%): <b style="color:'+(d>=0?'var(--gr)':'var(--rd)')+'">'+(d>=0?'▲ ':'▼ ')+so1(Math.abs(d))+' điểm</b>.'; }
  dong.forEach(function(r,i){ r.el.addEventListener('click',function(){ chon=(chon===i?-1:i); ct(); }) });
  $('b5Ky').querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ ky=Number(b.getAttribute('data-k')); $('b5Ky').querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b)}); ve(); }) });
  var daVe=false; hien(el,function(on){ if(on&&!daVe){ daVe=true; ve(); } });
  window.__b5={gt:function(){return dong.map(function(r){return r.gt.textContent})},kim:function(){return dong.map(function(r){return Math.round(r.p*10)/10})},ct:function(){return $('b5Ct').textContent}};
});
})();
</script>
</body>
</html>
