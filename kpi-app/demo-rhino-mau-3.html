<body><div class="wrap"><h1>Mẫu 3 – đổi cây cơ</h1>
<p class="mo">Bản gốc và 2 bản đổi cây cơ. Vì vẽ bằng AI nên mỗi lần vẽ, khuôn mặt và dáng có thể lệch nhẹ. Khi anh/chị chọn xong, tôi sẽ lấy đúng bản đó làm chuẩn để vẽ các tư thế khác.</p>
