<style>

.vh-nho-it .btn{min-height:40px}
@media (max-width:700px){ .vh-the{padding:10px} }
/* B2: điện thoại – mỗi công đoạn là 1 khối: dòng trên chọn công đoạn, dòng dưới số lượng · số lỗi · nút +/− (không tràn ngang) */
@media (max-width:600px){
  #cf_grid .tw{overflow:visible}
  #cf_grid table{min-width:0!important;width:100%}
  #cf_grid thead{display:none}
  #cf_grid tbody{display:block}
  #cf_grid tr{display:grid;grid-template-columns:22px 1fr 1fr auto;grid-template-areas:"so cd cd cd" "so sl loi nut";gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line)}
  #cf_grid td{display:block;padding:0!important;border:0!important;text-align:left!important}
  #cf_grid td:nth-child(1){grid-area:so;padding-top:12px!important}
  #cf_grid td:nth-child(2){grid-area:cd}
  #cf_grid td:nth-child(3){grid-area:sl}
  #cf_grid td:nth-child(4){grid-area:loi}
  #cf_grid td:nth-child(5){grid-area:nut;display:flex;gap:6px;align-items:flex-end}

  #cf_grid td:nth-child(4)::before{content:'Số lỗi';display:block;font-size:12px;color:var(--ink2);margin-bottom:3px}
  #cf_grid .cn-o{width:100%!important;box-sizing:border-box}
}

<script>
/* ===== 23. VẬN HÀNH / DỄ DÙNG / ĐỘNG VIÊN / HỘI NHẬP (chủ dự án duyệt 18/10 – kpi-app/TU-VAN-VAN-HANH.md) ===== */

/* Chèn một khối HTML ngay dưới tiêu đề trang đang mở */
function vhChen(html, id){
  var m=$('main'); if(!m)return null;
  if(id&&$(id)){ $(id).outerHTML=html; return $(id); }
  var dau=m.querySelector('.mai-bang')||m.querySelector('.pdesc')||m.querySelector('.hn-dau')||m.querySelector('.ptitle');
  var d=document.createElement('div'); d.innerHTML=html; var el=d.firstChild;
  if(dau&&dau.parentNode===m) m.insertBefore(el,dau.nextSibling); else m.insertBefore(el,m.firstChild);
  return el;
}
function vhGoi(fn,args,cb){
  var g=google.script.run.withSuccessHandler(function(r){ if(r&&r.hetHan){try{hetHan()}catch(e){} return} cb(r||{}); }).withFailureHandler(function(){});
  g[fn].apply(g,[TOKEN].concat(args||[]));
}

/* ---------- A1. Định mức áp dụng NGÀY nD (định mức cũ còn trong lịch sử) ---------- */
function dmNgay(maCD,nD){
  var ls=D.lsDM||[];
  for(var i=0;i<ls.length;i++){ var x=ls[i]; if(x.MaCD===maCD&&nD<=x.DenNgay&&(!x.TuNgay||nD>=x.TuNgay)) return Number(x.DinhMucGio)||0; }
  return dm(maCD);
}

/* ---------- D2 + D3. Học việc 1 tháng kể từ ngày vào làm ---------- */
function vhHetHocViec(maNV){
  var v=String((nv(maNV)||{}).NgayVaoLam||''); v=v?ngay(v):''; if(!/^\d{4}-\d\d-\d\d$/.test(v))return '';
  var p=v.split('-'), y=+p[0], m=+p[1]+1, d=+p[2]; if(m>12){m-=12;y++;}
  var cuoi=new Date(Date.UTC(y,m,0)).getUTCDate();
  return y+'-'+('0'+m).slice(-2)+'-'+('0'+Math.min(d,cuoi)).slice(-2);
}
function vhHocViec(){ if(!ME||ME.vaiTro!=='CN')return false; var h=vhHetHocViec(ME.maNV); return !!h&&today()<h; }
function vhMaiHocViec(){
  var h=vhHetHocViec(ME.maNV);
  return '<div class="mai-bang" style="margin-top:12px">'+(maiTat()?'':maiHinh('vui'))+'<div class="nd"><small>Tháng học việc · tới '+dmy(h)+'</small>'+
    '<div class="kh" style="font-weight:500">Bạn đang trong <b>tháng học việc</b>: KPI vẫn tính để bạn xem tiến bộ, nhưng <b>chưa xếp loại</b> và nhập trễ <b>không bị phạt</b>. Cứ làm quen từ từ, có gì hỏi trưởng phòng nhé!</div></div></div>';
}

/* ---------- B3. Lỗi ngay tại ô ---------- */
function cnBoLoi(){
  [].forEach.call(document.querySelectorAll('#cf_grid .cn-sai'),function(o){o.classList.remove('cn-sai');o.removeAttribute('aria-invalid');o.removeAttribute('aria-describedby');});
  [].forEach.call(document.querySelectorAll('#cf_grid .cn-loi'),function(x){x.remove();});
}
function cnLoiO(id,msg){
  cnBoLoi();
  var o=$(id); toast(msg,false);
  if(!o)return;
  o.classList.add('cn-sai'); o.setAttribute('aria-invalid','true');
  var p=document.createElement('div'); p.className='cn-loi'; p.id='cnLoiMsg'; p.setAttribute('role','alert'); p.textContent=msg;
  o.parentNode.appendChild(p); o.setAttribute('aria-describedby','cnLoiMsg');
  try{ o.focus({preventScroll:true}); o.scrollIntoView({block:'center',behavior:GIAM_CD()?'auto':'smooth'}); }catch(e){ try{o.focus()}catch(x){} }
  try{ rungONhap(); }catch(e){}
}
/* B6. Xóa dòng có Hoàn tác */
var _vhCnXoa=cnXoaDong;
cnXoaDong=function(i){
  if(cnRows.length<=1){toast('Phải còn ít nhất 1 dòng');return}
  var dong=JSON.parse(JSON.stringify(cnRows[i]));
  cnRows.splice(i,1); cnLuuNhap(); cnVeGrid();
  try{ ttBao('Đã xóa dòng '+(i+1),'Hoàn tác',function(){ cnRows.splice(Math.min(i,cnRows.length),0,dong); cnLuuNhap(); cnVeGrid(); },5000); }catch(e){}
};

/* ---------- C1 + C6. Trang nhập: ngày còn thiếu gấp nhất (chưa quá hạn) + khen cả xưởng ---------- */
var _vhVCNNhap=vCNNhap;
vCNNhap=function(){
  var kq=_vhVCNNhap.apply(this,arguments);
  if(cnNapNhap._da){ cnNapNhap._da=0; try{toast('Đã mở lại số bạn nhập dở lần trước – kiểm tra rồi gửi nhé.',true);}catch(e){} }
  vhChen('<div id="vhHan"></div>');
  vhGoi('hanNhapCuaToi',[],function(r){
    if(!r.ok||tabHienTai!=='cnnhap')return;
    var h='';
    if(r.ds&&r.ds.length){
      var x=r.ds[0], conNua=r.ds.length-1, homNay=r.homNay===x.han;
      var thu=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'][new Date(x.han+'T00:00:00').getDay()];
      h+='<div class="alert a-wn vh-han"><div>Còn ngày <b>'+dmy(x.ngay)+'</b> chưa nhập – hạn <b>17:00 '+(homNay?'hôm nay':thu+' '+dmy(x.han))+'</b>.'+
        (conNua>0?' <span class="nho">(và '+conNua+' ngày nữa)</span>':'')+' Nhập chừng 1 phút thôi.</div>'+
        '<button class="btn pri" onclick="vhNhapNgay(\''+x.ngay+'\')">Nhập ngày '+dmy(x.ngay)+'</button></div>';
      window.__vhCoHan=1;
    }
    if(r.xuong&&r.xuong.tyLe>=85) h+='<div class="note" style="margin:-4px 0 12px">🏭 <b>'+esc(r.xuong.ten)+'</b>: '+r.xuong.tyLe+'% lượt nhập đúng hạn trong '+r.xuong.soNgay+' ngày làm việc gần đây – cả xưởng giữ nhịp tốt!</div>';
    var b=$('vhHan'); if(b)b.innerHTML=h;
  });
  return kq;
};
function vhNhapNgay(nd){
  cnNgay=nd; cnLuuNhap(); var i=$('cf_ngay'); if(i){i.value=nd;}
  var c=$('cf_grid'); if(c){ try{c.scrollIntoView({block:'center',behavior:GIAM_CD()?'auto':'smooth'})}catch(e){} var o=$('cn_sl_0'); if(o)setTimeout(function(){o.focus()},250); }
  toast('Đã chọn ngày '+dmy(nd)+' – nhập số rồi bấm Gửi.',true);
}

/* ---------- A8 + D8. KPI của tôi: ngày chưa duyệt + "hôm qua bạn làm X/Y" ---------- */
var _vhVKPICaNhanToi=vKPICaNhanToi;
vKPICaNhanToi=function(){
  var kq=_vhVKPICaNhanToi.apply(this,arguments);
  try{
    var h='', cho={};
    (D.choDuyet||[]).forEach(function(r){ if(r.MaNV===ME.maNV)cho[ngay(r.Ngay)]=1; });
    var nCho=Object.keys(cho).length;
    if(nCho) h+='<div class="alert a-nu">Còn <b>'+nCho+' ngày</b> chưa được duyệt ('+Object.keys(cho).sort().map(dmy).join(', ')+') – <b>chưa tính vào KPI</b>. Trưởng phòng duyệt xong là KPI tự cập nhật.</div>';
    h+=vhTheDinhMuc();
    if(h) vhChen('<div id="vhKpiToi">'+h+'</div>','vhKpiToi');
  }catch(e){}
  return kq;
};
function vhTheDinhMuc(){
  var cua=(D.nhatky||[]).concat(D.choDuyet||[]).filter(function(r){return r.MaNV===ME.maNV&&String(r.TrangThai).trim()!=='Từ chối'&&ngay(r.Ngay)<today()});
  if(!cua.length)return '';
  var nd=cua.map(function(r){return ngay(r.Ngay)}).sort().pop();
  var ds=cua.filter(function(r){return ngay(r.Ngay)===nd}), gcm=gioCoMatNgay(ME.maNV,nd);
  if(gcm<=0)return '';
  var tgc=0, coDM=false, sl=0;
  ds.forEach(function(r){ var d=dmNgay(r.MaCD,nd);
    sl+=Number(r.SoLuongLamRa)||0; if(d>0){coDM=true; tgc+=Math.max(0,(Number(r.SoLuongLamRa)||0)-ngLoi(r))/d;} });
  if(!coDM)return '';
  var ngayChu=(nd===congNgayFE(today(),-1))?'Hôm qua':'Ngày '+dmy(nd), cau;
  if(ds.length===1){
    var d1=dmNgay(ds[0].MaCD,nd), muc=Math.round(d1*gcm), lam=Math.round(tgc*d1);
    cau=ngayChu+' bạn làm <b>'+lam.toLocaleString('vi-VN')+'/'+muc.toLocaleString('vi-VN')+'</b> cái đạt ở '+esc(cd(ds[0].MaCD).TenCD)+' – '+
      (lam>=muc?'<b>đạt định mức</b>'+(lam>muc?', vượt '+(lam-muc).toLocaleString('vi-VN')+' cái':'')+'!':'còn <b>'+(muc-lam).toLocaleString('vi-VN')+'</b> cái nữa là đạt.');
  } else {
    var pt=Math.round(tgc/gcm*100);
    cau=ngayChu+' bạn làm '+ds.length+' công đoạn, đạt <b>'+pt+'%</b> định mức'+(pt>=100?' – tốt lắm!':' – còn '+(100-pt)+'% nữa là đủ.');
  }
  return '<div class="vh-the"><h3>📏 Định mức của tôi</h3><div>'+cau+'</div><div class="nho">Tính theo số đã gửi (cả phần đang chờ duyệt), giờ có mặt '+f(gcm,1)+'h. Số chính thức xem ở bảng bên dưới sau khi được duyệt.</div></div>';
}
function congNgayFE(s,n){ var p=s.split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n)); return d.toISOString().slice(0,10); }

/* ---------- A4 + A6 (ban điều hành, trợ lý) và C2 (trưởng/phó phòng): thẻ ở Việc hôm nay / Tổng quan ---------- */
var _vhVHomNay=vHomNay;
vHomNay=function(){
  var kq=_vhVHomNay.apply(this,arguments);
  if(ME.vaiTro==='TP') vhCanNhac();
  if(ME.vaiTro==='ADMIN') vhSoat();
  return kq;
};
var _vhVDash=vDash;
vDash=function(){ var kq=_vhVDash.apply(this,arguments); if((ME.vaiTroGoc||ME.vaiTro)==='TL') vhSoat(); return kq; };
function vhCanNhac(){
  vhChen('<div id="vhNhac"></div>');
  vhGoi('canNhacXuong',[],function(r){
    var b=$('vhNhac'); if(!b||!r.ok)return;
    var h='';
    if(r.ds.length){
      h+='<div class="vh-the"><h3>🔔 Cần nhắc nhập sản lượng<span class="nho"> · hạn trong 1 ngày làm việc tới</span></h3>'+
        '<div class="nho" style="margin-bottom:6px">'+r.ds.length+' bạn còn thiếu. Nhắc trực tiếp, hoặc nhập hộ ở "Nhật ký". Người đang nghỉ đã được bỏ ra.</div><div class="tw"><table><tbody>'+
        r.ds.map(function(x){return '<tr><td>'+esc(x.HoTen)+(x.hocViec?' <span class="pill p-gr">học việc</span>':'')+'</td><td class="mono">'+x.ngay.map(dmy).join(', ')+'</td><td class="nho">hạn 17:00 '+dmy(x.han)+'</td></tr>'}).join('')+
        '</tbody></table></div></div>';
    }
    if(r.xuong&&r.xuong.tyLe>=85) h+='<div class="note" style="margin:0 0 12px">🏭 Xưởng mình: <b>'+r.xuong.tyLe+'%</b> lượt nhập đúng hạn trong '+r.xuong.soNgay+' ngày làm việc gần đây – giữ nhịp tốt!</div>';
    b.innerHTML=h;
  });
}
function vhSoat(){
  vhChen('<div id="vhSoat"><div class="vh-the"><h3>🔎 Soát khâu duyệt</h3><div class="nho">Đang tải…</div></div></div>');
  vhGoi('soatDuyet',[],function(r){
    var b=$('vhSoat'); if(!b)return;
    if(!r.ok){ b.innerHTML=''; return; }
    var X=r.xuong||[], h='<div class="vh-the"><h3>🔎 Soát khâu duyệt<span class="nho"> · 30 ngày gần nhất</span></h3>';
    h+='<div class="tw"><table><thead><tr><th>Xưởng</th><th class="n">Chờ quá 1 ngày</th><th class="n">Đã duyệt</th><th class="n">TP sửa số</th><th class="n">TP nhập thẳng</th></tr></thead><tbody>'+
      X.map(function(x){ var pt=function(a){return x.duyet?Math.round(a/x.duyet*100)+'%':'–'};
        return '<tr><td>'+esc(x.TenXuong)+'</td><td class="n">'+(x.choLau?'<b style="color:var(--amber)">'+x.choLau+'</b>':'0')+'</td><td class="n">'+x.duyet+'</td><td class="n">'+pt(x.sua)+'</td><td class="n">'+pt(x.chotCa)+'</td></tr>'; }).join('')+
      '</tbody></table></div><div class="nho">"TP sửa số" = dòng trưởng phòng đổi số lượng / số lỗi khi duyệt (tính từ 18/10). "TP nhập thẳng" = chốt ca, không qua công nhân gửi.</div>';
    if(r.mau&&r.mau.length) h+='<details style="margin-top:10px"><summary><b>5 dòng ngẫu nhiên để đối chiếu</b> <span class="nho">(đã duyệt trong 7 ngày)</span></summary><div class="tw"><table><tbody>'+
      r.mau.map(function(m){return '<tr><td class="mono">'+dmy(m.ngay)+'</td><td>'+esc(m.HoTen)+' <span class="nho">'+esc(m.TenXuong)+'</span></td><td>'+esc(m.TenCD)+'</td><td class="n">'+m.SL+(m.slGoc?' <span class="nho">· CN khai '+esc(m.slGoc.split('/')[0])+'</span>':'')+'</td></tr>'}).join('')+'</tbody></table></div></details>';
    if(r.lech&&r.lech.length) h+='<details style="margin-top:8px"><summary><b>'+r.lech.length+' công đoạn có định mức lệch</b> <span class="nho">(3 tháng liền trung vị trên 115% hoặc dưới 80%)</span></summary><div class="tw"><table><thead><tr><th>Công đoạn</th><th class="n">Định mức</th><th class="n">'+r.lech[0].ky.map(function(k){return k.slice(5)+'/'+k.slice(2,4)}).join(' · ')+'</th><th></th></tr></thead><tbody>'+
      r.lech.map(function(x){return '<tr><td>'+esc(x.TenCD)+' <span class="nho">'+esc(x.TenXuong)+'</span></td><td class="n">'+x.dm+'</td><td class="n">'+x.trungVi.join('% · ')+'%</td><td>'+(x.huong==='cao'?'<span class="pill p-wn">định mức lỏng</span>':'<span class="pill p-bd">định mức chặt</span>')+'</td></tr>'}).join('')+
      '</tbody></table></div><div class="nho">Gợi ý: trưởng phòng gửi đề xuất định mức mới (tab Công đoạn), ban điều hành duyệt. Định mức mới chỉ áp dụng từ ngày duyệt.</div></details>';
    h+='</div>'; b.innerHTML=h;
  });
}

/* ---------- D4. Đón người mới (tab Nhân sự) ---------- */
var _vhVNS=vNS;
vNS=function(){
  var kq=_vhVNS.apply(this,arguments);
  if(['ADMIN','HR','TP','TL'].indexOf(ME.vaiTro)>=0) vhHoiNhap();
  return kq;
};
function vhHoiNhap(){
  // 24/10 (chủ dự án): thẻ Đón người mới đặt ở CUỐI tab Nhân sự
  var mHN=$('main'); if(!mHN)return; var cuHN=$('vhHN'); if(cuHN)cuHN.remove();
  var dHN=document.createElement('div'); dHN.id='vhHN'; mHN.appendChild(dHN);
  vhGoi('layHoiNhap',[],function(r){
    var b=$('vhHN'); if(!b||!r.ok||!r.ds||!r.ds.length){ if(b)b.innerHTML=''; return; }
    var ten={}; (r.muc||[]).forEach(function(m){ten[m[0]]=m[1]});
    b.innerHTML='<div class="vh-the"><h3>🧭 Đón người mới<span class="nho"> · vào làm trong 45 ngày</span></h3>'+
      r.ds.map(function(x){
        return '<div style="padding:8px 0;border-top:1px solid var(--line)"><div><b>'+esc(x.HoTen)+'</b> <span class="nho">'+esc(x.MaNV)+' · '+esc(x.TenXuong)+' · vào '+dmy(x.NgayVaoLam)+' ('+x.soNgay+' ngày) · xong '+x.xong+'/'+x.muc.length+'</span></div>'+
          '<div class="vh-lap" style="margin-top:6px">'+x.muc.map(function(m){
            var cls='vh-muc'+(m.xong?' xong':''), nhan=esc(ten[m.ma]||m.ma);
            if(m.tay&&r.sua) return '<button type="button" class="'+cls+'" aria-pressed="'+m.xong+'" title="Bấm để '+(m.xong?'bỏ đánh dấu':'đánh dấu đã xong')+(m.ai?' · '+esc(m.ai):'')+'" onclick="vhDanhDau(\''+esc(x.MaNV)+'\',\''+m.ma+'\','+(!m.xong)+')">'+nhan+'</button>';
            return '<span class="'+cls+'" title="'+(m.tay?'':'Tự đánh dấu từ dữ liệu')+'">'+nhan+'</span>';
          }).join('')+'</div></div>';
      }).join('')+'<div class="nho" style="margin-top:6px">Mục viền tròn có thể bấm để đánh dấu; các mục khác web tự nhận biết.</div></div>';
  });
}
function vhDanhDau(ma,muc,co){ call('danhDauHoiNhap',[ma,muc,co],function(r){ if(!r.ok){toast(r.msg,false);return} vhHoiNhap(); }); }

/* ---------- D5. Bảng kỹ năng 3 mức (tab Công đoạn, trưởng phòng / ban điều hành) ---------- */
var _vhVCD=vCD, __vhKnX='';
vCD=function(){
  var kq=_vhVCD.apply(this,arguments);
  if(ME.vaiTro==='TP'||ME.vaiTro==='ADMIN') try{ vhKyNang(); }catch(e){}
  return kq;
};
function vhMucKN(x){ try{ return JSON.parse(x.MucKyNang||'{}')||{} }catch(e){ return {} } }
function vhKyNang(){
  var X=ME.vaiTro==='TP'?ME.xuong:(__vhKnX||((D.phongban||[])[0]||{}).MaXuong||'');
  var cds=(D.congdoan||[]).filter(function(c){return c.MaXuong===X&&String(c.TrangThai).trim()!=='Ngừng'&&c.CachCham!=='TO'});
  var ns=sxTen((D.nhansu||[]).filter(function(x){return x.MaXuong===X&&String(x.TrangThai).trim()!=='Nghỉ việc'&&!x.laTP}));
  var muc={}, co={};
  ns.forEach(function(x){ muc[x.MaNV]=vhMucKN(x); co[x.MaNV]=String(x.CongDoanLamDuoc||'').split(/[,;]\s*/).filter(Boolean); });
  var gt=function(m,c){ return co[m].indexOf(c)<0?'':(muc[m][c]||'lam'); };
  var canhBao=cds.filter(function(c){ var hoc=ns.some(function(x){return gt(x.MaNV,c.MaCD)==='hoc'}), kem=ns.some(function(x){return gt(x.MaNV,c.MaCD)==='kem'}); return hoc&&!kem; });
  var mot=cds.filter(function(c){ return ns.filter(function(x){var g=gt(x.MaNV,c.MaCD);return g==='lam'||g==='kem'}).length===1; });
  var h='<details class="vh-the" id="vhKN"'+(vhKyNang._mo?' open':'')+' ontoggle="vhKyNang._mo=this.open"><summary><b>🧩 Bảng kỹ năng</b> <span class="nho">· Đang học / Làm được / Kèm được người khác</span></summary>';
  if(ME.vaiTro==='ADMIN') h+='<div style="margin:8px 0"><label>Xưởng</label> <select onchange="__vhKnX=this.value;vhKyNang()">'+(D.phongban||[]).map(function(p){return '<option value="'+esc(p.MaXuong)+'"'+(p.MaXuong===X?' selected':'')+'>'+esc(p.TenXuong)+'</option>'}).join('')+'</select></div>';
  if(canhBao.length) h+='<div class="alert a-wn" style="margin:8px 0">⚠ Có người <b>đang học</b> mà chưa ai <b>kèm được</b>: '+canhBao.map(function(c){return esc(c.TenCD)}).join(', ')+'.</div>';
  if(mot.length) h+='<div class="note" style="margin:8px 0">Công đoạn chỉ 1 người làm được (nghỉ là thiếu người): '+mot.map(function(c){return esc(c.TenCD)}).join(', ')+'.</div>';
  if(!cds.length||!ns.length){ h+='<div class="empty">Chưa có công đoạn / nhân sự.</div></details>'; vhChenKN(h); return; }
  h+='<div class="tw"><table class="vh-kn"><thead><tr><th>Người</th>'+cds.map(function(c){return '<th title="'+esc(c.TenCD)+'">'+esc(c.TenCD)+'</th>'}).join('')+'</tr></thead><tbody>'+
    ns.map(function(x){ return '<tr><td>'+esc(x.HoTen)+'</td>'+cds.map(function(c){ var g=gt(x.MaNV,c.MaCD);
      return '<td class="'+g+'"><select aria-label="'+esc(x.HoTen)+' – '+esc(c.TenCD)+'" onchange="vhLuuKN(\''+esc(x.MaNV)+'\',\''+esc(c.MaCD)+'\',this.value)">'+
        [['','–'],['hoc','Đang học'],['lam','Làm được'],['kem','Kèm được']].map(function(o){return '<option value="'+o[0]+'"'+(o[0]===g?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></td>'; }).join('')+'</tr>'; }).join('')+
    '</tbody></table></div><div class="nho">"Đang học" vẫn được nhập sản lượng công đoạn đó. Đổi ở đây cũng đổi danh sách công đoạn làm được của người đó.</div></details>';
  vhChenKN(h);
}
function vhChenKN(h){ if($('vhKN'))$('vhKN').outerHTML=h; else { var m=$('main'), d=document.createElement('div'); d.innerHTML=h; m.appendChild(d.firstChild); } }
function vhLuuKN(ma,cdM,muc){
  call('luuMucKyNang',[ma,cdM,muc],function(r){
    if(!r.ok){toast(r.msg,false);vhKyNang();return}
    var x=(D.nhansu||[]).filter(function(n){return n.MaNV===ma})[0];
    if(x){ x.CongDoanLamDuoc=r.CongDoanLamDuoc; x.MucKyNang=Object.keys(r.MucKyNang||{}).length?JSON.stringify(r.MucKyNang):'';}
    vhKyNang._mo=true; vhKyNang();
  });
}

/* ---------- D7. Rhino hướng dẫn trưởng / phó phòng mới (trang Duyệt sản lượng, lần đầu) ---------- */

    {s:'#main input[id^="slr_"]',t:'Mỗi người / ngày là một nhóm. Sửa được <b>Số lượng</b> và <b>Số lỗi</b> từng dòng nếu công nhân ghi sai – web vẫn lưu số gốc họ khai.'},

var _vhVDuyetSL=vDuyetSL;

  var kq=_vhVDuyetSL.apply(this,arguments);
  try{ if(!maiTat()&&!maiNho('kpi_mai_hd_tp_'+ME.tk)&&document.querySelector('#main input[id^="slr_"]')) setTimeout(function(){ if(tabHienTai==='duyetsl') maiTourTP(); },800); }catch(e){}

/* ---------- C3. Chuỗi ngày gửi đều: ngày nghỉ hợp lệ / xưởng không làm / lễ thì bỏ qua, không làm đứt chuỗi ---------- */
function vhNgayMien(s){
  if(new Date(s+'T00:00:00').getDay()===0)return true;
  if((D.ngayLe||[]).indexOf(s)>=0)return true;
  var dd=(D.xacNhanDD||[]).some(function(r){return r.MaXuong===ME.xuong&&ngay(r.Ngay)===s});
  if(!dd&&s<today())return true;                     // xưởng không điểm danh ngày đó = xưởng không làm
  if(gioCoMatNgay(ME.maNV,s)<=0)return true;         // nghỉ cả ngày theo chấm công
  return (D.nghiDaiHan||[]).some(function(r){return r.MaNV===ME.maNV&&ngay(r.TuNgay)<=s&&s<=ngay(r.DenNgay)});
}
maiChuoi=function(){
  var co={}; (D.choDuyet||[]).concat(D.nhatky||[]).forEach(function(r){if(r.MaNV===ME.maNV)co[ngay(r.Ngay)]=1});
  var d=new Date(today()+'T00:00:00'),n=0;
  for(var i=0;i<60;i++){var s=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    if(co[s])n++; else if(!(i===0&&n===0)&&!vhNgayMien(s))break;
    d.setDate(d.getDate()-1);}
  try{ var k='kpi_chuoi_max_'+ME.tk; if(n>Number(maiNho(k)||0))maiNho(k,String(n)); }catch(e){}
  return n;
};

/* ---------- C4. Khen bằng sự thật (theo đúng số vừa gửi) ---------- */
maiKhenGui=function(){
  if(maiTat())return;
  var n=maiChuoi(), out=window.__vhVuaGui||[], c='', cau='';
  var loi=out.reduce(function(s,r){return s+(Number(r.SoLoi)||0)},0), trongNgay=out.length&&out[0].Ngay===today();
  if(n>=5) cau='<b>'+n+' ngày liền</b> gửi đều – đều tay lắm!';
  else if(out.length&&loi===0) cau='Hôm nay <b>0 hàng lỗi</b> – sạch đẹp!';
  else if(trongNgay) cau='Gửi <b>ngay trong ngày</b> – trưởng phòng duyệt được liền.';
  else cau='Đã nhận số của bạn – cảm ơn bạn nhập cẩn thận!';
  if(n>=2){c='<div class="mai-chuoi">';for(var i=1;i<=7;i++)c+='<i class="'+(i<=Math.min(n,7)?'co':'')+'">'+(i<=Math.min(n,7)?'✓':i)+'</i>';c+='</div><small>'+n+' ngày liên tiếp gửi đều'+(n<7?' · thêm '+(7-n)+' ngày nữa là tròn tuần!':' – tuyệt vời!')+'</small>';}
  else { var mx=Number(maiNho('kpi_chuoi_max_'+ME.tk)||0); if(mx>=3) c='<small>Bắt đầu chuỗi mới từ hôm nay – lần trước bạn đạt '+mx+' ngày đó!</small>'; }
  window.__maiUuTien=1; maiGoc('Đã gửi – chờ trưởng phòng duyệt',cau,c,'covu vui',7000); window.__maiUuTien=0;
};

/* ---------- C5. Hạng C / D: chỉ ra MỘT việc cụ thể từ phần điểm yếu nhất (không phán xét) ---------- */
var _vhMaiKPI=maiKPI;
maiKPI=function(hang,tong){
  if(maiTat()||(hang!=='C'&&hang!=='D'))return _vhMaiKPI.apply(this,arguments);
  var k=kpi(ME.maNV); if(!k)return _vhMaiKPI.apply(this,arguments);
  var ds=[['sl',k.sl,'<b>năng suất</b>: hiệu suất đang <b>'+f(k.sl)+'%</b>. Hỏi trưởng phòng mẹo làm nhanh ở công đoạn bạn thấy khó nhất nhé.'],
    ['cl',k.cl,'<b>giảm hàng lỗi</b>: tỷ lệ đạt đang <b>'+f(k.cl)+'%</b>. Kiểm tra kỹ trước khi chuyển sang công đoạn sau.'],
    ['tt',k.tt,'<b>đi làm đều, đúng giờ</b>: điểm chuyên cần đang <b>'+f(k.tt,0)+'</b>.'],
    ['at',k.at,'<b>nề nếp – nhập sản lượng đúng hạn</b>: điểm nề nếp đang <b>'+f(k.at,0)+'</b>. Nhập ngay cuối ca là chắc nhất.']];
  ds.sort(function(a,b){return a[1]-b[1]});
  return '<div class="mai-bang" style="margin-top:12px">'+maiHinh('')+'<div class="nd"><small>Rhino gợi ý · hạng '+esc(hang)+'</small><div class="kh" style="font-weight:500">Phần dễ cải thiện nhất của bạn là '+ds[0][2]+'</div></div></div>';
};

/* ---------- C7. Nhịp Rhino: tối đa 2 bong bóng tự bật mỗi lần mở web; đóng 3 ngày liền thì hỏi có muốn nói ít lại ---------- */
var _vhMaiGoc=maiGoc;
maiGoc=function(nho,kh,phu,cls,ms){
  var uu=window.__maiUuTien;
  if(!uu){
    if(maiNho('kpi_mai_it')==='1')return false;                         // đã chọn "Ít thôi": chỉ còn dải khẩu hiệu + lời sau khi gửi
    if(window.__vhCoHan&&ME&&ME.vaiTro==='CN'&&tabHienTai==='cnnhap')return false;   // đang có nhắc hạn nhập: ưu tiên nhắc hạn
    if((window.__maiDem=(window.__maiDem||0))>=2)return false;
  }
  var r=_vhMaiGoc.apply(this,arguments);
  if(r&&!uu)window.__maiDem++;
  return r;
};
var _vhMaiGocDong=maiGocDong;
maiGocDong=function(){
  var tuTay=window.event&&window.event.type==='click';
  _vhMaiGocDong.apply(this,arguments);
  if(!tuTay||maiNho('kpi_mai_it')!==null)return;
  try{
    var ds=JSON.parse(maiNho('kpi_mai_dong')||'[]'), h=today();
    if(ds.indexOf(h)<0)ds.push(h); ds=ds.slice(-3); maiNho('kpi_mai_dong',JSON.stringify(ds));
    var lien=ds.length===3&&ds[2]===h&&ds[1]===congNgayFE(h,-1)&&ds[0]===congNgayFE(h,-2);
    if(lien) setTimeout(function(){
      window.__maiUuTien=1;
      _vhMaiGoc('Rhino hỏi một chút','Mấy hôm nay bạn hay đóng lời Rhino. Rhino <b>nói ít lại</b> nhé?',
        '<div class="vh-nho-it"><button class="btn pri" onclick="maiNho(\'kpi_mai_it\',\'1\');_vhMaiGocDong();toast(\'Rhino sẽ nói ít lại 🦏\',true)">Ít thôi</button><button class="btn" onclick="maiNho(\'kpi_mai_it\',\'0\');_vhMaiGocDong()">Như cũ</button></div>','',15000);
      window.__maiUuTien=0;
    },600);
  }catch(e){}
};
