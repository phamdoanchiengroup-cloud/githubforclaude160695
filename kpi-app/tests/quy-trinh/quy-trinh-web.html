</style>
<script>
/* ===== Quy trình sản xuất (31/10) ===== */
var QT=null, QTV='nm', QTX='', QTS=null, QTSoNgay=0, QTD=null, QTDoi=false, QTMo='';
var QT_NHANH_DONG={NGON:1,CHUOI:1,GAY1K:1}, QT_NHANH_NGOAI={LAMLAI:1,HOTRO:1,CHUAXEP:1};
var QT_THU_NHANH=['CHUNG','NGON','CHUOI','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','LAMLAI','HOTRO','CHUAXEP'];
function qtSo(v,k){ k=k==null?1:k; return Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:k,minimumFractionDigits:0}); }
function qtPt(v){ return Math.round(v*100)+'%'; }
function qtMuc(t){ return t>1?'bd':(t>0.85?'wn':''); }
function qtTenX(x){ var p=(QT.xuong||[]).filter(function(a){return a.MaXuong===x})[0]; return p?String(p.TenXuong).replace(/^Xưởng\s+/,''):x; }

/* Công đoạn trước – giống hệt qtCanh_ ở máy chủ (tests/quy-trinh/quy-trinh.gs) */
function qtCanh(ds){
  var theoX={}, out={};
  ds.forEach(function(c){ (theoX[c.MaXuong]=theoX[c.MaXuong]||[]).push(c); });
  Object.keys(theoX).forEach(function(x){
    var cs=theoX[x];
    var lonNhat=function(nh,s){ var b=0; cs.forEach(function(c){ if(c.Nhanh===nh&&c.Buoc<s&&c.Buoc>b)b=c.Buoc; }); return b; };
    var o=function(nh,b){ return cs.filter(function(c){return c.Nhanh===nh&&c.Buoc===b}).map(function(c){return c.Ma}); };
    cs.forEach(function(c){
      if(c.Truoc&&c.Truoc.length){ out[c.Ma]=c.Truoc.slice(); return; }
      var r=[];
      if(QT_NHANH_NGOAI[c.Nhanh]) r=[];
      else if(c.Nhanh==='CHUNG'){
        var sc=lonNhat('CHUNG',c.Buoc);
        Object.keys(QT_NHANH_DONG).forEach(function(nh){ var b=lonNhat(nh,c.Buoc); if(b&&b>sc) r=r.concat(o(nh,b)); });
        if(!r.length&&sc) r=o('CHUNG',sc);
      } else {
        var sb=lonNhat(c.Nhanh,c.Buoc), sc2=QT_NHANH_DONG[c.Nhanh]?lonNhat('CHUNG',c.Buoc):0;
        if(sc2>sb) r=o('CHUNG',sc2); else if(sb) r=o(c.Nhanh,sb);
      }
      out[c.Ma]=r;
    });
  });
  return out;
}

/* Tính tải: giờ chuẩn = sản lượng ÷ định mức (quy mọi đơn vị về giờ-người) */
/* Sản lượng yêu cầu (01/11, chủ dự án): sp/tháng ÷ ngày làm = sp/ngày; so với nhịp hiện nay (công đoạn "Đóng gói thành phẩm" trong kỳ, hoặc số tự nhập) -> % mục tiêu */
var QT_CD_DONGGOI=['DG-DONGGOITP','DG-DONLE-GAY-NGON','DG-DONLE-NGON','DG-DONLE-CUSTOM','DG-DONLE-COMBO'];   /* đóng gói thành phẩm + đóng đơn lẻ (không tính phụ kiện, bao cơ) */
function qtSlNayDo(){ var sl=0; QT_CD_DONGGOI.forEach(function(m){ var t=(QT.thongKe||{})[m]; if(t&&t.sl>0) sl+=t.sl; }); return sl/Math.max(1,QT.soNgaySX||1); }
function qtSlNay(){ return QTS.slNay>0?QTS.slNay:qtSlNayDo(); }
function qtMT(){ var n=qtSlNay(), y=QTS.slThang/Math.max(1,QTS.ngayThang); if(n>0) QTS.mucTieu=Math.max(10,Math.min(500,Math.round(y/n*100))); return QTS.mucTieu; }
function qtTinh(){
  qtMT();
  var N=Math.max(1,QT.soNgaySX||1), mt=QTS.mucTieu/100, gioNguoi=QTS.gioCoMat*QTS.hieuSuat, nc=QT.ngayCong||{};
  var cd={}, x={}, gcTot={};
  (QT.xuong||[]).forEach(function(p){ x[p.MaXuong]={ma:p.MaXuong,gio:0,can:0,co:0,coMat:0,ql:0,cd:[],khongDM:0}; });
  (QT.nhanSu||[]).forEach(function(n){ var o=x[n.MaXuong]; if(!o)return;
    if(/^\s*(trưởng phòng|phó phòng|quản lý|giám đốc)/i.test(n.ChucDanh)) o.ql++; else { o.co++; o.coMat+=Math.min(1,(nc[n.MaNV]||0)/N); } /* tổ trưởng vẫn tính là người làm */ });
  var ten={}; (QT.nhanSu||[]).forEach(function(n){ ten[n.MaNV]=n.HoTen; });
  // giờ chuẩn của từng người (để chia thời gian có mặt của họ cho các công đoạn – không đếm 1 người đủ ở mọi công đoạn)
  Object.keys(QT.thongKe).forEach(function(m){ var dm=(QT.cdMap[m]||{}).DM; if(!(dm>0))return;
    var ng=QT.thongKe[m].nguoi||{}; Object.keys(ng).forEach(function(p){ gcTot[p]=(gcTot[p]||0)+ng[p]/dm; }); });
  QTD.forEach(function(q){
    var c=(QT.cdMap[q.Ma]||{}), t=QT.thongKe[q.Ma]||{sl:0,nguoi:{}}, kn=(QT.kyNang||{})[q.Ma]||{};
    var biet={}; Object.keys(t.nguoi||{}).forEach(function(m){ biet[m]='nk'; }); Object.keys(kn).forEach(function(m){ biet[m]=biet[m]?'ca':'kn'; });
    var slN=t.sl/N, gio=c.DM>0?slN/c.DM:0, can=gio*mt/gioNguoi, nb=Object.keys(biet).length, fte=0;
    if(c.DM>0) Object.keys(t.nguoi||{}).forEach(function(p){ if(gcTot[p]>0) fte+=(t.nguoi[p]/c.DM)/gcTot[p]*Math.min(1,(nc[p]||0)/N); });
    var o={ma:q.Ma,ten:c.TenCD||q.Ma,x:q.MaXuong,nhanh:q.Nhanh,buoc:q.Buoc,dm:c.DM||0,dvt:c.DVT||'',slN:slN,gio:gio,can:can,biet:biet,nb:nb,fte:fte,
      tai:fte>0.01?can/fte:(can>0.05?9:0), khongDM:!(c.DM>0)&&t.sl>0, tenNguoi:Object.keys(biet).map(function(m){return ten[m]||m}) };
    o.mot = can>0.05 && nb<=1; o.hai = can>0.05 && nb===2;
    cd[q.Ma]=o;
    var xo=x[q.MaXuong]; if(!xo)return;
    xo.gio+=gio; xo.can+=can; xo.cd.push(o); if(o.khongDM)xo.khongDM++;
  });
  var ds=Object.keys(x).map(function(k){ var o=x[k], co=o.coMat>0.5?o.coMat:o.co;
    o.tai=co?o.can/co:(o.can>0?9:0); o.tai100=o.tai/mt; o.toiDa=o.tai>0?QTS.mucTieu/o.tai:0; o.thieu=Math.max(0,Math.ceil(o.can-co-1e-9));
    o.nangSuat=co?o.gio/(co*QTS.gioCoMat):0; return o; });
  var co=ds.filter(function(o){return o.can>0});
  var max=co.reduce(function(a,o){return o.tai>a.tai?o:a},{tai:0});
  var lbr=co.length&&max.tai?co.reduce(function(a,o){return a+o.tai},0)/(co.length*max.tai):0;
  return {cd:cd,x:x,ds:ds,nut:max,lbr:lbr,N:N};
}

function vQTTai(){
  $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Đang tính từ nhật ký sản xuất…</div>';
  call('layQuyTrinh',[QTSoNgay||0],function(r){
    if(!r||!r.ok){ $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="alert a-wn">'+esc((r&&r.msg)||'Không tải được.')+'</div>'; return; }
    qtNhan(r); qtVe();
  });
}
/* Nạp số liệu quy trình không vẽ (tab Đơn hàng cần để tính giờ / ngày theo xưởng) */
function qtNapNgam(cb){ call('layQuyTrinh',[QTSoNgay||0],function(r){ if(r&&r.ok) qtNhan(r); cb(!!(r&&r.ok)); }); }
function qtNhan(r){
    QT=r; QTSoNgay=r.soNgay; QT.cdMap={}; (r.congDoan||[]).forEach(function(c){ QT.cdMap[c.MaCD]=c; });
    QTS={gioCoMat:r.caiDat.gioCoMat,hieuSuat:r.caiDat.hieuSuat,mucTieu:r.caiDat.mucTieu,slThang:r.caiDat.slThang||9000,ngayThang:r.caiDat.ngayThang||26,slNay:r.caiDat.slNay||0};
    QTD=r.quyTrinh.map(function(q){ return {Ma:q.Ma,MaXuong:q.MaXuong,Nhanh:q.Nhanh,Buoc:Number(q.Buoc)||1,Truoc:(q.Truoc||[]).slice(),GhiChu:q.GhiChu||'',moi:!!q.moi}; });
    QT.luong=(r.xuongLuong||[]).map(function(a){return {Tu:a.Tu,Den:a.Den,BTP:a.BTP,GhiChu:a.GhiChu||''}});
    QTDoi=false;
    if(!QTX){ var t=qtTinh(); QTX=t.nut.ma||((r.xuong[0]||{}).MaXuong); }
}
function qtVe(){
  if(!QT){ vQTTai(); return; }
  var T=qtTinh();
  var h='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Bản thử – chỉ tài khoản chủ sở hữu thấy. Số liệu từ nhật ký sản xuất '+esc(QT.tu)+' → '+esc(QT.den)+' ('+QT.soNgaySX+' ngày có sản xuất).</div>';
  if(QT.nhap) h+='<div class="alert a-wn">Đây là <b>quy trình nháp</b> Claude soạn từ tên công đoạn và các file anh/chị gửi. Xem ở "Từng xưởng", sửa ở "Sửa quy trình", bấm <b>Lưu</b> để chốt.</div>';
  var moi=QTD.filter(function(q){return q.moi}).length;
  if(moi) h+='<div class="alert a-wn">'+moi+' công đoạn mới chưa có trong quy trình đã lưu – xem ở "Sửa quy trình".</div>';
  if(QTV!=='dh') h+='<div class="qt-bar">'+
    '<div><label for="qtKy">Kỳ dữ liệu</label><select id="qtKy" onchange="QTSoNgay=+this.value;vQTTai()">'+[14,30,60,90].map(function(n){return '<option value="'+n+'"'+(n===QTSoNgay?' selected':'')+'>'+n+' ngày</option>'}).join('')+'</select></div>'+
    '<div><label for="qtSlT">Sản lượng yêu cầu</label><input id="qtSlT" type="number" inputmode="numeric" min="500" max="100000" step="500" value="'+QTS.slThang+'" onchange="qtDoiCD(\'slThang\',this.value,500,100000)"> sp/tháng</div>'+
    '<div><label for="qtNgT">Ngày làm / tháng</label><input id="qtNgT" type="number" inputmode="numeric" min="20" max="31" step="1" value="'+QTS.ngayThang+'" onchange="qtDoiCD(\'ngayThang\',this.value,20,31)"></div>'+
    '<div><label for="qtSlN">Hiện nay làm</label><input id="qtSlN" type="number" inputmode="numeric" min="0" max="5000" step="1" placeholder="'+Math.round(qtSlNayDo())+'" value="'+(QTS.slNay||'')+'" onchange="qtDoiCD(\'slNay\',this.value||0,0,5000)"> sp/ngày</div>'+
    '<div><label for="qtGio">Giờ có mặt / ngày</label><input id="qtGio" type="number" inputmode="decimal" min="1" max="24" step="0.5" value="'+QTS.gioCoMat+'" onchange="qtDoiCD(\'gioCoMat\',this.value,1,24)"></div>'+
    '<div><label for="qtHs">Hiệu suất</label><input id="qtHs" type="number" inputmode="numeric" min="30" max="120" step="5" value="'+Math.round(QTS.hieuSuat*100)+'" onchange="qtDoiCD(\'hieuSuat\',this.value/100,0.3,1.2)"> %</div>'+
  '</div>';
  h+='<div class="qt-tabs">'+[['nm','Toàn nhà máy'],['x','Từng xưởng'],['ng','Con người'],['sua','Sửa quy trình'+(QTDoi?' •':'')]].map(function(t){
    return '<button class="btn'+(QTV===t[0]?' on':'')+'" type="button" onclick="QTV=\''+t[0]+'\';qtVe()">'+t[1]+'</button>'; }).join('')+'</div>';
  if(QTV!=='nm'&&QTV!=='dh') h+='<div style="margin-bottom:12px"><label for="qtChonX">Xưởng</label> <select id="qtChonX" onchange="QTX=this.value;QTMo=\'\';qtVe()">'+(QT.xuong||[]).map(function(p){
    return '<option value="'+esc(p.MaXuong)+'"'+(p.MaXuong===QTX?' selected':'')+'>'+esc(p.TenXuong)+'</option>'; }).join('')+'</select></div>';
  if(QTV==='dh') QTV='nm';
  h+=({nm:qtVeNM,x:qtVeX,ng:qtVeNguoi,sua:qtVeSua}[QTV]||qtVeNM)(T);
  $('main').innerHTML=h;
  qtSauVe();
}
function qtDoiCD(k,v,a,b){ v=Number(v); if(!isFinite(v)||v<a||v>b){ toast('Giá trị phải trong khoảng '+a+'–'+b+'.'); qtVe(); return; } QTS[k]=v; QTDoi=true; qtVe(); }

/* --- Toàn nhà máy --- */
function qtThuTuX(){
  var vao={}, ra={}, xs=(QT.xuong||[]).map(function(p){return p.MaXuong}), kq=[], da={};
  QT.luong.forEach(function(a){ if(a.Tu==='NGONTARO'&&a.Den==='PHOITHO') return; /* luồng cấp POM chạy ngược, không tính thứ tự */ (vao[a.Den]=vao[a.Den]||[]).push(a.Tu); (ra[a.Tu]=ra[a.Tu]||[]).push(a.Den); });
  var conLai=xs.slice();
  while(conLai.length){
    var san=conLai.filter(function(x){ return (vao[x]||[]).every(function(t){return da[t]||xs.indexOf(t)<0}); });
    if(!san.length) san=[conLai[0]];
    san.forEach(function(x){ da[x]=1; kq.push(x); });
    conLai=conLai.filter(function(x){return !da[x]});
  }
  return kq;
}
function qtVeNM(T){
  var n=T.nut, h='<div class="card"><div class="qt-ket">';
  var tongCo=T.ds.reduce(function(a,o){return a+o.co},0), tongMat=T.ds.reduce(function(a,o){return a+o.coMat},0);
  var thieuX=T.ds.filter(function(o){return o.tai>1}).sort(function(a,b){return b.tai-a.tai});
  var ns=T.ds.filter(function(o){return o.nangSuat>0}).map(function(o){return o.nangSuat});
  if(!n.ma) h+='Chưa có sản lượng trong kỳ này để tính.';
  else {
    h+='Nhà máy có <b>'+tongCo+'</b> công nhân trong danh sách, trung bình <b>'+qtSo(tongMat,0)+'</b> người có mặt làm hàng mỗi ngày. ';
    var tongCan=T.ds.reduce(function(a,o){return a+o.can},0), slN0=qtSlNay();
    h+='Để làm <b>'+qtSo(QTS.slThang,0)+' sp/tháng</b> cần khoảng <b class="'+(tongCan>tongMat?'bd':'ok')+'">'+qtSo(tongCan,0)+'</b> người có mặt mỗi ngày'+(tongCan>tongMat?' – thiếu <b class="bd">~'+Math.ceil(tongCan-tongMat)+'</b>':' – đủ')+' (xem bảng "Cân bằng các xưởng"). ';
    h+='Giữ số người có mặt như hiện nay và làm đạt <b>'+Math.round(QTS.hieuSuat*100)+'%</b> định mức, nhà máy làm được tối đa khoảng <b class="'+(n.toiDa<QTS.mucTieu?'bd':'ok')+'">'+(slN0>0?qtSo(Math.round(n.toiDa/100*slN0*QTS.ngayThang/100)*100,0)+' sp/tháng</b> ('+Math.round(n.toiDa)+'% nhịp hiện nay)':Math.round(n.toiDa)+'%</b> sản lượng của kỳ này');
    h+=n.toiDa<QTS.mucTieu?' – <b class="bd">chưa đủ</b> cho mục tiêu.':' – đủ cho mục tiêu.';
    if(thieuX.length) h+='<div style="margin-top:6px">Ở mục tiêu '+qtSo(QTS.slThang,0)+' sp/tháng: '+thieuX.map(function(o,i){return (i?'':'nút thắt ')+'<b class="bd">'+esc(qtTenX(o.ma))+'</b> tải '+qtPt(o.tai)+', thiếu ~'+o.thieu+' người'}).join(' · ')+'.</div>';
    var het=T.ds.filter(function(o){return o.nangSuat>=QTS.hieuSuat-0.02}).sort(function(a,b){return b.nangSuat-a.nangSuat});
    if(het.length) h+='<div style="margin-top:6px">Đang chạy gần hết sức (năng suất thực ≥ '+Math.round(QTS.hieuSuat*100-2)+'% định mức – muốn tăng sản lượng phải thêm người / máy hoặc bớt việc phụ): '+het.map(function(o){return '<b class="wn">'+esc(qtTenX(o.ma))+'</b> '+qtPt(o.nangSuat)}).join(' · ')+'. Các xưởng khác còn dư thời gian để tăng năng suất trước khi phải thêm người.</div>';
    else h+='<div style="margin-top:6px">Xưởng sát giới hạn nhất: <b class="'+(qtMuc(n.tai)||'ok')+'">'+esc(qtTenX(n.ma))+'</b> (tải '+qtPt(n.tai)+').</div>';
    h+='<div style="font-size:13px;color:var(--ink2);margin-top:6px">Tính theo định mức, nên đây là giới hạn <i>về người</i>. Nút thắt thật còn có thể ở máy / mẻ (sơn, sấy, in UV, CNC), hàng chờ giữa các xưởng, hoặc hàng làm lại – những phần này chưa đo được (giai đoạn 2).'+
      (ns.length?' Năng suất thực các xưởng chỉ khoảng '+qtPt(Math.min.apply(null,ns))+'–'+qtPt(Math.max.apply(null,ns))+' định mức: thời gian đang mất ở đâu đó (chờ hàng, hỗ trợ, làm lại, việc chưa có định mức) hoặc định mức chưa sát.':'')+'</div>';
  }
  var slN=qtSlNay(), yN=QTS.slThang/Math.max(1,QTS.ngayThang);
  h+='</div><div style="font-size:12.5px;color:var(--ink3)">Mục tiêu <b>'+qtSo(QTS.slThang,0)+'</b> sp/tháng ÷ '+QTS.ngayThang+' ngày = <b>~'+qtSo(yN,0)+'</b> sp/ngày'+(slN>0?' = <b>'+QTS.mucTieu+'%</b> nhịp hiện nay (~'+qtSo(slN,0)+' sp/ngày '+(QTS.slNay>0?'tự nhập':'theo các công đoạn đóng gói thành phẩm + đóng đơn lẻ trong kỳ, gồm cả tay nối')+')':' – chưa đo được nhịp hiện nay, đang dùng mục tiêu '+QTS.mucTieu+'%; hãy nhập ô "Hiện nay làm"')+'. Sửa 3 ô trên để thử mức khác. Độ cân bằng giữa các xưởng: <b>'+qtPt(T.lbr)+'</b> (dưới 85% là lệch nhiều).</div></div>';

    '<p><b>Có mặt / ngày</b> = số ngày-người có dòng nhật ký ÷ số ngày có sản xuất (vắng, nghỉ, chuyển xưởng đã bị trừ); số sau dấu "/" là người trong danh sách "Đang làm" (công nhân, tổ trưởng, kỹ thuật – không tính trưởng / phó phòng). <b>Tải</b> = cần ÷ có mặt. Xưởng tải cao nhất là nút thắt; <b>làm tối đa</b> = mục tiêu ÷ tải.</p>'+
    '<p><b>Năng suất</b> = giờ chuẩn ÷ (người có mặt × giờ có mặt): phần thời gian có mặt biến thành hàng đạt định mức. Thấp nghĩa là thời gian mất ở chờ hàng, hỗ trợ, làm lại, việc chưa có định mức, hoặc định mức chưa sát.</p>'+

}

var QT_NHOM_NHANH={POM:'SX POM (cấp Phôi Thô)',NOI:'Tay nối',GAY1K:'Gậy 1 khúc',PHIP:'Phíp',PK:'Phụ kiện',DONLE:'Đơn lẻ',LAMLAI:'Làm lại / sửa',HOTRO:'Hỗ trợ',CHUAXEP:'Chưa xếp'};
function qtKhongDau(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim(); }
/* -> {ten, thu}: nhóm của 1 công đoạn (thứ tự = cột trên lưu đồ) */
function qtNhomCD(x,nhanh,ten){
  var ds=QT_NHOM[x]||[], t=qtKhongDau(ten), i;
  if(QT_NHOM_NHANH[nhanh]) return {ten:QT_NHOM_NHANH[nhanh],thu:100+QT_THU_NHANH.indexOf(nhanh),rieng:1};
  for(i=0;i<ds.length;i++) if(ds[i][1].test(t)) return {ten:ds[i][0],thu:i};
  return {ten:'Khác',thu:90};
}
/* Gom công đoạn của 1 xưởng thành nhóm theo làn (nhánh) -> {lan:[nhánh], cot:[{ten,thu}], o:{nhánh|cột: nhóm}} */
function qtGomNhom(x,T){
  var xo=T.x[x]; if(!xo) return null;
  var o={}, cot={}, lan={};
  xo.cd.forEach(function(c){
    var g=qtNhomCD(x,c.nhanh,c.ten), ln=g.rieng?(QT_NHANH_NGOAI[c.nhanh]?'NGOAI':c.nhanh):(c.nhanh==='CHUAXEP'?'NGOAI':c.nhanh);
    var k=ln+'|'+g.ten, n=o[k]||(o[k]={lan:ln,ten:g.ten,thu:g.thu,cd:[],can:0,fte:0,gio:0,biet:{},mot:0,buoc:99});
    n.cd.push(c); n.can+=c.can; n.fte+=c.fte; n.gio+=c.gio; n.buoc=Math.min(n.buoc,c.buoc||99); if(c.mot)n.mot++;
    Object.keys(c.biet||{}).forEach(function(m){n.biet[m]=1});
    if(ln!=='NGOAI'){ cot[g.ten]=cot[g.ten]||{ten:g.ten,thu:g.thu,buoc:99}; cot[g.ten].buoc=Math.min(cot[g.ten].buoc,c.buoc||99); lan[ln]=1; }
  });
  Object.keys(o).forEach(function(k){ var n=o[k]; n.nb=Object.keys(n.biet).length; n.tai=n.fte>0.01?n.can/n.fte:(n.can>0.05?9:0); n.cd.sort(function(a,b){return (a.buoc-b.buoc)||(b.tai-a.tai)}); });
  var cs=Object.keys(cot).map(function(k){return cot[k]}).sort(function(a,b){return (a.thu-b.thu)||(a.buoc-b.buoc)});
  var ls=Object.keys(lan).sort(function(a,b){ var L=['CHUOI','NGON','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','CHUNG']; var ia=L.indexOf(a), ib=L.indexOf(b); return (ia<0?40:ia)-(ib<0?40:ib); });
  return {lan:ls,cot:cs,o:o,xo:xo};
}
var QTMoNhom='';

function qtBangCon(n){

/* Lưu đồ 1 xưởng: các bước dọc đánh số 1→n theo thứ tự làm; cùng bước khác nhánh xếp liền nhau (└) */
function qtLanBoi(x,T){

  var nut=tren.reduce(function(a,n){return n.tai>a.tai?n:a},{tai:0}), mot=ds.filter(function(n){return n.mot});
  var ci={}; G.cot.forEach(function(c,i){ci[c.ten]=i});

  h+='<div class="qt-chu"><span>Đọc từ trên xuống theo thứ tự làm.</span><span>Người = đang làm / cần.</span><span><span class="qt-bd">≤85%</span> đủ</span><span><span class="qt-bd wn">95%</span> sát</span><span><span class="qt-bd bd">120%</span> thiếu người</span><span>Bấm một dòng để xem các công đoạn trong nhóm.</span></div>';
  h+='<div class="qt-bc"><div class="qt-bh dau"><span class="st">#</span><span>Nhóm công đoạn</span><span>Nhánh</span><span class="r">CĐ</span><span class="r">Người</span><span class="r">Biết</span><span class="r">Tải</span></div>';
  var truoc=-1;
  h+='<div class="qt-tl">';
  tren.forEach(function(n){ var c=ci[n.ten], con=c===truoc; truoc=c; h+=qtHangNhom(n,x,c+1,con,n===nut&&n.tai>0,false); });
  h+='</div>';

  if(ngoai.length){ h+='<div class="qt-ngoai">Ngoài dòng chảy (vẫn tính tải)</div>'; ngoai.forEach(function(n){ h+=qtHangNhom(n,x,'',false,false,true); }); }
  return h+'</div>';
}

function dhVeLai(){ if(typeof tabHienTai!=='undefined'&&tabHienTai==='dh') dhTrangVe(); else qtVe(); }

function dhChuY(don){

  var x=don.slice().sort(function(a,b){ return (DH_ST_THU.indexOf(a.st)-DH_ST_THU.indexOf(b.st))||String(a.dl||'9').localeCompare(String(b.dl||'9')); });
  var h='<div class="card"><div class="tw"><table class="dh-bang gom"><thead><tr><th>Mã đơn</th><th>Kênh · người đặt</th><th>Ngày đặt</th><th class="qt-so">Loại hàng</th><th class="qt-so">SL</th><th class="qt-so">Thiếu</th><th>Deadline gần nhất</th><th>Trạng thái</th></tr></thead><tbody>';
  x.slice(0,DHHet).forEach(function(g){ var mo=DHGom===g.ma;
    h+='<tr><td class="ma"><a href="#" data-m="'+esc(g.ma)+'" onclick="DHGom=DHGom===this.dataset.m?\'\':this.dataset.m;dhVeLai();return false">'+(mo?'▾ ':'▸ ')+esc(g.ma)+'</a></td><td>'+esc(g.kenh)+(g.nguoiDat?' · '+esc(g.nguoiDat):'')+'</td><td>'+dhNg(g.ngayDat)+'</td><td class="qt-so">'+g.dong.length+'</td><td class="qt-so">'+qtSo(g.sl,0)+'</td><td class="qt-so"><b>'+(g.thieu?qtSo(g.thieu,0):'–')+'</b></td><td>'+dhNg(g.dl)+'</td><td>'+dhStChip(g.st)+'</td></tr>';
    if(mo) h+='<tr><td colspan="8"><div style="font-size:13px">'+g.dong.map(function(o){ return '<div style="display:flex;gap:8px;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 0"><span>'+esc(o.ten)+dhVlChip((o.pl||{}).vl)+'</span><span style="white-space:nowrap">'+qtSo(o.sl,0)+' · thiếu <b>'+qtSo(o.thieu,0)+'</b> · '+dhNg(o.dl)+' '+dhStChip(o.st)+'</span></div>'; }).join('')+'</div></td></tr>'; });
  if(!x.length) h+='<tr><td colspan="8" class="pdesc">Không có đơn nào theo bộ lọc.</td></tr>';
  h+='</tbody></table></div>';
  if(x.length>DHHet) h+='<button class="btn sm" type="button" style="margin-top:8px" onclick="DHHet+=500;dhVeLai()">Xem thêm</button>';
  return h+'</div>';
}
function dhTaiTD(){ if(DHTDTai) return; DHTDTai=true; call('layThayDoiDon',[],function(r){ DHTDTai=false; DHTD=(r&&r.ok)?r:{loi:(r&&r.msg)||'Không tải được.'}; dhVeLai(); }); }
function dhVeThayDoi(){
  if(!DHTD){ dhTaiTD(); return '<div class="card pdesc">Đang so với bản chụp gần nhất…</div>'; }
  if(DHTD.loi) return '<div class="alert a-bd">'+esc(DHTD.loi)+'</div>';
  if(!DHTD.truoc) return '<div class="card pdesc">Chưa có bản chụp của ngày trước để so sánh. Web đã chụp bản hôm nay'+(DHTD.daChup?'':' (hoặc sẽ chụp lúc 9h)')+'; từ ngày mai mục này sẽ có số.</div>';
  var nhom=[['moi','','Dòng đơn mới'],['thieu','giam','Còn thiếu giảm (đã làm / giao thêm)'],['thieu','tang','Còn thiếu tăng'],['trangthai','','Đổi trạng thái'],['deadline','','Đổi deadline'],['sl','','Đổi SL đặt'],['xoa','','Không còn trong Sheet']];
  var q=qtKhongDau(DHL.q), x=DHTD.thay.filter(function(t){ return (!DHL.kenh||t.tab===DHL.kenh)&&(!q||qtKhongDau(t.ten+' '+t.maDon).indexOf(q)>=0); });
  var h='<div class="card"><div style="font-size:13px;margin-bottom:8px">So với bản chụp ngày <b>'+dhNg(DHTD.truoc)+'</b>: <b>'+x.length+'</b> thay đổi. <button class="btn sm" type="button" onclick="DHTD=null;dhVeLai()">Tải lại</button></div><div class="tw"><table class="dh-bang"><thead><tr><th>Mã đơn</th><th>Kênh</th><th>Sản phẩm</th><th>Thay đổi</th></tr></thead><tbody>';
  nhom.forEach(function(n){ var a=x.filter(function(t){return t.loai===n[0]&&(!n[1]||t.chieu===n[1])}); if(!a.length) return;
    h+='<tr class="dh-khoi"><td colspan="4">'+n[2]+' · '+a.length+'</td></tr>';
    a.slice(0,300).forEach(function(t){ h+='<tr><td class="ma">'+esc(t.maDon)+'</td><td>'+esc(t.kenh)+'</td><td>'+esc(t.ten)+'</td><td>'+esc(t.mota)+(t.loai==='trangthai'?': '+esc(DH_ST[t.truoc]||t.truoc)+' → '+dhStChip(t.st):'')+'</td></tr>'; }); });
  if(!x.length) h+='<tr><td colspan="4" class="pdesc">Không có thay đổi.</td></tr>';
  return h+'</tbody></table></div></div>';
}
function dhVeThongKe(ds,don){
  var hn=dhHomNay(), mo=ds.filter(function(o){return o.thieu>0}), h='';
  // 1. cơ cấu nhóm gậy × chất liệu (phần còn thiếu)
  var M={}, khoi={}; mo.forEach(function(o){ var p=o.pl||{}, k=dhKhoiSKU(p), v=p.vl||'KHAC'; khoi[k]=1; M[k+'|'+v]=(M[k+'|'+v]||0)+o.thieu; });
  var ks=Object.keys(khoi).sort(function(a,b){return dhThuKhoi(a)-dhThuKhoi(b)}), tc=function(k){return DH_VL.reduce(function(a,v){return a+(M[k+'|'+v]||0)},0)};
  h+='<div class="card"><div style="font-weight:600;margin-bottom:6px">Còn thiếu theo nhóm hàng × chất liệu</div><div class="tw"><table class="dh-bang"><thead><tr><th>Nhóm</th>'+DH_VL.map(function(v){return '<th class="qt-so">'+DH_VL_TEN[v]+'</th>'}).join('')+'<th class="qt-so">Tổng</th></tr></thead><tbody>'+
    ks.map(function(k){ return '<tr><td>'+esc(k)+'</td>'+DH_VL.map(function(v){return '<td class="qt-so">'+(M[k+'|'+v]?qtSo(M[k+'|'+v],0):'–')+'</td>'}).join('')+'<td class="qt-so"><b>'+qtSo(tc(k),0)+'</b></td></tr>'; }).join('')+'</tbody></table></div></div>';
  // 2. lịch giao 14 ngày tới
  var cs=(window.QTS&&QTS.slThang?QTS.slThang/QTS.ngayThang:9000/26), ng=[], tre=mo.filter(function(o){return o.dl&&o.dl<hn}).reduce(function(a,o){return a+o.thieu},0);
  for(var i=0;i<14;i++){ var d=new Date(); d.setDate(d.getDate()+i); var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); ng.push([k,mo.filter(function(o){return o.dl===k}).reduce(function(a,o){return a+o.thieu},0)]); }
  var mx=Math.max.apply(null,ng.map(function(x){return x[1]}).concat([cs]));
  h+='<div class="dh-hai"><div class="card"><div style="font-weight:600">Lịch giao 14 ngày tới (còn thiếu theo deadline)</div><div style="font-size:12px;color:var(--ink3)">Đỏ: ngày cần giao nhiều hơn sản lượng 1 ngày (~'+qtSo(cs,0)+' sp). Đã trễ hạn: <b class="bd">'+qtSo(tre,0)+'</b> sp.</div><div class="dh-cong">'+
    ng.map(function(x){ return '<i class="'+(x[1]>cs?'vuot':'')+'" style="height:'+Math.max(2,x[1]/mx*100)+'%" title="'+dhNg(x[0])+': '+qtSo(x[1],0)+' sp"></i>'; }).join('')+'</div><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)"><span>'+dhNg(ng[0][0])+'</span><span>'+dhNg(ng[13][0])+'</span></div></div>';
  // 3. tuổi đơn đang làm
  var tuoi=[['0–7 ngày',0,7],['8–14 ngày',8,14],['15–30 ngày',15,30],['trên 30 ngày',31,99999]], dang=don.filter(function(g){return g.thieu>0&&g.ngayDat});
  h+='<div class="card"><div style="font-weight:600;margin-bottom:6px">Tuổi đơn đang làm (tính từ ngày đặt)</div><table class="dh-bang"><tbody>'+tuoi.map(function(t){ var a=dang.filter(function(g){var n=dhCachNgay(g.ngayDat,hn);return n>=t[1]&&n<=t[2]}); return '<tr><td>'+t[0]+'</td><td class="qt-so">'+a.length+' đơn</td><td class="qt-so">'+qtSo(a.reduce(function(x,g){return x+g.thieu},0),0)+' sp</td></tr>'; }).join('')+'</tbody></table></div></div>';
  // 4. theo kênh
  var kn={}; don.forEach(function(g){ var k=kn[g.kenh]||(kn[g.kenh]={don:0,sl:0,thieu:0,tre:0}); k.don++; k.sl+=g.sl; k.thieu+=g.thieu; if(g.st==='treHan')k.tre++; });
  h+='<div class="dh-hai"><div class="card"><div style="font-weight:600;margin-bottom:6px">Theo kênh</div><div class="tw"><table class="dh-bang"><thead><tr><th>Kênh</th><th class="qt-so">Đơn</th><th class="qt-so">SL</th><th class="qt-so">Còn thiếu</th><th class="qt-so">Trễ</th></tr></thead><tbody>'+
    Object.keys(kn).sort(function(a,b){return kn[b].thieu-kn[a].thieu}).map(function(k){var o=kn[k];return '<tr><td>'+esc(k)+'</td><td class="qt-so">'+o.don+'</td><td class="qt-so">'+qtSo(o.sl,0)+'</td><td class="qt-so">'+qtSo(o.thieu,0)+'</td><td class="qt-so'+(o.tre?' bad':'')+'">'+(o.tre||'–')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
  // 5. xu hướng còn thiếu theo bản chụp hằng ngày
  h+='<div class="card"><div style="font-weight:600;margin-bottom:6px">Xu hướng tổng còn thiếu (bản chụp mỗi ngày)</div>';
  if(!DHTD){ dhTaiTD(); h+='<div class="pdesc">Đang tải…</div>'; }
  else if(DHTD.loi||!DHTD.lichSu||DHTD.lichSu.length<2) h+='<div class="pdesc">Cần ít nhất 2 ngày chụp (tự chụp lúc 9h mỗi sáng) mới vẽ được xu hướng.</div>';
  else { var ls=DHTD.lichSu.slice(-30), m2=Math.max(1,Math.max.apply(null,ls.map(function(x){return x[1]})));
    h+='<div class="dh-cong">'+ls.map(function(x){return '<i style="height:'+Math.max(2,x[1]/m2*100)+'%" title="'+dhNg(x[0])+': '+qtSo(x[1],0)+' sp, '+x[2]+' dòng trễ"></i>'}).join('')+'</div><div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3)"><span>'+dhNg(ls[0][0])+'</span><span>'+dhNg(ls[ls.length-1][0])+'</span></div>'; }
  h+='</div></div><div style="font-size:12px;color:var(--ink3)">Tỷ lệ giao đúng hạn cần ngày giao thực tế – Sheet đơn chưa có cột này nên chưa tính.</div>';
  return h;
}
function dhBangXuat(){
  var ds=dhSapXep(dhLoc());
  return [['Mã đơn','Kênh','Người đặt','Ngày đặt','Sản phẩm','Nhóm','Chất liệu','SL','Còn thiếu','Giao được','Deadline','Trạng thái','Chú thích']].concat(ds.map(function(o){ var p=o.pl||{};
    return [o.maDon,o.kenh,o.nguoiDat||'',dhNg(o.ngayDat),o.ten,dhKhoiSKU(p),DH_VL_TEN[p.vl]||'',o.sl,o.thieu,o.giao||0,dhNg(o.dl),DH_ST[o.st]||o.st,o.chuThich||'']; }));
}
function dhXuatExcel(){
  if(!DH||DH.loi) return;
  napThuVien('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','XLSX',function(){
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(dhBangXuat()),'Don hang');
    XLSX.writeFile(wb,'DonHang_'+dhHomNay()+'.xlsx'); toast('Đã tạo file Excel.',true);
  });
}
function dhInPDF(){
  if(!DH||DH.loi) return;
  var b=dhBangXuat(), w=window.open('','_blank');
  if(!w){ toast('Trình duyệt chặn cửa sổ mới – cho phép bật cửa sổ rồi bấm lại.'); return; }
  w.document.write('<!doctype html><meta charset="utf-8"><title>Đơn hàng '+dhHomNay()+'</title><style>body{font:11px system-ui,sans-serif;margin:12px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:3px 5px;text-align:left}th{background:#eee}</style><h3>Đơn hàng – '+dhNg(dhHomNay())+' ('+(b.length-1)+' dòng)</h3><table>'+
    b.map(function(r,i){ return '<tr>'+r.map(function(c){ return (i?'<td>':'<th>')+esc(String(c))+(i?'</td>':'</th>'); }).join('')+'</tr>'; }).join('')+'</table>');
  w.document.close(); setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} },300);
}
window.__qtDaNap=true;
</script>
