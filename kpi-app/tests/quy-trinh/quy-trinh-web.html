<script>
/* ===== Quy trình sản xuất (31/10) ===== */
var QT=null, QTV='nm', QTX='', QTS=null, QTSoNgay=0, QTD=null, QTDoi=false, QTMo='';
var QT_NHANH_DONG={NGON:1,CHUOI:1,GAY1K:1}, QT_NHANH_NGOAI={LAMLAI:1,HOTRO:1,CHUAXEP:1};
var QT_THU_NHANH=['CHUNG','NGON','CHUOI','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','LAMLAI','HOTRO','CHUAXEP'];
function qtSo(v,k){ k=k==null?1:k; return Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:k,minimumFractionDigits:0}); }
function qtPt(v){ return Math.round(v*100)+'%'; }
function qtMuc(t){ return t>1?'bd':(t>0.85?'wn':''); }
function qtTenX(x){ var p=(QT.xuong||[]).filter(function(a){return a.MaXuong===x})[0]; return p?String(p.TenXuong).replace(/^Xưởng\s+/,''):x; }

/* Công đoạn trước – giống hệt qtCanh_ ở máy chủ (tests/quy-trinh/quy-trinh.gs) */
function qtCanh(ds){
  var theoX={}, out={};
  ds.forEach(function(c){ (theoX[c.MaXuong]=theoX[c.MaXuong]||[]).push(c); });
  Object.keys(theoX).forEach(function(x){
    var cs=theoX[x];
    var lonNhat=function(nh,s){ var b=0; cs.forEach(function(c){ if(c.Nhanh===nh&&c.Buoc<s&&c.Buoc>b)b=c.Buoc; }); return b; };
    var o=function(nh,b){ return cs.filter(function(c){return c.Nhanh===nh&&c.Buoc===b}).map(function(c){return c.Ma}); };
    cs.forEach(function(c){
      if(c.Truoc&&c.Truoc.length){ out[c.Ma]=c.Truoc.slice(); return; }
      var r=[];
      if(QT_NHANH_NGOAI[c.Nhanh]) r=[];
      else if(c.Nhanh==='CHUNG'){
        var sc=lonNhat('CHUNG',c.Buoc);
        Object.keys(QT_NHANH_DONG).forEach(function(nh){ var b=lonNhat(nh,c.Buoc); if(b&&b>sc) r=r.concat(o(nh,b)); });
        if(!r.length&&sc) r=o('CHUNG',sc);
      } else {
        var sb=lonNhat(c.Nhanh,c.Buoc), sc2=QT_NHANH_DONG[c.Nhanh]?lonNhat('CHUNG',c.Buoc):0;
        if(sc2>sb) r=o('CHUNG',sc2); else if(sb) r=o(c.Nhanh,sb);
      }
      out[c.Ma]=r;
    });
  });
  return out;
}

/* Tính tải: giờ chuẩn = sản lượng ÷ định mức (quy mọi đơn vị về giờ-người) */
/* Sản lượng yêu cầu (01/11, chủ dự án): sp/tháng ÷ ngày làm = sp/ngày; so với nhịp hiện nay (công đoạn "Đóng gói thành phẩm" trong kỳ, hoặc số tự nhập) -> % mục tiêu */
var QT_CD_DONGGOI=['DG-DONGGOITP','DG-DONLE-GAY-NGON','DG-DONLE-NGON','DG-DONLE-CUSTOM','DG-DONLE-COMBO'];   /* đóng gói thành phẩm + đóng đơn lẻ (không tính phụ kiện, bao cơ) */
function qtSlNayDo(){ var sl=0; QT_CD_DONGGOI.forEach(function(m){ var t=(QT.thongKe||{})[m]; if(t&&t.sl>0) sl+=t.sl; }); return sl/Math.max(1,QT.soNgaySX||1); }
function qtSlNay(){ return QTS.slNay>0?QTS.slNay:qtSlNayDo(); }
function qtMT(){ var n=qtSlNay(), y=QTS.slThang/Math.max(1,QTS.ngayThang); if(n>0) QTS.mucTieu=Math.max(10,Math.min(500,Math.round(y/n*100))); return QTS.mucTieu; }
function qtTinh(){
  qtMT();
  var N=Math.max(1,QT.soNgaySX||1), mt=QTS.mucTieu/100, gioNguoi=QTS.gioCoMat*QTS.hieuSuat, nc=QT.ngayCong||{};
  var cd={}, x={}, gcTot={};
  (QT.xuong||[]).forEach(function(p){ x[p.MaXuong]={ma:p.MaXuong,gio:0,can:0,co:0,coMat:0,ql:0,cd:[],khongDM:0}; });
  (QT.nhanSu||[]).forEach(function(n){ var o=x[n.MaXuong]; if(!o)return;
    if(/^\s*(trưởng phòng|phó phòng|quản lý|giám đốc)/i.test(n.ChucDanh)) o.ql++; else { o.co++; o.coMat+=Math.min(1,(nc[n.MaNV]||0)/N); } /* tổ trưởng vẫn tính là người làm */ });
  var ten={}; (QT.nhanSu||[]).forEach(function(n){ ten[n.MaNV]=n.HoTen; });
  // giờ chuẩn của từng người (để chia thời gian có mặt của họ cho các công đoạn – không đếm 1 người đủ ở mọi công đoạn)
  Object.keys(QT.thongKe).forEach(function(m){ var dm=(QT.cdMap[m]||{}).DM; if(!(dm>0))return;
    var ng=QT.thongKe[m].nguoi||{}; Object.keys(ng).forEach(function(p){ gcTot[p]=(gcTot[p]||0)+ng[p]/dm; }); });
  QTD.forEach(function(q){
    var c=(QT.cdMap[q.Ma]||{}), t=QT.thongKe[q.Ma]||{sl:0,nguoi:{}}, kn=(QT.kyNang||{})[q.Ma]||{};
    var biet={}; Object.keys(t.nguoi||{}).forEach(function(m){ biet[m]='nk'; }); Object.keys(kn).forEach(function(m){ biet[m]=biet[m]?'ca':'kn'; });
    var slN=t.sl/N, gio=c.DM>0?slN/c.DM:0, can=gio*mt/gioNguoi, nb=Object.keys(biet).length, fte=0;
    if(c.DM>0) Object.keys(t.nguoi||{}).forEach(function(p){ if(gcTot[p]>0) fte+=(t.nguoi[p]/c.DM)/gcTot[p]*Math.min(1,(nc[p]||0)/N); });
    var o={ma:q.Ma,ten:c.TenCD||q.Ma,x:q.MaXuong,nhanh:q.Nhanh,buoc:q.Buoc,dm:c.DM||0,dvt:c.DVT||'',slN:slN,gio:gio,can:can,biet:biet,nb:nb,fte:fte,
      tai:fte>0.01?can/fte:(can>0.05?9:0), khongDM:!(c.DM>0)&&t.sl>0, tenNguoi:Object.keys(biet).map(function(m){return ten[m]||m}) };
    o.mot = can>0.05 && nb<=1; o.hai = can>0.05 && nb===2;
    cd[q.Ma]=o;
    var xo=x[q.MaXuong]; if(!xo)return;
    xo.gio+=gio; xo.can+=can; xo.cd.push(o); if(o.khongDM)xo.khongDM++;
  });
  var ds=Object.keys(x).map(function(k){ var o=x[k], co=o.coMat>0.5?o.coMat:o.co;
    o.tai=co?o.can/co:(o.can>0?9:0); o.tai100=o.tai/mt; o.toiDa=o.tai>0?QTS.mucTieu/o.tai:0; o.thieu=Math.max(0,Math.ceil(o.can-co-1e-9));
    o.nangSuat=co?o.gio/(co*QTS.gioCoMat):0; return o; });
  var co=ds.filter(function(o){return o.can>0});
  var max=co.reduce(function(a,o){return o.tai>a.tai?o:a},{tai:0});
  var lbr=co.length&&max.tai?co.reduce(function(a,o){return a+o.tai},0)/(co.length*max.tai):0;
  return {cd:cd,x:x,ds:ds,nut:max,lbr:lbr,N:N};
}

function vQTTai(){
  $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Đang tính từ nhật ký sản xuất…</div>';
  call('layQuyTrinh',[QTSoNgay||0],function(r){
    if(!r||!r.ok){ $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="alert a-wn">'+esc((r&&r.msg)||'Không tải được.')+'</div>'; return; }
    qtNhan(r); qtVe();
  });
}
/* Nạp số liệu quy trình không vẽ (tab Đơn hàng cần để tính giờ / ngày theo xưởng) */
function qtNapNgam(cb){ call('layQuyTrinh',[QTSoNgay||0],function(r){ if(r&&r.ok) qtNhan(r); cb(!!(r&&r.ok)); }); }
function qtNhan(r){
    QT=r; QTSoNgay=r.soNgay; QT.cdMap={}; (r.congDoan||[]).forEach(function(c){ QT.cdMap[c.MaCD]=c; });
    QTS={gioCoMat:r.caiDat.gioCoMat,hieuSuat:r.caiDat.hieuSuat,mucTieu:r.caiDat.mucTieu,slThang:r.caiDat.slThang||9000,ngayThang:r.caiDat.ngayThang||26,slNay:r.caiDat.slNay||0};
    QTD=r.quyTrinh.map(function(q){ return {Ma:q.Ma,MaXuong:q.MaXuong,Nhanh:q.Nhanh,Buoc:Number(q.Buoc)||1,Truoc:(q.Truoc||[]).slice(),GhiChu:q.GhiChu||'',moi:!!q.moi}; });
    QT.luong=(r.xuongLuong||[]).map(function(a){return {Tu:a.Tu,Den:a.Den,BTP:a.BTP,GhiChu:a.GhiChu||''}});
    QTDoi=false; QTHoan=[]; QTChonThe='';
    if(!QTX){ var t=qtTinh(); QTX=t.nut.ma||((r.xuong[0]||{}).MaXuong); }
}
function qtVe(){
  if(!QT){ vQTTai(); return; }
  var T=qtTinh();
  var h='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Bản thử – chỉ tài khoản chủ sở hữu thấy. Số liệu từ nhật ký sản xuất '+esc(QT.tu)+' → '+esc(QT.den)+' ('+QT.soNgaySX+' ngày có sản xuất).</div>';

/* ===== Cách A (01/11, chủ dự án chọn): bước xuất mỗi xưởng → số ra mỗi ngày từ nhật ký KPI =====

var QT_XUAT_MD={PHOICB:/kiem dem.*xuat|danh bong ngon/,PHOITHO:/ve sinh ren va phoi|taro ngon/,SON:/^son may tu dong$|^son sung tay$/,INUV:/phu bong/,NGONTARO:/cat mat ren dong|cat mat epoxy gf/,NGONTIP:/^lam dau/,

function qtXuatLuu(x){ return (QT.xuatSua&&QT.xuatSua[x])||((QT.xuat||{})[x]&&QT.xuat[x].length?QT.xuat[x]:null); }
function qtXuat(x){ var a=qtXuatLuu(x); if(a) return a; var rg=QT_XUAT_MD[x]; return rg?QTD.filter(function(q){return q.MaXuong===x&&rg.test(qtKhongDau((QT.cdMap[q.Ma]||{}).TenCD))}).map(function(q){return q.Ma}):[]; }
function qtRa(x){

}

/* --- Sửa quy trình (02/11, chủ dự án chọn A + B: kéo thả trên lưu đồ ở máy tính + danh sách ↑↓ ở mọi máy; điện thoại không có lưu đồ) ---
   Mô hình: mỗi công đoạn có nhánh (hàng) + bước (cột). Cùng bước = làm song song. Số bước tự đánh lại 1..n sau mỗi lần sửa (qtChuanBuoc). */
var QT_MAU_NHANH={CHUNG:'#7fb3ff',NGON:'#4fd19a',CHUOI:'#ffb15c',GAY1K:'#c79bff',NOI:'#ff8fb1',TIP:'#5fd7e6',PHIP:'#a6d65f',POM:'#e6c25f',PK:'#b0b8c8',DONLE:'#e69f7a',LAMLAI:'#ff7a7a',HOTRO:'#9aa4b4',CHUAXEP:'#8a8a8a'};
var QTHoan=[], QTKeo='', QTChonThe='', QTLanThem={}, QTMoDs=null;
function qtCsX(x){ return QTD.filter(function(q){return q.MaXuong===x}); }
function qtNgoai(q){ return !!QT_NHANH_NGOAI[q.Nhanh]; }
function qtTenCD(m){ return (QT.cdMap[m]||{}).TenCD||m; }
function qtChup(){ QTHoan.push(JSON.stringify({d:QTD.map(function(q){return [q.Ma,q.Nhanh,q.Buoc,q.Truoc||[],q.moi]}),x:QT.xuatSua||null})); if(QTHoan.length>60) QTHoan.shift(); }
function qtHoanTac(im){ var s=QTHoan.pop(); if(!s) return; var o=JSON.parse(s), m={}; o.d.forEach(function(a){m[a[0]]=a});
  QTD.forEach(function(q){ var a=m[q.Ma]; if(a){ q.Nhanh=a[1]; q.Buoc=a[2]; q.Truoc=a[3]; q.moi=a[4]; } }); QT.xuatSua=o.x; QTDoi=true; if(!im){ qtVe(); toast('Đã hoàn tác 1 bước.',true); } }
/* đánh lại số bước 1..n (giữ thứ tự); công đoạn ngoài dòng chảy đánh số riêng theo nhánh */
function qtChuanBuoc(x){
  var cs=qtCsX(x), tren=cs.filter(function(q){return !qtNgoai(q)}), bs=[];
  tren.forEach(function(q){ if(bs.indexOf(q.Buoc)<0) bs.push(q.Buoc); }); bs.sort(function(a,b){return a-b});
  tren.forEach(function(q){ q.Buoc=bs.indexOf(q.Buoc)+1; });
  var ng={}; cs.filter(qtNgoai).sort(function(a,b){return a.Buoc-b.Buoc}).forEach(function(q){ ng[q.Nhanh]=(ng[q.Nhanh]||0)+1; q.Buoc=ng[q.Nhanh]; });
}
/* áp 1 thay đổi: lưu để hoàn tác, đánh lại bước, chặn vòng lặp (do nối chọn tay) */
function qtApDung(m,f,bao){
  var q=qtTim(m); if(!q) return;
  qtChup(); f(q); qtChuanBuoc(q.MaXuong);
  if(qtVong(qtCanh(qtCsX(q.MaXuong)))){ qtHoanTac(true); qtVe(); toast('Đổi như vậy sẽ thành vòng lặp (do có nối chọn tay) – đã hoàn lại.'); return; }
  q.moi=false; QTDoi=true; qtVe(); if(bao) toast(bao,true);
}
function qtBuocKhac(q){ var S=[]; qtCsX(q.MaXuong).forEach(function(c){ if(c!==q&&!qtNgoai(c)&&S.indexOf(c.Buoc)<0) S.push(c.Buoc); }); return S.sort(function(a,b){return a-b}); }
/* ↑ / ↓: đi lần lượt qua các vị trí "bước riêng trước X" → "cùng bước với X" → "bước riêng sau X"… */
function qtDichBuoc(m,d){
  var q=qtTim(m); if(!q||qtNgoai(q)) return;
  var S=qtBuocKhac(q), i=S.indexOf(q.Buoc), p=(i>=0?2*i+1:2*S.filter(function(b){return b<q.Buoc}).length)+d;
  if(p<0||p>2*S.length){ toast(d<0?'Đã ở đầu.':'Đã ở cuối.'); return; }
  var b, ban;
  if(p%2){ b=S[(p-1)/2]; ban=qtCsX(q.MaXuong).filter(function(c){return c!==q&&!qtNgoai(c)&&c.Buoc===b}).map(function(c){return qtTenCD(c.Ma)});
    qtApDung(m,function(q){q.Buoc=b},'"'+qtTenCD(m)+'" làm cùng lúc với: '+ban.join(', ')+'.'); }
  else { var k=p/2, lo=k>0?S[k-1]:0, hi=k<S.length?S[k]:(S.length?S[S.length-1]+2:2); b=(lo+hi)/2;
    qtApDung(m,function(q){q.Buoc=b},'"'+qtTenCD(m)+'" thành bước riêng.'); }
}
function qtDoiNhanh(m,v){ qtApDung(m,function(q){ q.Nhanh=v; if(QT_NHANH_NGOAI[v]) q.Buoc=999; },'Đã chuyển sang nhánh '+(QT.nhanh[v]||v)+'.'); }

  else h+='<button class="btn sm" type="button" onclick="CHThemK=\''+L+'\';dhVeLai()">+ Thêm '+ten.toLowerCase().replace(/^loại /,'loại ')+'</button>';
  return h+'</div>';
}
function dhVeCauHinh(){
  var moi=chMoi(), h='';
  h+='<div class="card"><div style="font-weight:600;margin-bottom:4px">Sản phẩm mới chưa có cấu hình · '+moi.length+' tên</div><div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">Tên hàng trong Sheet đơn (còn thiếu) mà web chưa nhận ra dòng gậy – đang tạm tính là gậy đánh, chất liệu chưa rõ. Cách nhanh: <b>Tạo dòng gậy mới</b> (mọi tên cùng dòng tự nhận), hoặc <b>Sửa riêng tên này</b> nếu chỉ là hàng lẻ.</div>';
  h+=moi.length?'<div class="tw"><table class="dh-bang"><thead><tr><th>Tên hàng</th><th class="qt-so">Còn thiếu</th><th></th></tr></thead><tbody>'+moi.map(function(x){ return '<tr><td>'+esc(x.ten)+'</td><td class="qt-so">'+qtSo(x.thieu,0)+'</td><td style="white-space:nowrap"><button class="btn sm" type="button" data-t="'+esc(x.ten)+'" onclick="chMoForm(\'\',this.dataset.t)">Tạo dòng gậy mới</button> <button class="btn sm" type="button" data-t="'+esc(x.ten)+'" onclick="DHV=\'kiem\';DHChiCC=true;DHMo=\'k|\'+this.dataset.t;dhVeLai()">Sửa riêng tên này</button></td></tr>'; }).join('')+'</tbody></table></div>':'<div class="pdesc">✓ Mọi tên hàng đang có đơn đều đã có cấu hình.</div>';
  h+='</div>';
  if(CHForm) h+=chFormHTML();
  // dòng gậy theo loại hàng
  var dd=(DH.nhan.dongDu||[]).filter(function(d){return d.loai==='GAY'||d.loai==='NGON'||d.loai==='CHUOI'}), dem={};
  DH.don.forEach(function(o){ var p=o.pl||{}; if(o.thieu>0&&p.dong) dem[p.dong]=(dem[p.dong]||0)+o.thieu; });
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><b>Dòng gậy ('+dd.length+')</b><button class="btn sm" type="button" onclick="chMoForm(\'\',\'\')">+ Thêm dòng gậy</button></div><div class="tw"><table class="dh-bang ch-d"><thead><tr><th>Dòng gậy</th><th>Chữ nhận diện</th><th>Chuôi</th><th>Ngọn</th><th>Tip · ren · đầu</th><th class="qt-so">Còn thiếu</th><th></th></tr></thead><tbody>';
  [['GAY','Gậy 2 khúc'],['NGON','Ngọn bán lẻ'],['CHUOI','Chuôi bán lẻ']].forEach(function(g){
    var a=dd.filter(function(d){return d.loai===g[0]}).sort(function(x,y){ return (dhThuVl(chVlTen('ngon',x.ngon))-dhThuVl(chVlTen('ngon',y.ngon)))||String(x.ten).localeCompare(String(y.ten)); });
    if(!a.length) return;
    h+='<tr class="dh-khoi"><td colspan="5">'+g[1]+' · '+a.length+' dòng</td><td class="qt-so">'+qtSo(a.reduce(function(s,d){return s+(dem[d.ma]||0)},0),0)+'</td><td></td></tr>';
    a.forEach(function(d){ var c=d.chuoi&&d.chuoi!=='KHONG', n=d.ngon&&d.ngon!=='KHONG';
      h+='<tr><td>'+esc(d.ten)+(d.them?' <span class="qt-tag mo">tự thêm</span>':'')+'</td><td style="font-size:12px;color:var(--ink2)">'+esc(d.goi.slice(0,4).join(', '))+(d.goi.length>4?'…':'')+'</td>'+
        '<td>'+(c?esc(dhTen('chuoi',d.chuoi))+dhVlChip(chVlTen('chuoi',d.chuoi)):'–')+'</td><td>'+(n?esc(dhTen('ngon',d.ngon))+dhVlChip(chVlTen('ngon',d.ngon)):'–')+'</td>'+
        '<td style="font-size:12.5px">'+[d.tip&&d.tip!=='KHONG'?dhTen('tip',d.tip):'',d.ren?dhTen('ren',d.ren):'',d.dau].filter(Boolean).map(esc).join(' · ')+'</td><td class="qt-so">'+(dem[d.ma]?qtSo(dem[d.ma],0):'–')+'</td>'+
        '<td><button class="btn sm" type="button" data-m="'+esc(d.ma)+'" onclick="chMoForm(this.dataset.m)">Sửa</button></td></tr>'; });
  });
  h+='</tbody></table></div></div>';
  h+=chBangKhuc('CHUOI','chuoi','Loại chuôi')+chBangKhuc('NGON','ngon','Loại ngọn')+chBangKhuc('TIP','tip','Loại tip');
  h+='<div style="font-size:12px;color:var(--ink3)">Chất liệu / kiểu đổi ở đây áp ngay cho mọi sản phẩm dùng loại đó (nhãn Chuôi / Ngọn, Việc theo xưởng, Thống kê). Loại đã có đơn chỉ ẩn được khỏi ô chọn, không xóa. Cấu hình lưu ở sheet CauHinhSP trong file KPI (không sửa Sheet đơn hàng).</div>';
  return h;
}
