<script>
/* ===== Quy trình sản xuất (31/10) ===== */
var QT=null, QTV='nm', QTX='', QTS=null, QTSoNgay=0, QTD=null, QTDoi=false, QTMo='';
var QT_NHANH_DONG={NGON:1,CHUOI:1,GAY1K:1}, QT_NHANH_NGOAI={LAMLAI:1,HOTRO:1,CHUAXEP:1};
var QT_THU_NHANH=['CHUNG','NGON','CHUOI','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','LAMLAI','HOTRO','CHUAXEP'];
function qtSo(v,k){ k=k==null?1:k; return Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:k,minimumFractionDigits:0}); }
function qtPt(v){ return Math.round(v*100)+'%'; }
function qtMuc(t){ return t>1?'bd':(t>0.85?'wn':''); }
function qtTenX(x){ var p=(QT.xuong||[]).filter(function(a){return a.MaXuong===x})[0]; return p?String(p.TenXuong).replace(/^Xưởng\s+/,''):x; }

/* Công đoạn trước – giống hệt qtCanh_ ở máy chủ (tests/quy-trinh/quy-trinh.gs) */
function qtCanh(ds){
  var theoX={}, out={};
  ds.forEach(function(c){ (theoX[c.MaXuong]=theoX[c.MaXuong]||[]).push(c); });
  Object.keys(theoX).forEach(function(x){
    var cs=theoX[x];
    var lonNhat=function(nh,s){ var b=0; cs.forEach(function(c){ if(c.Nhanh===nh&&c.Buoc<s&&c.Buoc>b)b=c.Buoc; }); return b; };
    var o=function(nh,b){ return cs.filter(function(c){return c.Nhanh===nh&&c.Buoc===b}).map(function(c){return c.Ma}); };
    cs.forEach(function(c){
      if(c.Truoc&&c.Truoc.length){ out[c.Ma]=c.Truoc.slice(); return; }
      var r=[];
      if(QT_NHANH_NGOAI[c.Nhanh]) r=[];
      else if(c.Nhanh==='CHUNG'){
        var sc=lonNhat('CHUNG',c.Buoc);
        Object.keys(QT_NHANH_DONG).forEach(function(nh){ var b=lonNhat(nh,c.Buoc); if(b&&b>sc) r=r.concat(o(nh,b)); });
        if(!r.length&&sc) r=o('CHUNG',sc);
      } else {
        var sb=lonNhat(c.Nhanh,c.Buoc), sc2=QT_NHANH_DONG[c.Nhanh]?lonNhat('CHUNG',c.Buoc):0;
        if(sc2>sb) r=o('CHUNG',sc2); else if(sb) r=o(c.Nhanh,sb);
      }
      out[c.Ma]=r;
    });
  });
  return out;
}

/* Tính tải: giờ chuẩn = sản lượng ÷ định mức (quy mọi đơn vị về giờ-người) */
function qtTinh(){
  var N=Math.max(1,QT.soNgaySX||1), mt=QTS.mucTieu/100, gioNguoi=QTS.gioCoMat*QTS.hieuSuat, nc=QT.ngayCong||{};
  var cd={}, x={}, gcTot={};
  (QT.xuong||[]).forEach(function(p){ x[p.MaXuong]={ma:p.MaXuong,gio:0,can:0,co:0,coMat:0,ql:0,cd:[],khongDM:0}; });
  (QT.nhanSu||[]).forEach(function(n){ var o=x[n.MaXuong]; if(!o)return;
    if(/^\s*(trưởng phòng|phó phòng|quản lý|giám đốc)/i.test(n.ChucDanh)) o.ql++; else { o.co++; o.coMat+=Math.min(1,(nc[n.MaNV]||0)/N); } /* tổ trưởng vẫn tính là người làm */ });
  var ten={}; (QT.nhanSu||[]).forEach(function(n){ ten[n.MaNV]=n.HoTen; });
  // giờ chuẩn của từng người (để chia thời gian có mặt của họ cho các công đoạn – không đếm 1 người đủ ở mọi công đoạn)
  Object.keys(QT.thongKe).forEach(function(m){ var dm=(QT.cdMap[m]||{}).DM; if(!(dm>0))return;
    var ng=QT.thongKe[m].nguoi||{}; Object.keys(ng).forEach(function(p){ gcTot[p]=(gcTot[p]||0)+ng[p]/dm; }); });
  QTD.forEach(function(q){
    var c=(QT.cdMap[q.Ma]||{}), t=QT.thongKe[q.Ma]||{sl:0,nguoi:{}}, kn=(QT.kyNang||{})[q.Ma]||{};
    var biet={}; Object.keys(t.nguoi||{}).forEach(function(m){ biet[m]='nk'; }); Object.keys(kn).forEach(function(m){ biet[m]=biet[m]?'ca':'kn'; });
    var slN=t.sl/N, gio=c.DM>0?slN/c.DM:0, can=gio*mt/gioNguoi, nb=Object.keys(biet).length, fte=0;
    if(c.DM>0) Object.keys(t.nguoi||{}).forEach(function(p){ if(gcTot[p]>0) fte+=(t.nguoi[p]/c.DM)/gcTot[p]*Math.min(1,(nc[p]||0)/N); });
    var o={ma:q.Ma,ten:c.TenCD||q.Ma,x:q.MaXuong,nhanh:q.Nhanh,buoc:q.Buoc,dm:c.DM||0,dvt:c.DVT||'',slN:slN,gio:gio,can:can,biet:biet,nb:nb,fte:fte,
      tai:fte>0.01?can/fte:(can>0.05?9:0), khongDM:!(c.DM>0)&&t.sl>0, tenNguoi:Object.keys(biet).map(function(m){return ten[m]||m}) };
    o.mot = can>0.05 && nb<=1; o.hai = can>0.05 && nb===2;
    cd[q.Ma]=o;
    var xo=x[q.MaXuong]; if(!xo)return;
    xo.gio+=gio; xo.can+=can; xo.cd.push(o); if(o.khongDM)xo.khongDM++;
  });
  var ds=Object.keys(x).map(function(k){ var o=x[k], co=o.coMat>0.5?o.coMat:o.co;
    o.tai=co?o.can/co:(o.can>0?9:0); o.tai100=o.tai/mt; o.toiDa=o.tai>0?QTS.mucTieu/o.tai:0; o.thieu=Math.max(0,Math.ceil(o.can-co-1e-9));
    o.nangSuat=co?o.gio/(co*QTS.gioCoMat):0; return o; });
  var co=ds.filter(function(o){return o.can>0});
  var max=co.reduce(function(a,o){return o.tai>a.tai?o:a},{tai:0});
  var lbr=co.length&&max.tai?co.reduce(function(a,o){return a+o.tai},0)/(co.length*max.tai):0;
  return {cd:cd,x:x,ds:ds,nut:max,lbr:lbr,N:N};
}

function vQTTai(){
  $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Đang tính từ nhật ký sản xuất…</div>';
  call('layQuyTrinh',[QTSoNgay||0],function(r){
    if(!r||!r.ok){ $('main').innerHTML='<div class="ptitle">Quy trình sản xuất</div><div class="alert a-wn">'+esc((r&&r.msg)||'Không tải được.')+'</div>'; return; }
    QT=r; QTSoNgay=r.soNgay; QT.cdMap={}; (r.congDoan||[]).forEach(function(c){ QT.cdMap[c.MaCD]=c; });
    QTS={gioCoMat:r.caiDat.gioCoMat,hieuSuat:r.caiDat.hieuSuat,mucTieu:r.caiDat.mucTieu};
    QTD=r.quyTrinh.map(function(q){ return {Ma:q.Ma,MaXuong:q.MaXuong,Nhanh:q.Nhanh,Buoc:Number(q.Buoc)||1,Truoc:(q.Truoc||[]).slice(),GhiChu:q.GhiChu||'',moi:!!q.moi}; });
    QT.luong=(r.xuongLuong||[]).map(function(a){return {Tu:a.Tu,Den:a.Den,BTP:a.BTP,GhiChu:a.GhiChu||''}});
    QTDoi=false;
    if(!QTX){ var t=qtTinh(); QTX=t.nut.ma||((r.xuong[0]||{}).MaXuong); }
    qtVe();
  });
}
function qtVe(){
  if(!QT){ vQTTai(); return; }
  var T=qtTinh();
  var h='<div class="ptitle">Quy trình sản xuất</div><div class="pdesc">Bản thử – chỉ tài khoản chủ sở hữu thấy. Số liệu từ nhật ký sản xuất '+esc(QT.tu)+' → '+esc(QT.den)+' ('+QT.soNgaySX+' ngày có sản xuất).</div>';
  if(QT.nhap) h+='<div class="alert a-wn">Đây là <b>quy trình nháp</b> Claude soạn từ tên công đoạn và các file anh/chị gửi. Xem ở "Từng xưởng", sửa ở "Sửa quy trình", bấm <b>Lưu</b> để chốt.</div>';
  var moi=QTD.filter(function(q){return q.moi}).length;
  if(moi) h+='<div class="alert a-wn">'+moi+' công đoạn mới chưa có trong quy trình đã lưu – xem ở "Sửa quy trình".</div>';
  h+='<div class="qt-bar">'+
    '<div><label for="qtKy">Kỳ dữ liệu</label><select id="qtKy" onchange="QTSoNgay=+this.value;vQTTai()">'+[14,30,60,90].map(function(n){return '<option value="'+n+'"'+(n===QTSoNgay?' selected':'')+'>'+n+' ngày</option>'}).join('')+'</select></div>'+
    '<div><label for="qtMt">Sản lượng mục tiêu</label><input id="qtMt" type="number" inputmode="numeric" min="10" max="500" step="5" value="'+QTS.mucTieu+'" onchange="qtDoiCD(\'mucTieu\',this.value,10,500)"> %</div>'+
    '<div><label for="qtGio">Giờ có mặt / ngày</label><input id="qtGio" type="number" inputmode="decimal" min="1" max="24" step="0.5" value="'+QTS.gioCoMat+'" onchange="qtDoiCD(\'gioCoMat\',this.value,1,24)"></div>'+
    '<div><label for="qtHs">Hiệu suất</label><input id="qtHs" type="number" inputmode="numeric" min="30" max="120" step="5" value="'+Math.round(QTS.hieuSuat*100)+'" onchange="qtDoiCD(\'hieuSuat\',this.value/100,0.3,1.2)"> %</div>'+
  '</div>';
  h+='<div class="qt-tabs">'+[['nm','Toàn nhà máy'],['x','Từng xưởng'],['ng','Con người'],['sua','Sửa quy trình'+(QTDoi?' •':'')]].map(function(t){
    return '<button class="btn'+(QTV===t[0]?' on':'')+'" type="button" onclick="QTV=\''+t[0]+'\';qtVe()">'+t[1]+'</button>'; }).join('')+'</div>';
  if(QTV!=='nm') h+='<div style="margin-bottom:12px"><label for="qtChonX">Xưởng</label> <select id="qtChonX" onchange="QTX=this.value;QTMo=\'\';qtVe()">'+(QT.xuong||[]).map(function(p){
    return '<option value="'+esc(p.MaXuong)+'"'+(p.MaXuong===QTX?' selected':'')+'>'+esc(p.TenXuong)+'</option>'; }).join('')+'</select></div>';
  h+=({nm:qtVeNM,x:qtVeX,ng:qtVeNguoi,sua:qtVeSua}[QTV]||qtVeNM)(T);
  $('main').innerHTML=h;
}
function qtDoiCD(k,v,a,b){ v=Number(v); if(!isFinite(v)||v<a||v>b){ toast('Giá trị phải trong khoảng '+a+'–'+b+'.'); qtVe(); return; } QTS[k]=v; QTDoi=true; qtVe(); }

/* --- Toàn nhà máy --- */
function qtThuTuX(){
  var vao={}, ra={}, xs=(QT.xuong||[]).map(function(p){return p.MaXuong}), kq=[], da={};
  QT.luong.forEach(function(a){ (vao[a.Den]=vao[a.Den]||[]).push(a.Tu); (ra[a.Tu]=ra[a.Tu]||[]).push(a.Den); });
  var conLai=xs.slice();
  while(conLai.length){
    var san=conLai.filter(function(x){ return (vao[x]||[]).every(function(t){return da[t]||xs.indexOf(t)<0}); });
    if(!san.length) san=[conLai[0]];
    san.forEach(function(x){ da[x]=1; kq.push(x); });
    conLai=conLai.filter(function(x){return !da[x]});
  }
  return kq;
}
function qtVeNM(T){
  var n=T.nut, h='<div class="card"><div class="qt-ket">';
  var tongCo=T.ds.reduce(function(a,o){return a+o.co},0), tongMat=T.ds.reduce(function(a,o){return a+o.coMat},0);
  var thieuX=T.ds.filter(function(o){return o.tai>1}).sort(function(a,b){return b.tai-a.tai});
  var ns=T.ds.filter(function(o){return o.nangSuat>0}).map(function(o){return o.nangSuat});
  if(!n.ma) h+='Chưa có sản lượng trong kỳ này để tính.';
  else {
    h+='Nhà máy có <b>'+tongCo+'</b> công nhân trong danh sách, trung bình <b>'+qtSo(tongMat,0)+'</b> người có mặt làm hàng mỗi ngày. ';
    h+='Giữ số người có mặt như hiện nay và làm đạt <b>'+Math.round(QTS.hieuSuat*100)+'%</b> định mức, nhà máy làm được tối đa khoảng <b class="'+(n.toiDa<QTS.mucTieu?'bd':'ok')+'">'+Math.round(n.toiDa)+'%</b> sản lượng của kỳ này';
    h+=n.toiDa<QTS.mucTieu?' – <b class="bd">chưa đủ</b> cho mục tiêu <b>'+QTS.mucTieu+'%</b>.':' – đủ cho mục tiêu <b>'+QTS.mucTieu+'%</b>.';
    if(thieuX.length) h+='<div style="margin-top:6px">Ở mục tiêu '+QTS.mucTieu+'%: '+thieuX.map(function(o,i){return (i?'':'nút thắt ')+'<b class="bd">'+esc(qtTenX(o.ma))+'</b> tải '+qtPt(o.tai)+', thiếu ~'+o.thieu+' người'}).join(' · ')+'.</div>';
    var het=T.ds.filter(function(o){return o.nangSuat>=QTS.hieuSuat-0.02}).sort(function(a,b){return b.nangSuat-a.nangSuat});
    if(het.length) h+='<div style="margin-top:6px">Đang chạy gần hết sức (năng suất thực ≥ '+Math.round(QTS.hieuSuat*100-2)+'% định mức – muốn tăng sản lượng phải thêm người / máy hoặc bớt việc phụ): '+het.map(function(o){return '<b class="wn">'+esc(qtTenX(o.ma))+'</b> '+qtPt(o.nangSuat)}).join(' · ')+'. Các xưởng khác còn dư thời gian để tăng năng suất trước khi phải thêm người.</div>';
    else h+='<div style="margin-top:6px">Xưởng sát giới hạn nhất: <b class="'+(qtMuc(n.tai)||'ok')+'">'+esc(qtTenX(n.ma))+'</b> (tải '+qtPt(n.tai)+').</div>';
    h+='<div style="font-size:13px;color:var(--ink2);margin-top:6px">Tính theo định mức, nên đây là giới hạn <i>về người</i>. Nút thắt thật còn có thể ở máy / mẻ (sơn, sấy, in UV, CNC), hàng chờ giữa các xưởng, hoặc hàng làm lại – những phần này chưa đo được (giai đoạn 2).'+
      (ns.length?' Năng suất thực các xưởng chỉ khoảng '+qtPt(Math.min.apply(null,ns))+'–'+qtPt(Math.max.apply(null,ns))+' định mức: thời gian đang mất ở đâu đó (chờ hàng, hỗ trợ, làm lại, việc chưa có định mức) hoặc định mức chưa sát.':'')+'</div>';
  }
  h+='</div><div style="font-size:12.5px;color:var(--ink3)">Mục tiêu mặc định 137% = nhu cầu theo đơn tháng 10 (đóng gói nhận ~250/ngày, hàng còn thiếu tăng thêm ~92/ngày). Đổi ô "Sản lượng mục tiêu" để thử mức khác; 100% = giữ nhịp hiện nay. Độ cân bằng giữa các xưởng: <b>'+qtPt(T.lbr)+'</b> (dưới 85% là lệch nhiều).</div></div>';
  // luồng bán thành phẩm
  h+='<div class="card"><div style="font-weight:600;margin-bottom:8px">Luồng bán thành phẩm giữa các xưởng</div><div class="qt-luong">';
  var thu=qtThuTuX(), vt={}; thu.forEach(function(x,i){vt[x]=i});
  QT.luong.slice().sort(function(a,b){return (vt[a.Tu]-vt[b.Tu])||(vt[a.Den]-vt[b.Den])}).forEach(function(a){
    var t1=T.x[a.Tu]||{tai:0}, t2=T.x[a.Den]||{tai:0};

  });

    '<p><b>Giờ chuẩn</b> = sản lượng ÷ định mức của từng công đoạn, nên phôi, cây, cái, bộ… đều quy về giờ-người và cộng được với nhau.</p>'+

/* --- Sơ đồ công đoạn của 1 xưởng (dọc, tự xếp tầng) --- */
function qtSoDo(x,T){
  var cs=QTD.filter(function(q){return q.MaXuong===x&&!QT_NHANH_NGOAI[q.Nhanh]});
  if(!cs.length) return '<div class="pdesc">Xưởng chưa có công đoạn trên dòng chảy.</div>';
  var canh=qtCanh(QTD.filter(function(q){return q.MaXuong===x})), tang={}, co={};
  cs.forEach(function(q){co[q.Ma]=1});
  var tinh=function(m,d){ if(tang[m]!=null)return tang[m]; if(d>200)return 0; var t=0; (canh[m]||[]).forEach(function(p){ if(co[p]) t=Math.max(t,tinh(p,d+1)+1); }); return tang[m]=t; };
  cs.forEach(function(q){tinh(q.Ma,0)});
  var hang=[]; cs.forEach(function(q){ (hang[tang[q.Ma]]=hang[tang[q.Ma]]||[]).push(q); });
  hang.forEach(function(r){ r.sort(function(a,b){return (QT_THU_NHANH.indexOf(a.Nhanh)-QT_THU_NHANH.indexOf(b.Nhanh))||(a.Ma<b.Ma?-1:1)}); });
  var W=158, H=58, gx=14, gy=34, rong=0; hang.forEach(function(r){ if(r) rong=Math.max(rong,r.length); });
  var Wt=Math.max(320,rong*(W+gx)+gx), Ht=hang.length*(H+gy)+gy, vi={}, nut=T.x[x]?T.x[x].cd.filter(function(o){return !QT_NHANH_NGOAI[o.nhanh]}).reduce(function(a,o){return o.tai>a.tai?o:a},{tai:0}):{};
  hang.forEach(function(r,i){ if(!r)return; var off=(Wt-r.length*(W+gx)+gx)/2; r.forEach(function(q,j){ vi[q.Ma]={x:off+j*(W+gx),y:gy/2+i*(H+gy)}; }); });
  var s='<svg width="'+Wt+'" height="'+Ht+'" viewBox="0 0 '+Wt+' '+Ht+'" role="img" aria-label="Sơ đồ công đoạn '+esc(qtTenX(x))+'">';
  cs.forEach(function(q){ var b=vi[q.Ma]; (canh[q.Ma]||[]).forEach(function(p){ var a=vi[p]; if(!a)return;
    var x1=a.x+W/2,y1=a.y+H,x2=b.x+W/2,y2=b.y,my=(y1+y2)/2;
    s+='<path class="canh" d="M'+x1+' '+y1+' C'+x1+' '+my+' '+x2+' '+my+' '+x2+' '+(y2-4)+'"/><path class="canh" d="M'+(x2-4)+' '+(y2-8)+' L'+x2+' '+(y2-2)+' L'+(x2+4)+' '+(y2-8)+'"/>'; }); });
  cs.forEach(function(q){ var b=vi[q.Ma], o=T.cd[q.Ma]||{}, m=qtMuc(o.tai||0), laNut=nut.ma===q.Ma&&o.tai>0.5, ten=String(o.ten||q.Ma);
    if(laNut) m='bd';
    if(ten.length>24) ten=ten.slice(0,23)+'…';
    s+='<g class="nut '+m+'"><title>'+esc((o.ten||q.Ma)+' – '+(QT.nhanh[q.Nhanh]||q.Nhanh)+' bước '+q.Buoc)+'</title><rect x="'+b.x+'" y="'+b.y+'" width="'+W+'" height="'+H+'" rx="9"/>'+
      '<text x="'+(b.x+8)+'" y="'+(b.y+18)+'" font-size="12.5" font-weight="600">'+esc(ten)+'</text>'+
      '<text class="phu" x="'+(b.x+8)+'" y="'+(b.y+34)+'">'+esc((QT.nhanh[q.Nhanh]||'')+' · cần '+qtSo(o.can||0)+' · biết '+(o.nb||0))+'</text>'+
      (laNut?'<text class="the" x="'+(b.x+8)+'" y="'+(b.y+50)+'">NÚT THẮT</text>':(o.mot?'<text class="the" x="'+(b.x+8)+'" y="'+(b.y+50)+'">CHỈ 1 NGƯỜI BIẾT</text>':(o.khongDM?'<text class="phu" x="'+(b.x+8)+'" y="'+(b.y+50)+'">chưa có định mức</text>':'')))+'</g>';
  });
  return '<div class="qt-sodo">'+s+'</svg></div>';
}

    h+='<tr><td style="white-space:nowrap">'+esc(QT.nhanh[c.nhanh]||c.nhanh)+' · '+c.buoc+'</td><td>'+esc(c.ten)+(c.mot?'<span class="qt-tag bd">1 người</span>':(c.hai?'<span class="qt-tag wn">2 người</span>':''))+(c.khongDM?'<span class="qt-tag mo">chưa có ĐM</span>':'')+'</td>'+

/* --- Sửa quy trình --- */
function qtVeSua(T){
  var cs=QTD.filter(function(q){return q.MaXuong===QTX}).sort(function(a,b){return (QT_THU_NHANH.indexOf(a.Nhanh)-QT_THU_NHANH.indexOf(b.Nhanh))||(a.Buoc-b.Buoc)||(a.Ma<b.Ma?-1:1)});

  var h='<div class="card qt-sua"><div style="font-size:13px;color:var(--ink2);margin-bottom:8px">Mỗi công đoạn chọn <b>nhánh</b> và <b>bước</b>. Công đoạn trước tự nối: cùng nhánh bước liền trước; nhánh Ngọn / Chuôi / Gậy 1 khúc tách ra từ "Chung" và gộp lại ở bước "Chung" sau. Cần nối khác thì bấm "Chọn tay". Hỗ trợ / Làm lại không nằm trên dòng chảy nhưng vẫn tính tải.</div>';

      '<select aria-label="Nhánh" data-ma="'+esc(q.Ma)+'" onchange="qtSuaO(this.dataset.ma,\'Nhanh\',this.value)">'+QT_THU_NHANH.map(function(k){return '<option value="'+k+'"'+(k===q.Nhanh?' selected':'')+'>'+esc(QT.nhanh[k]||k)+'</option>'}).join('')+'</select>'+
      '<input aria-label="Bước" type="number" inputmode="numeric" min="1" max="99" value="'+q.Buoc+'" data-ma="'+esc(q.Ma)+'" onchange="qtSuaO(this.dataset.ma,\'Buoc\',this.value)">'+
      '<div class="truoc">'+(QT_NHANH_NGOAI[q.Nhanh]?'<i>ngoài dòng chảy</i>':'← '+(tr.length?esc(tr.map(ten).join(', ')):'<i>đầu dòng</i>')+(tay?' <span class="qt-tag wn">tay</span>':''))+
      '<br><button class="btn sm" type="button" data-ma="'+esc(q.Ma)+'" onclick="QTMo=QTMo===this.dataset.ma?\'\':this.dataset.ma;qtVe()">'+(QTMo===q.Ma?'Đóng':'Chọn tay')+'</button>'+(tay?' <button class="btn sm" type="button" data-ma="'+esc(q.Ma)+'" onclick="qtSuaO(this.dataset.ma,\'Truoc\',[])">Về tự động</button>':'')+'</div>';
    if(QTMo===q.Ma){

    (QTDoi?'<button class="btn sm" type="button" onclick="vQTTai()">Bỏ thay đổi</button>':'')+'</div>';

function qtTim(m){ return QTD.filter(function(q){return q.Ma===m})[0]; }
function qtSuaO(m,k,v){
  var q=qtTim(m); if(!q)return;
  if(k==='Buoc'){ v=Math.round(Number(v)); if(!(v>=1&&v<=99)){ toast('Bước là số 1–99.'); qtVe(); return; } }
  q[k]=v; q.moi=false; QTDoi=true; qtVe();
}
function qtChonTay(el){
  var q=qtTim(el.dataset.ma); if(!q)return;
  var cur=(q.Truoc&&q.Truoc.length)?q.Truoc.slice():(qtCanh(QTD.filter(function(c){return c.MaXuong===q.MaXuong}))[q.Ma]||[]).slice();
  var t=el.dataset.t, i=cur.indexOf(t);
  if(el.checked&&i<0) cur.push(t); if(!el.checked&&i>=0) cur.splice(i,1);
  var thu={}; QTD.filter(function(c){return c.MaXuong===q.MaXuong}).forEach(function(c){ thu[c.Ma]=c; });
  var ds=QTD.filter(function(c){return c.MaXuong===q.MaXuong}).map(function(c){ return c===q?{Ma:c.Ma,MaXuong:c.MaXuong,Nhanh:c.Nhanh,Buoc:c.Buoc,Truoc:cur}:c; });
  if(qtVong(qtCanh(ds))){ toast('Nối như vậy sẽ thành vòng lặp.'); qtVe(); return; }
  q.Truoc=cur.length?cur:[]; if(!cur.length) toast('Bỏ hết thì công đoạn trở về nối tự động.');
  QTDoi=true; qtVe();
}
function qtVong(canh){
  var mau={}, vong=false;
  var di=function(m){ if(vong)return; mau[m]=1; (canh[m]||[]).forEach(function(t){ if(vong)return; if(mau[t]===1)vong=true; else if(!mau[t]&&canh[t])di(t); }); mau[m]=2; };
  Object.keys(canh).forEach(function(m){ if(!mau[m])di(m); });
  return vong;
}
