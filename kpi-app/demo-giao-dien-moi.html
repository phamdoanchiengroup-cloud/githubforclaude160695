<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giao diện mới – demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Arimo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Demo giao diện mới (11/10) – 3 màn hình × 2 hướng, số liệu MẪU =====
   Hướng A "Giấy kỹ thuật": nền sáng ấm, chữ mực, nhấn xanh ngọc – hợp đèn xưởng và màn hình văn phòng ban ngày.
   Hướng B "Rhino": than chì + vàng thương hiệu, cùng thế giới với màn đăng nhập Khắc laser. */
:root{--demo-bg:#e9e6df;--demo-ink:#1c1f22;--demo-mut:#5d6166;--demo-line:#cfcac0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--demo-bg:#121315;--demo-ink:#ecebe7;--demo-mut:#a3a39d;--demo-line:#2c2e31}}
:root[data-theme="dark"]{--demo-bg:#121315;--demo-ink:#ecebe7;--demo-mut:#a3a39d;--demo-line:#2c2e31}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--demo-bg);color:var(--demo-ink);font:15px/1.5 'Be Vietnam Pro',system-ui,sans-serif}
::selection{background:#2a9d8f;color:#fff}

/* ---------- thanh điều khiển của trang demo ---------- */
.dk{position:sticky;top:0;z-index:20;background:var(--demo-bg);border-bottom:1px solid var(--demo-line);padding:12px 16px}
.dk-in{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.dk h1{font-size:17px;font-weight:700;margin:0 12px 0 0;letter-spacing:-.01em}
.dk-nhom{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dk-nhom > span{font-size:13px;color:var(--demo-mut)}
.seg{display:inline-flex;border:1px solid var(--demo-line);border-radius:8px;padding:2px;gap:2px;background:color-mix(in srgb,var(--demo-bg) 70%,#fff 30%)}
.seg button{font:inherit;font-size:13.5px;font-weight:500;border:0;background:none;color:var(--demo-ink);padding:6px 12px;border-radius:6px;cursor:pointer;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--demo-ink);color:var(--demo-bg)}
.seg button:focus-visible{outline:2px solid #2a9d8f;outline-offset:1px}
.ghi{max-width:1320px;margin:18px auto 0;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.ghi-chu{font-size:14px;color:var(--demo-mut);border-top:1px solid var(--demo-line);padding-top:12px}
.ghi-chu h2{font-size:15px;color:var(--demo-ink);margin:0 0 8px}
.ghi-chu ul{margin:0;padding-left:18px}.ghi-chu li{margin:0 0 6px}
@media (max-width:980px){.ghi{grid-template-columns:minmax(0,1fr)}}
.khung-ngoai{display:flex;justify-content:center}
.khung{width:100%;transition:width .25s cubic-bezier(.2,.8,.2,1)}
.khung.dt{width:390px;max-width:100%}
.khung.dt .app{border-radius:22px;min-height:780px}
.duoi{max-width:1320px;margin:28px auto 40px;padding:0 16px;font-size:13px;color:var(--demo-mut)}

/* ===================================================================== ỨNG DỤNG (cả 2 hướng dùng chung cấu trúc) */
.app{container-type:inline-size;container-name:app;border-radius:12px;overflow:hidden;
  background:var(--nen);color:var(--chu);font-family:var(--font);font-size:15px;line-height:1.5;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 12px 32px -12px rgba(0,0,0,.25);font-variant-numeric:tabular-nums}
.app ::selection{background:var(--nhan);color:var(--tren-nhan)}
.app :focus-visible{outline:2px solid var(--nhan);outline-offset:2px}

/* ----- Hướng A: Giấy kỹ thuật (sáng) ----- */
.app.a{--font:'Be Vietnam Pro',system-ui,sans-serif;
  --nen:#f6f4ef;--mat:#fffefb;--mat2:#efece5;--duong:#dcd7cc;--duong2:#c7c1b4;
  --chu:#1d2124;--chu2:#4f555b;--chu3:#6a6f74;
  --nhan:#0f766e;--nhan-nhat:#d5ece8;--tren-nhan:#fff;
  --tot:#1d7a46;--tot-nhat:#dcefe2;--vua:#9a5b00;--vua-nhat:#f7e7c8;--xau:#b42318;--xau-nhat:#f8dcd8;
  --thanh:#1d2124;--tren-thanh:#f6f4ef;--thanh-mut:#a8adb1;--bong:0 1px 0 rgba(0,0,0,.04)}
/* ----- Hướng B: Rhino (tối) ----- */
.app.b{--font:'Arimo','Be Vietnam Pro',system-ui,sans-serif;
  --nen:#1f1f20;--mat:#2b2b2b;--mat2:#333334;--duong:#3d3d3e;--duong2:#4a4a4b;
  --chu:#f1efe9;--chu2:#c4c1b9;--chu3:#a19e96;
  --nhan:#f7b829;--nhan-nhat:#3b3220;--tren-nhan:#1a1a1a;
  --tot:#6fd39a;--tot-nhat:#1f3a2b;--vua:#f7b829;--vua-nhat:#3b3220;--xau:#ff8f86;--xau-nhat:#47282a;
  --thanh:#161617;--tren-thanh:#f1efe9;--thanh-mut:#a19e96;--bong:0 1px 0 rgba(0,0,0,.3)}

/* khung ứng dụng: thanh trên + menu trái (máy tính) / thanh dưới (điện thoại) */
.app-dau{display:flex;align-items:center;gap:12px;padding:0 20px;height:56px;background:var(--thanh);color:var(--tren-thanh)}
.app-dau .ten{font-weight:700;font-size:15px;letter-spacing:-.01em}
.app-dau .ten small{display:block;font-weight:400;font-size:12px;color:var(--thanh-mut);letter-spacing:0}
.app-dau .logo{width:30px;height:30px;border-radius:7px;background:var(--nhan);color:var(--tren-nhan);display:grid;place-items:center}
.app-dau .day{flex:1}
.app-dau .nguoi{font-size:13px;color:var(--thanh-mut);text-align:right}
.app-dau .nguoi b{display:block;color:var(--tren-thanh);font-weight:600;font-size:14px}
.app-than{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:640px}
.menu{background:var(--mat2);border-right:1px solid var(--duong);padding:14px 10px}
.menu h3{font-size:12px;font-weight:600;color:var(--chu3);margin:14px 10px 6px;letter-spacing:.02em}
.menu h3:first-child{margin-top:2px}
.menu a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--chu2);text-decoration:none;font-size:14px;font-weight:500}
.menu a svg{flex:none;opacity:.8}
.menu a:hover{background:color-mix(in srgb,var(--chu) 6%,transparent);color:var(--chu)}
.menu a[aria-current]{background:var(--mat);color:var(--chu);box-shadow:inset 0 0 0 1px var(--duong)}
.menu a .so{margin-left:auto;font-size:12px;font-weight:700;background:var(--xau);color:#fff;border-radius:10px;padding:0 7px;line-height:19px}
.app.b .menu a .so{color:#1a1a1a}
.noi{padding:26px 28px 40px;min-width:0}
.tab-duoi{display:none}

@container app (max-width:640px){
  .app-than{grid-template-columns:minmax(0,1fr)}
  .menu{display:none}
  .noi{padding:18px 16px 96px}
  .app-dau .nguoi{display:none}
  .tab-duoi{display:grid;grid-template-columns:repeat(4,1fr);position:sticky;bottom:0;background:var(--mat);border-top:1px solid var(--duong);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tab-duoi a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--chu3);text-decoration:none;padding:4px 0;min-height:44px;justify-content:center}
  .tab-duoi a[aria-current]{color:var(--nhan);font-weight:600}
  .app.a .tab-duoi a[aria-current]{color:var(--nhan)}
}

/* chữ & khối chung */
.tieu{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-bottom:22px}
.tieu h2{font-size:26px;line-height:1.2;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tieu p{margin:6px 0 0;color:var(--chu2);font-size:14.5px}
.nut{font:inherit;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:0 14px;min-height:38px;cursor:pointer;
  border:1px solid var(--duong2);background:var(--mat);color:var(--chu);transition:background .15s,border-color .15s,transform .1s}
.nut:hover{border-color:var(--chu3)}
.nut:active{transform:translateY(1px)}
.nut.chinh{background:var(--nhan);border-color:var(--nhan);color:var(--tren-nhan)}
.nut.chinh:hover{filter:brightness(1.06)}
.nut[disabled]{opacity:.45;cursor:not-allowed}
.khoi{background:var(--mat);border:1px solid var(--duong);border-radius:10px;box-shadow:var(--bong)}
.khoi-dau{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--duong)}
.khoi-dau h3{margin:0;font-size:15.5px;font-weight:700}
.khoi-dau span{font-size:13px;color:var(--chu3)}
.nhan-loai{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-size:13px;font-weight:700}
.l-A{background:var(--tot-nhat);color:var(--tot)}.l-B{background:var(--nhan-nhat);color:var(--nhan)}
.l-C{background:var(--vua-nhat);color:var(--vua)}.l-D{background:var(--xau-nhat);color:var(--xau)}
.app.a .l-B{color:#0b5d57}

/* ===================================================== MÀN 1: VIỆC HÔM NAY */
.viec{list-style:none;margin:0;padding:0}
.viec li{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px 18px;border-top:1px solid var(--duong)}
.viec li:first-child{border-top:0}
.viec .so{font-size:26px;font-weight:700;line-height:1;text-align:right;letter-spacing:-.02em}
.viec .so small{display:block;font-size:12px;font-weight:500;color:var(--chu3);letter-spacing:0;margin-top:4px}
.viec .gap .so{color:var(--xau)}.viec .vua .so{color:var(--vua)}
.viec h4{margin:0;font-size:15.5px;font-weight:600}
.viec p{margin:2px 0 0;font-size:13.5px;color:var(--chu2)}
.viec .muc{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;margin-right:8px}
.viec .gap .muc{color:var(--xau)}.viec .vua .muc{color:var(--vua)}.viec .xong .muc{color:var(--tot)}
.viec .xong .so{color:var(--chu3)}
.viec .xong h4{color:var(--chu2);font-weight:500}
.luoi-2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;margin-top:20px}
.xuong{width:100%;border-collapse:collapse;font-size:14px}
.xuong th{white-space:nowrap;font-size:12.5px;font-weight:600;color:var(--chu3);text-align:right;padding:10px 18px 8px;border-bottom:1px solid var(--duong)}
.xuong th:first-child,.xuong td:first-child{text-align:left}
.xuong td{padding:10px 18px;border-top:1px solid var(--duong);text-align:right;white-space:nowrap}
.xuong tr:first-child td{border-top:0}
.xuong td.thieu{color:var(--xau);font-weight:600}
.vach{display:inline-block;width:64px;height:6px;border-radius:3px;background:var(--mat2);vertical-align:middle;margin-left:8px;position:relative;overflow:hidden}
.vach i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--chu3)}
.vach i.tot{background:var(--tot)}.vach i.vua{background:var(--vua)}.vach i.xau{background:var(--xau)}
.nhip{padding:6px 18px 16px}
.nhip-dong{display:grid;grid-template-columns:62px minmax(0,1fr) 54px;align-items:center;gap:10px;font-size:13.5px;padding:7px 0}
.nhip-dong .ong{height:10px;border-radius:5px;background:var(--mat2);position:relative}
.nhip-dong .ong i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--nhan)}
.nhip-dong .ong b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--chu);border-radius:1px}
.nhip-dong span:last-child{text-align:right;font-weight:600}
.nhip-chu{font-size:12.5px;color:var(--chu3);padding:0 18px 14px;margin:0}
@container app (max-width:1080px){.luoi-2{grid-template-columns:minmax(0,1fr)}}
@container app (max-width:640px){
  .viec li{grid-template-columns:52px minmax(0,1fr);padding:14px}
  .viec li .nut{grid-column:2;justify-self:start;margin-top:8px}
  .viec .so{font-size:22px}
  .xuong th,.xuong td{padding:9px 12px}
  .xuong .an-dt{display:none}
  .tieu h2{font-size:22px}
}

/* ===================================================== MÀN 2: BẢNG KPI */
.loc{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:14px}
.loc label{font-size:13px;color:var(--chu2);display:flex;align-items:center;gap:8px}
.loc select{font:inherit;font-size:14px;color:var(--chu);background:var(--mat);border:1px solid var(--duong2);border-radius:8px;padding:0 10px;min-height:38px}
.chip{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--duong2);background:var(--mat);color:var(--chu2);border-radius:999px;padding:0 12px;min-height:34px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--chu);border-color:var(--chu);color:var(--nen)}
.loc .tim{flex:1;min-width:180px;max-width:280px;position:relative}
.loc .tim input{width:100%;font:inherit;font-size:14px;color:var(--chu);background:var(--mat);border:1px solid var(--duong2);border-radius:8px;padding:0 10px 0 34px;min-height:38px}
.loc .tim input::placeholder{color:var(--chu3)}
.loc .tim svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--chu3)}
.tom{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:14px;color:var(--chu2);margin:0 0 14px}
.tom b{color:var(--chu);font-weight:700}
.bang-k{overflow:auto;max-height:560px}
.kpi-b{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.kpi-b th{position:sticky;top:0;z-index:1;background:var(--mat);font-size:12.5px;font-weight:600;color:var(--chu3);text-align:right;padding:11px 14px;border-bottom:1px solid var(--duong2);white-space:nowrap}
.kpi-b th button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.kpi-b th button:hover{color:var(--chu)}
.kpi-b th[aria-sort] button{color:var(--chu)}
.kpi-b th.trai,.kpi-b td.trai{text-align:left}
.kpi-b td{padding:10px 14px;border-bottom:1px solid var(--duong);text-align:right;white-space:nowrap}
.kpi-b tbody tr{cursor:pointer;transition:background .12s}
.kpi-b tbody tr:hover{background:color-mix(in srgb,var(--chu) 4%,transparent)}
.kpi-b tbody tr[aria-expanded="true"]{background:color-mix(in srgb,var(--nhan) 8%,transparent)}
.kpi-b .hang{color:var(--chu3);font-weight:600;width:42px}
.kpi-b .ten{font-weight:600}
.kpi-b .ten small{display:block;font-weight:400;font-size:12.5px;color:var(--chu3)}
.kpi-b .tong{font-weight:700;font-size:15px}
.kpi-b tr.chi td{background:var(--mat2);cursor:default;padding:14px 14px 16px 56px;text-align:left;white-space:normal}
.thanh-p{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 22px;max-width:760px}
.thanh-p div{font-size:13px;color:var(--chu2)}
.thanh-p b{display:block;font-size:15px;color:var(--chu);margin:2px 0 6px}
.thanh-p .ong{height:6px;border-radius:3px;background:var(--duong);position:relative}
.thanh-p .ong i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--nhan)}
.thanh-p p{grid-column:1/-1;margin:2px 0 0;font-size:13.5px;color:var(--chu2)}
.trong{padding:40px 20px;text-align:center;color:var(--chu2)}
.trong b{display:block;color:var(--chu);font-size:16px;margin-bottom:4px}
@container app (max-width:640px){
  .kpi-b thead{display:none}
  .kpi-b,.kpi-b tbody{display:block}
  .kpi-b tbody tr:not(.chi){display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;align-items:center;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--duong)}
  .kpi-b tbody tr:not(.chi) td{border:0;padding:0}
  .kpi-b td.an-dt{display:none}
  .kpi-b .hang{width:auto;text-align:left}
  .kpi-b tr.chi{display:block}.kpi-b tr.chi td{display:block;padding:12px}
  .thanh-p{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bang-k{max-height:none}
  .loc .tim{max-width:none;flex-basis:100%}
}

/* ===================================================== MÀN 3: KPI CỦA TÔI (công nhân) */
.toi{max-width:720px}
.toi-cau{font-size:22px;line-height:1.35;font-weight:600;letter-spacing:-.015em;margin:0 0 6px;text-wrap:balance}
.toi-cau em{font-style:normal;color:var(--nhan)}
.app.a .toi-cau em{color:#0b5d57}
.toi-phu{color:var(--chu2);font-size:14.5px;margin:0 0 22px}
.thuoc{position:relative;margin:0 0 30px;padding:30px 0 0}
.thuoc-ong{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--xau-nhat) 0 70%,var(--vua-nhat) 70% 80%,var(--nhan-nhat) 80% 90%,var(--tot-nhat) 90%);position:relative}
.thuoc-ong i{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--chu);opacity:.85;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.thuoc-kim{position:absolute;top:0;transform:translateX(-50%);font-size:13px;font-weight:700;background:var(--chu);color:var(--nen);border-radius:6px;padding:2px 8px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.thuoc-kim::after{content:'';position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:var(--chu)}
.thuoc-moc{position:relative;height:30px;font-size:12px;color:var(--chu3)}
.thuoc-moc span{position:absolute;top:6px;transform:translateX(-50%);white-space:nowrap}
.thuoc-moc span b{color:var(--chu2)}
.ngay{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px;align-items:end;height:120px;padding:14px 18px 0}
.ngay i{display:block;border-radius:3px 3px 0 0;background:var(--nhan);opacity:.85;min-height:2px;position:relative}
.ngay i.duoi-dm{background:var(--vua)}
.ngay i.nghi{background:var(--duong2);opacity:1}
.ngay i:hover{opacity:1}
.ngay-truc{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px;padding:6px 18px 4px;font-size:11.5px;color:var(--chu3)}
.ngay-ct{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--chu2);padding:10px 18px 14px}
.ngay-ct i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.phan{list-style:none;margin:0;padding:0}
.phan li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:13px 18px;border-top:1px solid var(--duong)}
.phan li:first-child{border-top:0}
.phan b{font-weight:600}
.phan span{font-weight:700;text-align:right}
.phan small{grid-column:1/-1;color:var(--chu2);font-size:13.5px}
.goi-y{margin-top:20px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 18px}
.goi-y img{width:56px;height:64px;object-fit:contain}
.goi-y p{margin:0;font-size:14.5px}
.goi-y p b{display:block;font-size:13px;color:var(--chu3);font-weight:600;margin-bottom:2px}
@container app (max-width:640px){
  .toi-cau{font-size:19px}
  .ngay{gap:2px;padding:12px 12px 0;height:100px}
  .ngay-truc{gap:2px;padding:6px 12px 4px}
  .ngay-truc span:nth-child(odd){visibility:hidden}
}
@media (prefers-reduced-motion:reduce){.khung,.thuoc-ong i,.thuoc-kim,.kpi-b tbody tr,.nut{transition:none}}
</style>
</head>
<body>
<div class="dk">
  <div class="dk-in">
    <h1>Giao diện mới – demo</h1>
    <div class="dk-nhom"><span>Màn hình</span>
      <div class="seg" id="chonMan" role="group" aria-label="Màn hình">
        <button data-v="viec" aria-pressed="true">Việc hôm nay</button><button data-v="kpi" aria-pressed="false">Bảng KPI</button><button data-v="toi" aria-pressed="false">KPI của tôi</button>
