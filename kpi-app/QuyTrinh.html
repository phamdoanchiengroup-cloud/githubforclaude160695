<script>
/* ===== Quy trình sản xuất (31/10) ===== */
var QT=null, QTV='nm', QTX='', QTS=null, QTSoNgay=0, QTD=null, QTDoi=false, QTMo='';
var QT_NHANH_DONG={NGON:1,CHUOI:1,GAY1K:1}, QT_NHANH_NGOAI={LAMLAI:1,HOTRO:1,CHUAXEP:1};
var QT_THU_NHANH=['CHUNG','NGON','CHUOI','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','LAMLAI','HOTRO','CHUAXEP'];
function qtSo(v,k){ k=k==null?1:k; return Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:k,minimumFractionDigits:0}); }
function qtPt(v){ return Math.round(v*100)+'%'; }
function qtMuc(t){ return t>1?'bd':(t>0.85?'wn':''); }
function qtTenX(x){ var p=(QT.xuong||[]).filter(function(a){return a.MaXuong===x})[0]; return p?String(p.TenXuong).replace(/^Xưởng\s+/,''):x; }

/* Công đoạn trước – giống hệt qtCanh_ ở máy chủ (tests/quy-trinh/quy-trinh.gs) */
function qtCanh(ds){
  var theoX={}, out={};
  ds.forEach(function(c){ (theoX[c.MaXuong]=theoX[c.MaXuong]||[]).push(c); });
  Object.keys(theoX).forEach(function(x){
    var cs=theoX[x];
    var lonNhat=function(nh,s){ var b=0; cs.forEach(function(c){ if(c.Nhanh===nh&&c.Buoc<s&&c.Buoc>b)b=c.Buoc; }); return b; };
    var o=function(nh,b){ return cs.filter(function(c){return c.Nhanh===nh&&c.Buoc===b}).map(function(c){return c.Ma}); };
    cs.forEach(function(c){
      if(c.Truoc&&c.Truoc.length){ out[c.Ma]=c.Truoc.slice(); return; }
      var r=[];
      if(QT_NHANH_NGOAI[c.Nhanh]) r=[];
      else if(c.Nhanh==='CHUNG'){
        var sc=lonNhat('CHUNG',c.Buoc);
        Object.keys(QT_NHANH_DONG).forEach(function(nh){ var b=lonNhat(nh,c.Buoc); if(b&&b>sc) r=r.concat(o(nh,b)); });
        if(!r.length&&sc) r=o('CHUNG',sc);
      } else {
        var sb=lonNhat(c.Nhanh,c.Buoc), sc2=QT_NHANH_DONG[c.Nhanh]?lonNhat('CHUNG',c.Buoc):0;
        if(sc2>sb) r=o('CHUNG',sc2); else if(sb) r=o(c.Nhanh,sb);
      }
      out[c.Ma]=r;
    });
  });
  return out;
}

/* Tính tải: giờ chuẩn = sản lượng ÷ định mức (quy mọi đơn vị về giờ-người) */
/* Sản lượng yêu cầu (01/11, chủ dự án): sp/tháng ÷ ngày làm = sp/ngày; so với nhịp hiện nay (công đoạn "Đóng gói thành phẩm" trong kỳ, hoặc số tự nhập) -> % mục tiêu */
var QT_CD_DONGGOI=['DG-DONGGOITP','DG-DONLE-GAY-NGON','DG-DONLE-NGON','DG-DONLE-CUSTOM','DG-DONLE-COMBO'];   /* đóng gói thành phẩm + đóng đơn lẻ (không tính phụ kiện, bao cơ) */
function qtSlNayDo(){ var sl=0; QT_CD_DONGGOI.forEach(function(m){ var t=(QT.thongKe||{})[m]; if(t&&t.sl>0) sl+=t.sl; }); return sl/Math.max(1,QT.soNgaySX||1); }
function qtSlNay(){ return QTS.slNay>0?QTS.slNay:qtSlNayDo(); }
function qtMT(){ var n=qtSlNay(), y=QTS.slThang/Math.max(1,QTS.ngayThang); if(n>0) QTS.mucTieu=Math.max(10,Math.min(500,Math.round(y/n*100))); return QTS.mucTieu; }
function qtNhanNguoi(o){ var a=[]; if(o.tp)a.push(o.tp+' TP'); if(o.pp)a.push(o.pp+' PP'); if(o.ql-o.tp-o.pp>0)a.push((o.ql-o.tp-o.pp)+' QL'); if(o.tt)a.push(o.tt+' TT'); a.push(o.cn+' CN'); return a.join(' · ')+' = '+o.tong; }
function qtTinh(){
  qtMT();
  var N=Math.max(1,QT.soNgaySX||1), mt=QTS.mucTieu/100, gioNguoi=QTS.gioCoMat*QTS.hieuSuat, nc=QT.ngayCong||{};
  var cd={}, x={}, gcTot={};
  (QT.xuong||[]).forEach(function(p){ x[p.MaXuong]={ma:p.MaXuong,gio:0,can:0,co:0,coMat:0,coNK:0,ql:0,tp:0,pp:0,tt:0,cn:0,tong:0,cd:[],khongDM:0}; });
  /* 03/11 (chủ dự án): tổng người = danh sách "Đang làm" (khớp chấm công), ghi rõ TP / PP / tổ trưởng / công nhân;
     có mặt = theo ĐIỂM DANH (QT.diemDanh: ngày có mặt trong kỳ); coNK = có mặt theo ngày có ghi KPI (để thấy phần có mặt mà không ghi nhận sản lượng) */
  var dd=QT.diemDanh||null;
  (QT.nhanSu||[]).forEach(function(n){ var o=x[n.MaXuong]; if(!o)return; var cd=String(n.ChucDanh||''); o.tong++;
    if(/^\s*trưởng phòng/i.test(cd)) { o.tp++; o.ql++; } else if(/^\s*phó phòng/i.test(cd)) { o.pp++; o.ql++; } else if(/^\s*(quản lý|giám đốc)/i.test(cd)) o.ql++;
    else { if(/tổ trưởng/i.test(cd)) o.tt++; else o.cn++; o.co++; var nk=Math.min(1,(nc[n.MaNV]||0)/N); o.coNK+=nk; o.coMat+=dd?Math.min(1,(dd[n.MaNV]||0)/N):nk; } /* tổ trưởng vẫn tính là người làm */ });
  Object.keys(x).forEach(function(k){ x[k].nhan=qtNhanNguoi(x[k]); });
  var ten={}; (QT.nhanSu||[]).forEach(function(n){ ten[n.MaNV]=n.HoTen; });
  // giờ chuẩn của từng người (để chia thời gian có mặt của họ cho các công đoạn – không đếm 1 người đủ ở mọi công đoạn)
  Object.keys(QT.thongKe).forEach(function(m){ var dm=(QT.cdMap[m]||{}).DM; if(!(dm>0))return;
    var ng=QT.thongKe[m].nguoi||{}; Object.keys(ng).forEach(function(p){ gcTot[p]=(gcTot[p]||0)+ng[p]/dm; }); });
  QTD.forEach(function(q){
    var c=(QT.cdMap[q.Ma]||{}), t=QT.thongKe[q.Ma]||{sl:0,nguoi:{}}, kn=(QT.kyNang||{})[q.Ma]||{};
    var biet={}; Object.keys(t.nguoi||{}).forEach(function(m){ biet[m]='nk'; }); Object.keys(kn).forEach(function(m){ biet[m]=biet[m]?'ca':'kn'; });
    var slN=t.sl/N, gio=c.DM>0?slN/c.DM:0, can=gio*mt/gioNguoi, nb=Object.keys(biet).length, fte=0;
    if(c.DM>0) Object.keys(t.nguoi||{}).forEach(function(p){ if(gcTot[p]>0) fte+=(t.nguoi[p]/c.DM)/gcTot[p]*Math.min(1,(nc[p]||0)/N); });
    var o={ma:q.Ma,ten:c.TenCD||q.Ma,x:q.MaXuong,nhanh:q.Nhanh,buoc:q.Buoc,dm:c.DM||0,dvt:c.DVT||'',slN:slN,gio:gio,can:can,biet:biet,nb:nb,fte:fte,
      tai:fte>0.01?can/fte:(can>0.05?9:0), khongDM:!(c.DM>0)&&t.sl>0, tenNguoi:Object.keys(biet).map(function(m){return ten[m]||m}) };
    o.mot = can>0.05 && nb<=1; o.hai = can>0.05 && nb===2;
    cd[q.Ma]=o;
    var xo=x[q.MaXuong]; if(!xo)return;
    xo.gio+=gio; xo.can+=can; xo.cd.push(o); if(o.khongDM)xo.khongDM++;
  });
  var ds=Object.keys(x).map(function(k){ var o=x[k], co=o.coMat>0.5?o.coMat:o.co;
    o.tai=co?o.can/co:(o.can>0?9:0); o.tai100=o.tai/mt; o.toiDa=o.tai>0?QTS.mucTieu/o.tai:0; o.thieu=Math.max(0,Math.ceil(o.can-co-1e-9));
    o.nangSuat=co?o.gio/(co*QTS.gioCoMat):0; return o; });
  var co=ds.filter(function(o){return o.can>0});
  var max=co.reduce(function(a,o){return o.tai>a.tai?o:a},{tai:0});
  var lbr=co.length&&max.tai?co.reduce(function(a,o){return a+o.tai},0)/(co.length*max.tai):0;
  return {cd:cd,x:x,ds:ds,nut:max,lbr:lbr,N:N};
}

    qtNhan(r); qtVe();

}

function qtNhan(r){
    QT=r; QTSoNgay=r.soNgay; QT.cdMap={}; (r.congDoan||[]).forEach(function(c){ QT.cdMap[c.MaCD]=c; });

var QT_NHOM={

};
var QT_NHOM_NHANH={POM:'SX POM (cấp Phôi Thô)',NOI:'Tay nối',GAY1K:'Gậy 1 khúc',PHIP:'Phíp',PK:'Phụ kiện',DONLE:'Đơn lẻ',LAMLAI:'Làm lại / sửa',HOTRO:'Hỗ trợ',CHUAXEP:'Chưa xếp'};
function qtKhongDau(t){ return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim(); }
/* -> {ten, thu}: nhóm của 1 công đoạn (thứ tự = cột trên lưu đồ) */
function qtNhomCD(x,nhanh,ten){
  var ds=QT_NHOM[x]||[], t=qtKhongDau(ten), i;
  if(QT_NHOM_NHANH[nhanh]) return {ten:QT_NHOM_NHANH[nhanh],thu:100+QT_THU_NHANH.indexOf(nhanh),rieng:1};
  for(i=0;i<ds.length;i++) if(ds[i][1].test(t)) return {ten:ds[i][0],thu:i};
  return {ten:'Khác',thu:90};
}
/* Gom công đoạn của 1 xưởng thành nhóm theo làn (nhánh) -> {lan:[nhánh], cot:[{ten,thu}], o:{nhánh|cột: nhóm}} */
function qtGomNhom(x,T){
  var xo=T.x[x]; if(!xo) return null;
  var o={}, cot={}, lan={};
  xo.cd.forEach(function(c){
    var g=qtNhomCD(x,c.nhanh,c.ten), ln=g.rieng?(QT_NHANH_NGOAI[c.nhanh]?'NGOAI':c.nhanh):(c.nhanh==='CHUAXEP'?'NGOAI':c.nhanh);
    var k=ln+'|'+g.ten, n=o[k]||(o[k]={lan:ln,ten:g.ten,thu:g.thu,cd:[],can:0,fte:0,gio:0,biet:{},mot:0,buoc:99});
    n.cd.push(c); n.can+=c.can; n.fte+=c.fte; n.gio+=c.gio; n.buoc=Math.min(n.buoc,c.buoc||99); if(c.mot)n.mot++;

    if(ln!=='NGOAI'){ cot[g.ten]=cot[g.ten]||{ten:g.ten,thu:g.thu,buoc:99}; cot[g.ten].buoc=Math.min(cot[g.ten].buoc,c.buoc||99); lan[ln]=1; }
  });
  Object.keys(o).forEach(function(k){ var n=o[k]; n.nb=Object.keys(n.biet).length; n.tai=n.fte>0.01?n.can/n.fte:(n.can>0.05?9:0); n.cd.sort(function(a,b){return (a.buoc-b.buoc)||(b.tai-a.tai)}); });
  var cs=Object.keys(cot).map(function(k){return cot[k]}).sort(function(a,b){return (a.thu-b.thu)||(a.buoc-b.buoc)});
  var ls=Object.keys(lan).sort(function(a,b){ var L=['CHUOI','NGON','GAY1K','NOI','TIP','PHIP','POM','PK','DONLE','CHUNG']; var ia=L.indexOf(a), ib=L.indexOf(b); return (ia<0?40:ia)-(ib<0?40:ib); });
  return {lan:ls,cot:cs,o:o,xo:xo};
}

/* Lưu đồ 1 xưởng theo kiểu lưu đồ nhà máy: hàng = nhánh chính (chuôi trên, ngọn dưới), công đoạn chung là thẻ giữa trải 2 hàng;
   nhánh riêng (nối, POM, gậy 1 khúc…) mỗi nhánh 1 hàng phía dưới, xếp sát từ trái; ngoài dòng chảy để riêng, không nối */

  return '<button type="button" class="qt-o'+(laNut?' nut':'')+(QTMoNhom===k?' mo':'')+'" style="'+(style||'')+'" data-k="'+esc(k)+'" onclick="QTMoNhom=QTMoNhom===this.dataset.k?\'\':this.dataset.k;qtVe()" title="Bấm để xem các công đoạn trong nhóm">'+

function qtLuuDoX(x,T){
  var G=qtGomNhom(x,T); if(!G) return '';
  var ds=Object.keys(G.o).map(function(k){return G.o[k]}), CHINH={CHUOI:1,NGON:1,CHUNG:1};
  var chinh=ds.filter(function(n){return CHINH[n.lan]}), rieng=ds.filter(function(n){return n.lan!=='NGOAI'&&!CHINH[n.lan]}), ngoai=ds.filter(function(n){return n.lan==='NGOAI'});
  var tren=ds.filter(function(n){return n.lan!=='NGOAI'}), nut=tren.reduce(function(a,n){return n.tai>a.tai?n:a},{tai:0});
  var K=function(n){return x+'|'+n.lan+'|'+n.ten};
  var hang=['CHUOI','NGON'].filter(function(l){return chinh.some(function(n){return n.lan===l})}), nh=Math.max(1,hang.length);
  /* xếp cột theo đoạn: giữa 2 công đoạn chung, mỗi nhánh tự xếp liền nhau từ cột đầu đoạn (nhánh song song đứng cạnh nhau) */
  chinh.sort(function(a,b){return (a.thu-b.thu)||(a.buoc-b.buoc)});
  var col={}, cur=0, doan=[], canh=[], chTr=null, cuoi={};
  var dongDoan=function(){ if(!doan.length) return; var dai=0;
    hang.forEach(function(l){ var a=doan.filter(function(n){return n.lan===l}); a.forEach(function(n,i){ col[K(n)]=cur+i; if(i) canh.push([K(a[i-1]),K(n)]); else if(chTr) canh.push([K(chTr),K(n)]); }); if(a.length){ cuoi[l]=a[a.length-1]; dai=Math.max(dai,a.length); } });
    cur+=dai; doan=[]; };
  chinh.forEach(function(n){
    if(n.lan!=='CHUNG'){ doan.push(n); return; }
    var coNhanh=doan.length; dongDoan(); col[K(n)]=cur++;
    if(coNhanh){ hang.forEach(function(l){ if(cuoi[l]) canh.push([K(cuoi[l]),K(n)]); }); } else if(chTr) canh.push([K(chTr),K(n)]);
    cuoi={}; chTr=n; });
  dongDoan();
  var lanR=[]; rieng.forEach(function(n){ if(lanR.indexOf(n.lan)<0) lanR.push(n.lan); }); lanR.sort(function(a,b){return QT_THU_NHANH.indexOf(a)-QT_THU_NHANH.indexOf(b)});
  var maxR=0; lanR.forEach(function(l){ maxR=Math.max(maxR,rieng.filter(function(n){return n.lan===l}).length); });

  if(!hang.length&&chinh.length) h+='<div class="ld" style="grid-row:1;grid-column:1">'+esc(QT.nhanh.CHUNG||'Chung')+'</div>';

    h+=qtThe(n,x,n===nut&&n.tai>0,c+1,st); });   /* số = bước (hàng); 2 nhánh song song cùng số */
  lanR.forEach(function(l,j){ var cc=1+nh+j, a=rieng.filter(function(n){return n.lan===l}).sort(function(p,q){return (p.thu-q.thu)||(p.buoc-q.buoc)});

function chLuu(o,sau){ call('luuCauHinhSP',[o],function(r){ if(!r||!r.ok){ toast((r&&r.msg)||'Không lưu được.'); return; } window.__spMoiTai=0; toast(r.msg,true); if(r.nhan){ DH.nhan=r.nhan; DH.dongMap={}; (r.nhan.dong||[]).forEach(function(d){DH.dongMap[d[0]]=d;}); } if(sau) sau(r); dhTai(false); }); }
function chMoForm(ma,tenGoi){
  var d=ma?(DH.nhan.dongDu||[]).filter(function(x){return x.ma===ma})[0]:null;
  CHForm=d?{ma:d.ma,ten:d.ten,loaiHang:d.loai,tenGoi:d.goi.join(', '),chuoi:d.chuoi,ngon:d.ngon,tip:d.tip,ren:d.ren,dau:d.dau,them:d.them}:{ma:'',ten:tenGoi||'',loaiHang:'GAY',tenGoi:tenGoi||'',chuoi:'',ngon:'',tip:'',ren:'',dau:''};
  dhVeLai(); setTimeout(function(){ var e=document.getElementById('chTen'); if(e){ e.scrollIntoView({block:'center'}); e.focus(); } },50);
}
function chDocForm(){ var g=function(id){var e=document.getElementById(id);return e?e.value:''}; CHForm.ten=g('chTen'); CHForm.loaiHang=g('chLoai'); CHForm.tenGoi=g('chGoi'); CHForm.chuoi=g('chC'); CHForm.ngon=g('chN'); CHForm.tip=g('chT'); CHForm.ren=g('chR'); CHForm.dau=g('chD'); }
function chXemKhop(){ chDocForm(); var k=chKhop(CHForm.tenGoi.split(/[,\n]/)), el=document.getElementById('chKhop'); if(el) el.innerHTML=chKhopHTML(k); }
function chKhopHTML(k){ return k.length?'Khớp <b>'+k.length+'</b> tên hàng trong đơn: '+k.slice(0,8).map(esc).join(' · ')+(k.length>8?' …':''):'<span class="wn">Chưa khớp tên hàng nào trong đơn hiện tại – kiểm tra lại chữ nhận diện (lấy đúng chữ có trong tên sản phẩm).</span>'; }
function chFormHTML(){
  var f=CHForm, lh=f.loaiHang;
  var h='<div class="ch-form"><div style="font-weight:600;margin-bottom:6px">'+(f.ma?'Sửa dòng gậy':'Thêm dòng gậy mới')+'</div><div class="dh-sua">'+
    '<div><label for="chTen">Tên dòng gậy</label><input id="chTen" maxlength="80" value="'+esc(f.ten)+'" placeholder="vd. Nebula 3 (Sport / Classic)"></div>'+
    '<div><label for="chLoai">Loại hàng</label><select id="chLoai" onchange="chDocForm();dhVeLai()">'+[['GAY','Gậy 2 khúc'],['NGON','Ngọn bán lẻ'],['CHUOI','Chuôi bán lẻ']].map(function(x){return '<option value="'+x[0]+'"'+(lh===x[0]?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select></div>'+
    (lh!=='NGON'?'<div><label for="chC">Loại chuôi</label><select id="chC"><option value="">– chọn –</option>'+chOpt('chuoi',f.chuoi)+'</select></div>':'')+
    (lh!=='CHUOI'?'<div><label for="chN">Loại ngọn</label><select id="chN"><option value="">– chọn –</option>'+chOpt('ngon',f.ngon)+'</select></div>':'')+
    (lh!=='CHUOI'?'<div><label for="chT">Loại tip</label><select id="chT"><option value="">– chọn –</option>'+chOpt('tip',f.tip)+'</select></div>':'')+
    '<div><label for="chR">Ren mặc định</label><select id="chR">'+chOpt('ren',f.ren,true)+'</select></div>'+
    (lh!=='CHUOI'?'<div><label for="chD">Đầu mặc định (mm)</label><input id="chD" inputmode="decimal" maxlength="5" value="'+esc(f.dau)+'" placeholder="12.5"></div>':'')+
    '</div><label for="chGoi" style="font-size:11.5px;color:var(--ink3)">Chữ nhận diện – các chữ có trong tên sản phẩm của dòng này, cách nhau dấu phẩy (vd. NEBULA 3, NB3/)</label>'+
    '<textarea id="chGoi" rows="2" maxlength="600" style="width:100%" oninput="chXemKhop()">'+esc(f.tenGoi)+'</textarea>'+
    '<div id="chKhop" style="font-size:12.5px;margin:4px 0 8px">'+chKhopHTML(chKhop(String(f.tenGoi).split(/[,\n]/)))+'</div>'+
    '<button class="btn" type="button" onclick="chLuuForm()">Lưu dòng gậy</button> <button class="btn sm" type="button" onclick="CHForm=null;dhVeLai()">Hủy</button>'+
    (f.ma?' <button class="btn sm dg" type="button" onclick="chXoaDong()">'+(f.them?'Xóa dòng này':'Về cấu hình gốc')+'</button>':'')+
    '<div style="font-size:12px;color:var(--ink3);margin-top:6px">Lưu xong, mọi tên hàng có chữ nhận diện (mọi màu, mọi cỡ) tự nhận cấu hình này ở Việc theo xưởng, Thống kê, nhãn chất liệu. Tên hàng đã sửa tay riêng ở Kiểm phân loại vẫn giữ bản sửa tay.</div></div>';
  return h;
}
function chLuuForm(){ chDocForm(); var f=CHForm, k=chKhop(String(f.tenGoi).split(/[,\n]/));
  if(k.length>30&&!confirm('Chữ nhận diện khớp '+k.length+' tên hàng trong đơn – tất cả sẽ dùng cấu hình này. Chắc chắn lưu?')) return;
  chLuu({loai:'DONG',ma:f.ma,ten:f.ten,loaiHang:f.loaiHang,tenGoi:f.tenGoi,chuoi:f.loaiHang==='NGON'?'KHONG':f.chuoi,ngon:f.loaiHang==='CHUOI'?'KHONG':f.ngon,tip:f.loaiHang==='CHUOI'?'KHONG':f.tip,ren:f.ren,dau:f.dau},function(){ CHForm=null; }); }
function chXoaDong(){ var f=CHForm; if(!confirm(f.them?'Xóa dòng gậy "'+f.ten+'"?':'Bỏ phần đã sửa, trả "'+f.ten+'" về cấu hình gốc?')) return; chLuu({loai:'DONG',ma:f.ma,xoa:true},function(){ CHForm=null; }); }
function chLuuKhuc(L,ma,k,v){ var n=DH.nhan, b={CHUOI:n.chuoi,NGON:n.ngon,TIP:n.tip}[L], vl=L==='CHUOI'?(n.vlChuoi||{})[ma]:L==='NGON'?(n.vlNgon||{})[ma]:'';
  var o={loai:L,ma:ma,ten:(n.them||{})[L+'|'+ma]?b[ma]:'',chatLieu:vl||'',kieu:(n.kieuKhuc||{})[ma]||'',an:!!((n.an||{})[L]||{})[ma]}; o[k]=v; chLuu(o); }
function chThemKhuc(L){ var t=(document.getElementById('chKT')||{}).value||'', vl=(document.getElementById('chKV')||{}).value||'', ki=(document.getElementById('chKK')||{}).value||'';
  chLuu({loai:L,ten:t,chatLieu:vl,kieu:ki},function(){ CHThemK=''; }); }
function chBangKhuc(L,bang,ten){
  var n=DH.nhan, t=n[bang]||{}, them=n.them||{}, an=(n.an||{})[L]||{}, vlM=L==='CHUOI'?n.vlChuoi:L==='NGON'?n.vlNgon:null, dung={};
  DH.don.forEach(function(o){ var p=o.pl||{}; if(o.thieu>0) dung[p[bang]]=(dung[p[bang]]||0)+o.thieu; });
  var ks=Object.keys(t).filter(function(k){return k!=='KHONG'}).sort(function(a,b){ return vlM?(dhThuVl((vlM||{})[a])-dhThuVl((vlM||{})[b]))||String(t[a]).localeCompare(String(t[b])):String(t[a]).localeCompare(String(t[b])); });
  var sel=function(ma,k,ds,v){ return '<select aria-label="'+k+' của '+esc(t[ma])+'" data-l="'+L+'" data-m="'+esc(ma)+'" onchange="chLuuKhuc(this.dataset.l,this.dataset.m,\''+k+'\',this.value)">'+ds.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===(v||'')?' selected':'')+'>'+x[1]+'</option>'}).join('')+'</select>'; };
  var h='<div class="card"><div style="font-weight:600;margin-bottom:6px">'+ten+'</div><div class="tw"><table class="dh-bang ch-k"><thead><tr><th>Tên</th>'+(vlM?'<th>Chất liệu</th><th>Kiểu</th>':'')+'<th class="qt-so">Còn thiếu</th><th>Ẩn</th><th></th></tr></thead><tbody>'+
    ks.map(function(k){ var v=vlM?vlM[k]:''; return '<tr'+(an[k]?' class="ch-an"':'')+'><td>'+esc(t[k])+(them[L+'|'+k]?' <span class="qt-tag mo">tự thêm</span>':'')+'</td>'+
      (vlM?'<td>'+sel(k,'chatLieu',[['','– chưa rõ –'],['FC','Full carbon'],['MIX','Mix carbon+GF'],['GF','Glassfiber']],v)+(v?'':' <span class="dh-vl KHAC">Chưa rõ</span>')+'</td><td>'+sel(k,'kieu',[['','Đánh (theo tên)'],['NHAY','Nhảy'],['PHA','Phá'],['PHANHAY','Phá nhảy']],(n.kieuKhuc||{})[k])+'</td>':'')+
      '<td class="qt-so">'+(dung[k]?qtSo(dung[k],0):'–')+'</td><td><input type="checkbox" aria-label="Ẩn khỏi ô chọn" data-l="'+L+'" data-m="'+esc(k)+'"'+(an[k]?' checked':'')+' onchange="chLuuKhuc(this.dataset.l,this.dataset.m,\'an\',this.checked)"></td>'+
      '<td>'+(them[L+'|'+k]?'<button class="btn sm dg" type="button" data-l="'+L+'" data-m="'+esc(k)+'" onclick="if(confirm(\'Xóa loại này?\'))chLuu({loai:this.dataset.l,ma:this.dataset.m,xoa:true})">Xóa</button>':'')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  if(CHThemK===L) h+='<div class="dh-sua"><div><label for="chKT">Tên loại mới</label><input id="chKT" maxlength="80"></div>'+(vlM?'<div><label for="chKV">Chất liệu</label><select id="chKV"><option value="FC">Full carbon</option><option value="MIX">Mix carbon+GF</option><option value="GF">Glassfiber</option></select></div><div><label for="chKK">Kiểu</label><select id="chKK"><option value="">Đánh</option><option value="NHAY">Nhảy</option><option value="PHA">Phá</option><option value="PHANHAY">Phá nhảy</option></select></div>':'')+'</div><button class="btn sm" type="button" onclick="chThemKhuc(\''+L+'\')">Lưu loại mới</button> <button class="btn sm" type="button" onclick="CHThemK=\'\';dhVeLai()">Hủy</button>';
  else h+='<button class="btn sm" type="button" onclick="CHThemK=\''+L+'\';dhVeLai()">+ Thêm '+ten.toLowerCase().replace(/^loại /,'loại ')+'</button>';
  return h+'</div>';
}
function dhVeCauHinh(){
  var moi=chMoi(), h='';
  h+='<div class="card"><div style="font-weight:600;margin-bottom:4px">Sản phẩm mới chưa có cấu hình · '+moi.length+' tên</div><div style="font-size:12.5px;color:var(--ink2);margin-bottom:8px">Tên hàng trong Sheet đơn (còn thiếu) mà web chưa nhận ra dòng gậy – đang tạm tính là gậy đánh, chất liệu chưa rõ. Cách nhanh: <b>Tạo dòng gậy mới</b> (mọi tên cùng dòng tự nhận), hoặc <b>Sửa riêng tên này</b> nếu chỉ là hàng lẻ.</div>';
  h+=moi.length?'<div class="tw"><table class="dh-bang"><thead><tr><th>Tên hàng</th><th class="qt-so">Còn thiếu</th><th></th></tr></thead><tbody>'+moi.map(function(x){ return '<tr><td>'+esc(x.ten)+'</td><td class="qt-so">'+qtSo(x.thieu,0)+'</td><td style="white-space:nowrap"><button class="btn sm" type="button" data-t="'+esc(x.ten)+'" onclick="chMoForm(\'\',this.dataset.t)">Tạo dòng gậy mới</button> <button class="btn sm" type="button" data-t="'+esc(x.ten)+'" onclick="DHV=\'kiem\';DHChiCC=true;DHMo=\'k|\'+this.dataset.t;dhVeLai()">Sửa riêng tên này</button></td></tr>'; }).join('')+'</tbody></table></div>':'<div class="pdesc">✓ Mọi tên hàng đang có đơn đều đã có cấu hình.</div>';
  h+='</div>';
  if(CHForm) h+=chFormHTML();
  // dòng gậy theo loại hàng
  var dd=(DH.nhan.dongDu||[]).filter(function(d){return d.loai==='GAY'||d.loai==='NGON'||d.loai==='CHUOI'}), dem={};
  DH.don.forEach(function(o){ var p=o.pl||{}; if(o.thieu>0&&p.dong) dem[p.dong]=(dem[p.dong]||0)+o.thieu; });
  h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px"><b>Dòng gậy ('+dd.length+')</b><button class="btn sm" type="button" onclick="chMoForm(\'\',\'\')">+ Thêm dòng gậy</button></div><div class="tw"><table class="dh-bang ch-d"><thead><tr><th>Dòng gậy</th><th>Chữ nhận diện</th><th>Chuôi</th><th>Ngọn</th><th>Tip · ren · đầu</th><th class="qt-so">Còn thiếu</th><th></th></tr></thead><tbody>';
  [['GAY','Gậy 2 khúc'],['NGON','Ngọn bán lẻ'],['CHUOI','Chuôi bán lẻ']].forEach(function(g){
    var a=dd.filter(function(d){return d.loai===g[0]}).sort(function(x,y){ return (dhThuVl(chVlTen('ngon',x.ngon))-dhThuVl(chVlTen('ngon',y.ngon)))||String(x.ten).localeCompare(String(y.ten)); });
    if(!a.length) return;
    h+='<tr class="dh-khoi"><td colspan="5">'+g[1]+' · '+a.length+' dòng</td><td class="qt-so">'+qtSo(a.reduce(function(s,d){return s+(dem[d.ma]||0)},0),0)+'</td><td></td></tr>';
    a.forEach(function(d){ var c=d.chuoi&&d.chuoi!=='KHONG', n=d.ngon&&d.ngon!=='KHONG';
      h+='<tr><td>'+esc(d.ten)+(d.them?' <span class="qt-tag mo">tự thêm</span>':'')+'</td><td style="font-size:12px;color:var(--ink2)">'+esc(d.goi.slice(0,4).join(', '))+(d.goi.length>4?'…':'')+'</td>'+
        '<td>'+(c?esc(dhTen('chuoi',d.chuoi))+dhVlChip(chVlTen('chuoi',d.chuoi)):'–')+'</td><td>'+(n?esc(dhTen('ngon',d.ngon))+dhVlChip(chVlTen('ngon',d.ngon)):'–')+'</td>'+
        '<td style="font-size:12.5px">'+[d.tip&&d.tip!=='KHONG'?dhTen('tip',d.tip):'',d.ren?dhTen('ren',d.ren):'',d.dau].filter(Boolean).map(esc).join(' · ')+'</td><td class="qt-so">'+(dem[d.ma]?qtSo(dem[d.ma],0):'–')+'</td>'+
        '<td><button class="btn sm" type="button" data-m="'+esc(d.ma)+'" onclick="chMoForm(this.dataset.m)">Sửa</button></td></tr>'; });
  });
  h+='</tbody></table></div></div>';
  h+=chBangKhuc('CHUOI','chuoi','Loại chuôi')+chBangKhuc('NGON','ngon','Loại ngọn')+chBangKhuc('TIP','tip','Loại tip');
  h+='<div style="font-size:12px;color:var(--ink3)">Chất liệu / kiểu đổi ở đây áp ngay cho mọi sản phẩm dùng loại đó (nhãn Chuôi / Ngọn, Việc theo xưởng, Thống kê). Loại đã có đơn chỉ ẩn được khỏi ô chọn, không xóa. Cấu hình lưu ở sheet CauHinhSP trong file KPI (không sửa Sheet đơn hàng).</div>';
  return h;
}
window.__qtDaNap=true;
</script>
